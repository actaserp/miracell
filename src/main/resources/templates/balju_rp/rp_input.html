                    }
                });
                new FlexGridContextMenu(this.scanResultGrid);
                this.scanResultGrid.downloadFileName = '스캐너 입고 내역';

                // 그리드 높이 360px 고정이면 태블릿에서 콘텐츠가 뷰포트를 넘겨
                // 스크롤이 생기고 최상단 구매처 행이 잘린다. 남는 높이에 맞춘다.
                const fitScanGrid = function () {
                    if (!TabletUtil.isTablet()) return;
                    // 타이틀바 + 상단 폼 + 스캔줄 + 푸터 = 약 360px
                    const h = Math.max(180, Math.floor(window.innerHeight * 0.92) - 360);
                    $content.find('#scan-result-grid').css('height', h + 'px');
                    if (_this.scanResultGrid) _this.scanResultGrid.invalidate(true);
                };
                fitScanGrid();
                $(window).on('resize.scanpop orientationchange.scanpop', fitScanGrid);

                // 구매처 검색
                $content.find('#btnScanCompanySearch').click(function () {
                    let poppage = new PopCompComponent();
                    let searchcallback = function (items) {
                        $content.find('#scanCompany').val(items.id);
                        $content.find('#scanCompanyName').val(items.compname);
                        $content.find('#scanBarcode').focus();
                    };
                    poppage.show(searchcallback);
                });

                // 초기화 버튼
                $content.find('#btnScanClear').on('click', function () {
                    _this.scanResultGrid.itemsSource = new wijmo.collections.CollectionView([]);
                    _this.updateScanSummary($content);
                    $content.find('#camList').empty();      // 카메라 스캔 기록도 같이 비운다
                    $content.find('#scanBarcode').val('').focus();
                });

                // 헤더 유효기간 → 값이 비어있는 행에만 일괄 적용 (바코드값 채워진 행은 보존)
                $content.find('#btnApplyExp').on('click', function () {
                    const v = $content.find('#scanHeaderExp').val();
                    if (!v) {
                        Alert.alert('', '기본 유효기간을 먼저 입력하세요.');
                        return;
                    }
                    const cv = _this.scanResultGrid.itemsSource;
                    cv.items.forEach(it => {
                        if (!it.effectiveDate) it.effectiveDate = v;
                    });
                    cv.refresh();
                    $content.find('#scanBarcode').focus();
                });

                // 수량 수동 수정 시 합계 갱신
                this.scanResultGrid.cellEditEnded.addHandler(function () {
                    _this.updateScanSummary($content);
                });

                const $scan = $content.find('#scanBarcode');

                $scan.attr('lang', 'en')
                .attr('autocapitalize', 'off')
                .attr('autocorrect', 'off')
                .attr('spellcheck', 'false')
                .css('ime-mode', 'disabled')
                .on('compositionstart', function (e) {
                    e.preventDefault();
                });

                // ── 태블릿 전용 : DS2278(HID 키보드) 입력은 받되 소프트 키보드는 숨긴다 ──
                if (TabletUtil.isTablet()) {
                    // readonly 는 스캐너 입력까지 막히므로 쓰지 않는다.
                    // inputmode=none → 화면 키보드만 숨김, 물리 키 입력은 정상 수신
                    $scan.attr('inputmode', 'none');

                    // 수동 입력이 필요할 때를 위한 토글 버튼
                    $content.find('#btnScanClear').before(
                        '<button type="button" class="btn" id="btnToggleKeypad">키패드</button>'
                    );
                    $content.on('click', '#btnToggleKeypad', function () {
                        const on = $scan.attr('inputmode') === 'none';
                        $scan.attr('inputmode', on ? 'text' : 'none').blur().focus();
                        $(this).text(on ? '키패드 끄기' : '키패드');
                    });

                    // 빈 곳 터치로 포커스가 풀려 스캔이 유실되는 것 방지
                    $content.on('touchend', function (e) {
                        if ($(e.target).closest('input, select, textarea, button, a, .wj-cell').length) return;
                        setTimeout(function () {
                            $scan.focus();
                        }, 0);
                    });
                }

                $content.find('#scanBarcode').on('keydown', function (e) {
                    if (e.key !== 'Enter' && e.keyCode !== 13) return;
                    e.preventDefault();
                    const raw = $(this).val().trim();
                    $(this).val('');
                    if (!raw) return;
                    /* ★ 두 종류가 같은 칸으로 들어온다.
                         PO…  발주 바코드 → 그 발주의 미입고 라인을 목록에 올린다
                         그 외 제품 바코드 → 올라온 라인 중 어느 것이 실제로 왔는지 확정한다
                       발주만으로는 「올 예정」까지만 알 수 있다. 실물 확인은 제품 스캔이 한다. */
                    if (/^PO/i.test(raw)) _this.handlePoScan(raw, $content);
                    else _this.handleItemScan(raw, $content);
                });

                /* ── 카메라 스캔 ────────────────────────────────────────────
                   세척 공정 화면(prod_process_wash_t)의 연속 스캔을 그대로 가져왔다.
                   ★ 확인 버튼이 없다. 비추면 바로 처리된다 —
                     현장에 "받을 때 다 찍으세요" 라고 말할 수 있으려면 이래야 한다.
                   ★ 인식값은 스캐너 칸과 같은 분기(PO / 제품)를 탄다. */
                this.cam = {
                    stream: null, det: null, timer: null, busy: false,
                    last: '', lastAt: 0, paused: false, pausedAt: 0
                };

                $content.find('#btnCamScan').on('click', function () {
                    if (_this.cam && _this.cam.stream) _this.closeCamScan($content);
                    else _this.openCamScan($content);
                });
                $content.find('#btnCamClose').on('click', function () {
                    _this.closeCamScan($content);
                });
                $content.find('#btnCamLogClear').on('click', function () {
                    $content.find('#camList').empty();
                });

                // ★ 입고 저장
                $content.find('#btnScanSave').on('click', function () {
                    const items = _this.scanResultGrid.itemsSource.items;
                    const storeHouseId = $content.find('#scanStoreHouse').val();

                    if (!items || items.length === 0) {
                        Alert.alert('', '스캔된 발주 품목이 없습니다.');
                        return;
                    }
                    if (!storeHouseId) {
                        Alert.alert('', '입고창고를 선택하세요.');
                        return;
                    }

                    /* ★ 확정된 줄만 저장한다.
                         발주 라인은 「올 예정」일 뿐이고, 실제로 온 것은 제품 스캔이 확정한다.
                         수량 0 인 줄(=안 찍은 줄)은 저장 대상에서 제외한다 —
                         예전엔 전량 프리필이라 안 온 품목까지 그대로 입고됐다. */
                    const targets = items.filter(it => Number(it.inputQty) > 0);
                    if (targets.length === 0) {
                        Alert.alert('', '확정된 품목이 없습니다. 실물 바코드를 스캔하세요.');
                        return;
                    }
                    if (targets.length < items.length) {
                        const skipped = items.length - targets.length;
                        if (!confirm(skipped + '개 품목은 스캔되지 않아 제외됩니다. 계속할까요?')) return;
                    }

                    for (const it of targets) {
                        if (Number(it.inputQty) > Number(it.remainQty)) {
                            Alert.alert('', `미입고수량(${it.remainQty})을 초과했습니다. (${it.materialName})`);
                            return;
                        }
                        if (!it.effectiveDate || !/^\d{4}-\d{2}-\d{2}$/.test(it.effectiveDate)) {
                            Alert.alert('', `유효기간을 YYYY-MM-DD로 입력하세요. (${it.materialName})`);
                            return;
                        }
                    }

                    const payload = {
                        store_house_id: storeHouseId,                      // 라인에 창고 없을 때 fallback
                        spjangcd: sessionStorage.getItem('spjangcd') || '',
                        lines: targets.map(it => ({
                            bh_id: it.bh_id,
                            balju_id: it.balju_id,                     // 발주 라인 PK (입고수량 누적용)
                            Material_id: it.Material_id,
                            Company_id: it.Company_id,     // lotSaveByPo 가 mat_inout.Company_id 에 넣는다
                            StoreHouse_id: it.StoreHouse_id || storeHouseId,
                            InputQty: Number(it.inputQty),
                            LotNumber: it.lotNumber || '',             // 빈칸이면 서버 자동채번
                            MakerLotNo: it.makerLotNo || '',           // 제조사 로트(바코드 (10))
                            EffectiveDate: it.effectiveDate,
                            Description: ''
                        }))
                    };

                    Alert.confirm('', `${targets.length}건을 입고 처리하시겠습니까?`, function () {
                        AjaxUtil.postJsonAsyncData(_this.url + '/lot_save_by_po', payload, function (res) {
                            if (!res.success) {
                                Alert.alert('', res.message || '저장 중 오류가 발생했습니다.');
                            } else {
                                Notify.success('입고 처리되었습니다.');
                                page.searchDataBind();
                                _this.scanResultGrid.itemsSource = new wijmo.collections.CollectionView([]);
                                _this.updateScanSummary($content);
                                $content.find('#scanBarcode').focus();
                            }
                        });
                    });
                });

                // 선택 행 삭제
                $content.find('#btnScanRowDelete').on('click', function () {
                    let cv = _this.scanResultGrid.itemsSource;
                    let selected = _this.scanResultGrid.rows
                    .filter(r => r.isSelected)
                    .map(r => r.dataItem);
                    if (selected.length === 0) {
                        Alert.alert('', '삭제할 행을 선택하세요.');
                        return;
                    }
                    selected.forEach(item => cv.remove(item));
                    _this.updateScanSummary($content);
                    $content.find('#scanBarcode').focus();
                });

                // 닫기 시 그리드 참조 · 리사이즈 핸들러 정리
                $content.find('#modal-close-button').on('click', function () {
                    $(window).off('resize.scanpop orientationchange.scanpop');
                    _this.closeCamScan($content);   // ★ 카메라를 끄지 않으면 렌즈가 계속 켜져 있다
                    _this.scanResultGrid = null;
                });

                // 팝업 열리면 스캔 입력창에 포커스
                setTimeout(function () {
                    $content.find('#scanBarcode').focus();
                }, 100);
            }

            /* ══════════════════════════════════════════════════════════
               카메라 바코드 스캔
               ────────────────────────────────────────────────────────
               ★ 스캐너 칸(#scanBarcode)과 «같은 함수»를 호출한다.
                 카메라용 처리를 따로 만들면 미입고 초과 검사·제조사로트
                 반영 같은 규칙이 두 곳에 생겨 한쪽만 고치게 된다.
               ★ 결과는 콜백으로 받아 오른쪽 기록에 초록/빨강으로 쌓는다.
                 카메라를 든 사람은 그리드를 못 보고 있다.
               ★ HTTPS(또는 localhost) 에서만 카메라가 열린다.
               ══════════════════════════════════════════════════════════ */
            async openCamScan($content) {
                const _this = this;
                if (!this.cam) this.cam = {
                    stream: null, det: null, timer: null, busy: false,
                    last: '', lastAt: 0, paused: false, pausedAt: 0
                };

                $content.find('#camScanBox').show();
                $content.find('#camWrap').show();
                $content.find('#btnCamScan').text('카메라 끄기');
                this.camMsg($content, '카메라 준비 중…');

                if (!('BarcodeDetector' in window)) {
                    $content.find('#camWrap').hide();
                    this.camLog($content, false, '이 브라우저는 카메라 인식을 지원하지 않습니다',
                        '스캐너 칸에 직접 입력하세요 (Chrome/Edge 안드로이드 권장)');
                    return;
                }

                try {
                    /* 지원하지 않는 포맷을 넘기면 생성자가 던진다 — 기본 생성으로 물러난다 */
                    try {
                        this.cam.det = new window.BarcodeDetector({
                            formats: ['code_128', 'code_39', 'ean_13', 'ean_8', 'qr_code', 'data_matrix', 'itf']
                        });
                    } catch (e) {
                        this.cam.det = new window.BarcodeDetector();
                    }

                    this.cam.stream = await navigator.mediaDevices.getUserMedia({
                        video: {facingMode: 'environment', width: {ideal: 1280}}
                    });
                    const v = $content.find('#camVideo')[0];
                    v.srcObject = this.cam.stream;
                    await v.play();
                    this.camMsg($content, '바코드를 비추세요');
                    this.camScanLoop($content);
                } catch (e) {
                    console.error('[camscan]', e);
                    this.camMsg($content, '카메라를 열 수 없습니다');
                    this.camLog($content, false, '카메라를 열 수 없습니다',
                        'HTTPS 접속 여부와 카메라 권한을 확인하세요');
                }
            }

            camScanLoop($content) {
                const _this = this;
                if (!this.cam) return;
                clearTimeout(this.cam.timer);
                this.cam.timer = setTimeout(async function () {
                    const v = $content.find('#camVideo')[0];
                    /* 팝업이 통째로 닫히면 video 가 문서에서 빠진다.
                       그 경로(팝업 X 버튼)로도 카메라가 꺼지도록 여기서 잡는다. */
                    if (!v || !document.body.contains(v) || !_this.cam || !_this.cam.stream) {
                        _this.closeCamScan($content);
                        return;
                    }
                    /* 등록 모달이 열려 있는 동안은 읽지 않는다.
                       닫혔는지는 모달 안의 #regMatSel 이 사라진 것으로 판별한다.
                       (Alert.confirm 은 취소 콜백이 없어 이 방법뿐이다)
                       바로 뒤 프레임에서 모달이 아직 안 그려졌을 수 있어 600ms 는 기다린다. */
                    if (_this.cam.paused) {
                        if (Date.now() - (_this.cam.pausedAt || 0) > 600
                            && !document.getElementById('regMatSel')) {
                            _this.cam.paused = false;
                            _this.cam.last = '';   // 같은 바코드를 다시 읽을 수 있게 푼다
                            _this.camMsg($content, '바코드를 비추세요');
                        }
                        _this.camScanLoop($content);
                        return;
                    }

                    if (!_this.cam.busy && _this.cam.det) {
                        _this.cam.busy = true;
                        try {
                            const found = await _this.cam.det.detect(v);
                            if (found && found.length) {
                                const code = found[0].rawValue || '';
                                const now = Date.now();
                                /* 같은 값이 연속으로 잡힌다 — 2.5초는 무시한다 */
                                if (code && !(code === _this.cam.last && now - _this.cam.lastAt < 2500)) {
                                    _this.cam.last = code;
                                    _this.cam.lastAt = now;
                                    const $f = $content.find('#camFrame');
                                    $f.addClass('hit');
                                    setTimeout(function () {
                                        $f.removeClass('hit');
                                    }, 350);
                                    _this.camHit(code, $content);
                                }
                            }
                        } catch (e) { /* 프레임 실패는 무시하고 다음 프레임 */
                        }
                        _this.cam.busy = false;
                    }
                    _this.camScanLoop($content);
                }, 220);
            }

            /* 인식 1건 → 스캐너 칸과 동일 분기 */
            camHit(raw, $content) {
                const _this = this;
                const code = String(raw || '').trim();
                if (!code) return;

                const done = function (ok, msg) {
                    _this.camBeep(ok);
                    _this.camLog($content, ok, msg || (ok ? '처리됨' : '실패'), code);
                    _this.camMsg($content, msg || '');
                };

                /* PO… 발주 바코드 → 미입고 라인을 목록에 올린다
                   그 외 제품 바코드 → 올라온 라인 중 실제로 온 것을 확정한다 */
                if (/^PO/i.test(code)) this.handlePoScan(code, $content, done);
                else this.handleItemScan(code, $content, done);
            }

            closeCamScan($content) {
                if (!this.cam) return;
                clearTimeout(this.cam.timer);
                this.cam.timer = null;
                if (this.cam.stream) {
                    this.cam.stream.getTracks().forEach(function (t) {
                        t.stop();
                    });
                    this.cam.stream = null;
                }
                this.cam.det = null;
                this.cam.busy = false;
                this.cam.last = '';
                this.cam.paused = false;
                this.cam.pausedAt = 0;
                if ($content && $content.length) {
                    const v = $content.find('#camVideo')[0];
                    if (v) v.srcObject = null;
                    $content.find('#camScanBox').hide();
                    $content.find('#btnCamScan').text('📷 카메라 스캔');
                    $content.find('#scanBarcode').focus();
                }
            }

            camMsg($content, t) {
                $content.find('#camMsg').text(t || '');
            }

            /* 최신 것이 위로. 30줄까지만 남긴다 — 길어지면 스크롤만 늘어난다 */
            camLog($content, ok, title, sub) {
                const esc = function (v) {
                    return $('<div>').text(v == null ? '' : String(v)).html();
                };
                const $list = $content.find('#camList');
                $list.prepend(
                    '<div class="camrow ' + (ok ? 'ok' : 'err') + '"><div class="cm-t">'
                    + '<div class="cm-n">' + esc(title) + '</div>'
                    + '<div class="cm-c">' + esc(sub) + '</div></div></div>'
                );
                const $rows = $list.children('.camrow');
                if ($rows.length > 30) $rows.slice(30).remove();
            }

            /* 소리·진동은 있으면 좋고 없어도 그만 — 실패해도 스캔을 막지 않는다 */
            camBeep(ok) {
                try {
                    if (navigator.vibrate) navigator.vibrate(ok ? 40 : [60, 50, 60]);
                    const A = window.AudioContext || window.webkitAudioContext;
                    if (!A) return;
                    const ac = new A(), o = ac.createOscillator(), g = ac.createGain();
                    o.connect(g);
                    g.connect(ac.destination);
                    o.frequency.value = ok ? 1180 : 380;
                    g.gain.value = 0.07;
                    o.start();
                    setTimeout(function () {
                        o.stop();
                        ac.close();
                    }, ok ? 90 : 200);
                } catch (e) { /* noop */
                }
            }

            updateScanSummary($content) {
                if (!this.scanResultGrid) return;
                let items = this.scanResultGrid.itemsSource.items;
                let totalQty = items.reduce((sum, it) => sum + (Number(it.qty) || 0), 0);
                $content.find('#scanRowCount').text(items.length);
                $content.find('#scanTotalQty').text(totalQty.toLocaleString());
            }

            // EAN-13 체크디지트 검증 (mod-10)
            isValidEan13(s) {
                if (!/^\d{13}$/.test(s)) return false;
                let sum = 0;
                for (let i = 0; i < 12; i++) {
                    sum += parseInt(s[i], 10) * (i % 2 === 0 ? 1 : 3);
                }
                const check = (10 - (sum % 10)) % 10;
                return check === parseInt(s[12], 10);
            }

            // PO 바코드 스캔 → 발주 라인 로드
            /**
             * 제품 바코드 스캔 — 발주 라인 중 실제로 들어온 것을 확정한다.
             *
             * 해석 순서는 서버(scan_lookup)가 정한다.
             *   ① GTIN → ② UDI-DI → ③ 자사 품목코드 → ④ 로트번호 역추적
             * 어디에도 안 걸리면 미등록 — 그 자리에서 발주 라인에 연결해 등록한다.
             */
            handleItemScan(raw, $content, cb) {
                const _this = this;
                const cv = _this.scanResultGrid.itemsSource;

                /* cb 는 카메라 스캔이 넘긴다. 있으면 결과를 그쪽 기록으로 돌려주고,
                   없으면 지금까지처럼 토스트로만 알린다. */
                const fail = function (msg, level) {
                    if (cb) cb(false, msg);
                    else if (level === 'error') Notify.error(msg);
                    else Notify.warn(msg);
                    $content.find('#scanBarcode').focus();
                };

                if (!cv.sourceCollection.length) {
                    fail('먼저 발주 바코드를 스캔하세요.');
                    return;
                }

                const parsed = _this.parseScannedBarcode(raw) || {};

                AjaxUtil.getAsyncData(_this.url + '/scan_lookup', {
                    gtin14: parsed.gtin14 || '',
                    di: parsed.di || '',
                    lot: parsed.lot || '',
                    raw: raw,
                    barcode_type: parsed.standard || '',
                    spjangcd: sessionStorage.getItem('spjangcd') || ''
                }, function (res) {
                    const d = res && res.data;
                    if (!d) {
                        /* 미등록 바코드 — 카메라로 찍었든 스캐너로 찍었든 그 자리에서 등록한다.
                           카메라는 askBarcodeRegister 가 «멈춰 세운다» (§camScanLoop).
                           모달이 떠 있는 동안에도 프레임은 계속 잡히므로, 멈추지 않으면
                           뒤에서 읽힌 다른 값이 방금 고른 품목에 붙는다. */
                        _this.askBarcodeRegister(raw, parsed, $content, cb);
                        return;
                    }

                    const line = cv.sourceCollection.find(it =>
                        String(it.Material_id) === String(d.material_id));
                    if (!line) {
                        fail('발주에 없는 품목입니다 · ' + (d.material_name || ''), 'error');
                        return;
                    }

                    /* ★ 수량은 «발주 미입고수량» 을 기본으로 채운다.
                         예전에는 1스캔 = pack_qty 로 «누적» 했다. 33개들이 3박스면
                         세 번 찍어야 99가 되는데, 실제로는 박스마다 로트가 같아
                         나눠 세는 의미가 없으면서 손만 세 번 갔다.
                         더구나 자체 출력 바코드는 GS1 이 아니라 pack_qty 가 1 이어서
                         99개짜리 로트를 찍어도 1개로 잡혔다.

                         이제 첫 스캔에서 미입고수량을 통째로 채우고, 다르면 사람이 고친다.
                         그리드의 «입고수량» 칸은 편집 가능하다.
                       ★ 두 번째 스캔부터는 수량을 건드리지 않는다 —
                         사람이 고쳐 둔 값을 스캔 한 번에 되돌려 놓으면 안 된다. */
                    const remain = Number(line.remainQty) || 0;
                    if (!line.confirmed) {
                        line.inputQty = remain;                       // 발주 잔량이 기본값
                        line.statusText = '확인 ' + remain + '/' + remain + ' (수정 가능)';
                    } else {
                        /* 이미 확정된 줄을 다시 찍었다 — 수량은 그대로 두고 재확인만 알린다.
                           박스를 여러 번 찍는 현장 습관을 수량 오류로 만들지 않는다. */
                        const cur = Number(line.inputQty) || 0;
                        line.statusText = '재확인 ' + cur + '/' + remain;
                    }
                    line.confirmed = true;

                    /* ★ 바코드에 (10) 로트가 있으면 «그 번호를 그대로» 사내 로트로 쓴다.
                         없을 때만 서버가 자체 번호(LI-…)를 발번한다.

                         원래는 사내/외부를 나눠 두 칸에 담았는데, 실물에 붙어 있는 것은
                         매입처 번호 하나뿐이라 현장에서 «화면의 LI-… 번호» 로는 물건을
                         찾을 수 없었다. 실물에 있는 번호를 그대로 쓰는 편이 추적이 산다.
                       ★ MakerLotNo 에도 같은 값을 남긴다 — 이 번호가 «외부에서 온 것» 이라는
                         사실은 따로 알아야 한다(자체 발번과 구분). */
                    if (parsed.lot) {
                        if (!line.makerLotNo) line.makerLotNo = parsed.lot;
                        if (!line.lotNumber)  line.lotNumber  = parsed.lot;
                    }
                    /* ★ 유효기간은 «라벨의 (17)» 이 먼저다.
                         예전에는 서버가 준 effective_date 만 썼는데, 그 값은
                         품목의 ValidDays 로 계산한 «우리 추정치» 다.
                         매입처가 정한 기간이 라벨에 찍혀 있는데 그걸 버리고
                         우리 계산을 쓰면 실물과 시스템이 어긋난다 —
                         (17)281231 라벨을 찍었는데 2026-08-17 이 들어갔다.
                       ★ 라벨에 (17)이 없을 때만(EAN-13 등) 서버 값으로 떨어진다. */
                    const labelExp = parsed && parsed.expDate ? parsed.expDate : '';
                    if (labelExp) {
                        line.effectiveDate = labelExp;          // 라벨 값이 최우선 — 덮어쓴다
                    } else if (d.effective_date && !line.effectiveDate) {
                        line.effectiveDate = d.effective_date;
                    }

                    cv.refresh();
                    _this.updateScanSummary($content);
                    /* ★ next 는 예전 «pack_qty 누적» 시절의 변수였다.
                         수량 기본값을 발주 잔량으로 바꾸면서 그 변수가 사라졌는데
                         이 줄만 남아 있었다 — 카메라 경로(cb 있음)에서만 도는 줄이라
                         스캐너로 찍을 때는 멀쩡하고 카메라로 찍을 때만 ReferenceError 가 났다. */
                    if (cb) cb(true, line.materialName + ' · ' + (Number(line.inputQty) || 0)
                        + '/' + line.remainQty);
                    $content.find('#scanBarcode').focus();
                });
            }

            /**
             * 미등록 바코드를 발주 라인에 연결한다.
             *
             * ★ 후보를 발주 라인으로 좁힌다. 전체 품목에서 고르게 하면 잘못 붙기 쉽고,
             *   첫 연결이 틀리면 그 뒤로는 스캔이 자동이라 조용히 계속 틀린다.
             * ★ 품목당 바코드는 1건이다. 이미 있으면 서버가 갈아끼운다.
             */
            askBarcodeRegister(raw, parsed, $content, cb) {
                const _this = this;
                const cv = _this.scanResultGrid.itemsSource;
                const lines = cv.sourceCollection;

                /* ★ 카메라가 돌고 있으면 멈춰 세운다.
                     모달이 떠 있어도 프레임은 계속 잡힌다. 그대로 두면 등록 창에서
                     품목을 고르는 사이에 렌즈에 들어온 «다른» 라벨이 읽혀,
                     방금 고른 품목에 엉뚱한 바코드가 붙는다. 첫 연결이 틀리면
                     그 뒤로는 스캔이 자동이라 조용히 계속 틀린다.
                   ★ 다시 켜는 시점은 camScanLoop 가 «모달이 사라졌는지»로 판단한다 —
                     Alert.confirm 은 취소 콜백을 주지 않아서 여기서 풀 수가 없다. */
                if (_this.cam && _this.cam.stream) {
                    _this.cam.paused = true;
                    _this.cam.pausedAt = Date.now();
                    _this.camBeep(false);
                    _this.camMsg($content, '미등록 바코드 — 등록하는 동안 스캔을 멈춥니다');
                    _this.camLog($content, false, '미등록 바코드 · 등록 창을 엽니다', raw);
                }

                let html = '<div style="padding:8px 4px">'
                    + '<div style="margin-bottom:8px">미등록 바코드입니다 · <b>' + raw + '</b></div>'
                    + '<div style="margin-bottom:6px">어느 품목입니까?</div>'
                    + '<select id="regMatSel" class="form-control2" style="width:100%">';
                lines.forEach(function (it) {
                    html += '<option value="' + it.Material_id + '">'
                        + it.materialCode + ' · ' + it.materialName + '</option>';
                });
                html += '</select>'
                    + '<div style="margin-top:10px">이 바코드 1개는 몇 개입니까?</div>'
                    + '<input id="regPackQty" type="number" min="1" value="1" class="form-control2" style="width:120px">'
                    + '<div style="font-size:12px;color:#888;margin-top:4px">'
                    + '낱개면 1, 인박스면 입수량을 넣으세요</div></div>';

                Alert.confirm('바코드 등록', html, function () {
                    const matId = Number($('#regMatSel').val());
                    const qty = Number($('#regPackQty').val()) || 1;
                    AjaxUtil.postAsyncData(_this.url + '/barcode_register', {
                        material_id: matId,
                        gtin: parsed.gtin14 || '',
                        udi_di: (!parsed.gtin14 ? (parsed.di || raw) : ''),
                        barcode_type: parsed.standard || 'CODE',
                        pack_level: (qty > 1 ? 'inbox' : 'each'),
                        pack_qty: qty,
                        spjangcd: sessionStorage.getItem('spjangcd') || ''
                    }, function (r) {
                        if (!r.success) {
                            if (cb) cb(false, r.message || '바코드 등록 실패');
                            else Alert.alert('', r.message || '등록 실패');
                            return;
                        }
                        if (cb) {
                            /* ★ 등록했으니 방금 그 바코드를 그대로 다시 태운다.
                                 현장에서 같은 라벨을 두 번 들이대게 하지 않는다.
                                 등록 직후라 이번엔 scan_lookup 에 걸린다. */
                            Notify.success('바코드를 등록했습니다.');
                            if (_this.cam) _this.cam.last = '';
                            _this.handleItemScan(raw, $content, cb);
                            return;
                        }
                        Notify.success('바코드를 등록했습니다. 다시 스캔하세요.');
                        $content.find('#scanBarcode').focus();
                    });
                });
            }

            handlePoScan(raw, $content, cb) {
                const _this = this;

                /* cb 는 카메라 스캔이 넘긴다 (handleItemScan 과 같은 규칙) */
                const fail = function (msg, hard) {
                    if (cb) cb(false, msg);
                    else if (hard) Alert.alert('', msg);
                    else Notify.warn(msg);
                    $content.find('#scanBarcode').focus();
                };

                // 발주 바코드 판별 (발주등록 화면에서 "PO"+bh_id 로 발행)
                if (!/^PO/i.test(raw)) {
                    fail('발주 바코드가 아닙니다. (PO로 시작해야 함)');
                    return;
                }
                /* ★ 바코드에 실리는 값은 «주문번호»(20250701-0011) 다.
                     BaljuOrderController 가 "PO" + JumunNumber 로 발행한다.
                     bh_id(숫자 PK)로 발행한다고 적힌 옛 주석을 믿고 아래 중복 가드를
                     bh_id 와 비교하고 있었는데, 그 조건은 영원히 안 걸린다 —
                     같은 발주를 두 번 찍으면 라인이 두 벌 쌓여 이중입고가 된다.
                     여기서는 주문번호로 1차 방어하고, 진짜 방어는 서버가 돌려준
                     bh_id 로 아래에서 한 번 더 한다(옛 숫자 바코드도 그대로 통과). */
                const baljuNo = raw.replace(/^PO/i, '').trim();

                const cv = _this.scanResultGrid.itemsSource;
                if (cv.sourceCollection.some(it =>
                    String(it.JumunNumber) === baljuNo || String(it.bh_id) === baljuNo)) {
                    fail('이미 불러온 발주입니다.');
                    return;
                }

                AjaxUtil.getAsyncData(_this.url + '/receiving_by_barcode', {
                    barcode: raw,
                    spjangcd: sessionStorage.getItem('spjangcd') || ''
                }, function (res) {
                    if (!res.success) {
                        fail(res.message || '발주를 찾을 수 없습니다.', true);
                        return;
                    }
                    const d = res.data;

                    if (!d.lines || d.lines.length === 0) {
                        fail('입고할 미입고 품목이 없습니다. (이미 전량입고 또는 완료)');
                        return;
                    }
                    // 구매처 자동 표시
                    if (d.company_id) {
                        $content.find('#scanCompany').val(d.company_id);
                        $content.find('#scanCompanyName').val(d.companyName || '');
                    }
                    /* ★ 진짜 중복 방어 — 서버가 풀어 준 PK 로 본다.
                         바코드 값이 주문번호든 bh_id 든 여기서는 한 가지로 모인다. */
                    if (cv.sourceCollection.some(it => String(it.bh_id) === String(d.bh_id))) {
                        fail('이미 불러온 발주입니다.');
                        return;
                    }

                    const before = cv.sourceCollection.length;
                    _this.addPoLines(d, $content);
                    if (cb) {
                        const added = cv.sourceCollection.length - before;
                        cb(true, '발주 ' + (d.baljuNo || d.JumunNumber || raw) + ' · ' + added + '건 불러옴');
                    }
                });
            }

// 발주 라인을 그리드에 추가 (기본 입고수량 = 미입고 전량, 부분입고 가능)
            addPoLines(d, $content) {
                const cv = this.scanResultGrid.itemsSource;
                const headerExp = $content.find('#scanHeaderExp').val() || '';

                (d.lines || []).forEach(line => {
                    const remain = Number(line.remainQty) || 0;
                    if (remain <= 0) return;
                    cv.sourceCollection.push({
                        bh_id: d.bh_id,
                        JumunNumber: d.baljuNo || d.JumunNumber,
                        balju_id: line.balju_id,
                        Material_id: line.Material_id,
                        Company_id: line.Company_id,      // ★ 매입처 — 입고이력에 남긴다
                        materialCode: line.product_code,
                        materialName: line.product_name,
                        unit: line.unit,
                        StoreHouse_id: line.StoreHouse_id,   // 발주 지정 납품창고(없으면 저장 시 헤더 창고)
                        baljuQty: line.baljuQty,
                        receivedQty: line.receivedQty,
                        remainQty: remain,
                        lotNumber: '',                 // 사내 로트 — 비우면 서버 자동채번
                        makerLotNo: '',                // 제조사 로트 — 바코드 (10)
                        effectiveDate: headerExp,            // 기본 유효기간 상속
                        /* ★ 전량 프리필을 하지 않는다.
                             예전엔 미입고 전량이 채워진 채로 떠서, 안 온 품목까지
                             그대로 저장되면 재고가 조용히 부풀려졌다.
                             제품을 찍어 확정한 만큼만 쌓인다. */
                        inputQty: 0,
                        confirmed: false,
                        statusText: '대기'
                    });
                });
                cv.refresh();
                this.updateScanSummary($content);
                $content.find('#scanBarcode').focus();
            }

            // 동일 품목+로트 합산, 아니면 행 추가
            addOrMergeScanRow(row, $content) {
                const cv = this.scanResultGrid.itemsSource;
                const existing = cv.sourceCollection.find(it =>
                    it.status === 'matched' && it.Material_id === row.Material_id
                    && (it.lotNumber || '') === (row.lotNumber || ''));

                if (existing && row.status === 'matched') {
                    existing.qty = (Number(existing.qty) || 0) + (Number(row.qty) || 1);
                } else {
                    cv.sourceCollection.push(row);
                }
                cv.refresh();
                this.updateScanSummary($content);

                if (row.status === 'unmatched' && window.Notify) {
                    Notify.error('미등록 바코드: ' + (row.gtin || row.raw));
                }
                $content.find('#scanBarcode').focus();
            }

            // ── 표준 감지 ───────────────────────────────────────────────
            detectBarcodeStandard(body, aimHint) {
                const GS = String.fromCharCode(29);
                const s = (body || '').replace(new RegExp('^' + GS + '+'), '');
                if (aimHint) {
                    if (aimHint[0] === 'E') return 'EAN13';                 // ]E0
                    if (aimHint === 'C1' || aimHint === 'd2') return 'GS1'; // GS1-128 / GS1 DataMatrix
                }
                const c0 = s[0];
                if (c0 === '+') return 'HIBC';
                if (c0 === '=' || c0 === '&') return 'ISBT128';
                if (/^01\d{14}/.test(s)) return 'GS1';
                if (/^(10|11|17|21|30|37|240|241)/.test(s) && aimHint === 'C1') return 'GS1';
                if (/^\d{13}$/.test(s) && this.isValidEan13(s)) return 'EAN13';
                return 'UNKNOWN';
            }

// ── 진입점 ─────────────────────────────────────────────────
            parseScannedBarcode(raw) {
                let s = (raw || '').trim();
                let aimHint = '';
                const m = s.match(/^\](.[0-9A-Za-z])/);
                if (m) {
                    aimHint = m[1];
                    s = s.substring(3);
                }
                const base = {
                    standard: 'UNKNOWN', di: '', gtin14: '', lot: '', serial: '',
                    mfgDate: '', expDate: '', expConf: 'none', gsMissing: false, raw
                };
                const std = this.detectBarcodeStandard(s, aimHint);
                if (std === 'EAN13') return Object.assign(base, this.parseEan13(s));
                if (std === 'GS1') return Object.assign(base, this.parseGs1(s));
                if (std === 'HIBC') return Object.assign(base, this.parseHibc(s));
                if (std === 'ISBT128') return Object.assign(base, this.parseIsbt128(s));
                return base;
            }

// ── EAN-13 (GTIN만, 유효기간 없음) ─────────────────────────
            parseEan13(s) {
                const gtin14 = '0' + s;
                return {standard: 'EAN13', di: gtin14, gtin14, expConf: 'none'};
            }

// ── GS1-128 / GS1 DataMatrix ───────────────────────────────
            parseGs1(s) {
                const GS = String.fromCharCode(29);
                const fixedLen = {'01': 14, '11': 6, '17': 6, '15': 6, '13': 6};
                const varAi = new Set(['10', '21', '240', '241', '30', '37']);
                const r = {
                    standard: 'GS1_128', gtin14: '', lot: '', serial: '',
                    mfgDate: '', expDate: '', expConf: 'none', gsMissing: false
                };
                let i = 0, sawVarWithoutGs = false, rawExp = '';
                while (i < s.length) {
                    if (s[i] === GS) {
                        i++;
                        continue;
                    }
                    const ai = s.substr(i, 2);
                    if (fixedLen[ai] !== undefined) {
                        const len = fixedLen[ai];
                        const val = s.substr(i + 2, len);
                        i += 2 + len;
                        if (ai === '01') r.gtin14 = val;
                        else if (ai === '11') r.mfgDate = this.gs1Date(val).iso;
                        else if (ai === '17') rawExp = val;
                    } else if (varAi.has(ai)) {
                        let j = s.indexOf(GS, i + 2);
                        if (j === -1) {
                            j = s.length;
                            sawVarWithoutGs = true;
                        }
                        const val = s.substring(i + 2, j);
                        i = j;
                        if (ai === '10') r.lot = val;
                        else if (ai === '21') r.serial = val;
                    } else {
                        break;
                    }
                }
                r.di = r.gtin14;
                r.gsMissing = sawVarWithoutGs;
                if (rawExp) {
                    r.expDate = this.gs1Date(rawExp).iso;
                    r.expConf = r.expDate ? 'high' : 'none';
                }
                return r;
            }

// ── HIBC (HIBCC) ───────────────────────────────────────────
            parseHibc(s) {
                const r = {
                    standard: 'HIBC', di: '', lot: '', serial: '',
                    mfgDate: '', expDate: '', expConf: 'none'
                };
                const slash = s.indexOf('/');
                let primary = slash === -1 ? s : s.substring(0, slash);
                let secondary = slash === -1 ? '' : s.substring(slash + 1);
                if (primary && /^\+\$/.test(primary) && !secondary) {
                    secondary = primary;
                    primary = '';
                }
                r.di = primary.replace(/^\+/, '');
                if (!secondary) return r;
                let sec = secondary.replace(/^\+/, '');

                // 데이터식별자형 (14D=사용기한 YYYYMMDD, 16D=제조일, S=일련번호)
                if (/^(14D|16D|S)/.test(sec)) {
                    sec.split('/').forEach(seg => {
                        if (seg.startsWith('14D')) {
                            r.expDate = this.ymd8(seg.substr(3, 8));
                            r.expConf = r.expDate ? 'high' : 'none';
                        } else if (seg.startsWith('16D')) {
                            r.mfgDate = this.ymd8(seg.substr(3, 8));
                        } else if (seg.startsWith('S')) {
                            r.serial = seg.substr(1);
                        } else if (seg && !r.lot) {
                            r.lot = seg;
                        }
                    });
                    return r;
                }

                // 표준 $ 문법
                let hasSerial = false, body = '';
                if (sec.startsWith('$$+')) {
                    hasSerial = true;
                    const n = sec[3];
                    const skip = /\d/.test(n) ? 4 : 3;
                    body = this._hibcConsumeExp(sec.substring(skip), this._hibcExpFmt(n), r);
                } else if (sec.startsWith('$$')) {
                    const n = sec[2];
                    const skip = /\d/.test(n) ? 3 : 2;
                    body = this._hibcConsumeExp(sec.substring(skip), this._hibcExpFmt(n), r);
                } else if (sec.startsWith('$+')) {
                    hasSerial = true;
                    body = sec.substring(2);
                } else if (sec.startsWith('$')) {
                    body = sec.substring(1);
                } else if (/^\d/.test(sec)) {
                    const iso = this.julian('20' + sec.substr(0, 2), sec.substr(2, 3));
                    if (iso) {
                        r.expDate = iso;
                        r.expConf = 'high';
                    }
                    return r;
                } else {
                    r.lot = sec;
                    return r;
                }

                const data = body.length >= 2 ? body.slice(0, -2) : body; // 링크+검증문자 2자리 제거
                if (hasSerial) r.serial = data; else if (data) r.lot = data;
                return r;
            }

            _hibcExpFmt(n) {
                switch (n) {
                    case '2':
                        return 'MMDDYY';
                    case '3':
                        return 'YYMMDD';
                    case '4':
                        return 'YYMMDDHH';
                    case '5':
                        return 'YYJJJ';
                    case '6':
                        return 'YYJJJHH';
                    case '7':
                        return null;      // 사용기한 없음
                    default:
                        return 'MMYY';    // 숫자 아님 → 기본
                }
            }

            _hibcConsumeExp(str, fmt, r) {
                if (fmt === null) return str;
                const lenMap = {MMYY: 4, MMDDYY: 6, YYMMDD: 6, YYMMDDHH: 8, YYJJJ: 5, YYJJJHH: 7};
                const len = lenMap[fmt];
                const v = str.substr(0, len);
                let iso = '';
                if (fmt === 'MMYY') iso = this.lastDay('20' + v.substr(2, 2), v.substr(0, 2));
                else if (fmt === 'MMDDYY') iso = this.ymd('20' + v.substr(4, 2), v.substr(0, 2), v.substr(2, 2));
                else if (fmt === 'YYMMDD') iso = this.ymd('20' + v.substr(0, 2), v.substr(2, 2), v.substr(4, 2));
                else if (fmt === 'YYMMDDHH') iso = this.ymd('20' + v.substr(0, 2), v.substr(2, 2), v.substr(4, 2));
                else if (fmt === 'YYJJJ') iso = this.julian('20' + v.substr(0, 2), v.substr(2, 3));
                else if (fmt === 'YYJJJHH') iso = this.julian('20' + v.substr(0, 2), v.substr(2, 3));
                if (iso) {
                    r.expDate = iso;
                    r.expConf = 'high';
                }
                return str.substring(len);
            }

// ── ISBT 128 (ICCBBA) ──────────────────────────────────────
            parseIsbt128(s) {
                const r = {
                    standard: 'ISBT128', di: '', lot: '', serial: '',
                    mfgDate: '', expDate: '', expConf: 'none'
                };
                const DI = [
                    ['=/', 16, 'di'], ['=,', 6, 'serial'], ['=>', 6, 'exp'],
                    ['=}', 6, 'mfg'], ['&,1', 18, 'lot'],
                    ['=)', 10, 'di'], ['&)', 10, 'lot'], ['=', 15, 'donor']
                ];
                let i = 0;
                while (i < s.length) {
                    const seg = DI.find(d => s.startsWith(d[0], i));
                    if (!seg) {
                        i++;
                        continue;
                    }
                    const [tag, size, field] = seg;
                    const val = s.substr(i + tag.length, size);
                    i += tag.length + size;
                    if (field === 'di' && !r.di) r.di = val;
                    else if (field === 'lot' && !r.lot) r.lot = val;
                    else if (field === 'serial') r.serial = val;
                    else if (field === 'mfg') r.mfgDate = this._isbtDate(val);
                    else if (field === 'exp') {
                        r.expDate = this._isbtDate(val);
                        r.expConf = r.expDate ? 'low' : 'none'; // 율리우스 연도 해석 불확실 → 검토
                    }
                }
                return r;
            }

            _isbtDate(v) { // 가이드라인 [YYYJJJ] 6자리(율리우스) — 실물 라벨로 검증 전 best-effort
                if (!/^\d{6}$/.test(v)) return '';
                return this.julian('2' + v.substr(0, 3), v.substr(3, 3));
            }

// ── 날짜 유틸 ──────────────────────────────────────────────
            gs1Date(yymmdd) { // AI(17)/(11) YYMMDD, DD='00' → 말일
                if (!/^\d{6}$/.test(yymmdd)) return {iso: ''};
                const y = '20' + yymmdd.substr(0, 2), mm = yymmdd.substr(2, 2), dd = yymmdd.substr(4, 2);
                return {iso: dd === '00' ? this.lastDay(y, mm) : this.ymd(y, mm, dd)};
            }

            ymd8(v) {
                if (!/^\d{8}$/.test(v)) return '';
                return this.ymd(v.substr(0, 4), v.substr(4, 2), v.substr(6, 2));
            }

            ymd(y, m, d) {
                const dt = new Date(Date.UTC(+y, +m - 1, +d));
                return isNaN(dt.getTime()) ? '' : dt.toISOString().slice(0, 10);
            }

            lastDay(y, m) {
                const dt = new Date(Date.UTC(+y, +m, 0));
                return isNaN(dt.getTime()) ? '' : dt.toISOString().slice(0, 10);
            }

            julian(year, jjj) {
                const d = parseInt(jjj, 10);
                if (!(d >= 1 && d <= 366)) return '';
                const dt = new Date(Date.UTC(+year, 0, d));
                return isNaN(dt.getTime()) ? '' : dt.toISOString().slice(0, 10);
            }
        }

                this.grid.itemsSource.sourceCollection = [];  // grid 초기화
                let copyText = $content.find("#txtCopyText").val();
                let line = copyText.split('\n');
                for (let i = 0; i < line.length; i++) {
                    let data = line[i].split('\t');
                    let mat_code = data[0];
                    let input_qty = data[1];
                    if (mat_code === '' || input_qty === '') {
                        line.splice(i, 1);
                        continue;
                    }
                    _this.grid.addRow($.extend({}, {'mat_code': mat_code, 'input_qty': input_qty}), "last");
                }
            }

            checkMultiData() {
                let _this = this;
                let url = '/api/inventory/material_inout';
                let grid_data = this.getListFromText();
                let data = {
                    action: 'trans_multi_input_data',
                    Q: JSON.stringify(grid_data)
                };
                let result = AjaxUtil.getSyncData(url + "/trans_multi_input_data", data);
                if (result) {
                    _this.grid.itemsSource.sourceCollection = result.data;
                }
            }

            saveMultiData() {

                let url = '/api/inventory/material_inout/save_multi_data';
                let data = FormUtil.extractForm($('#mat_multi_input_form'));
                data['type'] = 'in';
                let grid_data = this.grid.itemsSource.sourceCollection;
                let bad_count = 0;
                grid_data.forEach(function (value, index) {
                    if (!value.mat_name)
                        bad_count++;
                });
                if (!$('#Company_id').val()) {
                    Alert.alert('', '업체를 선택하세요.');
                    return false;
                }

                if (bad_count > 0) {
                    Alert.alert('품목코드 확인', '품목명 없는 품목코드가 있습니다.');
                    return false;
                }

                data['Q'] = JSON.stringify(grid_data);

                let res = AjaxUtil.postSyncData(url, data);
                console.log('data', data);
                if (!res.success) {
                    Alert.alert('', res.message);
                    return false;
                } else {
                    Notify.success('저장되었습니다');
                    page.searchDataBind();
                    modalContainer.modal.close();
                }
            }
        }


        class MaterialMove {
            constructor() {
                this.grid = null;
            }

            initGrid(gridElement) {
                this.grid = new wijmo.grid.FlexGrid(gridElement, {
                    autoGenerateColumns: false,
                    selectionMode: wijmo.grid.SelectionMode.ListBox,
                    headersVisibility: wijmo.grid.HeadersVisibility.All,
                    formatItem: (sender, e) => {
                        if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
                            e.cell.style.textAlign = 'center';
                        }
                    },
                    columns: [
                        {binding: 'mat_type', header: '품목구분', width: 100, align: 'center', isReadOnly: true},
                        {binding: 'mat_code', header: '품목코드', width: 100, align: 'left', isReadOnly: true},
                        {binding: 'material', header: '품목', width: 250, align: 'left', isReadOnly: true},
                        {binding: 'unit_name', header: '단위', width: 100, align: 'center', isReadOnly: true},
                        {binding: 'current_stock', header: '창고재고', width: 100, align: 'right', isReadOnly: true},
                        {binding: 'move_qty', header: '이동량(입력수정)', width: 150, align: 'right', isReadOnly: false}
                    ],
                    itemsSource: new wijmo.collections.CollectionView([]),
                    itemFormatter: (panel, row, col, cell) => {
                        if (panel.cellType === wijmo.grid.CellType.Cell) {
                            const item = panel.rows[row].dataItem; // 현재 행의 데이터 항목
                            const column = panel.columns[col]; // 현재 열 정보

                            // 창고재고 조건부 스타일링
                            if (column.binding === 'house_stock' && item.house_stock <= 0) {
                                cell.classList.add('grid-cell-red'); // 'grid-cell-red' 클래스 추가
                            }

                            // 이동량 조건부 스타일링
                            if (column.binding === 'move_qty') {
                                if (item.move_qty > 0) {
                                    cell.classList.add('grid-cell-blue'); // 'grid-cell-blue' 클래스 추가
                                }
                            }
                        }
                    }
                });
                let selector = new wijmo.grid.selector.Selector(this.grid, {
                    itemChecked: function () {

                    }
                })
                new FlexGridContextMenu(this.grid);
                this.grid.downloadFileName = '품목 내역';
            }

            searchMaterial() {
                let _this = this;

                let from = this.$cboFrom.val();
                let to = this.$cboTo.val();
                let material_id = this.$cboMaterial.val();

                let url = '/api/inventory/material_move';
                let data = {
                    action: 'read',
                    storehouse_id: from,
                    material_id: material_id
                };

                let fnsuccess = function (result) {
                    if (result.data) {
                        _this.grid.itemsSource.sourceCollection = result.data;
                    }
                };

                AjaxUtil.getAsyncData(url + "/read", data, fnsuccess);

                return true;
            }

            checkMoveValidation() {

                let _this = this;
                let from = this.$cboFrom.val();
                let to = this.$cboTo.val();

                let items = [];
                let strItems = JSON.stringify(items);

                if (from === '' || to === "") {
                    Alert.alert('', 'from, to를 확인하세요.');
                    return;
                }
                if (from === to) {
                    Alert.alert('', '동일한 창고를 선택하셨습니다.');
                    return;

                }

                let seletectedItems = _this.grid.selectedItems;
                if (seletectedItems.length === 0) {
                    Alert.alert('', '선택된 데이터가 없습니다.');
                    return;
                }

                $.each(seletectedItems, function (idx, item) {
                    let move_qty = item.move_qty;
                    if (move_qty > 0) {
                        items.push({material_id: item.id, move_qty: move_qty});
                    }
                });

                if (items.length === 0) {
                    Alert.alert('', '이동수량 변경이 없습니다.');
                    return false;
                }

                return true;

            }

            moveMaterial() {

                let _this = this;
                if (this.checkMoveValidation() === false) {
                    return false;
                }

                let from = this.$cboFrom.val();
                let to = this.$cboTo.val();
                let items = [];

                let seletectedItems = _this.grid.selectedItems;
                if (seletectedItems.length === 0) {
                    Alert.alert('', '선택된 데이터가 없습니다.');
                    return;
                }

                $.each(seletectedItems, function (idx, item) {
                    let move_qty = item.move_qty;
                    if (move_qty > 0) {
                        items.push({
                            mat_id: item.mat_id,
                            move_qty: move_qty,
                            storehouse_id: from
                        });
                    }
                });

                let strItems = JSON.stringify(items);
                let url = '/api/inventory/material_move/material_move';
                let data = {
                    from_storehouse_id: from,
                    to_storehouse_id: to,
                    move_list: strItems
                };
                let fnsuccess = function (result) {
                    if (result.success) {
                        Notify.success('이동되었습니다.');
                        _this.modalContainer.close();
                        page.searchDataBind();
                    } else {
                        Alert.alert('', '오류가 발생했습니다.');
                    }
                };

                AjaxUtil.postAsyncData(url, data, fnsuccess);
            }

            showMovePopup() {

                let _this = this;
                let defaultData = {};
                let content = tmpl('matMovePopup', defaultData);
                let $content = $(content);
                this.modalContainer = new PopupDraggable('품목 창고이동');
                this.modalContainer.open(Object.assign(TabletUtil.size(1000, 580), {$content}));

                this.$cboFrom = $content.find('#cboFrom');
                this.$cboTo = $content.find('#cboTo');
                this.$cboMaterialType = $content.find('#cboMaterialType');
                this.$cboMaterial = $content.find('#cboMaterial');
                this.$moveQuantity = $content.find('#moveQuantity');

                // 그리드 설정
                let $grid = $content.find('#material-grid');
                this.initGrid($grid);

                AjaxUtil.fillSelectOptions(this.$cboFrom, 'store_house', '', false);
                AjaxUtil.fillSelectOptions(this.$cboTo, 'store_house', '', false);

                let matType = this.$cboMaterialType.val();
                //AjaxUtil.fillSelectOptions(this.$cboMaterial, 'product_semi', 'choose', false, matType);
                AjaxUtil.fillSelectOptions(this.$cboMaterial, 'material', 'choose', false, '', '', matType);

                let $btnMatSearch = $content.find('#btnMatSearch');
                let $btnMoveAction = $content.find('#btnMoveAction');
                _this.searchMaterial();

                $btnMatSearch.click(function (e) {
                    _this.searchMaterial();
                });

                $btnMoveAction.click(function (e) {
                    if (_this.checkMoveValidation()) {
                        Alert.confirm('', '이동하시겠습니까?', function () {
                            _this.moveMaterial();
                        });
                    }
                });

                this.$cboFrom.on('change', function (e) {
                    return _this.searchMaterial();
                });

                this.$cboMaterial.on('change', function (e) {
                    let mat = $(this).val();
                    if (mat === '') {
                        _this.$moveQuantity.val('');
                    }
                });

                this.$cboMaterialType.on('change', function (e) {
                    let matType = _this.$cboMaterialType.val();
                    AjaxUtil.fillSelectOptions(_this.$cboMaterial, 'material', 'choose', false, '', '', matType);
                });

            }

        }

            page.searchDataBind();

            $('#searchForm').on('submit', function (e) {

                $('#btnSearch').click(); // 검색 버튼 트리거
            });

            $(document).on('input', '#btnCompanySearchB', function () {
                let $clearBtn = $(this).closest('.input-clear').find('.btn-clear');

                if (value) {
                    $clearBtn.show();
                } else {
                    $clearBtn.hide();
                    $('#cboCompanyHidden').val('');
                }
            });


        })


    </script>
