<head>
    <style>
        .greenText {
            color: #66DA26;
        }

        .redText {

        }

        .blueText {
            color: #4374D9;
        }

        .select2-container--open {
            z-index: 9001;
        }

        .grid-cell-red {
            background: #f8d2cb;
        }

        .grid-cell-blue {
            background: #dcf0f8;
        }

        .grid-cell-white {
            background: #ffffff;
        }

        .search-flex-row {
            display: flex;
            justify-content: space-between; /* 좌: 검색필드 / 우: 버튼 */
            align-items: flex-end;          /* 하단 정렬 맞추기 */
            width: 100%;
            gap: 16px;
        }

        #btnCompanySearchB::placeholder {
            font-size: 13px; /* 원하는 크기로 */
        }

        /* 스캐너 입고 푸터 : 좌 요약 / 우 버튼 */
        .popup-button.scan-footer {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-end;
        }

        .popup-button.scan-footer .scan-summary {
            margin-right: auto;
            font-weight: 600;
            white-space: nowrap;
        }

        .popup-button.scan-footer .scan-summary span {
            color: #03428E;
        }

        /* ===== 태블릿 모드 =====
           판정은 JS(TabletUtil.isTablet)에서 하고 body.tablet-mode 로 내려온다.
           미디어쿼리를 같이 걸면 기준이 두 곳이 되어 어긋난다. */

        /* 모달 컨테이너: 인라인 px 고정 무력화
           [class*="modal"] 같은 넓은 선택자는 중첩 팝업까지 물어
           품목/구매처 조회 팝업의 레이아웃을 깨뜨린다. 쓰지 않는다. */
        body.tablet-mode .modal,
        body.tablet-mode .popup-draggable {
            width: 96vw !important;
            max-width: 96vw !important;
            height: auto !important;
            max-height: 92vh !important;
            left: 2vw !important;
            top: 4vh !important;
            transform: none !important;
        }

        /* ★ 모달 높이를 92vh 로 자르면서 스크롤을 안 주면
           하단 버튼(선택/닫기)이 잘려 사라진다.
           .content_wrap.popup 만 걸었더니 popup 클래스가 없는
           공통 조회 팝업에서 버튼이 통째로 없어졌다. */
        body.tablet-mode .content_wrap,
        body.tablet-mode .modal > .modal-body,
        body.tablet-mode .popup-draggable > .modal-body {
            max-height: calc(92vh - 60px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* 조회 팝업 내부 그리드는 높이를 줄여 버튼 자리를 남긴다 */
        body.tablet-mode .modal .wj-flexgrid,
        body.tablet-mode .popup-draggable .wj-flexgrid {
            max-height: 46vh;
        }

        /* 터치 타겟 44px */
        body.tablet-mode .btn,
        body.tablet-mode .btn-popup,
        body.tablet-mode .btn-delete {
            min-height: 44px;
            min-width: 44px;
            padding: 0 16px;
            font-size: 15px;
            line-height: 44px;
        }

        body.tablet-mode input,
        body.tablet-mode select,
        body.tablet-mode textarea {
            min-height: 44px;
            font-size: 16px;   /* iOS 자동 확대 방지 — 16px 미만이면 줌인됨 */
        }

        /* 팝업 하단 버튼바 고정 */
        /* 스티키 푸터는 뒤따르는 형제를 덮는다.
           버튼바 뒤에 내용이 오는 팝업이 없도록 마크업을 맞춰 둘 것. */
        body.tablet-mode .popup-button {
            position: sticky;
            bottom: 0;
            background: #fff;
            padding: 10px 0;
            border-top: 1px solid #E5E7EC;
            z-index: 10;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        /* 스캔 그리드 : 스크롤 대신 높이를 줄여 한 화면에 담는다 */
        body.tablet-mode #scan-result-grid {
            min-height: 180px;
        }

        /* wijmo 행 높이 — 손가락으로 집을 수 있게 */
        body.tablet-mode .wj-flexgrid .wj-cell {
            min-height: 42px;
            padding-top: 10px;
            padding-bottom: 10px;
            font-size: 14px;
        }
        body.tablet-mode .wj-flexgrid {
            touch-action: pan-x pan-y;
        }

        /* 스캔 입력창 강조 */
        body.tablet-mode #scanBarcode {
            height: 52px !important;
            font-size: 18px !important;
        }

        /* 검색영역 줄바꿈 */
        body.tablet-mode .search-flex-row { flex-wrap: wrap; }
        body.tablet-mode .search-wrap { flex-wrap: wrap; gap: 8px; }

        /* ══ 카메라 바코드 스캔 ═════════════════════════════════════
           HID 스캐너(DS2278)가 없는 자리 — 태블릿·폰 내장 카메라로 찍는다.
           인식값은 #scanBarcode 와 «완전히 같은 경로»(handlePoScan /
           handleItemScan)로 흘려보낸다. 여기서 따로 처리를 만들면
           규칙이 두 벌이 되어 한쪽만 고쳤을 때 조용히 갈라진다. */
        .camscan {
            margin-top: 8px;
            border: 1px solid #E5E7EC;
            border-radius: 8px;
            padding: 10px;
            background: #FAFBFC;
        }

        .camscan-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .camscan-head .cam-hint {
            margin-right: auto;
            font-weight: 400;
            font-size: 12px;
            color: #888;
        }

        .camscan-body {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .camwrap {
            position: relative;
            flex: 0 0 320px;
            background: #0d1417;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
        }

        .camwrap video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .camwrap .camframe {
            position: absolute;
            inset: 14% 8%;
            border: 3px solid rgba(255, 255, 255, .85);
            border-radius: 8px;
            box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .25);
        }

        .camwrap .camframe.hit {
            border-color: #31C48D;
        }

        .camwrap .cammsg {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 8px 10px;
            background: rgba(13, 20, 23, .72);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
        }

        .camlist {
            flex: 1;
            min-width: 0;
            max-height: 240px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .camrow {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 10px;
            border: 1px solid #E5E7EC;
            border-radius: 6px;
            background: #fff;
        }

        .camrow.ok {
            border-color: #31C48D;
            background: #F3FAF7;
        }

        .camrow.err {
            border-color: #E02424;
            background: #FDF2F2;
        }

        .camrow .cm-t {
            flex: 1;
            min-width: 0;
        }

        .camrow .cm-n {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .camrow .cm-c {
            font-size: 11px;
            color: #888;
            word-break: break-all;
        }

        body.tablet-mode .camwrap { flex: 0 0 40vw; }
        body.tablet-mode .camlist { max-height: 30vh; }

        /* 팝업이 좁아지면 영상 아래로 로그가 내려간다 */
        @media (max-width: 900px) {
            .camscan-body { flex-direction: column; }
            .camwrap { flex: 0 0 auto; width: 100%; }
            .camlist { width: 100%; max-height: 26vh; }
        }

    </style>

    <script type="text/javascript" th:src="@{/resource/jsBarcode/JsBarcode.all.min.js}"></script>

    <script type="text/javascript">
        // ===== 태블릿 유틸 =====
        const TabletUtil = {
            BREAKPOINT: 1280,   // 1138x712 실기기 포함. 1024 로 두면 PC 로 잡힌다

            // 폭 + 포인터 방식 둘 다 본다.
            // 폭만 보면 1138 태블릿을 놓치고, 포인터만 보면 터치스크린 PC 가 걸린다.
            isTouch() {
                return (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
                    || ('ontouchstart' in window)
                    || navigator.maxTouchPoints > 0;
            },

            isTablet() {
                return window.innerWidth <= this.BREAKPOINT && this.isTouch();
            },

            // 모달 크기: 태블릿이면 뷰포트에 맞춰 축소
            size(w, h) {
                // 태블릿이 아니어도 뷰포트를 넘으면 줄인다.
                // 발주입고(1300px)는 1138 폭 PC 판정에서도 잘렸다.
                const ratio = this.isTablet() ? 0.96 : 0.98;
                return {
                    width: Math.min(w, Math.floor(window.innerWidth * ratio)),
                    height: Math.min(h, Math.floor(window.innerHeight * (this.isTablet() ? 0.92 : 0.95)))
                };
            },

            applyBodyClass() {
                document.body.classList.toggle('tablet-mode', this.isTablet());
            },

            // 더블클릭 → 태블릿에서는 더블탭으로도 동작
            bindDoubleTap(el, handler) {
                let lastT = 0, lastX = 0, lastY = 0;
                el.addEventListener('touchend', function (e) {
                    const t = Date.now();
                    const tc = e.changedTouches[0];
                    if (t - lastT < 350 &&
                        Math.abs(tc.clientX - lastX) < 30 &&
                        Math.abs(tc.clientY - lastY) < 30) {
                        e.preventDefault();
                        handler(tc);   // clientX/Y 가진 객체를 넘김
                        lastT = 0;
                    } else {
                        lastT = t;
                        lastX = tc.clientX;
                        lastY = tc.clientY;
                    }
                }, {passive: false});
            }
        };

        window.addEventListener('resize', () => TabletUtil.applyBodyClass());

        class materialStorehouse {
            constructor() {
                this.url = '/api/inventory/material_inout';
                this.grid = null;
                this.init();
            }

            init() {
                const _this = this;

                this.grid = new wijmo.grid.FlexGrid('#material-storehouse-grid', {
                    autoGenerateColumns: false,
                    selectionMode: wijmo.grid.SelectionMode.Row,
                    headersVisibility: wijmo.grid.HeadersVisibility.All,
                    isReadOnly: true,
                    showMarquee: true,
                    formatItem: (sender, e) => {
                        if (e.panel.cellType === wijmo.grid.CellType.RowHeader) {
                            // 헤더에 순번
                            e.cell.textContent = (e.row + 1).toString();
                        }
                        if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
                            e.cell.style.textAlign = 'center'; // 헤더 가운데 정렬
                        }
                    },
                    columns: [
                        // {binding: 'mio_pk', header: '입고번호', width: 80, align: 'center'},
                        {binding: 'store_house_name', header: '창고', width: 80, align: 'center'},
                        {binding: 'inout', header: '입출', width: 60, align: 'center'},
                        {binding: 'material_type', header: '품목유형', width: 80, align: 'center'},
                        {binding: 'material_code', header: '품목코드', width: 100, align: 'center'},
                        {binding: 'material_name', header: '품목명', width: 170, align: 'left'},
                        {binding: 'unit_name', header: '단위', width: 50, align: 'center'},
                        {binding: 'InoutDate', header: '입출일', width: 100, align: 'center'},
                        {binding: 'InoutTime', header: '시간', width: 60, align: 'center'},
                        {binding: 'potentialInputQty', header: '가입고량', width: 80, align: 'right', format: 'n0'},
                        {binding: 'InputQty', header: '입고량', width: 80, align: 'right', format: 'n0'},
                        // {binding: 'OutputQty', header: '출고량', width: 80, align: 'right', format: 'n0'},
                        {binding: 'HouseStock', header: '창고재고', width: 80, align: 'right', format: 'n0'},
                        {binding: 'lot_count', header: '로트개수', width: 80, align: 'center'},
                        {binding: 'CurrentStock', header: '전체재고', width: 80, align: 'right', format: 'n0'},
                        {binding: 'Description', header: '비고', width: 150, align: 'left'},
                        {binding: 'inout_state', header: '입고 상태', width: 100, align: 'center'},
                        // {binding: 'state_name', header: '입고검사 결재', width: 100, align: 'center'},
                        {binding: 'judge_code', header: '입고검사 판정', width: 100, align: 'center'},
                        {binding: 'lot_use', header: '로트관리유무', width: 100, align: 'center'},
                        {binding: 'inout_type', header: '구분', width: 100, align: 'center'},
                        // {binding: 'SafetyStock', header: '안전재고', width: 100, align: 'right', format: 'n0'}
                    ],
                    itemsSource: new wijmo.collections.CollectionView([]),
                    itemFormatter: (panel, row, col, cell) => {
                        if (panel.cellType === wijmo.grid.CellType.Cell) {
                            const item = panel.rows[row].dataItem;
                            const column = panel.columns[col];

                            // 창고재고 조건부 스타일링
                            if (column.binding === 'HouseStock' && item.HouseStock < 0) {
                                cell.classList.add('redText');
                            }

                            // 전체재고 조건부 스타일링
                            if (column.binding === 'CurrentStock' && item.CurrentStock < item.SafetyStock) {
                                cell.classList.add('redText');
                            }

                            if (column.binding === 'mio_pk') {
                                cell.textContent = item.mio_pk?.toString(); // 콤마 제거해서 그대로 출력
                            }
                        }
                    }
                });
                new FlexGridContextMenu(this.grid);
                this.grid.downloadFileName = '자재 입출고 내역';

                this.grid.hostElement.addEventListener('dblclick', function (e) {
                    let ht = _this.grid.hitTest(e); // 마우스 위치 기반 셀 hit test
                    if (ht.cellType === wijmo.grid.CellType.Cell) {
                        let row = _this.grid.rows[ht.row]; // 해당 행
                        let item = _this.grid.rows[ht.row].dataItem; // 해당 row의 데이터

                        _this.modify([item]); // 배열로 넘기는 걸 유지하려면 이렇게
                    }
                });

                // 태블릿: 더블탭으로도 상세 열기
                TabletUtil.bindDoubleTap(this.grid.hostElement, function (pt) {
                    let ht = _this.grid.hitTest(pt.clientX, pt.clientY);
                    if (ht.cellType === wijmo.grid.CellType.Cell) {
                        let item = _this.grid.rows[ht.row].dataItem;
                        if (item) _this.modify([item]);
                    }
                });

                // 로트입고 버튼 클릭
                document.getElementById('btnLotInput').addEventListener('click', () => {
                    this.showLotInputPopup();
                });

                // 입고검사 버튼 클릭
                document.getElementById('btnInputTest').addEventListener('click', () => {
                    this.showInputTestPopup();
                });
            }

            modify(selectedItem) {
                let _this = this;

                let selectedItems = selectedItem;

                if (selectedItems.length === 1) {

                    let data = {
                        mio_pk: selectedItems[0].mio_pk,
                        action: 'detail'
                    };
                    let fnsuccess = function (result) {
                        result.data['mode'] = 'edit';
                        _this.addDataPopup(result.data);
                    };
                    AjaxUtil.getAsyncData(_this.url + '/matinout_detail', data, fnsuccess);
                } else if (selectedItems.length > 1) {
                    Alert.alert('', '데이터를 하나만 선택하세요.');
                } else {
                    Alert.alert('', '선택된 데이터가 없습니다.');
                }

            }

            searchDataBind() {
                let _this = this;
                let srchStartDt = $('#searchForm').find("#srchStartDt").val();
                let srchEndDt = $('#searchForm').find("#srchEndDt").val();
                let house_pk = $('#searchForm').find('#cboHouse').val();
                let mat_type = $('#searchForm').find('#cboMatType').val();
                let mat_grp_pk = $('#searchForm').find('#cboMatGroup').val();
                let txtMatName = $('#searchForm').find('#txtMatName').val();
                let data = {
                    'action': 'read',
                    'srchStartDt': srchStartDt,
                    'srchEndDt': srchEndDt,
                    'house_pk': house_pk,
                    'mat_type': mat_type,
                    'mat_grp_pk': mat_grp_pk,
                    'keyword': txtMatName
                };

                let result = AjaxUtil.getSyncData(this.url + "/read_receipt", data);
                if (result.data != null) {
                    _this.grid.itemsSource = new wijmo.collections.CollectionView(result.data);
                }
            }

            addDataPopup(data) {
                let _this = this;
                let content = tmpl('addDataPopup', {});
                let $content = $(content);
                let form = $content.find('#materialInoutForm');

                let modalContainer = null;
                if (!data) {
                    modalContainer = new PopupDraggable('미발주 입고');
                } else {
                    modalContainer = new PopupDraggable('수정');
                }


                modalContainer.open(Object.assign(TabletUtil.size(1000, 440), {$content}));
                popup = new materialInoutPopup();
                AjaxUtil.fillSelectOptions($content.find('#StoreHouse_id'), 'store_house', 'choose', 3);    // 3:자재창고
                // AjaxUtil.fillSelectOptions($content.find('#StoreHouse_id'), 'store_house', 'choose', '');    // 3:자재창고

                AjaxUtil.fillSelectOptions($content.find('#cboMaterialType'), 'system_code', 'choose', '', 'mat_type');
                AjaxUtil.fillSelectOptions($content.find('#cboMaterialGroup'), 'material_group', 'choose', '', '');
                //AjaxUtil.fillSelectOptions($content.find('#cboMaterialGroup'), 'material_group', 'choose', '', 'raw_mat');
                AjaxUtil.fillSelectOptions($content.find('#Material_id'), 'material', 'choose', '');
                //$content.find('select').select2();

                let $inoutDate = $content.find('#inoutDate');
                let now = new Date();

                // 한국 시간으로 보정
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset()); // 로컬 → ISO 기준 보정

                let localISOString = now.toISOString().slice(0, 16); // yyyy-MM-ddTHH:mm
                $inoutDate.val(localISOString);

                let type = null;

                $content.find('#inoutSelect').on('change', function () {
                    type = $(this).val(); // 또는 $content.find('#inoutSelect').val();
                    $content.find('#inoutSelect_hidden').val($(this).val());

                    if (type === 'in') {
                        AjaxUtil.fillSelectOptions(
                            $content.find('#InoutType'), 'system_code', '', 'etc_in', 'input_type'
                        );
                    } else if (type === 'out') {
                        AjaxUtil.fillSelectOptions(
                            $content.find('#InoutType'), 'system_code', '', 'etc_out', 'output_type'
                        );
                    } else if (type === 'return') {
                        AjaxUtil.fillSelectOptions(
                            $content.find('#InoutType'), 'system_code', '', 'etc_return', 'return_type'
                        );
                    } else if (type === 'recall') {
                        AjaxUtil.fillSelectOptions(
                            $content.find('#InoutType'), 'system_code', '', 'etc_recall', 'recall_type'
                        );
                    } else {
                        $content.find('#InoutType').empty().append('<option value="">선택</option>');
                    }

                    formatInoutQty();
                });

                $content.find('#InoutQty').on('input', function () {
                    formatInoutQty();
                });

                $content.find('#InoutType').on('change', function () {
                    $content.find('#InoutType_hidden').val($(this).val());
                });


                function formatInoutQty() {
                    let $qty = $content.find('#InoutQty');
                    let raw = $qty.val().replace(/,/g, '').replace(/[^0-9-]/g, ''); // 숫자만 남기기

                    if (!raw) {
                        $qty.val('');
                        return;
                    }

                    // - 부호 처리
                    let isNegative = (type === 'recall' || type === 'return');
                    raw = raw.replace(/^-/, ''); // 음수 기호 제거

                    let num = parseInt(raw, 10);
                    if (isNaN(num)) {
                        $qty.val('');
                        return;
                    }

                    let formatted = num.toLocaleString(); // 천 단위 콤마
                    if (isNegative) {
                        formatted = '-' + formatted;
                    }

                    $qty.val(formatted);
                }

                $content.find('#inoutSelect').trigger('change');
                $content.find('#inoutType').trigger('change');

                $content.find('#cboMaterialType').on('change', function (e) {
                    let mat_type = $content.find('#cboMaterialType').val();
                    AjaxUtil.fillSelectOptions($content.find('#cboMaterialGroup'), 'material_group', 'choose', '', mat_type);
                });

                $content.find('#cboMaterialGroup').on('change', function (e) {
                    let mat_group = $content.find('#cboMaterialGroup').val();
                    AjaxUtil.fillSelectOptions($content.find('#Material_id'), 'material', 'choose', '', mat_group);
                });

                $content.find('#btnMaterial').click(function () {
                    let searchcallback = function (items) {
                        $content.find('#cboMaterialType').val(items.MaterialTypeCode)
                        $content.find('#cboMaterialTypeName').val(items.MaterialTypeName)
                        $content.find('#cboMaterialGroup').val(items.MaterialGroup_id)
                        $content.find('#cboMaterialGroupName').val(items.group_name)
                        $content.find('#Material_id').val(items.id)
                        $content.find('#Material_name').val(items.Name)
                    };

                    let poppage = new PopupMaterialPage('single');
                    let $poppage = $(poppage);
                    poppage.show(searchcallback);
                });

                $content.find('#btnCompanySearch').click(function () {
                    let poppage = new PopCompComponent();
                    let $poppage = $(poppage);
                    let searchcallback = function (items) {
                        console.log('btnCompanySearch', items);
                        $content.find('#cboCompany').val(items.id);
                        $content.find('#CompanyName').val(items.compname);
                    };

                    poppage.show(searchcallback);
                });

                if (data && data.mode === 'edit') {
                    $content.find('#inoutSelect').val(data[0].inoutSelect);

                    // 1-2. 옵션 로딩 트리거
                    $content.find('#inoutSelect').trigger('change');

                    setTimeout(function () {
                        FormUtil.BindDataForm(data[0], form);
                        console.log('edit BindDataForm data', data);
                        $content.find('#inoutSelect').prop('disabled', true);
                        $content.find('#InoutType').prop('disabled', true);

                        $content.find('#btnDelete').show();
                        $content.find('#btnSave span').text('수정');
                    }, 10);

                }

                $content.find('#btnSave').on('click', function () {

                    if (!$('#Material_id').val()) {
                        Alert.alert('', '품목을 선택하세요.');
                        return false;

                                    // 발주에 지정된 창고가 dataMap의 value 타입과 맞도록 정규화.
                                    // 숫자 3 / 문자 "3" 이 섞이면 wijmo가 매칭을 못 해 빈칸이 된다.
                                    const hit = validOpts.find(o => String(o.value) === String(item.StoreHouse_id));
                                    item.StoreHouse_id = hit ? hit.value : (defaultHouse ? defaultHouse.value : item.StoreHouse_id);
                                } else if (defaultHouse) {
                                    item.StoreHouse_id = defaultHouse.value;
                                }
                            });
                            _this.baljuInputGrid.itemsSource = new wijmo.collections.CollectionView(result.data);
                            selector = new wijmo.grid.selector.Selector(_this.baljuInputGrid);
                        }
                    };
                    let baljuParam = {
                        'start': start.val(),
                        'end': end.val(),
                        'action': 'read'
                    };
                    AjaxUtil.getAsyncData(_this.url + '/read_balju', baljuParam, fnsuccess);
                };

                fnLoadBaljuList();

                $content.find('#btnBaljuAction').on('click', function () {

                    let url = _this.url + '/save_balju';
                    let items = _this.baljuInputGrid.rows
                    .filter(row => row.isSelected)
                    .map(row => row.dataItem);

                    console.log(items);

                    if (!items || items.length === 0) {
                        Alert.alert('', '저장할 항목을 선택하세요.');
                        return;
                    }

                    for (let i = 0; i < items.length; i++) {
                        const row = items[i];

                        if (!row.StoreHouse_id) {
                            Alert.alert('', '납품 창고를 선택하세요.');
                            return;
                        }

                        if (row.inputQty === null || row.inputQty === undefined || row.inputQty === '') {
                            Alert.alert('', '입고 수량을 입력하세요.');
                            return;
                        }

                        // 추가: 음수 또는 0 체크도 필요할 경우
                        if (isNaN(row.inputQty) || Number(row.inputQty) <= 0) {
                            Alert.alert('', '입고 수량은 0보다 큰 숫자여야 합니다.');
                            return;
                        }

                        // 가입고중인 수량까지 뺀 잔량을 넘지 못하게. 서버도 막지만
                        // 여기서 잡아야 「저장 눌렀는데 에러」 대신 그 자리에서 알 수 있다.
                        const remain = fnRemainQty(row);
                        if (Number(row.inputQty) > remain) {
                            Alert.alert('', (row.product_name || '') + ' · 입고 가능 수량(' + remain
                                + ')을 초과했습니다.'
                                + (Number(row.PendingQty) > 0
                                    ? ' 가입고 대기 ' + row.PendingQty + ' 이 검사 대기중입니다.' : ''));
                            return;
                        }
                    }

                    let fnSuccess = function (res) {
                        if (!res.success) {
                            Alert.alert('', res.message);
                        } else {
                            Notify.success('저장되었습니다');
                            page.searchDataBind();
                            modalContainer.modal.close();
                        }
                    };

                    AjaxUtil.postJsonAsyncData(url, items, fnSuccess);
                });

                // 발주 강제 완료
                $content.find('#btnCompletionMat').on('click', function () {
                    let url = _this.url + '/force-complete';
                    let items = _this.baljuInputGrid.rows
                    .filter(row => row.isSelected)
                    .map(row => row.dataItem);

                    console.log(items);

                    if (!items || items.length === 0) {
                        Alert.alert('', '강제 완료할 항목을 선택하세요.');
                        return;
                    }

                    const baljuPkList = items.map(item => item.id);

                    let fnSuccess = function (res) {
                        if (!res.success) {
                            Alert.alert('', res.message);
                        } else {
                            Notify.success('저장되었습니다');
                            fnLoadBaljuList();
                        }
                    };

                    AjaxUtil.postJsonData(url, {baljuPkList}, fnSuccess);
                });

            }

                        {binding: 'MakerLotNo', header: '실물 라벨', width: 140, align: 'center', isReadOnly: true},

                new FlexGridContextMenu(this.matLotGrid);

                let $UnitName = $content.find('#UnitName');

                    $EffectiveDate.val(CommonUtil.getYYYYMMDD(item.ValidDays));
                } else {
                    // 없으면 오늘 날짜
                    $EffectiveDate.val(CommonUtil.getYYYYMMDD());
                }

                /* 이 입고건에 «이미 저장된» 로트와, 그중 쓰인 것이 있는지.
                   계산·저장 버튼이 이 값을 보고 갈린다. */
                let savedLots = [];
                let usedLots  = [];
                /* 사용 판정 : 서버가 내려주는 값 중 하나라도 «쓴 흔적» 을 말하면 사용으로 본다.
                   ★ CurrentStock 이 InputQty 보다 적으면 어딘가로 빠져나간 것이다.
                     used_qty / cons_cnt 를 내려주는 서버라면 그 값이 더 정확하다. */
                let isUsedLot = function (r) {
                    if (!r) return false;
                    if (Number(r.used_qty) > 0) return true;
                    if (Number(r.cons_cnt) > 0) return true;
                    if (r.CurrentStock != null && r.InputQty != null
                        && Number(r.CurrentStock) < Number(r.InputQty)) return true;
                    return false;
                };

                let fnLoadLotList = function (mio_pk) {
                    let fnsuccess = function (result) {
                        savedLots = result.data || [];
                        usedLots  = savedLots.filter(isUsedLot);
                        /* ★ 예전에는 로트가 있기만 하면 계산을 막았다.
                             그런데 스캔 입고로 만들어진 로트가 남아 있으면 다시 계산할 방법이
                             없어, 사람이 그 위에 계산 결과를 얹어 «중복 입고» 가 생겼다
                             (스캔 33×3 + 계산 99 = 198). 이제는 «쓰인 로트가 있을 때만» 막는다. */
                        if (usedLots.length > 0) {
                            $btnLotCalc.prop('disabled', true);
                            $btnLotSave.prop('disabled', true);
                        } else {
                            $btnLotCalc.prop('disabled', false);
                            $btnLotSave.prop('disabled', false);
                        }
                        _this.matLotGrid.itemsSource = new wijmo.collections.CollectionView(result.data);
                    };
                    let lotParam = {
                        mio_id: mio_pk,
                        action: 'mio_lot_list'
                    };
                    AjaxUtil.getAsyncData(_this.url + '/mio_lot_list', lotParam, fnsuccess);

                };

                fnLoadLotList(item.mio_pk);

                /* 저장할 때 «기존 로트를 갈아끼울지» 여부. 계산 버튼에서 정해진다. */
                let replaceMode = false;

                // 로트계산버튼 클릭
                $btnLotCalc.click(function (e) {
                    /* ★ 쓰인 로트가 하나라도 있으면 손대지 않는다.
                         이미 소비·출고된 로트를 지우면 그 이력이 매달릴 곳을 잃는다. */
                    if (usedLots.length > 0) {
                        Alert.alert('로트계산 불가',
                            '이미 사용된 로트가 있습니다 (' + usedLots.length + '건).\n'
                            + '사용 이력이 있는 로트는 다시 발번할 수 없습니다.');
                        return;
                    }
                    /* 저장된 로트가 있으면 «지우고 새로» 라는 뜻이다 — 사람에게 먼저 확인한다.
                       예전에는 조용히 위에 얹혀 중복 입고가 됐다. */
                    if (savedLots.length > 0 && !replaceMode) {
                        Alert.confirm('로트 재발번',
                            '이미 저장된 로트 ' + savedLots.length + '건이 있습니다.\n'
                            + '기존 로트를 지우고 새로 발번합니다. 계속할까요?',
                            function () { replaceMode = true; $btnLotCalc.click(); });
                        return;
                    }
                    _this.matLotGrid.itemsSource.sourceCollection = [];

                    if ($EffectiveDate.val() === '' || $EffectiveDate.val() == null) {
                        Alert.alert('로트저장', '유효 일시를 입력해주세요.', function () {
                        });
                        return;
                    }

                    let inputQty = $InputQty.val();
                    let lotSize = $LotSize.val();
                    let effectedDate = $EffectiveDate.val();

                    if (inputQty === '' || inputQty === 0) {
                        // alert(1);
                        Alert.alert('입고수량', '입고수량이 없습니다.');
                        return;
                    }
                    if (lotSize === '' || lotSize === 0) {
                        // alert(2);
                        Alert.alert('로트당수량', '로트당 수량을 입력해주세요.');
                        return;
                    }
                    let lotCount = (inputQty / lotSize);
                    if (lotCount < 1) {
                        // alert(3);
                        Alert.alert('', '입고수량과 로트당수량을 확인해주세요.');
                        return;
                    }
                    lotCount = Math.ceil(lotCount);
                    let remainQty = Number(inputQty);
                    let now = CommonUtil.getYYYYMMDD();
                    let updatedCollection = [];

                    for (let idx = 0; idx < lotCount; idx++) {
                        let qty = lotSize;
                        if (remainQty < qty) {
                            qty = remainQty;
                        }
                        let r = {
                            InputQty: qty,
                            UnitName: item.unit_name,
                            InputDateTime: now,
                            Description: item.Description,
                            mio_id: item.mio_pk,
                            EffectiveDate: effectedDate,
                            LotNumber: ''
                        };

                        updatedCollection.push(r);
                        remainQty = remainQty - qty;
                    }
                    _this.matLotGrid.itemsSource.sourceCollection = updatedCollection;
                });

                let $btnBarcordPrint = $content.find('#btnBarcordPrint');

                // 바코드출력
                $btnBarcordPrint.click(function (e) {
                    let lotItems = _this.matLotGrid.itemsSource.items;
                    if (lotItems.length == 0) {
                        return;
                    }
                    /* ★ «실물에 로트가 없는» 것만 뽑는다.
                         MakerLotNo 가 차 있으면 매입처 라벨의 (10) 로트를 그대로 쓰고 있어
                         이미 상자에 번호가 붙어 있다 — 우리 번호를 또 붙이면
                         한 상자에 로트번호가 둘이 되어 어느 쪽을 찍어야 할지 갈린다. */
                    let barcodeItems = [];
                    let skipped = 0;
                    $.each(lotItems, function (idx, lotItem) {
                        if (!lotItem.LotNumber) return;
                        if (lotItem.MakerLotNo) { skipped++; return; }   // 라벨 있음 — 출력 안 함
                        barcodeItems.push(lotItem);
                    });

                    if (barcodeItems.length === 0) {
                        Alert.alert('바코드 출력',
                            skipped > 0
                                ? '모든 로트에 매입처 라벨이 있어 출력할 것이 없습니다.\n'
                                + '그 라벨을 그대로 스캔하시면 됩니다.'
                                : '출력할 로트가 없습니다.');
                        return;
                    }
                    if (skipped > 0) {
                        Notify.success('매입처 라벨이 있는 ' + skipped + '건은 제외했습니다.');
                    }
                    _this.showBarcodePrint(barcodeItems);
                });

                // 로트저장
                $btnLotSave.click(function (e) {
                    let lotItems = _this.matLotGrid.itemsSource.items;
                    if (lotItems.length === 0) {
                        Alert.alert('로트저장', '저장할 로트가 없습니다.', function () {
                        });
                        return;
                    }

                    if ($EffectiveDate.val() === '' || $EffectiveDate.val() == null) {
                        Alert.alert('로트저장', '유효 일시를 입력해주세요.', function () {
                        });
                        return;
                    }
                    let qty = Number($InputQty.val());
                    let strLots = JSON.stringify(lotItems);
                    let url = _this.url + '/lot_save';
                    /* ★ 저장 직전에 한 번 더 막는다.
                         목록을 불러온 뒤 다른 사람이 그 로트를 써버렸을 수 있다.
                         최종 판정은 서버 몫이지만, 화면에서 걸러지는 것은 걸러 둔다. */
                    if (usedLots.length > 0) {
                        Alert.alert('로트저장 불가',
                            '이미 사용된 로트가 있습니다 (' + usedLots.length + '건).');
                        return;
                    }
                    let sendData = {
                        mio_id: item.mio_pk,
                        Material_id: item.Material_id,
                        StoreHouse_id: item.StoreHouse_id,
                        /* Y 면 이 입고건의 기존 로트를 지우고 새로 발번한다.
                           서버는 «쓰인 로트가 하나라도 있으면» 거절해야 한다. */
                        replace_yn: replaceMode ? 'Y' : 'N',
                        Q: strLots
                    };

                    let lotSaveCallback = function (result) {
                        if (result.success) {
                            Notify.success('저장했습니다.');

                            fnLoadLotList(item.mio_pk);
                        } else {
                            Notify.error('에러가 발생했습니다.');
                        }
                    };
                    AjaxUtil.postAsyncData(url, sendData, lotSaveCallback);
                });

                // 새로고침
                $btnLotRefresh.click(function (e) {
                    fnLoadLotList(item.mio_pk);
                });
            }

                        {binding: 'unit', header: '단위', width: 55, align: 'center', isReadOnly: true},

                            header: '발주수량',

                            align: 'right',

                        },

                        {binding: 'makerLotNo', header: '제조사로트', width: 150, align: 'center', isReadOnly: false},
                        {

                    ],
                    itemsSource: new wijmo.collections.CollectionView([]),
                    itemFormatter: (panel, row, col, cell) => {
                        if (panel.cellType === wijmo.grid.CellType.Cell) {
                            const item = panel.rows[row].dataItem;
                            if (!item) return;
                            const b = panel.columns[col].binding;
                            // 유효기간 비어있음 → 빨강(저장 차단 대상)
                            if (b === 'effectiveDate' && !item.effectiveDate) cell.classList.add('grid-cell-red');
                            // 입고수량이 미입고 초과 → 빨강
                            if (b === 'inputQty' && Number(item.inputQty) > Number(item.remainQty)) {
                                cell.classList.add('grid-cell-red');
                            }
