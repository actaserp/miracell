<html layout:decorate="~{layout_page}">
<head>
    <style>
        .greenText {
            color: #66DA26;
        }

        .redText {
            color: #FF0000;
        }

        .blueText {
            color: #4374D9;
        }

        .select2-container--open {
            z-index: 9001;
        }

        .grid-cell-red {
            background: #f8d2cb;
        }

        .grid-cell-blue {
            background: #dcf0f8;
        }

        .grid-cell-white {
            background: #ffffff;
        }

        .search-flex-row {
            display: flex;
            justify-content: space-between; /* 좌: 검색필드 / 우: 버튼 */
            align-items: flex-end;          /* 하단 정렬 맞추기 */
            width: 100%;
            gap: 16px;
        }

        #btnCompanySearchB::placeholder {
            font-size: 13px; /* 원하는 크기로 */
        }

        /* 스캐너 입고 푸터 : 좌 요약 / 우 버튼 */
        .popup-button.scan-footer {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-end;
        }

        .popup-button.scan-footer .scan-summary {
            margin-right: auto;
            font-weight: 600;
            white-space: nowrap;
        }

        .popup-button.scan-footer .scan-summary span {
            color: #03428E;
        }

        /* ══════════════════════════════════════════════════════════
           태블릿 전용 화면
           ────────────────────────────────────────────────────────
           ★ 이 화면은 태블릿 «전용» 이다. PC 분기를 두지 않는다.
             예전에는 TabletUtil.isTablet() 결과에 따라 레이아웃이
             갈렸는데, 같은 기기에서도 창 폭이나 포인터 판정이
             흔들리면 버튼 크기가 오락가락했다. 기준을 하나로 둔다.
           ★ body.tablet-mode 는 항상 붙는다(ready 에서 무조건 부여).
             선택자는 남겨 둔다 — 공통 레이아웃 CSS 와의 우선순위를
             유지하기 위해서다.
           ══════════════════════════════════════════════════════════ */
        :root {
            --t-ink: #1B2430;
            --t-muted: #6B7688;
            --t-line: #E3E8EF;
            --t-line-soft: #EEF1F6;
            --t-bg: #F4F6FA;
            --t-brand: #03428E;
            --t-brand-soft: #E9F0FA;
            --t-edit: #2F6FEB;
            --t-edit-soft: #F0F5FF;
            --t-danger: #D64545;
            --t-ok: #157F5F;
            --t-radius: 10px;
            --t-tap: 48px;
        }

        /* 모달 컨테이너: 인라인 px 고정 무력화
           [class*="modal"] 같은 넓은 선택자는 중첩 팝업까지 물어
           품목/구매처 조회 팝업의 레이아웃을 깨뜨린다. 쓰지 않는다. */
        body.tablet-mode .modal,
        body.tablet-mode .popup-draggable {
            width: 96vw !important;
            max-width: 96vw !important;
            height: auto !important;
            max-height: 94vh !important;
            left: 2vw !important;
            top: 3vh !important;
            transform: none !important;
            border-radius: 14px;
            box-shadow: 0 18px 48px rgba(20, 32, 55, .22);
            overflow: hidden;
        }

        /* ★ 모달 높이를 잘라 두고 스크롤을 안 주면
           하단 버튼(저장/닫기)이 잘려 사라진다. */
        body.tablet-mode .content_wrap,
        body.tablet-mode .modal > .modal-body,
        body.tablet-mode .popup-draggable > .modal-body {
            max-height: calc(94vh - 62px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        body.tablet-mode .content_wrap.popup {
            padding: 14px 16px 0;
            background: #fff;
        }

        /* ── 아직 wijmo 로 남아 있는 그리드 ─────────────────────
           본문 목록(#material-storehouse-grid)과 공통 조회 팝업
           (품목/구매처)이다. 손가락으로 집을 수 있게 행을 키운다. */
        body.tablet-mode .modal .wj-flexgrid,
        body.tablet-mode .popup-draggable .wj-flexgrid {
            max-height: 44vh;
        }

        body.tablet-mode .wj-flexgrid {
            touch-action: pan-x pan-y;
            border-radius: var(--t-radius);
            border-color: var(--t-line);
        }

        body.tablet-mode .wj-flexgrid .wj-cell {
            min-height: 44px;
            padding-top: 11px;
            padding-bottom: 11px;
            font-size: 14px;
        }

        body.tablet-mode .wj-flexgrid .wj-colheaders .wj-cell {
            background: #F2F5FA;
            font-weight: 700;
            color: #2A3550;
        }

        /* ── 터치 타겟 ─────────────────────────────────────────── */
        body.tablet-mode .btn,
        body.tablet-mode .btn-popup,
        body.tablet-mode .btn-delete {
            min-height: var(--t-tap);
            min-width: var(--t-tap);
            padding: 0 18px;
            font-size: 15px;
            line-height: var(--t-tap);
            border-radius: 8px;
        }

        body.tablet-mode input,
        body.tablet-mode select,
        body.tablet-mode textarea {
            min-height: 46px;
            font-size: 16px;   /* iOS 자동 확대 방지 — 16px 미만이면 줌인됨 */
            border-radius: 8px;
        }

        body.tablet-mode textarea {
            padding: 8px 10px;
            line-height: 1.5;
        }

        /* ── 상단 페이지 헤더 / 검색 카드 ──────────────────────── */
        body.tablet-mode .page-title-wrap h2 {
            font-size: 22px;
            letter-spacing: -.3px;
        }

        body.tablet-mode .section-top {
            background: #fff;
            border: 1px solid var(--t-line);
            border-radius: var(--t-radius);
            padding: 12px 14px;
            margin-bottom: 10px;
        }

        body.tablet-mode .content_wrap.popup .section-top {
            padding: 10px 12px;
        }

        body.tablet-mode .search-flex-row { flex-wrap: wrap; gap: 10px; }
        body.tablet-mode .search-wrap { flex-wrap: wrap; gap: 10px 14px; }

        /* 상단 기능 버튼 줄 — 한 줄에 다 못 들어가면 접힌다 */
        body.tablet-mode .section-top .button-wrap ul {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        body.tablet-mode .section-top .button-wrap .btn {
            background: #fff;
            border: 1px solid var(--t-line);
            color: var(--t-ink);
            font-weight: 600;
        }

        body.tablet-mode .section-top .button-wrap li:first-child .btn,
        body.tablet-mode .section-top .button-wrap li:nth-child(2) .btn {
            background: var(--t-brand);
            border-color: var(--t-brand);
            color: #fff;
        }

        /* ── 팝업 하단 버튼바 ──────────────────────────────────── */
        /* 스티키 푸터는 뒤따르는 형제를 덮는다.
           버튼바 뒤에 내용이 오는 팝업이 없도록 마크업을 맞춰 둘 것. */
        body.tablet-mode .popup-button {
            position: sticky;
            bottom: 0;
            background: #fff;
            padding: 12px 0;
            margin-top: 12px;
            border-top: 1px solid var(--t-line);
            z-index: 10;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-end;
        }

        body.tablet-mode .popup-button .btn-popup {
            background: #fff;
            border: 1px solid var(--t-line);
            color: var(--t-ink);
            font-weight: 600;
        }

        /* 첫 버튼 = 그 팝업의 주행동. 색으로 구분해 둔다 */
        body.tablet-mode .popup-button .btn-popup:first-of-type {
            background: var(--t-brand);
            border-color: var(--t-brand);
            color: #fff;
        }

        body.tablet-mode .popup-button .btn-popup:disabled {
            opacity: .45;
        }

        /* 스캔 입력창 강조 */
        body.tablet-mode #scanBarcode {
            height: 56px !important;
            font-size: 19px !important;
            letter-spacing: .5px;
        }

        /* write-table(입력 폼) 을 태블릿 크기로 */
        body.tablet-mode .write-table th {
            font-size: 14px;
            color: var(--t-muted);
            font-weight: 600;
            white-space: nowrap;
        }

        body.tablet-mode .write-table td {
            padding: 6px 8px;
        }

        /* ══════════════════════════════════════════════════════════
           TGrid — 팝업 안에서 쓰는 <table> 그리드
           ────────────────────────────────────────────────────────
           ★ 모달 그리드는 캔버스(wijmo)가 아니라 실제 표로 그린다.
             가상 스크롤 그리드는 팝업 높이가 바뀔 때마다 invalidate
             를 불러야 하고, 셀 편집기가 손가락 위치와 어긋난다.
           ★ 편집 가능한 칸은 «파란 테두리 입력상자» 로 보이게 한다.
             어디를 만질 수 있는지 표에서 바로 읽혀야 한다.
           ══════════════════════════════════════════════════════════ */
        .tg-host { width: 100%; }

        .tg-wrap {
            border: 1px solid var(--t-line);
            border-radius: var(--t-radius);
            background: #fff;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }

        table.tg {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 15px;
            color: var(--t-ink);
        }

        table.tg thead th {
            position: sticky;
            top: 0;
            z-index: 3;
            background: #F2F5FA;
            color: #2A3550;
            font-weight: 700;
            font-size: 14px;
            height: 50px;
            padding: 0 10px;
            text-align: center;
            white-space: nowrap;
            border-bottom: 1px solid var(--t-line);
            border-right: 1px solid var(--t-line-soft);
        }

        table.tg thead th:last-child { border-right: 0; }

        /* 입력 가능한 열 머리 — 예전 wijmo 에서 파란 글씨로 쓰던 표시 */
        table.tg thead th.tg-h-edit { color: var(--t-edit); }
        table.tg thead th.tg-h-edit::after {
            content: '✎';
            font-size: 12px;
            margin-left: 4px;
            opacity: .7;
        }

        table.tg tbody td {
            height: 54px;
            padding: 5px 10px;
            border-bottom: 1px solid var(--t-line-soft);
            border-right: 1px solid var(--t-line-soft);
            vertical-align: middle;
        }

        table.tg tbody td:last-child { border-right: 0; }
        table.tg tbody tr:last-child td { border-bottom: 0; }
        table.tg tbody tr:nth-child(even) { background: #FBFCFE; }
        table.tg tbody tr.tg-on { background: var(--t-brand-soft); }
        table.tg tbody tr.tg-on td { border-bottom-color: #CFE0F7; }

        table.tg td.tg-l { text-align: left; }
        table.tg td.tg-c { text-align: center; }
        table.tg td.tg-r { text-align: right; font-variant-numeric: tabular-nums; }

        table.tg td.tg-idx,
        table.tg th.tg-idx {
            width: 48px;
            color: var(--t-muted);
            font-size: 13px;
            text-align: center;
            background: #F8FAFC;
        }

        table.tg td.tg-chk,
        table.tg th.tg-chk {
            width: 56px;
            text-align: center;
            background: #F8FAFC;
        }

        table.tg input[type="checkbox"] {
            width: 24px;
            height: 24px;
            min-height: 24px;
            accent-color: var(--t-brand);
            margin: 0;
        }

        /* 셀 안의 입력기 */
        table.tg .tg-in {
            width: 100%;
            min-height: 42px;
            height: 42px;
            font-size: 15px;
            padding: 0 8px;
            border: 1px solid #B9C7DC;
            border-radius: 7px;
            background: var(--t-edit-soft);
            color: var(--t-ink);
            box-sizing: border-box;
        }

        table.tg select.tg-in { padding: 0 4px; }
        table.tg .tg-in.tg-r { text-align: right; }
        table.tg .tg-in:focus {
            outline: none;
            border-color: var(--t-edit);
            box-shadow: 0 0 0 3px rgba(47, 111, 235, .16);
            background: #fff;
        }

        /* 값이 규칙에 어긋나는 칸 — 저장을 막는 칸이다 */
        table.tg .tg-bad {
            border-color: var(--t-danger) !important;
            background: #FDF1F1 !important;
        }

        table.tg td.tg-cell-red { background: #FBE4E1; }
        table.tg td.tg-cell-blue { background: #E1F0F8; }
        table.tg .tg-warn { color: var(--t-danger); font-weight: 700; }
        table.tg .tg-dim { color: var(--t-muted); }

        /* O / X 토글 (입고검사 결과) */
        table.tg .tg-toggle {
            display: inline-flex;
            gap: 8px;
        }

        table.tg .tg-toggle button {
            width: 62px;
            height: 44px;
            border: 1px solid #C3CEDF;
            background: #fff;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 700;
            color: var(--t-muted);
        }

        table.tg .tg-toggle button.on[data-v="O"] {
            background: var(--t-ok);
            border-color: var(--t-ok);
            color: #fff;
        }

        table.tg .tg-toggle button.on[data-v="X"] {
            background: var(--t-danger);
            border-color: var(--t-danger);
            color: #fff;
        }

        .tg-empty {
            text-align: center;
            color: var(--t-muted);
            padding: 34px 10px;
            font-size: 15px;
        }

        /* 본문 목록 — 680px 고정이면 712px 태블릿에서 화면 밖으로 나간다.
           남는 세로 공간에 맞춘다. */
        body.tablet-mode .main-grid {
            height: calc(100vh - 330px);
            min-height: 260px;
        }

        /* ══════════════════════════════════════════════════════════
           사진 첨부 (입고검사)
           ────────────────────────────────────────────────────────
           ★ 부적합 등록 화면과 «같은 방식» 이다. 촬영 / 사진첩 두
             입력을 따로 둔다 — capture="environment" 하나로는 기기에
             따라 사진첩을 못 고르거나 카메라가 안 열린다.
           ══════════════════════════════════════════════════════════ */
        .ph-wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

        .ph-item { position: relative; }

        .ph-item img {
            width: 84px;
            height: 84px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--t-line);
            background: #F6F8FB;
            display: block;
        }

        .ph-item .ph-del {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 28px;
            height: 28px;
            min-height: 28px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: var(--t-danger);
            color: #fff;
            font-size: 15px;
            line-height: 1;
            padding: 0;
        }

        /* 이미 저장된 사진과 이번에 고른 사진을 구분해 둔다.
           저장 버튼을 누르기 전에는 아직 서버에 없다는 뜻이다. */
        .ph-item.ph-new img { border: 2px solid var(--t-edit); }

        .ph-item .ph-tag {
            position: absolute;
            left: 4px;
            bottom: 4px;
            background: rgba(47, 111, 235, .92);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 6px;
        }

        .ph-btns { display: flex; gap: 8px; }

        .ph-btns button {
            height: 84px;
            min-width: 84px;
            padding: 0 12px;
            border: 1.5px dashed #B8C2CC;
            border-radius: 10px;
            background: #F8FAFC;
            color: var(--t-muted);
            font-size: 13px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .ph-btns button span.ic { font-size: 22px; }
        .ph-empty { color: var(--t-muted); font-size: 14px; }

        /* 사진 크게 보기 */
        .ph-view {
            position: fixed;
            inset: 0;
            background: rgba(12, 18, 28, .88);
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .ph-view img { max-width: 100%; max-height: 100%; border-radius: 10px; }

        /* ── 표 안의 사진 버튼 / 줄별 사진 시트 ────────────────────
           발주 입고 표는 줄마다 사진이 따로 붙는다. 셀에 썸네일을
           늘어놓으면 행 높이가 줄마다 달라져 표가 읽히지 않으므로,
           셀에는 «장수만» 두고 실제 편집은 시트에서 한다. */
        table.tg .tg-photo {
            width: 100%;
            height: 42px;
            border: 1px solid #B9C7DC;
            border-radius: 7px;
            background: var(--t-edit-soft);
            color: var(--t-ink);
            font-size: 14px;
            font-weight: 700;
            padding: 0 6px;
        }

        table.tg .tg-photo.on {
            border-color: var(--t-edit);
            background: #fff;
            color: var(--t-edit);
        }

        .ph-sheet {
            position: fixed;
            inset: 0;
            background: rgba(12, 18, 28, .55);
            z-index: 19000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .ph-sheet .ph-box {
            background: #fff;
            border-radius: 14px;
            width: min(760px, 94vw);
            max-height: 88vh;
            overflow: auto;
            padding: 18px 20px 20px;
            box-shadow: 0 18px 48px rgba(20, 32, 55, .28);
        }

        .ph-sheet .ph-hd {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 4px;
        }

        .ph-sheet .ph-hd h3 { font-size: 18px; margin: 0; }
        .ph-sheet .ph-sub { color: var(--t-muted); font-size: 14px; margin: 0 0 14px; }

        .ph-sheet .ph-done {
            min-height: 48px;
            padding: 0 22px;
            border: 0;
            border-radius: 8px;
            background: var(--t-brand);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
        }

        .ph-view .ph-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 0;
            background: rgba(255, 255, 255, .16);
            color: #fff;
            font-size: 22px;
        }

        /* 연속 검사 진행 표시 */
        .test-progress {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--t-brand-soft);
            color: var(--t-brand);
            font-weight: 700;
            font-size: 14px;
            border-radius: 999px;
            padding: 6px 14px;
            margin-left: 10px;
        }

        /* 표 위 요약줄 — 건수/합계를 표 밖에 둔다 */
        .tg-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 6px;
            font-size: 14px;
            color: var(--t-muted);
        }

        .tg-bar b { color: var(--t-brand); font-size: 15px; }

        /* ══ 카메라 바코드 스캔 ═════════════════════════════════════
           HID 스캐너(DS2278)가 없는 자리 — 태블릿·폰 내장 카메라로 찍는다.
           인식값은 #scanBarcode 와 «완전히 같은 경로»(handlePoScan /
           handleItemScan)로 흘려보낸다. 여기서 따로 처리를 만들면
           규칙이 두 벌이 되어 한쪽만 고쳤을 때 조용히 갈라진다. */
        .camscan {
            margin-top: 8px;
            border: 1px solid #E5E7EC;
            border-radius: 8px;
            padding: 10px;
            background: #FAFBFC;
        }

        .camscan-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .camscan-head .cam-hint {
            margin-right: auto;
            font-weight: 400;
            font-size: 12px;
            color: #888;
        }

        .camscan-body {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .camwrap {
            position: relative;
            flex: 0 0 320px;
            background: #0d1417;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
        }

        .camwrap video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .camwrap .camframe {
            position: absolute;
            inset: 14% 8%;
            border: 3px solid rgba(255, 255, 255, .85);
            border-radius: 8px;
            box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .25);
        }

        .camwrap .camframe.hit {
            border-color: #31C48D;
        }

        .camwrap .cammsg {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 8px 10px;
            background: rgba(13, 20, 23, .72);
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
        }

        .camlist {
            flex: 1;
            min-width: 0;
            max-height: 240px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .camrow {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 10px;
            border: 1px solid #E5E7EC;
            border-radius: 6px;
            background: #fff;
        }

        .camrow.ok {
            border-color: #31C48D;
            background: #F3FAF7;
        }

        .camrow.err {
            border-color: #E02424;
            background: #FDF2F2;
        }

        .camrow .cm-t {
            flex: 1;
            min-width: 0;
        }

        .camrow .cm-n {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .camrow .cm-c {
            font-size: 11px;
            color: #888;
            word-break: break-all;
        }

        body.tablet-mode .camwrap { flex: 0 0 40vw; }

<th:block layout:fragment="scripts">
    <script type="text/javascript" th:src="@{/resource/jsBarcode/JsBarcode.all.min.js}"></script>
    <th:block th:replace="/common/popup_material :: popup_material"></th:block>
    <th:block th:replace="/common/popup_company :: popup_company"></th:block>

    <script th:inline="javascript">
        /* 로그인 사용자의 소속 공장. 없으면 null → «전체» 가 기본값이 된다 */
        const factory_id = [[${session.factory_id}]];
    </script>
    <script type="text/javascript">
        // ===== 태블릿 유틸 =====
        /* ★ 이 화면은 «태블릿 전용» 이다.
             예전에는 폭+포인터로 PC/태블릿을 갈랐는데, 같은 기기에서도
             창 폭이나 포인터 판정이 흔들리면 버튼 크기·모달 크기가
             오락가락했다. 판정을 없애고 항상 태블릿 규칙으로 그린다.
             (isTablet() 은 호출부가 많아 남겨 두되 항상 true 다) */
        const TabletUtil = {
            isTouch() {
                return true;
            },

            isTablet() {
                return true;
            },

            // 모달 크기: 뷰포트를 넘지 않도록 항상 잘라 준다
            size(w, h) {
                return {
                    width: Math.min(w, Math.floor(window.innerWidth * 0.96)),
                    height: Math.min(h, Math.floor(window.innerHeight * 0.94))
                };
            },

            applyBodyClass() {
                document.body.classList.add('tablet-mode');
            }
        };

        window.addEventListener('resize', () => TabletUtil.applyBodyClass());

        /* ══════════════════════════════════════════════════════════════
           TGrid — 팝업(모달) 전용 <table> 그리드
           ────────────────────────────────────────────────────────────
           ★ 모달 안의 그리드는 wijmo FlexGrid 를 쓰지 않는다.
             캔버스+가상스크롤 방식은 팝업 높이가 바뀔 때마다
             invalidate() 를 불러 줘야 하고, 태블릿에서는 셀 편집기가
             손가락 위치와 어긋난다. 여기서는 진짜 <table> 을 그린다.
           ★ 호출부를 그대로 살리려고 wijmo 의 겉모습을 흉내낸다.
               itemsSource / collectionView
               rows[].isSelected / rows[].dataItem / selectedItems
               refresh() / invalidate() / cellEditEnded.addHandler()
             그래서 저장 버튼 쪽 코드는 손대지 않아도 된다.
           ★ 편집 가능한 칸은 «입력상자» 로 보인다. 어디를 만질 수
             있는지가 표에서 바로 읽혀야 현장에서 헤매지 않는다.
           ══════════════════════════════════════════════════════════════ */

        /* wijmo.collections.CollectionView 자리에 들어가는 최소 구현.
           items / sourceCollection / refresh / remove 만 쓰인다. */
        class TDataView {
            constructor(items) {
                this._items = items || [];
                this.grid = null;
            }

            get items() {
                return this._items;
            }

            set items(v) {
                this._items = v || [];
                this.refresh();
            }

            get sourceCollection() {
                return this._items;
            }

            set sourceCollection(v) {
                this._items = v || [];
                this.refresh();
            }

            refresh() {
                if (this.grid) this.grid.render();
            }

            remove(item) {
                const i = this._items.indexOf(item);
                if (i > -1) this._items.splice(i, 1);
                this.refresh();
            }

            push(item) {
                this._items.push(item);
                this.refresh();
            }
        }

        class TRow {
            constructor(grid, item, index) {
                this.grid = grid;
                this.dataItem = item;
                this.index = index;
            }

            get isSelected() {
                return this.grid._sel.has(this.dataItem);
            }

            set isSelected(v) {
                if (v) this.grid._sel.add(this.dataItem);
                else this.grid._sel.delete(this.dataItem);
            }
        }

        class TGrid {
            /**
             * @param host   컨테이너 (선택자 / DOM / jQuery)
             * @param opt.columns      열 정의
             * @param opt.height       표 영역 최대 높이 (CSS 값, 기본 '42vh')
             * @param opt.selectable   체크박스 선택 열 사용 여부
             * @param opt.showIndex    순번 열 사용 여부
             */
            constructor(host, opt) {
                opt = opt || {};
                this.host = TGrid._el(host);
                this.host.classList.add('tg-host');
                this.host.style.height = '';          // 템플릿의 인라인 height 무효화

                this.allColumns = opt.columns || [];
                this.columns = this.allColumns.filter(c => c.visible !== false);
                this.selectable = opt.selectable === true;
                this.showIndex = opt.showIndex !== false;
                this.emptyText = opt.emptyText || '조회된 자료가 없습니다.';
                this.height = opt.height || '42vh';
                this.summary = opt.summary === true;
                this.onSelectionChanged = opt.onSelectionChanged || null;
                this.onCellChanged = opt.onCellChanged || null;

                /* wijmo 이벤트 흉내 — addHandler 만 있으면 된다 */
                this.cellEditEnded = TGrid._event();
                this.selectionChanged = TGrid._event();

                this._sel = new Set();
                this._rows = [];
                this.downloadFileName = '';

                this._build();
                this.itemsSource = opt.itemsSource || new TDataView([]);
            }

            static _el(h) {
                /* ★ 팝업 안에서는 $content.find() 로 «그 팝업의» 요소를 넘긴다.
                     document.querySelector('#id') 로 찾으면 같은 id 를 쓰는
                     다른 팝업이 열려 있을 때 엉뚱한 곳에 표가 그려진다. */
                let el = null;
                if (!h) el = null;
                else if (typeof h === 'string') el = document.querySelector(h);
                else if (h.jquery) el = h[0] || null;
                else el = h;
                if (!el) throw new Error('TGrid: 표를 그릴 대상을 찾지 못했습니다.');
                return el;
            }

            static _event() {
                return {
                    _h: [],
                    addHandler(fn) {
                        this._h.push(fn);
                    },
                    raise(s, e) {
                        this._h.forEach(fn => fn(s, e));
                    }
                };
            }

            /* ── 구조 ────────────────────────────────────────────── */
            _build() {
                this.host.innerHTML = '';

                /* ★ 건수는 표 «밖» 에 둔다. 표 안에 합계행을 넣으면
                     스크롤을 내려야 보이는데, 태블릿에서는 저장 버튼과
                     표가 멀어 «몇 건을 저장하는지» 를 놓치기 쉽다. */
                if (this.summary) {
                    this.bar = document.createElement('div');
                    this.bar.className = 'tg-bar';
                    this.host.appendChild(this.bar);
                }

                this.wrap = document.createElement('div');
                this.wrap.className = 'tg-wrap';
                this.wrap.style.maxHeight = this.height;

                this.table = document.createElement('table');
                this.table.className = 'tg';

                this.colgroup = document.createElement('colgroup');
                this.thead = document.createElement('thead');
                this.tbody = document.createElement('tbody');

                this.table.appendChild(this.colgroup);
                this.table.appendChild(this.thead);
                this.table.appendChild(this.tbody);
                this.wrap.appendChild(this.table);
                this.host.appendChild(this.wrap);

                this._buildHead();
            }

            _buildHead() {
                this.colgroup.innerHTML = '';
                this.thead.innerHTML = '';

                const tr = document.createElement('tr');
                let minW = 0;

                const addCol = (w, cls) => {
                    const c = document.createElement('col');
                    if (w) {
                        c.style.width = w + 'px';
                        minW += w;
                    }
                    if (cls) c.className = cls;
                    this.colgroup.appendChild(c);
                };

                if (this.selectable) {
                    addCol(56);
                    const th = document.createElement('th');
                    th.className = 'tg-chk';
                    const all = document.createElement('input');
                    all.type = 'checkbox';
                    all.addEventListener('change', () => this._toggleAll(all.checked));
                    this._allChk = all;
                    th.appendChild(all);
                    tr.appendChild(th);
                }

                if (this.showIndex) {
                    addCol(48);
                    const th = document.createElement('th');
                    th.className = 'tg-idx';
                    th.textContent = 'No';
                    tr.appendChild(th);
                }

                this.columns.forEach(col => {
                    addCol(typeof col.width === 'number' ? col.width : 0);
                    const th = document.createElement('th');
                    th.textContent = col.header || '';
                    if (!TGrid._ro(col)) th.classList.add('tg-h-edit');
                    tr.appendChild(th);
                });

                this.table.style.minWidth = minW ? minW + 'px' : '';
                this.thead.appendChild(tr);
            }

            static _ro(col) {
                return col.readOnly === true || col.isReadOnly === true || !col.binding;
            }

            /* ── 데이터 ──────────────────────────────────────────── */
            set itemsSource(v) {
                if (Array.isArray(v)) v = new TDataView(v);
                if (this._cv) this._cv.grid = null;
                this._cv = v || new TDataView([]);
                this._cv.grid = this;
                this._sel.clear();
                this.render();
            }

            get itemsSource() {
                return this._cv;
            }

            /* wijmo 호출부 호환 */
            get collectionView() {
                return this._cv;
            }

            get rows() {
                return this._rows;
            }

            get hostElement() {
                return this.host;
            }

            get selectedItems() {
                return this._cv.items.filter(it => this._sel.has(it));
            }

            addRow(item) {
                this._cv.items.push(item);
                this.render();
                return item;
            }

            invalidate() {
                this.render();
            }

            refresh() {
                this.render();
            }

            selectAll(on) {
                this._toggleAll(on !== false);
            }

            _toggleAll(on) {
                this._cv.items.forEach(it => on ? this._sel.add(it) : this._sel.delete(it));
                this.render();
                this._fireSelection();
            }

            _fireSelection() {
                if (this.onSelectionChanged) this.onSelectionChanged(this.selectedItems, this);
                this.selectionChanged.raise(this, {});
            }

            /* ── 그리기 ──────────────────────────────────────────── */
            render() {
                const items = (this._cv && this._cv.items) || [];
                this._rows = items.map((it, i) => new TRow(this, it, i));
                this.tbody.innerHTML = '';

                if (!items.length) {
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.className = 'tg-empty';
                    td.colSpan = this.columns.length
                        + (this.selectable ? 1 : 0) + (this.showIndex ? 1 : 0);
                    td.textContent = this.emptyText;
                    tr.appendChild(td);
                    this.tbody.appendChild(tr);
                    this._syncAllChk();
                    this._syncBar();
                    return;
                }

                items.forEach((item, i) => {
                    const tr = document.createElement('tr');
                    if (this._sel.has(item)) tr.classList.add('tg-on');

                    if (this.selectable) {
                        const td = document.createElement('td');
                        td.className = 'tg-chk';
                        const chk = document.createElement('input');
                        chk.type = 'checkbox';
                        chk.checked = this._sel.has(item);

                        /* ★ 체크박스와 «줄 탭» 이 같은 함수를 부른다.
                             예전에는 줄을 탭하면 체크박스에 change 이벤트를
                             만들어 보냈는데, 규칙이 두 곳에 생기면 한쪽만
                             고쳤을 때 조용히 갈라진다. 여기 한 곳만 둔다. */
                        const setOn = (on) => {
                            chk.checked = on;
                            if (on) this._sel.add(item);
                            else this._sel.delete(item);
                            tr.classList.toggle('tg-on', on);
                            this._syncAllChk();
                            this._syncBar();
                            this._fireSelection();
                        };

                        chk.addEventListener('change', () => setOn(chk.checked));
                        td.appendChild(chk);
                        tr.appendChild(td);

                        /* ★ 줄 아무 데나 한 번 탭하면 선택된다.
                             체크박스만 눌러야 했을 때는 24px 짜리 네모를
                             손가락으로 겨냥해야 해서 옆 줄이 눌리기 일쑤였다.
                             입력칸·버튼을 누른 것이면 그쪽 몫이니 비켜 준다. */
                        tr.addEventListener('click', function (ev) {
                            if (ev.target.closest('input, select, textarea, button, a, label')) return;
                            setOn(!chk.checked);
                        });
                    }

                    if (this.showIndex) {
                        const td = document.createElement('td');
                        td.className = 'tg-idx';
                        td.textContent = (i + 1).toString();
                        tr.appendChild(td);
                    }

                    this.columns.forEach(col => tr.appendChild(this._cell(col, item)));
                    this.tbody.appendChild(tr);
                });

                this._syncAllChk();
                this._syncBar();
            }

            _syncBar() {
                if (!this.bar) return;
                const n = (this._cv && this._cv.items.length) || 0;
                this.bar.innerHTML = '총 <b>' + n + '</b>건'
                    + (this.selectable ? ' · 선택 <b>' + this._sel.size + '</b>건' : '');
            }

            _syncAllChk() {
                if (!this._allChk) return;
                const n = (this._cv && this._cv.items.length) || 0;
                this._allChk.checked = n > 0 && this._sel.size === n;
                this._allChk.indeterminate = this._sel.size > 0 && this._sel.size < n;
            }

            _cell(col, item) {
                const td = document.createElement('td');
                td.className = 'tg-' + ((col.align || 'left')[0] === 'r' ? 'r'
                    : (col.align || 'left')[0] === 'c' ? 'c' : 'l');

                if (col.cellClass) {
                    const c = col.cellClass(item, this);
                    if (c) td.classList.add(c);
                }

                /* 완전 커스텀 셀 — 표시 규칙이 값 하나로 안 끝나는 칸 */
                if (col.render) {
                    col.render(item, td, this);
                    return td;
                }

                if (TGrid._ro(col)) {
                    td.textContent = TGrid.fmt(item[col.binding], col);
                    return td;
                }

                td.appendChild(this._editor(col, item, td));
                return td;
            }

            _editor(col, item, td) {
                const _this = this;
                const type = col.type || (col.options ? 'select'
                    : (col.format === 'n0' ? 'number' : 'text'));
                let el;

                if (type === 'select') {
                    el = document.createElement('select');
                    (col.options || []).forEach(o => {
                        const op = document.createElement('option');
                        op.value = o.value;
                        op.textContent = o.text;
                        el.appendChild(op);
                    });
                    el.value = item[col.binding] == null ? '' : String(item[col.binding]);
                } else {
                    el = document.createElement('input');
                    el.type = (type === 'number') ? 'number' : (type === 'date' ? 'date' : 'text');
                    if (col.min != null) el.min = col.min;
                    if (col.max != null) el.max = col.max;
                    if (col.step != null) el.step = col.step;
                    if (col.placeholder) el.placeholder = col.placeholder;
                    const v = item[col.binding];
                    el.value = (v == null) ? '' : v;
                    if (type === 'number') el.classList.add('tg-r');
                }

                el.className += ' tg-in';
                if (col.badWhen && col.badWhen(item, this)) el.classList.add('tg-bad');

                /* 값이 비었을 때 채워 넣을 기본값 — 예전 beginningEdit 자리 */
                if (col.fillOnFocus) {
                    el.addEventListener('focus', function () {
                        if (el.value === '' || el.value == null) {
                            const d = col.fillOnFocus(item, _this);
                            if (d != null && d !== '') {
                                el.value = d;
                                _this._commit(col, item, el, td);
                            }
                        }
                    });
                }

                const commit = function () {
                    _this._commit(col, item, el, td);
                };
                el.addEventListener('change', commit);
                if (type === 'text') el.addEventListener('blur', commit);

                return el;
            }

            _commit(col, item, el, td) {
                let val = el.value;
                const type = col.type || (col.options ? 'select'
                    : (col.format === 'n0' ? 'number' : 'text'));

                if (type === 'number') val = (val === '' ? '' : Number(val));

                if (col.onChange) {
                    const r = col.onChange(item, val, this);
                    if (r !== undefined) val = r;      // 보정된 값을 돌려줄 수 있다
                }

                item[col.binding] = val;
                if (type === 'number' && val !== '') el.value = val;

                if (col.badWhen) el.classList.toggle('tg-bad', !!col.badWhen(item, this));

                if (this.onCellChanged) this.onCellChanged(item, col, val, this);
                this.cellEditEnded.raise(this, {col: col, item: item, value: val});
            }

            static fmt(v, col) {
                if (v == null || v === '') return '';
                if (col && col.format === 'n0') {
                    const n = Number(v);
                    return isNaN(n) ? String(v) : n.toLocaleString();
                }
                return String(v);
            }
        }

        /* ══════════════════════════════════════════════════════════════
           PhotoUtil — 검사 사진 첨부
           ────────────────────────────────────────────────────────────
           부적합 등록 화면(prod_defect_f1)과 «같은 규칙» 을 쓴다.
           한쪽만 고치면 두 화면의 사진 처리가 조용히 갈라진다.

           ★ 원본을 그대로 보내지 않는다.
             태블릿 카메라 한 장이 수 MB 라 form-urlencoded 전체가
             Tomcat maxPostSize(기본 2MB)에 걸린다. 걸리면 예외가 아니라
             «파라미터가 조용히 잘려» 사진만 사라진다.
             긴 변 1280px · JPEG 0.7 로 줄인다 (검사 판독에는 충분).

           ★ 사진은 본문 저장과 «분리해서» 한 장씩 보낸다.
             같은 이유다. 여러 장을 한 번에 실으면 역시 잘린다.
           ══════════════════════════════════════════════════════════════ */
        const PhotoUtil = {
            MAX: 1280,
            QUALITY: 0.7,

            // 파일 → 축소된 dataURL. 실패하면 원본 dataURL 로 넘어간다.
            shrink(file, cb) {
                const MAX = this.MAX, Q = this.QUALITY;
                const reader = new FileReader();
                reader.onload = function () {
                    const img = new Image();
                    img.onload = function () {
                        let w = img.width, h = img.height;
                        if (w > MAX || h > MAX) {
                            if (w >= h) {
                                h = Math.round(h * MAX / w);
                                w = MAX;
                            } else {
                                w = Math.round(w * MAX / h);
                                h = MAX;
                            }
                        }
                        const cv = document.createElement('canvas');
                        cv.width = w;
                        cv.height = h;
                        cv.getContext('2d').drawImage(img, 0, 0, w, h);
                        try {
                            cb(cv.toDataURL('image/jpeg', Q));
                        } catch (err) {
                            cb(reader.result);
                        }   // 캔버스 오염 등
                    };
                    img.onerror = function () {
                        cb(reader.result);
                    };
                    img.src = reader.result;
                };
                reader.onerror = function () {
                    cb(null);
                };
                reader.readAsDataURL(file);
            },

            /* 여러 장을 «순차» 로 올린다.
               동시에 던지면 서버 부하도 문제지만 순서가 뒤섞여
               idx 로 부르는 화면에서 사진 순서가 달라진다.
               ★ 첫 장이 실패하면 나머지를 시도하지 않는다.
                 엔드포인트가 없거나(404) 권한이 막힌 경우 남은 장수만큼
                 같은 실패를 반복하고, AjaxUtil 이 실패마다 네이티브
                 alert 를 띄워 「확인」을 N 번 누르게 된다.
                 첫 장 실패는 대개 그 줄 하나가 아니라 «경로 자체» 의 문제다.
                 뒤쪽에서 난 실패는 일시적일 수 있으므로 계속 간다. */
            upload(url, baseParam, list, onDone, onProgress) {
                if (!list || !list.length) {
                    onDone && onDone(0);
                    return;
                }
                let i = 0, failed = 0;
                (function next() {
                    if (i >= list.length) {
                        onDone && onDone(failed, false);
                        return;
                    }
                    onProgress && onProgress(i + 1, list.length);
                    AjaxUtil.postAsyncData(url, $.extend({}, baseParam, {photo: list[i]}),
                        function (res) {
                            const ok = res && res.success !== false;
                            if (!ok) failed++;
                            if (!ok && i === 0) {
                                // 경로가 막혀 있다 — 남은 장은 시도하지 않는다
                                onDone && onDone(list.length, true);
                                return;
                            }
                            i++;
                            next();
                        });
                })();
            },

            // 크게 보기 — 팝업 위에 덮는 단순 오버레이
            view(src) {
                const $v = $('<div class="ph-view"><button type="button" class="ph-close">✕</button>'
                    + '<img alt="검사 사진"></div>');
                $v.find('img').attr('src', src);
                $v.on('click', function (e) {
                    if (e.target === $v[0] || $(e.target).hasClass('ph-close')) $v.remove();
                });
                $('body').append($v);
            },

            /* ══ 줄별 사진 시트 ══════════════════════════════════════
               발주 입고 표는 줄마다 사진이 따로 붙는다. 셀 안에서
               직접 편집하면 행 높이가 줄마다 달라져 표가 무너지므로,
               셀에는 장수만 두고 편집은 여기서 한다.
               list 는 base64 배열이며 «그 자리에서» 수정된다 —
               호출부는 닫힌 뒤 length 만 다시 그리면 된다.
               ★ 카메라/사진첩 input 을 시트마다 새로 만든다.
                 화면에 하나만 두고 돌려쓰면 어느 줄의 사진인지
                 change 시점에 알 수 없다. */
            sheet(opt) {
                const list = opt.list;
                const $s = $('<div class="ph-sheet"><div class="ph-box">'
                    + '<div class="ph-hd"><h3></h3>'
                    + '<button type="button" class="ph-done">확인</button></div>'
                    + '<p class="ph-sub"></p>'
                    + '<div class="ph-wrap"></div>'
                    + '<input type="file" class="ph-cam" accept="image/*" capture="environment" style="display:none">'
                    + '<input type="file" class="ph-lib" accept="image/*" style="display:none" multiple>'
                    + '</div></div>');
                $s.find('h3').text(opt.title || '사진');
                $s.find('.ph-sub').text(opt.subtitle || '');

                const $wrap = $s.find('.ph-wrap');
                const draw = function () {
                    let html = '';
                    list.forEach(function (src, i) {
                        html += '<div class="ph-item ph-new"><img src="' + src + '" alt="사진">'
                            + '<button type="button" class="ph-del" data-del="' + i + '">×</button></div>';
                    });
                    html += '<div class="ph-btns">'
                        + '<button type="button" class="ph-cam-btn"><span class="ic">📷</span>촬영</button>'
                        + '<button type="button" class="ph-lib-btn"><span class="ic">🖼️</span>사진첩</button>'
                        + '</div>';
                    if (!list.length) html += '<span class="ph-empty">여러 장 첨부할 수 있습니다.</span>';
                    $wrap.html(html);
                    opt.onChange && opt.onChange(list);
                };
                draw();

                $wrap.on('click', function (e) {
                    const $t = $(e.target);
                    if ($t.closest('.ph-cam-btn').length) {
                        $s.find('.ph-cam').click();
                        return;
                    }
                    if ($t.closest('.ph-lib-btn').length) {
                        $s.find('.ph-lib').click();
                        return;
                    }
                    const d = $t.attr('data-del');
                    if (d != null) {
                        list.splice(+d, 1);
                        draw();
                        return;
                    }
                    const $img = $t.closest('.ph-item').find('img');
                    if ($img.length) PhotoUtil.view($img.attr('src'));
                });

                const self = this;
                const onPicked = function (e) {
                    const files = e.target.files;
                    if (!files || !files.length) return;
                    Array.prototype.forEach.call(files, function (f) {
                        self.shrink(f, function (dataUrl) {
                            if (!dataUrl) {
                                Notify.error('사진을 읽지 못했습니다.');
                                return;
                            }
                            list.push(dataUrl);
                            draw();
                        });
                    });
                    e.target.value = '';   // 같은 파일을 다시 고를 수 있게
                };
                $s.find('.ph-cam, .ph-lib').on('change', onPicked);

                const close = function () {
                    $s.remove();
                    opt.onClose && opt.onClose(list);
                };
                $s.find('.ph-done').on('click', close);
                $s.on('click', function (e) {
                    if (e.target === $s[0]) close();
                });

                $('body').append($s);
                return $s;
            }
        };

                        {binding: 'lot_count', header: '로트개수', width: 80, align: 'center'},

                        {binding: 'judge_code', header: '입고검사 판정', width: 100, align: 'center'},
                        {binding: 'lot_use', header: '로트관리유무', width: 100, align: 'center'},

                    ],
                    itemsSource: new wijmo.collections.CollectionView([]),
                    itemFormatter: (panel, row, col, cell) => {
                        if (panel.cellType === wijmo.grid.CellType.Cell) {
                            const item = panel.rows[row].dataItem;
                            const column = panel.columns[col];

                            // 창고재고 조건부 스타일링
                            if (column.binding === 'HouseStock' && item.HouseStock < 0) {
                                cell.classList.add('redText');
                            }

                            // 전체재고 조건부 스타일링
                            if (column.binding === 'CurrentStock' && item.CurrentStock < item.SafetyStock) {
                                cell.classList.add('redText');

                                cell.textContent = item.mio_pk?.toString(); // 콤마 제거해서 그대로 출력
                            }
                        }
                    }
                });
                new FlexGridContextMenu(this.grid);
                this.grid.downloadFileName = '자재 입출고 내역';

                /* ★ 한 번 탭하면 상세가 열린다 (예전에는 더블클릭/더블탭).
                     장갑 낀 손으로 태블릿에서 두 번 연속 탭을 인식시키는 건
                     생각보다 잘 안 된다 — 두 번째 탭이 30px 밖으로 나가거나
                     350ms 를 넘겨 «아무 일도 안 일어나는» 상태가 잦았다.
                   ★ 유령 클릭(터치 후 300ms 뒤 따라오는 click)으로 팝업이
                     두 번 열리지 않게 짧은 잠금을 둔다. */
                let lastOpenAt = 0;
                this.grid.hostElement.addEventListener('click', function (e) {
                    if (Date.now() - lastOpenAt < 500) return;

                    let ht = _this.grid.hitTest(e);
                    if (ht.cellType !== wijmo.grid.CellType.Cell) return;

                    let item = _this.grid.rows[ht.row]?.dataItem;
                    if (!item) return;

                    lastOpenAt = Date.now();
                    _this.modify([item]); // 배열로 넘기는 걸 유지하려면 이렇게
                });

                // 로트입고 버튼 클릭

                    let $qty = $content.find('#InoutQty');
                    let raw = $qty.val().replace(/,/g, '').replace(/[^0-9-]/g, ''); // 숫자만 남기기

                    if (!raw) {
                        $qty.val('');
                        return;

                    let isNegative = (type === 'recall' || type === 'return');
                    raw = raw.replace(/^-/, ''); // 음수 기호 제거

                    let num = parseInt(raw, 10);
                    if (isNaN(num)) {
                        $qty.val('');
                        return;
                    }

                    let formatted = num.toLocaleString(); // 천 단위 콤마
                    if (isNegative) {
