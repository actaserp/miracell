                $.each(this.storeHouseOptions, function (idx, item) {
                    dicStoreHouse[item.value] = item.text;
                });

                /* 미입고 잔량 = 발주 - 기입고 - 가입고중.
                   ★ 이 계산은 반드시 한 곳에서만 한다.
                     예전에는 beginningEdit 와 체크박스 핸들러에 같은 식이 두 벌 있었고,
                     한쪽만 고치면 「직접 클릭하면 맞는데 체크박스로 고르면 옛 값이 들어가는」
                     상태가 된다. */
                const fnRemainQty = function (item) {
                    if (!item) return 0;
                    const suju = parseFloat(item.SujuQty) || 0;
                    const already = parseFloat(item.SujuQty2) || 0;
                    const pending = parseFloat(item.PendingQty) || 0;
                    return Math.max(suju - already - pending, 0);
                };

                this.baljuInputGrid = new TGrid($content.find('#balju-input-grid'), {
                    height: '40vh',
                    selectable: true,
                    summary: true,
                    /* ★ 체크하면 입고수량이 비어 있는 줄에 잔량을 채운다.
                         예전 hostElement click 핸들러가 하던 일. 계산식은
                         fnRemainQty 한 곳만 쓴다. */
                    onSelectionChanged: function (items, grid) {
                        let touched = false;
                        items.forEach(item => {
                            if ((!item.inputQty || item.inputQty === '') && item.SujuQty) {
                                item.inputQty = fnRemainQty(item);
                                touched = true;
                            }
                        });
                        if (touched) grid.render();
                    },
                    columns: [
                        {binding: 'CompanyName', header: '구매처', width: 130, align: 'left', readOnly: true},
                        {binding: 'Company_id', visible: false, readOnly: true},
                        {binding: 'JumunDate', header: '발주일', width: 110, align: 'center', readOnly: true},
                        {binding: 'JumunNumber', header: '발주번호', width: 145, align: 'center', readOnly: true},
                        {binding: 'product_code', header: '제품코드', width: 95, align: 'left', readOnly: true},
                        {binding: 'product_name', header: '제품명', width: 190, align: 'left', readOnly: true},
                        {binding: 'unit', header: '단위', width: 65, align: 'center', readOnly: true},
                        {binding: 'SujuQty', header: '발주 수량', width: 90, align: 'right', format: 'n0', readOnly: true},
                        {
                            binding: 'SujuQty2',
                            header: '기입고 수량',
                            width: 100,
                            align: 'right',
                            format: 'n0',
                            readOnly: true
                        },
                        // 가입고중 = 수입검사 대기분. 잔량에서 이미 빠져 있으므로
                        // 「발주수량은 남았는데 입고수량이 0으로 뜬다」의 답이 이 칸이다.
                        {
                            binding: 'PendingQty',
                            header: '가입고중',
                            width: 90,
                            align: 'right',
                            format: 'n0',
                            readOnly: true
                        },
                        {
                            /* 미입고 잔량을 표에 «보여» 준다. 예전에는 이 값이 화면 어디에도
                               없어서, 입고수량을 얼마까지 쓸 수 있는지 저장해 봐야 알았다. */
                            binding: '_remain',
                            header: '미입고',
                            width: 90,
                            align: 'right',
                            readOnly: true,
                            render: function (item, td) {
                                const r = fnRemainQty(item);
                                td.textContent = r.toLocaleString();
                                if (r <= 0) td.classList.add('tg-dim');
                            }
                        },
                        {binding: 'DueDate', header: '납기예정일', width: 110, align: 'center', readOnly: true},
                        {
                            binding: 'StoreHouse_id',
                            header: '납품 창고',
                            width: 150,
                            align: 'center',
                            type: 'select',
                            options: this.storeHouseOptions
                        },
                        {
                            /* 빈 칸을 터치하면 잔량이 먼저 들어간다 (예전 beginningEdit) */
                            binding: 'inputQty',
                            header: '입고 수량',
                            width: 120,
                            align: 'right',
                            type: 'number',
                            min: 0,
                            max: 99999,
                            step: 1,
                            fillOnFocus: function (item) {
                                return fnRemainQty(item);
                            },
                            badWhen: function (item) {
                                if (item.inputQty === '' || item.inputQty == null) return false;
                                const v = Number(item.inputQty);
                                return isNaN(v) || v <= 0 || v > fnRemainQty(item);
                            }
                        },
                        {binding: 'Description2', header: '사유', width: 150, align: 'left', type: 'text'},
                        {binding: 'Description', header: '발주 메모', width: 150, align: 'left', readOnly: true}
                    ],
                    itemsSource: new TDataView([])
                });

                this.baljuInputGrid.downloadFileName = '발주 입고';

                $content.find('#btnSearch').on('click', function () {
                    fnLoadBaljuList();
                });

                let start = $content.find('#srchStartDt');
                let end = $content.find('#srchEndDt');

                start.val(CommonUtil.getYYYYMMDD(-7));
                end.val(CommonUtil.getYYYYMMDD());

                let fnLoadBaljuList = function () {
                    let fnsuccess = function (result) {
                        if (result.data !== null) {
                            result.data.forEach(item => {
                                if (item.StoreHouse_id != null && item.StoreHouse_id !== '') {
                                    // 발주에 지정된 창고가 dataMap의 value 타입과 맞도록 정규화.
                                    // 숫자 3 / 문자 "3" 이 섞이면 wijmo가 매칭을 못 해 빈칸이 된다.
                                    const hit = validOpts.find(o => String(o.value) === String(item.StoreHouse_id));
                                    item.StoreHouse_id = hit ? hit.value : (defaultHouse ? defaultHouse.value : item.StoreHouse_id);
                                } else if (defaultHouse) {
                                    item.StoreHouse_id = defaultHouse.value;
                                }
                            });
                            _this.baljuInputGrid.itemsSource = new TDataView(result.data);
                        }
                    };
                    let baljuParam = {
                        'start': start.val(),
                        'end': end.val(),
                        'action': 'read'
                    };
                    AjaxUtil.getAsyncData(_this.url + '/read_balju', baljuParam, fnsuccess);
                };

                fnLoadBaljuList();

                $content.find('#btnBaljuAction').on('click', function () {

                    let url = _this.url + '/save_balju';
                    let items = _this.baljuInputGrid.rows
                    .filter(row => row.isSelected)
                    .map(row => row.dataItem);

                    if (!items || items.length === 0) {
                        Alert.alert('', '저장할 항목을 선택하세요.');
                        return;
                    }

                    for (let i = 0; i < items.length; i++) {
                        const row = items[i];

                        if (!row.StoreHouse_id) {
                            Alert.alert('', '납품 창고를 선택하세요.');
                            return;
                        }

                        if (row.inputQty === null || row.inputQty === undefined || row.inputQty === '') {
                            Alert.alert('', '입고 수량을 입력하세요.');
                            return;
                        }

                        // 추가: 음수 또는 0 체크도 필요할 경우
                        if (isNaN(row.inputQty) || Number(row.inputQty) <= 0) {
                            Alert.alert('', '입고 수량은 0보다 큰 숫자여야 합니다.');
                            return;
                        }

                        // 가입고중인 수량까지 뺀 잔량을 넘지 못하게. 서버도 막지만
                        // 여기서 잡아야 「저장 눌렀는데 에러」 대신 그 자리에서 알 수 있다.
                        const remain = fnRemainQty(row);
                        if (Number(row.inputQty) > remain) {
                            Alert.alert('', (row.product_name || '') + ' · 입고 가능 수량(' + remain
                                + ')을 초과했습니다.'
                                + (Number(row.PendingQty) > 0
                                    ? ' 가입고 대기 ' + row.PendingQty + ' 이 검사 대기중입니다.' : ''));
                            return;
                        }
                    }

                    /* ★ 판정·사진은 여기서 받지 않는다. 입고가 «끝난 뒤»
                         입고검사 모달이 한 건씩 받아 간다.

                       왜 표의 드롭다운을 걷어냈나
                         · test_result 는 "TestMaster_id" 가 NOT NULL 이다.
                           검사유형 없이는 판정을 담을 행 자체를 못 만든다.
                         · 사진은 mio_pk 에 붙는데, 그 번호는 저장 전에는 없다.
                         · test_save 가 이미 판정·항목·확정입고를 다 한다.
                           같은 일을 하는 저장 경로가 둘이면 반드시 갈라진다.
                         입고는 입고만 하고, 검사는 검사 화면이 한다. */
                    const payload = items.map(function (row) {
                        return $.extend({}, row);
                    });

                    const $act = $content.find('#btnBaljuAction');
                    const $actLabel = $act.find('span');
                    const setLabel = function (t) {
                        if ($actLabel.length) $actLabel.text(t); else $act.text(t);
                    };

                    /* 저장 «전» 목록의 mio_pk 를 찍어 둔다.
                       저장 후 새로 생긴 가입고 건만 골라 검사에 태우기 위한 것.
                       품목코드·날짜로 맞추면 같은 품목을 두 번 입고했을 때
                       어느 것인지 못 가린다 — id 차집합이 유일하게 확실하다. */
                    const beforeIds = _this._snapshotMioIds();

                    $act.prop('disabled', true);
                    setLabel('저장 중…');

                    let fnSuccess = function (res) {
                        $act.prop('disabled', false);
                        setLabel('입고처리');

                        if (!res.success) {
                            Alert.alert('', res.message);
                            return;
                        }

                        Notify.success('저장되었습니다');
                        modalContainer.modal.close();
                        page.searchDataBind();

                        /* 새로 생긴 «가입고(미확인)» 건 = 수입검사 대상.
                           검사유형이 없는 품목은 서버가 바로 확정 입고하므로
                           여기 안 잡힌다. 그래서 「검사할지 말지」를 묻는
                           체크박스가 필요 없다 — 대상이 없으면 안 뜬다. */
                        /* ★ 스캐너 입고와 «같은» 큐 빌더를 쓴다.
                             목록에서 못 찾아도(조회기간·창고 필터) 모달이 뜬다. */
                        const srcRows = items.map(function (row) {
                            return {
                                balju_id: row.id,
                                Material_id: row.Material_id,
                                code: row.product_code,
                                name: row.product_name,
                                qty: Number(row.inputQty),
                                effectiveDate: ''
                            };
                        });
                        const pick = _this._buildTestQueue(res, srcRows, beforeIds);

                        if (!pick.list.length) {
                            /* ★ 검사 대상이 아니라서 안 뜨는 것과, 건을 «못 찾아서»
                                 안 뜨는 것은 다르다. 후자는 검사해야 할 건을 놓치는
                                 것이므로 조용히 넘어가지 않는다. */
                            if (pick.unresolved) {
                                Alert.alert('입고검사',
                                    '입고는 저장되었습니다.\n검사 대상 건을 목록에서 찾지 못해\n'
                                    + '검사 창을 띄우지 못했습니다.\n\n'
                                    + '조회기간에 오늘이 포함되어 있는지 확인한 뒤,\n'
                                    + '목록에서 해당 건을 골라 「입고검사」 버튼으로 처리해 주세요.');
                            }
                            return;
                        }

                        _this.showInputTestPopup(pick.list, 0, function () {
                            page.searchDataBind();
                        });
                    };

                    AjaxUtil.postJsonAsyncData(url, payload, fnSuccess);
                });

                // 발주 강제 완료
                $content.find('#btnCompletionMat').on('click', function () {
                    let url = _this.url + '/force-complete';
                    let items = _this.baljuInputGrid.rows
                    .filter(row => row.isSelected)
                    .map(row => row.dataItem);

                    if (!items || items.length === 0) {
                        Alert.alert('', '강제 완료할 항목을 선택하세요.');
                        return;
                    }

                    const baljuPkList = items.map(item => item.id);

                    let fnSuccess = function (res) {
                        if (!res.success) {
                            Alert.alert('', res.message);
                        } else {
                            Notify.success('저장되었습니다');
                            fnLoadBaljuList();
                        }
                    };

                    AjaxUtil.postJsonData(url, {baljuPkList}, fnSuccess);
                });

            }

            addMultiDataPopup(type) {
                let _this = this;
                let content = tmpl('addMultiDataPopup', {});
                let $content = $(content);
                //let form = $('#mat_multi_input_form');
                modalContainer = new PopupDraggable('품목 다중입고 등록');

                modalContainer.open(Object.assign(TabletUtil.size(490, 620), {$content}));
                popup = new matMultiInPopup($content);
            }

            showLotInputPopup() {
                let _this = this;
                let items = _this.grid.selectedItems;
                if (items.length === 0) {
                    Alert.alert('로트입고등록', '선택된 입고 데이터가 없습니다. ', function () {
                    });
                    return;
                }
                if (items[0].inout_state === '미확인') {
                    Alert.alert('로트입고등록', '가입고 자재는 로트입고 할 수 없습니다. ', function () {
                    });
                    return;
                }

                if (items[0].lot_use !== 'Y') {
                    Alert.alert('로트입고등록', '로트관리 안하는 자재는 로트입고 할 수 없습니다. ', function () {
                    });
                    return;
                }
                let item = items[0];
                let content = tmpl('lotInputPopup', {});
                let $content = $(content);
                let modalContainer = new PopupDraggable('로트입고등록');
                modalContainer.open(Object.assign(TabletUtil.size(1000, 600), {$content}));

                this.matLotGrid = new TGrid($content.find('#mat-lot-grid'), {
                    height: '32vh',
                    selectable: false,
                    emptyText: '로트가 없습니다. 「로트계산」을 눌러 발번하세요.',
                    columns: [
                        {
                            binding: 'LotNumber',
                            header: '로트번호',
                            width: 160,
                            align: 'center',
                            readOnly: true,
                            render: function (item, td) {
                                if (item.LotNumber) {
                                    td.textContent = item.LotNumber;
                                } else {
                                    td.textContent = '저장 시 자동채번';
                                    td.classList.add('tg-dim');
                                }
                            }
                        },
                        {binding: 'UnitName', header: '단위', width: 70, align: 'center', readOnly: true},
                        {binding: 'InputDateTime', header: '입고일시', width: 130, align: 'center', readOnly: true},
                        {binding: 'EffectiveDate', header: '유효일시', width: 130, align: 'center', readOnly: true},
                        {binding: 'InputQty', header: '수량', width: 100, align: 'right', format: 'n0', readOnly: true},
                        /* ★ 실물 상자에 «로트가 붙어 있는가» 를 한 칸으로 보여준다.
                             MakerLotNo 가 차 있으면 매입처 라벨의 (10) 로트를 그대로 쓴 것이라
                             그 라벨로 계속 스캔하면 된다 — 바코드를 뽑을 이유가 없다.
                             비어 있으면 EAN-13·무지 자재라 실물에 로트번호가 «없다».
                             그대로 두면 이 재고는 이후 스캔으로 특정할 수 없으므로
                             입고 직후 바코드를 출력해 붙여야 한다. */
                        {
                            binding: 'MakerLotNo',
                            header: '실물 라벨',
                            width: 170,
                            align: 'center',
                            readOnly: true,
                            render: function (item, td) {
                                if (item && item.MakerLotNo) {
                                    td.textContent = item.MakerLotNo;
                                } else {
                                    td.textContent = '바코드 출력 필요';
                                    td.classList.add('tg-warn');
                                }
                            }
                        },
                        {binding: 'Description', header: '비고', width: 220, align: 'left', type: 'text'}
                    ],
                    itemsSource: new TDataView([])
                });

                this.matLotGrid.downloadFileName = '로트 입고 내역';

                let $EffectiveDate = $content.find('#EffectiveDate');
                let $MaterialTypeName = $content.find('#MaterialTypeName');
                let $MaterialName = $content.find('#MaterialName');
                let $ValidDays = $content.find('#ValidDays');
                let $StoreHouseName = $content.find('#StoreHouseName');
                let $UnitName = $content.find('#UnitName');
                let $LotSize = $content.find('#LotSize');
                let $mio_pk = $content.find('#mio_pk');
                let $InputQty = $content.find('#InputQty');
                let $btnLotCalc = $content.find('#btnLotCalc');
                let $btnLotSave = $content.find('#btnLotSave');
                let $btnLotRefresh = $content.find('#btnLotRefresh');


                $MaterialTypeName.val(item.material_type);
                $MaterialName.val(item.material_name);
                $mio_pk.val(item.mio_pk);
                $UnitName.val(item.unit_name);
                $LotSize.val(item.PackingUnitQty);
                $StoreHouseName.val(item.store_house_name);
                $InputQty.val(item.InputQty);
                $ValidDays.val(item.ValidDays);
                if (item.ValidDays) {
                    // 품목에 기본유효일(일수)이 있으면 오늘 + ValidDays
                    $EffectiveDate.val(CommonUtil.getYYYYMMDD(item.ValidDays));
                } else {
                    // 없으면 오늘 날짜
                    $EffectiveDate.val(CommonUtil.getYYYYMMDD());
                }

                /* 이 입고건에 «이미 저장된» 로트와, 그중 쓰인 것이 있는지.
                   계산·저장 버튼이 이 값을 보고 갈린다. */
                let savedLots = [];
                let usedLots = [];
                /* 사용 판정 : 서버가 내려주는 값 중 하나라도 «쓴 흔적» 을 말하면 사용으로 본다.
                   ★ CurrentStock 이 InputQty 보다 적으면 어딘가로 빠져나간 것이다.
                     used_qty / cons_cnt 를 내려주는 서버라면 그 값이 더 정확하다. */
                let isUsedLot = function (r) {
                    if (!r) return false;
                    if (Number(r.used_qty) > 0) return true;
                    if (Number(r.cons_cnt) > 0) return true;
                    if (r.CurrentStock != null && r.InputQty != null
                        && Number(r.CurrentStock) < Number(r.InputQty)) return true;
                    return false;
                };

                let fnLoadLotList = function (mio_pk) {
                    let fnsuccess = function (result) {
                        savedLots = result.data || [];
                        usedLots = savedLots.filter(isUsedLot);
                        /* ★ 예전에는 로트가 있기만 하면 계산을 막았다.
                             그런데 스캔 입고로 만들어진 로트가 남아 있으면 다시 계산할 방법이
                             없어, 사람이 그 위에 계산 결과를 얹어 «중복 입고» 가 생겼다
                             (스캔 33×3 + 계산 99 = 198). 이제는 «쓰인 로트가 있을 때만» 막는다. */
                        if (usedLots.length > 0) {
                            $btnLotCalc.prop('disabled', true);
                            $btnLotSave.prop('disabled', true);
                        } else {
                            $btnLotCalc.prop('disabled', false);
                            $btnLotSave.prop('disabled', false);
                        }
                        _this.matLotGrid.itemsSource = new TDataView(result.data);
                    };
                    let lotParam = {
                        mio_id: mio_pk,
                        action: 'mio_lot_list'
                    };
                    AjaxUtil.getAsyncData(_this.url + '/mio_lot_list', lotParam, fnsuccess);

                };

                fnLoadLotList(item.mio_pk);

                /* 저장할 때 «기존 로트를 갈아끼울지» 여부. 계산 버튼에서 정해진다. */
                let replaceMode = false;

                // 로트계산버튼 클릭
                $btnLotCalc.click(function (e) {
                    /* ★ 쓰인 로트가 하나라도 있으면 손대지 않는다.
                         이미 소비·출고된 로트를 지우면 그 이력이 매달릴 곳을 잃는다. */
                    if (usedLots.length > 0) {
                        Alert.alert('로트계산 불가',
                            '이미 사용된 로트가 있습니다 (' + usedLots.length + '건).\n'
                            + '사용 이력이 있는 로트는 다시 발번할 수 없습니다.');
                        return;
                    }
                    /* 저장된 로트가 있으면 «지우고 새로» 라는 뜻이다 — 사람에게 먼저 확인한다.
                       예전에는 조용히 위에 얹혀 중복 입고가 됐다. */
                    if (savedLots.length > 0 && !replaceMode) {
                        Alert.confirm('로트 재발번',
                            '이미 저장된 로트 ' + savedLots.length + '건이 있습니다.\n'
                            + '기존 로트를 지우고 새로 발번합니다. 계속할까요?',
                            function () {
                                replaceMode = true;
                                $btnLotCalc.click();
                            });
                        return;
                    }
                    _this.matLotGrid.itemsSource.sourceCollection = [];

                    if ($EffectiveDate.val() === '' || $EffectiveDate.val() == null) {
                        Alert.alert('로트저장', '유효 일시를 입력해주세요.', function () {
                        });
                        return;
                    }

                    let inputQty = $InputQty.val();
                    let lotSize = $LotSize.val();
                    let effectedDate = $EffectiveDate.val();

                    if (inputQty === '' || inputQty === 0) {
                        // alert(1);
                        Alert.alert('입고수량', '입고수량이 없습니다.');
                        return;
                    }
                    if (lotSize === '' || lotSize === 0) {
                        // alert(2);
                        Alert.alert('로트당수량', '로트당 수량을 입력해주세요.');
                        return;
                    }
                    let lotCount = (inputQty / lotSize);
                    if (lotCount < 1) {
                        // alert(3);
                        Alert.alert('', '입고수량과 로트당수량을 확인해주세요.');
                        return;
                    }
                    lotCount = Math.ceil(lotCount);
                    let remainQty = Number(inputQty);
                    let now = CommonUtil.getYYYYMMDD();
                    let updatedCollection = [];

                    for (let idx = 0; idx < lotCount; idx++) {
                        let qty = lotSize;
                        if (remainQty < qty) {
                            qty = remainQty;
                        }
                        let r = {
                            InputQty: qty,
                            UnitName: item.unit_name,
                            InputDateTime: now,
                            Description: item.Description,
                            mio_id: item.mio_pk,
                            EffectiveDate: effectedDate,
                            LotNumber: ''
                        };

                        updatedCollection.push(r);
                        remainQty = remainQty - qty;
                    }
                    _this.matLotGrid.itemsSource.sourceCollection = updatedCollection;
                });

                let $btnBarcordPrint = $content.find('#btnBarcordPrint');

                // 바코드출력
                $btnBarcordPrint.click(function (e) {
                    let lotItems = _this.matLotGrid.itemsSource.items;
                    if (lotItems.length == 0) {
                        return;
                    }
                    /* ★ «실물에 로트가 없는» 것만 뽑는다.
                         MakerLotNo 가 차 있으면 매입처 라벨의 (10) 로트를 그대로 쓰고 있어
                         이미 상자에 번호가 붙어 있다 — 우리 번호를 또 붙이면
                         한 상자에 로트번호가 둘이 되어 어느 쪽을 찍어야 할지 갈린다. */
                    let barcodeItems = [];
                    let skipped = 0;
                    $.each(lotItems, function (idx, lotItem) {
                        if (!lotItem.LotNumber) return;
                        if (lotItem.MakerLotNo) {
                            skipped++;
                            return;
                        }   // 라벨 있음 — 출력 안 함
                        barcodeItems.push(lotItem);
                    });

                    if (barcodeItems.length === 0) {
                        Alert.alert('바코드 출력',
                            skipped > 0
                                ? '모든 로트에 매입처 라벨이 있어 출력할 것이 없습니다.\n'
                                + '그 라벨을 그대로 스캔하시면 됩니다.'
                                : '출력할 로트가 없습니다.');
                        return;
                    }
                    if (skipped > 0) {
                        Notify.success('매입처 라벨이 있는 ' + skipped + '건은 제외했습니다.');
                    }
                    _this.showBarcodePrint(barcodeItems);
                });

                // 로트저장
                $btnLotSave.click(function (e) {
                    let lotItems = _this.matLotGrid.itemsSource.items;
                    if (lotItems.length === 0) {
                        Alert.alert('로트저장', '저장할 로트가 없습니다.', function () {
                        });
                        return;
                    }

                    if ($EffectiveDate.val() === '' || $EffectiveDate.val() == null) {
                        Alert.alert('로트저장', '유효 일시를 입력해주세요.', function () {
                        });
                        return;
                    }
                    let qty = Number($InputQty.val());
                    let strLots = JSON.stringify(lotItems);
                    let url = _this.url + '/lot_save';
                    /* ★ 저장 직전에 한 번 더 막는다.
                         목록을 불러온 뒤 다른 사람이 그 로트를 써버렸을 수 있다.
                         최종 판정은 서버 몫이지만, 화면에서 걸러지는 것은 걸러 둔다. */
                    if (usedLots.length > 0) {
                        Alert.alert('로트저장 불가',
                            '이미 사용된 로트가 있습니다 (' + usedLots.length + '건).');
                        return;
                    }
                    let sendData = {
                        mio_id: item.mio_pk,
                        Material_id: item.Material_id,
                        StoreHouse_id: item.StoreHouse_id,
                        /* Y 면 이 입고건의 기존 로트를 지우고 새로 발번한다.
                           서버는 «쓰인 로트가 하나라도 있으면» 거절해야 한다. */
                        replace_yn: replaceMode ? 'Y' : 'N',
                        Q: strLots
                    };

                    let lotSaveCallback = function (result) {
                        if (result.success) {
                            Notify.success('저장했습니다.');

                            fnLoadLotList(item.mio_pk);
                        } else {
                            Notify.error('에러가 발생했습니다.');
                        }
                    };
                    AjaxUtil.postAsyncData(url, sendData, lotSaveCallback);
                });

                // 새로고침
                $btnLotRefresh.click(function (e) {
                    fnLoadLotList(item.mio_pk);
                });
            }

            //입고 검사
            /**
             * 입고검사 팝업.
             * @param queue  연속 검사할 입고 목록. 없으면 본문 목록의 선택 행을 쓴다.
             * @param idx    queue 안에서 지금 검사할 위치 (0부터)
             * @param onDone 큐를 전부 끝냈을 때 부를 함수
             *
             * ★ 발주 입고 저장 직후에도 이 팝업을 그대로 쓴다.
             *   검사 화면을 두 벌 만들면 항목 렌더·판정 규칙이 갈라진다.
             */
            showInputTestPopup(queue, idx, onDone) {
                let _this = this;
                let item, total = 0, pos = 0;

                if (queue && queue.length) {
                    idx = idx || 0;
                    if (idx >= queue.length) {
                        onDone && onDone();
                        return;
                    }
                    item = queue[idx];
                    total = queue.length;
                    pos = idx + 1;
                } else {
                    let items = _this.grid.selectedItems;
                    if (items.length === 0) {
                        Alert.alert('입고검사', '선택된 입고 데이터가 없습니다. ', function () {
                        });
                        return;
                    }
                    item = items[0];
                }

                let content = tmpl('inputTestPopup', {});
                let $content = $(content);
                let modalContainer = new PopupDraggable('입고검사');
                modalContainer.open(Object.assign(TabletUtil.size(1000, 720), {$content}));

                // 다음 건으로 넘어가기 — 저장/건너뛰기 양쪽에서 같은 경로를 쓴다
                const fnNext = function () {
                    modalContainer.modal.close();
                    if (queue && queue.length) {
                        _this.showInputTestPopup(queue, idx + 1, onDone);
                    } else {
                        page.searchDataBind();
                    }
                };

                if (total > 1) {
                    $content.find('#testProgressBar').show();
                    $content.find('#testProgressText').text(
                        '연속 검사 ' + pos + ' / ' + total + '건 · ' + (item.material_name || ''));
                    $content.find('#btnTestSkip').show();
                }
                $content.find('#btnTestSkip').on('click', fnNext);

                /* ★ 판정형(resultType==='S') 항목은 O / X «버튼» 으로 고른다.
                     예전에는 셀을 탭할 때마다 값이 뒤집히는 방식이었는데,
                     지금 값이 O 인지 X 인지 눌러 보기 전에는 알 수 없었고
                     장갑 낀 손으로는 의도치 않게 뒤집히기도 했다.
                     지금 값이 «눌린 버튼» 으로 보이고, 누른 것이 곧 값이다.
                   ★ 측정형은 그대로 숫자·문자 입력칸이다. */
                this.matTestGrid = new TGrid($content.find('#mat-input-test-grid'), {
                    height: '26vh',
                    selectable: false,
                    showIndex: true,
                    emptyText: '검사 항목이 없습니다. 검사유형을 확인하세요.',
                    columns: [
                        {binding: 'name', header: '검사항목', width: 300, align: 'left', readOnly: true},
                        {
                            binding: 'result1',
                            header: '결과값(입력)',
                            width: 400,
                            align: 'center',
                            render: function (item, td, grid) {
                                if (item.resultType === 'S') {
                                    const box = document.createElement('div');
                                    box.className = 'tg-toggle';
                                    ['O', 'X'].forEach(v => {
                                        const b = document.createElement('button');
                                        b.type = 'button';
                                        b.dataset.v = v;
                                        b.textContent = v;
                                        if (item.result1 === v) b.classList.add('on');
                                        b.addEventListener('click', function () {
                                            item.result1 = v;
                                            grid.render();
                                        });
                                        box.appendChild(b);
                                    });
                                    td.appendChild(box);
                                    return;
                                }
                                const inp = document.createElement('input');
                                inp.type = 'text';
                                inp.className = 'tg-in';
                                inp.value = item.result1 == null ? '' : item.result1;
                                const commit = function () {
                                    item.result1 = inp.value;
                                };
                                inp.addEventListener('change', commit);
                                inp.addEventListener('blur', commit);
                                td.appendChild(inp);
                            }
                        }
                    ],
                    itemsSource: new TDataView([])
                });

                this.matTestGrid.downloadFileName = '입고 검사 내역';

                /* ── 검사 사진 ─────────────────────────────────────
                   savedPhotos : 이미 서버에 있는 것 (파일 id 를 들고 있다)
                   newPhotos   : 이번에 고른 것 (아직 base64 문자열)
                   둘을 한 줄에 같이 보여주되, 새 것에는 «새 사진» 표시를 둔다. */
                let savedPhotos = [];
                let newPhotos = [];
                const $photos = $content.find('#testPhotos');
                const photoUrl = function (f) {
                    return _this.url + '/test_photo?file_id=' + f.file_id + '&t=' + Date.now();
                };

                const renderPhotos = function () {
                    let html = '';
                    savedPhotos.forEach(function (f, i) {
                        html += '<div class="ph-item" data-saved="' + i + '">'
                            + '<img src="' + photoUrl(f) + '" alt="검사 사진">'
                            + '<button type="button" class="ph-del" data-del-saved="' + i + '">×</button>'
                            + '</div>';
                    });
                    newPhotos.forEach(function (src, i) {
                        html += '<div class="ph-item ph-new" data-new="' + i + '">'
                            + '<img src="' + src + '" alt="새 검사 사진">'
                            + '<span class="ph-tag">새 사진</span>'
                            + '<button type="button" class="ph-del" data-del-new="' + i + '">×</button>'
                            + '</div>';
                    });
                    html += '<div class="ph-btns">'
                        + '<button type="button" id="btnPhotoCam"><span class="ic">📷</span>촬영</button>'
                        + '<button type="button" id="btnPhotoLib"><span class="ic">🖼️</span>사진첩</button>'
                        + '</div>';
                    if (!savedPhotos.length && !newPhotos.length) {
                        html += '<span class="ph-empty">여러 장 첨부할 수 있습니다.</span>';
                    }
                    $photos.html(html);
                };
                renderPhotos();

                $photos.on('click', function (e) {
                    const $t = $(e.target);

                    if ($t.closest('#btnPhotoCam').length) {
                        $content.find('#testFileCam').click();
                        return;
                    }
                    if ($t.closest('#btnPhotoLib').length) {
                        $content.find('#testFileLib').click();
                        return;
                    }

                    // 아직 안 올린 사진은 목록에서 빼기만 하면 된다
                    const dn = $t.attr('data-del-new');
                    if (dn != null) {
                        newPhotos.splice(+dn, 1);
                        renderPhotos();
                        return;
                    }

                    /* ★ 이미 저장된 사진은 그 자리에서 서버에서 지운다.
                         화면에서만 빼 두고 저장할 때 지우려 하면, 저장을 안 누르고
                         닫았을 때 «지운 줄 알았던» 사진이 그대로 남는다. */
                    const ds = $t.attr('data-del-saved');
                    if (ds != null) {
                        const f = savedPhotos[+ds];
                        Alert.confirm('사진 삭제', '이 사진을 삭제할까요?', function () {
                            AjaxUtil.postAsyncData(_this.url + '/test_photo_delete',
                                {file_id: f.file_id}, function (res) {
                                    if (!res || res.success === false) {
                                        Notify.error('사진 삭제에 실패했습니다.');
                                        return;
                                    }
                                    savedPhotos.splice(+ds, 1);
                                    renderPhotos();
                                });
                        });
                        return;
                    }

                    const $img = $t.closest('.ph-item').find('img');
                    if ($img.length) PhotoUtil.view($img.attr('src'));
                });

                // 촬영·사진첩 둘 다 같은 처리로 모은다 (여러 장 선택 가능)
                const onPicked = function (e) {
                    const files = e.target.files;
                    if (!files || !files.length) return;
                    Array.prototype.forEach.call(files, function (f) {
                        PhotoUtil.shrink(f, function (dataUrl) {
                            if (!dataUrl) {
                                Notify.error('사진을 읽지 못했습니다.');
                                return;
                            }
                            newPhotos.push(dataUrl);
                            renderPhotos();
                        });
                    });
                    e.target.value = '';   // 같은 파일을 다시 고를 수 있게
                };
                $content.find('#testFileCam').on('change', onPicked);
                $content.find('#testFileLib').on('change', onPicked);

                let $EffectiveDate = $content.find('#EffectiveDate');
                let $MaterialTypeName = $content.find('#MaterialTypeName');
                let $MaterialName = $content.find('#MaterialName');
                let $MaterialCode = $content.find('#MaterialCode');
                let $InoutDate = $content.find('#InoutDate');
                let $InoutTime = $content.find('#InoutTime');
                let $btnTestSave = $content.find('#btnTestSave');
                let $btnAllItem = $content.find('#btnAllItem');
                let $TestDate = $content.find('#TestDate');
                let $TestName = $content.find('#TestName');
                let $judgGroup = $content.find('#judgGroup');
                let $testRemark = $content.find('#testRemark');
                let $inputQty = $content.find('#inputQty');
                let $cboTestMaster = $content.find('#cboTestMaster');
                let $testResultId = $content.find('#testResultId');

                $MaterialTypeName.val(item.material_type);
                $MaterialName.val(item.material_name);
                $MaterialCode.val(item.material_code);
                $InoutDate.val(item.InoutDate);
                $InoutTime.val(item.InoutTime);
                /* ★ 검사할 수량 = 가입고분이 있으면 그것, 없으면 이미 확정된 입고분.
                     예전에는 potentialInputQty 만 보고 0 이면 저장 버튼을 숨겼다.
                     수입검사 대상이 아닌 품목은 항상 0 이라 «모달은 열리는데
                     저장을 못 하는» 상태가 된다. */
                const pendingQty = Number(item.potentialInputQty) || 0;
                const confirmedQty = Number(item.InputQty) || 0;
                const testQty = pendingQty > 0 ? pendingQty : confirmedQty;

                $inputQty.val(testQty);
                $content.find('label[for="inputQty"]').text(pendingQty > 0 ? '가입고량' : '입고량');

                if (testQty <= 0) $btnTestSave.hide();
                else $btnTestSave.show();

                if (item.ValidDays) {
                    let valDate = CommonUtil.getYYYYMMDD(item.ValidDays);
                    $EffectiveDate.val(valDate);
                } else if (item._scanEffectiveDate) {
                    /* ★ 스캔 라벨 (17) 에서 읽은 유효기간. 목록에 없는 새 건은
                         ValidDays 를 모르므로 이 값이 유일한 근거다.
                         이미 저장된 검사가 있으면 mio_test_list 가 덮어쓴다. */
                    $EffectiveDate.val(item._scanEffectiveDate);
                }
                $TestDate.val(CommonUtil.getYYYYMMDD());
                $TestName.val(userinfo.username);

                AjaxUtil.fillSelectOptions($cboTestMaster, 'test_master', 'choose', false, '', '', 'import');

                /* 매핑이 없는 품목에 쓸 «기본 검사유형».
                   ★ id 를 박아 넣지 않는다 — 코드 마스터가 바뀌면 조용히 어긋난다.
                     이름으로 «수입/입고» 계열을 먼저 찾고, 없으면 첫 유효 항목을 쓴다. */
                const fnDefaultTestMaster = function () {
                    const opts = $cboTestMaster.find('option').toArray()
                    .map(o => ({v: $(o).attr('value'), t: $(o).text() || ''}))
                    .filter(o => o.v != null && o.v !== '');
                    if (!opts.length) return '';
                    const hit = opts.find(o => /(수입|입고)/.test(o.t))
                        || opts.find(o => /(일반|공통|기본)/.test(o.t));
                    return (hit || opts[0]).v;
                };

                /* 검사유형이 바뀌면 «항목 목록도» 그 유형 것으로 바꾼다.
                   ★ 예전에는 항목이 mio_test_list 가 준 것으로 고정이라,
                     유형만 바뀌고 항목은 그대로였다. 그러면 고른 유형과
                     저장되는 TestItem 이 어긋난다. */
                const fnLoadTestItems = function (testMastId) {
                    AjaxUtil.getAsyncData(_this.url + '/test_item_list',
                        {test_mast_id: testMastId || ''},
                        function (r) {
                            if (!r || r.success === false) return;
                            _this.matTestGrid.itemsSource = new TDataView(r.data || []);
                        });
                };

                // 사람이 직접 바꿨을 때도 같은 규칙을 탄다
                $cboTestMaster.on('change', function () {
                    if ($(this).prop('disabled')) return;
                    fnLoadTestItems($(this).val());
                });

                // $cboTestMaster.val(12)
                AjaxUtil.fillSelectOptions($judgGroup, 'system_code', 'choose', false, 'judg_code');

                let fnLoadTestList = function (mio_pk) {
                    let fnsuccess = function (result) {
                        if (result.data !== null) {
                            _this.matTestGrid.itemsSource.sourceCollection = result.data.mioList;

                            if (result.data.testDate != null) {
                                $TestDate.val(result.data.testDate);
                            }
                            if (result.data.CheckName != null) {
                                $TestName.val(result.data.CheckName);
                            }

                            if (result.data.EffectiveDate != null) {
                                $EffectiveDate.val(result.data.EffectiveDate)
                            }

                            if (result.data.testResultId != null) {
                                $testResultId.val(result.data.testResultId)
                            }

                            if (result.data.testMasterId != null) {
                                // 품목에 매핑된 검사유형 — 바꾸지 못하게 잠근다
                                $cboTestMaster.val(result.data.testMasterId).prop("disabled", true);
                            } else {
                                /* ★ 매핑이 없으면 «기본 검사유형» 을 골라 준다.
                                     test_result."TestMaster_id" 는 NOT NULL 이라
                                     검사유형 없이는 저장 자체가 안 된다. 비워 두면
                                     작업자가 매 건마다 골라야 하고, 안 고르면 막힌다.
                                   ★ 잠그지는 않는다 — 매핑이 없다는 건 우리가 «추측» 했다는
                                     뜻이므로 그 자리에서 바꿀 수 있어야 한다. */
                                $cboTestMaster.prop("disabled", false);
                                const def = fnDefaultTestMaster();
                                if (def) {
                                    $cboTestMaster.val(def);
                                    fnLoadTestItems(def);   // 고른 유형의 항목으로 갈아끼운다
                                }
                            }
                            $judgGroup.val(result.data.JudgeCode);
                            $testRemark.val(result.data.CharResult);

                            /* 이미 저장된 검사면 사진도 같이 내려온다.
                               서버가 아직 안 내려주면 files 가 없을 뿐이라 그냥 비어 있다. */
                            savedPhotos = Array.isArray(result.data.files) ? result.data.files : [];
                            renderPhotos();

                           ★ 붙이는 기준은 «입고 건(mio_id)» 이다. 검사결과 id 로
                             붙이면 신규 검사에서 서버가 그 id 를 안 돌려줄 때

            /* ── 입고 줄 ↔ 새로 생긴 입고건(mio_pk) 맞추기 ──────────
               사진을 «어느 입고 건» 에 붙일지 정하는 곳이다.
               ★ 품목코드만으로 맞추지 않는다. 같은 품목을 한 번에 두 줄
                 입고하면(창고가 다르거나 분납) 어느 쪽인지 못 가린다.
               확실한 순서대로 세 단계를 시도한다. */

            // 저장 직전의 mio_pk 모음. 저장 후 차집합을 내기 위한 것.
            _snapshotMioIds() {
                const items = (this.grid && this.grid.itemsSource && this.grid.itemsSource.items) || [];
                const s = new Set();
                items.forEach(x => s.add(String(x.mio_pk)));
                return s;
            }

            // 서버가 새 입고 id 를 알려주는 경우를 폭넓게 받아 준다.
            _createdIds(res) {
                if (!res) return [];
                let d = res.data;
                if (d == null) d = res.mio_ids;
                if (d == null) return [];
                const arr = Array.isArray(d) ? d : [d];
                return arr.map(function (x) {
                    if (x == null) return null;
                    if (typeof x === 'object') {
                        if (x.mio_pk != null) return x.mio_pk;
                        if (x.mio_id != null) return x.mio_id;
                        if (x.id != null) return x.id;
                        return null;
                    }
                    return x;
                }).filter(v => v != null);
            }

            /**
             * 검사해야 할 «가입고» 건만 골라 순서대로 돌려준다.
             *
             * ★ 서버(save_balju)가 «어느 건이 검사 대상인지» 를 직접 말해 준다.
             *   대상 판정은 material."InTestYN" 이고 서버만 안다. 화면이
             *   상태 문자열('미확인')로 추측하면, 서버가 그 라벨을 조금만
             *   바꿔도 검사 모달이 «조용히» 안 뜬다.
             *
             * ★ 가입고의 진짜 증거는 potentialInputQty > 0 이다.
             *   상태 라벨은 목록 쿼리가 만들어 내는 «표시용» 값이라
             *   여기에 기대지 않는다.
             *
             * @returns {{list: Array, unresolved: boolean}}
             *          unresolved=true → 검사 대상인데 목록에서 못 찾았다(알려야 함)
             */
            _pickPendingInputs(res, beforeIds) {
                const items = (this.grid && this.grid.itemsSource && this.grid.itemsSource.items) || [];

                const byId = new Map();
                items.forEach(x => byId.set(String(x.mio_pk), x));

                /* 1순위 — 서버가 새로 만든 입고건을 알려준 경우.
                   ★ test_yn 과 «무관하게» 전부 태운다. 수입검사 대상이 아니어도
                     사진을 남기거나 육안 판정을 적어 둘 일이 있다.
                     검사 대상 여부는 모달 안에서 «검사유형이 매핑돼 있는가» 로
                     드러나고, 없으면 그 자리에서 고를 수 있다. */
                const rows = Array.isArray(res && res.data) ? res.data : [];
                if (rows.length && rows[0] && typeof rows[0] === 'object' && rows[0].mio_pk != null) {
                    const picked = rows.map(r => byId.get(String(r.mio_pk))).filter(Boolean);
                    return {list: picked, unresolved: picked.length < rows.length};
                }

                // 2순위 — id 만 알려준 경우
                const ids = this._createdIds(res);
                if (ids.length) {
                    const found = ids.map(id => byId.get(String(id)));
                    const picked = found.filter(Boolean);
                    if (picked.length) return {list: picked, unresolved: picked.length < ids.length};
                    return {list: [], unresolved: true};
                }

                // 3순위 — 저장 전후 목록의 차집합
                if (beforeIds) {
                    const fresh = items.filter(x => !beforeIds.has(String(x.mio_pk)));
                    if (fresh.length) return {list: fresh, unresolved: false};
                    return {list: [], unresolved: true};
                }

                return {list: [], unresolved: true};
            }

            /**
             * 저장 응답으로 «입고검사 큐» 를 만든다. (발주입고 · 스캐너입고 공용)
             *
             * ★ 왜 _pickPendingInputs 로 부족했나
             *   그 함수는 새 입고건을 «본문 목록(this.grid)에서 찾아» 돌려준다.
             *   그래서 조회기간·창고·품목군·공장 필터가 새 건을 걸러 내면
             *   list 가 비어 검사 모달이 조용히 안 떴다. 저장은 됐는데 검사만
             *   빠지는, 현장에서 가장 알아채기 어려운 실패다.
             *   («스캔 팝업의 입고창고 기본값은 3, 본문 창고 필터는 다른 값»
             *     이 조합이면 매번 이렇게 된다.)
             *
             * ★ 이제 모달을 여는 데 필요한 건 mio_pk 뿐이다.
             *   나머지 표시값(품목명·수량)은 «방금 저장에 보낸 줄» 로 채운다.
             *   검사항목·판정·유효기간은 어차피 mio_test_list 가 mio_pk 로
             *   다시 내려주므로 정확도가 떨어지지 않는다.
             *   목록에 그 행이 있으면 그쪽을 쓴다(판정 이력까지 붙어 있다).
             *
             * @param res       서버 응답. data = [{mio_pk, balju_id, Material_id, test_yn}]
             * @param srcRows   저장에 보낸 줄을 정규화한 것.
             *                  {balju_id, Material_id, code, name, qty, effectiveDate}
             * @param beforeIds 서버가 mio_pk 를 안 주는 «예전 버전» 대비 스냅샷
             * @returns {{list: Array, unresolved: boolean}}
             */
            _buildTestQueue(res, srcRows, beforeIds) {
                const rows = Array.isArray(res && res.data) ? res.data : [];
                const src = Array.isArray(srcRows) ? srcRows : [];

                /* 서버가 mio_pk 를 안 돌려주는 예전 배포 → 예전 방식(차집합)으로 물러난다.
                   여기까지 오면 목록에 의존하므로 못 찾을 수 있고, 그때는
                   호출부가 «못 찾았다» 안내를 띄운다. */
                if (!rows.length || rows[0] == null
                    || typeof rows[0] !== 'object' || rows[0].mio_pk == null) {
                    return this._pickPendingInputs(res, beforeIds);
                }

                const gridItems = (this.grid && this.grid.itemsSource && this.grid.itemsSource.items) || [];
                const byId = new Map();
                gridItems.forEach(x => byId.set(String(x.mio_pk), x));

                const d = new Date();
                const today = CommonUtil.getYYYYMMDD();
                const hhmm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);

                const list = rows.map(function (r, i) {
                    /* 목록에 있으면 그 행이 «진짜» 다 — 상태·판정이 붙어 있다 */
                    const g = byId.get(String(r.mio_pk));
                    if (g) return g;

                    /* 보낸 줄 찾기 — ① 품목+발주라인 ② 발주라인 ③ 보낸 순서
                         서버가 lines 를 받은 순서대로 created 를 쌓으므로
                         ③ 도 실제로는 거의 항상 맞는다. */
                    let s = null;
                    if (r.Material_id != null) {
                        s = src.find(x => String(x.Material_id) === String(r.Material_id)
                            && String(x.balju_id) === String(r.balju_id));
                    }
                    if (!s && r.balju_id != null) {
                        s = src.find(x => String(x.balju_id) === String(r.balju_id));
                    }
                    if (!s) s = src[i] || null;

                    const waiting = String(r.test_yn) === 'Y';
                    const qty = s ? (Number(s.qty) || 0) : 0;

                    return {
                        mio_pk: r.mio_pk,
                        Material_id: (r.Material_id != null) ? r.Material_id
                            : (s ? s.Material_id : null),
                        material_code: s ? (s.code || '') : '',
                        material_name: s ? (s.name || '') : '',
                        material_type: '',
                        InoutDate: today,
                        InoutTime: hhmm,
                        /* 가입고면 검사 대상 수량, 아니면 이미 확정된 입고량.
                           모달이 이 둘 중 0 이 아닌 쪽을 «검사할 수량» 으로 쓴다. */
                        potentialInputQty: waiting ? qty : 0,
                        InputQty: waiting ? 0 : qty,
                        ValidDays: null,
                        // 스캔으로 읽은 유효기간. 모달 유효기간 칸 프리필용
                        _scanEffectiveDate: s ? (s.effectiveDate || '') : ''
                    };
                });

                return {list: list, unresolved: false};
            }
