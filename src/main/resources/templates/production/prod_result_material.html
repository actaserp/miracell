<html layout:decorate="~{layout_page}">
<head>
    <style>
        .pr-note { color:#8a94a4; font-size:12px; font-weight:700; line-height:1.7; margin-top:10px; }
        .pr-note b { color:#15222B; }
        .pr-sum { display:flex; gap:10px; flex-wrap:wrap; margin:10px 0 8px; }
        .pr-sum .box { background:#f4f7f9; border:1px solid #e2e6ee; border-radius:10px; padding:9px 14px;
            font-size:12.5px; font-weight:800; color:#5a6b76; }
        .pr-sum .box b { color:#0a5c64; font-size:17px; font-variant-numeric:tabular-nums; margin-left:7px; }
        .pr-sum .box.def b { color:#c8483b; }
        .pr-ov { display:none; position:fixed; inset:0; background:rgba(21,34,43,.45); z-index:50;
            align-items:center; justify-content:center; }
        .pr-ov.on { display:flex; }
        .pr-modal { background:#fff; border-radius:12px; width:min(900px,94vw); max-height:86vh;
            display:flex; flex-direction:column; overflow:hidden; }
        .pr-modal-h { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid #e2e6ee; }
        .pr-modal-h .t { font-weight:800; font-size:16px; flex:1; }
        .pr-x { width:34px; height:34px; border:1px solid #e2e6ee; background:#f4f7f9; border-radius:9px;
            font-size:18px; cursor:pointer; }
        .pr-modal-b { padding:14px 18px 18px; overflow:auto; }
    </style>
</head>

<th:block layout:fragment="content">
    <div class="layout-contents">

        <div class="page-title-wrap">
            <div class="left">
                <h2>제품별생산실적</h2>
                <a title="북마크" class="bookmark toggle">내 메뉴</a>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>생산 관리</li>
                <li>제품별생산실적</li>
            </ul>
        </div>

        <section class="section">
            <div class="section-top">
                <div class="search-wrap">
                    <dl>
                        <dt><label for="date_from">작업일<span class="eq">*</span></label></dt>
                        <dd>
                            <ul class="date-box">
                                <li><input type="date" id="date_from" name="date_from">
                                    <label for="date_from" class="hide">시작일</label></li>
                                <li><input type="date" id="date_to" name="date_to">
                                    <label for="date_to" class="hide">종료일</label></li>
                            </ul>
                        </dd>
                    </dl>
                    <dl>
                        <dt><label for="cboFactory">공장</label></dt>
                        <dd>
                            <div class="srch-box">
                                <select id="cboFactory" name="cboFactory">
                                    <option value="">전체</option>
                                    <option value="1">1공장 (키트)</option>
                                    <option value="2">2공장 (M-CELL)</option>
                                </select>
                            </div>
                        </dd>
                    </dl>
                    <dl>
                        <dt><label for="cboProcess">공정</label></dt>
                        <dd>
                            <div class="srch-box">
                                <select id="cboProcess" name="cboProcess"><option value="">전체</option></select>
                            </div>
                        </dd>
                    </dl>
                    <dl>
                        <dt><label for="cboMatType">품목유형</label></dt>
                        <dd><select class="form-control2" id="cboMatType" name="cboMatType"></select></dd>
                    </dl>
                    <dl>
                        <dt><label for="matGrpPk">품목그룹</label></dt>
                        <dd><select class="form-control2" id="matGrpPk" name="matGrpPk"></select></dd>
                    </dl>
                    <dl>
                        <dt>&nbsp;</dt>
                        <dd>
                            <li>
                                <a class="btn btn-delete" title="검색" id="btnMainSearch">
                                    <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                                    검색
                                </a>
                            </li>
                        </dd>
                    </dl>
                </div>
            </div>

            <div class="pr-sum" id="prSum"></div>

            <div class="container-fluid">
                <div id="theGrid" style="height:640px;"></div>
            </div>

            <div class="pr-note">행 하나가 <b>품목</b>입니다. 같은 품목이 여러 공정을 거치면 그 산출이 모두 더해지므로, <b>공정</b> 칸에 어느 공정에서 나온 수량인지 함께 표시합니다. 완제품과 반제품은 성격이 달라 <b>반제품</b> 표시를 붙였고, 상단 합계는 완제품만 셉니다. 행을 더블클릭하면 그 품목의 부적합 내역이 나옵니다.</div>
        </section>

        <div class="pr-ov" id="prOv">
            <div class="pr-modal">
                <div class="pr-modal-h">
                    <div class="t" id="prOvTitle">상세</div>
                    <button type="button" class="pr-x" id="prOvX">×</button>
                </div>
                <div class="pr-modal-b"><div id="prOvGrid" style="height:420px;"></div></div>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <th:block th:replace="/common/columns_setting :: columns_setting"></th:block>
    <script th:inline="javascript">
        /* 로그인 사용자의 소속 공장. 없으면 null → «전체» 가 기본값이 된다 */
        const factory_id = [[${session.factory_id}]];
    </script>
    <script type="text/javascript">

        /* =====================================================================
           제품별생산실적  —  GET /material

           ★ 데이터는 소스 7개를 합친 것이다 (ProdResultService)
               1공장 생산형(mat_produce) · 세척(wash_work) · 멸균(steril_batch)
               2공장 조립/수리(mcell_unit) · 검사(insp_result) · 포장(완제품 차수)
               부적합(defect_regist)

           ★ 기준일은 「끝난 날」이다. ProductionDate 가 아니다 —
             그 값은 작지 지시일을 물고 들어와, 7/28 작지로 8/4 에 작업하면
             8/4 조회에서 사라진다.
        ===================================================================== */
        const PR_BASE = '/api/production/prod_result_v2';

        function prNum(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
        function prComma(v) { return prNum(v).toLocaleString(undefined, {maximumFractionDigits: 2}); }

        /* 상세 오버레이 — 그리드를 갈아 끼워 쓴다 */
        let prOvGrid = null;
        function prOpen(title, columns, rows) {
            $('#prOvTitle').text(title);
            $('#prOv').addClass('on');
            if (!prOvGrid) {
                prOvGrid = new wijmo.grid.FlexGrid('#prOvGrid', {
                    autoGenerateColumns: false,
                    selectionMode: wijmo.grid.SelectionMode.Row,
                    headersVisibility: wijmo.grid.HeadersVisibility.Column,
                    isReadOnly: true
                });
            }
            prOvGrid.columns.clear();
            columns.forEach(c => prOvGrid.columns.push(new wijmo.grid.Column(c)));
            prOvGrid.itemsSource = rows || [];
        }
        $(document).on('click', '#prOvX', () => $('#prOv').removeClass('on'));
        $(document).on('click', '#prOv', function (e) {
            if (e.target === this) $('#prOv').removeClass('on');
        });

        const PR_DEFECT_COLS = [
            {binding: 'defect_date', header: '발생일', width: 100, align: 'center'},
            {binding: 'proc_name',   header: '공정',   width: 100, align: 'center'},
            {binding: 'mat_code',    header: '품목코드', width: 120, align: 'center'},
            {binding: 'mat_name',    header: '품목',   width: 180},
            {binding: 'defect_type', header: '유형',   width: 140, align: 'center'},
            {binding: 'defect_qty',  header: '수량',   width: 80, align: 'right', format: 'n2'},
            {binding: 'unit',        header: '단위',   width: 60, align: 'center'},
            {binding: 'worker',      header: '작업자', width: 100, align: 'center'},
            {binding: 'wo',          header: '작지',   width: 130, align: 'center'},
            {binding: 'description', header: '내용',   width: 220}
        ];

        class ProdResultMaterialPage {
            constructor() {
                this.grid = null;
                this.init();
            }

            init() {
                const _this = this;
                this.grid = new wijmo.grid.FlexGrid('#theGrid', {
                    autoGenerateColumns: false,
                    selectionMode: wijmo.grid.SelectionMode.Row,
                    headersVisibility: wijmo.grid.HeadersVisibility.Column,
                    allowSorting: wijmo.grid.AllowSorting.MultiColumn,
                    allowMerging: wijmo.grid.AllowMerging.Cells,
                    showMarquee: true,
                    isReadOnly: true,
                    formatItem: (s, e) => {
                        if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
                            e.cell.style.textAlign = 'center';
                            return;
                        }
                        if (e.panel.cellType !== wijmo.grid.CellType.Cell) return;
                        /* ★ 셀 DOM 재활용 때문에 매번 비우고 시작한다 (기간별 화면과 같은 이유) */
                        e.cell.style.color = '';
                        e.cell.style.fontWeight = '';

                        const it = s.rows[e.row].dataItem;
                        if (!it) return;
                        const col = s.columns[e.col].binding;
                        if (col === 'defect_percent') {
                            const v = prNum(it.defect_percent);
                            if (v > 3) { e.cell.style.color = '#c8483b'; e.cell.style.fontWeight = '800'; }
                            else if (v > 0) e.cell.style.color = '#c77a00';
                        }
                        /* 완제품 행을 굵게 — 합계에 들어가는 것이 어느 행인지 보이게 */
                        if (it.is_product === 'Y' && col === 'mat_name') e.cell.style.fontWeight = '800';
                    },
                    columns: [
                        {binding: 'mat_type_name', header: '품목유형', width: 100, align: 'center', allowMerging: true},
                        {binding: 'mat_grp_name',  header: '품목그룹', width: 140, align: 'center', allowMerging: true},
                        {binding: 'factory_nm',    header: '공장',   width: 80,  align: 'center'},
                        {binding: 'mat_code',      header: '품목코드', width: 140, align: 'center'},
                        {binding: 'mat_name_disp', header: '품목',   width: 220},
                        {binding: 'unit',          header: '단위',   width: 65,  align: 'center'},
                        {binding: 'proc_names',    header: '공정',   width: 200},
                        {binding: 'work_cnt',      header: '작업건수', width: 90, align: 'right', format: 'n0',
                            aggregate: wijmo.Aggregate.Sum},
                        {binding: 'good_qty',      header: '산출량', width: 105, align: 'right', format: 'n2',
                            aggregate: wijmo.Aggregate.Sum},
                        {binding: 'defect_qty',    header: '부적합', width: 95, align: 'right', format: 'n2',
                            aggregate: wijmo.Aggregate.Sum},
                        {binding: 'defect_percent', header: '불량률(%)', width: 95, align: 'right', format: 'n2'},
                        {binding: 'good_amt',      header: '생산액', width: 120, align: 'right', format: 'n0',
                            aggregate: wijmo.Aggregate.Sum},
                        {binding: 'last_date',     header: '최종작업', width: 105, align: 'center'}
                    ]
                });
                new FlexGridContextMenu(this.grid);
                this.grid.downloadFileName = '제품별생산실적';

                this.grid.addEventListener(this.grid.hostElement, 'dblclick', function () {
                    const it = _this.grid.selectedItems[0];
                    if (it) _this.showDefect(it);
                });
            }

            searchMainData() {
                const param = {
                    date_from:  $('#date_from').val(),
                    date_to:    $('#date_to').val(),
                    factory_id: $('#cboFactory').val(),
                    proc_code:  $('#cboProcess').val(),
                    mat_grp_id: $('#matGrpPk').val(),
                    mat_type:   $('#cboMatType').val()
                };
                const r = AjaxUtil.getSyncData(PR_BASE + '/material', param);
                const rows = (r && r.data) ? r.data : [];
                rows.forEach(x => {
                    x.factory_nm    = (prNum(x.factory_id) === 2) ? '2공장' : '1공장';
                    x.mat_name_disp = (x.is_product === 'Y') ? x.mat_name : (x.mat_name + ' (반제품)');
                });
                this.grid.itemsSource = rows;
                this.renderSum(rows);
            }

            renderSum(rows) {
                const prod = rows.filter(x => x.is_product === 'Y')
                    .reduce((s, x) => s + prNum(x.good_qty), 0);
                const def  = rows.reduce((s, x) => s + prNum(x.defect_qty), 0);
                const amt  = rows.filter(x => x.is_product === 'Y')
                    .reduce((s, x) => s + prNum(x.good_amt), 0);
                $('#prSum').html(
                    '<div class="box">품목<b>' + prComma(rows.length) + '</b></div>' +
                    '<div class="box">완제품 산출<b>' + prComma(prod) + '</b></div>' +
                    '<div class="box">완제품 생산액<b>' + prComma(amt) + '</b></div>' +
                    '<div class="box def">부적합<b>' + prComma(def) + '</b></div>');
            }

            showDefect(it) {
                const r = AjaxUtil.getSyncData(PR_BASE + '/defect_list', {
                    date_from: $('#date_from').val(),
                    date_to:   $('#date_to').val(),
                    mat_id:    it.mat_id
                });
                prOpen(it.mat_name + ' — 부적합 내역', PR_DEFECT_COLS, (r && r.data) ? r.data : []);
            }
        }

        let page = null;

        $(document).ready(function () {
            page = new ProdResultMaterialPage();

            $('#date_from').val(CommonUtil.getYYYYMMDD(-30));
            $('#date_to').val(CommonUtil.getYYYYMMDD());

            AjaxUtil.fillSelectOptions($('#cboMatType'), 'system_code', 'all', false, 'mat_type', 'product,semi');
            AjaxUtil.fillSelectOptions($('#matGrpPk'), 'material_group', 'all', false, 'product,semi');
            $('#cboMatType').on('change', function () {
                AjaxUtil.fillSelectOptions($('#matGrpPk'), 'material_group', 'all', false, $(this).val());
            });

            function fillProcess() {
                const r = AjaxUtil.getSyncData(PR_BASE + '/process_combo', {factory_id: $('#cboFactory').val()});
                const $s = $('#cboProcess').empty().append('<option value="">전체</option>');
                ((r && r.data) ? r.data : []).forEach(p =>
                    $s.append('<option value="' + p.code + '">' + p.name + '</option>'));
            }
            fillProcess();

            /* 기본 선택 = 계정의 소속 공장. 없으면 «전체»('').
               콤보가 정적 <option> 이라 값만 넣으면 된다. */
            (function () {
                const my = (factory_id == null || factory_id === '' || Number(factory_id) <= 0)
                    ? '' : String(factory_id);
                if (!my || $('#cboFactory option[value="' + my + '"]').length) $('#cboFactory').val(my);
            })();
            $('#cboFactory').on('change', fillProcess);

            $('#btnMainSearch').click(() => page.searchMainData());
            page.searchMainData();
        });

    </script>
</th:block>
</html>
