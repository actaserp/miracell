<html layout:decorate="~{layout_page}">

<th:block layout:fragment="content">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"/>
    <style>
        :root{--bg:#E9EEF1;--surface:#FFF;--surface-2:#F4F7F9;--ink:#15222B;--ink-2:#5A6B76;--line:#D8E0E5;
            --teal:#0E7C86;--teal-d:#0A5C64;--teal-bg:#E2F1F2;--green:#1E9D58;--green-bg:#E4F4EA;
            --amber:#C77A00;--amber-bg:#FBEFD8;--red:#C8483B;--red-bg:#F7E4E1;--purple:#6D3BD1;--purple-bg:#EDE6FB;
            --r:18px;--tap:60px;--shadow:0 1px 0 rgba(21,34,43,.04),0 8px 24px -16px rgba(21,34,43,.28)}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        .ms-wash-root{font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif;color:var(--ink);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;flex:1 1 auto;min-height:0;height:var(--wash-h,100%);max-height:var(--wash-h,none);display:flex;flex-direction:column}
        .ms-wash-root .app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-radius:12px;overflow:hidden}
        .screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}.screen.hide{display:none}

        .wrap{padding:22px 20px 28px;max-width:1180px;margin:0 auto;width:100%;overflow:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
        .qhead{display:flex;align-items:baseline;gap:12px;margin:2px 2px 18px}
        .qhead h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0}
        .qhead .cnt{color:var(--ink-2);font-weight:700}
        .qfilter{display:flex;gap:8px;margin-left:auto}
        .qfilter button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:700;font-size:15px;cursor:pointer}
        .qfilter button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
        .searchbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
        .searchbar .slab{font-weight:800;color:var(--ink-2);font-size:14px}.searchbar .tilde{font-weight:800;color:var(--ink-2)}
        .dinput{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;font-weight:700;color:var(--ink);background:var(--surface-2);font-variant-numeric:tabular-nums;min-width:150px}
        .sbtn{height:48px;padding:0 22px;border:none;border-radius:12px;background:var(--teal);color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-left:auto}.sbtn:active{background:var(--teal-d)}
        .qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
        .wo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease;position:relative;overflow:hidden}
        .wo:active{transform:scale(.985)}
        .wo .edge{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
        .wo[data-st="working"] .edge{background:var(--teal)}.wo[data-st="wait"] .edge{background:var(--amber)}.wo[data-st="done"] .edge{background:var(--green)}
        .wo .row1{display:flex;align-items:center;gap:10px;margin-bottom:8px}
        .wo .wono{font-weight:800;font-size:15px;color:var(--ink-2)}
        .modeltag{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px}
        .modeltag.dom{background:var(--teal-bg);color:var(--teal-d)}.modeltag.exp{background:var(--purple-bg);color:var(--purple)}
        .chip{margin-left:auto;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:800}
        .chip.working{background:var(--teal-bg);color:var(--teal-d)}.chip.wait{background:var(--amber-bg);color:var(--amber)}.chip.done{background:var(--green-bg);color:var(--green)}
        .wo .name{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.3;margin:2px 0 4px}
        .wo .code{font-size:13px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:14px}
        .wo .meta{display:flex;gap:16px;align-items:flex-end}
        .wo .meta .blk{display:flex;flex-direction:column;gap:2px}
        .wo .meta .lab{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .wo .meta .val{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
        .wo .meta .val.g{color:var(--green)}.wo .meta .val.r{color:var(--red)}.wo .meta .val.a{color:var(--amber)}

        .topbar2{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);z-index:2}
        .back{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;font-size:22px;flex:0 0 auto}.back:active{background:var(--line)}
        .htitle{min-width:0;flex:1}.htitle .t{font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .htitle .s{font-size:13.5px;color:var(--ink-2);font-weight:700;margin-top:1px}
        .infopill{display:flex;gap:7px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
        .infopill b{color:var(--ink);font-variant-numeric:tabular-nums}
        .col-stack{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;height:100%}
        .bscroll{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px}
        .bgrid{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
        .secline{display:flex;align-items:center;gap:10px;margin:6px 2px 0;color:var(--ink-2);font-weight:800;font-size:14px}
        .secline .ln{flex:1;height:1px;background:var(--line)}
        .ovbox{display:flex;gap:12px;flex-wrap:wrap}
        .ov{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
        .ov .l{font-size:13px;color:var(--ink-2);font-weight:700}.ov .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

        .ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
        .unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .12s}
        .unit:active{transform:scale(.98)}
        .unit .edge{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--amber)}
        .unit[data-st="inspecting"] .edge{background:var(--teal)}.unit[data-st="pass"] .edge{background:var(--green)}.unit[data-st="reject"] .edge{background:var(--red)}
        .unit .un{font-size:17px;font-weight:800}
        .unit .lot{font-size:12.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
        .unit .from{font-size:11.5px;font-weight:800;color:var(--purple);margin-top:2px}
        .ubadge{padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:800}
        .ubadge.wait{background:var(--amber-bg);color:var(--amber)}.ubadge.inspecting{background:var(--teal-bg);color:var(--teal-d)}.ubadge.pass{background:var(--green-bg);color:var(--green)}.ubadge.reject{background:var(--red-bg);color:var(--red)}
        .ckchips{display:flex;gap:6px;margin-top:10px}
        .ckchip{flex:1;text-align:center;font-size:12px;font-weight:800;padding:6px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
        .ckchip.pass{background:var(--green-bg);color:var(--green);border-color:transparent}
        .ckchip.fail{background:var(--red-bg);color:var(--red);border-color:transparent}
        .ckchip.prog{background:var(--teal-bg);color:var(--teal-d);border-color:transparent}

        .tabbar{display:flex;gap:10px}
        .tabbar button{flex:1;min-height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-2)}
        .tabbar button.on{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-d)}
        .tabbar button .ts{font-size:11.5px;font-weight:800}
        .tabbar button .ts.pass{color:var(--green)}.tabbar button .ts.fail{color:var(--red)}
        .whoRow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow)}
        .whoRow .l{font-size:13px;color:var(--ink-2);font-weight:800}
        .whoRow .nm{font-size:17px;font-weight:800}
        .whoRow .assign{margin-left:auto;height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--teal);background:var(--teal-bg);color:var(--teal-d);font-weight:800;font-size:14px;cursor:pointer}

        .part{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
        .part .id{display:flex;flex-direction:column;min-width:0;flex:1}
        .part .pn{font-size:17px;font-weight:800;letter-spacing:-.02em}
        .part .pc{font-size:13px;color:var(--ink-2);font-weight:700}
        .defbtn{height:54px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:14px;cursor:pointer;flex:0 0 auto}
        .defbtn:active{background:var(--surface-2)}.defbtn.has{background:var(--red-bg);color:var(--red);border-color:transparent}
        .done-tag{padding:7px 14px;border-radius:999px;background:var(--green-bg);color:var(--green);font-weight:800;font-size:14px}
        .ms-wash-root .vtag{padding:7px 14px;border-radius:999px;font-weight:800;font-size:14px;flex:0 0 auto;min-width:64px;text-align:center}
        .ms-wash-root .vtag.pass{background:var(--green-bg);color:var(--green)}.ms-wash-root .vtag.fail{background:var(--red-bg);color:var(--red)}
        .ms-wash-root .valchip{font-size:19px;font-weight:800;padding:7px 14px;border-radius:12px;background:var(--teal-bg);color:var(--teal-d);font-variant-numeric:tabular-nums;flex:0 0 auto}
        .ms-wash-root .auto-box{background:linear-gradient(180deg,#F0FAFB,#FFF);border:1px solid var(--teal-bg);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
        .ms-wash-root .auto-box .ic{width:46px;height:46px;border-radius:12px;background:var(--teal-bg);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
        .ms-wash-root .auto-box .big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--teal-d)}
        .big{font-weight:800}
        .ms-wash-root .judge{display:flex;gap:12px}
        .ms-wash-root .judge button{flex:1;min-height:64px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:17px;cursor:pointer;color:var(--ink-2)}
        .ms-wash-root .judge button.pass.on{border-color:var(--green);background:var(--green-bg);color:var(--green)}
        .ms-wash-root .judge button.fail.on{border-color:var(--red);background:var(--red-bg);color:var(--red)}
        .opt{min-height:54px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
        .opt:active{background:var(--surface-2)}.opt.sel{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-d)}

        .actionbar{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;box-shadow:0 -8px 24px -18px rgba(21,34,43,.4)}
        .actionbar .actsum{display:flex;flex-direction:column;margin-right:auto}
        .actionbar .actsum .l{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .actionbar .actsum .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
        .btn{min-height:var(--tap);padding:0 24px;border-radius:16px;border:none;cursor:pointer;font-size:18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}
        .btn.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}.btn.ghost:active{background:var(--line)}
        .btn.primary{background:var(--teal);color:#fff;padding:0 28px;box-shadow:0 8px 18px -8px rgba(14,124,134,.7)}.btn.primary:active{background:var(--teal-d)}
        .btn:disabled{background:var(--line)!important;color:var(--ink-2)!important;box-shadow:none;cursor:default}

        .mask{position:fixed;inset:0;background:rgba(21,34,43,.42);display:none;z-index:40;align-items:flex-end}
        .mask.show{display:flex;animation:fade .15s ease}@keyframes fade{from{opacity:0}to{opacity:1}}
        .sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 20px calc(40px + env(safe-area-inset-bottom));box-shadow:0 -20px 40px -20px rgba(0,0,0,.4);animation:rise .2s cubic-bezier(.2,.7,.3,1);max-height:88dvh;overflow:auto}
        @keyframes rise{from{transform:translateY(40px)}to{transform:translateY(0)}}
        .sheet .sh{display:flex;align-items:center;margin-bottom:16px}.sheet .sh h3{font-size:20px;font-weight:800;margin:0}
        .sheet .sh .x{margin-left:auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;cursor:pointer}
        .sheet .body{max-width:660px;margin:0 auto}
        .fieldlab{font-size:14px;font-weight:800;color:var(--ink-2);margin:14px 2px 8px}
        .opts{display:flex;flex-wrap:wrap;gap:10px}
        .sheet .ok{width:100%;margin-top:20px;background:var(--teal);color:#fff;min-height:var(--tap);border:none;border-radius:16px;font-size:19px;font-weight:800;cursor:pointer}
        .sheet .ok:disabled{background:var(--line);color:var(--ink-2)}
        .pad .disp{margin-left:auto;min-width:140px;text-align:right;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px 16px}
        .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;margin:6px auto 0}
        .keys button{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:25px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
        .keys button:active{background:var(--surface-2)}.keys button.ok{background:var(--teal);color:#fff;border-color:var(--teal)}.keys button.clr{color:var(--red)}

        @media (max-width:680px){.qgrid{grid-template-columns:1fr}}
        @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
    </style>

    <div class="ms-wash-root">
        <div class="app">
            <!-- A. 검사 작업지시(수주) -->
            <div class="screen" id="scA"><div class="wrap">
                <div class="qhead"><h1>M-CELL 검사 · 작업지시</h1><span class="cnt" id="qcnt"></span>
                    <div class="qfilter"><button class="on" data-f="all">전체</button>
                        <button data-f="wait">대기</button><button data-f="working">검사중</button></div></div>
                <div class="searchbar"><span class="slab">작업지시일</span>
                    <input type="date" id="dFrom" class="dinput"/><span class="tilde">~</span><input type="date" id="dTo" class="dinput"/>
                    <button class="sbtn" id="btnSearch">조회</button></div>
                <div class="qgrid" id="qgrid"></div>
            </div></div>

            <!-- B. 유닛 목록 -->
            <div class="screen hide" id="scB"><div class="col-stack">
                <div class="topbar2"><button class="back" data-back="A">‹</button>
                    <div class="htitle"><div class="t" id="bName">—</div><div class="s" id="bSub">—</div></div>
                    <div class="infopill"><span>합격</span><b id="bPass">0</b></div>
                    <div class="infopill"><span>복귀</span><b id="bRej">0</b></div>
                </div>
                <div class="bscroll"><div class="bgrid">
                    <div class="ovbox">
                        <div class="ov"><div class="l">수주</div><div class="v" id="ovQty">0</div></div>
                        <div class="ov"><div class="l">검사대기</div><div class="v" id="ovWait">0</div></div>
                        <div class="ov"><div class="l">합격</div><div class="v" style="color:var(--green)" id="ovPass">0</div></div>
                        <div class="ov"><div class="l">조립복귀</div><div class="v" style="color:var(--red)" id="ovRej">0</div></div>
                    </div>
                    <div class="secline">개별 유닛 (1대 = 1로트 = 1검사건) <span class="ln"></span><span id="uCnt"></span></div>
                    <div class="ugrid" id="uGrid"></div>
                </div></div>
            </div></div>

            <!-- C. 유닛 검사 -->
            <div class="screen hide" id="scC"><div class="col-stack">
                <div class="topbar2"><button class="back" data-back="B">‹</button>
                    <div class="htitle"><div class="t" id="cUnit">—</div><div class="s" id="cSub">—</div></div>
                    <div class="infopill"><span>LOT</span><b id="cLot">—</b></div>
                </div>
                <div class="bscroll"><div class="bgrid" id="cGrid"></div></div>
                <div class="actionbar" id="cAction"></div>
            </div></div>
        </div>

        <!-- 검사자 배정 -->
        <div class="mask" id="whoMask"><div class="sheet"><div class="body">
            <div class="sh"><h3 id="whoTitle">검사자 배정</h3><button class="x" data-close>✕</button></div>
            <div class="fieldlab">검사자</div><div class="opts" id="whoOpts"></div>
            <button class="ok" id="whoOk" disabled>배정</button>
        </div></div></div>

        <!-- 넘패드(측정값) -->
        <div class="mask" id="padMask"><div class="sheet pad"><div class="body">
            <div class="sh"><h3 id="padLab">측정값</h3><span class="disp" id="padDisp" style="margin-left:auto">-</span></div>
            <div class="keys"><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
                <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
                <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
                <button class="clr" data-k="C">C</button><button data-k="0">0</button><button data-k="dot">.</button>
                <button data-k="unit">mm</button><button data-k="bs">←</button><button class="ok" data-k="OK">확인</button></div>
        </div></div></div>
    </div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script th:inline="none">
        /* 높이 자동 맞춤 */
        (function () {
            const root = document.querySelector('.ms-wash-root'); if (!root) return;
            function localBelow() { let below = 0, node = root; while (node && node !== document.body) { let sib = node.nextElementSibling; while (sib) { const r = sib.getBoundingClientRect(); if (r.height > 0 && getComputedStyle(sib).position !== 'fixed') below += r.height; sib = sib.nextElementSibling; } node = node.parentElement; } let fx = 0; document.querySelectorAll('body *').forEach(el => { if (root.contains(el)) return; const cs = getComputedStyle(el); if (cs.position !== 'fixed' && cs.position !== 'sticky') return; const r = el.getBoundingClientRect(); if (r.height > 0 && r.height < innerHeight * 0.5 && r.bottom > innerHeight - 2) fx = Math.max(fx, r.height); }); return Math.max(below, fx); }
            function availBottom() { let bottom = window.innerHeight; try { const fe = window.frameElement; if (fe) { const pWin = window.parent, pDoc = pWin.document; const feTop = fe.getBoundingClientRect().top; let flow = 0, node = fe; while (node && node !== pDoc.body) { let sib = node.nextElementSibling; while (sib) { const cs = pWin.getComputedStyle(sib), r = sib.getBoundingClientRect(); if (r.height > 0 && cs.position !== 'fixed' && cs.position !== 'absolute') flow += r.height; sib = sib.nextElementSibling; } node = node.parentElement; } let fx = 0; pDoc.querySelectorAll('body *').forEach(el => { if (el === fe || el.contains(fe)) return; const cs = pWin.getComputedStyle(el); if (cs.position !== 'fixed' && cs.position !== 'sticky' && cs.position !== 'absolute') return; const r = el.getBoundingClientRect(); if (r.height > 0 && r.height <= 160 && r.top > feTop && r.bottom > pWin.innerHeight - 40) fx = Math.max(fx, r.bottom - r.top); }); bottom = Math.min(bottom, (pWin.innerHeight - Math.max(flow, fx)) - feTop); } } catch (e) {} return bottom; }
            function fit() { const top = root.getBoundingClientRect().top; const avail = availBottom() - top - localBelow(); root.style.setProperty('--wash-h', Math.max(320, Math.floor(avail)) + 'px'); }
            window.addEventListener('resize', fit); window.addEventListener('orientationchange', fit); try { window.parent.addEventListener('resize', fit); } catch (e) {}
            fit(); requestAnimationFrame(fit); setTimeout(fit, 200); setTimeout(fit, 600); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
        })();

        /* ── 기준 데이터 ── */

                        '<button class="defbtn' + (val ? ' has' : '') + '" data-val="' + key + '">측정값</button>' +
                        '<div class="judge" style="flex:0 0 auto;gap:8px;margin-left:8px">' +
                        '<button class="pass ' + (r === 'pass' ? 'on' : '') + '" data-chk="' + key + '" data-v="pass" style="min-height:48px;padding:0 14px">합</button>' +
                        '<button class="fail ' + (r === 'fail' ? 'on' : '') + '" data-chk="' + key + '" data-v="fail" style="min-height:48px;padding:0 14px">불</button></div></div>';
                }).join('');
            }).join('');
            var allKeys = rotorAllKeys(t);
            var allPass = allKeys.every(function (k) { return u.res[k] === 'pass'; });
            var anyFail = allKeys.some(function (k) { return u.res[k] === 'fail'; });
            var verdict = anyFail ? '불합격' : (allPass ? '합격' : '미완료');
            var col = anyFail ? 'var(--red)' : (allPass ? 'var(--green)' : 'var(--ink-2)');
            html += '<div class="auto-box"><div class="ic" style="background:' + (anyFail ? 'var(--red-bg)' : allPass ? 'var(--green-bg)' : 'var(--surface-2)') + '">' + (anyFail ? '✕' : allPass ? '✓' : '…') + '</div>' +
                '<div style="flex:1"><div style="font-size:13px;color:var(--ink-2);font-weight:700">종합 판정</div>' +
                '<div class="big" style="color:' + col + ';font-size:24px">' + verdict + '</div></div>' +
                '<button class="btn ghost" id="resetCur">초기화</button><button class="btn primary" id="commitJudge" ' + ((allPass || anyFail) ? '' : 'disabled') + '>이 검사 확정</button></div>';
            return html;
        }
        function basketBody(u, t) {
            var done = u.cycles.length, finished = done >= t.count;
            var failN = u.cycles.filter(function (c) { return c.result === 'fail'; }).length;
            var html = '<div class="auto-box"><div style="flex:1"><div style="font-size:13px;color:var(--ink-2);font-weight:700">' + t.item + ' 진행' + (failN ? ' · 불 ' + failN + '회' : '') + '</div>' +
                '<div class="big" style="font-size:24px">' + done + ' / ' + t.count + '</div>' +
                '<div style="margin-top:6px;height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden"><i style="display:block;height:100%;width:' + Math.round(done / t.count * 100) + '%;background:var(--green)"></i></div></div></div>';
            if (!finished) {
                var c = u.cur;
                html += '<div class="part"><div class="id"><span class="pn">' + (done + 1) + '회차 · LOCK ON/OFF</span>' +
                    '<span class="pc">규격: ' + c.reason + (c.tool ? ' · 공구 ' + c.tool : '') + '</span></div>' +
                    (c.val ? '<span class="valchip">' + c.val + '</span>' : '') +
                    '<button class="defbtn' + (c.val ? ' has' : '') + '" data-bval="1">측정값</button>' +
                    '<div class="judge" style="flex:0 0 auto;gap:8px;margin-left:8px">' +
                    '<button class="pass ' + (c.result === 'pass' ? 'on' : '') + '" data-bres="pass" style="min-height:48px;padding:0 14px">합</button>' +
                    '<button class="fail ' + (c.result === 'fail' ? 'on' : '') + '" data-bres="fail" style="min-height:48px;padding:0 14px">불</button></div></div>';
                html += '<div class="part"><div class="id"><span class="pn">적용 규격(합격기준)</span></div>' +
                    '<div style="display:flex;gap:6px;flex-wrap:wrap">' + t.criteria.map(function (cr) { return '<button class="opt ' + (c.reason === cr.label ? 'sel' : '') + '" data-bcrit="' + cr.label + '" style="min-height:44px;padding:8px 14px;font-size:14px">' + cr.label + '</button>'; }).join('') + '</div></div>';
                html += '<div class="part"><div class="id"><span class="pn">사용공구</span><span class="pc">합격기준에 따라 자동 지정</span></div><span class="done-tag" style="background:var(--surface-2);color:var(--ink)">' + (c.tool || '-') + '</span></div>';
                html += '<div style="display:flex;gap:10px"><button class="btn ghost" id="resetCur">초기화</button><button class="btn primary" id="commitCycle" style="flex:1" ' + (c.result ? '' : 'disabled') + '>이 회차 기록 → 다음</button></div>';
            } else {
                var pass = failN === 0;
                html += '<div class="auto-box"><div class="ic" style="background:' + (pass ? 'var(--green-bg)' : 'var(--red-bg)') + '">' + (pass ? '✓' : '✕') + '</div>' +
                    '<div style="flex:1"><div style="font-size:13px;color:var(--ink-2);font-weight:700">50회 완료</div>' +
                    '<div class="big" style="color:' + (pass ? 'var(--green)' : 'var(--red)') + ';font-size:24px">' + (pass ? '합격' : '불합격') + '</div></div>' +
                    '<button class="btn ghost" id="resetCur">초기화</button><button class="btn primary" id="commitJudge">이 검사 확정</button></div>';
            }
            if (done > 0) {
                var bys = distinct(u.cycles.map(function (cy) { return cy.by; }));
                html += '<div class="secline">기록된 회차 <span class="ln"></span><span>' + done + '회' + (bys.length ? ' · 검사자 ' + bys.join(', ') : '') + '</span></div>';
                html += u.cycles.slice().reverse().map(function (cy) {
                    return '<div class="part"><div class="id"><span class="pn">' + cy.n + '회차 · ' + (cy.result === 'pass' ? '합' : '불') + '</span>' +
                        '<span class="pc">' + cy.reason + (cy.tool ? ' · ' + cy.tool : '') + (cy.val ? ' · 측정 ' + cy.val : '') + (cy.by ? ' · 검사자 ' + cy.by : '') + '</span></div>' +
                        '<span class="vtag ' + (cy.result === 'pass' ? 'pass' : 'fail') + '">' + (cy.result === 'pass' ? '합격' : '불합격') + '</span>' +
                        '<button class="defbtn" data-cycledel="' + cy.n + '" style="margin-left:8px;color:var(--red);border-color:var(--red-bg);background:var(--red-bg)">삭제</button></div>';
                }).join('');
            }
            return html;
        }

        function renderCAction() {
            var u = curU, st = unitState(u), bar = document.getElementById('cAction');
            var rv = u.rotor && u.rotor.verdict, bv = u.basket && u.basket.verdict;
            var sub = 'ROTOR ' + (rv === 'pass' ? '합격' : rv === 'fail' ? '불합격' : '미검') + ' · BASKET ' + (bv === 'pass' ? '합격' : bv === 'fail' ? '불합격' : '미검');
            if (st === 'pass') bar.innerHTML = '<div class="actsum"><span class="l">' + sub + '</span><span class="v" style="color:var(--green)">합격 · 완제품 확정</span></div><button class="btn ghost" data-recheckall>재검사</button>';
            else if (st === 'reject') bar.innerHTML = '<div class="actsum"><span class="l">' + sub + '</span><span class="v" style="color:var(--red)">불합격 · 조립 복귀</span></div><button class="btn ghost" data-recheckall>재검사</button>';
            else bar.innerHTML = '<div class="actsum"><span class="l">' + sub + '</span><span class="v">ROTOR·BASKET 둘 다 확정 시 최종 판정</span></div>';
        }

        function finalizeUnit() {
            var u = curU, st = unitState(u);
            if (st === 'pass') flash('완제품 확정 · ' + u.lot + ' (ROTOR+BASKET 합격)');
            else if (st === 'reject') flash('조립 복귀 · ' + u.lot + ' (불합격) → 재조립 후 재검사');
        }

        document.getElementById('cGrid').addEventListener('click', function (e) {
            var u = curU, c = curChk, t = tpl();
            var hr = e.target.closest('[data-hist]'); if (hr) { histView = +hr.dataset.hist; renderUnit(); return; }
            if (e.target.closest('[data-histback]')) { histView = null; renderUnit(); return; }
            if (e.target.closest('[data-histedit]')) {
                var h = c.history[histView], snap = h.snap; histView = null;
                if (snap) {
                    if (snap.type === 'repeat') { c.cycles = snap.cycles.map(function (cy) { return {n: cy.n, result: cy.result, reason: cy.reason, tool: cy.tool, val: cy.val, by: cy.by}; }); var lc = c.cycles[c.cycles.length - 1] || {reason: t.criteria[0].label, tool: t.criteria[0].tool}; c.cur = {result: null, val: '', reason: lc.reason, tool: lc.tool}; }
                    else { c.res = Object.assign({}, snap.res); c.val = Object.assign({}, snap.val); }
                }
                c.verdict = null; c.at = null; renderUnit(); flash(h.n + '차 기록을 복사해 왔습니다 · 원본은 그대로, 다시 확정하면 새 회차로 기록됩니다'); return;
            }
            var tab = e.target.closest('[data-tab]'); if (tab) { setTab(tab.dataset.tab); return; }
            if (e.target.closest('[data-who]')) { openWho(); return; }
            if (e.target.closest('[data-recheck]')) {
                c.verdict = null; c.at = null;
                if (t.type === 'repeat') { c.cycles = []; var rc0 = t.criteria[0]; c.cur = {result: null, val: '', reason: rc0.label, tool: rc0.tool}; }
                else { c.res = {}; c.val = {}; }
                renderUnit(); flash('재검사 · ' + TABNM[curTab] + ' 다시 판정 (이력 유지)'); return;
            }
            var ck = e.target.closest('[data-chk]');
            if (ck) { c.res[ck.dataset.chk] = ck.dataset.v; renderUnit(); return; }
            var vb = e.target.closest('[data-val]'); if (vb) { openVal(vb.dataset.val, 'item'); return; }
            var br = e.target.closest('[data-bres]'); if (br) { c.cur.result = br.dataset.bres; renderUnit(); return; }
            var bc = e.target.closest('[data-bcrit]'); if (bc) { var cr = t.criteria.find(function (x) { return x.label === bc.dataset.bcrit; }); c.cur.reason = cr.label; c.cur.tool = cr.tool; renderUnit(); return; }
            var bv = e.target.closest('[data-bval]'); if (bv) { openVal('cyc', 'cycleval'); return; }
            if (e.target.id === 'commitCycle') {
                if (!c.cur.result) { flash('합/불을 선택하세요'); return; }
                c.cycles.push({n: c.cycles.length + 1, result: c.cur.result, reason: c.cur.reason, tool: c.cur.tool, val: c.cur.val, by: c.by});
                var last = c.cur; c.cur = {result: null, val: '', reason: last.reason, tool: last.tool};
                renderUnit(); return;
            }
            var cdel = e.target.closest('[data-cycledel]');
            if (cdel) { var n = +cdel.dataset.cycledel; c.cycles = c.cycles.filter(function (cy) { return cy.n !== n; }); c.cycles.forEach(function (cy, k) { cy.n = k + 1; }); if (!c.cur) { var lc = c.cycles[c.cycles.length - 1] || {reason: t.criteria[0].label, tool: t.criteria[0].tool}; c.cur = {result: null, val: '', reason: lc.reason, tool: lc.tool}; } renderUnit(); flash(n + '회차 삭제'); return; }
            if (e.target.id === 'resetCur') {
                if (t.type === 'repeat') { c.cycles = []; var c0 = t.criteria[0]; c.cur = {result: null, val: '', reason: c0.label, tool: c0.tool}; }
                else { c.res = {}; c.val = {}; }
                renderUnit(); flash('초기화'); return;
            }
            if (e.target.id === 'commitJudge') {
                var fail;
                if (t.type === 'repeat') { if (c.cycles.length < t.count) { flash('50회를 모두 기록하세요'); return; } fail = c.cycles.some(function (cy) { return cy.result === 'fail'; }); }
                else { var ak = rotorAllKeys(t); if (!ak.every(function (k) { return c.res[k]; })) { flash('모든 항목을 판정하세요'); return; } fail = ak.some(function (k) { return c.res[k] === 'fail'; }); }
                c.verdict = fail ? 'fail' : 'pass'; c.at = nowFull();
                if (!c.history) c.history = [];
                var bys = checkInspectors(c, curTab);
                var snap = (t.type === 'repeat') ? {type: 'repeat', cycles: c.cycles.map(function (cy) { return {n: cy.n, result: cy.result, reason: cy.reason, tool: cy.tool, val: cy.val, by: cy.by}; })}
                    : {type: 'checklist', res: Object.assign({}, c.res), val: Object.assign({}, c.val)};
                c.history.push({n: c.history.length + 1, result: c.verdict, by: bys.join(', '), bys: bys, at: c.at, snap: snap});
                var both = (u.rotor && u.rotor.verdict) && (u.basket && u.basket.verdict);
                renderUnit(); renderUnits();
                if (both) finalizeUnit(); else flash(TABNM[curTab] + ' ' + (fail ? '불합격' : '합격') + ' 확정 · 나머지 검사 남음');
                return;
            }
        });
        document.getElementById('cAction').addEventListener('click', function (e) {
            if (e.target.closest('[data-recheckall]')) {
                ['ROTOR', 'BASKET-50'].forEach(function (tb) {
                    var cc = curU[TABKEY[tb]]; if (!cc || !cc.verdict) return;
                    cc.verdict = null; cc.at = null;
                    if (tb === 'BASKET-50') { cc.cycles = []; var b0 = INSP['BASKET-50'].criteria[0]; cc.cur = {result: null, val: '', reason: b0.label, tool: b0.tool}; }
                    else { cc.res = {}; cc.val = {}; }
                });
                curChk = initChk(curU, curTab);
                renderUnit(); renderUnits(); flash('재검사 · 두 검사 판정 해제 (이력 유지)');
            }
        });

        /* 검사자 배정 */
        function showMask(id) { document.getElementById(id).classList.add('show'); }
        function hideMask(id) { document.getElementById(id).classList.remove('show'); }
        document.querySelectorAll('.mask').forEach(function (m) { m.addEventListener('click', function (e) { if (e.target === m || e.target.closest('[data-close]')) m.classList.remove('show'); }); });
        var whoSel = null;
        function openWho() {
            whoSel = curChk.by;
            document.getElementById('whoTitle').textContent = TABNM[curTab] + ' 검사자 배정';
            document.getElementById('whoOpts').innerHTML = WORKERS.map(function (w) { return '<button class="opt' + (curChk.by === w ? ' sel' : '') + '" data-w="' + w + '">' + w + '</button>'; }).join('');
            document.getElementById('whoOk').disabled = !curChk.by;
            showMask('whoMask');
        }
        document.getElementById('whoOpts').addEventListener('click', function (e) { var b = e.target.closest('[data-w]'); if (!b) return; document.querySelectorAll('#whoOpts .opt').forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); whoSel = b.dataset.w; document.getElementById('whoOk').disabled = false; });
        document.getElementById('whoOk').onclick = function () { curChk.by = whoSel; hideMask('whoMask'); renderUnit(); flash(TABNM[curTab] + ' 검사자 · ' + whoSel); };

        /* 측정값 넘패드 */
        var valKey = null, valMode = null, valBuf = '';
        function openVal(k, mode) {
            valMode = mode || 'item'; valKey = k;
            valBuf = (valMode === 'cycleval') ? (curChk.cur.val || '') : ((curChk.val && curChk.val[k]) || '');
            document.getElementById('padLab').textContent = (valMode === 'cycleval') ? (tpl().item + ' 측정값') : (padItemName(k) + ' 측정값');
            document.getElementById('padDisp').textContent = valBuf || '-';
            showMask('padMask');
        }
        function padItemName(no) {
            var s = String(no), sub = '';
            if (s.indexOf('_') >= 0) { sub = ' — 측정 ' + s.split('_')[1] + '회'; s = s.split('_')[0]; }
            var it = INSP['ROTOR'].items.filter(function (x) { return String(x.no) === s; })[0];
            return (it ? it.item.replace(/\s*\(3회\)/, '') : ('항목 ' + s)) + sub;
        }
        document.querySelector('#padMask .keys').addEventListener('click', function (e) {
            var key = e.target.dataset.k; if (!key) return;
            if (key === 'C') valBuf = '';
            else if (key === 'bs') valBuf = valBuf.slice(0, -1);
            else if (key === 'dot') { if (valBuf.indexOf('.') < 0) valBuf += (valBuf === '' ? '0.' : '.'); }
            else if (key === 'unit') { if (valBuf && valBuf.indexOf('mm') < 0) valBuf += 'mm'; }
            else if (key === 'OK') { if (valMode === 'cycleval') curChk.cur.val = valBuf; else curChk.val[valKey] = valBuf; hideMask('padMask'); renderUnit(); return; }
            else valBuf += key;
            document.getElementById('padDisp').textContent = valBuf || '-';
        });

        /* 토스트 */
        var tT;
        function flash(m) {
            var t = document.getElementById('toast');
            if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#15222B;color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;z-index:60;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:opacity .3s;max-width:90vw;text-align:center'; document.body.appendChild(t); }
            t.textContent = m; t.style.opacity = '1'; clearTimeout(tT); tT = setTimeout(function () { t.style.opacity = '0'; }, 1900);
        }

        renderQueue();
    </script>
</th:block>
</html>
