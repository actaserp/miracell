<html layout:decorate="~{layout_page}">

<th:block layout:fragment="content">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"/>
    <style>

        :root{--bg:#E9EEF1;--surface:#FFF;--surface-2:#F4F7F9;--ink:#15222B;--ink-2:#5A6B76;--line:#D8E0E5;
            --teal:#0E7C86;--teal-d:#0A5C64;--teal-bg:#E2F1F2;--green:#1E9D58;--green-bg:#E4F4EA;
            --amber:#C77A00;--amber-bg:#FBEFD8;--red:#C8483B;--red-bg:#F7E4E1;--r:18px;--tap:60px;
            --shadow:0 1px 0 rgba(21,34,43,.04),0 8px 24px -16px rgba(21,34,43,.28)}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        .ms-wash-root{font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif;color:var(--ink);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;flex:1 1 auto;min-height:0;height:var(--wash-h,100%);max-height:var(--wash-h,none);display:flex;flex-direction:column}
        .ms-wash-root .app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-radius:12px;overflow:hidden}
        .spacer{flex:1}
        .screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}.screen.hide{display:none}

        /* A. PK 작업지시 큐 */
        .wrap{padding:22px 20px 28px;max-width:1180px;margin:0 auto;width:100%;overflow:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
        .qhead{display:flex;align-items:baseline;gap:12px;margin:2px 2px 18px}
        .qhead h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0}
        .qhead .cnt{color:var(--ink-2);font-weight:700}
        .qfilter{display:flex;gap:8px;margin-left:auto}
        .qfilter button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);
            background:var(--surface);color:var(--ink-2);font-weight:700;font-size:15px;cursor:pointer}
        .qfilter button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
        .searchbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 18px;
            background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
        .searchbar .slab{font-weight:800;color:var(--ink-2);font-size:14px}
        .searchbar .tilde{font-weight:800;color:var(--ink-2)}
        .dinput{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;
            font-weight:700;color:var(--ink);background:var(--surface-2);font-variant-numeric:tabular-nums;min-width:150px}
        .sbtn{height:48px;padding:0 22px;border:none;border-radius:12px;background:var(--teal);color:#fff;
            font-weight:800;font-size:16px;cursor:pointer;margin-left:auto}
        .sbtn:active{background:var(--teal-d)}
        .qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
        .wo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;
            cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease;position:relative;overflow:hidden}
        .wo:active{transform:scale(.985)}
        .wo .edge{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
        .wo[data-st="working"] .edge{background:var(--teal)}.wo[data-st="wait"] .edge{background:var(--amber)}.wo[data-st="done"] .edge{background:var(--green)}
        .wo .row1{display:flex;align-items:center;gap:10px;margin-bottom:8px}
        .wo .wono{font-weight:800;font-size:15px;color:var(--ink-2)}
        .chip{margin-left:auto;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:800}
        .chip.working{background:var(--teal-bg);color:var(--teal-d)}.chip.wait{background:var(--amber-bg);color:var(--amber)}.chip.done{background:var(--green-bg);color:var(--green)}
        .wo .name{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.3;margin:2px 0 14px}
        .wo .meta{display:flex;gap:18px;align-items:flex-end}
        .wo .meta .blk{display:flex;flex-direction:column;gap:2px}
        .wo .meta .lab{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .wo .meta .val{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
        .wo .meta .val.left{color:var(--teal-d)}
        .wo .prog{margin-left:auto;text-align:right}
        .wo .bar{height:8px;width:120px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:6px}
        .wo .bar>i{display:block;height:100%;background:var(--teal);border-radius:999px}

        /* 공통 상단바(B,C) */
        .topbar2{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);
            padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);z-index:2}
        .back{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);
            display:grid;place-items:center;cursor:pointer;font-size:22px;flex:0 0 auto}
        .back:active{background:var(--line)}
        .htitle{min-width:0;flex:1}
        .htitle .t{font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .htitle .s{font-size:13.5px;color:var(--ink-2);font-weight:700;margin-top:1px}
        .chead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
        .infopill{display:flex;gap:7px;align-items:center;background:var(--surface-2);border:1px solid var(--line);
            border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
        .infopill b{color:var(--ink);font-variant-numeric:tabular-nums}
        .infopill.big b{color:var(--teal-d);font-size:18px}
        .infopill.tap{cursor:pointer}.infopill.tap:active{background:var(--line)}
        .infopill.tap b{color:var(--teal-d);text-decoration:underline dotted}

        .col-stack{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;height:100%}
        .bscroll{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px}
        .bgrid{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
        .ovbox{display:flex;gap:12px;flex-wrap:wrap}
        .ov{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
        .ov .l{font-size:13px;color:var(--ink-2);font-weight:700}
        .ov .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
        .ov.left .v{color:var(--teal-d)}
        .secline{display:flex;align-items:center;gap:10px;margin:6px 2px 0;color:var(--ink-2);font-weight:800;font-size:14px}
        .secline .ln{flex:1;height:1px;background:var(--line)}

        /* B. 조 카드 */
        .wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;
            box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden;transition:transform .12s ease}
        .wk:active{transform:scale(.99)}
        .wk .edge{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--amber)}
        .wk[data-st="working"] .edge{background:var(--teal)}.wk[data-st="done"] .edge{background:var(--green)}
        .wk .who{display:flex;flex-direction:column;gap:2px;min-width:150px}
        .wk .who .nm{font-size:18px;font-weight:800}
        .wk .who .eq{font-size:13px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
        .wk .wktime{font-size:13.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
        .wk .qty{margin-left:auto;text-align:right}
        .wk .qty .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
        .wk .qty .l{font-size:12px;color:var(--ink-2);font-weight:700}
        .wk .badge{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800}
        .wk .badge.working{background:var(--teal-bg);color:var(--teal-d)}.wk .badge.done{background:var(--green-bg);color:var(--green)}.wk .badge.wait{background:var(--amber-bg);color:var(--amber)}
        .wk .wkdel{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--red-bg);color:var(--red);font-weight:800;font-size:14px;cursor:pointer;flex:0 0 auto}
        .wk .wkdel:active{background:var(--red);color:#fff}
        .emptybox{text-align:center;color:var(--ink-2);font-weight:700;padding:30px;border:1.5px dashed var(--line);border-radius:var(--r)}

        /* C. 생산 카드 */
        .vitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden}
        .vitem .edge{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--amber);z-index:1}
        .vitem[data-st="working"] .edge{background:var(--teal)}.vitem[data-st="done"] .edge{background:var(--green)}
        .vitem.locked .vhead{opacity:.75}
        .vhead{display:flex;align-items:center;gap:12px;padding:14px 16px 14px 18px;flex-wrap:wrap}
        .vid{display:flex;flex-direction:column;min-width:0;flex:1}
        .vid .pn{font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .vid .sub{display:flex;gap:8px;align-items:center;margin-top:2px}
        .vid .pc{font-size:13px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
        .st-badge{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800;flex:0 0 auto}
        .st-badge.wait{background:var(--amber-bg);color:var(--amber)}.st-badge.working{background:var(--teal-bg);color:var(--teal-d)}.st-badge.done{background:var(--green-bg);color:var(--green)}
        .stepper{display:flex;align-items:center;flex:0 0 auto}
        .stepper button{width:48px;height:52px;border:1px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:700;cursor:pointer;display:grid;place-items:center}
        .stepper button:active{background:var(--line)}
        .stepper button.minus{border-radius:14px 0 0 14px}.stepper button.plus{border-radius:0 14px 14px 0}
        .stepper .qty{width:82px;height:52px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
            background:#FFFDF4;text-align:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;display:grid;place-items:center;cursor:pointer}
        .qtytag{min-width:82px;text-align:right;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
        .itembtn{height:52px;padding:0 16px;border-radius:14px;border:none;font-weight:800;font-size:15px;cursor:pointer;flex:0 0 auto}
        .itembtn.start{background:var(--teal);color:#fff}.itembtn.start:active{background:var(--teal-d)}
        .itembtn.done{background:var(--green);color:#fff}
        .itembtn.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
        .vtimes{display:flex;gap:8px;flex-wrap:wrap;width:100%;padding:0 2px}
        .vtimes .tp{font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--surface-2);
            border:1px solid var(--line);border-radius:10px;padding:5px 10px;cursor:pointer;font-variant-numeric:tabular-nums}
        .vtimes .tp:active{background:var(--line)}.vtimes .tp b{color:var(--teal-d);text-decoration:underline dotted;margin-left:2px}

        /* 용기 반제품 로트 (FIFO) 행 */
        .veslot{margin:0 16px 4px 24px;padding:12px 14px;border:1px solid var(--teal);background:var(--teal-bg);border-radius:14px;
            display:flex;align-items:center;gap:12px;flex-wrap:wrap}
        .veslot .vl{flex:1;min-width:0}
        .veslot .vlt{font-size:12px;font-weight:800;color:var(--teal-d)}
        .veslot .vll{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .veslot .vlm{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .veslot .vchg{height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--teal);background:var(--surface);color:var(--teal-d);font-weight:800;font-size:14px;cursor:pointer;flex:0 0 auto}

        .bomtoggle{margin:6px 16px 0 24px;display:flex;align-items:center;gap:8px;cursor:pointer;
            color:var(--ink-2);font-weight:800;font-size:13.5px;padding:8px 0}
        .bomtoggle .caret{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);
            display:grid;place-items:center;font-size:13px;transition:transform .15s}
        .bomtoggle.open .caret{transform:rotate(90deg);background:var(--teal-bg);border-color:var(--teal);color:var(--teal-d)}
        .bomtoggle .ln{flex:1;height:1px;background:var(--line)}
        .vbom{margin:0 16px 14px 24px;padding:4px 0 0;display:none}
        .vbom.open{display:block}
        .vbom .baddbtn{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--teal);background:var(--teal-bg);color:var(--teal-d);font-weight:800;font-size:13px;cursor:pointer;margin-left:auto}
        .vbom .browhead{display:flex;align-items:center;gap:8px;margin:2px 0 6px;color:var(--ink-2);font-weight:800;font-size:13px}
        .vbom .browhead .ln{flex:1;height:1px;background:var(--line)}
        .brow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
        .brow:last-child{border-bottom:none}
        .brow .bid{flex:1;min-width:0}
        .brow .bn{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .brow .bc{font-size:12px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
        .autotag{font-size:11px;font-weight:800;color:var(--ink-2);padding:2px 6px;border-radius:6px;background:var(--surface-2)}
        .bstep{display:flex;align-items:center;flex:0 0 auto}
        .bstep button{width:40px;height:44px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer;display:grid;place-items:center}
        .bstep button:active{background:var(--line)}
        .bstep button.minus{border-radius:12px 0 0 12px}.bstep button.plus{border-radius:0 12px 12px 0}
        .bstep .bq{width:70px;height:44px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#FFFDF4;
            text-align:center;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;display:grid;place-items:center;cursor:pointer}
        .bstep .bq.auto{background:var(--surface-2)}
        .brm{width:40px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--red);font-size:16px;cursor:pointer;flex:0 0 auto}

        .actionbar{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);
            padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;
            box-shadow:0 -8px 24px -18px rgba(21,34,43,.4)}
        .actionbar .actsum{display:flex;flex-direction:column;margin-right:auto}
        .actionbar .actsum .l{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .actionbar .actsum .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
        .btn{min-height:var(--tap);padding:0 24px;border-radius:16px;border:none;cursor:pointer;font-size:18px;font-weight:800;display:inline-flex;align-items:center;gap:8px}
        .btn.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}.btn.ghost:active{background:var(--line)}
        .btn.primary{background:var(--teal);color:#fff;padding:0 30px;box-shadow:0 8px 18px -8px rgba(14,124,134,.7)}.btn.primary:active{background:var(--teal-d)}
        .btn.start{background:var(--teal);color:#fff;flex:1;justify-content:center;font-size:20px}
        .btn.danger{background:var(--red-bg);color:var(--red)}

        /* 시트 */
        .mask{position:fixed;inset:0;background:rgba(21,34,43,.42);display:none;z-index:40;align-items:flex-end}
        .mask.show{display:flex;animation:fade .15s ease}@keyframes fade{from{opacity:0}to{opacity:1}}
        .sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 20px calc(40px + env(safe-area-inset-bottom));
            box-shadow:0 -20px 40px -20px rgba(0,0,0,.4);animation:rise .2s cubic-bezier(.2,.7,.3,1);max-height:88dvh;overflow:auto}
        @keyframes rise{from{transform:translateY(40px)}to{transform:translateY(0)}}
        .sheet .sh{display:flex;align-items:center;margin-bottom:16px}
        .sheet .sh h3{font-size:20px;font-weight:800;margin:0;letter-spacing:-.02em}
        .sheet .sh .x{margin-left:auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;cursor:pointer}
        .sheet .body{max-width:660px;margin:0 auto}
        .fieldlab{font-size:14px;font-weight:800;color:var(--ink-2);margin:14px 2px 8px;display:flex;align-items:center;gap:8px}
        .opts{display:flex;flex-wrap:wrap;gap:10px}
        .opt{min-height:54px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
        .opt:active{background:var(--surface-2)}.opt.sel{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-d)}
        .opt .sub{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .opt .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px}
        .opt.sel .ck{background:var(--teal);color:#fff;border-color:var(--teal)}
        .sheet .ok{width:100%;margin-top:20px;background:var(--teal);color:#fff;min-height:var(--tap);border:none;border-radius:16px;font-size:19px;font-weight:800;cursor:pointer}
        .sheet .ok:disabled{background:var(--line);color:var(--ink-2)}
        .picklist{display:flex;flex-direction:column;gap:8px;max-height:52dvh;overflow:auto;margin-top:6px}
        .prow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
        .prow:active{background:var(--surface-2)}
        .prow.sel{border-color:var(--teal);background:var(--teal-bg);box-shadow:0 0 0 3px var(--teal-bg)}
        .prow.added{border-color:var(--teal);background:var(--teal-bg)}
        .prow .pid{flex:1;min-width:0}
        .prow .pnm{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
        .prow .pcode{font-size:12.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
        .prow .pr{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto}
        .prow .pr .pl{font-size:11px;color:var(--ink-2);font-weight:700}
        .prow .fifo{font-size:11px;font-weight:800;color:var(--teal-d);background:var(--surface);border:1px solid var(--teal);border-radius:999px;padding:2px 8px}
        .prow .pchk{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;flex:0 0 auto;font-weight:800;color:var(--teal-d)}
        .prow.added .pchk{background:var(--teal);color:#fff;border-color:var(--teal)}
        .dateedit{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 10px}
        .dateedit .dbtn{width:56px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700;cursor:pointer}
        .dateedit .dbtn:active{background:var(--line)}
        .dateedit .dval{min-width:200px;text-align:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
        .timeedit{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0}
        .tcol{display:flex;flex-direction:column;align-items:center;gap:8px}
        .tcol button{width:84px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:700;cursor:pointer}
        .tcol .tv{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;width:84px;text-align:center}
        .tsep{font-size:40px;font-weight:800;padding-bottom:4px}
        .pad .disp{margin-left:auto;min-width:140px;text-align:right;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px 16px}
        .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;margin:6px auto 0}
        .keys button{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:25px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
        .keys button:active{background:var(--surface-2)}.keys button.ok{background:var(--teal);color:#fff;border-color:var(--teal)}.keys button.clr{color:var(--red)}

        @media (max-width:680px){.qgrid{grid-template-columns:1fr}.wk{flex-wrap:wrap}}

<th:block layout:fragment="scripts">
    <script th:inline="none">
        /* ── 높이 자동 맞춤 ── */
        (function () {
            const root = document.querySelector('.ms-wash-root');
            if (!root) return;

            function localBelow() {
                let below = 0, node = root;
                while (node && node !== document.body) {
                    let sib = node.nextElementSibling;
                    while (sib) {
                        const r = sib.getBoundingClientRect();
                        if (r.height > 0 && getComputedStyle(sib).position !== 'fixed') below += r.height;
                        sib = sib.nextElementSibling;
                    }
                    node = node.parentElement;
                }
                let fx = 0;
                document.querySelectorAll('body *').forEach(el => {
                    if (root.contains(el)) return;
                    const cs = getComputedStyle(el);
                    if (cs.position !== 'fixed' && cs.position !== 'sticky') return;
                    const r = el.getBoundingClientRect();
                    if (r.height > 0 && r.height < innerHeight * 0.5 && r.bottom > innerHeight - 2) fx = Math.max(fx, r.height);
                });
                return Math.max(below, fx);
            }

            function availBottom() {
                let bottom = window.innerHeight;
                try {
                    const fe = window.frameElement;
                    if (fe) {
                        const pWin = window.parent, pDoc = pWin.document;
                        const feTop = fe.getBoundingClientRect().top;
                        let flow = 0, node = fe;
                        while (node && node !== pDoc.body) {
                            let sib = node.nextElementSibling;
                            while (sib) {
                                const cs = pWin.getComputedStyle(sib), r = sib.getBoundingClientRect();
                                if (r.height > 0 && cs.position !== 'fixed' && cs.position !== 'absolute') flow += r.height;
                                sib = sib.nextElementSibling;
                            }
                            node = node.parentElement;
                        }
                        let fx = 0;
                        pDoc.querySelectorAll('body *').forEach(el => {
                            if (el === fe || el.contains(fe)) return;
                            const cs = pWin.getComputedStyle(el);
                            if (cs.position !== 'fixed' && cs.position !== 'sticky' && cs.position !== 'absolute') return;
                            const r = el.getBoundingClientRect();
                            if (r.height > 0 && r.height <= 160 && r.top > feTop && r.bottom > pWin.innerHeight - 40)
                                fx = Math.max(fx, r.bottom - r.top);
                        });
                        const pFooter = Math.max(flow, fx);
                        bottom = Math.min(bottom, (pWin.innerHeight - pFooter) - feTop);
                    }
                } catch (e) {
                }
                return bottom;
            }

            function fit() {
                const top = root.getBoundingClientRect().top;
                const avail = availBottom() - top - localBelow();
                root.style.setProperty('--wash-h', Math.max(320, Math.floor(avail)) + 'px');
            }

            window.addEventListener('resize', fit);
            window.addEventListener('orientationchange', fit);
            try {
                window.parent.addEventListener('resize', fit);
            } catch (e) {
            }
            fit();
            requestAnimationFrame(fit);
            setTimeout(fit, 200);
            setTimeout(fit, 600);
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
        })();

        /* ── 기준 데이터 ── */
        const WD = ['일', '월', '화', '수', '목', '금', '토'];
        const WORKERS = ['정우철', '김민수', '이서연', '박지훈', '김세연', '안수정'];
        const EQUIPS = [['BL-01', '블리스터 A'], ['BL-02', '블리스터 B']];
        const STLAB = {wait: '대기', working: '작업중', done: '완료'};

        // 용기 반제품 로트(조립 산출물) — 클린부스
        const VES_LOTS = [
            {lot: 'VES-260624-30B', name: 'BSC+③ 30ml 00차수(3버전) 용기', fam: 'BSC', qty: 40, wh: '클린부스'},
            {lot: 'VES-260625-30B', name: 'BSC+③ 30ml 00차수(3버전) 용기', fam: 'BSC', qty: 80, wh: '클린부스'},
            {lot: 'VES-260626-30M', name: 'BmSC+③ 30ml 00차수(3버전) 용기', fam: 'BmSC', qty: 50, wh: '클린부스'}
        ];

        function autoVes(fam) {
            return VES_LOTS.filter(l => l.fam === fam && l.qty > 0)
                .sort((a, b) => a.lot < b.lot ? -1 : a.lot > b.lot ? 1 : 0)[0];  // 로트명 오름차순=오래된 것 먼저
        }

        function vesMeta(lot) {
            return VES_LOTS.find(l => l.lot === lot) || null;
        }

        // PK 부가자재 BOM(용기 외) — 클린룸 재고 소요
        const PK_INPUTS = [
            {code: 'M-DE00016', name: '주사기 세트 소', per: 1},
            {code: 'M-DT00014', name: 'BLD-30P', per: 1},
            {code: 'M-DT00015', name: 'BLD-30R', per: 1},
            {code: 'M-DT00012', name: '분리형캐뉼라 BLD-60R', per: 2},
            {code: 'M-DS00024', name: 'BD락주사기 10CC', per: 1},
            {code: 'M-DS00025', name: 'BD락주사기 20CC', per: 1},
            {code: 'M-DU00074-1', name: '캐뉼라 캡 - 60mm', per: 1},
            {code: 'M-DU00074-3', name: '캐뉼라 캡 - 74mm', per: 1},
            {code: 'M-DD00070', name: '스페이서', per: 1},
            {code: 'M-PR00040', name: '멸균지 소', per: 1}
        ];
        // 클린룸 재고(부가자재 추가용)
        const CLEAN_STOCK = [
            {code: 'M-DE00016', name: '주사기 세트 소', stock: 900},
            {code: 'M-DT00014', name: 'BLD-30P', stock: 500},
            {code: 'M-DT00015', name: 'BLD-30R', stock: 480},
            {code: 'M-DT00012', name: '분리형캐뉼라 BLD-60R', stock: 640},
            {code: 'M-DS00024', name: 'BD락주사기 10CC', stock: 1200},
            {code: 'M-DS00025', name: 'BD락주사기 20CC', stock: 1100},
            {code: 'M-DU00074-1', name: '캐뉼라 캡 - 60mm', stock: 700},
            {code: 'M-DU00074-3', name: '캐뉼라 캡 - 74mm', stock: 720},
            {code: 'M-DD00070', name: '스페이서', stock: 500},
            {code: 'M-PR00040', name: '멸균지 소', stock: 350},
            {code: 'M-DP00058', name: '에어밴트', stock: 640}
        ];

        function hhmm() {
            const d = new Date();
            return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        }

        function pillT(v) {
            if (!v) return '--:--';
            if (v.includes(' ')) {
                const [d, t] = v.split(' ');
                return d.slice(5).replace('-', '. ') + ' ' + t;
            }
            return v;
        }

        function bomQ(row, q) {
            return row.manual ? (row.qty || 0) : Math.round((row.per || 1) * (q || 0));
        }

        function newBom() {
            return PK_INPUTS.map(p => ({code: p.code, name: p.name, per: p.per, qty: 0, manual: false}));
        }

        function mkCrew(workers, equip, code, fam, start) {
            const av = autoVes(fam);
            return {
                workers: workers.slice(), equip, code, done: false, start: start || null, end: null,
                prod: {ves: av ? av.lot : null, qty: 0, st: 'wait', start: null, end: null, open: false, bom: newBom()}
            };
        }

        /* PK 작업지시 (생산지시로 생성) */
        const ORDERS = [
            {
                id: 'PK-2406-031',
                odate: '2026-07-06',
                pkname: 'BSC+③ 30ml PK 00차수(3버전)',
                pkcode: 'BSC30-PK00',
                fam: 'BSC',
                plan: 60,
                crews: [
                    {
                        workers: ['정우철', '김민수'], equip: '블리스터 A', code: 'BL-01', done: false,
                        start: '2026-07-06 09:30', end: null,
                        prod: {
                            ves: 'VES-260624-30B',
                            qty: 40,
                            st: 'working',
                            start: '2026-07-06 09:35',
                            end: null,
                            open: false,
                            bom: newBom()
                        }
                    }
                ]
            },
            {
                id: 'PK-2406-032',
                odate: '2026-07-06',
                pkname: 'BmSC+③ 30ml PK 00차수(3버전)',
                pkcode: 'BmSC30-PK00',
                fam: 'BmSC',
                plan: 45,
                crews: []
            },
            {
                id: 'PK-2406-035',
                odate: '2026-07-07',
                pkname: 'BSC+③ 60ml PK 02차수(중국)',
                pkcode: 'BSC60-PK02',
                fam: 'BSC',
                plan: 120,
                crews: []
            }
        ];

        /* 집계 */
        function crewQty(c) {
            return c.prod.st === 'done' ? (c.prod.qty || 0) : 0;
        }

        function crewSt(c) {
            if (c.done) return 'done';
            if (c.prod.st !== 'wait') return 'working';
            return 'wait';
        }

        function orderDone(o) {
            return o.crews.reduce((a, c) => a + crewQty(c), 0);
        }

        function orderSt(o) {
            if (!o.crews.length) return o.st0 || 'wait';
            if (o.crews.every(c => c.done)) return 'done';
            return 'working';
        }

        let curO = null, curC = null;

        /* ── A. 작업지시 큐 ── */
        const qgrid = document.getElementById('qgrid');
        let filter = 'all';

        function inRange(o) {
            const f = document.getElementById('dFrom').value, t = document.getElementById('dTo').value;
            if (f && o.odate < f) return false;
            if (t && o.odate > t) return false;
            return true;
        }

        function renderQueue() {
            const list = ORDERS.filter(o => (filter === 'all' || orderSt(o) === filter) && inRange(o));
            document.getElementById('qcnt').textContent = list.length + '건';
            qgrid.innerHTML = list.map(o => {
                const st = orderSt(o), done = orderDone(o), pct = Math.min(100, Math.round(done / o.plan * 100));
                return `<div class="wo" data-st="${st}" data-id="${o.id}"><div class="edge"></div>
      <div class="row1"><span class="wono">${o.id}</span>
        <span style="font-size:13px;color:var(--ink-2);font-weight:700">${o.odate}</span>
        <span class="chip ${st}">${STLAB[st]}</span></div>
      <div class="name">${o.pkname}</div>
      <div class="meta">
        <div class="blk"><span class="lab">계획</span><span class="val">${o.plan}</span></div>
        <div class="blk"><span class="lab">완료</span><span class="val left">${done}</span></div>
        <div class="blk"><span class="lab">작업조</span><span class="val">${o.crews.length}</span></div>
        <div class="prog"><span class="lab">${st === 'wait' ? '미시작' : '진행 ' + pct + '%'}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div></div></div>`;
            }).join('');
        }

        qgrid.addEventListener('click', e => {
            const c = e.target.closest('.wo');
            if (c) openOrder(c.dataset.id);
        });
        document.querySelectorAll('.qfilter button').forEach(b => b.addEventListener('click', () => {
            document.querySelectorAll('.qfilter button').forEach(x => x.classList.remove('on'));
            b.classList.add('on');
            filter = b.dataset.f;
            renderQueue();
        }));
        document.getElementById('btnSearch').addEventListener('click', renderQueue);
        (function initDates() {
            const t = new Date(), f = new Date();
            f.setDate(f.getDate() - 7);
            const fmt = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            document.getElementById('dFrom').value = fmt(f);
            document.getElementById('dTo').value = fmt(t);
        })();

        /* ── 화면 전환 ── */
        const SC = {
            A: document.getElementById('scA'),
            B: document.getElementById('scB'),
            C: document.getElementById('scC')
        };

        function show(k) {
            for (const x in SC) SC[x].classList.toggle('hide', x !== k);
        }

        document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => {
            const to = b.dataset.back;
            if (to === 'A') {
                renderQueue();
                show('A');
            } else {
                renderCrews();
                show('B');
            }
        }));

        /* ── B. 조 목록 ── */
        function openOrder(id) {
            curO = ORDERS.find(o => o.id === id);
            renderCrews();
            show('B');
        }

        function renderCrews() {
            document.getElementById('bName').textContent = curO.pkname;
            document.getElementById('bSub').textContent = `${curO.id} · ${curO.pkcode}`;
            const done = orderDone(curO), remain = Math.max(0, curO.plan - done);
            document.getElementById('ovPlan').textContent = curO.plan;
            document.getElementById('ovDone').textContent = done;
            document.getElementById('ovRemain').textContent = remain;
            document.getElementById('bDoneQty').textContent = done;
            document.getElementById('wkCnt').textContent = curO.crews.length + '조';
            const box = document.getElementById('wkList');
            if (!curO.crews.length) {
                box.innerHTML = `<div class="emptybox">아직 작업조가 없습니다. 아래 ‘작업조 추가’로 시작하세요.</div>`;
                return;
            }
            box.innerHTML = curO.crews.map((c, i) => {
                const st = crewSt(c);
                const del = crewDeletable(c) ? `<button class="wkdel" data-del="${i}">삭제</button>` : '';
                return `<div class="wk" data-st="${st}" data-i="${i}"><div class="edge"></div>
      <div class="who"><span class="nm">${c.workers.join(', ')}</span><span class="eq">${c.equip} · ${c.code}</span></div>
      <div class="wktime">${pillT(c.start)} ~ ${pillT(c.end)}</div>
      <div class="qty"><div class="l">블리스터</div><div class="v">${c.prod.qty || 0}</div></div>
      <span class="badge ${st}">${STLAB[st]}</span>${del}</div>`;
            }).join('');
        }

        function crewDeletable(c) {
            return !c.done && c.prod.st !== 'done';
        }

        document.getElementById('wkList').addEventListener('click', e => {
            const d = e.target.closest('[data-del]');
            if (d) {
                const i = +d.dataset.del, c = curO.crews[i];
                if (!crewDeletable(c)) {
                    flash('완료된 작업조는 삭제할 수 없습니다');
                    return;
                }
                const label = c.workers.join(', ');
                curO.crews.splice(i, 1);
                renderCrews();
                flash(`작업조 삭제 · ${label}`);
                return;
            }
            const w = e.target.closest('.wk');
            if (w) openCrew(+w.dataset.i);
        });
        document.getElementById('btnAddCrew').onclick = openCrewSheet;

        /* ── C. 작업조 작업 ── */
        function openCrew(i) {
            curC = curO.crews[i];
            curC._idx = i;
            renderProd();
            show('C');
        }

        function crewLabel(c) {
            return c.workers.join(', ');
        }

        function renderCHead() {
            document.getElementById('cHead').innerHTML = `
        <div class="infopill tap" data-time="start"><span>시작</span><b>${pillT(curC.start)}</b></div>
        <div class="infopill tap" data-time="end"><span>종료</span><b>${pillT(curC.end)}</b></div>
        <div class="infopill big"><span>블리스터</span><b>${curC.prod.qty || 0}</b></div>`;
        }

        function renderProd() {
            document.getElementById('cCrew').textContent = crewLabel(curC);
            document.getElementById('cSub').textContent = `${curO.pkname} · ${curC.equip}`;
            renderCHead();
            const p = curC.prod, vm = vesMeta(p.ves);
            let ctrl, actions;
            if (p.st === 'done') {
                ctrl = `<span class="qtytag">${p.qty}</span>`;
                actions = `<button class="itembtn ghost" data-act="uncomplete">완료취소</button>`;
            } else {
                ctrl = `<div class="stepper" data-vstep><button class="minus">−</button>
              <div class="qty" data-vpad>${p.qty}</div><button class="plus">+</button></div>`;
                actions = (p.st === 'wait')
                    ? `<button class="itembtn start" data-act="start">작업시작</button>`
                    : `<button class="itembtn done" data-act="complete">완료</button>`;
            }
            const times = (p.st === 'wait') ? '' : `<div class="vtimes">
          <span class="tp" data-vtime="start">시작 <b>${pillT(p.start)}</b></span>
          <span class="tp" data-vtime="end">종료 <b>${pillT(p.end)}</b></span></div>`;
            const locked = p.st === 'done';
            const vesRow = `<div class="veslot">
        <div class="vl"><div class="vlt">투입 용기 반제품 로트 · FIFO 자동선택</div>
          <div class="vll">${vm ? vm.lot : '미지정'}</div>
          <div class="vlm">${vm ? vm.name + ' · 가용 ' + vm.qty + ' · ' + vm.wh : '가용 로트 없음'}</div></div>
        ${locked ? `<span class="autotag">${p.ves || '-'}</span>` : `<button class="vchg" data-pickves>변경</button>`}</div>`;
            const bomRows = p.bom.map((b, bi) => {
                const auto = !b.manual;
                return `<div class="brow">
          <div class="bid"><div class="bn">${b.name}</div><div class="bc">${b.code}</div></div>
          <span class="autotag">${auto ? '자동' : '수정'}</span>
          <div class="bstep" data-bstep="${bi}"><button class="minus">−</button>
            <div class="bq ${auto ? 'auto' : ''}" data-bpad="${bi}">${bomQ(b, p.qty)}</div><button class="plus">+</button></div>
          <button class="brm" data-brm="${bi}">✕</button></div>`;
            }).join('');
            document.getElementById('prodBox').innerHTML = `
      <div class="vitem ${locked ? 'locked' : ''}" data-st="${p.st}"><div class="edge"></div>
        <div class="vhead">
          <div class="vid"><div class="pn">${curO.pkname}</div>
            <div class="sub"><span class="pc">${curO.pkcode}</span><span class="autotag">지시 ${curO.id}</span></div></div>
          <span class="st-badge ${p.st}">${STLAB[p.st]}</span>
          ${ctrl}${actions}${times}
        </div>
        ${vesRow}
        <div class="bomtoggle ${p.open ? 'open' : ''}" data-toggle><span class="caret">▶</span>
          부가자재 BOM (클린룸 재고 소요) · ${p.bom.length}종<span class="ln"></span></div>
        <div class="vbom ${p.open ? 'open' : ''}">
          <div class="browhead">투입자재<span class="ln"></span><button class="baddbtn" data-badd>＋ 자재</button></div>
          ${bomRows || '<div style="color:var(--ink-2);font-weight:700;padding:8px 0">투입자재가 없습니다. ＋자재로 추가하세요.</div>'}
        </div></div>`;
            renderCAction();
        }

        function renderCAction() {
            const bar = document.getElementById('cAction');
            if (curC.done) {
                bar.innerHTML = `<div class="actsum"><span class="l">${crewLabel(curC)} · 조 마감</span><span class="v">${curC.prod.qty || 0} EA</span></div>
        <button class="btn danger" data-cact="reopen">완료취소</button>`;
            } else {
                bar.innerHTML = `<div class="actsum"><span class="l">블리스터 완료수량</span><span class="v">${crewQty(curC)} EA</span></div>
        <button class="btn primary" data-cact="finish">작업 완료(조 마감)</button>`;
            }
        }

        /* C 이벤트 */
        document.getElementById('prodBox').addEventListener('click', e => {
            const p = curC.prod;
            const tg = e.target.closest('[data-toggle]');
            if (tg) {
                p.open = !p.open;
                renderProd();
                return;
            }
            const vs = e.target.closest('[data-vstep]');
            if (vs && (e.target.classList.contains('plus') || e.target.classList.contains('minus'))) {
                p.qty = Math.max(0, (+p.qty || 0) + (e.target.classList.contains('plus') ? 1 : -1));
                renderProd();
                return;
            }
            if (e.target.closest('[data-vpad]')) {
                openPad({type: 'ves'});
                return;
            }
            const bs = e.target.closest('[data-bstep]');
            if (bs && (e.target.classList.contains('plus') || e.target.classList.contains('minus'))) {
                const b = p.bom[+bs.dataset.bstep], base = bomQ(b, p.qty);
                b.manual = true;
                b.qty = Math.max(0, base + (e.target.classList.contains('plus') ? 1 : -1));
                renderProd();
                return;
            }
            const bpad = e.target.closest('[data-bpad]');
            if (bpad) {
                openPad({type: 'bom', bi: +bpad.dataset.bpad});
                return;
            }
            const brm = e.target.closest('[data-brm]');
            if (brm) {
                p.bom.splice(+brm.dataset.brm, 1);
                renderProd();
                flash('자재 삭제');
                return;
            }
            if (e.target.closest('[data-badd]')) {
                openPartSheet();
                return;
            }
            if (e.target.closest('[data-pickves]')) {
                openLotSheet();
                return;
            }
            const vt = e.target.closest('[data-vtime]');
            if (vt) {
                openTime(vt.dataset.vtime, p, '블리스터');
                return;
            }
            const act = e.target.closest('[data-act]');
            if (!act) return;
            if (act.dataset.act === 'start') {
                p.st = 'working';
                if (!p.start) p.start = curO.odate + ' ' + hhmm();
                renderProd();
                flash('작업 시작');
            } else if (act.dataset.act === 'complete') {
                if (p.qty <= 0) {
                    flash('블리스터 수량을 확인하세요');
                    return;
                }
                if (!p.ves) {
                    flash('용기 반제품 로트를 지정하세요');
                    return;
                }
                p.st = 'done';
                p.end = curO.odate + ' ' + hhmm();
                renderProd();
                renderCrews();
                flash(`블리스터 완료 · ${p.qty} PK 산출 (용기 ${p.ves} + 클린룸 재고 소요)`);
            } else if (act.dataset.act === 'uncomplete') {
                p.st = 'working';
                p.end = null;
                renderProd();
                renderCrews();
                flash('완료취소');
            }
        });
        document.getElementById('cAction').addEventListener('click', e => {
            const b = e.target.closest('[data-cact]');
            if (!b) return;
            if (b.dataset.cact === 'finish') {
                curC.done = true;
                curC.end = curO.odate + ' ' + hhmm();
                renderProd();
                renderCrews();
                flash('작업 완료 · 조 마감');
            } else if (b.dataset.cact === 'reopen') {
                curC.done = false;
                curC.end = null;
                renderProd();
                renderCrews();
                flash('완료취소 · 작업 재개');
            }
        });
        document.getElementById('cHead').addEventListener('click', e => {
            const t = e.target.closest('[data-time]');
            if (t) openTime(t.dataset.time, curC, crewLabel(curC));
        });

        /* ── 시트 공통 ── */
        function showMask(id) {
            document.getElementById(id).classList.add('show');
        }

        function hideMask(id) {
            document.getElementById(id).classList.remove('show');
        }

        document.querySelectorAll('.mask').forEach(m => m.addEventListener('click', e => {
            if (e.target === m || e.target.closest('[data-close]')) m.classList.remove('show');
        }));

        /* 작업조 편성 */
        let selWorkers = [], selE = null;

        function openCrewSheet() {
            selWorkers = [];
            selE = null;
            document.getElementById('workerOpts').innerHTML = WORKERS.map(w => `<button class="opt" data-w="${w}"><span class="ck"></span>${w}</button>`).join('');
            document.getElementById('equipOpts').innerHTML = EQUIPS.map(([c, n]) => `<button class="opt" data-e="${n}" data-c="${c}">${n} <span class="sub">${c}</span></button>`).join('');
            document.getElementById('crewOk').disabled = true;
            showMask('crewMask');
        }

        document.getElementById('workerOpts').addEventListener('click', e => {
            const b = e.target.closest('[data-w]');
            if (!b) return;
            const w = b.dataset.w, k = selWorkers.indexOf(w);
            if (k >= 0) {
                selWorkers.splice(k, 1);
                b.classList.remove('sel');
                b.querySelector('.ck').textContent = '';
            } else {
                selWorkers.push(w);
                b.classList.add('sel');
                b.querySelector('.ck').textContent = '✓';
            }
            ckCrew();
        });
        document.getElementById('equipOpts').addEventListener('click', e => {
            const b = e.target.closest('[data-e]');
            if (!b) return;
            document.querySelectorAll('#equipOpts .opt').forEach(x => x.classList.remove('sel'));
            b.classList.add('sel');
            selE = {name: b.dataset.e, code: b.dataset.c};
            ckCrew();
        });

        function ckCrew() {
            document.getElementById('crewOk').disabled = !(selWorkers.length && selE);
        }

        document.getElementById('crewOk').onclick = () => {
            curO.crews.push(mkCrew(selWorkers, selE.name, selE.code, curO.fam, curO.odate + ' ' + hhmm()));
            hideMask('crewMask');
            renderCrews();
            openCrew(curO.crews.length - 1);
            flash(`작업조 편성 · ${selWorkers.join(', ')} / ${selE.name}`);
        };

        /* 용기 로트 선택(FIFO) */
        function openLotSheet() {
            const list = VES_LOTS.filter(l => l.fam === curO.fam)
                .sort((a, b) => a.lot < b.lot ? -1 : a.lot > b.lot ? 1 : 0);
            const oldest = list.find(l => l.qty > 0);
            document.getElementById('lotList').innerHTML = list.map(l => `
        <div class="prow ${l.lot === curC.prod.ves ? 'sel' : ''}" data-lot="${l.lot}">
          <div class="pid"><div class="pnm">${l.lot}</div><div class="pcode">${l.name} · ${l.wh}</div></div>
          ${oldest && l.lot === oldest.lot ? '<span class="fifo">FIFO</span>' : ''}
          <div class="pr"><div class="pl">가용</div>${l.qty}</div>
          <div class="pchk">${l.lot === curC.prod.ves ? '✓' : ''}</div></div>`).join('')
                || '<div class="emptybox">가용 용기 로트가 없습니다.</div>';
            showMask('lotMask');
        }

        document.getElementById('lotList').addEventListener('click', e => {
            const o = e.target.closest('[data-lot]');
            if (!o) return;
            curC.prod.ves = o.dataset.lot;
            hideMask('lotMask');
            renderProd();
            flash('용기 로트 변경 · ' + o.dataset.lot);
        });

        /* 부가자재 추가 */
        function openPartSheet() {
            const has = code => curC.prod.bom.some(b => b.code === code);
            document.getElementById('partTitle').textContent = curO.pkname + ' · 부가자재 추가';
            document.getElementById('partList').innerHTML = CLEAN_STOCK.map((s, i) => `
        <div class="prow ${has(s.code) ? 'added' : ''}" data-part="${i}">
          <div class="pid"><div class="pnm">${s.name}</div><div class="pcode">${s.code}</div></div>
          <div class="pr"><div class="pl">클린룸 재고</div>${s.stock.toLocaleString()}</div>
          <div class="pchk">${has(s.code) ? '✓' : '＋'}</div></div>`).join('');
            showMask('partMask');
        }

        document.getElementById('partList').addEventListener('click', e => {
            const r = e.target.closest('[data-part]');
            if (!r) return;
            const s = CLEAN_STOCK[+r.dataset.part], bom = curC.prod.bom;
            const k = bom.findIndex(b => b.code === s.code);
            if (k >= 0) {
                bom.splice(k, 1);
                flash('자재 제거');
            } else {
                bom.push({code: s.code, name: s.name, per: 1, qty: curC.prod.qty || 0, manual: true});
                flash('자재 추가');
            }
            openPartSheet();
            renderProd();
        });

        /* 시간 수정 (조/생산 공용) */
        let timeWhich = 'start', timeTarget = null, editDate = new Date();

        function fmtDEdit(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} (${WD[d.getDay()]})`;
        }

        function openTime(which, target, label) {
            timeWhich = which;
            timeTarget = target;
            document.getElementById('timeTitle').textContent = (label ? label + ' · ' : '') + (which === 'start' ? '시작' : '종료') + ' 일시 수정';
            const saved = which === 'start' ? target.start : target.end;
            if (saved && saved.includes(' ')) {
                const [ds, ts] = saved.split(' ');
                editDate = new Date(ds + 'T' + ts);
            } else editDate = new Date(curO.odate + 'T' + hhmm());
            document.getElementById('tDate').textContent = fmtDEdit(editDate);
            document.getElementById('tH').textContent = String(editDate.getHours()).padStart(2, '0');
            document.getElementById('tM').textContent = String(editDate.getMinutes()).padStart(2, '0');
            showMask('timeMask');
        }

        document.querySelector('#timeMask .dateedit').addEventListener('click', e => {
            const b = e.target.closest('[data-d]');
            if (!b) return;
            editDate.setDate(editDate.getDate() + (+b.dataset.d));
            document.getElementById('tDate').textContent = fmtDEdit(editDate);
        });
        document.querySelector('#timeMask .timeedit').addEventListener('click', e => {
            const b = e.target.closest('[data-t]');
            if (!b) return;
            const H = document.getElementById('tH'), M = document.getElementById('tM');
            let h = +H.textContent, m = +M.textContent;
            if (b.dataset.t === 'h+') h = (h + 1) % 24;
            if (b.dataset.t === 'h-') h = (h + 23) % 24;
            if (b.dataset.t === 'm+') m = (m + 1) % 60;
            if (b.dataset.t === 'm-') m = (m + 59) % 60;
            H.textContent = String(h).padStart(2, '0');
            M.textContent = String(m).padStart(2, '0');
        });
        document.getElementById('timeOk').onclick = () => {
            const ds = `${editDate.getFullYear()}-${String(editDate.getMonth() + 1).padStart(2, '0')}-${String(editDate.getDate()).padStart(2, '0')}`;
            const v = ds + ' ' + document.getElementById('tH').textContent + ':' + document.getElementById('tM').textContent;
            if (timeWhich === 'start') timeTarget.start = v; else timeTarget.end = v;
            hideMask('timeMask');
            renderProd();
            renderCrews();
            flash((timeWhich === 'start' ? '시작' : '종료') + ' 저장 ' + pillT(v));
        };

        /* 넘패드 (블리스터수량 / BOM 공용) */
        let padCtx = null, padVal = '';

        function openPad(ctx) {
            padCtx = ctx;
            const p = curC.prod;
            if (ctx.type === 'ves') {
                padVal = String(p.qty || 0);
                document.getElementById('padLab').textContent = '블리스터 수량';
            } else {
                const b = p.bom[ctx.bi];
                padVal = String(bomQ(b, p.qty));
                document.getElementById('padLab').textContent = b.name + ' · 소요량';
            }
            document.getElementById('padDisp').textContent = padVal;
            showMask('padMask');
        }

        document.querySelector('#padMask .keys').addEventListener('click', e => {
            const k = e.target.dataset.k;
            if (!k) return;
            if (k === 'C') padVal = '';
            else if (k === 'OK') {
                const val = Math.max(0, parseInt(padVal || '0', 10)), p = curC.prod;
                if (padCtx.type === 'ves') p.qty = val;
                else {
                    const b = p.bom[padCtx.bi];
                    b.manual = true;
                    b.qty = val;
                }
                hideMask('padMask');
                renderProd();
                return;
            } else padVal = (padVal === '0' ? '' : padVal) + k;
            document.getElementById('padDisp').textContent = padVal || '0';
        });

        /* 토스트 */
        let tT;

        function flash(m) {
            let t = document.getElementById('toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'toast';
                t.style.cssText = 'position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#15222B;color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;z-index:60;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:opacity .3s;max-width:90vw;text-align:center';
                document.body.appendChild(t);
            }
            t.textContent = m;
            t.style.opacity = '1';
            clearTimeout(tT);
            tT = setTimeout(() => t.style.opacity = '0', 1800);
        }

        renderQueue();
    </script>

    <!-- 스텝퍼 롱프레스 자동증감 -->
    <style>
        .stepper button, .bstep button, .dateedit button, .timeedit button {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
    </style>
    <script>
        (function () {
            var SEL = '.stepper button, .bstep button, .dateedit button, .timeedit button';
            var holdTimer = null, repeatTimer = null, maxTimer = null, curBtn = null;
            var END_EVENTS = ['pointerup', 'pointercancel', 'lostpointercapture', 'touchend', 'touchcancel', 'mouseup'];

            function stop() {
                clearTimeout(holdTimer);
                clearInterval(repeatTimer);
                clearTimeout(maxTimer);
                holdTimer = repeatTimer = maxTimer = null;
                if (curBtn) {
                    END_EVENTS.forEach(function (ev) {
                        curBtn.removeEventListener(ev, stop);
                    });
                    curBtn = null;
                }
            }

            function tick(x, y) {
                var el = document.elementFromPoint(x, y);
                var b = (el && el.closest) ? el.closest(SEL) : null;
                if (!b) {
                    stop();
                    return;
                }
                b.click();
            }

            document.addEventListener('pointerdown', function (e) {
                if (e.button != null && e.button > 0) return;
                var btn = e.target.closest ? e.target.closest(SEL) : null;
                if (!btn) return;
                var x = e.clientX, y = e.clientY;
                stop();
                curBtn = btn;
                END_EVENTS.forEach(function (ev) {
                    btn.addEventListener(ev, stop);
                });
                holdTimer = setTimeout(function () {
                    repeatTimer = setInterval(function () {
                        tick(x, y);
                    }, 80);
                    maxTimer = setTimeout(stop, 8000);
                }, 400);
                window.addEventListener('pointerup', stop, {once: true, capture: true});
                window.addEventListener('touchend', stop, {once: true, capture: true});
            });
            window.addEventListener('blur', stop);
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) stop();
            });
        })();
    </script>
</th:block>
</html>
