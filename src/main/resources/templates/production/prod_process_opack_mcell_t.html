<html layout:decorate="~{layout_page}">

<th:block layout:fragment="content">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"/>
  <style>
      :root{--bg:#E9EEF1;--surface:#FFF;--surface-2:#F4F7F9;--ink:#15222B;--ink-2:#5A6B76;--line:#D8E0E5;
          --teal:#0E7C86;--teal-d:#0A5C64;--teal-bg:#E2F1F2;--green:#1E9D58;--green-bg:#E4F4EA;
          --amber:#C77A00;--amber-bg:#FBEFD8;--red:#C8483B;--red-bg:#F7E4E1;--purple:#6B3FA0;--purple-bg:#EEE7FA;
          --r:18px;--tap:60px;--shadow:0 1px 0 rgba(21,34,43,.04),0 8px 24px -16px rgba(21,34,43,.28)}
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
      .ms-pack-root{font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif;color:var(--ink);font-size:17px;
          line-height:1.45;-webkit-font-smoothing:antialiased;flex:1 1 auto;min-height:0;
          height:var(--wash-h,100%);max-height:var(--wash-h,none);display:flex;flex-direction:column;position:relative}
      .ms-pack-root .app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-radius:12px;overflow:hidden}
      .screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}.screen.hide{display:none}

      .wrap{padding:22px 20px 28px;max-width:1180px;margin:0 auto;width:100%;overflow:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
      .qhead{display:flex;align-items:baseline;gap:12px;margin:2px 2px 18px}
      .qhead h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0}
      .qhead .cnt{color:var(--ink-2);font-weight:700}
      .qfilter{display:flex;gap:8px;margin-left:auto}
      .qfilter button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);
          background:var(--surface);color:var(--ink-2);font-weight:700;font-size:15px;cursor:pointer}
      .qfilter button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
      .searchbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 18px;
          background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
      .searchbar .slab{font-weight:800;color:var(--ink-2);font-size:14px}
      .dinput{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;
          font-weight:700;color:var(--ink);background:var(--surface-2);font-variant-numeric:tabular-nums;min-width:150px}
      .sbtn{height:48px;padding:0 22px;border:none;border-radius:12px;background:var(--teal);color:#fff;
          font-weight:800;font-size:16px;cursor:pointer;margin-left:auto}
      .sbtn:active{background:var(--teal-d)}
      .qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
      .wo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;
          cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease;position:relative;overflow:hidden}
      .wo:active{transform:scale(.985)}
      .wo .edge{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
      .wo[data-st="working"] .edge{background:var(--teal)}.wo[data-st="wait"] .edge{background:var(--amber)}.wo[data-st="done"] .edge{background:var(--green)}
      .wo .row1{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
      .wo .wono{font-weight:800;font-size:14px;color:var(--ink-2)}
      .chip{margin-left:auto;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800}
      .chip.working{background:var(--teal-bg);color:var(--teal-d)}.chip.wait{background:var(--amber-bg);color:var(--amber)}.chip.done{background:var(--green-bg);color:var(--green)}
      .wo .name{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.3;margin:2px 0 12px}
      .wo .meta{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
      .wo .meta .blk{display:flex;flex-direction:column;gap:1px}
      .wo .meta .lab{font-size:11.5px;color:var(--ink-2);font-weight:700}
      .wo .meta .val{font-size:17px;font-weight:800}
      .wo .prog{margin-left:auto;text-align:right}
      .wo .bar{height:6px;width:78px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:5px}
      .wo .bar>i{display:block;height:100%;background:var(--teal);border-radius:999px}

      .topbar2{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);
          padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);z-index:2;flex-wrap:wrap}
      .back{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);
          display:grid;place-items:center;cursor:pointer;font-size:22px;flex:0 0 auto}
      .back:active{background:var(--line)}
      .htitle{min-width:0;flex:1}
      .htitle .t{font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .htitle .s{font-size:13.5px;color:var(--ink-2);font-weight:700;margin-top:1px}

      .col-stack{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;height:100%}
      .bscroll{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px}
      .bgrid{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
      .ovbox{display:flex;gap:12px;flex-wrap:wrap}
      .ov{flex:1;min-width:130px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
          padding:14px 16px;box-shadow:var(--shadow)}
      .ov .l{font-size:13px;color:var(--ink-2);font-weight:700}
      .ov .v{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
      .ov.left .v{color:var(--teal-d)}
      .secline{display:flex;align-items:center;gap:10px;margin:6px 2px 0;color:var(--ink-2);font-weight:800;font-size:14px}
      .secline .ln{flex:1;height:1px;background:var(--line)}

      .unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;
          box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:16px;position:relative;
          overflow:hidden;transition:transform .12s ease;flex-wrap:wrap;margin-bottom:10px}
      .unit:active{transform:scale(.99)}
      .unit .edge{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--amber)}
      .unit.packed .edge{background:var(--green)}
      .unit.sess .edge{background:var(--teal)}
      .unit.sess.closed .edge{background:var(--green)}
      .unit .who{display:flex;flex-direction:column;gap:3px;min-width:200px;flex:1}
      .unit .lot{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;word-break:break-all}
      .unit .sub{font-size:12.5px;color:var(--ink-2);font-weight:700}
      .unit .badge{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800;flex:0 0 auto}
      .unit .badge.wait{background:var(--amber-bg);color:var(--amber)}
      .unit .badge.done{background:var(--green-bg);color:var(--green)}
      .unit .badge.work{background:var(--teal-bg);color:var(--teal-d)}
      .unit .go{font-size:24px;color:var(--ink-2);flex:0 0 auto;line-height:1}
      /* 선택형(포장 대상 고르기) */
      .unit.pick{padding:14px 16px}
      .unit.pick .tick{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;
          font-size:19px;font-weight:800;color:transparent;flex:0 0 auto;background:var(--surface-2)}
      .unit.pick.sel{border-color:var(--teal);background:linear-gradient(180deg,var(--teal-bg),#FFF)}
      .unit.pick.sel .tick{border-color:var(--teal);background:var(--teal);color:#fff}
      .unit.readonly{cursor:default}
      .rbadge{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--purple-bg);color:var(--purple)}
      .emptysess{text-align:center;color:var(--ink-2);font-weight:700;padding:30px;border:1.5px dashed var(--line);border-radius:var(--r)}

      .infopill{display:flex;gap:7px;align-items:center;background:var(--surface-2);border:1px solid var(--line);
          border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
      .infopill b{color:var(--ink);font-variant-numeric:tabular-nums}
      .infopill.tap{cursor:pointer}.infopill.tap:active{background:var(--line)}
      .infopill.tap b{color:var(--teal-d);text-decoration:underline dotted}
      .sstate{padding:8px 14px;border-radius:999px;font-weight:800;font-size:14px}
      .sstate.wait{background:var(--amber-bg);color:var(--amber)}
      .sstate.work{background:var(--teal-bg);color:var(--teal-d)}
      .sstate.done{background:var(--green-bg);color:var(--green)}

      .part{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
          display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);flex-wrap:wrap}
      .part.ok{border-color:var(--green);background:linear-gradient(180deg,#F2FBF5,#FFF)}
      .part.need{border-color:var(--amber);background:linear-gradient(180deg,#FEF8EC,#FFF)}
      .part .id{display:flex;flex-direction:column;min-width:0;flex:1}
      .part .pn{font-size:18px;font-weight:800;letter-spacing:-.02em;word-break:break-all}
      .part .pc{font-size:13px;color:var(--ink-2);font-weight:700}
      .done-tag{padding:7px 14px;border-radius:999px;background:var(--green-bg);color:var(--green);font-weight:800;font-size:14px}
      .req{padding:4px 9px;border-radius:999px;background:var(--red-bg);color:var(--red);font-size:12px;font-weight:800}

      .mat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
          display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);margin-bottom:10px;flex-wrap:wrap}
      .mat.on{border-color:var(--green);background:linear-gradient(180deg,#F2FBF5,#FFF)}
      .mat.short{border-color:var(--red);background:linear-gradient(180deg,#FDF3F1,#FFF)}
      .mat .chk{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;
          font-size:19px;font-weight:800;color:transparent;flex:0 0 auto;background:var(--surface-2)}
      .mat.on .chk{border-color:var(--green);background:var(--green);color:#fff}
      .mat .mid{flex:1;min-width:0}
      .mat .mn{font-size:16px;font-weight:800;line-height:1.3}
      .mat .mc{font-size:12.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
      .mat .mc .warn{color:var(--red)}
      .mat .mstep{display:flex;align-items:center;flex:0 0 auto}
      .mat .mstep button{width:44px;height:48px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700;cursor:pointer}
      .mat .mstep button:first-child{border-radius:12px 0 0 12px}
      .mat .mstep button:last-child{border-radius:0 12px 12px 0}
      .mat .mstep .n{width:58px;height:48px;display:grid;place-items:center;border-top:1px solid var(--line);
          border-bottom:1px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums;background:#FFFDF4;cursor:pointer}

      .actionbar{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);
          padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;
          box-shadow:0 -8px 24px -18px rgba(21,34,43,.4);flex-wrap:wrap}
      .actionbar .actsum{display:flex;flex-direction:column;margin-right:auto}
      .actionbar .actsum .l{font-size:12.5px;color:var(--ink-2);font-weight:700}
      .actionbar .actsum .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
      .btn{min-height:var(--tap);padding:0 24px;border-radius:16px;border:none;cursor:pointer;font-size:18px;
          font-weight:800;display:inline-flex;align-items:center;gap:8px}
      .btn.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}.btn.ghost:active{background:var(--line)}
      .btn.primary{background:var(--teal);color:#fff;padding:0 36px;box-shadow:0 8px 18px -8px rgba(14,124,134,.7)}.btn.primary:active{background:var(--teal-d)}
      .btn.primary:disabled{background:var(--line);color:var(--ink-2);box-shadow:none;cursor:default}
      .btn.start{background:var(--teal);color:#fff;flex:1;justify-content:center;font-size:20px}
      .btn.danger{background:var(--red-bg);color:var(--red)}
      .btn.sm{min-height:44px;padding:0 16px;font-size:15px;border-radius:12px}

      /* ★ .mask 는 fixed 가 아니라 root 기준 absolute (--wash-h 로 높이를 직접 계산하므로) */
      .mask{position:absolute;inset:0;background:rgba(21,34,43,.42);display:none;z-index:40;align-items:flex-end}
      .mask.show{display:flex}
      .sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;
          padding:20px 20px calc(30px + env(safe-area-inset-bottom));
          box-shadow:0 -20px 40px -20px rgba(0,0,0,.4);max-height:92%;overflow:auto}
      .sheet .sh{display:flex;align-items:center;margin-bottom:16px}
      .sheet .sh h3{font-size:20px;font-weight:800;margin:0;letter-spacing:-.02em}
      .sheet .sh .x{margin-left:auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;cursor:pointer}
      .sheet .body{max-width:640px;margin:0 auto}
      .fieldlab{font-size:14px;font-weight:800;color:var(--ink-2);margin:14px 2px 8px}
      .opts{display:flex;flex-wrap:wrap;gap:10px}
      .opt{min-height:54px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);
          font-weight:800;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
      .opt:active{background:var(--surface-2)}.opt.sel{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-d)}
      .opt .sub{font-size:12.5px;color:var(--ink-2);font-weight:700}
      .optsep{flex:0 0 100%;font-size:13px;font-weight:800;color:var(--ink-2);margin:6px 2px -2px}
      .sheet .ok{width:100%;margin-top:20px;background:var(--teal);color:#fff;min-height:var(--tap);border:none;
          border-radius:16px;font-size:19px;font-weight:800;cursor:pointer}
      .sheet .ok:disabled{background:var(--line);color:var(--ink-2)}
      .txin{width:100%;height:56px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font-size:18px;
          font-weight:800;background:var(--surface-2);font-variant-numeric:tabular-nums}
      .scanres{margin-top:14px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:14px;font-weight:700}
      .scanres.ok{border-color:var(--green);background:var(--green-bg);color:var(--green)}
      .scanres.ng{border-color:var(--red);background:var(--red-bg);color:var(--red)}
      /* 카메라 스캔 */
      .camwrap{display:none;position:relative;border-radius:16px;overflow:hidden;background:#0B1418;margin-bottom:14px}
      .camwrap.on{display:block}
      .camwrap video{display:block;width:100%;max-height:44vh;object-fit:cover;background:#0B1418}
      .camwrap .camguide{position:absolute;left:8%;right:8%;top:50%;transform:translateY(-50%);
          height:26%;border:2px solid rgba(255,255,255,.85);border-radius:12px;
          box-shadow:0 0 0 9999px rgba(0,0,0,.28);pointer-events:none}
      .camwrap .camstop{position:absolute;right:12px;top:12px;min-height:44px;padding:0 16px;border-radius:12px;
          border:none;background:rgba(21,34,43,.72);color:#fff;font-weight:800;font-size:14px;cursor:pointer}
      .camnote{font-size:13px;font-weight:700;color:var(--ink-2);margin:0 2px 4px;line-height:1.5}
      .camnote.warn{color:var(--red)}
      .pad .disp{margin-left:auto;min-width:140px;text-align:right;font-size:30px;font-weight:800;
          font-variant-numeric:tabular-nums;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px 16px}
      .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;margin:6px auto 0}
      .keys button{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);
          font-size:25px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
      .keys button.ok{background:var(--teal);color:#fff;border-color:var(--teal);margin-top:0;min-height:0;height:62px;width:auto}
      .keys button.clr{color:var(--red)}
      .dateedit{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 10px}
      .dateedit .dbtn{width:56px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700;cursor:pointer}
      .dateedit .dval{min-width:200px;text-align:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
      .timeedit{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0}
      .tcol{display:flex;flex-direction:column;align-items:center;gap:8px}
      .tcol button{width:84px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:700;cursor:pointer}
      .tcol .tv{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;width:84px;text-align:center}
      .tsep{font-size:40px;font-weight:800;padding-bottom:4px}
      .form-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
      .form-tbl th,.form-tbl td{border:1px solid var(--line);padding:9px 10px;text-align:left}
      .form-tbl th{background:var(--surface-2);font-weight:800}
      .form-tbl td.num{font-variant-numeric:tabular-nums;word-break:break-all}
      /* ★ 레이아웃 전역에 .num 이 알약(민트 배경 + 흰 글자)으로 정의돼 있다.
         이 화면은 .num 을 '숫자 정렬' 용도로만 쓰므로 root 안에서만 되돌린다.
         전역 파일을 고치면 그 클래스를 쓰는 다른 화면이 같이 바뀐다. */
      .ms-pack-root .num{display:inline;justify-content:initial;text-align:inherit;
          padding:0;background-color:transparent;border-radius:0;font-size:inherit;color:inherit}
      /* 포장 완료 박스 상세 — 레이아웃 전역 CSS 가 table 셀을 건드려서 div 로 짠다 */
      .dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
          background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
      .dhead .dlot{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;
          letter-spacing:-.02em;word-break:break-all;flex:1;min-width:0}
      .drows{margin-top:12px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
      .drow{display:flex;align-items:baseline;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
      .drow:last-child{border-bottom:none}
      .drow>.k{flex:0 0 96px;font-size:13px;font-weight:800;color:var(--ink-2)}
      .drow>.v{flex:1;min-width:0;font-size:16px;font-weight:800;word-break:break-all}
      .drow>.v.num{font-variant-numeric:tabular-nums}
      .drow>.v.muted{color:var(--ink-2);font-weight:700}
      @media (max-width:1100px){.qgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
      @media (max-width:680px){.qgrid{grid-template-columns:1fr}}
      @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
  </style>

  <div class="ms-pack-root">
    <div class="app">

      <!-- A. 포장 작지 큐 -->
      <div class="screen" id="scA"><div class="wrap">
        <div class="qhead"><h1>2공장 포장 공정</h1><span class="cnt" id="qcnt"></span>
          <div class="qfilter"><button class="on" data-f="all">전체</button>
            <button data-f="wait">대기</button><button data-f="working">작업중</button>
            <button data-f="done">완료</button></div></div>
        <div class="searchbar">
          <span class="slab">작업지시일</span>
          <input type="date" id="dFrom" class="dinput"/>
          <span style="font-weight:800;color:var(--ink-2)">~</span>
          <input type="date" id="dTo" class="dinput"/>
          <button class="sbtn" id="btnSearch">조회</button>
        </div>
        <div class="qgrid" id="qgrid"></div>
      </div></div>

      <!-- B. 작업(작업자·설비) 목록 -->
      <div class="screen hide" id="scB"><div class="col-stack">
        <div class="topbar2">
          <button class="back" data-back="A">‹</button>
          <div class="htitle"><div class="t" id="bName">—</div><div class="s" id="bSub">—</div></div>
        </div>
        <div class="bscroll"><div class="bgrid">
          <div class="ovbox" id="ovbox"></div>
          <div class="secline">작업 <span class="ln"></span><span id="sessCnt"></span></div>

<th:block layout:fragment="scripts">
  <script th:inline="none">
   /* ══ 높이 자동 맞춤 (세척·조립 화면과 동일) ══ */
   (function () {
    const root = document.querySelector('.ms-pack-root');
    if (!root) return;
    function localBelow() {
     let below = 0, node = root;
     while (node && node !== document.body) {
      let sib = node.nextElementSibling;
      while (sib) {
       const r = sib.getBoundingClientRect();
       if (r.height > 0 && getComputedStyle(sib).position !== 'fixed') below += r.height;
       sib = sib.nextElementSibling;
      }
      node = node.parentElement;
     }
     let fx = 0;
     document.querySelectorAll('body *').forEach(el => {
      if (root.contains(el)) return;
      const cs = getComputedStyle(el);
      if (cs.position !== 'fixed' && cs.position !== 'sticky') return;
      const r = el.getBoundingClientRect();
      if (r.height > 0 && r.height < innerHeight * 0.5 && r.bottom > innerHeight - 2) fx = Math.max(fx, r.height);
     });
     return Math.max(below, fx);
    }
    function availBottom() {
     let bottom = window.innerHeight;
     try {
      const fe = window.frameElement;
      if (fe) {
       const pWin = window.parent, pDoc = pWin.document;
       const feTop = fe.getBoundingClientRect().top;
       let flow = 0, node = fe;
       while (node && node !== pDoc.body) {
        let sib = node.nextElementSibling;
        while (sib) {
         const cs = pWin.getComputedStyle(sib), r = sib.getBoundingClientRect();
         if (r.height > 0 && cs.position !== 'fixed' && cs.position !== 'absolute') flow += r.height;
         sib = sib.nextElementSibling;
        }
        node = node.parentElement;
       }
       let fx = 0;
       pDoc.querySelectorAll('body *').forEach(el => {
        if (el === fe || el.contains(fe)) return;
        const cs = pWin.getComputedStyle(el);
        if (cs.position !== 'fixed' && cs.position !== 'sticky' && cs.position !== 'absolute') return;
        const r = el.getBoundingClientRect();
        if (r.height > 0 && r.height <= 160 && r.top > feTop && r.bottom > pWin.innerHeight - 40)
         fx = Math.max(fx, r.bottom - r.top);
       });
       bottom = Math.min(bottom, (pWin.innerHeight - Math.max(flow, fx)) - feTop);
      }
     } catch (e) {}
     return bottom;
    }
    function fit() {
     const top = root.getBoundingClientRect().top;
     root.style.setProperty('--wash-h', Math.max(320, Math.floor(availBottom() - top - localBelow())) + 'px');
    }
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', fit);
    try { window.parent.addEventListener('resize', fit); } catch (e) {}
    fit(); requestAnimationFrame(fit); setTimeout(fit, 200); setTimeout(fit, 600);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
   })();

   /* ══ 공통 ══ */
   const CTX = Object.assign({spjangcd: 'ZZ', process_code: 'mc03', factory_id: 2},
    (typeof window.PACK_CTX !== 'undefined' ? window.PACK_CTX : {}));
   const API = '/api/production/mcell/pack';
   const WD = ['일','월','화','수','목','금','토'];

   // ★ AjaxUtil 은 window 프로퍼티가 아니다. typeof 로 확인한다.
   //   메서드명을 조건에 걸지 않는다(getJson 같은 건 존재하지 않는다).
   function hasAjax() { return (typeof AjaxUtil !== 'undefined' && AjaxUtil); }

   function bootFail(msg) {
    var g = document.getElementById('qgrid');
    if (g) g.innerHTML = '<div class="emptysess">' + msg + '</div>';
   }

   // 빈 값은 아예 보내지 않는다 — CAST(:x AS date) 에 '' 이 들어가면 서버에서 터진다
   function clean(o) {
    var p = {};
    Object.keys(o || {}).forEach(function (k) {
     if (o[k] !== null && o[k] !== undefined && o[k] !== '') p[k] = o[k];
    });
    return p;
   }

   /* ★ AjaxUtil.getSyncData 는 동기 함수다 — 콜백을 받지 않고 결과를 그대로 반환한다.
        (검사 화면과 동일) 콜백을 넘기면 아무 일도 일어나지 않아 요청 자체가 안 나간다. */
   function get(url, param, cb) {
    if (!hasAjax()) { bootFail('AjaxUtil 로드 실패 — 화면을 새로고침하세요.'); return; }
    var res;
    try {
     res = AjaxUtil.getSyncData(url, clean(param)) || {};
    } catch (e) {
     flash('조회 오류 : ' + (e.message || e));
     console.error('[pack]', url, e);
     cb(null);
     return;
    }
    if (res.success === false) { flash(res.message || '조회 실패'); cb(null); return; }
    cb(res.data == null ? null : res.data);
   }

   /* 있으면 쓰고 없으면 조용히 넘어가는 조회.
      /label_check 처럼 서버에 아직 없을 수 있는 보조 API 전용 — 토스트를 띄우지 않는다. */
   function getSoft(url, param, cb) {
    if (!hasAjax()) { cb(null); return; }
    try {
     var res = AjaxUtil.getSyncData(url, clean(param)) || {};
     cb(res.success === false ? null : (res.data == null ? null : res.data));
    } catch (e) { cb(null); }
   }

   // postAsyncData 는 콜백 방식이 맞다
   function post(url, param, cb) {
    if (!hasAjax()) { flash('AjaxUtil 로드 실패'); return; }
    AjaxUtil.postAsyncData(url, clean(param), function (res) {
     if (!res || res.success === false) { flash((res && res.message) || '처리 실패'); if (cb) cb(null, res); return; }
     if (res.message) flash(res.message);
     if (cb) cb(res.data || {}, res);
    });
   }

   let tT;
   function flash(m) {
    var t = document.getElementById('packToast');
    if (!t) {
     t = document.createElement('div'); t.id = 'packToast';
     t.style.cssText = 'position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#15222B;color:#fff;' +
      'padding:14px 22px;border-radius:14px;font-weight:700;z-index:60;max-width:80vw;text-align:center;' +
      'box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:opacity .3s';
     document.body.appendChild(t);
    }
    t.textContent = m; t.style.opacity = '1';
    clearTimeout(tT); tT = setTimeout(function () { t.style.opacity = '0'; }, 2200);
   }

   // uiConfirm 은 레이아웃 전역이 아니다 — 이 화면이 자기 것을 쓴다
   let confCb = null;
   function uiConfirm(title, body, cb) {
    document.getElementById('confTitle').textContent = title;
    document.getElementById('confBody').textContent = body;
    confCb = cb; showMask('confMask');
   }
   document.getElementById('confOk').onclick = function () {
    hideMask('confMask'); var c = confCb; confCb = null; if (c) c();
   };

   function showMask(id) { document.getElementById(id).classList.add('show'); }
   function hideMask(id) { document.getElementById(id).classList.remove('show'); }
   document.querySelectorAll('.mask').forEach(function (m) {
    m.addEventListener('click', function (e) {
     if (e.target === m || (e.target.closest && e.target.closest('[data-close]'))) m.classList.remove('show');
    });
   });

   function fmtDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
   }
   function nowHM() {
    var d = new Date();
    return fmtDate(d) + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
   }
   function pill(v) {
    if (!v) return '--:--';
    return (v.indexOf(' ') >= 0) ? (v.split(' ')[0].slice(5) + ' ' + v.split(' ')[1]) : v;
   }
   function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
     return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
   }
   function num(v) { return (v == null || v === '') ? 0 : Number(v); }

   /* GS1-128 → (10) 로트 추출. 괄호표기 / 원시 element string 둘 다.
      스캐너가 전체 데이터를 던져도 서버엔 라벨 문자열만 보낸다. */
   function pickLot(raw) {
    raw = String(raw || '').trim();
    if (!raw) return '';
    var m;
    if (raw.indexOf('(') >= 0) {
     if ((m = raw.match(/\(10\)([^()\u001d]+)/))) return m[1].trim();
     return raw;
    }
    var GS = '\u001d';
    var s = raw.replace(/^\]C1/, '').replace(/^\u001d/, '');
    var FIXED = {'00':18,'01':14,'02':14,'11':6,'12':6,'13':6,'15':6,'16':6,'17':6,'20':2};
    var i = 0;
    while (i < s.length) {
     if (s[i] === GS) { i++; continue; }
     var ai = s.substr(i, 2); i += 2;
     var flen = FIXED[ai];
     if (flen != null) {
      if (ai === '10') return s.substr(i, flen);
      i += flen;
     } else {
      var g = s.indexOf(GS, i), end = (g < 0 ? s.length : g);
      var v = s.substring(i, end); i = end;
      if (ai === '10') return v.trim();
     }
    }
    return raw;
   }

   /* ══ 상태 ══
      작업(세션)은 별도 테이블이 없다. v3 §5.1 과 같은 방식으로
      (작업일자 · 작업자 · 설비) 로 mat_produce 를 묶어 파생시킨다.
      아직 한 박스도 포장하지 않은 새 작업만 화면 메모리(LOCAL)에 들고 있다가
      첫 박스가 붙는 순간 서버 파생 세션과 같은 키로 합류한다. */
   let PROCESS_ID = null, WC_ID = null;
   let ORDERS = [], curO = null, filter = 'all';
   let READY = [], PACKED = [], MATS = [];
   let SESSIONS = [], LOCAL = [], SESS = null;   // SESS = 지금 열려 있는 작업
   let curUnit = null;      // 이번 박스에 담을 검사 합격 유닛
   let curLabel = '';       // 이번 박스의 실물 라벨 (필수)
   let curDone = null;      // 상세 시트에 띄운 포장 완료 건
   let matQty = {};         // matId → 투입수량
   let WORKERS = [], EQUIPS = [];
   let pick = {actor_id: null, actor_name: null, equipment_id: null, equipment_name: null};
   let pickMode = 'new';    // new = 작업 추가 / edit = 현재 작업의 작업자·설비 변경
   let eqTouched = false;   // 작업자가 설비를 직접 골랐는가 (기본 설비 자동선택 억제)

   const SC = {A: document.getElementById('scA'), B: document.getElementById('scB'), C: document.getElementById('scC')};
   function show(k) { for (var x in SC) SC[x].classList.toggle('hide', x !== k); }

   /* ══ A. 큐 ══ */
   function loadContext(cb) {
    get(API + '/context', {process_code: CTX.process_code, factory_id: CTX.factory_id}, function (d) {
     if (!d || !d.process_id) { bootFail('포장 공정(mc03) 정보를 찾을 수 없습니다.'); return; }
     PROCESS_ID = d.process_id;
     WC_ID = d.workcenter_id;
     // 포장 워크센터(56)에 설비가 둘 이상 붙어 있어 기본값을 서버가 지정한다.
     // PACK_CTX 로 덮어쓸 수 있다. 없으면 '미지정' 으로 시작한다.
     if (d.default_equipment_id != null && CTX.default_equipment_id == null)
      CTX.default_equipment_id = d.default_equipment_id;
     if (d.out_store_id != 4) flash('경고 : 포장 워크센터 산출창고가 제품창고(4)가 아닙니다 — ' + d.out_store_id);
     cb();
    });
   }

   function loadQueue() {
    if (PROCESS_ID == null) return;
    get(API + '/wo_queue', {
     process_id: PROCESS_ID, spjangcd: CTX.spjangcd,
     date_from: document.getElementById('dFrom').value,
     date_to: document.getElementById('dTo').value
    }, function (d) { ORDERS = d || []; renderQueue(); });
   }

   /** 카드 키 — 작지가 있으면 작지, 없으면(수리·구형 유입) 완제품 품목이 카드 1장 */
   function oKey(o) { return (o.job_res_id != null) ? ('jr' + o.job_res_id) : ('mat' + o.pack_mat_id); }
   /** 하위 조회·등록에 실을 식별자. 작지 없는 카드는 품목으로 붙는다 */
   function oParam(extra) {
    var p = (curO.job_res_id != null) ? {job_res_id: curO.job_res_id} : {pack_mat_id: curO.pack_mat_id};
    return Object.assign(p, extra || {});
   }

   function renderQueue() {
    var list = ORDERS.filter(function (o) { return filter === 'all' || o.state === filter; });
    document.getElementById('qcnt').textContent = list.length + '건';
    var STLAB = {working: '작업중', wait: '대기', done: '완료'};
    document.getElementById('qgrid').innerHTML = list.length ? list.map(function (o) {
     var noJr = (o.job_res_id == null);
     var plan = num(o.plan_qty), done = num(o.done_qty);
     var pct = plan ? Math.min(100, Math.round(done / plan * 100)) : 0;
     return '<div class="wo" data-st="' + o.state + '" data-k="' + esc(oKey(o)) + '"><div class="edge"></div>' +
      '<div class="row1"><span class="wono">' + esc(noJr ? '작지 없음' : o.order_num) + '</span>' +
      (noJr ? '' : '<span style="font-size:13px;color:var(--ink-2);font-weight:700">' + esc(o.plan_date) + '</span>') +
      '<span class="chip ' + o.state + '">' + STLAB[o.state] + '</span></div>' +
      '<div class="name">' + esc(o.mat_name) + '</div>' +
      '<div class="meta">' +
      (noJr ? '' : '<div class="blk"><span class="lab">지시</span><span class="val">' + plan + '</span></div>') +
      '<div class="blk"><span class="lab">포장대기</span><span class="val">' + num(o.ready_qty) + '</span></div>' +
      '<div class="blk"><span class="lab">완료</span><span class="val">' + done + '</span></div>' +
      (noJr ? '' : '<div class="prog"><span class="lab">' + (done ? '진행 ' + pct + '%' : '미시작') + '</span>' +
       '<div class="bar"><i style="width:' + pct + '%"></i></div></div>') +
      '</div></div>';
    }).join('') : '<div class="emptysess">해당 기간에 포장 작업지시가 없습니다.</div>';
   }

   document.getElementById('qgrid').addEventListener('click', function (e) {
    var c = e.target.closest('.wo');
    if (c) openOrder(c.dataset.k);
   });
   document.querySelectorAll('.qfilter button').forEach(function (b) {
    b.addEventListener('click', function () {
     document.querySelectorAll('.qfilter button').forEach(function (x) { x.classList.remove('on'); });
     b.classList.add('on'); filter = b.dataset.f; renderQueue();
    });
   });
   document.getElementById('btnSearch').addEventListener('click', loadQueue);
   (function () {
    // 기본 조회기간 = 이번 달 1일 ~ 오늘
    var t = new Date();
    var f = new Date(t.getFullYear(), t.getMonth(), 1);
    document.getElementById('dFrom').value = fmtDate(f);
    document.getElementById('dTo').value = fmtDate(t);
   })();
   document.querySelectorAll('[data-back]').forEach(function (b) {
    b.addEventListener('click', function () {
     if (b.dataset.back === 'A') { SESS = null; loadQueue(); show('A'); }
     else { SESS = null; loadB(); show('B'); }
    });
   });

   /* ══ B. 작업 목록 ══ */
   function openOrder(key) {
    curO = ORDERS.filter(function (x) { return oKey(x) === key; })[0];
    if (!curO) return;
    LOCAL = []; SESS = null;
    document.getElementById('bName').textContent = curO.mat_name || '';
    document.getElementById('bSub').textContent = (curO.job_res_id != null)
     ? ((curO.order_num || '') + ' · ' + (curO.mat_code || '') + ' · 지시 ' + num(curO.plan_qty))
     : (curO.mat_code || '');
    loadB(); show('B');
   }

   /** 작업 키 — 서버 파생 건과 화면 로컬 건이 같은 문자열을 내야 한다.
    packed_list 가 actor_id / equipment_id 를 내려주면 그것으로, 없으면 이름으로 묶는다. */
   function sessKey(o) {
    var d = (o.work_date || (o.start_time || '').split(' ')[0] || '');
    var a = (o.actor_id != null && o.actor_id !== '') ? ('#' + o.actor_id) : (o.actor_name || '-');
    var e = (o.equipment_id != null && o.equipment_id !== '') ? ('#' + o.equipment_id) : (o.equipment_name || '-');
    return d + '|' + a + '|' + e;
   }

   function buildSessions() {
    var map = {}; SESSIONS = [];
    PACKED.forEach(function (p) {
     var k = sessKey(p);
     if (!map[k]) {
      map[k] = {
       key: k, actor_id: p.actor_id, actor_name: p.actor_name,
       equipment_id: p.equipment_id, equipment_name: p.equipment_name,
       work_date: (p.start_time || '').split(' ')[0], start_time: p.start_time, boxes: []
      };
      SESSIONS.push(map[k]);
     }
     var s = map[k];
     s.boxes.push(p);
     if (p.start_time && (!s.start_time || p.start_time < s.start_time)) s.start_time = p.start_time;
    });
    // 아직 박스가 없는 새 작업
    LOCAL.forEach(function (s) {
     if (map[s.key]) { map[s.key].local = true; return; }
     s.boxes = []; map[s.key] = s; SESSIONS.push(s);
    });
    SESSIONS.sort(function (a, b) { return String(b.start_time || '') < String(a.start_time || '') ? -1 : 1; });
   }

   function loadB(cb) {
    if (!curO) return;
    get(API + '/ready_units', oParam(), function (d) {
     READY = d || [];
     get(API + '/packed_list', oParam(), function (d2) {
      PACKED = (d2 || []).filter(function (x) { return x.lot_number; });
      buildSessions();
      if (SESS) SESS = SESSIONS.filter(function (s) { return s.key === SESS.key; })[0] || SESS;
      renderB();
      if (cb) cb();
     });
    });
   }

   function renderB() {
    document.getElementById('ovbox').innerHTML =
     (curO.job_res_id != null
      ? '<div class="ov"><div class="l">지시</div><div class="v">' + num(curO.plan_qty) + '</div></div>'
      : '') +
     '<div class="ov left"><div class="l">포장 대기</div><div class="v">' + READY.length + '</div></div>' +
     '<div class="ov"><div class="l">포장 완료</div><div class="v">' + PACKED.length + '</div></div>';

    document.getElementById('sessCnt').textContent = SESSIONS.length + '건';
    document.getElementById('sessList').innerHTML = SESSIONS.length ? SESSIONS.map(function (s) {
     var n = s.boxes.length;
     return '<div class="unit sess' + (n ? '' : ' closed') + '" data-k="' + esc(s.key) + '"><div class="edge"></div>' +
      '<div class="who"><span class="lot">' + esc(s.actor_name || '작업자 미지정') + '</span>' +
      '<span class="sub">' + esc(s.work_date || '') +
      ' · 설비 ' + esc(s.equipment_name || '미지정') +
      (s.start_time ? ' · 시작 ' + pill(s.start_time) : '') + '</span></div>' +
      '<span class="badge ' + (n ? 'work' : 'wait') + '">포장 ' + n + '대</span></div>';
    }).join('') : '<div class="emptysess">아직 작업이 없습니다. 아래 「작업 추가」로 작업자를 지정하세요.</div>';

    document.getElementById('readyCnt').textContent = READY.length + '대';
    document.getElementById('readyList').innerHTML = READY.length ? READY.map(function (u) {
     return '<div class="unit readonly"><div class="edge"></div>' +
      '<div class="who"><span class="lot">' + esc(u.lot_number) + '</span>' +
      '<span class="sub">' + esc(u.unit_mat_code) +
      (u.unit_no ? ' · #' + esc(u.unit_no) : ' · 조립이력 없음') +
      (u.assy_order_num ? ' · ' + esc(u.assy_order_num) : '') +
      (u.maker_lot_no ? ' · 라벨 ' + esc(u.maker_lot_no) : '') + '</span>' +
      (u.src_lot ? '<span class="sub">원 로트 ' + esc(u.src_lot) + '</span>' : '') + '</div>' +
      (u.repair_id ? '<span class="rbadge">수리 · ' + (u.repair_cat === 'spec' ? '사양변경' : '반품') + '</span>' : '') +
      '<span class="badge wait">포장 대기</span></div>';
    }).join('') : '<div class="emptysess">검사 합격 후 검사완료창고에 있는 유닛이 없습니다.</div>';

    // 포장 완료 — 탭하면 상세 시트에서 「포장 취소」를 할 수 있다.
    // C화면(작업 안)에만 두면 작업을 끝내고 나온 뒤에는 닿을 길이 없다.
    document.getElementById('packedCnt').textContent = PACKED.length + '건';
    document.getElementById('packedList').innerHTML = PACKED.length ? PACKED.map(function (p) {
     return '<div class="unit packed" data-mp="' + p.mp_id + '"><div class="edge"></div>' +
      '<div class="who"><span class="lot">' + esc(p.lot_number) + '</span>' +
      '<span class="sub">라벨 ' + esc(p.maker_lot_no || '-') + ' · ' + esc(p.actor_name || '-') +
      (p.equipment_name ? ' · ' + esc(p.equipment_name) : '') + '</span>' +
      '<span class="sub">' + pill(p.start_time) + ' ~ ' + pill(p.end_time) + '</span></div>' +
      '<span class="badge done">포장 완료</span><span class="go">›</span></div>';
    }).join('') : '<div class="emptysess">아직 포장한 박스가 없습니다.</div>';
   }

   document.getElementById('packedList').addEventListener('click', function (e) {
    var c = e.target.closest('[data-mp]');
    if (c) openDone(c.dataset.mp, PACKED);
   });

   document.getElementById('sessList').addEventListener('click', function (e) {
    var c = e.target.closest('.unit');
    if (!c) return;
    var s = SESSIONS.filter(function (x) { return x.key === c.dataset.k; })[0];
    if (s) openSess(s);
   });

   /* ══ 작업 추가 ══ */
   document.getElementById('btnAddWork').onclick = function () {
    pickMode = 'new'; eqTouched = false;
    pick = {actor_id: null, actor_name: null, equipment_id: null, equipment_name: null};
    openPicker();
   };

   function createSess() {
    var s = {
     actor_id: pick.actor_id, actor_name: pick.actor_name,
     equipment_id: pick.equipment_id, equipment_name: pick.equipment_name,
     work_date: fmtDate(new Date()), start_time: nowHM(), boxes: [], local: true
    };
    s.key = sessKey(s);
    if (SESSIONS.filter(function (x) { return x.key === s.key; })[0]) {
     flash('같은 작업자·설비의 작업이 이미 있습니다. 그 작업으로 들어갑니다.');
     openSess(SESSIONS.filter(function (x) { return x.key === s.key; })[0]);
     return;
    }
    LOCAL.push(s);
    // 작업 추가 = 포장 시작. 작지를 working 으로 올린다(차수는 아직 없다).
    post(API + '/work_start', {
     job_res_id: curO.job_res_id, actor_id: s.actor_id, start_time: s.start_time
    }, function () { loadQueue(); });
    buildSessions(); renderB();
    openSess(s);
   }

   /* ══ C. 작업 (박스 연속 포장) ══ */
   function openSess(s) {
    SESS = s;
    resetBox();
    document.getElementById('cName').textContent = (s.actor_name || '작업자') + ' 작업';
    document.getElementById('cSub').textContent =
     (curO.mat_code || '') + ' · ' + (curO.mat_name || '');
    if (MATS.length) { renderC(); show('C'); return; }
    get(API + '/pack_materials', oParam(), function (d) {
     MATS = d || [];
     resetMat();
     renderC(); show('C');
    });
   }

   function resetMat() {
    matQty = {};
    MATS.forEach(function (m) { matQty[m.mat_id] = num(m.default_qty); });
   }
   function resetBox() {
    curUnit = null; curLabel = ''; curDone = null;
    resetMat();
   }

   function renderC() { renderCHead(); renderCBody(); renderCAction(); }

   function renderCHead() {
    document.getElementById('cHead').innerHTML =
     '<div class="infopill tap" id="pickWorker"><span>작업자</span><b>' + esc(SESS.actor_name || '선택') + '</b></div>' +
     '<div class="infopill tap" id="pickEquip"><span>설비</span><b>' + esc(SESS.equipment_name || '미지정') + '</b></div>' +
     '<div class="infopill tap" data-time="sess"><span>시작</span><b>' + pill(SESS.start_time) + '</b></div>' +
     '<span class="sstate ' + (SESS.boxes.length ? 'work' : 'wait') + '">포장 ' + SESS.boxes.length + '대</span>';
   }

   function matOk() {
    for (var i = 0; i < MATS.length; i++) {
     var m = MATS[i];
     if (num(matQty[m.mat_id]) > num(m.stock)) return false;
     if (m.store_id != null && num(m.store_id) !== 17 && num(matQty[m.mat_id]) > 0) return false;
    }
    return true;
   }
   function packReady() { return !!(curUnit && curLabel && matOk()); }

   function renderCBody() {
    var html = '';

    // ① 포장 대상 유닛
    html += '<div class="secline">① 포장 대상 (검사 합격 유닛) <span class="ln"></span><span>1대 = 1박스 · ' + READY.length + '대 대기</span></div>';
    if (!READY.length) {
     html += '<div class="emptysess">검사완료창고에 포장할 유닛이 없습니다. 검사 화면에서 합격 처리하면 여기에 올라옵니다.</div>';
    } else {
     READY.forEach(function (u) {
      var on = curUnit && String(curUnit.mat_lot_id) === String(u.mat_lot_id);
      html += '<div class="unit pick' + (on ? ' sel' : '') + '" data-u="' + u.mat_lot_id + '"><div class="edge"></div>' +
       '<div class="tick">' + (on ? '✓' : '') + '</div>' +
       '<div class="who"><span class="lot">' + esc(u.lot_number) + '</span>' +
       '<span class="sub">' + esc(u.unit_mat_code) +
       (u.unit_no ? ' · #' + esc(u.unit_no) : ' · 조립이력 없음') +
       (u.assy_order_num ? ' · ' + esc(u.assy_order_num) : '') + '</span>' +
       (u.src_lot ? '<span class="sub">원 로트 ' + esc(u.src_lot) + '</span>' : '') + '</div>' +
       (u.repair_id ? '<span class="rbadge">수리 · ' + (u.repair_cat === 'spec' ? '사양변경' : '반품') + '</span>' : '') + '</div>';
     });
    }

    // ② 포장 자재 — 국내/해외는 작지 산출품목이 이미 가른다
    var short = MATS.filter(function (m) { return num(matQty[m.mat_id]) > num(m.stock); }).length;
    var isFb = MATS.length > 0 && MATS[0].fallback === 'Y';
    html += '<div class="secline" style="margin-top:14px">② 포장 자재 <span class="ln"></span>' +
     '<span>' + MATS.length + '종' + (isFb ? ' · 전체 자재' : '') + (short ? ' · 재고부족 ' + short : '') + '</span></div>';
    html += '<div class="part' + (isFb ? ' need' : '') + '"><div class="id"><span class="pn">' + esc(curO.mat_name || '') + '</span>' +
     '<span class="pc">' + esc(curO.mat_code || '') +
     (isFb ? ' · 완제품 BOM에 포장 자재가 없어 생산창고 재고 전체를 띄웁니다. 담을 것만 수량을 올리세요.'
      : ' · 이 완제품 BOM 기준 · 수량 수정 가능') + '</span></div></div>';
    if (!MATS.length) {
     html += '<div class="emptysess" style="margin-top:10px">생산창고(17)에 재고가 있는 자재가 없습니다. ' +
      '자재 없이도 포장을 완료할 수 있습니다.</div>';
    }
    MATS.forEach(function (m) {
     var q = num(matQty[m.mat_id]), stock = num(m.stock);
     var over = q > stock, ok = q > 0 && !over;
     // 서버가 판정한 소스창고를 그대로 드러낸다. 17 이 아니면 resolveSourceStore 가
     // Factory_id / MaterialType 때문에 다른 창고로 흘렀다는 뜻이라 조용히 넘기지 않는다.
     var st = (m.store_id == null) ? null : num(m.store_id);
     var badStore = (st != null && st !== 17);
     html += '<div class="mat ' + (over || badStore ? 'short' : (ok ? 'on' : '')) + '" style="margin-top:10px">' +
      '<div class="chk">' + (ok && !badStore ? '✓' : '') + '</div>' +
      '<div class="mid"><div class="mn">' + esc(m.mat_name) + '</div>' +
      '<div class="mc">' + esc(m.mat_code) + ' · BOM ' + num(m.per) + ' /대 · ' +
      esc(m.store_name || '생산창고') + ' 재고 ' +
      '<b class="' + (over ? 'warn' : '') + '">' + stock + '</b>' +
      (over ? ' <span class="warn">— 재고 부족</span>' : '') +
      (badStore ? ' <span class="warn">— 소스창고가 생산창고(17)가 아닙니다 (' + st + ')</span>' : '') +
      '</div></div>' +
      '<div class="mstep"><button data-mminus="' + m.mat_id + '">−</button>' +
      '<div class="n" data-mpad="' + m.mat_id + '">' + q + '</div>' +
      '<button data-mplus="' + m.mat_id + '">＋</button></div></div>';
    });

    // ③ 박스 라벨 스캔 (필수)
    html += '<div class="secline" style="margin-top:14px">③ 박스 라벨 스캔 <span class="ln"></span>' +
     (curLabel ? '<span>확정됨</span>' : '<span class="req">필수</span>') + '</div>';
    html += '<div class="part ' + (curLabel ? 'ok' : 'need') + '">' +
     '<div class="id"><span class="pn">' + (curLabel ? esc(curLabel) : '미스캔') + '</span>' +
     '<span class="pc">' + (curLabel ? '완제품 로트의 외부 라벨(MakerLotNo)로 기록됩니다'
      : '박스에 붙은 실물 라벨을 스캔해야 포장을 완료할 수 있습니다') + '</span></div>' +
     '<button class="btn primary sm" id="btnScan" style="padding:0 20px">📷 ' + (curLabel ? '다시 스캔' : '스캔') + '</button></div>';

    // 이 작업에서 포장한 박스
    html += '<div class="secline" style="margin-top:14px">이 작업에서 포장한 박스 <span class="ln"></span>' +
     '<span>' + SESS.boxes.length + '건</span></div>';
    if (!SESS.boxes.length) {
     html += '<div class="emptysess">아직 포장한 박스가 없습니다.</div>';
    } else {
     SESS.boxes.forEach(function (p) {
      html += '<div class="unit packed" data-mp="' + p.mp_id + '"><div class="edge"></div>' +
       '<div class="who"><span class="lot">' + esc(p.lot_number) + '</span>' +
       '<span class="sub">라벨 ' + esc(p.maker_lot_no || '-') +
       (p.chasu ? ' · ' + p.chasu + '차수' : '') + ' · ' + pill(p.start_time) + ' ~ ' + pill(p.end_time) + '</span>' +
       '<span class="sub">눌러서 상세 · 포장 취소</span></div>' +
       '<span class="badge done">포장 완료</span><span class="go">›</span></div>';
     });
    }

    document.getElementById('cBody').innerHTML = html;
   }

   function renderCAction() {
    var bar = document.getElementById('cAction');
    var badStore = MATS.filter(function (m) {
     return m.store_id != null && num(m.store_id) !== 17 && num(matQty[m.mat_id]) > 0;
    }).length;
    var need = !curUnit ? '유닛을 선택하세요' : (!curLabel ? '박스 라벨을 스캔하세요'
     : (badStore ? '소스창고가 생산창고(17)가 아닌 자재가 있습니다'
      : (!matOk() ? '재고보다 많은 자재가 있습니다' : '')));
    bar.innerHTML =
     '<div class="actsum"><span class="l">' + (need || '박스 1개 준비됨') + '</span>' +
     '<span class="v">이 작업 ' + SESS.boxes.length + '대</span></div>' +
     '<button class="btn ghost" id="cEnd">작업 종료</button>' +
     '<button class="btn primary" id="cFinish"' + (packReady() ? '' : ' disabled') + '>포장 완료</button>';
    document.getElementById('cEnd').onclick = function () {
     var n = SESS.boxes.length;
     var who = SESS.actor_name || '작업자';
     uiConfirm('작업 종료',
      n ? (who + ' 작업을 종료합니다. 포장 ' + n + '대는 그대로 남고, 남은 유닛은 다른 작업에서 이어서 포장할 수 있습니다.')
       : (who + ' 작업을 종료합니다. 포장한 박스가 없어 이 작업은 기록되지 않습니다.'),
      function () {
       SESS = null;
       // 한 박스도 안 했으면 작지를 원래대로 되돌린다.
       // 화면 판단만 믿지 않는다 — 그 사이 다른 태블릿이 같은 작지에 박스를 넣었을 수 있다.
       if (!n) post(API + '/work_end', {job_res_id: curO.job_res_id}, function () { loadB(); loadQueue(); show('B'); });
       else { flash(who + ' 작업 종료 · 포장 ' + n + '대'); loadB(); loadQueue(); show('B'); }
      });
    };
    document.getElementById('cFinish').onclick = doPack;
   }

   /* 본문 클릭 — 유닛 선택 / 자재 스테퍼 / 스캔 / 완료건 상세 */
   document.getElementById('cBody').addEventListener('click', function (e) {
    var u = e.target.closest('[data-u]');
    if (u) {
     var lot = READY.filter(function (x) { return String(x.mat_lot_id) === u.dataset.u; })[0];
     curUnit = (curUnit && String(curUnit.mat_lot_id) === u.dataset.u) ? null : lot;
     renderCBody(); renderCAction(); return;
    }
    if (e.target.closest('#btnScan')) { openScan(); return; }
    var mp = e.target.closest('[data-mplus]');
    if (mp) { var a = mp.dataset.mplus; matQty[a] = num(matQty[a]) + 1; renderCBody(); renderCAction(); return; }
    var mm = e.target.closest('[data-mminus]');
    if (mm) { var b = mm.dataset.mminus; matQty[b] = Math.max(0, num(matQty[b]) - 1); renderCBody(); renderCAction(); return; }
    var pd = e.target.closest('[data-mpad]');
    if (pd) { openPadMat(pd.dataset.mpad); return; }
    var dn = e.target.closest('[data-mp]');
    if (dn) { openDone(dn.dataset.mp); return; }
   });
   document.getElementById('cHead').addEventListener('click', function (e) {
    if (e.target.closest('#pickWorker')) { pickMode = 'edit'; pick = {
     actor_id: SESS.actor_id, actor_name: SESS.actor_name,
     equipment_id: SESS.equipment_id, equipment_name: SESS.equipment_name}; openPicker(); return; }
    if (e.target.closest('#pickEquip')) { pickMode = 'edit'; pick = {
     actor_id: SESS.actor_id, actor_name: SESS.actor_name,
     equipment_id: SESS.equipment_id, equipment_name: SESS.equipment_name}; openPicker(); return; }
    var t = e.target.closest('[data-time]');
    if (t) openTime(t.dataset.time);
   });

   /* ══ 포장 완료 ══ */
   function doPack() {
    if (!curUnit) { flash('포장할 유닛을 선택하세요'); return; }
    if (!curLabel) { flash('박스 라벨을 스캔하세요'); openScan(); return; }
    if (!matOk()) { flash('재고보다 많은 자재가 있습니다. 수량을 조정하세요.'); return; }
    var bom = MATS.filter(function (m) { return num(matQty[m.mat_id]) > 0; })
    .map(function (m) { return {matId: m.mat_id, qty: num(matQty[m.mat_id])}; });

     mat_lot_id: curUnit.mat_lot_id,

     actor_id: SESS.actor_id,
     equipment_id: SESS.equipment_id == null ? '' : SESS.equipment_id,
     start_time: SESS.start_time || nowHM(),
     end_time: nowHM(),
     bom_json: JSON.stringify(bom),
     spjangcd: CTX.spjangcd
    }), function (d) {
     if (d === null) { if (btn) btn.disabled = false; return; }
     var lot = curUnit.lot_number;
     resetBox();                       // 다음 박스로 이어간다 — 작업자·설비는 유지
     loadB(function () {
      // 첫 박스가 붙으면 로컬 작업이 서버 파생 작업과 합류한다
      var s = SESSIONS.filter(function (x) { return x.key === SESS.key; })[0];
      if (s) SESS = s;

   /* ══ 박스 라벨 스캔 ══ */
   let scanTimer = null, scanVal = '';

   /* ── 카메라 스캔 ──
      BarcodeDetector(크롬/안드로이드 WebView 내장)를 쓴다. 외부 라이브러리를 안 붙이는 이유는
      공장 태블릿이 오프라인일 때 CDN 이 안 잡히면 화면이 통째로 멈추기 때문.
      쓸 수 없는 환경이면 조용히 죽지 않고 사유를 문구로 남기고, 스캐너·수동입력으로 넘어간다.

      ★ getUserMedia 는 보안 컨텍스트(HTTPS 또는 localhost)에서만 동작한다.
        http:// 로 접속하면 권한 요청 자체가 안 뜬다. */
   let camStream = null, camTimer = null, camDet = null, camLock = null;

   /* 화면 꺼짐 방지 — 스캔 시트를 열어둔 채 손을 놓으면 태블릿이 잠긴다.
      지원 안 하는 기기에서는 조용히 넘어간다. */
   async function wakeOn() {
    try {
     if (!navigator.wakeLock || camLock) return;
     camLock = await navigator.wakeLock.request('screen');
     camLock.addEventListener('release', function () { camLock = null; });
    } catch (e) {}
   }
   function wakeOff() {
    try { if (camLock) camLock.release(); } catch (e) {}
    camLock = null;
   }

   function camReason() {
    if (!window.isSecureContext) return 'HTTPS 접속이 아니라 카메라를 쓸 수 없습니다. 스캐너나 직접 입력을 사용하세요.';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return '이 브라우저는 카메라를 지원하지 않습니다.';
    if (typeof window.BarcodeDetector === 'undefined') return '이 브라우저는 바코드 인식을 지원하지 않습니다. 스캐너나 직접 입력을 사용하세요.';
    return null;
   }

   function setCamNote(msg, warn) {
    var n = document.getElementById('camNote');
    n.className = 'camnote' + (warn ? ' warn' : '');
    n.textContent = msg || '';
   }

   function stopCam() {
    clearInterval(camTimer); camTimer = null;
    if (camStream) { camStream.getTracks().forEach(function (t) { t.stop(); }); camStream = null; }
    var v = document.getElementById('camView');
    if (v) v.srcObject = null;
    document.getElementById('camWrap').classList.remove('on');
    wakeOff();
   }
   // 탭을 벗어나면 카메라·화면잠금을 놓는다. 안 놓으면 렌즈가 켜진 채 남는다.
   document.addEventListener('visibilitychange', function () { if (document.hidden) stopCam(); });

   async function startCam() {
    var why = camReason();
    if (why) { setCamNote(why, true); return; }
    setCamNote('카메라를 켜는 중…');
    try {
     if (!camDet) {
      var want = ['code_128','ean_13','code_39','itf','data_matrix','qr_code'];
      var ok = want;
      try {
       var sup = await window.BarcodeDetector.getSupportedFormats();
       ok = want.filter(function (f) { return sup.indexOf(f) >= 0; });
      } catch (e) {}
      if (!ok.length) { setCamNote('인식 가능한 바코드 형식이 없습니다.', true); return; }
      camDet = new window.BarcodeDetector({formats: ok});
     }
     camStream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}},
      audio: false
     });
     // ★ 라벨을 가까이 대고 찍으므로 초점이 핵심이다. 고정초점이면 인식이 아예 안 된다.
     //   지원 여부가 기기마다 달라 getCapabilities 로 확인한 뒤에만 건다.
     try {
      var track = camStream.getVideoTracks()[0];
      var caps = track.getCapabilities ? track.getCapabilities() : {};
      var adv = [];
      if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) adv.push({focusMode: 'continuous'});
      if (adv.length) await track.applyConstraints({advanced: adv});
     } catch (e) {}
     var v = document.getElementById('camView');
     v.srcObject = camStream;
     await v.play();
     wakeOn();
     document.getElementById('camWrap').classList.add('on');
     setCamNote('바코드를 가운데 사각형에 맞추세요.');
     // 프레임마다 돌리면 태블릿이 뜨겁고 느려진다. 250ms 간격이면 충분히 즉각적이다.
     camTimer = setInterval(camTick, 250);
    } catch (e) {
     stopCam();
     setCamNote('카메라를 열 수 없습니다 — ' + (e && e.name === 'NotAllowedError'
      ? '권한이 거부되었습니다. 브라우저 설정에서 카메라를 허용하세요.'
      : (e.message || e)), true);
    }
   }

   async function camTick() {
    var v = document.getElementById('camView');
    if (!camDet || !v || v.readyState < 2) return;
    var found;
    try { found = await camDet.detect(v); } catch (e) { return; }
    if (!found || !found.length) return;
    var raw = String(found[0].rawValue || '').trim();
    if (!raw) return;
    stopCam();
    setCamNote('읽었습니다 — ' + raw);
    var key = pickLot(raw);
    document.getElementById('scanKey').value = key;
    checkLabel(key);
   }

   document.getElementById('camOpen').onclick = function () { startCam(); };
   document.getElementById('camStop').onclick = function () { stopCam(); setCamNote(''); };
   // 시트를 닫을 때 카메라도 반드시 끈다 (안 끄면 렌즈가 계속 켜져 있다)
   document.getElementById('scanMask').addEventListener('click', function (e) {
    if (e.target === this || (e.target.closest && e.target.closest('[data-close]'))) stopCam();
   });

   function openScan() {
    scanVal = '';
    document.getElementById('scanKey').value = '';
    document.getElementById('scanRes').innerHTML = '';
    document.getElementById('scanOk').disabled = true;
    setCamNote('');
    showMask('scanMask');
    // 태블릿은 카메라가 기본 경로다. 열자마자 켜서 한 손으로 끝나게 한다.
    if (!camReason()) startCam(); else setCamNote(camReason(), true);
    setTimeout(function () { document.getElementById('scanKey').focus(); }, 120);
   }
   document.getElementById('scanKey').addEventListener('input', function () {
    clearTimeout(scanTimer);
    var raw = this.value;
    if (!raw.trim()) {
     document.getElementById('scanRes').innerHTML = '';
     document.getElementById('scanOk').disabled = true; scanVal = ''; return;
    }
    scanTimer = setTimeout(function () { checkLabel(pickLot(raw)); }, 250);
   });
   document.getElementById('scanKey').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); clearTimeout(scanTimer); checkLabel(pickLot(this.value)); }
   });

   function checkLabel(key) {
    var box = document.getElementById('scanRes');
    if (!key) return;
    var dup = PACKED.filter(function (p) {
     return String(p.maker_lot_no || '').toUpperCase() === key.toUpperCase();
    })[0];
    if (dup) {
     box.className = 'scanres ng';
     box.textContent = '이미 사용된 라벨입니다 — ' + dup.lot_number + ' (' + (dup.actor_name || '') + ')';
     document.getElementById('scanOk').disabled = true; scanVal = ''; return;
    }
    // 서버 중복검사가 있으면 쓰고, 없으면 화면 검사만으로 넘어간다
    getSoft(API + '/label_check', oParam({key: key}), function (d) {
     if (d && d.dup) {
      box.className = 'scanres ng';
      box.textContent = d.note || '이미 등록된 라벨입니다.';
      document.getElementById('scanOk').disabled = true; scanVal = ''; return;
     }
     box.className = 'scanres ok';
     box.textContent = key + ' · 사용 가능';
     scanVal = key;
     document.getElementById('scanOk').disabled = false;
    });
   }
   document.getElementById('scanOk').onclick = function () {
    if (!scanVal) return;
    curLabel = scanVal;
    stopCam();
    hideMask('scanMask');
    renderCBody(); renderCAction();
   };

   document.getElementById('doneBody').addEventListener('click', function (e) {
    var t = e.target.closest('[data-time]');

   document.getElementById('doneCancel').onclick = function () {

    var d = curDone;
    hideMask('doneMask');
    uiConfirm('포장 취소', '완료 취소하시겠습니까?', function () {
     post(API + '/pack_cancel', {mat_produce_id: d.mp_id}, function (r) {
      if (r === null) return;
      curDone = null;
      loadB(function () {
       loadQueue();
       if (!SESS) return;                       // B화면에서 취소한 경우
       var s = SESSIONS.filter(function (x) { return x.key === SESS.key; })[0];

   /* ══ 작업자 · 설비 시트 ══ */
   function openPicker() {
    document.getElementById('startTitle').textContent =
     (pickMode === 'new') ? '작업 추가 · 새 작업자' : '작업자 · 설비 변경';
    document.getElementById('startOk').textContent = (pickMode === 'new') ? '작업 시작' : '변경';
    var need = [];
    if (!WORKERS.length) need.push('w');
    if (!EQUIPS.length) need.push('e');
    if (!need.length) { paintPicker(); showMask('startMask'); return; }
    get(API + '/workers', {}, function (d) {
     if (d) WORKERS = d;
     // 설비는 워크센터 + 설비그룹으로 서버가 좁혀 내려준다 (조립 화면과 동일)
     get(API + '/equipments', {workcenter_id: WC_ID}, function (d2) {
      if (d2) EQUIPS = d2;
      paintPicker(); showMask('startMask');
     });
    });
   }
   function paintPicker() {
    // 새 작업이고 작업자가 아직 설비를 건드리지 않았으면 기본 설비를 미리 골라 준다
    if (pickMode === 'new' && !eqTouched && pick.equipment_id == null && CTX.default_equipment_id != null) {
     var dq = EQUIPS.filter(function (q) {
      return String(q.equipment_id) === String(CTX.default_equipment_id);
     })[0];
     if (dq) { pick.equipment_id = dq.equipment_id; pick.equipment_name = dq.equipment_name; }
    }
    document.getElementById('workerOpts').innerHTML = WORKERS.length ? WORKERS.map(function (w) {
     return '<button class="opt' + (pick.actor_id === w.actor_id ? ' sel' : '') + '" data-w="' + w.actor_id +
      '" data-nm="' + esc(w.actor_name) + '">' + esc(w.actor_name) + '</button>';
    }).join('') : '<div class="emptysess">등록된 작업자가 없습니다.</div>';
    document.getElementById('equipOpts').innerHTML =
     '<button class="opt' + (pick.equipment_id == null ? ' sel' : '') + '" data-e="">미지정</button>' +
     EQUIPS.map(function (q) {
      return '<button class="opt' + (pick.equipment_id === q.equipment_id ? ' sel' : '') +
       '" data-e="' + q.equipment_id + '" data-nm="' + esc(q.equipment_name) + '">' + esc(q.equipment_name) +
       ' <span class="sub">' + esc(q.equipment_code || '') + '</span></button>';
     }).join('') +
     (EQUIPS.length ? '' : '<div class="optsep">등록된 포장 설비가 없습니다. 미지정으로 진행할 수 있습니다.</div>');
    document.getElementById('startOk').disabled = !pick.actor_id;
   }
   document.getElementById('workerOpts').addEventListener('click', function (e) {
    var b = e.target.closest('[data-w]'); if (!b) return;
    pick.actor_id = +b.dataset.w; pick.actor_name = b.dataset.nm;
    paintPicker();
   });
   document.getElementById('equipOpts').addEventListener('click', function (e) {
    var b = e.target.closest('[data-e]'); if (!b) return;
    eqTouched = true;
    pick.equipment_id = b.dataset.e ? +b.dataset.e : null;
    pick.equipment_name = b.dataset.e ? b.dataset.nm : null;
    paintPicker();
   });
   document.getElementById('startOk').onclick = function () {
    if (!pick.actor_id) { flash('작업자를 선택하세요'); return; }
    hideMask('startMask');
    if (pickMode === 'new') { createSess(); return; }
    // 변경 — 이미 포장한 박스의 실적은 그대로 두고, 이후 박스부터 적용된다
    if (SESS.boxes.length) {
     var s = {
      actor_id: pick.actor_id, actor_name: pick.actor_name,
      equipment_id: pick.equipment_id, equipment_name: pick.equipment_name,
      work_date: fmtDate(new Date()), start_time: nowHM(), boxes: [], local: true
     };
     s.key = sessKey(s);
     var ex = SESSIONS.filter(function (x) { return x.key === s.key; })[0];
     if (ex) { SESS = ex; }
     else { LOCAL.push(s); buildSessions(); SESS = s; }
     flash('작업자·설비가 바뀌어 새 작업으로 넘어갑니다 (이전 실적은 그대로).');
    } else {
     SESS.actor_id = pick.actor_id; SESS.actor_name = pick.actor_name;
     SESS.equipment_id = pick.equipment_id; SESS.equipment_name = pick.equipment_name;
     var old = SESS.key; SESS.key = sessKey(SESS);
     LOCAL.forEach(function (x) { if (x.key === old) { x.key = SESS.key; } });
     buildSessions();
    }
    renderC(); renderB();
   };

   /* ══ 넘패드 ══ */
   let padVal = '', padMatId = null;
   function openPadMat(matId) {
    padMatId = matId; padVal = String(num(matQty[matId]));
    var mo = MATS.filter(function (x) { return String(x.mat_id) === String(matId); })[0];
    document.getElementById('padLab').textContent = mo ? mo.mat_name : '자재 수량';
    document.getElementById('padDisp').textContent = padVal;

   }
   document.querySelector('#padMask .keys').addEventListener('click', function (e) {
    var k = e.target.dataset.k; if (!k) return;
    if (k === 'C') padVal = '';
    else if (k === 'OK') {
     matQty[padMatId] = parseInt(padVal || '0', 10);
     hideMask('padMask'); renderCBody(); renderCAction(); return;
    } else padVal = (padVal === '0' ? '' : padVal) + k;
    document.getElementById('padDisp').textContent = padVal || '0';
   });

   /* ══ 시간 시트 ══
      sess  = 이 작업의 시작시각(화면 값. 다음 박스 실적에 실린다)
      start / end = 이미 만들어진 차수의 시각 → 서버(/pack_time) */
   let timeWhich = 'sess', editDate = new Date();
   function openTime(which) {
    timeWhich = which;
    document.getElementById('timeTitle').textContent =
     (which === 'sess' ? '작업 시작' : (which === 'start' ? '시작' : '종료')) + ' 일시';
    var saved = (which === 'sess') ? (SESS && SESS.start_time)
     : (curDone ? (which === 'start' ? curDone.start_time : curDone.end_time) : null);
    if (saved && saved.indexOf(' ') >= 0) {
     var a = saved.split(' '); editDate = new Date(a[0] + 'T' + a[1]);
    } else editDate = new Date();
    document.getElementById('tDate').textContent = fmtDate(editDate) + ' (' + WD[editDate.getDay()] + ')';
    document.getElementById('tH').textContent = String(editDate.getHours()).padStart(2, '0');
    document.getElementById('tM').textContent = String(editDate.getMinutes()).padStart(2, '0');
    showMask('timeMask');
   }
   document.querySelector('#timeMask .dateedit').addEventListener('click', function (e) {
    var b = e.target.closest('[data-d]'); if (!b) return;
    editDate.setDate(editDate.getDate() + (+b.dataset.d));
    document.getElementById('tDate').textContent = fmtDate(editDate) + ' (' + WD[editDate.getDay()] + ')';
   });
   document.querySelector('#timeMask .timeedit').addEventListener('click', function (e) {
    var b = e.target.closest('[data-t]'); if (!b) return;
    var H = document.getElementById('tH'), M = document.getElementById('tM');
    var h = +H.textContent, m = +M.textContent;
    if (b.dataset.t === 'h+') h = (h + 1) % 24;
    if (b.dataset.t === 'h-') h = (h + 23) % 24;
    if (b.dataset.t === 'm+') m = (m + 1) % 60;
    if (b.dataset.t === 'm-') m = (m + 59) % 60;
    H.textContent = String(h).padStart(2, '0');
    M.textContent = String(m).padStart(2, '0');
   });
   document.getElementById('timeOk').onclick = function () {
    var v = fmtDate(editDate) + ' ' + document.getElementById('tH').textContent + ':' + document.getElementById('tM').textContent;
    hideMask('timeMask');
    if (timeWhich === 'sess') { SESS.start_time = v; renderCHead(); return; }
    if (!curDone) return;
    var d = curDone;
    post(API + '/pack_time', {mat_produce_id: d.mp_id, which: timeWhich, value: v}, function (r) {
     if (r === null) return;
     if (timeWhich === 'start') d.start_time = v; else d.end_time = v;
     openDone(d.mp_id);
     loadB(function () {
      var s = SESSIONS.filter(function (x) { return x.key === SESS.key; })[0];
      if (s) SESS = s;
      renderCBody();
     });
    });
   };

   /* ══ 부팅 ══
      공용 스크립트가 늦게 올라올 수 있어 잠깐 기다린다.
      끝내 못 찾으면 조용히 죽지 않고 화면에 문구를 남긴다. */
   (function boot(tries) {
    tries = tries || 0;
    if (hasAjax() && AjaxUtil.getSyncData) { loadContext(loadQueue); return; }
    if (tries > 100) { bootFail('AjaxUtil 을 불러오지 못했습니다. 페이지를 새로고침하세요.'); return; }
    setTimeout(function () { boot(tries + 1); }, 50);
   })();
  </script>

  <!-- 스테퍼 길게 누르기 (조립·수리 화면과 동일) -->
  <style>
      .mstep button, .dateedit button, .timeedit button {
          touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }
  </style>
  <script>
   (function () {
    var SEL = '.mstep button, .dateedit button, .timeedit button';
    var holdTimer = null, repeatTimer = null, maxTimer = null, curBtn = null;
    var END_EVENTS = ['pointerup', 'pointercancel', 'lostpointercapture', 'touchend', 'touchcancel', 'mouseup'];
    function stop() {
     clearTimeout(holdTimer); clearInterval(repeatTimer); clearTimeout(maxTimer);
     holdTimer = repeatTimer = maxTimer = null;
     if (curBtn) { END_EVENTS.forEach(function (ev) { curBtn.removeEventListener(ev, stop); }); curBtn = null; }
    }
    function tick(x, y) {
     var el = document.elementFromPoint(x, y);
     var b = (el && el.closest) ? el.closest(SEL) : null;
     if (!b) { stop(); return; }
     b.click();
    }
    document.addEventListener('pointerdown', function (e) {
     if (e.button != null && e.button > 0) return;
     var btn = e.target.closest ? e.target.closest(SEL) : null;
     if (!btn) return;
     var x = e.clientX, y = e.clientY;
     stop();
     curBtn = btn;
     END_EVENTS.forEach(function (ev) { btn.addEventListener(ev, stop); });
     holdTimer = setTimeout(function () {
      repeatTimer = setInterval(function () { tick(x, y); }, 90);
      maxTimer = setTimeout(stop, 8000);
     }, 400);
     window.addEventListener('pointerup', stop, {once: true, capture: true});
     window.addEventListener('touchend', stop, {once: true, capture: true});
    });
    window.addEventListener('blur', stop);
    document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); });
   })();
  </script>
