<html layout:decorate="~{layout_page}">

<th:block layout:fragment="content">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"/>
    <style>

        :root{--bg:#E9EEF1;--surface:#FFF;--surface-2:#F4F7F9;--ink:#15222B;--ink-2:#5A6B76;--line:#D8E0E5;
            --teal:#0E7C86;--teal-d:#0A5C64;--teal-bg:#E2F1F2;--green:#1E9D58;--green-bg:#E4F4EA;
            --amber:#C77A00;--amber-bg:#FBEFD8;--red:#C8483B;--red-bg:#F7E4E1;--purple:#6D3BD1;--purple-bg:#EDE6FB;
            --r:18px;--tap:60px;--shadow:0 1px 0 rgba(21,34,43,.04),0 8px 24px -16px rgba(21,34,43,.28)}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        .ms-wash-root{font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif;color:var(--ink);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;flex:1 1 auto;min-height:0;height:var(--wash-h,100%);max-height:var(--wash-h,none);display:flex;flex-direction:column}
        .ms-wash-root .app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-radius:12px;overflow:hidden}
        .screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}.screen.hide{display:none}

        /* A. 작업지시(수주) 큐 */
        .wrap{padding:22px 20px 28px;max-width:1180px;margin:0 auto;width:100%;overflow:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
        .qhead{display:flex;align-items:baseline;gap:12px;margin:2px 2px 18px}
        .qhead h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0}
        .qhead .cnt{color:var(--ink-2);font-weight:700}
        .qfilter{display:flex;gap:8px;margin-left:auto}
        .qfilter button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:700;font-size:15px;cursor:pointer}
        .qfilter button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
        .searchbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
        .searchbar .slab{font-weight:800;color:var(--ink-2);font-size:14px}
        .searchbar .tilde{font-weight:800;color:var(--ink-2)}
        .dinput{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;font-weight:700;color:var(--ink);background:var(--surface-2);font-variant-numeric:tabular-nums;min-width:150px}
        .sbtn{height:48px;padding:0 22px;border:none;border-radius:12px;background:var(--teal);color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-left:auto}
        .sbtn:active{background:var(--teal-d)}
        .qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
        .wo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease;position:relative;overflow:hidden}
        .wo:active{transform:scale(.985)}
        .wo .edge{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
        .wo[data-st="working"] .edge{background:var(--teal)}.wo[data-st="wait"] .edge{background:var(--amber)}.wo[data-st="done"] .edge{background:var(--green)}
        .wo .row1{display:flex;align-items:center;gap:10px;margin-bottom:8px}
        .wo .wono{font-weight:800;font-size:15px;color:var(--ink-2)}
        .modeltag{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px}
        .modeltag.dom{background:var(--teal-bg);color:var(--teal-d)}.modeltag.exp{background:var(--purple-bg);color:var(--purple)}
        .modeltag.mod{background:var(--amber-bg);color:var(--amber)}
        .chip{margin-left:auto;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:800}
        .chip.working{background:var(--teal-bg);color:var(--teal-d)}.chip.wait{background:var(--amber-bg);color:var(--amber)}.chip.done{background:var(--green-bg);color:var(--green)}
        .wo .name{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.3;margin:2px 0 4px}
        .wo .code{font-size:13px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:14px}
        .wo .meta{display:flex;gap:18px;align-items:flex-end}
        .wo .meta .blk{display:flex;flex-direction:column;gap:2px}
        .wo .meta .lab{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .wo .meta .val{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
        .wo .meta .val.left{color:var(--teal-d)}
        .wo .prog{margin-left:auto;text-align:right}
        .wo .bar{height:8px;width:120px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:6px}
        .wo .bar>i{display:block;height:100%;background:var(--teal);border-radius:999px}
        .wo .rejdot{background:var(--red);color:#fff;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px}

        /* 공통 상단바(B,C) */
        .topbar2{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);z-index:2}
        .back{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;font-size:22px;flex:0 0 auto}
        .back:active{background:var(--line)}
        .htitle{min-width:0;flex:1}
        .htitle .t{font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .htitle .s{font-size:13.5px;color:var(--ink-2);font-weight:700;margin-top:1px}
        .infopill{display:flex;gap:7px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
        .infopill b{color:var(--ink);font-variant-numeric:tabular-nums}.infopill.big b{color:var(--teal-d);font-size:16px}
        .col-stack{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;height:100%}
        .bscroll{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px}
        .bgrid{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
        .secline{display:flex;align-items:center;gap:10px;margin:6px 2px 0;color:var(--ink-2);font-weight:800;font-size:14px}
        .secline .ln{flex:1;height:1px;background:var(--line)}

        /* B. 유닛 그리드 */
        .ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
        .unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .12s}
        .unit:active{transform:scale(.98)}
        .unit .edge{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--amber)}
        .unit[data-st="assembling"] .edge{background:var(--teal)}.unit[data-st="inspect_wait"] .edge{background:var(--purple)}.unit[data-st="reject"] .edge{background:var(--red)}.unit[data-st="pass"] .edge{background:var(--green)}
        .unit .un{font-size:17px;font-weight:800}
        .unit .lot{font-size:12.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px;min-height:16px}
        .unit .row{display:flex;align-items:center;gap:8px;margin-top:10px}
        .ubadge{padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:800}
        .ubadge.wait{background:var(--amber-bg);color:var(--amber)}.ubadge.assembling{background:var(--teal-bg);color:var(--teal-d)}.ubadge.inspect_wait{background:var(--purple-bg);color:var(--purple)}.ubadge.reject{background:var(--red-bg);color:var(--red)}.ubadge.pass{background:var(--green-bg);color:var(--green)}
        .unit .ubar{height:7px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:10px}
        .unit .ubar>i{display:block;height:100%;background:var(--teal);border-radius:999px}
        .unit .pct{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}

        /* C. 스텝 트리 */
        .rejban{background:var(--red-bg);border:1px solid var(--red);border-radius:14px;padding:12px 14px;color:var(--red);font-weight:800;font-size:14px;line-height:1.5}
        .rejban .rl{display:block;font-size:12.5px;font-weight:800;opacity:.85;margin-top:4px;color:var(--ink-2)}
        .tierlab{font-size:12px;font-weight:800;color:var(--ink-2);margin:10px 2px 2px;letter-spacing:.03em}
        .step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0;margin-left:calc(var(--ind,0) * 18px)}
        .step .edge{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line);z-index:1}
        .step[data-st="done"] .edge{background:var(--green)}.step[data-st="working"] .edge{background:var(--teal)}.step.avail .edge{background:var(--amber)}
        .step[data-st="working"]{border-color:var(--teal)}
        .step.rework .edge{background:var(--red)}
        .step.rework{border-color:var(--red)}
        .step.locked{background:var(--surface-2)}
        .step.locked .sid{opacity:.55}
        .step.locked .srctog,.step.locked .srctog button{opacity:1}
        .step.replaced{background:var(--surface-2)}
        .step.replaced .sid{opacity:.5}
        .st-badge.repl2{background:#EEF0FF;color:#4A54C9}
        .shead{display:flex;align-items:center;gap:10px;padding:14px 16px 14px 18px;flex-wrap:wrap;min-height:76px}
        .shead .sgap{margin-left:auto}
        .shead .sbtn2+.sbtn2{margin-left:0}
        .caret{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-size:14px;cursor:pointer;flex:0 0 auto;transition:transform .15s}
        .caret.open{transform:rotate(90deg);background:var(--teal-bg);border-color:var(--teal);color:var(--teal-d)}
        .caret.dis{opacity:.4;cursor:default}
        .sid{display:flex;flex-direction:column;min-width:0;flex:1}
        .sid .sn{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.25;overflow-wrap:anywhere}
        .sid .sc{font-size:12.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .lvl{font-size:11px;font-weight:800;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);padding:3px 8px;border-radius:999px;flex:0 0 auto}
        .swho{font-size:12px;font-weight:800;color:var(--green);background:var(--green-bg);padding:4px 10px;border-radius:999px;flex:0 0 auto;font-variant-numeric:tabular-nums}
        .swho.rw{color:var(--red);background:var(--red-bg)}
        .swho.on{color:var(--teal-d);background:var(--teal-bg)}
        .smeta{flex:1 0 100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 0 2px 42px;margin-top:-4px}
        .stime{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap}
        .stime button{height:32px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
        .stime button:active{background:var(--line)}
        .stime button b{color:var(--teal-d);text-decoration:underline dotted;font-weight:800}
        .lockicon{font-size:12px;font-weight:800;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
        .st-badge{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800;flex:0 0 auto}
        .st-badge.wait{background:var(--amber-bg);color:var(--amber)}.st-badge.done{background:var(--green-bg);color:var(--green)}
        .st-badge.rw{background:var(--red-bg);color:var(--red)}
        .st-badge.working{background:var(--teal-bg);color:var(--teal-d)}
        .st-badge.working i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:6px;animation:blink 1.2s infinite}
        @keyframes blink{50%{opacity:.25}}
        .sbtn2{height:48px;padding:0 16px;border-radius:14px;border:none;font-weight:800;font-size:15px;cursor:pointer;flex:0 0 auto}
        .sbtn2.done{background:var(--green);color:#fff}.sbtn2.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
        .sbtn2.warn{background:var(--red-bg);color:var(--red);border:1px solid var(--red)}
        .sbtn2.go{background:var(--teal);color:#fff}
        .sbtn2.del{background:var(--surface);color:var(--red);border:1px solid var(--line);padding:0 14px}
        .sbom{border-top:1px dashed var(--line);background:var(--surface-2);padding:12px 16px 14px 24px;display:none}
        .sbom.open{display:block}
        .srctog{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:0 0 auto}
        .srctog button{height:38px;padding:0 12px;border:none;background:var(--surface);color:var(--ink-2);font-weight:800;font-size:13px;cursor:pointer}
        .srctog button.on{background:var(--teal);color:#fff}
        .st-badge.stock{background:#EEF0FF;color:#4A54C9}
        .step.stock .edge{background:#6D7BE0}
        .stockbody{padding:12px 16px 14px 24px;background:var(--surface-2);border-top:1px dashed var(--line)}
        .wlot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid #6D7BE0;background:#EEF0FF;border-radius:14px;padding:12px 14px}
        .wlot .wl{flex:1;min-width:0}
        .wlot .wlt{font-size:12px;font-weight:800;color:#4A54C9}
        .wlot .wll{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .wlot .wlm{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .wlot .wchg{height:44px;padding:0 16px;border-radius:12px;border:1px solid #6D7BE0;background:var(--surface);color:#4A54C9;font-weight:800;font-size:14px;cursor:pointer;flex:0 0 auto}
        .wlot .wchg:disabled{opacity:.4;cursor:default}
        .skiptog{margin-top:10px;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink-2);font-weight:800;font-size:13px}
        .skiptog .caret{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;transition:transform .15s}
        .skiptog .caret.open{transform:rotate(90deg);background:#EEF0FF;border-color:#6D7BE0;color:#4A54C9}
        .skipbox{display:none;margin-top:8px;border:1px dashed var(--line);border-radius:12px;overflow:hidden}
        .skipbox.open{display:block}
        .skiprow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);opacity:.7;font-size:13.5px}
        .skiprow:last-child{border-bottom:none}
        .skiprow b{font-weight:800}.skiprow .pc{color:var(--ink-2);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
        .skiprow .lvl2{font-size:11px;font-weight:800;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
        .skiprow .repl{margin-left:auto;font-size:11px;font-weight:800;color:#4A54C9;background:#EEF0FF;border-radius:999px;padding:2px 8px}
        .prow .fifo{font-size:11px;font-weight:800;color:var(--teal-d);background:var(--surface);border:1px solid var(--teal);border-radius:999px;padding:2px 8px}
        .bhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--ink-2);font-weight:800;font-size:13px}
        .bhead .ln{flex:1;height:1px;background:var(--line)}
        .baddbtn{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--teal);background:var(--teal-bg);color:var(--teal-d);font-weight:800;font-size:13px;cursor:pointer}
        .subasm{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:8px;border:1px dashed var(--line);border-radius:12px;background:var(--surface);font-size:13px;font-weight:700;color:var(--ink-2)}
        .subasm b{color:var(--ink)}
        .subasm .ok{color:var(--green)}.subasm .no{color:var(--amber)}
        .brow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.brow:last-child{border-bottom:none}
        .brow .bid{flex:1;min-width:0}.brow .bn{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .brow .bc{font-size:12px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
        .autotag{font-size:11px;font-weight:800;color:var(--ink-2);padding:2px 6px;border-radius:6px;background:var(--surface)}
        .bstep{display:flex;align-items:center;flex:0 0 auto}
        .bstep button{width:40px;height:44px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer;display:grid;place-items:center}
        .bstep button:active{background:var(--line)}.bstep button.minus{border-radius:12px 0 0 12px}.bstep button.plus{border-radius:0 12px 12px 0}
        .bstep .bq{width:66px;height:44px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#FFFDF4;text-align:center;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;display:grid;place-items:center;cursor:pointer}
        .bstep .bq.auto{background:var(--surface)}
        .brm{width:40px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--red);font-size:16px;cursor:pointer;flex:0 0 auto}

        .actionbar{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;box-shadow:0 -8px 24px -18px rgba(21,34,43,.4)}
        .actionbar .actsum{display:flex;flex-direction:column;margin-right:auto}
        .actionbar .actsum .l{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .actionbar .actsum .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
        .btn{min-height:var(--tap);padding:0 24px;border-radius:16px;border:none;cursor:pointer;font-size:18px;font-weight:800;display:inline-flex;align-items:center;gap:8px}
        .btn.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}.btn.ghost:active{background:var(--line)}
        .btn.primary{background:var(--teal);color:#fff;padding:0 28px;box-shadow:0 8px 18px -8px rgba(14,124,134,.7)}.btn.primary:active{background:var(--teal-d)}
        .btn.start{background:var(--teal);color:#fff;flex:1;justify-content:center;font-size:20px}
        .btn.purple{background:var(--purple);color:#fff}
        .btn.red{background:var(--red);color:#fff}
        .btn:disabled{background:var(--line);color:var(--ink-2);box-shadow:none;cursor:default}

        /* 시트 */
        .mask{position:fixed;inset:0;background:rgba(21,34,43,.42);display:none;z-index:40;align-items:flex-end}
        .mask.show{display:flex;animation:fade .15s ease}@keyframes fade{from{opacity:0}to{opacity:1}}
        .sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 20px calc(40px + env(safe-area-inset-bottom));box-shadow:0 -20px 40px -20px rgba(0,0,0,.4);animation:rise .2s cubic-bezier(.2,.7,.3,1);max-height:88dvh;overflow:auto}
        @keyframes rise{from{transform:translateY(40px)}to{transform:translateY(0)}}
        .sheet .sh{display:flex;align-items:center;margin-bottom:16px}
        .sheet .sh h3{font-size:20px;font-weight:800;margin:0;letter-spacing:-.02em}
        .sheet .sh .x{margin-left:auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;cursor:pointer}
        .sheet .body{max-width:660px;margin:0 auto}
        .fieldlab{font-size:14px;font-weight:800;color:var(--ink-2);margin:14px 2px 8px}
        .opts{display:flex;flex-wrap:wrap;gap:10px}
        .opt{min-height:54px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
        .opt:active{background:var(--surface-2)}.opt.sel{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-d)}
        .opt .sub{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .sheet .ok{width:100%;margin-top:20px;background:var(--teal);color:#fff;min-height:var(--tap);border:none;border-radius:16px;font-size:19px;font-weight:800;cursor:pointer}
        .sheet .ok:disabled{background:var(--line);color:var(--ink-2)}
        .picklist{display:flex;flex-direction:column;gap:8px;max-height:52dvh;overflow:auto;margin-top:6px}

    <script th:inline="none">
        /* ── 높이 자동 맞춤 ── */
        (function () {
            const root = document.querySelector('.ms-wash-root'); if (!root) return;
            function localBelow() {
                let below = 0, node = root;
                while (node && node !== document.body) { let sib = node.nextElementSibling;
                    while (sib) { const r = sib.getBoundingClientRect(); if (r.height > 0 && getComputedStyle(sib).position !== 'fixed') below += r.height; sib = sib.nextElementSibling; }
                    node = node.parentElement; }
                let fx = 0;
                document.querySelectorAll('body *').forEach(el => { if (root.contains(el)) return; const cs = getComputedStyle(el);
                    if (cs.position !== 'fixed' && cs.position !== 'sticky') return; const r = el.getBoundingClientRect();
                    if (r.height > 0 && r.height < innerHeight * 0.5 && r.bottom > innerHeight - 2) fx = Math.max(fx, r.height); });
                return Math.max(below, fx);
            }
            function availBottom() {
                let bottom = window.innerHeight;
                try { const fe = window.frameElement;
                    if (fe) { const pWin = window.parent, pDoc = pWin.document; const feTop = fe.getBoundingClientRect().top;
                        let flow = 0, node = fe;
                        while (node && node !== pDoc.body) { let sib = node.nextElementSibling;
                            while (sib) { const cs = pWin.getComputedStyle(sib), r = sib.getBoundingClientRect(); if (r.height > 0 && cs.position !== 'fixed' && cs.position !== 'absolute') flow += r.height; sib = sib.nextElementSibling; }
                            node = node.parentElement; }
                        let fx = 0;
                        pDoc.querySelectorAll('body *').forEach(el => { if (el === fe || el.contains(fe)) return; const cs = pWin.getComputedStyle(el);
                            if (cs.position !== 'fixed' && cs.position !== 'sticky' && cs.position !== 'absolute') return; const r = el.getBoundingClientRect();
                            if (r.height > 0 && r.height <= 160 && r.top > feTop && r.bottom > pWin.innerHeight - 40) fx = Math.max(fx, r.bottom - r.top); });
                        bottom = Math.min(bottom, (pWin.innerHeight - Math.max(flow, fx)) - feTop); } } catch (e) {}
                return bottom;
            }
            function fit() { const top = root.getBoundingClientRect().top; const avail = availBottom() - top - localBelow(); root.style.setProperty('--wash-h', Math.max(320, Math.floor(avail)) + 'px'); }
            window.addEventListener('resize', fit); window.addEventListener('orientationchange', fit);
            try { window.parent.addEventListener('resize', fit); } catch (e) {}
            fit(); requestAnimationFrame(fit); setTimeout(fit, 200); setTimeout(fit, 600);
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
        })();

           - 검사 불합격: st=reject + reject{} 로 upsert → 조립이 재작업으로 읽음

        const ROTOR_N = A('WIP-MA2006N', 'M2_로터_Ass`y (개선품적용)', 1, [

        const WIP20022 = A('WIP-MC20022', 'SMART-M-CELL2N (재공품)', 1, [BODY]);
        const WIP20022N = A('WIP-MC20022N', 'SMART-M-CELL2N (재공품, 로터개선품)', 1, [WIP20022, ROTOR_N]);

        /* 완제품 직속 = 포장자재. 국내/해외는 여기서만 갈린다 */
        const PACK_DOM = [
            M('M-IY00024', '엠셀 내수용 IN BOX 200*160*50', 2), M('M-IY00023', '엠셀 내수용 C/T BOX', 1),

            M('M-IY10025', '수출용-PE-TOP COVER', 1), M('M-IY00026', '수출용-PE-MIDDLE FOAM', 1)];
        const PACK_COMMON = [

        const PRODUCT = {
            'MRCN-21022': A('MRCN-21022', 'SMART-M-CELL2N (국내)', 1, [WIP20022N].concat(PACK_DOM, PACK_COMMON)),
            'MRCN-21023': A('MRCN-21023', 'SMART-M-CELL2N (해외)', 1, [WIP20022N].concat(PACK_EXP, PACK_COMMON)),

        /* BOM 트리 → 스텝 리스트 (하위부터: post-order). 스텝 = 자식을 가진 노드 */
        function buildSteps(rootCode) {
            const root = PRODUCT[rootCode], out = [];
            (function walk(n, depth, parent) {
                if (!n.c) return null;
                const kids = n.c.filter(x => x.c).map(x => walk(x, depth + 1, n.code)).filter(Boolean);
                out.push({
                    code: n.code, name: n.name, depth,
                    parent, kids: kids.map(k => k.code),
                    worker: null, equip: null, start: null, at: null,
                    src: 'build', stockLot: null,
                    mats: n.c.filter(x => x.mat).map(x => ({code: x.code, name: x.name, per: x.q, qty: x.q, manual: 0})),
                    subs: n.c.filter(x => x.c).map(x => x.code),
                    st: 'wait'
                });
                return n;
            })(root, 0, null);
            /* post-order 보장: depth 깊은 것부터, 같은 depth는 원래 순서 */
            return out.sort((a, b) => b.depth - a.depth);
        }

        function assetOf(code) { return code.startsWith('MRCN') ? '완제품' : code.startsWith('WIP-MC') ? '제공품' : '반제품 모듈'; }

        /* 재고 재공품(반제품) 로트 — 창고에 이미 만들어둔 것. FIFO 자동선택 */
        const WIP_STOCK = {
            'WIP-MC20022': [{lot: 'MC20022-260701', qty: 2}, {lot: 'MC20022-260704', qty: 4}],
            'WIP-MC20022N': [{lot: 'MC20022N-260703', qty: 3}],

        function wipLots(code) { return WIP_STOCK[code] || []; }
        function autoWip(code) { const a = wipLots(code).filter(x => x.qty > 0).slice().sort((x, y) => x.lot < y.lot ? -1 : x.lot > y.lot ? 1 : 0); return a[0] ? a[0].lot : null; }

        function ancStock(u, s) { let p = s.parent; while (p) { const ps = stepOf(u, p); if (ps && ps.src === 'stock') return ps; p = ps ? ps.parent : null; } return null; }
        function skipped(u, s) { return !!ancStock(u, s); }

            const seen = {}, out = [];
            (function walk(n) { (n.c || []).forEach(x => { if (x.mat) { if (!seen[x.code]) { seen[x.code] = 1; out.push({code: x.code, name: x.name, stock: 10 + (x.code.length * 7) % 90}); } } else walk(x); }); })(PRODUCT['MRCN-21022']);

            return out;
        })();

        /* ── 기준 데이터 ── */
        const WORKERS = ['정우철', '김민수', '이서연', '박지훈', '한재범'];
        const EQUIPS = [['AS-01', '조립대 A'], ['AS-02', '조립대 B'], ['MN-01', '수동 조립대']];

        function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
        function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

        function shortT(v) { return v ? v.slice(5).replace('-', '.') : ''; }   /* 07.09 08:32 */
        const WD = ['일', '월', '화', '수', '목', '금', '토'];

        function bomQ(row) { return row.manual ? (row.qty || 0) : row.per; }

        function genLot(o, no) { return o.pcode.replace(/[^A-Z0-9]/g, '') + '-' + o.odate.replace(/-/g, '').slice(2) + '-' + String(no).padStart(3, '0'); }
        function mkUnit(o, no) { return {no, lot: null, worker: null, equip: null, st: 'wait', start: null, end: null, steps: buildSteps(o.pcode), reject: null}; }

        const ORDERS = [

        /* 데모 시드 + 공유 저장소 병합 */
        (function seed() {

            const ch = u1.steps.find(s => s.code === 'WIP-MA2007'); ch.st = 'working'; ch.worker = '이서연'; ch.equip = 'AS-02'; ch.start = todayStr() + ' 08:32';

                const sv = u4.steps.find(s => s.code === 'WIP-MC20022'); if (sv) { sv.src = 'stock'; sv.stockLot = autoWip('WIP-MC20022'); } }

            ORDERS.forEach(oo => oo.units.forEach(u => {
                if (!u.lot) return;

        /* 공유 저장소 → 유닛 상태 반영(검사에서 불합격 처리된 건) */
        function syncFromStore() {
            const s = MCS.read();
            ORDERS.forEach(o => o.units.forEach(u => {
                if (!u.lot) return;
                const r = s.units[u.lot]; if (!r) return;

        function unitProg(u) { const act = activeSteps(u); const done = act.filter(s => s.st === 'done').length; return {done, total: act.length, pct: act.length ? Math.round(done / act.length * 100) : 0}; }
        function orderDone(o) { return o.units.filter(u => u.st === 'inspect_wait' || u.st === 'pass').length; }
        function orderRej(o) { return o.units.filter(u => u.st === 'reject').length; }

        /* 계층 잠금: 하위 스텝(kids)이 전부 done 이어야 활성. 단, 투입 노드는 하위 불필요 → 잠금 해제 */

            while (p) { const ps = stepOf(u, p); if (ps && ps.st === 'done') { ps.st = 'wait'; clearWho(ps); n++; } p = ps ? ps.parent : null; }

        /* ── A 화면 ── */
        let filt = 'all';

            }).join('') || '<div style="grid-column:1/-1;text-align:center;color:var(--ink-2);font-weight:700;padding:40px">해당 조건의 생산계획이 없습니다.</div>';

        document.getElementById('qgrid').addEventListener('click', e => { const c = e.target.closest('.wo'); if (c) openOrder(c.dataset.id); });
        document.querySelectorAll('.qfilter button').forEach(b => b.addEventListener('click', () => {

        (function initDates() { const t = new Date(), f = new Date(); f.setDate(f.getDate() - 7);

            document.getElementById('dFrom').value = fmt(f); document.getElementById('dTo').value = fmt(t); })();

        /* ── 화면 전환 ── */
        const SC = {A: document.getElementById('scA'), B: document.getElementById('scB'), C: document.getElementById('scC')};

        let curO = null, curU = null;
        function openOrder(id) { syncFromStore(); curO = ORDERS.find(o => o.id === id); renderUnits(); show('B'); }
        function renderUnits() {

        }
        document.getElementById('uGrid').addEventListener('click', e => { const c = e.target.closest('.unit'); if (c) openUnit(+c.dataset.i); });

        /* ── C 화면: 스텝 트리 ── */
        function openUnit(i) { curU = curO.units[i]; curU._idx = i; const sc = document.getElementById('cGrid').closest('.bscroll'); if (sc) sc.scrollTop = 0; renderUnit(); show('C'); }
        function renderUnit() {
            const u = curU, o = curO;
            const _sc = document.getElementById('cGrid').closest('.bscroll');
            const _keep = _sc ? _sc.scrollTop : 0;
            document.getElementById('cUnit').textContent = unitName(u) + ' · ' + o.pname;

            document.getElementById('cLotPill').innerHTML = (u.lot ? '<span class="infopill"><span>LOT</span><b>' + u.lot + '</b></span>' : '<span class="infopill"><span>로트</span><b>발번 전</b></span>') +

                (u.end ? '<span class="tpill" data-time="end"><span>완료</span><b>' + u.end + '</b></span>' : '');

        let timeWhich = null, timeStep = null, editDate = null;
        function fmtD(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' (' + WD[d.getDay()] + ')'; }
        document.getElementById('cLotPill').addEventListener('click', e => {
            const t = e.target.closest('[data-time]'); if (t) openTime(t.dataset.time);
        });
        function openTime(which, si) {
            timeWhich = which; timeStep = (si == null ? null : si);
            const tgt = timeStep == null ? null : curU.steps[timeStep];
            document.getElementById('timeTitle').textContent = (which === 'start' ? '시작' : '완료') + ' 일시 수정 · ' +
                (tgt ? tgt.name : unitName(curU));
            const saved = timeStep == null ? (which === 'start' ? curU.start : curU.end) : (which === 'start' ? tgt.start : tgt.at);
            editDate = saved && saved.indexOf(' ') >= 0 ? new Date(saved.split(' ')[0] + 'T' + saved.split(' ')[1]) : new Date();
            document.getElementById('tDate').textContent = fmtD(editDate);
            document.getElementById('tH').textContent = String(editDate.getHours()).padStart(2, '0');
            document.getElementById('tM').textContent = String(editDate.getMinutes()).padStart(2, '0');
            showMask('timeMask');
        }
        document.querySelector('#timeMask .dateedit').addEventListener('click', e => {
            const b = e.target.closest('[data-d]'); if (!b) return;
            editDate.setDate(editDate.getDate() + (+b.dataset.d));
            document.getElementById('tDate').textContent = fmtD(editDate);
        });
        document.querySelector('#timeMask .timeedit').addEventListener('click', e => {
            const b = e.target.closest('[data-t]'); if (!b) return;
            const H = document.getElementById('tH'), M = document.getElementById('tM');
            let h = +H.textContent, m = +M.textContent;
            if (b.dataset.t === 'h+') h = (h + 1) % 24;
            if (b.dataset.t === 'h-') h = (h + 23) % 24;
            if (b.dataset.t === 'm+') m = (m + 1) % 60;
            if (b.dataset.t === 'm-') m = (m + 59) % 60;
            H.textContent = String(h).padStart(2, '0'); M.textContent = String(m).padStart(2, '0');
        });
        document.getElementById('timeOk').onclick = () => {
            const ds = editDate.getFullYear() + '-' + String(editDate.getMonth() + 1).padStart(2, '0') + '-' + String(editDate.getDate()).padStart(2, '0');
            const v = ds + ' ' + document.getElementById('tH').textContent + ':' + document.getElementById('tM').textContent;
            const u = curU;
            if (timeStep == null) {
                if (timeWhich === 'start') { if (u.end && v > u.end) { flash('시작이 완료보다 늦을 수 없습니다'); return; } u.start = v; }
                else { if (u.start && v < u.start) { flash('완료가 시작보다 빠를 수 없습니다'); return; } u.end = v; }
            } else {
                const s = u.steps[timeStep];
                if (timeWhich === 'start') {
                    if (s.at && v > s.at) { flash('시작이 완료보다 늦을 수 없습니다'); return; }
                    s.start = v;
                    if (!u.steps.some(x => x.start && x.start < v)) u.start = v;   /* 최초 착수 갱신 */
                } else {
                    if (s.start && v < s.start) { flash('완료가 시작보다 빠를 수 없습니다'); return; }
                    const kidLate = s.kids.map(k => stepOf(u, k)).filter(k => k.at && k.at > v);
                    if (kidLate.length) { flash('하위 «' + kidLate[0].name + '» 완료보다 빠를 수 없습니다'); return; }
                    const par = s.parent ? stepOf(u, s.parent) : null;
                    if (par && par.at && v > par.at) { flash('상위 «' + par.name + '» 완료보다 늦을 수 없습니다'); return; }
                    s.at = v;
                    if (s.depth === 0) u.end = v;
                }
            }
            hideMask('timeMask'); renderUnit();
            flash((timeWhich === 'start' ? '시작' : '완료') + ' 일시 저장 · ' + v);
        };

        /* 토스트 */
        let tT;
        function flash(m) {
            let t = document.getElementById('toast');
            if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#15222B;color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;z-index:60;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:opacity .3s;max-width:90vw;text-align:center'; document.body.appendChild(t); }
            t.textContent = m; t.style.opacity = '1'; clearTimeout(tT); tT = setTimeout(() => t.style.opacity = '0', 1800);
        }

        renderQueue();
        document.addEventListener('visibilitychange', () => { if (!document.hidden) { syncFromStore(); if (!SC.A.classList.contains('hide')) renderQueue(); else if (!SC.B.classList.contains('hide')) renderUnits(); } });
    </script>

    <!-- 스텝퍼 롱프레스 자동증감 -->
    <style>.bstep button, .dateedit button, .timeedit button {touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}</style>
    <script>
        (function () {
            var SEL = '.bstep button, .dateedit button, .timeedit button';
            var holdTimer = null, repeatTimer = null, maxTimer = null, curBtn = null;
            var END_EVENTS = ['pointerup', 'pointercancel', 'lostpointercapture', 'touchend', 'touchcancel', 'mouseup'];

            function stop() {
                clearTimeout(holdTimer);
                clearInterval(repeatTimer);
                clearTimeout(maxTimer);
                holdTimer = repeatTimer = maxTimer = null;
                if (curBtn) {
                    END_EVENTS.forEach(function (ev) {
                        curBtn.removeEventListener(ev, stop);
                    });
                    curBtn = null;
                }
            }

            function tick(x, y) {
                var el = document.elementFromPoint(x, y);
                var b = (el && el.closest) ? el.closest(SEL) : null;
                if (!b) {
                    stop();
                    return;
                }
                b.click();
            }

            document.addEventListener('pointerdown', function (e) {
                if (e.button != null && e.button > 0) return;
                var btn = e.target.closest ? e.target.closest(SEL) : null;
                if (!btn) return;
                var x = e.clientX, y = e.clientY;
                stop();
                curBtn = btn;
                END_EVENTS.forEach(function (ev) {
                    btn.addEventListener(ev, stop);
                });
                holdTimer = setTimeout(function () {
                    repeatTimer = setInterval(function () {
                        tick(x, y);
                    }, 80);
                    maxTimer = setTimeout(stop, 8000);
                }, 400);
                window.addEventListener('pointerup', stop, {once: true, capture: true});
                window.addEventListener('touchend', stop, {once: true, capture: true});
            });
            window.addEventListener('blur', stop);
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) stop();
            });
        })();
    </script>
