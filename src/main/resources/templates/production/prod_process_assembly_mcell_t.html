        function renderCAction() {
            const u = curU, bar = document.getElementById('cAction'), p = unitProg();
            if (!u.lot_number) {
                bar.innerHTML = '<div class="actsum"><span class="l">조립 대기 · 어셈블리 ' + p.total + '레벨</span>' +
                    '<span class="v">첫 어셈블리 «작업 시작» 시 로트 발번</span></div>' +
                    '<button class="btn ghost" disabled>조립 완료 · 검사 전달</button>';
                return;
            }
            const rejMode = u.state === 'reject';
            bar.innerHTML = '<div class="actsum"><span class="l">' + (rejMode ? '재작업 진행' : '레벨 진행') + '</span><span class="v">' + p.done + ' / ' + p.total + '</span></div>' +
                (u.state === 'inspect_wait' ? '<button class="btn ghost" disabled>검사 대기 중</button>' :
                    u.state === 'pass' ? '<button class="btn ghost" disabled>검사 합격</button>' :
                        '<button class="btn ' + (rejMode ? 'red' : 'primary') + '" disabled>' +
                        '최종 완료시 자동 완료</button>');
        }

        /* ══════════ 스텝 상호작용 ══════════ */
        document.getElementById('cGrid').addEventListener('click', e => {
            /* 조립 ↔ 투입 전환 */
            const sc = e.target.closest('[data-src]');
            if (sc) {
                const [i, mode] = sc.dataset.src.split(',');
                const s = stepIdx(+i);
                if (mode === 'stock') { openWlot(+i); }
                else guard(async () => {
                    await apiPost('/step_source', {step_id: s.step_id, source: 'build'});
                    flash('조립 전환 · 하위 레벨 복원'); await loadSteps();
                });
                return;
            }
            /* 재고 로트 선택 */
            const wl = e.target.closest('[data-wlot]');
            if (wl) { openWlot(+wl.dataset.wlot); return; }
            /* 투입 확정취소 → 조립으로 */
            const scn = e.target.closest('[data-stockcancel]');
            if (scn) {
                const s = stepIdx(+scn.dataset.stockcancel);
                guard(async () => {
                    await apiPost('/step_source', {step_id: s.step_id, source: 'build'});
                    flash('확정취소'); await loadSteps();
                });
                return;
            }
            /* 펼치기 — 투입자재 지연 로드 */
            if (e.target.closest('[data-pires],[data-pistart],[data-pijudge],[data-pirevise]')) { piTap(e.target); return; }
            const c = e.target.closest('[data-caret]');
            if (c) {
                const i = +c.dataset.caret, s = stepIdx(i);
                const box = document.getElementById('sbom' + i);
                const opening = !box.classList.contains('open');
                c.classList.toggle('open'); box.classList.toggle('open');
                if (opening && s.mats == null && s.source !== 'stock') loadStepMats(i);
                return;
            }
            /* 시각 수정 */
            const ts = e.target.closest('[data-stime]');
            if (ts) { const [si, wh] = ts.dataset.stime.split(','); openTime(wh, +si); return; }
            /* 작업 시작 */
            const g = e.target.closest('[data-go]');
            if (g) {
                const i = +g.dataset.go;
                if (!dlDone()) { flash('프로그램 다운로드를 먼저 완료하세요'); return; }
                if (stepIdx(i).locked) { flash('하위 어셈블리 미완료'); return; }
                openWhoSheet(i); return;
            }
            /* ★ 프로그램 다운로드 */
            const dsl = e.target.closest('[data-dlslot]');
            if (dsl) { openDlSlot(+dsl.dataset.dlslot); return; }
            if (e.target.closest('[data-dlgo]')) { openWhoSheet('DL'); return; }
            if (e.target.closest('[data-dldone]')) {
                guard(async () => {
                    await apiPost('/dl_finish', {unit_id: curU.unit_id, end_time: nowFull()});
                    await dlRefresh();
                });
                return;
            }
            if (e.target.closest('[data-dlcancel]')) {
                uiConfirm('프로그램 다운로드 완료를 취소합니다.\n입력한 S/N 은 그대로 남습니다.', function () {
                    guard(async () => { await apiPost('/dl_cancel', {unit_id: curU.unit_id}); await dlRefresh(); });
                }, '완료취소');
                return;
            }
            const dt = e.target.closest('[data-dltime]');
            if (dt) { openTime(dt.dataset.dltime, 'DL'); return; }
            const dr = e.target.closest('[data-dlrm]');
            if (dr) {
                const ids = (DL.boards || []).map(b => +b.mat_id).filter(id => id !== +dr.dataset.dlrm);
                guard(async () => { await apiPost('/dl_boards', {unit_id: curU.unit_id, mat_ids: ids.join(',')}); await dlRefresh(); });
                return;
            }
            if (e.target.closest('[data-dladd]')) { openDlPick(); return; }
            /* 완료 */
            const d = e.target.closest('[data-done]');
            if (d) { finishStep(+d.dataset.done); return; }
            /* 작업 삭제 */
            const dl = e.target.closest('[data-del]');
            if (dl) {
                const s = stepIdx(+dl.dataset.del);
                guard(async () => {
                    await apiPost('/step_delete', {step_id: s.step_id});
                    flash('작업 삭제 · 대기로 되돌림'); await loadSteps();
                });
                return;
            }
            /* 완료취소 (서버가 상위까지 캐스케이드) */
            const cc = e.target.closest('[data-cancel]');
            if (cc) {
                const s = stepIdx(+cc.dataset.cancel);
                const above = (function () {   /* 함께 분해될 상위 개수 */
                    let n = 0, pm = s.parent_mat_id;
                    while (pm != null) { const ps = stepByMat(pm); if (!ps) break; if (ps.state === 'done') n++; pm = ps.parent_mat_id; }
                    return n;
                })();
                /* 검사에 «합격한» 유닛을 뜯는 것은 무게가 다르다.
                   합격 판정이 무효가 되고 재검사를 받아야 하므로, 실수로 누르는 것을
                   막기 위해 한 번 더 알린다. 막지는 않는다 —
                   포장 직전에 흠집을 발견하는 것처럼 뜯어야 할 일이 실제로 있고,
                   길을 막으면 현장이 시스템 밖에서 처리하게 된다.
                   판정 이력은 insp_result 에 남으므로 「합격 → 분해 → 재검사」가 추적된다. */
                const passed = curU && ['pass', 'packed'].includes(curU.state);
                /* 전체 합격이 아니어도 «일부» 판정이 났으면 같은 무게다 —
                   그 판정도 무효가 되고 처음부터 다시 검사받아야 한다. */
                const judged = curU ? Number(curU.insp_judged || 0) : 0;
                const totalF = curU ? Number(curU.insp_total  || 0) : 0;
                // 불합격(reject)은 제외 — 검사가 돌려보낸 것이라 분해가 정상 흐름(재작업)이다
                const partial = !passed && curU && curU.state !== 'reject' && judged > 0;
                uiConfirm(s.mat_name + ' 을(를) 분해합니다.' +
                    (passed ? '\n\n⚠ 이 유닛은 검사에 합격했습니다.\n분해하면 합격 판정이 무효가 되고 재검사를 받아야 합니다.' : '') +
                    (partial ? '\n\n⚠ 이 유닛은 검사 ' + totalF + '건 중 ' + judged + '건이 판정되었습니다.'
                        + '\n분해하면 그 판정이 무효가 되고 처음부터 다시 검사해야 합니다.' : '') +
                    (above ? '\n\n이 모듈에 접근하려면 위에 조립된 어셈블리 ' + above + '개도 함께 분해해야 합니다.' : '') +
                    '\n\n로트번호는 그대로 유지되고, 투입했던 자재는 재고로 되돌아갑니다.\n자재를 교체·추가한 뒤 다시 완료하세요.', function () {
                    guard(async () => {
                        await apiPost('/step_cancel', {step_id: s.step_id});
                        await loadSteps(); await renderUnits();
                    });
                }, '완료취소');
                return;
            }
            /* 수량 가감 */
            const m = e.target.closest('[data-m]');
            if (m) {
                const [i, bi, dv] = m.dataset.m.split(',').map(Number);
                const r = stepIdx(i).mats[bi];
                r.manual = 1; r.qty = Math.max(0, bomQ(r) + dv);
                if (r.sn_yn === 'Y' || r.snOpen || snCount(r)) { renderUnit(); openStep(i); }   // S/N 칸 수가 바뀐다
                else syncMatRow(i, bi);
                saveStepMats(i);
                return;
            }
            /* ★ 투입 로트 선택 */
            const lc = e.target.closest('[data-lot]');
            if (lc) { const [i, bi] = lc.dataset.lot.split(',').map(Number); openMatLot(i, bi); return; }
            /* ★ S/N 칸 열기/닫기 */
            const st = e.target.closest('[data-sntog]');
            if (st) {
                const [i, bi] = st.dataset.sntog.split(',').map(Number);
                const r = stepIdx(i).mats[bi];
                if (r.sn_yn === 'Y' || snCount(r)) { flash('S/N 대상 자재이거나 입력된 S/N 이 있어 닫을 수 없습니다'); return; }
                r.snOpen = !r.snOpen; renderUnit(); openStep(i);
                return;
            }
            const pd = e.target.closest('[data-pad]');
            if (pd) { const [i, bi] = pd.dataset.pad.split(',').map(Number); openPad(i, bi); return; }
            const rm = e.target.closest('[data-rm]');
            if (rm) {
                const [i, bi] = rm.dataset.rm.split(',').map(Number);
                const r = stepIdx(i).mats[bi];
                uiConfirm(esc(r.mat_name) + ' 을(를) 투입자재에서 제외합니다.\n\n다시 넣으려면 [＋ 자재]로 추가해야 합니다.',
                    function () {
                        stepIdx(i).mats.splice(bi, 1);
                        renderUnit(); openStep(i);
                        saveStepMats(i);
                    }, '제외');
                return;
            }
            const ad = e.target.closest('[data-add]');
            if (ad) { openPartSheet(+ad.dataset.add); return; }
        });

        function openStep(i) {
            const c = document.querySelector('[data-caret="' + i + '"]');
            if (c) { c.classList.add('open'); document.getElementById('sbom' + i).classList.add('open'); }
        }

        /* 투입자재 로드 — 하위 어셈블리도 같은 목록에 포함(서버 정렬: 어셈블리 우선).
           단 완료 전송(bom_json) 에서는 제외한다. 서버 finishStep 이 자식 스텝 산출 로트를 자동 합류시킴. */
        async function loadStepMats(i) {
            const s = stepIdx(i);
            await guard(async () => {
                const rows = await apiGet('/step_materials', {step_id: s.step_id}) || [];
                // ★ S/N 은 별도 테이블 — 자재별 {순번: S/N} 으로 붙인다
                let sns = [];
                try { sns = await apiGet('/sn_list', {unit_id: curU.unit_id}) || []; } catch (e) { sns = []; }   // ★ 유닛 단위
                s.mats = rows.map(r => {
                    const m = {};
                    sns.filter(x => +x.mat_id === +r.mat_id).forEach(x => { m[x.seq_no] = x.serial_no; });
                    return Object.assign({}, r, {manual: 0, qty: r.default_qty, sns: m});
                });
                loadPi(s);   // ★ 공정검사
                renderUnit(); openStep(i);
            });
        }

        /* 스텝 완료 — 편집한 투입자재를 bom_json 으로 전송 */
        async function finishStep(i) {
            const s = stepIdx(i);
            if (s.pi_form_id && s.pi_verdict !== 'pass' && piAllPass(s)) await piAutoPass(s);
            if (s.pi_form_id && s.pi_verdict !== 'pass') {   // ★ 공정검사 합격해야 완료
                flash('공정검사 합격 후 완료할 수 있습니다');
                if (s.mats == null) await loadStepMats(i); else { loadPi(s); renderUnit(); }
                openStep(i); return;
            }
            if (s.mats == null) { await loadStepMats(i); }
            const bom = (s.mats || []).filter(r => r.is_assembly !== 'Y' && bomQ(r) > 0)
                .map(r => ({matId: r.mat_id, qty: bomQ(r), lotId: r.lot_id || ''}));
            /* ★ S/N 대상인데 비어 있으면 알려만 준다(막지 않는다 — 완료 후에도 입력할 수 있다) */
            const miss = (s.mats || []).filter(r => r.sn_yn === 'Y' && r.is_assembly !== 'Y' && snCount(r) < Math.max(1, Math.round(bomQ(r))));
            if (miss.length) flash('S/N 미입력 : ' + miss.map(r => r.mat_name).join(', ') + ' — 완료 후에도 입력할 수 있습니다');
            await guard(async () => {
                await apiPost('/step_finish', {
                    step_id: s.step_id,
                    actor_id: s.actor_id, equipment_id: s.equipment_id,
                    start_time: s.start_time, end_time: nowFull(),
                    bom_json: JSON.stringify(bom),
                    spjangcd: CTX.spjangcd
                });
                flash('완료 · ' + s.mat_name + (s.depth === 0 ? ' → 검사 공정으로 전달' : ' → 상위 레벨 확인'));
                await loadSteps();
                await renderUnits();
                curU = UNITS.find(u => +u.unit_id === +curU.unit_id) || curU;
                if (s.depth === 0) { show('B'); }
                else renderUnit();
            });
        }

        /* ══════════ ★ 다운로드 카드 S/N 입력 ══════════ */
        document.getElementById('cGrid').addEventListener('change', e => {
            const inp = e.target.closest('[data-dlsn]'); if (!inp) return;
            const matId = +inp.dataset.dlsn, v = inp.value.trim();
            apiPostSilent('/sn_save', {unit_id: curU.unit_id, material_id: matId, seq_no: 1, serial_no: v})
                .then(function (res) {
                    if (res && res.success === false) { flash(res.message || 'S/N 저장 실패'); return; }
                    const b = (DL.boards || []).find(x => +x.mat_id === matId);
                    const was = b && b.serial_no ? 1 : 0; if (b) b.serial_no = v;
                    // 아직 안 펼친 스텝의 S/N 현황 배지도 맞춘다
                    const d = (v ? 1 : 0) - was;
                    if (d) STEPS.forEach(st => {
                        if (st.mats || !String(st.sn_mat_ids || '').split(',').includes(String(matId))) return;
                        st.sn_done = Math.max(0, (+st.sn_done || 0) + d);
                        const tg = document.querySelector('[data-sntag="' + st.step_id + '"]');
                        if (tg) tg.outerHTML = snBadge(st).trim();
                    });
                    inp.classList.toggle('ok', !!v);
                    if (res && res.message) flash(res.message);
                    // 같은 보드를 투입하는 어셈블리 스텝이 이미 열려 있으면 그 칸도 맞춘다
                    STEPS.forEach(st => (st.mats || []).forEach(r => {
                        if (+r.mat_id === matId) { r.sns = r.sns || {}; r.sns[1] = v; }
                    }));
                    STEPS.forEach(st => { if (!st.mats) return;
                        const tg = document.querySelector('[data-sntag="' + st.step_id + '"]');
                        if (tg) tg.outerHTML = snBadge(st).trim(); });
                })
                .catch(function () { flash('S/N 저장 실패'); });
        });
        document.getElementById('cGrid').addEventListener('keydown', e => {
            const inp = e.target.closest('[data-dlsn]'); if (!inp || e.key !== 'Enter') return;
            e.preventDefault();
            const all = Array.from(document.querySelectorAll('#cGrid [data-dlsn]'));
            const nx = all[all.indexOf(inp) + 1];
            if (nx) nx.focus(); else inp.blur();
        });
        /* ＋ 보드 — 이 유닛 BOM 의 S/N 관리 자재 중에서 고른다(재고 로트 시트를 같이 쓴다) */
        let dlPick = false;
        function openDlPick() {
            const have = (DL.boards || []).map(b => +b.mat_id);
            const cand = (DL.candidates || []);
            dlPick = true; mlotT = null;
            document.getElementById('wlotTitle').textContent = '다운로드할 보드 선택';
            document.getElementById('wlotList').innerHTML = cand.map(m =>
                    '<div class="prow ' + (have.includes(+m.mat_id) ? 'added' : '') + '" data-dlp="' + m.mat_id + '">' +
                    '<div class="pid"><div class="pnm">' + esc(m.mat_name) + '</div><div class="pcode">' + esc(m.mat_code) + '</div></div>' +
                    '<div class="pchk">' + (have.includes(+m.mat_id) ? '✓' : '＋') + '</div></div>').join('')
                || '<div style="color:var(--ink-2);font-weight:700;padding:8px 2px">이 품목 BOM 에 «S/N 관리» 자재가 없습니다. 품목 관리에서 먼저 체크하세요.</div>';

        }
        document.getElementById('wlotList').addEventListener('click', e => {
            if (!dlPick) return;

            e.stopImmediatePropagation();

            let ids = (DL.boards || []).map(b => +b.mat_id);
            ids = ids.includes(id) ? ids.filter(x => x !== id) : ids.concat([id]);
            guard(async () => {
                await apiPost('/dl_boards', {unit_id: curU.unit_id, mat_ids: ids.join(',')});
                loadDl(); openDlPick(); renderUnit();

        }, true);
        document.getElementById('wlotMask').addEventListener('click', e => {
            if (e.target.id === 'wlotMask' || e.target.closest('[data-close]')) dlPick = false;
        });

        /* ══════════ ★ S/N 입력 — 칸을 벗어나면 저장 ══════════ */
        document.getElementById('cGrid').addEventListener('change', e => {
            const inp = e.target.closest('[data-sn]'); if (!inp) return;
            const [i, bi, k] = inp.dataset.sn.split(',').map(Number);
            const s = stepIdx(i), r = s.mats[bi], v = inp.value.trim();
            r.sns = r.sns || {};
            apiPostSilent('/sn_save', {unit_id: curU.unit_id, step_id: s.step_id, material_id: r.mat_id, seq_no: k, serial_no: v, mat_lot_id: r.lot_id || ''})
                .then(function (res) {
                    if (res && res.success === false) { flash(res.message || 'S/N 저장 실패'); return; }
                    r.sns[k] = v;
                    inp.classList.toggle('ok', !!v);
                    if (res && res.message) { flash(res.message); loadDl(); }   // 보드가 바뀌었으면 다운로드 카드 경고
                    const b = inp.closest('.brow') && inp.closest('.brow').querySelector('[data-sntog]');
                    if (b) b.textContent = 'S/N' + (snCount(r) ? ' ' + snCount(r) + '/' + Math.max(1, Math.round(bomQ(r))) : '');
                    const tg = document.querySelector('[data-sntag="' + s.step_id + '"]');
                    if (tg) tg.outerHTML = snBadge(s).trim();
                })
                .catch(function () { flash('S/N 저장 실패'); });
        });
        // 엔터 = 다음 칸으로 (스캐너·키보드 연속 입력)
        document.getElementById('cGrid').addEventListener('keydown', e => {
            const inp = e.target.closest('[data-sn]'); if (!inp || e.key !== 'Enter') return;
            e.preventDefault();
            const all = Array.from(document.querySelectorAll('#cGrid [data-sn]'));
            const nx = all[all.indexOf(inp) + 1];
            if (nx) nx.focus(); else inp.blur();
        });

        /* ══════════ ★ 투입 로트 선택 (원자재) — 재고 로트 시트를 같이 쓴다 ══════════ */
        let mlotT = null;   // [stepIdx, matIdx] 이면 원자재 로트 선택 모드, null 이면 재고 재공품 모드
        async function openMatLot(i, bi) {
            const s = stepIdx(i), r = s.mats[bi];
            await guard(async () => {
                const lots = await apiGet('/wip_lots', {material_id: r.mat_id, store_id: r.src_store || CTX.outStore}) || [];
                mlotT = [i, bi]; dlPick = false;
                document.getElementById('wlotTitle').textContent = r.mat_name + ' · 투입 로트 선택';
                document.getElementById('wlotList').innerHTML =
                    '<div class="prow ' + (!r.lot_id ? 'added' : '') + '" data-ml="">' +
                    '<div class="pid"><div class="pnm">FIFO 자동</div><div class="pcode">오래된 로트부터 자동으로 뺍니다</div></div>' +
                    '<div class="pchk">' + (!r.lot_id ? '✓' : '＋') + '</div></div>' +
                    lots.map((l, k) =>
                        '<div class="prow ' + (+l.mat_lot_id === +r.lot_id ? 'added' : '') + '" data-ml="' + l.mat_lot_id + '" data-mln="' + esc(l.lot_number) + '">' +
                        '<div class="pid"><div class="pnm">' + esc(l.lot_number) + '</div><div class="pcode">' + esc(r.mat_code) + ' · 입고 ' + esc(l.input_time || '') +
                        (Number(l.stock) < bomQ(r) ? ' · <b style="color:var(--amber)">재고 부족분은 FIFO 로 채움</b>' : '') + '</div></div>' +
                        (k === 0 ? '<span class="fifo">FIFO</span>' : '') +
                        '<div class="pr"><div class="pl">가용</div>' + l.stock + '</div>' +
                        '<div class="pchk">' + (+l.mat_lot_id === +r.lot_id ? '✓' : '＋') + '</div></div>').join('');
                showMask('wlotMask');
            });
        }
        document.getElementById('wlotList').addEventListener('click', e => {
            if (!mlotT) return;
            const row = e.target.closest('[data-ml]'); if (!row) return;
            e.stopImmediatePropagation();          // 재고 재공품 핸들러로 넘기지 않는다
            const [i, bi] = mlotT, r = stepIdx(i).mats[bi];
            r.lot_id = row.dataset.ml ? +row.dataset.ml : null;
            r.lot_number = row.dataset.ml ? row.dataset.mln : null;
            mlotT = null;
            hideMask('wlotMask');
            saveStepMats(i);
            renderUnit(); openStep(i);
            flash(r.lot_id ? '투입 로트 지정 · ' + r.lot_number : 'FIFO 자동으로 되돌렸습니다');
        }, true);
        document.getElementById('wlotMask').addEventListener('click', e => {
            if (e.target.id === 'wlotMask' || e.target.closest('[data-close]')) mlotT = null;
        });

        /* ══════════ 재고 로트 선택 시트 ══════════ */
        let wlotI = null;
        async function openWlot(i) {
            wlotI = i; mlotT = null; dlPick = false;
            const s = stepIdx(i);
            await guard(async () => {
                const lots = await apiGet('/wip_lots', {material_id: s.mat_id, store_id: CTX.outStore}) || [];
                document.getElementById('wlotTitle').textContent = s.mat_name + ' · 재고 로트 선택';
                document.getElementById('wlotList').innerHTML = lots.map((l, k) =>
                        '<div class="prow ' + (+l.mat_lot_id === +s.stock_lot_id ? 'added' : '') + '" data-wl="' + l.mat_lot_id + '">' +
                        '<div class="pid"><div class="pnm">' + esc(l.lot_number) + '</div><div class="pcode">' + esc(s.mat_code) + ' · ' + esc(l.input_time || '') + '</div></div>' +
                        (k === 0 ? '<span class="fifo">FIFO</span>' : '') +
                        '<div class="pr"><div class="pl">가용</div>' + l.stock + '</div>' +
                        '<div class="pchk">' + (+l.mat_lot_id === +s.stock_lot_id ? '✓' : '＋') + '</div></div>').join('')
                    || '<div style="color:var(--ink-2);font-weight:700;padding:8px 2px">가용 재고가 없습니다.</div>';
                showMask('wlotMask');
            });
        }
        document.getElementById('wlotList').addEventListener('click', e => {
            const r = e.target.closest('[data-wl]'); if (!r) return;
            const s = stepIdx(wlotI);
            hideMask('wlotMask');
            guard(async () => {
                await apiPost('/step_source', {step_id: s.step_id, source: 'stock', mat_lot_id: r.dataset.wl});
                flash('재고 투입 확정 · 하위 레벨 생략');
                await loadSteps();
            });
        });

        /* ══════════ 시트 공통 ══════════ */
        function showMask(id) { document.getElementById(id).classList.add('show'); }
        function hideMask(id) { document.getElementById(id).classList.remove('show'); }
        document.querySelectorAll('.mask').forEach(m => m.addEventListener('click', e => {
            if (e.target === m || e.target.closest('[data-close]')) m.classList.remove('show');
        }));

        /* ── 작업자/설비 선택 → 작업 시작 ── */
        let selWorkers = [], selE = null, whoStep = null;
        function openWhoSheet(si) {
            whoStep = si;
            const s = (si === 'DL')
                ? {mat_name: 'Program Download', mat_code: '보드 프로그램 다운로드', actor_id: DL && DL.actor_id, equipment_id: DL && DL.equipment_id}
                : stepIdx(si);
            const last = STEPS.filter(x => x.actor_id).slice(-1)[0];
            /* 직전 스텝의 조 편성을 그대로 이어받는다 (한 대를 같은 조가 계속 만든다) */
            const src = (s.actor_id ? s : (last || null));
            selWorkers = src ? memberList(src) : [];
            selE = s.equipment_id || (last ? last.equipment_id : null);
            document.getElementById('startTitle').textContent = '작업 시작 · ' + s.mat_name;
            document.getElementById('startSub').textContent = s.mat_code + ' · 이 어셈블리를 작업할 사람과 설비를 지정하세요';
            // 어떤 경로로든 비어 있으면 여기서 한 번 읽는다(마지막 방어).
            if (!WORKERS || !WORKERS.length) WORKERS = fetchWorkersActor() || [];
            document.getElementById('workerOpts').innerHTML = WORKERS.map(w =>
                '<button class="opt" data-w="' + w.actor_id + '" data-n="' + esc(w.actor_name) + '">' +
                '<span class="ck"></span>' + esc(w.actor_name) + '</button>').join('');
            paintWorkerOpts();
            document.getElementById('equipOpts').innerHTML = EQUIPS.map(eq =>
                '<button class="opt' + (+eq.equipment_id === +selE ? ' sel' : '') + '" data-e="' + eq.equipment_id + '">' + esc(eq.equipment_name) +
                '<span class="sub">' + esc(eq.equipment_code || '') + '</span></button>').join('');
            autoPickSingleEquip();
            document.getElementById('startOk').textContent = (si === 'DL') ? '프로그램 다운로드 시작' : '이 어셈블리 작업 시작';
            ckStart(); showMask('startMask');
        }
        /* 스텝 행(actor_id + members)에서 선택 배열 복원 — 대표가 항상 첫 번째 */
        function memberList(s) {
            const arr = [];
            if (s.actor_id) arr.push({id: String(s.actor_id), name: s.actor_name || ''});
            String(s.member_ids || '').split(',').map(x => x.trim()).filter(Boolean)
                .forEach(id => { if (!arr.some(w => w.id === id)) arr.push({id, name: ''}); });
            return arr;
        }

        /* 작업자 다중 선택 — 첫 선택자가 대표(Actor). 조립(BSC)과 동일 규약 */
        document.getElementById('workerOpts').addEventListener('click', e => {
            const b = e.target.closest('[data-w]'); if (!b) return;
            const id = b.dataset.w, name = b.dataset.n, k = selWorkers.findIndex(x => x.id === id);
            if (k >= 0) { selWorkers.splice(k, 1); } else { selWorkers.push({id, name}); }
            paintWorkerOpts(); ckStart();
        });

        function paintWorkerOpts() {
            document.querySelectorAll('#workerOpts .opt').forEach(x => {
                const on = selWorkers.some(w => String(w.id) === String(x.dataset.w));
                x.classList.toggle('sel', on);
                const ck = x.querySelector('.ck');
                if (ck) ck.textContent = on ? '\u2713' : '';
            });
        }
        document.getElementById('equipOpts').addEventListener('click', e => {
            const b = e.target.closest('[data-e]'); if (!b) return;
            document.querySelectorAll('#equipOpts .opt').forEach(x => x.classList.remove('sel'));
            b.classList.add('sel'); selE = b.dataset.e; ckStart();
        });
        function ckStart() { document.getElementById('startOk').disabled = !(selWorkers.length && selE); }
        document.getElementById('startOk').onclick = () => {
            if (whoStep === 'DL') {
                hideMask('startMask');
                guard(async () => {
                    await apiPost('/dl_start', {
                        unit_id: curU.unit_id, actor_id: selWorkers[0].id,
                        member_ids: selWorkers.slice(1).map(w => w.id).filter(Boolean).join(','),
                        equipment_id: selE, start_time: nowFull(), spjangcd: CTX.spjangcd
                    });
                    await dlRefresh();
                    flash('프로그램 다운로드 시작 · 보드 S/N 을 입력하세요');
                    const f = document.querySelector('#cGrid [data-dlsn]'); if (f) f.focus();
                });
                return;
            }
            const s = stepIdx(whoStep);
            hideMask('startMask');
            guard(async () => {
                await apiPost('/step_start', {
                    step_id: s.step_id,
                    actor_id  : selWorkers[0].id,                                        /* 대표 = Actor_id */
                    member_ids: selWorkers.slice(1).map(w => w.id).filter(Boolean).join(','),
                    equipment_id: selE,
                    start_time: nowFull(), spjangcd: CTX.spjangcd
                });
                await loadSteps();
                await renderUnits();
                curU = UNITS.find(u => +u.unit_id === +curU.unit_id) || curU;
                renderUnit();
                openStep(whoStep);
                if (stepIdx(whoStep) && stepIdx(whoStep).mats == null) loadStepMats(whoStep);
                flash('작업 시작' + (curU.lot_number ? ' · LOT ' + curU.lot_number : ''));
            });
        };

        /* ── 투입자재 추가 시트 ── */
        let partStep = null, STOCK = [];
        async function openPartSheet(si) {
            partStep = si;
            document.getElementById('partTitle').textContent = '투입자재 추가 · ' + stepIdx(si).mat_name;
            document.getElementById('partSearch').value = '';
            await guard(async () => {
                STOCK = await apiGet('/stock_list', {store_id: CTX.outStore}) || [];
                drawPartList(''); showMask('partMask');
            });
        }
        document.getElementById('partSearch').addEventListener('input', e => drawPartList(e.target.value.trim().toLowerCase()));
        function drawPartList(q) {
            const s = stepIdx(partStep);
            const have = (s.mats || []).map(r => +r.mat_id);
            document.getElementById('partList').innerHTML = STOCK
                .filter(p => !q || ((p.mat_code || '') + (p.mat_name || '')).toLowerCase().includes(q))
                .slice(0, 200)
                .map(p => '<div class="prow' + (have.includes(+p.mat_id) ? ' added' : '') + '" data-p="' + p.mat_id + '">' +
                    '<div class="pid"><div class="pnm">' + esc(p.mat_name) + '</div><div class="pcode">' + esc(p.mat_code) + '</div></div>' +
                    '<div class="pr"><div class="pl">재고</div>' + (p.stock || 0) + '</div>' +
                    '<div class="pchk">' + (have.includes(+p.mat_id) ? '✓' : '＋') + '</div></div>').join('');
        }
        document.getElementById('partList').addEventListener('click', e => {
            const r = e.target.closest('[data-p]'); if (!r) return;
            const p = STOCK.find(x => +x.mat_id === +r.dataset.p), s = stepIdx(partStep);
            if (s.mats == null) s.mats = [];
            if (s.mats.some(m => +m.mat_id === +p.mat_id)) { flash('이미 투입된 자재입니다'); return; }
            s.mats.push({mat_id: p.mat_id, mat_code: p.mat_code, mat_name: p.mat_name, per: 1, default_qty: 1, qty: 1, manual: 1, stock: p.stock, src_store_name: ''});
            saveStepMats(partStep);
            flash('추가 · ' + p.mat_name);
            drawPartList(document.getElementById('partSearch').value.trim().toLowerCase());
            renderUnit(); openStep(partStep);
        });

        /* ── 넘패드 ── */
        let padTarget = null, padVal = '';
        function openPad(si, bi) {
            padTarget = [si, bi]; padVal = '';
            document.getElementById('padLab').textContent = stepIdx(si).mats[bi].mat_name;
            document.getElementById('padDisp').textContent = bomQ(stepIdx(si).mats[bi]);
            showMask('padMask');
        }
        document.querySelector('#padMask .keys').addEventListener('click', e => {
            const b = e.target.closest('[data-k]'); if (!b) return;
            const k = b.dataset.k;
            if (k === 'C') padVal = '';
            else if (k === 'OK') {
                const [si, bi] = padTarget, r = stepIdx(si).mats[bi];
                r.manual = 1; r.qty = Math.max(0, parseInt(padVal || '0', 10));
                saveStepMats(si);
                hideMask('padMask'); renderUnit(); openStep(si); return;
            } else padVal = (padVal === '0' ? '' : padVal) + k;
            document.getElementById('padDisp').textContent = padVal || '0';
        });

        /* ── 시작/완료 일시 수정 ── */
        let timeWhich = null, timeStep = null, editDate = null;
        function fmtD(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' (' + WD[d.getDay()] + ')'; }
        function openTime(which, si) {
            timeWhich = which; timeStep = si;
            const s = (si === 'DL') ? {mat_name: 'Program Download', start_time: DL.start_time, end_time: DL.end_time} : stepIdx(si);
            document.getElementById('timeTitle').textContent = (which === 'start' ? '시작' : '완료') + ' 일시 수정 · ' + s.mat_name;
            const saved = which === 'start' ? s.start_time : s.end_time;
            editDate = (saved && saved.indexOf(' ') >= 0) ? new Date(saved.split(' ')[0] + 'T' + saved.split(' ')[1]) : new Date();
            document.getElementById('tDate').textContent = fmtD(editDate);
            document.getElementById('tH').textContent = String(editDate.getHours()).padStart(2, '0');
            document.getElementById('tM').textContent = String(editDate.getMinutes()).padStart(2, '0');
            showMask('timeMask');
        }
        document.querySelector('#timeMask .dateedit').addEventListener('click', e => {
            const b = e.target.closest('[data-d]'); if (!b) return;
            editDate.setDate(editDate.getDate() + (+b.dataset.d));
            document.getElementById('tDate').textContent = fmtD(editDate);
        });
        document.querySelector('#timeMask .timeedit').addEventListener('click', e => {
            const b = e.target.closest('[data-t]'); if (!b) return;
            const H = document.getElementById('tH'), M = document.getElementById('tM');
            /* ★ 자리올림/자리내림 — 실제 시각으로 더하고 빼서 시·날짜까지 맞춘다.
               예전에는 10:00 에서 분 ▼ → 10:59, 00:30 에서 시 ▼ → 23:30(날짜 그대로)처럼
               «내렸는데 시간이 늦어지는» 문제가 있었다. */
            var step = {'h+': 60, 'h-': -60, 'm+': 1, 'm-': -1}[b.dataset.t] || 0;
            var d = new Date(editDate.getFullYear(), editDate.getMonth(), editDate.getDate(),
                +H.textContent, +M.textContent);
            d.setMinutes(d.getMinutes() + step);
            editDate = new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes());
            H.textContent = String(d.getHours()).padStart(2, '0');
            M.textContent = String(d.getMinutes()).padStart(2, '0');
            document.getElementById('tDate').textContent = fmtD(editDate);
        });
        document.getElementById('timeOk').onclick = () => {
            const ds = editDate.getFullYear() + '-' + String(editDate.getMonth() + 1).padStart(2, '0') + '-' + String(editDate.getDate()).padStart(2, '0');
            const v = ds + ' ' + document.getElementById('tH').textContent + ':' + document.getElementById('tM').textContent;
            const s = (timeStep === 'DL') ? {start_time: DL.start_time, end_time: DL.end_time} : stepIdx(timeStep);
            if (timeWhich === 'start' && s.end_time && v > s.end_time) { flash('시작이 완료보다 늦을 수 없습니다'); return; }
            if (timeWhich === 'end' && s.start_time && v < s.start_time) { flash('완료가 시작보다 빠를 수 없습니다'); return; }
            hideMask('timeMask');
            if (timeStep === 'DL') {
                guard(async () => {
                    await apiPost('/dl_time', {unit_id: curU.unit_id, which: timeWhich, value: v});
                    await dlRefresh();
                    flash((timeWhich === 'start' ? '시작' : '완료') + ' 일시 저장 · ' + v);
                });
                return;
            }
            guard(async () => {
                await apiPost('/step_time', {step_id: s.step_id, which: timeWhich, value: v});
                await loadSteps();
                flash((timeWhich === 'start' ? '시작' : '완료') + ' 일시 저장 · ' + v);
            });

        /* ── 토스트 ── */
        let tT;
        function flash(m) {
            let t = document.getElementById('toast');
            if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#15222B;color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;z-index:60;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:opacity .3s;max-width:90vw;text-align:center'; document.body.appendChild(t); }
            t.textContent = m; t.style.opacity = '1'; clearTimeout(tT); tT = setTimeout(() => t.style.opacity = '0', 1800);
        }

        /* ── 확인 시트 (멸균 화면과 동일) ── */
        function uiConfirm(msg, onOk, okLabel) {
            let m = document.getElementById('confirmMask');
            if (!m) {
                m = document.createElement('div');
                m.id = 'confirmMask';
                m.style.cssText = 'position:fixed;inset:0;background:rgba(21,34,43,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:24px';
                m.innerHTML = '<div style="background:var(--surface);border-radius:20px;max-width:420px;width:100%;padding:24px 22px 18px;box-shadow:0 20px 50px -12px rgba(0,0,0,.4)">'
                    + '<div id="confirmMsg" style="font-size:17px;font-weight:800;color:var(--ink);line-height:1.5;margin-bottom:20px;white-space:pre-line"></div>'
                    + '<div style="display:flex;gap:10px">'
                    + '<button id="confirmCancel" style="flex:1;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font-weight:800;font-size:16px">취소</button>'
                    + '<button id="confirmOk" style="flex:1;height:52px;border-radius:14px;border:none;background:#0E7C86;color:#fff;font-weight:800;font-size:16px">확인</button>'

        /* ══════════ 부팅 ══════════ */
        function loadContext() {
            const d = apiGet('/context', {process_code: CTX.processCode, factory_id: CTX.factoryId}) || {};
            PROC_ID = d.process_id || null;
            WC = d.workcenter_id || null;
            CTX.outStore = d.out_store_id || CTX.outStore;
            if (!PROC_ID) console.warn('[mcell] 공정을 찾지 못했습니다. process."Code"=\'' + CTX.processCode + '\' 확인');
            if (!WC) console.warn('[mcell] 워크센터를 찾지 못했습니다. work_center."Process_id" 매핑 확인');
        }
        function loadBaseData() {
            /* 작업자 = 소속 공장(2공장) 인원만. 포장공정과 같은 규약 */
            WORKERS = fetchWorkersActor();
            const es = combo('equipment', WC);
            EQUIPS = es.length ? es.map(x => ({equipment_id: x.value, equipment_name: x.text, equipment_code: x.code}))
                : (apiGet('/equipments', {workcenter_id: WC}) || []);
        }

        /* AjaxUtil 이 레이아웃에서 늦게 로드될 수 있어 준비될 때까지 대기 */
        (function boot(tries) {
            tries = tries || 0;
            if (typeof AjaxUtil !== 'undefined' && AjaxUtil.getSyncData) {
                guard(async () => {
                    loadContext();
                    if (!PROC_ID) { flash('공정(mc01)을 찾을 수 없습니다'); return; }
                    loadBaseData();
                    await renderQueue();
                });
                return;
            }
            if (tries > 100) {
                flash('AjaxUtil 미로드 — 공용 스크립트 로드 순서를 확인하세요');
                console.error('[mcell] AjaxUtil 을 찾을 수 없습니다. typeof AjaxUtil =', typeof AjaxUtil);
                return;
            }
            setTimeout(function () { boot(tries + 1); }, 50);
        })();

        /* ══════════════════════════════════════════════════════════════════
           [공통 추가] ① 작업자 = 소속 공장 인원만  ② 재고 새로고침
           - ①은 포장공정(prod_process_opack_bsc_t) 규약과 통일한다.
             포장은 /workers 를 factory_id 와 함께 부른다. 다른 공정도 같게 맞췄다.
             ★ 서버가 이 엔드포인트를 아직 안 열었으면 공용 콤보로 폴백한다
               (그 경우 콘솔에 경고가 남는다 — 전사 인원이 다 뜬다는 뜻).
           - ②는 "화면을 다시 그리는" 것이 아니라 지금 보고 있는 자리는 그대로 두고
             재고 수치만 서버에서 다시 읽는다. 앞 공정이 방금 만든 재고를 받는 용도.
           ══════════════════════════════════════════════════════════════════ */
        /* ★ function 선언으로 둔다. 부팅 때 작업자를 미리 읽는 화면(2공장 조립·검사)이 있는데
           이 블록은 스크립트 끝에 있어서, var 로 두면 그 시점엔 값이 아직 undefined 다.
           공장 없이 조회가 나가고 그 결과가 그대로 굳는다. */
        function workerApi()       { return '/api/production/mcell/workers'; }
        function workerFactoryId() { return 2; }

        /* 공용 콤보를 직접 부른다 — 화면마다 combo() 유무가 달라 여기서 자체 호출한다.
           cond1 = 공장(Factory_id). ComboService.person 이 이 조건을 받는다.
           서버는 퇴사자(_status·Exitdate)도 함께 걸러 내려준다. */
        function comboPerson(factoryId) {
            if (typeof AjaxUtil === 'undefined' || !AjaxUtil.getSyncData) return [];
            var r = AjaxUtil.getSyncData('/api/common/combo', {
                combo_type: 'person',
                cond1: (factoryId == null ? '' : String(factoryId)),
                cond2: '', cond3: ''
            }) || {};
            return (r.data || []).map(function (x) {
                return {
                    value: x.value,
                    text : x.text,
                    code : x.code || x.Code || '',
                    factory: String(x.Factory_id != null ? x.Factory_id
                        : (x.factory_id != null ? x.factory_id : ''))
                };
            }).filter(function (w) { return w.value != null && w.text; });
        }

        function fetchWorkerRows() {
            if (typeof AjaxUtil === 'undefined' || !AjaxUtil.getSyncData) return [];

            /* ① 공용 콤보 (기본 경로) */
            var list = [];
            try { list = comboPerson(workerFactoryId()); } catch (e) { list = []; }

            /* ② 콤보가 비면 공정 전용 /workers 로 폴백 (포장처럼 자체 엔드포인트가 있는 화면용) */
            if (!list.length) {
                var rows = [];
                try {
                    var r = AjaxUtil.getSyncData(workerApi(), {
                        factory_id: workerFactoryId(),
                        spjangcd: (typeof CTX !== 'undefined' && CTX && CTX.spjangcd) ? CTX.spjangcd : 'ZZ'
                    }) || {};
                    rows = r.data || (Array.isArray(r) ? r : []);
                } catch (e2) { rows = []; }
                if (!Array.isArray(rows)) rows = [];
                list = rows.map(function (w) {
                    var id = (w.worker_id != null) ? w.worker_id
                        : (w.actor_id  != null) ? w.actor_id
                            : (w.person_id != null) ? w.person_id
                                : (w.id != null) ? w.id : w.value;
                    return {
                        value: id,
                        text : w.name || w.actor_name || w.text || '',
                        code : w.code || '',
                        factory: String(w.factory_id != null ? w.factory_id
                            : (w.Factory_id != null ? w.Factory_id : ''))
                    };
                }).filter(function (w) { return w.value != null && w.text; });
                if (list.length) console.warn('[workers] 공용 콤보가 비어 ' + workerApi() + ' 로 폴백했습니다.');
            }

            /* ③ 응답에 공장이 실려 있으면 화면에서 한 번 더 거른다 (2차 방어).
                  공장 미지정자는 어느 화면에서도 보이도록 남긴다 — 서버 조건과 같은 방침. */
            var f = list.filter(function (w) { return !w.factory || w.factory === String(workerFactoryId()); });
            if (f.length) list = f;
            return list;
        }
        /* {value,text,code} 형태로 쓰는 화면용 */
        function fetchWorkers() { return fetchWorkerRows(); }
        /* {actor_id,actor_name} 형태로 쓰는 화면용 */
        function fetchWorkersActor() {
            return fetchWorkerRows().map(function (w) {
                return {actor_id: w.value, actor_name: w.text, code: w.code};
            });
        }

        /* ── 새로고침 버튼 : 각 화면 헤더(qhead / topbar2) 우측에 붙인다 ──
           목록·액션바는 다시 그려지고 스크롤도 타서 고정 자리를 잡기 어렵다.
           헤더는 화면당 하나씩 고정이라 겹칠 일이 없다. */
        (function () {
            var root = document.querySelector('.ms-wash-root, .ms-pack-root') || document;
            var heads = root.querySelectorAll('.qhead, .topbar2');
            if (!heads.length) return;
            var busy = false;

            function run(b) {
                if (busy) return;
                busy = true;
                var t = b.innerHTML;
                b.innerHTML = '…';
                b.disabled = true;
                b.style.opacity = '.5';
                setTimeout(function () {
                    try {
                        stockRefresh();
                        if (typeof flash === 'function') flash('새로 불러왔습니다');
                    } catch (e) {
                        console.error('[stockRefresh]', e);
                        if (typeof flash === 'function') flash('불러오지 못했습니다');
                    }
                    b.innerHTML = t;
                    b.disabled = false;
                    b.style.opacity = '';
                    busy = false;
                }, 0);
            }

            Array.prototype.forEach.call(heads, function (h) {
                if (h.querySelector('.msRefreshBtn')) return;
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'msRefreshBtn';
                b.title = '새로고침';
                b.setAttribute('aria-label', '새로고침');
                b.innerHTML = '⟳';
                /* 헤더에 이미 오른쪽으로 미는 요소(.qfilter 의 margin-left:auto,
                   .htitle 의 flex:1)가 있으면 auto 를 또 주면 안 된다.
                   남은 공간이 둘로 나뉘어 앞 요소가 가운데로 밀려난다. */
                var pushed = Array.prototype.some.call(h.children, function (c) {
                    var cs = getComputedStyle(c);
                    return cs.marginLeft === 'auto' || parseFloat(cs.flexGrow) > 0;
                });
                b.style.cssText = (pushed ? '' : '') + 'flex:0 0 auto;align-self:center;'
                    + 'width:40px;height:40px;border-radius:12px;'
                    + 'border:1px solid var(--line,#dfe3e8);background:var(--surface,#fff);'
                    + 'color:var(--ink-2,#5b6570);font-size:19px;font-weight:800;line-height:1;'
                    + 'cursor:pointer;touch-action:manipulation;'
                    + '-webkit-user-select:none;user-select:none';
                b.addEventListener('click', function () {
                    run(b);
                });
                h.appendChild(b);
            });
        })();

        function scOn(id) {
            var el = document.getElementById(id);
            return !!el && !el.classList.contains('hide');
        }

        function maskOn(id) {
            var el = document.getElementById(id);
            return !!el && el.classList.contains('show');
        }

        /* ── 재고 새로고침 ── (스텝의 재고 로트 · 투입자재 재고) */
        function stockRefresh() {
            /* 작업자 명단도 함께 다시 읽는다.
               부팅 때 한 번만 읽으므로, 운영 중에 사람을 추가하면 F5 전까지 안 보인다.
               ※ 비우기만 하면(예전 동작) 다음 [작업 시작]에서 목록이 통째로 사라진다.
                 다른 탭에서 작지를 지운 뒤 돌아왔을 때가 그랬다. */
            WORKERS = fetchWorkersActor() || [];
            if (scOn('scC') && typeof curU !== 'undefined' && curU) {
                guard(async () => {
                    await loadSteps();
                });
            } else if (scOn('scB') && typeof curO !== 'undefined' && curO) {
                guard(async () => {
                    await renderUnits();
                });
            } else {
                guard(async () => {
                    await renderQueue();
                });
            }
        }

    </script>

    <!-- 스텝퍼 롱프레스 자동증감 -->
    <style>.bstep button, .dateedit button, .timeedit button {
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
    }</style>
    <script>
        (function () {
            var SEL = '.bstep button, .dateedit button, .timeedit button';
            var holdTimer = null, repeatTimer = null, maxTimer = null, curBtn = null;
            var END_EVENTS = ['pointerup', 'pointercancel', 'lostpointercapture', 'touchend', 'touchcancel', 'mouseup'];

            function stop() {
                clearTimeout(holdTimer);
                clearInterval(repeatTimer);
                clearTimeout(maxTimer);
                holdTimer = repeatTimer = maxTimer = null;
                if (curBtn) {
                    END_EVENTS.forEach(function (ev) {
                        curBtn.removeEventListener(ev, stop);
                    });
                    curBtn = null;
                }
            }

            function tick(x, y) {
                var el = document.elementFromPoint(x, y);
                var b = (el && el.closest) ? el.closest(SEL) : null;
                if (!b) {
                    stop();
                    return;
                }
                b.click();
            }

            document.addEventListener('pointerdown', function (e) {
                if (e.button != null && e.button > 0) return;
                var btn = e.target.closest ? e.target.closest(SEL) : null;
                if (!btn) return;
                var x = e.clientX, y = e.clientY;
                stop();
                curBtn = btn;
                END_EVENTS.forEach(function (ev) {
                    btn.addEventListener(ev, stop);
                });
                holdTimer = setTimeout(function () {
                    repeatTimer = setInterval(function () {
                        tick(x, y);
                    }, 80);
                    maxTimer = setTimeout(stop, 8000);
                }, 550);
                window.addEventListener('pointerup', stop, {once: true, capture: true});
                window.addEventListener('touchend', stop, {once: true, capture: true});
            });
            window.addEventListener('blur', stop);
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) stop();
            });
        })();
    </script>
    <!-- ★ 시간 수정 시트(▲▼ ◀▶) 탭 보장 — 모든 공정 화면 공통
         증상 : 태블릿에서 ▼·◀ 처럼 시트 아래쪽 버튼이 «분명히 버튼을 눌렀는데» 안 먹는다.
         원인 : 화면마다 스테퍼 스크립트가 제각각이었다.
                · touch-action 이 manipulation 이거나 아예 빠진 화면 → 손가락이 1~2px 만
                  밀려도 브라우저가 시트 스크롤로 판정해 click 을 취소
                · pointerdown 처리 없이 click 만 기다리는 화면
                · 버튼이 84×52 로 작아 가장자리를 누르면 빗나감
         해결 : 이 블록이 시간·날짜 버튼만 «먼저»(window 캡처 단계) 가로채서
                누르는 즉시 1회 반영하고, 길게 누르면 반복한다. 뒤따르는 진짜 click 은 삼킨다.
                기존 화면별 스테퍼 스크립트에는 이벤트가 가지 않으므로 중복 실행이 없다. -->
    <style>
        .timeedit button, .dateedit button {
            touch-action: none !important;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        }
        .tcol button { width: 96px !important; height: 60px !important; }
        .dateedit .dbtn { width: 64px !important; height: 58px !important; }
        /* ★ 토스트(알림)는 터치를 받지 않는다.
             토스트는 사라진 뒤에도 투명한 채로 화면 하단(bottom:110px · z-index 60)에 남아
             시트(z-index 40)의 ▼ 버튼·하단 버튼 위를 덮고 있었다. 그래서 «버튼이 보이는데
             눌러도 안 먹는» 일이 생겼다 — 알림이 한 번이라도 뜬 뒤에만 생겨서 들쭉날쭉했다. */
        #toast, #packToast { pointer-events: none !important; }
    </style>
    <script th:inline="none">
        (function () {
            var SEL = '.timeedit button, .dateedit button';
            var hold = null, rep = null, cap = null, lastAt = 0;

            function stop() {
                clearTimeout(hold); clearInterval(rep); clearTimeout(cap);
                hold = rep = cap = null;
            }

            function fire(b) {
                lastAt = Date.now();
                b.click();                       // 합성 click(isTrusted:false) → 화면의 시간 로직 실행
            }

            window.addEventListener('pointerdown', function (e) {
                if (e.button != null && e.button > 0) return;
                var b = e.target && e.target.closest ? e.target.closest(SEL) : null;
                if (!b || b.disabled) return;
                e.stopPropagation();             // 화면별 스테퍼 스크립트로 넘기지 않는다(중복 방지)
                if (e.cancelable) e.preventDefault();
                stop();
                fire(b);                         // 즉시 1회
                var x = e.clientX, y = e.clientY;
                hold = setTimeout(function () {
                    rep = setInterval(function () {
                        var el = document.elementFromPoint(x, y);
                        var bb = el && el.closest ? el.closest(SEL) : null;
                        if (bb) fire(bb); else stop();
                    }, 90);
                    cap = setTimeout(stop, 8000);
                }, 450);
            }, true);

            ['pointerup', 'pointercancel', 'touchend', 'touchcancel', 'mouseup', 'blur'].forEach(function (ev) {
                window.addEventListener(ev, stop, true);
            });
            document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); });

            // 위에서 이미 처리한 탭의 진짜 click 은 삼킨다
            window.addEventListener('click', function (e) {
                if (!e.isTrusted) return;
                var b = e.target && e.target.closest ? e.target.closest(SEL) : null;
                if (b && Date.now() - lastAt < 900) {
                    e.stopPropagation();
                    e.preventDefault();
                }
            }, true);
        })();

        /* ★ 일반 버튼(완료취소 · 시작 · 삭제 · 하단 버튼 등) 탭 보장 — 모든 공정 화면 공통
           스크롤되는 목록·시트 안에서는 누르는 동안 손가락이 1~2px 만 밀려도
           브라우저가 스크롤로 판정해 click 을 취소한다. 그래서 «눌렀는데 안 먹는» 버튼이 생겼다.
           → 손을 뗄 때 같은 버튼 위이고 10px 이내로만 움직였으면 한 번 눌린 것으로 처리.
             많이 움직였으면 스크롤로 보고 무시한다(스크롤은 그대로 된다).
           ★ 뒤따르는 진짜 click 은 «대상과 상관없이» 700ms 동안 삼킨다.
             버튼이 확인창을 띄우면 그 진짜 click 이 새로 뜬 확인창 바깥(배경)에 떨어져
             확인창이 곧바로 닫혀 버렸다 — 「완료취소가 안 눌린다」의 원인. */
        (function () {
            var SKIP = '.stepper button, .mstep button, .bstep button, .lotstep button, .timeedit button, .dateedit button';
            var tapBtn = null, tx = 0, ty = 0, lastTap = 0;
            window.addEventListener('pointerdown', function (e) {
                tapBtn = null;
                if (e.pointerType === 'mouse') return;          // 마우스는 click 이 정상 동작
                var b = e.target && e.target.closest ? e.target.closest('button') : null;
                if (!b || b.disabled || b.closest(SKIP)) return;
                tapBtn = b; tx = e.clientX; ty = e.clientY;
            }, true);
            window.addEventListener('pointerup', function (e) {
                var b = tapBtn;
                tapBtn = null;
                if (!b || b.disabled || !b.isConnected) return;
                if (Math.abs(e.clientX - tx) > 10 || Math.abs(e.clientY - ty) > 10) return;
                var hit = document.elementFromPoint(e.clientX, e.clientY);
                if (!hit || !b.contains(hit)) return;
                lastTap = Date.now();
                b.click();                                      // 합성 click (isTrusted:false)
            }, true);
            window.addEventListener('pointercancel', function () { tapBtn = null; }, true);
            window.addEventListener('click', function (e) {
                if (e.isTrusted && Date.now() - lastTap < 700) {
                    e.stopPropagation();
                    e.preventDefault();
                }
            }, true);
        })();
    </script>
</th:block>
</html>
