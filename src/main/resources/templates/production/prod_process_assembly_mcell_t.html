<html layout:decorate="~{layout_page}">

<th:block layout:fragment="content">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"/>
    <style>

        :root{--bg:#E9EEF1;--surface:#FFF;--surface-2:#F4F7F9;--ink:#15222B;--ink-2:#5A6B76;--line:#D8E0E5;
            --teal:#0E7C86;--teal-d:#0A5C64;--teal-bg:#E2F1F2;--green:#1E9D58;--green-bg:#E4F4EA;
            --amber:#C77A00;--amber-bg:#FBEFD8;--red:#C8483B;--red-bg:#F7E4E1;--purple:#6D3BD1;--purple-bg:#EDE6FB;
            --r:18px;--tap:60px;--shadow:0 1px 0 rgba(21,34,43,.04),0 8px 24px -16px rgba(21,34,43,.28)}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        .ms-wash-root{font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif;color:var(--ink);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;flex:1 1 auto;min-height:0;height:var(--wash-h,100%);max-height:var(--wash-h,none);display:flex;flex-direction:column}
        .ms-wash-root .app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-radius:12px;overflow:hidden}
        .screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}.screen.hide{display:none}

        /* A. 작업지시(수주) 큐 */
        .wrap{padding:22px 20px 28px;max-width:1180px;margin:0 auto;width:100%;overflow:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
        .qhead{display:flex;align-items:baseline;gap:12px;margin:2px 2px 18px}
        .qhead h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0}
        .qhead .cnt{color:var(--ink-2);font-weight:700}
        .qfilter{display:flex;gap:8px;margin-left:auto}
        .qfilter button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:700;font-size:15px;cursor:pointer}
        .qfilter button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
        .searchbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
        .searchbar .slab{font-weight:800;color:var(--ink-2);font-size:14px}
        .searchbar .tilde{font-weight:800;color:var(--ink-2)}
        .dinput{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;font-weight:700;color:var(--ink);background:var(--surface-2);font-variant-numeric:tabular-nums;min-width:150px}
        .sbtn{height:48px;padding:0 22px;border:none;border-radius:12px;background:var(--teal);color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-left:auto}
        .sbtn:active{background:var(--teal-d)}
        .qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
        .wo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease;position:relative;overflow:hidden}
        .wo:active{transform:scale(.985)}
        .wo .edge{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
        .wo[data-st="working"] .edge{background:var(--teal)}.wo[data-st="wait"] .edge{background:var(--amber)}.wo[data-st="done"] .edge{background:var(--green)}
        .wo .row1{display:flex;align-items:center;gap:10px;margin-bottom:8px}
        .wo .wono{font-weight:800;font-size:15px;color:var(--ink-2)}
        .modeltag{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px}
        .modeltag.dom{background:var(--teal-bg);color:var(--teal-d)}.modeltag.exp{background:var(--purple-bg);color:var(--purple)}
        .modeltag.mod{background:var(--amber-bg);color:var(--amber)}
        .chip{margin-left:auto;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:800}
        .chip.working{background:var(--teal-bg);color:var(--teal-d)}.chip.wait{background:var(--amber-bg);color:var(--amber)}.chip.done{background:var(--green-bg);color:var(--green)}
        .wo .name{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.3;margin:2px 0 4px}
        .wo .code{font-size:13px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:14px}
        .wo .meta{display:flex;gap:18px;align-items:flex-end}
        .wo .meta .blk{display:flex;flex-direction:column;gap:2px}
        .wo .meta .lab{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .wo .meta .val{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
        .wo .meta .val.left{color:var(--teal-d)}
        .wo .prog{margin-left:auto;text-align:right}
        .wo .bar{height:8px;width:120px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:6px}
        .wo .bar>i{display:block;height:100%;background:var(--teal);border-radius:999px}
        .wo .rejdot{background:var(--red);color:#fff;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px}

        /* 공통 상단바(B,C) */
        .topbar2{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);z-index:2}
        .back{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;font-size:22px;flex:0 0 auto}
        .back:active{background:var(--line)}
        .htitle{min-width:0;flex:1}
        .htitle .t{font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .htitle .s{font-size:13.5px;color:var(--ink-2);font-weight:700;margin-top:1px}
        .infopill{display:flex;gap:7px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
        .infopill b{color:var(--ink);font-variant-numeric:tabular-nums}.infopill.big b{color:var(--teal-d);font-size:16px}
        .col-stack{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;height:100%}
        .bscroll{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px}
        .bgrid{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
        .secline{display:flex;align-items:center;gap:10px;margin:6px 2px 0;color:var(--ink-2);font-weight:800;font-size:14px}
        .secline .ln{flex:1;height:1px;background:var(--line)}

        /* B. 유닛 그리드 */
        .ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
        .unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .12s}
        .unit:active{transform:scale(.98)}
        .unit .edge{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--amber)}
        .unit[data-st="assembling"] .edge{background:var(--teal)}.unit[data-st="inspect_wait"] .edge{background:var(--purple)}.unit[data-st="reject"] .edge{background:var(--red)}.unit[data-st="pass"] .edge{background:var(--green)}
        .unit .un{font-size:17px;font-weight:800}
        .unit .lot{font-size:12.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px;min-height:16px}
        .unit .row{display:flex;align-items:center;gap:8px;margin-top:10px}
        .ubadge{padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:800}
        .ubadge.wait{background:var(--amber-bg);color:var(--amber)}.ubadge.assembling{background:var(--teal-bg);color:var(--teal-d)}.ubadge.inspect_wait{background:var(--purple-bg);color:var(--purple)}.ubadge.reject{background:var(--red-bg);color:var(--red)}.ubadge.pass{background:var(--green-bg);color:var(--green)}
        .unit .ubar{height:7px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:10px}
        .unit .ubar>i{display:block;height:100%;background:var(--teal);border-radius:999px}
        .unit .pct{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}

        /* C. 스텝 트리 */
        .rejban{background:var(--red-bg);border:1px solid var(--red);border-radius:14px;padding:12px 14px;color:var(--red);font-weight:800;font-size:14px;line-height:1.5}
        .rejban .rl{display:block;font-size:12.5px;font-weight:800;opacity:.85;margin-top:4px;color:var(--ink-2)}
        .tierlab{font-size:12px;font-weight:800;color:var(--ink-2);margin:10px 2px 2px;letter-spacing:.03em}
        .step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0;margin-left:calc(var(--ind,0) * 18px)}
        .step .edge{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line);z-index:1}
        .step[data-st="done"] .edge{background:var(--green)}.step[data-st="working"] .edge{background:var(--teal)}.step.avail .edge{background:var(--amber)}
        .step[data-st="working"]{border-color:var(--teal)}
        .step.rework .edge{background:var(--red)}
        .step.rework{border-color:var(--red)}
        .step.locked{background:var(--surface-2)}
        .step.locked .sid{opacity:.55}
        .step.locked .srctog,.step.locked .srctog button{opacity:1}
        .step.replaced{background:var(--surface-2)}
        .step.replaced .sid{opacity:.5}
        .st-badge.repl2{background:#EEF0FF;color:#4A54C9}
        .shead{display:flex;align-items:center;gap:10px;padding:14px 16px 14px 18px;flex-wrap:wrap;min-height:76px}
        .shead .sgap{margin-left:auto}
        .shead .sbtn2+.sbtn2{margin-left:0}
        .caret{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-size:14px;cursor:pointer;flex:0 0 auto;transition:transform .15s}
        .caret.open{transform:rotate(90deg);background:var(--teal-bg);border-color:var(--teal);color:var(--teal-d)}
        .caret.dis{opacity:.4;cursor:default}
        .sid{display:flex;flex-direction:column;min-width:0;flex:1}
        .sid .sn{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.25;overflow-wrap:anywhere}
        .sid .sc{font-size:12.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .lvl{font-size:11px;font-weight:800;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);padding:3px 8px;border-radius:999px;flex:0 0 auto}
        .swho{font-size:12px;font-weight:800;color:var(--green);background:var(--green-bg);padding:4px 10px;border-radius:999px;flex:0 1 auto;min-width:0;font-variant-numeric:tabular-nums}
        .swho.rw{color:var(--red);background:var(--red-bg)}
        .swho.on{color:var(--teal-d);background:var(--teal-bg)}
        .smeta{flex:1 0 100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 0 2px 42px;margin-top:-4px}
        .stime{display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap}
        .stime button{height:32px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
        .stime button:active{background:var(--line)}
        .stime button b{color:var(--teal-d);text-decoration:underline dotted;font-weight:800}
        .lockicon{font-size:12px;font-weight:800;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);padding:4px 10px;border-radius:999px}
        .st-badge{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800;flex:0 0 auto}
        .st-badge.wait{background:var(--amber-bg);color:var(--amber)}.st-badge.done{background:var(--green-bg);color:var(--green)}
        .st-badge.rw{background:var(--red-bg);color:var(--red)}
        .st-badge.working{background:var(--teal-bg);color:var(--teal-d)}
        .st-badge.working i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:6px;animation:blink 1.2s infinite}
        @keyframes blink{50%{opacity:.25}}
        .sbtn2{height:48px;padding:0 16px;border-radius:14px;border:none;font-weight:800;font-size:15px;cursor:pointer;flex:0 0 auto}
        .sbtn2.done{background:var(--green);color:#fff}.sbtn2.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
        .sbtn2.warn{background:var(--red-bg);color:var(--red);border:1px solid var(--red)}
        .sbtn2.go{background:var(--teal);color:#fff}
        .sbtn2.del{background:var(--surface);color:var(--red);border:1px solid var(--line);padding:0 14px}
        .sbom{border-top:1px dashed var(--line);background:var(--surface-2);padding:12px 16px 14px 24px;display:none}
        .sbom.open{display:block}
        .srctog{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:0 0 auto}
        .srctog button{height:38px;padding:0 12px;border:none;background:var(--surface);color:var(--ink-2);font-weight:800;font-size:13px;cursor:pointer}
        .srctog button.on{background:var(--teal);color:#fff}
        .st-badge.stock{background:#EEF0FF;color:#4A54C9}
        .step.stock .edge{background:#6D7BE0}
        .stockbody{padding:12px 16px 14px 24px;background:var(--surface-2);border-top:1px dashed var(--line)}
        .wlot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid #6D7BE0;background:#EEF0FF;border-radius:14px;padding:12px 14px}
        .wlot .wl{flex:1;min-width:0}
        .wlot .wlt{font-size:12px;font-weight:800;color:#4A54C9}
        .wlot .wll{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .wlot .wlm{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .wlot .wchg{height:44px;padding:0 16px;border-radius:12px;border:1px solid #6D7BE0;background:var(--surface);color:#4A54C9;font-weight:800;font-size:14px;cursor:pointer;flex:0 0 auto}
        .wlot .wchg:disabled{opacity:.4;cursor:default}
        .skiptog{margin-top:10px;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink-2);font-weight:800;font-size:13px}
        .skiptog .caret{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;transition:transform .15s}
        .skiptog .caret.open{transform:rotate(90deg);background:#EEF0FF;border-color:#6D7BE0;color:#4A54C9}
        .skipbox{display:none;margin-top:8px;border:1px dashed var(--line);border-radius:12px;overflow:hidden}
        .skipbox.open{display:block}
        .skiprow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);opacity:.7;font-size:13.5px}
        .skiprow:last-child{border-bottom:none}
        .skiprow b{font-weight:800}.skiprow .pc{color:var(--ink-2);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
        .skiprow .lvl2{font-size:11px;font-weight:800;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
        .skiprow .repl{margin-left:auto;font-size:11px;font-weight:800;color:#4A54C9;background:#EEF0FF;border-radius:999px;padding:2px 8px}
        .prow .fifo{font-size:11px;font-weight:800;color:var(--teal-d);background:var(--surface);border:1px solid var(--teal);border-radius:999px;padding:2px 8px}
        .bhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--ink-2);font-weight:800;font-size:13px}
        .bhead .ln{flex:1;height:1px;background:var(--line)}
        .baddbtn{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--teal);background:var(--teal-bg);color:var(--teal-d);font-weight:800;font-size:13px;cursor:pointer}
        .asmtag{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800;flex:0 0 auto;margin-right:6px}
        .asmtag.ok{background:var(--green-bg);color:var(--green)}
        .asmtag.no{background:var(--amber-bg);color:var(--amber)}
        .asmtag.stk{background:#EEF0FF;color:#4A54C9}
        .brow.asm{background:var(--surface-2)}
        .subasm{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:8px;border:1px dashed var(--line);border-radius:12px;background:var(--surface);font-size:13px;font-weight:700;color:var(--ink-2)}
        .subasm b{color:var(--ink)}
        .subasm .ok{color:var(--green)}.subasm .no{color:var(--amber)}
        .brow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
        /* ★ 투입 로트 · 주요자재 S/N */
        .lotchip{display:inline-flex;align-items:center;gap:4px;margin-left:4px;padding:2px 8px;border-radius:8px;border:1px solid var(--line);
            background:var(--surface);font-size:11.5px;font-weight:800;color:var(--ink-2);cursor:pointer;vertical-align:middle}
        .lotchip.set{border-color:var(--teal);color:var(--teal-d);background:var(--teal-bg)}
        .lotchip.ro{cursor:default}
        .snbtn{height:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:800;color:var(--ink-2);cursor:pointer;flex:0 0 auto}
        .snbtn.on{border-color:var(--teal);color:var(--teal-d);background:var(--teal-bg)}
        .snbox{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px}
        .snbox label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink-2)}
        .snbox input{width:190px;height:40px;border-radius:10px;border:1.5px solid var(--line);padding:0 10px;font-size:14px;font-weight:800;
            font-family:inherit;font-variant-numeric:tabular-nums;background:#FFFDF4}
        .snbox input.ok{border-color:var(--green);background:var(--green-bg)}
        .snbox input:focus{outline:none;border-color:var(--teal)}
        /* ★ 프로그램 다운로드 카드 */
        .dlcard .sbom{display:block}
        .dlrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
        .dlrow:last-of-type{border-bottom:none}
        .dlrow .bid{flex:1;min-width:0}
        .dlrow .bn{font-size:15px;font-weight:800}
        .dlrow .bc{font-size:12px;color:var(--ink-2);font-weight:700}
        .dlrow input{width:230px;height:44px;border-radius:10px;border:1.5px solid var(--line);padding:0 12px;font-size:15px;font-weight:800;
            font-family:inherit;font-variant-numeric:tabular-nums;background:#FFFDF4}
        .dlrow input.ok{border-color:var(--green);background:var(--green-bg)}
        .dlrow input:disabled{opacity:.8}
        .dlwarn{margin:6px 0 2px;padding:8px 12px;border-radius:10px;background:var(--red-bg);color:var(--red);font-size:13px;font-weight:800}.brow:last-child{border-bottom:none}
        .brow .bid{flex:1;min-width:0}.brow .bn{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .brow .bc{font-size:12px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
        .autotag{font-size:11px;font-weight:800;color:var(--ink-2);padding:2px 6px;border-radius:6px;background:var(--surface)}
        .bstep{display:flex;align-items:center;flex:0 0 auto}
        .bstep button{width:40px;height:44px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer;display:grid;place-items:center}
        .bstep button:active{background:var(--line)}.bstep button.minus{border-radius:12px 0 0 12px}.bstep button.plus{border-radius:0 12px 12px 0}
        .bstep .bq{width:66px;height:44px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#FFFDF4;text-align:center;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;display:grid;place-items:center;cursor:pointer}
        .bstep .bq.auto{background:var(--surface)}
        .brm{width:40px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--red);font-size:16px;cursor:pointer;flex:0 0 auto}

        .actionbar{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;box-shadow:0 -8px 24px -18px rgba(21,34,43,.4)}
        .actionbar .actsum{display:flex;flex-direction:column;margin-right:auto}
        .actionbar .actsum .l{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .actionbar .actsum .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}

        /* ── 높이 자동 맞춤 ── */
        (function () {
            const root = document.querySelector('.ms-wash-root'); if (!root) return;
            function localBelow() {
                let below = 0, node = root;
                while (node && node !== document.body) { let sib = node.nextElementSibling;
                    while (sib) { const r = sib.getBoundingClientRect(); if (r.height > 0 && getComputedStyle(sib).position !== 'fixed') below += r.height; sib = sib.nextElementSibling; }
                    node = node.parentElement; }
                let fx = 0;
                document.querySelectorAll('body *').forEach(el => { if (root.contains(el)) return; const cs = getComputedStyle(el);
                    if (cs.position !== 'fixed' && cs.position !== 'sticky') return; const r = el.getBoundingClientRect();
                    if (r.height > 0 && r.height < innerHeight * 0.5 && r.bottom > innerHeight - 2) fx = Math.max(fx, r.height); });
                return Math.max(below, fx);
            }
            function availBottom() {
                let bottom = window.innerHeight;
                try { const fe = window.frameElement;
                    if (fe) { const pWin = window.parent, pDoc = pWin.document; const feTop = fe.getBoundingClientRect().top;
                        let flow = 0, node = fe;
                        while (node && node !== pDoc.body) { let sib = node.nextElementSibling;
                            while (sib) { const cs = pWin.getComputedStyle(sib), r = sib.getBoundingClientRect(); if (r.height > 0 && cs.position !== 'fixed' && cs.position !== 'absolute') flow += r.height; sib = sib.nextElementSibling; }
                            node = node.parentElement; }
                        let fx = 0;
                        pDoc.querySelectorAll('body *').forEach(el => { if (el === fe || el.contains(fe)) return; const cs = pWin.getComputedStyle(el);
                            if (cs.position !== 'fixed' && cs.position !== 'sticky' && cs.position !== 'absolute') return; const r = el.getBoundingClientRect();
                            if (r.height > 0 && r.height <= 160 && r.top > feTop && r.bottom > pWin.innerHeight - 40) fx = Math.max(fx, r.bottom - r.top); });
                        bottom = Math.min(bottom, (pWin.innerHeight - Math.max(flow, fx)) - feTop); } } catch (e) {}
                return bottom;
            }
            function fit() { const top = root.getBoundingClientRect().top; const avail = availBottom() - top - localBelow(); root.style.setProperty('--wash-h', Math.max(320, Math.floor(avail)) + 'px'); }
            window.addEventListener('resize', fit); window.addEventListener('orientationchange', fit);
            try { window.parent.addEventListener('resize', fit); } catch (e) {}
            fit(); requestAnimationFrame(fit); setTimeout(fit, 200); setTimeout(fit, 600);
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

            /* 탭을 두 개 이상 열면 이 iframe 이 display:none 으로 숨는다.
               숨은 상태에서 잰 좌표는 전부 0 이라 avail 이 음수가 되고,
               하한선인 320px 이 그대로 굳어 화면이 잘린 것처럼 보인다.
               (리사이즈 전까지 다시 잴 계기가 없었다)

            if (window.IntersectionObserver) {

            }
            document.addEventListener('visibilitychange', function () {
                if (!document.hidden) fit();
            });
        })();

        /* 조용한 POST — 로딩 딤 없이 보낸다.
           AjaxUtil.postAsyncData 는 호출마다 showLoading() 으로 전체화면 로더를 띄운다.
           수량 +/- 처럼 초당 여러 번 나가는 저장에 쓰면 화면이 계속 깜빡인다.
           $.ajax 를 직접 쓰되 AjaxUtil 이 붙여 주던 _csrf · spjangcd 는 같이 보낸다. */
        function apiPostSilent(path, params) {
            const body = clean(params);
            body._csrf = $('[name=_csrf]').val();
            body.spjangcd = sessionStorage.getItem('spjangcd');
            return Promise.resolve($.ajax({
                url: BASE + path, type: 'POST', dataType: 'json', data: body
            }));
        }

        /* 투입자재 편집분 즉시 저장.
           완료 버튼을 눌러야 반영되던 예전 방식은 화면을 벗어나면 편집이 사라졌다.
           하위 어셈블리 행은 스텝이 따로 관리하므로 저장 대상에서 뺀다. */
        const _saveT = {};
        function saveStepMats(i) {
            const s = stepIdx(i);
            if (!s || s.state === 'done') return;
            const bom = (s.mats || []).filter(r => r.is_assembly !== 'Y')
                .map(r => ({matId: r.mat_id, qty: bomQ(r), lotId: r.lot_id || ''}));
            clearTimeout(_saveT[i]);
            _saveT[i] = setTimeout(function () {
                apiPostSilent('/step_mat_save', {step_id: s.step_id, bom_json: JSON.stringify(bom)})
                    .then(function (r) { if (r && r.success === false) flash(r.message || '투입자재 저장 실패'); })
                    .catch(function () { flash('투입자재 저장 실패'); });
            }, 250);
        }

        /* 수량만 제자리 갱신 (전체 재렌더 방지 — caret 회전이 다시 재생된다) */
        function syncMatRow(i, bi) {
            const r = stepIdx(i).mats[bi];
            const q = document.querySelector('[data-pad="' + i + ',' + bi + '"]');
            if (!q) { renderUnit(); openStep(i); return; }
            q.textContent = bomQ(r);
            q.classList.remove('auto');
            const row = q.closest('.bitem') || q.parentElement.parentElement;
            const tag = row ? row.querySelector('.autotag') : null;
            if (tag) tag.textContent = '수정';
        }

        /* 공용 콤보 — /api/common/combo (반환: [{value, text}]) */
        function combo(comboType, cond1, cond2, cond3) {
            if (typeof AjaxUtil === 'undefined' || !AjaxUtil.getSyncData) return [];
            const r = AjaxUtil.getSyncData('/api/common/combo', {
                combo_type: comboType, cond1: cond1 || '', cond2: cond2 || '', cond3: cond3 || ''
            }) || {};
            return (r.data || []).map(x => ({value: x.value, text: x.text, code: x.Code || '',
                factory: String(x.Factory_id || x.factory_id || '')}));
        }
        /* 작업 중에 다른 사람이(또는 다른 탭에서) 이 작지를 지울 수 있다.
           그러면 스텝 조회는 「스텝을 찾을 수 없습니다」로 실패하고,
           새로고침하면 유닛이 0건이라 빈 화면만 남는다 — 아무것도 할 수 없는데
           화면에 갇혀 있게 된다.
           작지가 실제로 사라졌는지 확인하고, 사라졌으면 알려 주고 목록으로 보낸다.
           ※ 유닛이 0건이라고 바로 내보내면 안 된다 — 아직 unit_init 이 돌지 않은
             «정상» 상태도 0건이기 때문이다. 판단 기준은 «작지의 존재» 다. */
        function orderGone(jobResId) {
            if (!jobResId) return false;
            try {
                const rows = apiGet('/wo_queue', {
                    process_id: PROC_ID,
                    date_from: document.getElementById('dFrom').value,
                    date_to:   document.getElementById('dTo').value,
                    spjangcd:  CTX.spjangcd
                }) || [];
                return !rows.some(o => +o.job_res_id === +jobResId);
            } catch (e) {
                return false;   // 조회 자체가 실패한 것은 «없어졌다» 와 다르다
            }
        }

        /* 삭제된 작지였으면 목록으로 되돌리고 true 를 준다. */
        async function bailIfGone(jobResId) {
            if (!orderGone(jobResId)) return false;
            flash('이 작업지시는 삭제되었습니다. 목록으로 돌아갑니다.');
            /* curO 를 먼저 비운다 — renderQueue 도 guard 를 타는데,
               거기서 또 실패하면 bailIfGone 이 다시 불려 서로를 부르게 된다. */
            curO = null; curU = null;
            await renderQueue();
            show('A');
            return true;
        }

        async function guard(fn) {
            try { busy(true); return await fn(); }
            catch (e) {
                const msg = e.message || String(e);
                /* 「스텝을 찾을 수 없습니다」 같은 실패는 작지가 통째로 사라졌을 때도 난다.
                   그 경우 같은 오류를 계속 띄우기보다 목록으로 보내는 편이 낫다. */
                if (/찾을 수 없/.test(msg) && curO && await bailIfGone(curO.job_res_id)) return;
                flash(msg); console.error('[mcell]', e);
            }
            finally { busy(false); }
        }
        let busyN = 0;
        function busy(on) {
            busyN = Math.max(0, busyN + (on ? 1 : -1));
            document.body.style.cursor = busyN ? 'progress' : '';
        }

        /* ── 기준 데이터 (서버 로드) ── */
        let WORKERS = [];   // {actor_id, actor_name}
        /* 설비가 하나뿐이면 고를 것이 없다. 화면이 열릴 때 그 하나를 눌러 둔다.
           기존 클릭 핸들러를 그대로 쓰므로 선택 표시·확인버튼 활성화가 함께 처리된다.
           이미 고른 것이 있으면 건드리지 않는다. */
        function autoPickSingleEquip() {
            var box = document.getElementById('equipOpts');
            if (!box) return;
            var opts = box.querySelectorAll('.opt');
            if (opts.length !== 1) return;
            if (box.querySelector('.opt.sel')) return;
            opts[0].click();
        }

        let EQUIPS = [];    // {equipment_id, equipment_code, equipment_name}
        const UST = {wait: '조립대기', assembling: '조립중', inspect_wait: '검사대기', reject: '재작업', pass: '합격', packed: '포장완료'};

        function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
        function hhmm() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
        function nowFull() { return todayStr() + ' ' + hhmm(); }
        function shortT(v) { return v ? v.slice(5).replace('-', '.') : ''; }
        const WD = ['일', '월', '화', '수', '목', '금', '토'];
        function unitName(u) { return u.serial_no || ('SN-' + String(u.unit_no).padStart(3, '0')); }
        function bomQ(row) { return row.manual ? (row.qty || 0) : row.default_qty; }
        function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }

        /* ── 상태 ── */
        let ORDERS = [], curO = null, UNITS = [], curU = null, STEPS = [], filt = 'all';

        /* ══════════ A 화면 : 작업지시 큐 ══════════ */
        function inRange() { /* 서버에서 필터 */ }
        async function renderQueue() {
            await guard(async () => {
                const f = document.getElementById('dFrom').value, t = document.getElementById('dTo').value;
                ORDERS = await apiGet('/wo_queue', {
                    process_id: PROC_ID, date_from: f, date_to: t, spjangcd: CTX.spjangcd
                }) || [];
                drawQueue();
            });
        }
        function drawQueue() {
            const list = ORDERS.filter(o => filt === 'all' ? 1
                : filt === 'reject' ? (o.reject_cnt > 0) : (o.state === filt));
            document.getElementById('qcnt').textContent = list.length + '건';
            document.getElementById('qgrid').innerHTML = list.map(o => {
                const plan = +o.plan_qty || 0, d = +o.done_cnt || 0, rj = +o.reject_cnt || 0;
                const pct = plan ? Math.round(d / plan * 100) : 0;
                return '<div class="wo" data-st="' + o.state + '" data-id="' + o.job_res_id + '"><div class="edge"></div>' +
                    '<div class="row1"><span class="wono">' + esc(o.order_num || ('WO-' + o.job_res_id)) + '</span>' +
                    '<span class="modeltag dom">' + esc(o.mat_code) + '</span>' +
                    (rj ? '<span class="rejdot">재작업 ' + rj + '</span>' : '') +
                    '<span class="chip ' + o.state + '">' + (o.state === 'done' ? '완료' : o.state === 'working' ? '작업중' : '대기') + '</span></div>' +
                    '<div class="name">' + esc(o.mat_name) + '</div><div class="code">' + esc(o.plan_date || '') + '</div>' +
                    '<div class="meta"><div class="blk"><span class="lab">계획</span><span class="val">' + plan + '</span></div>' +
                    '<div class="blk"><span class="lab">조립완료</span><span class="val left">' + d + '</span></div>' +
                    '<div class="prog"><span class="lab">진행률 ' + pct + '%</span><div class="bar"><i style="width:' + pct + '%"></i></div></div></div></div>';
            }).join('') || '<div style="grid-column:1/-1;text-align:center;color:var(--ink-2);font-weight:700;padding:40px">해당 조건의 생산계획이 없습니다.</div>';
        }
        document.getElementById('qgrid').addEventListener('click', e => {
            const c = e.target.closest('.wo'); if (c) openOrder(+c.dataset.id);
        });
        document.querySelectorAll('.qfilter button').forEach(b => b.addEventListener('click', () => {
            document.querySelectorAll('.qfilter button').forEach(x => x.classList.remove('on'));
            b.classList.add('on'); filt = b.dataset.f; drawQueue();
        }));
        document.getElementById('btnSearch').addEventListener('click', renderQueue);
        (function initDates() {
            const t = new Date(), f = new Date(); f.setDate(f.getDate() - 7);
            const fmt = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            document.getElementById('dFrom').value = fmt(f); document.getElementById('dTo').value = fmt(t);
        })();

        /* ── 화면 전환 ── */
        const SC = {A: document.getElementById('scA'), B: document.getElementById('scB'), C: document.getElementById('scC')};
        function show(k) { for (const x in SC) SC[x].classList.toggle('hide', x !== k); }
        document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => {
            const t = b.dataset.back;
            if (t === 'A') { renderQueue(); show('A'); }
            if (t === 'B') { renderUnits().then(() => show('B')); }
        }));

        /* ══════════ B 화면 : 유닛 목록 ══════════ */
        async function openOrder(jobResId) {
            await guard(async () => {
                curO = ORDERS.find(o => +o.job_res_id === +jobResId);
                /* 작지 진입 시 유닛 N개 + 스텝 트리 생성 (멱등) */
                await apiPost('/unit_init', {job_res_id: jobResId, spjangcd: CTX.spjangcd});
                await renderUnits();
                show('B');
            });
        }
        async function renderUnits() {
            if (!curO) return;
            UNITS = await apiGet('/unit_list', {job_res_id: curO.job_res_id}) || [];
            /* 유닛이 0건이면 작지가 지워졌는지 확인한다(살아 있으면 그대로 진행). */
            if (!UNITS.length && await bailIfGone(curO.job_res_id)) return;
            const doneN = UNITS.filter(u => ['inspect_wait', 'pass', 'packed'].includes(u.state)).length;
            document.getElementById('bName').textContent = curO.mat_name || '';
            document.getElementById('bSub').textContent = (curO.order_num || '') + ' · ' + (curO.mat_code || '') + ' · 계획 ' + curO.plan_qty + '대';
            document.getElementById('bDone').textContent = doneN + ' / ' + curO.plan_qty;
            document.getElementById('uCnt').textContent = UNITS.length + '대';
            document.getElementById('uGrid').innerHTML = UNITS.map((u, i) => {
                const tot = +u.step_total || 0, dn = +u.step_done || 0;
                const pct = tot ? Math.round(dn / tot * 100) : 0;
                return '<div class="unit" data-st="' + u.state + '" data-i="' + i + '"><div class="edge"></div>' +
                    '<div class="un">' + unitName(u) + '</div>' +
                    '<div class="lot">' + esc(u.lot_number || '로트 미발번') + '</div>' +
                    '<div class="row"><span class="ubadge ' + u.state + '">' + (UST[u.state] || u.state) + '</span>' +
                    '<span class="pct">' + dn + '/' + tot + ' 레벨</span></div>' +
                    (u.start_time ? '<div class="utime"><span>시작 <b>' + esc(u.start_time) + '</b></span>' +
                        (u.end_time ? '<span>완료 <b>' + esc(u.end_time) + '</b></span>' : '') + '</div>' : '') +
                    '<div class="ubar"><i style="width:' + pct + '%"></i></div></div>';
            }).join('');
        }
        document.getElementById('uGrid').addEventListener('click', e => {
            const c = e.target.closest('.unit'); if (c) openUnit(+c.dataset.i);
        });

        /* ══════════ C 화면 : 스텝 트리 ══════════ */
        async function openUnit(i) {
            await guard(async () => {
                curU = UNITS[i];
                const sc = document.getElementById('cGrid').closest('.bscroll'); if (sc) sc.scrollTop = 0;
                await loadSteps();
                show('C');
            });
        }
        async function loadSteps() {
            STEPS = await apiGet('/step_list', {unit_id: curU.unit_id}) || [];
            STEPS.forEach(s => { s.mats = null; });   // 투입자재는 펼칠 때 지연 로드
            loadDl();
            renderUnit();
        }
        function stepIdx(i) { return STEPS[i]; }

        /* ══════════ ★ 프로그램 다운로드 — 모든 조립의 첫 작업 ══════════
           보드 S/N 은 유닛 단위 기록이라, 나중에 그 보드를 투입하는 어셈블리 스텝에도 같은 값이 보인다. */
        let DL = null;
        function loadDl() {
            try { DL = apiGet('/dl_detail', {unit_id: curU.unit_id}) || null; } catch (e) { DL = null; }
        }
        function dlDone() { return !DL || DL.state === 'done'; }   // 조회 실패 시 막지 않는다(서버가 최종 판단)
        function dlCard() {
            if (!DL) return '';
            const st = DL.state || 'wait', done = st === 'done', working = st === 'working';
            const badge = done ? '<span class="st-badge done">완료</span>'
                : working ? '<span class="st-badge working"><i></i>작업중</span>' : '<span class="st-badge wait">대기</span>';
            let btn = '';
            if (done) btn = '<button class="sbtn2 ghost" data-dlcancel>완료취소</button>';
            else if (working) btn = '<button class="sbtn2 done" data-dldone>다운로드 완료</button>';
            else btn = '<button class="sbtn2 go" data-dlgo>작업 시작</button>';
            const tchips = DL.start_time ? '<span class="stime">' +
                '<button data-dltime="start">시작 <b>' + shortT(DL.start_time) + '</b></button>' +
                (DL.end_time ? '<button data-dltime="end">완료 <b>' + shortT(DL.end_time) + '</b></button>' : '') + '</span>' : '';
            const who = DL.actor_name ? '<span class="sc">' + esc(DL.actor_name) + '</span>' : '';
            const boards = DL.boards || [];
            const rows = boards.map((b, bi) => {
                const chg = '<button class="dlchg" data-dlslot="' + (bi + 1) + '">' + (b.mat_id ? '변경' : '지정') + '</button>';
                if (!b.mat_id) return '<div class="dlrow"><div class="bid"><div class="bn">' + esc(b.slot_name) + '</div>' +
                    '<div class="bc" style="color:#c0392b">이 제품 BOM 에서 못 찾음 · «지정» 으로 고르세요</div></div>' + chg + '</div>';
                const v = b.serial_no || '';
                return '<div class="dlrow"><div class="bid"><div class="bn">' + esc(b.slot_name) + (b.fixed === 'Y' ? ' <span class="dlfix">지정</span>' : '') + '</div>' +
                    '<div class="bc">' + esc(b.mat_code || '') + ' · ' + esc(b.mat_name || '') + '</div></div>' + chg +
                    '<input data-dlsn="' + b.mat_id + '" value="' + esc(v) + '" class="' + (v ? 'ok' : '') +
                    '" placeholder="S/N 입력" autocomplete="off" autocapitalize="characters"' + (st === 'wait' ? ' disabled' : '') + '></div>';
            }).join('');
            return '<div class="tierlab">첫 작업 · 프로그램 다운로드</div>' +
                '<div class="step dlcard' + (done ? '' : ' avail') + '" data-st="' + st + '" style="--ind:0;--gd:none"><div class="edge"></div>' +
                '<div class="shead"><span class="lvl">PD</span>' +
                '<div class="sid"><div class="sn">Program Download</div><div class="sc">보드 프로그램 다운로드 · S/N 기록 · 재고 이동 없음</div></div>' +
                badge + '<span class="sgap"></span>' + btn +
                ((who || tchips) ? '<div class="smeta">' + who + tchips + '</div>' : '') + '</div>' +
                '<div class="sbom open">' +
                (DL.changed_yn === 'Y' ? '<div class="dlwarn">⚠ 다운로드 «완료» 때와 보드 S/N 이 다릅니다 : ' + esc((DL.changed_list || []).join(', ')) +
                    '<br>입력 실수면 S/N 을 원래대로 고치면 사라집니다. 보드를 실제로 바꿨다면 새 보드에 프로그램을 받고 «완료취소» → «다운로드 완료» 를 다시 눌러 주세요.</div>' : '') +
                '<div class="bhead">보드 S/N <span class="ln"></span>' + '' + '</div>' +
                rows + (st === 'wait' ? '<div style="color:var(--ink-2);font-size:12.5px;font-weight:700;padding-top:6px">작업을 시작하면 S/N 을 입력할 수 있습니다.</div>' : '') +
                '</div></div>';
        }
        async function dlRefresh() { loadDl(); renderUnit(); }
        /* ★ 보드 칸 변경 — 이 제품 BOM 자재 중에서 고른다. 모델 단위로 저장(같은 모델 전체 적용).
             배포 없이 현장에서 «이 보드 말고 저 보드» 를 바꿀 수 있게. */
        function openDlSlot(slot) {
            const cands = apiGet('/dl_slot_cands', {unit_id: curU.unit_id}) || [];
            const name = ['메인보드', 'RT 보드', 'LCD 보드'][slot - 1];
            const m = document.createElement('div');
            m.className = 'snmask';
            let kw = '';
            const draw = () => {
                const k = kw.toLowerCase();
                const list = cands.filter(c => !k || (c.mat_name || '').toLowerCase().includes(k) || (c.mat_code || '').toLowerCase().includes(k));
                m.innerHTML = '<div class="snsheet" style="width:min(560px,94vw)"><b>' + esc(name) + ' 자재 지정</b>' +
                    '<div class="snhint">이 제품 BOM 의 자재 중에서 고르세요. 같은 모델 전체에 적용됩니다.</div>' +
                    '<input id="dlsKw" value="' + esc(kw) + '" placeholder="품목코드 / 품명 검색" autocomplete="off">' +
                    '<div style="max-height:46dvh;overflow:auto;display:flex;flex-direction:column;gap:6px">' + list.map(c =>
                        '<button class="dlpick" data-dlpick="' + c.mat_id + '"><b>' + esc(c.mat_name) + '</b><span>' + esc(c.mat_code) +
                        (c.sn_yn === 'Y' ? ' · S/N 대상' : '') + '</span></button>').join('') +
                    (list.length ? '' : '<div class="snhint">검색 결과가 없습니다.</div>') + '</div>' +
                    '<div class="snbtns"><button data-dlsx>취소</button><button data-dlsauto>자동(품명)으로</button></div></div>';
                const inp = m.querySelector('#dlsKw');
                inp.addEventListener('input', e => { kw = e.target.value; const pos = e.target.selectionStart; draw(); const n = m.querySelector('#dlsKw'); n.focus(); n.setSelectionRange(pos, pos); });
            };
            draw();
            document.body.appendChild(m);
            const save = matId => guard(async () => {
                await apiPost('/dl_slot_save', {unit_id: curU.unit_id, slot: slot, mat_id: matId == null ? '' : matId});
                m.remove(); dlRefresh();
            });
            m.addEventListener('click', e => {
                if (e.target === m || e.target.closest('[data-dlsx]')) { m.remove(); return; }
                if (e.target.closest('[data-dlsauto]')) { save(null); return; }
                const p = e.target.closest('[data-dlpick]');
                if (p) save(+p.dataset.dlpick);
            });
        }
        function stepByMat(matId) { return STEPS.find(s => +s.mat_id === +matId); }
        function assetOf(code) { return (code || '').startsWith('WIP-MC') ? '반제품 (검사대상)' : '반제품 모듈'; }

        function unitProg() {
            const act = STEPS.filter(s => !s.skipped);
            const done = act.filter(s => s.state === 'done' || (s.source === 'stock' && s.stock_lot_id)).length;
            return {done, total: act.length, pct: act.length ? Math.round(done / act.length * 100) : 0};
        }
        function allStepsDone() { const p = unitProg(); return p.total > 0 && p.done === p.total; }

        /* ★ 제품 번호(임시 SN-001) 수정 — 로트번호는 그대로, 표시·문서용 번호만 */
        document.getElementById('cUnit').addEventListener('click', () => {
            if (!curU) return;
            const tmp = 'SN-' + String(curU.unit_no).padStart(3, '0');
            const m = document.createElement('div');
            m.className = 'snmask';
            m.innerHTML = '<div class="snsheet"><b>제품 번호 수정</b>' +
                '<div class="snhint">임시번호 ' + esc(tmp) + ' · 로트 ' + esc(curU.lot_number || '-') + ' (로트번호는 바뀌지 않습니다)</div>' +
                '<input id="snInp" value="' + esc(curU.serial_no || '') + '" placeholder="' + esc(tmp) + '" autocomplete="off" autocapitalize="characters">' +
                '<div class="snbtns"><button data-snc>취소</button><button data-snr>임시번호로</button><button class="ok" data-sno>저장</button></div></div>';
            document.body.appendChild(m);
            const inp = m.querySelector('#snInp'); inp.focus(); inp.select();
            const save = v => guard(async () => {
                await apiPost('/unit_serial', {unit_id: curU.unit_id, serial_no: v});
                curU.serial_no = v || null;
                const x = UNITS.find(t => +t.unit_id === +curU.unit_id); if (x) x.serial_no = curU.serial_no;
                m.remove(); renderUnit();
            });
            m.addEventListener('click', e => {
                if (e.target === m || e.target.closest('[data-snc]')) { m.remove(); return; }
                if (e.target.closest('[data-snr]')) { save(''); return; }
                if (e.target.closest('[data-sno]')) save(inp.value.trim());
            });
            inp.addEventListener('keydown', e => { if (e.key === 'Enter') save(inp.value.trim()); });
        });

        /* ★ 제조 문서 (제조공정관리 · 공정검사서 — 엑셀/인쇄/첨부) */
        document.getElementById('btnDoc').addEventListener('click', () => {
            if (!curU) return;
            if (typeof McellDoc === 'undefined') { flash('문서 모듈(mcell_doc.js)이 없습니다'); return; }
            McellDoc.open({unitId: curU.unit_id, from: 'assembly'});
        });

        function renderUnit() {
            const u = curU;
            const _sc = document.getElementById('cGrid').closest('.bscroll');
            const _keep = _sc ? _sc.scrollTop : 0;
            document.getElementById('cUnit').textContent = unitName(u) + ' ✎ · ' + (curO.mat_name || '');
            /* 작업자 — 스텝마다 조가 다를 수 있으므로 대표·조원을 전부 모아 중복 제거 */
            const who = [];
            STEPS.forEach(st => {
                stepWho(st).split(',').map(x => x.trim()).filter(Boolean)
                    .forEach(n => { if (!who.includes(n)) who.push(n); });
            });
            document.getElementById('cSub').textContent = (curO.order_num || '') +
                (who.length ? ' · ' + who.join(', ') : '');
            /* 로트는 발번된 뒤에만 — 「발번 전」 칩은 자리만 차지한다 */
            document.getElementById('cLotPill').innerHTML =
                (u.lot_number ? '<span class="infopill"><span>LOT</span><b>' + esc(u.lot_number) + '</b></span>' : '') +
                (u.start_time ? '<span class="tpill"><span>시작</span><b>' + esc(u.start_time) + '</b></span>' : '') +
                (u.end_time ? '<span class="tpill"><span>완료</span><b>' + esc(u.end_time) + '</b></span>' : '');

            let html = '';
            if (u.state === 'reject' && u.reject_reason) {
                html += '<div class="rejban">검사 불합격 복귀' + (u.reject_insp_no ? ' · ' + esc(u.reject_insp_no) : '') +
                    '<span class="rl">사유 : ' + esc(u.reject_reason) + ' · ' + esc(u.reject_at || '') + '</span>' +
                    '<span class="rl">귀책 모듈을 <b>완료취소</b> 후 자재를 교체·가감하고 다시 완료하세요.</span></div>';
            }
            html += dlCard();   // ★ 첫 작업
            let lastDepth = null;
            STEPS.forEach((s, i) => {
                if (s.depth !== lastDepth) {
                    html += '<div class="tierlab">레벨 ' + (s.depth + 1) + ' · ' + assetOf(s.mat_code) + (s.depth === 0 ? ' (최종)' : '') + '</div>';
                    lastDepth = s.depth;
                }
                html += s.skipped ? replacedCard(s, i) : (s.source === 'stock' ? stockCard(s, i) : stepCard(s, i));
            });
            document.getElementById('cGrid').innerHTML = html;
            renderCAction();
            if (_sc) _sc.scrollTop = _keep;
        }

        /* 투입자재 1행 — 하위 어셈블리도 같은 목록에서 상태로 표시 */
        /* ★ 주요자재 S/N — 투입 수량만큼 칸을 만든다. 칸마다 바로 저장(비우면 삭제).
             스텝 완료 뒤에도 고칠 수 있다 — 재고와 무관한 기록이라서. */
        function snCount(r) { return Object.values(r.sns || {}).filter(v => v && String(v).trim()).length; }
        function snBox(r, i, bi) {
            const n = Math.max(1, Math.round(bomQ(r)) || 1);
            let h = '<div class="snbox">';
            for (let k = 1; k <= n; k++) {
                const v = (r.sns || {})[k] || '';
                h += '<label>' + (n > 1 ? '#' + k : 'S/N') +
                    '<input data-sn="' + i + ',' + bi + ',' + k + '" value="' + esc(v) + '" class="' + (v ? 'ok' : '') +
                    '" placeholder="S/N 입력" autocomplete="off" autocapitalize="characters"></label>';
            }
            return h + '</div>';
        }

        function asmRow(r, i, bi, done) {
            const head = '<div class="bid"><div class="bn">' + esc(r.mat_name) + '</div>';
            if (r.is_assembly === 'Y') {
                const ss = stepByMat(r.mat_id);
                const stk = ss && ss.source === 'stock' && ss.stock_lot_id;
                const ok = stk || (ss && ss.state === 'done');
                const cls = stk ? 'stk' : (ok ? 'ok' : 'no');
                const lab = stk ? '재고 투입' : (ok ? '완료' : '미완료');
                const sub = stk ? ('하위 어셈블리 · LOT ' + esc(ss.stock_lot_no || ''))
                    : (ok ? ('하위 어셈블리 · LOT ' + esc(ss.lot_number || ''))
                        : '하위 어셈블리 · 이 레벨을 먼저 완료해야 합니다');
                return '<div class="brow asm">' + head + '<div class="bc">' + esc(r.mat_code) + ' · ' + sub + '</div></div>' +
                    '<span class="asmtag ' + cls + '">' + lab + '</span>' +
                    '<div style="font-weight:800;font-variant-numeric:tabular-nums;padding-right:8px">' + (r.default_qty || 1) + '</div></div>';
            }
            /* ★ 투입 로트 — 기본은 FIFO 자동. 작업자가 실제 꺼낸 로트와 다르면 눌러서 바꾼다.
                 완료된 스텝은 실제로 빠진 로트를 보여준다(바꾸려면 분해 후). */
            const lotChip = done
                ? '<span class="lotchip ro">LOT ' + esc(r.used_lots || '-') + '</span>'
                : '<span class="lotchip' + (r.lot_id ? ' set' : '') + '" data-lot="' + i + ',' + bi + '">LOT ' +
                (r.lot_id ? esc(r.lot_number || ('#' + r.lot_id)) : 'FIFO 자동') + ' ▾</span>';
            const snOpen = r.sn_yn === 'Y' || snCount(r) > 0;   // ★ S/N 관리 체크된 자재만
            const snBtn = !snOpen ? '' : '<button class="snbtn' + (snOpen ? ' on' : '') + '" data-sntog="' + i + ',' + bi + '">S/N' +
                (snCount(r) ? ' ' + snCount(r) + '/' + Math.max(1, Math.round(bomQ(r))) : '') + '</button>';
            return '<div class="brow">' + head +
                '<div class="bc">' + esc(r.mat_code) + ' · 소요 ' + (r.per || 1) +
                (r.manual ? ' <span class="autotag">수정</span>' : ' <span class="autotag">자동</span>') +
                ' · 재고 ' + (r.stock || 0) + ' (' + esc(r.src_store_name || '') + ')' + lotChip + '</div></div>' +
                snBtn +
                (done ? '<div style="font-weight:800;font-variant-numeric:tabular-nums;padding-right:8px">' + bomQ(r) + '</div>' :
                    '<div class="bstep"><button class="minus" data-m="' + i + ',' + bi + ',-1">−</button>' +
                    '<div class="bq ' + (r.manual ? '' : 'auto') + '" data-pad="' + i + ',' + bi + '">' + bomQ(r) + '</div>' +
                    '<button class="plus" data-m="' + i + ',' + bi + ',1">＋</button></div>' +
                    '<button class="brm" data-rm="' + i + ',' + bi + '">✕</button>') +
                (snOpen ? snBox(r, i, bi) : '') + '</div>';
        }

        /* 스텝 1건의 작업자 표시 이름 — 대표 + 조원 전원 (조립 BSC 와 동일 규칙) */
        function stepWho(s) {
            const t = (s.member_names && String(s.member_names).trim()) ? s.member_names : s.actor_name;
            return (t && String(t).trim()) ? String(t).trim() : '';
        }

        function stepCard(s, i) {
            const locked = !!s.locked, done = s.state === 'done', rw = s.rework_yn === 'Y';
            const working = s.state === 'working';
            const canToggle = !done;
            const srcTog = canToggle ? '<span class="srctog"><button class="on" data-src="' + i + ',build">조립</button><button data-src="' + i + ',stock">투입</button></span>' : '';
            const cls = 'step' + (locked ? ' locked' : '') + (!locked && !done ? ' avail' : '') + (rw ? ' rework' : '');
            const badge = rw ? '<span class="st-badge rw">재작업 대상</span>'
                : done ? '<span class="st-badge done">완료</span>'
                    : working ? '<span class="st-badge working"><i></i>작업중</span>'
                        : locked ? '<span class="lockicon">🔒 하위 ' + s.kid_cnt + '개 완료 후</span>'
                            : '<span class="st-badge wait">대기</span>';
            /* 어셈블리마다 조가 다를 수 있다 — 그 스텝의 작업자를 전원 표시한다 */
            const sWho = stepWho(s);
            const whoTxt = sWho ? '<span class="swho' + (rw ? ' rw' : working ? ' on' : '') + '">' + esc(sWho) + (s.equipment_name ? ' · ' + esc(s.equipment_name) : '') + '</span>' : '';
            const tchips = s.start_time ? '<span class="stime">' +
                '<button data-stime="' + i + ',start">시작 <b>' + shortT(s.start_time) + '</b></button>' +
                (s.end_time ? '<button data-stime="' + i + ',end">완료 <b>' + shortT(s.end_time) + '</b></button>' : '') +
                '</span>' : '';
            let btn = '';
            if (done) btn = '<button class="sbtn2 ' + (rw ? 'warn' : 'ghost') + '" data-cancel="' + i + '">분해</button>';
            else if (working) btn = '<button class="sbtn2 del" data-del="' + i + '">작업 삭제</button>' +
                '<button class="sbtn2 done" data-done="' + i + '">' + (s.depth === 0 ? '최종 완료' : '모듈 완료') + '</button>';
            else if (!locked) btn = '<button class="sbtn2 go" data-go="' + i + '">작업 시작</button>';

            const snTag = snBadge(s) + piTag(s);
            const rows = (s.mats == null)
                ? '<div style="color:var(--ink-2);font-weight:700;font-size:14px;padding:6px 0">펼치면 투입자재를 불러옵니다…</div>'
                : (s.mats.map((r, bi) => asmRow(r, i, bi, done)).join('')
                    || '<div style="color:var(--ink-2);font-weight:700;font-size:14px;padding:6px 0">투입자재가 없습니다</div>');

            return '<div class="' + cls + '" data-st="' + s.state + '" style="--ind:' + s.depth + ';--gd:' + (s.depth ? 'block' : 'none') + '"><div class="edge"></div>' +
                '<div class="shead"><button class="caret" data-caret="' + i + '">▶</button>' +
                '<span class="lvl">L' + (s.depth + 1) + '</span>' +
                '<div class="sid"><div class="sn">' + esc(s.mat_name) + '</div><div class="sc">' + esc(s.mat_code) +
                ' · 자재 ' + (s.bom_cnt || 0) + '종' + (s.kid_cnt ? ' · 하위 ' + s.kid_cnt : '') +
                (s.lot_number ? ' · LOT ' + esc(s.lot_number) : '') + snTag + '</div></div>' +
                badge + '<span class="sgap"></span>' + srcTog + btn +
                ((whoTxt || tchips) ? '<div class="smeta">' + whoTxt + tchips + '</div>' : '') + '</div>' +
                '<div class="sbom" id="sbom' + i + '">' + piBlock(s, i) +
                '<div class="bhead">투입자재 <span class="ln"></span>' + (done ? '' : '<button class="baddbtn" data-add="' + i + '">＋ 자재</button>') + '</div>' +
                rows + '</div></div>';
        }

        /* ★ S/N 입력 현황 — 펼쳐서 자재를 불러왔으면 화면 값, 아니면 서버 집계 */
        function snStat(s) {
            if (s.mats) {
                let need = 0, done = 0;
                s.mats.filter(r => r.sn_yn === 'Y' && r.is_assembly !== 'Y' && bomQ(r) > 0).forEach(r => {
                    const q = Math.max(1, Math.round(bomQ(r))); need += q; done += Math.min(q, snCount(r));
                });
                return { need, done };
            }
            return { need: +s.sn_need || 0, done: +s.sn_done || 0 };
        }
        function snBadge(s) {
            const t = snStat(s);
            if (!t.need) return '';
            const ok = t.done >= t.need;
            return ' <span class="sntag ' + (ok ? 'ok' : 'miss') + '" data-sntag="' + s.step_id + '">S/N ' + t.done + '/' + t.need + (ok ? ' ✓' : ' 미입력') + '</span>';
        }

        /* ══════════ ★ 공정검사 (조립 중간 검사, F803-6) ══════════
           어셈블리에 공정검사 양식이 연결돼 있으면 «작업중» 에 검사 → 합격해야 완료할 수 있다. */
        function piTag(s) {
            if (!s.pi_form_id) return '';
            const v = s.pi_verdict;
            if (v === 'pass') return ' <span class="sntag ok">공정검사 합격 ✓</span>';
            if (v === 'fail') return ' <span class="sntag miss">공정검사 불합격</span>';
            return ' <span class="sntag pi">공정검사 ' + (s.pi_result_id ? '진행중' : '대기') + '</span>';
        }
        function loadPi(s) {
            if (!s.pi_form_id) { s.pi = null; return; }
            try { s.pi = apiGet('/pi_detail', {step_id: s.step_id}) || null; } catch (e) { s.pi = null; }
            const r = s.pi && s.pi.result;
            s.pi_result_id = r ? r.result_id : null;
            s.pi_verdict = r ? r.verdict : null;
        }
        function piBlock(s, i) {
            if (!s.pi_form_id) return '';
            const working = s.state === 'working', done = s.state === 'done';
            const head = '<div class="bhead">공정검사 <span class="pinm">' + esc(s.pi_form_name || '') + '</span><span class="ln"></span>';
            if (!working && !done) return '<div class="piwrap">' + head + '</div>' +
                '<div class="pinote">작업을 시작하면 공정검사를 입력할 수 있습니다. 합격해야 완료됩니다.</div></div>';
            if (!s.pi) return '<div class="piwrap">' + head + '</div><div class="pinote">불러오는 중…</div></div>';
            const res = s.pi.result, v = res && res.verdict;
            const vals = {};
            (s.pi.values || []).forEach(x => { vals[x.item_id] = x; });
            const editable = working && !v;   // 확정 전·작업중에만 입력
            let btns = '';
            if (working) {
                if (!res) btns = '';
                else if (v === 'fail') btns = '<button class="sbtn2 go" data-pistart="' + i + '">재검사</button>';
                else if (v === 'pass') btns = '<button class="sbtn2 ghost" data-pirevise="' + i + '">판정 수정</button>';
                else {   // 진행중 — 합격만이면 자동 확정되므로, 여기 남는 건 불합격 항목이 있을 때
                    const vv = s.pi.values || [];
                    const anyFail = (s.pi.items || []).some(it => (vv.find(x => +x.item_id === +it.item_id) || {}).result === 'fail');
                    btns = anyFail ? '<button class="sbtn2 done" data-pijudge="' + i + '" style="background:#c0392b;border-color:#c0392b">불합격 확정</button>' : '';
                }
            }
            const vb = v === 'pass' ? '<span class="sntag ok">합격' + (res.try_no > 1 ? ' · ' + res.try_no + '차' : '') + '</span>'
                : v === 'fail' ? '<span class="sntag miss">불합격 · ' + res.try_no + '차</span>'
                    : res ? '<span class="sntag pi">' + res.try_no + '차 진행중</span>' : '';
            const items = (s.pi.items || []).map(it => {
                const cur = vals[it.item_id] || {}, rr = cur.result;
                return '<div class="pirow">' +
                    '<div class="pitx"><div class="pin">' + it.seq_no + '. ' + esc(it.item_name || '') + '</div>' +
                    (it.method ? '<div class="pim">방법 · ' + esc(it.method) + '</div>' : '') +
                    (it.criteria ? '<div class="pim">기준 · ' + esc(it.criteria) + '</div>' : '') + '</div>' +
                    '<div class="piact">' +
                    '<input class="pival" data-pival="' + i + ',' + it.item_id + '" value="' + esc(cur.value || '') + '" placeholder="측정값"' + (editable ? '' : ' disabled') + '>' +
                    '<button class="piok' + (rr === 'pass' ? ' on' : '') + '" data-pires="' + i + ',' + it.item_id + ',pass"' + (editable || (working && !res) ? '' : ' disabled') + '>합격</button>' +
                    '<button class="ping' + (rr === 'fail' ? ' on' : '') + '" data-pires="' + i + ',' + it.item_id + ',fail"' + (editable || (working && !res) ? '' : ' disabled') + '>불합격</button>' +
                    '</div></div>';
            }).join('') || '<div class="pinote">검사 항목이 없습니다. 검사 화면 «양식» 에서 항목을 등록하세요.</div>';
            const hist = (s.pi.history || []).filter(h => !res || h.try_no !== res.try_no)
                .map(h => '<span class="pihist">' + h.try_no + '차 ' + (h.verdict === 'pass' ? '합격' : '불합격') +
                    (h.fail_reason ? ' (' + esc(h.fail_reason) + ')' : '') + '</span>').join('');
            return '<div class="piwrap">' + head + vb + btns + '</div>' + items +
                (res && res.actor_name ? '<div class="pinote">검사자 ' + esc(res.actor_name) + (res.end_time ? ' · ' + shortT(res.end_time) : '') + '</div>' : '') +
                (hist ? '<div class="pinote">이력 ' + hist + '</div>' : '') +
                (done && !v ? '<div class="pinote">완료된 어셈블리 — 검사 기록 없음</div>' : '') + '</div>';
        }
        function piRefresh(i) { const s = stepIdx(i); loadPi(s); renderUnit(); openStep(i); }
        async function piEnsure(s) {   // 회차가 없거나 불합격 뒤면 새 회차
            const r = s.pi && s.pi.result;
            if (r && !r.verdict) return r.result_id;
            const d = await apiPost('/pi_start', {step_id: s.step_id, actor_id: s.actor_id || '', spjangcd: CTX.spjangcd});
            return d && d.result_id;
        }
        /* ★ 전 항목이 «합격» 이면 판정 확정을 따로 누르지 않아도 자동 합격.
              불합격 항목이 있으면 바로 확정하지 않는다(잘못 누른 것 고칠 여지) → «불합격 확정» 버튼으로 */
        function piAllPass(s) {
            const r = s.pi && s.pi.result, items = (s.pi && s.pi.items) || [], vals = (s.pi && s.pi.values) || [];
            if (!r || r.verdict || !items.length) return false;
            return items.every(it => (vals.find(x => +x.item_id === +it.item_id) || {}).result === 'pass');
        }
        async function piAutoPass(s) {
            if (!piAllPass(s)) return false;
            const res = await apiPostSilent('/pi_judge', {result_id: s.pi.result.result_id, fail_reason: ''});
            if (res && res.success === false) { flash(res.message || '판정 실패'); return false; }
            flash('공정검사 합격 ✓');
            loadPi(s);
            return true;
        }
        async function piTap(t) {
            const pr = t.closest('[data-pires]');
            if (pr) {
                const [i, itemId, val] = pr.dataset.pires.split(',');
                const s = stepIdx(+i);
                await guard(async () => {
                    const rid = await piEnsure(s);
                    const curV = ((s.pi && s.pi.values) || []).find(x => +x.item_id === +itemId) || {};
                    const next = curV.result === val ? '' : val;   // 같은 버튼 다시 누르면 해제
                    const inp = document.querySelector('[data-pival="' + i + ',' + itemId + '"]');
                    const res = await apiPostSilent('/pi_item', {result_id: rid, item_id: itemId, result: next, value: inp ? inp.value : ''});
                    if (res && res.success === false) flash(res.message || '저장 실패');
                    loadPi(s);
                    await piAutoPass(s);   // ★ 전 항목 합격이면 판정까지 자동
                    renderUnit(); openStep(+i);
                });
                return true;
            }
            const ps = t.closest('[data-pistart]');
            if (ps) { const i = +ps.dataset.pistart, s = stepIdx(i);
                await guard(async () => { await apiPost('/pi_start', {step_id: s.step_id, actor_id: s.actor_id || '', spjangcd: CTX.spjangcd}); piRefresh(i); });
                return true; }
            const pj = t.closest('[data-pijudge]');
            if (pj) { const i = +pj.dataset.pijudge, s = stepIdx(i);
                const vals = (s.pi && s.pi.values) || [];
                const bad = (s.pi.items || []).filter(it => (vals.find(x => +x.item_id === +it.item_id) || {}).result === 'fail')
                    .map(it => it.item_name).join(', ');
                await guard(async () => {
                    await apiPost('/pi_judge', {result_id: s.pi.result.result_id, fail_reason: bad});
                    piRefresh(i);
                });
                return true; }
            const pv = t.closest('[data-pirevise]');
            if (pv) { const i = +pv.dataset.pirevise, s = stepIdx(i);
                await guard(async () => { await apiPost('/pi_revise', {result_id: s.pi.result.result_id}); piRefresh(i); });
                return true; }
            return false;
        }
        // 측정값 — 칸을 벗어나면 저장
        document.getElementById('cGrid').addEventListener('change', e => {
            const inp = e.target.closest('[data-pival]'); if (!inp) return;
            const [i, itemId] = inp.dataset.pival.split(',').map(Number);
            const s = stepIdx(i);
            Promise.resolve(piEnsure(s)).then(rid => {
                const curV = ((s.pi && s.pi.values) || []).find(x => +x.item_id === itemId) || {};
                return apiPostSilent('/pi_item', {result_id: rid, item_id: itemId, result: curV.result || '', value: inp.value.trim()})
                    .then(res => {
                        if (res && res.success === false) { flash(res.message || '저장 실패'); return; }
                        if (!s.pi.result) { loadPi(s); return; }
                        const v = (s.pi.values = s.pi.values || []).find(x => +x.item_id === itemId);
                        if (v) v.value = inp.value.trim(); else s.pi.values.push({item_id: itemId, value: inp.value.trim()});
                    });
            }).catch(err => flash((err && err.message) || '저장 실패'));
        });

        function replacedCard(s, i) {
            return '<div class="step replaced" data-st="repl" style="--ind:' + s.depth + ';--gd:' + (s.depth ? 'block' : 'none') + '"><div class="edge"></div>' +
                '<div class="shead"><span class="caret dis">▶</span><span class="lvl">L' + (s.depth + 1) + '</span>' +
                '<div class="sid"><div class="sn">' + esc(s.mat_name) + '</div><div class="sc">' + esc(s.mat_code) + ' · 상위 재고 투입으로 대체</div></div>' +
                '<span class="st-badge repl2">투입 대체</span></div></div>';
        }

        function stockCard(s, i) {
            const fixed = !!s.stock_lot_id;
            const srcTog = '<span class="srctog"><button data-src="' + i + ',build">조립</button><button class="on" data-src="' + i + ',stock">투입</button></span>';
            const badge = fixed ? '<span class="st-badge done">확정 · 투입</span>' : '<span class="st-badge stock">투입</span>';
            const btn = fixed ? '<button class="sbtn2 ghost" data-stockcancel="' + i + '">확정취소</button>'
                : '<button class="sbtn2 go" data-wlot="' + i + '">재고 로트 선택</button>';
            const lotRow = '<div class="wlot"><div class="wl"><div class="wlt">재고 재공품 로트 · FIFO 권장</div>' +
                '<div class="wll">' + esc(s.stock_lot_no || '로트 미지정') + '</div>' +
                '<div class="wlm">' + (fixed ? esc(s.mat_name) + ' 재고분을 그대로 투입 · 하위 레벨 생략' : '창고 로트를 선택하세요') + '</div></div>' +
                '<button class="wchg" data-wlot="' + i + '">' + (fixed ? '변경' : '선택') + '</button></div>';
            return '<div class="step stock' + (fixed ? ' done' : '') + '" data-st="' + s.state + '" style="--ind:' + s.depth + ';--gd:' + (s.depth ? 'block' : 'none') + '"><div class="edge"></div>' +
                '<div class="shead"><button class="caret" data-caret="' + i + '">▶</button><span class="lvl">L' + (s.depth + 1) + '</span>' +
                '<div class="sid"><div class="sn">' + esc(s.mat_name) + '</div><div class="sc">' + esc(s.mat_code) + ' · 재고 투입 · ' + esc(s.stock_lot_no || '로트 미지정') + '</div></div>' +
                badge + '<span class="sgap"></span>' + srcTog + btn + '</div>' +
                '<div class="sbom" id="sbom' + i + '">' + lotRow + '</div></div>';
