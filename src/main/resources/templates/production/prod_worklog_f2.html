<html layout:decorate="~{layout_page}">
<head>
    <style>
        .wl-topbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .wl-fbadge{ display:inline-block; font-size:12px; font-weight:800; padding:3px 10px; border-radius:6px; background:#fbeee5; color:#c9620a; margin-left:8px; vertical-align:middle;}
        .wl-print { margin-left:auto; background:#3a4759; color:#fff; border:0; border-radius:8px; padding:9px 16px; font-weight:800; font-size:13px; cursor:pointer; }
        .wl-daybar { display:flex; align-items:center; gap:14px; background:#fff; border:1px solid #e2e6ee; border-radius:12px; padding:14px 18px; margin:14px 0; flex-wrap:wrap; }
        .wl-daybar .dow { color:#8a94a4; font-weight:700; margin-left:4px; font-size:16px; }
        .wl-daybar .sum { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
        .wl-tag { display:inline-block; font-size:12.5px; font-weight:800; padding:5px 12px;
            border-radius:20px; text-decoration:none !important; border:0;
            line-height:1.4; white-space:nowrap; }
        .wl-tag.lot { background:#eef2f8; color:#3a4759; } .wl-tag.row { background:#e7f0ff; color:#2f6fed; margin-bottom:0; }
        .wl-tag.qty { background:#e3f6ec; color:#0f9d58; } .wl-tag.def { background:#fdecec; color:#d64545; }
        .wl-navbtn { border:1px solid #e2e6ee; background:#fbfcfe; width:40px; height:40px; border-radius:10px; font-size:18px; font-weight:800; cursor:pointer; color:#3a4759; }
        .wl-dateinput { border:1px solid #e2e6ee; background:#fbfcfe; height:42px; border-radius:10px; padding:0 12px; font-size:18px; font-weight:800; color:#1f2733; font-variant-numeric:tabular-nums; cursor:pointer; }

        /* 공정 블록 */
        .wl-proc-box { background:#fff; border:1px solid #e2e6ee; border-radius:12px; margin-bottom:14px; overflow:hidden; }
        .wl-proc-h { display:flex; align-items:center; gap:12px; padding:12px 16px; background:#f7f9fc; border-bottom:1px solid #eef1f6; flex-wrap:wrap; }
        .wl-proc-h .nm { font-weight:800; font-size:15px; }
        .wl-proc-h .tag { font-size:11px; font-weight:800; padding:2px 7px; border-radius:5px; background:#fdf3e6; color:#c9820a; }
        .wl-proc-h .sum { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

        .wl-table { border-collapse:collapse; width:100%; }
        .wl-table thead th { background:#2f3a4c; color:#fff; font-weight:600; font-size:12px; padding:9px 8px; white-space:nowrap; }
        .wl-table thead th.left{ text-align:left; padding-left:14px; }
        .wl-table tbody td { border-bottom:1px solid #eef1f6; padding:10px 8px; text-align:center; font-size:13px; }
        .wl-table tbody td.left{ text-align:left; padding-left:14px; }
        .wl-table tfoot td { background:#f4f6fa; font-weight:800; font-size:13px; padding:9px 8px; text-align:center; }
        .wl-table tfoot td.left { text-align:right; padding-right:12px; color:#5b6675; }
        .wl-code { color:#8a94a4; font-size:11.5px; font-family:ui-monospace,monospace; }
        .wl-qty { font-weight:800; font-variant-numeric:tabular-nums; } .wl-defcell { color:#d64545; font-weight:700; }
        .wl-run { color:#0f9d58; font-weight:700; }
        .wl-none { color:#c2c9d4; }
        .wl-note { color:#8a94a4; font-size:12.5px; margin-top:12px; line-height:1.7; }
        .wl-empty { text-align:center; color:#8a94a4; padding:40px; font-size:13.5px; background:#fff; border:1px solid #e2e6ee; border-radius:12px; }
        .wl-loading { text-align:center; color:#8a94a4; padding:40px; font-size:13.5px; }
        /* 결재란·머리글은 인쇄물에만 나온다 */
        .wl-sign { display:none; }
        .wl-runhead { display:none; }

        @media print {
            .page-title-wrap, .section-top, .page-navi, .bookmark, .wl-print, .wl-navbtn,
            .wl-dateinput, .wl-note, .wl-daybar .dow { display:none !important; }

            /* ★ 여러 장으로 안 나뉘던 원인
               레이아웃 컨테이너에 걸린 height/overflow 가 내용을 한 화면에 가둔다.
               인쇄에서는 전부 풀어야 브라우저가 페이지를 나눈다.
               (position:fixed 머리글도 분할을 막아 일반 블록으로 되돌렸다) */
            html, body { height:auto !important; overflow:visible !important; background:#fff; }
            .layout-contents, .section, .grid_box, #report {
                height:auto !important; max-height:none !important;
                overflow:visible !important; position:static !important;
            }

            .wl-runhead { display:block; font-size:11px; font-weight:700; color:#555;
                border-bottom:1px solid #ccc; padding-bottom:4px; margin-bottom:8px; }

            .wl-daybar { margin:0 0 10px; border-color:#999; break-inside:avoid; }
            .wl-daybar::before { content:attr(data-title); font-size:19px; font-weight:800; }

            /* 공정 블록은 쪼개질 수 있어야 한다. 블록을 통째로 avoid 하면
               한 장에 안 들어가는 표가 다음 장으로 밀리며 앞이 비고 뒤가 잘린다. */
            .wl-proc-box { break-inside:auto; margin-bottom:10px; border-color:#999; }
            .wl-proc-h   { break-inside:avoid; break-after:avoid; }

            .wl-table { break-inside:auto; }
            .wl-table thead { display:table-header-group; }   /* 페이지마다 헤더 반복 */
            .wl-table tfoot { display:table-footer-group; }
            .wl-table tr    { break-inside:avoid; }
            /* ★ 「여백 없음」으로 인쇄하면 @page 여백이 통째로 무시된다.
               thead 는 표가 넘어간 페이지마다 다시 그려지므로, 헤더 셀 위에
               흰 여백을 얹으면 이어지는 장에서도 종이 끝에 붙지 않는다.
               (빈 spacer 행은 colspan 때문에 컬럼 폭이 틀어져 쓰지 않는다) */
            .wl-table thead th {
                background:#e8ebf0 !important; color:#000 !important;
                -webkit-print-color-adjust:exact; print-color-adjust:exact;
                padding-top:9px;
                border-top:8mm solid #fff;      /* 이 두께가 곧 페이지 상단 여백 */
            }
            /* 표 밖에서 페이지가 갈릴 때를 대비해 블록에도 약간의 여유 */
            .wl-proc-box { padding-top:2mm; }
            .wl-table tbody td, .wl-table tfoot td { font-size:11.5px; padding:6px; }
            .wl-tag { border:1px solid #bbb; background:#fff !important; color:#000 !important; }

            .wl-sign { display:table; width:260px; margin-left:auto; margin-bottom:8px;
                border-collapse:collapse; break-inside:avoid; }
            .wl-sign td { border:1px solid #999; height:46px; text-align:center; font-size:11px; }
            .wl-sign td.h { height:20px; background:#f0f0f0; font-weight:700;
                -webkit-print-color-adjust:exact; print-color-adjust:exact; }

            /* 페이지 상단 여백.
               @page :first 로 첫 장만 다르게 주면 엔진에 따라 규칙 전체가 무시되므로
               모든 장에 같은 값을 준다. */
            @page { size:A4 portrait; margin:16mm 12mm 14mm; }
        }
    </style>
</head>

<th:block layout:fragment="content">
    <div class="layout-contents">
        <div class="page-title-wrap">
            <div class="left"><h2>작업일보 <span class="wl-fbadge">2공장 · M-CELL(디바이스)</span></h2>
                <a title="북마크" class="bookmark toggle">내 메뉴</a></div>
            <ul class="page-navi"><li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>생산 관리</li><li>작업일보</li><li>2공장</li></ul>
        </div>

        <section class="section">
            <div class="section-top"><div class="wl-topbar">
                <div style="font-size:13px;color:#8a94a4;font-weight:700">하루 동안 공정별로 어떤 작업을 했는지 보여줍니다.</div>
                <button type="button" class="wl-print" id="btnPrint">🖨 인쇄</button>
            </div></div>

            <div class="wl-runhead" id="runHead"></div>

            <div id="report">
                <table class="wl-sign"><tr><td class="h">담당</td><td class="h">검토</td><td class="h">승인</td></tr>
                    <tr><td></td><td></td><td></td></tr></table>

                <div class="wl-daybar" id="dayBar">
                    <button class="wl-navbtn" id="prevDay" title="전날">‹</button>
                    <input type="date" id="fDate" class="wl-dateinput">
                    <span class="dow" id="dDow"></span>
                    <button class="wl-navbtn" id="nextDay" title="다음날">›</button>
                    <div class="sum" id="daySum"></div>
                </div>
                <div id="body"><div class="wl-loading">불러오는 중…</div></div>
            </div>

            <p class="wl-note">공정별로 <span style="color:#5b6675;font-weight:700">그날 끝낸 작업</span>만 나옵니다.
                M-CELL 은 <span style="color:#5b6675;font-weight:700">한 대가 로트 하나</span>라 조립·수리·포장은 한 줄이 곧 한 대이고,
                검사는 한 줄이 검사 한 번입니다.<br>
                <b style="color:#c9820a">포장</b>은 아직 준비 중인 공정이라 당분간 비어 있습니다. 인쇄하면 상단에 결재란이 함께 나옵니다.</p>
        </section>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        /* =========================================================
         * 작업일보 · 2공장 M-CELL — 하루 × 공정
         *
         * ★ 실적 단위가 1공장과 다르다.
         *   1공장 : 작업조가 여러 개를 만든다 → 차수(mat_produce)
         *   2공장 : 1대 = 1로트 = 1시리얼   → 유닛(mcell_unit)
         *   한 대를 조립하면 부품 단계마다 실적이 남지만 일보에는 대수로만 적는다.
         *
         * ★ 데이터는 작업실적현황과 같은 API 를 쓴다(기간을 하루로 좁혀서).
         *   집계 규칙이 두 벌이 되면 같은 날 두 화면 숫자가 달라진다.
         * ========================================================= */
        const WL_SPJANGCD = (window.WS_CTX && window.WS_CTX.spjangcd) || 'ZZ';
        const WL_API = '/api/production/mcell_status';
        const DOW = ['일','월','화','수','목','금','토'];

        const WL_USTATE = {
            wait:'대기', assembling:'조립중', inspect_wait:'검사대기',
            pass:'검사합격', reject:'불합격', repairing:'수리중', packed:'포장완료'
        };

        function wlReady(){ return (typeof AjaxUtil !== 'undefined') && AjaxUtil && AjaxUtil.getSyncData; }
        function wlData(res){
            if(!res) return null;
            if(res.success === false) return null;
            return (res.data !== undefined) ? res.data : res;
        }
        function esc(s){
            return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
            });
        }
        function num(v){ return (v==null?0:Number(v)).toLocaleString(); }
        function hm(s){
            if(!s) return '-';
            const m = String(s).match(/(\d{2}:\d{2})$/);
            return m ? m[1] : s;
        }
        function fmt(d){
            return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
        }
        function shiftDay(n){
            const v = document.getElementById('fDate').value;
            const d = v ? new Date(v+'T00:00') : new Date();
            d.setDate(d.getDate()+n);
            document.getElementById('fDate').value = fmt(d);
            wlLoad();
        }
        /** 전 검사유형의 마지막 회차가 합격이어야 합격 */
        function wlVerdict(u){
            if(Number(u.fail_cnt||0) > 0) return 'fail';
            if(Number(u.open_cnt||0) > 0) return 'open';
            return Number(u.pass_cnt||0) > 0 ? 'pass' : 'open';
        }

        // =====================================================
        function wlLoad(){
            const host = document.getElementById('body');
            if(!wlReady()){ host.innerHTML = '<div class="wl-empty">AjaxUtil 로드 실패 — 새로고침해 주세요.</div>'; return; }
            const date = document.getElementById('fDate').value;
            if(!date){ host.innerHTML = '<div class="wl-empty">날짜를 선택해 주세요.</div>'; return; }

            const d = new Date(date+'T00:00');
            document.getElementById('dDow').textContent = '('+DOW[d.getDay()]+')';
            document.getElementById('dayBar').setAttribute('data-title', date+' ('+DOW[d.getDay()]+') 작업일보');
            document.getElementById('runHead').textContent =
                '작업일보 · 2공장 · M-CELL(디바이스) · '+date+' ('+DOW[d.getDay()]+')';
            host.innerHTML = '<div class="wl-loading">불러오는 중…</div>';

            const r = wlData(AjaxUtil.getSyncData(WL_API+'/process',
                {date_from:date, date_to:date, spjangcd:WL_SPJANGCD}));
            if(!r){ host.innerHTML = '<div class="wl-empty">조회에 실패했습니다.</div>'; return; }

            const asm   = r.assembly  || [], insp = r.inspect || [];
            const steps = r.asm_steps || [];
            const rep  = r.repair   || [], pack = r.pack    || [];
            const def  = r.defect   || [];

            let dq = 0;
            def.forEach(function(m){ dq += Number(m.defect_qty||0); });
            document.getElementById('daySum').innerHTML =
                '<span class="wl-tag row">작업 '+num(asm.length + insp.length + rep.length + pack.length)+'건</span>'
                + '<span class="wl-tag qty">포장 '+num(pack.length)+'대</span>'
                + (dq ? '<span class="wl-tag def">부적합 '+num(dq)+'</span>' : '');

            document.getElementById('body').innerHTML =
                wlAsm({name:'조립'}, steps, asm)
                + wlInsp({name:'검사'}, insp)
                + wlRep({name:'수리'}, rep)
                + wlPack({name:'포장'}, pack)
                + wlDefect(def);
        }

        function wlBox(f, sum, thead, tbody, tfoot, tag){
            return '<div class="wl-proc-box"><div class="wl-proc-h">'
                + '<span class="nm">'+esc(f.name)+'</span>'
                + (tag ? '<span class="tag">'+tag+'</span>' : '')
                + '<div class="sum">'+sum+'</div></div>'
                + '<table class="wl-table"><thead><tr>'+thead+'</tr></thead>'
                + '<tbody>'+tbody+'</tbody>'
                + (tfoot ? '<tfoot><tr>'+tfoot+'</tr></tfoot>' : '')
                + '</table></div>';
        }
        function wlNoRow(cols, msg){
            return '<tr><td colspan="'+cols+'" style="color:#c2c9d4;padding:22px">'+(msg||'작업 없음')+'</td></tr>';
        }

        /**
         * 조립 — 한 줄 = 그날 끝낸 모듈 1개.
         *
         * ★ 유닛(대수)으로 뭉치지 않는다.
         *   한 대가 BOM 계층 스텝 13개로 이루어지고 며칠에 걸쳐 조립된다.
         *   유닛만 적으면 "13 / 13" 한 줄이 되어 그날 무슨 모듈을 만들었는지 사라지고,
         *   완성되지 않은 날은 아무 실적도 없는 것처럼 보인다.
         *   최상위(Depth=0)가 끝난 줄이 곧 「완성」이다.
         */
        function wlAsm(f, steps, units){
            const doneStep = steps.filter(function(x){ return x.end_time; }).length;
            const doneUnit = steps.filter(function(x){
                return x.end_time && Number(x.depth) === 0;
            }).length;
            const sum = '<span class="wl-tag row">'+steps.length+'단계</span>'
                + (doneUnit ? '<span class="wl-tag qty">완성 '+doneUnit+'대</span>' : '')
                + (units.length ? '<span class="wl-tag lot">진행 '+units.length+'대</span>' : '');

            const th = '<th>시간</th><th class="left">모듈(부품)</th><th>단계</th>'
                + '<th class="left">완제품</th><th>로트번호</th><th>호기</th>'
                + '<th>방식</th><th>작업자</th><th>설비</th><th>상태</th>';

            /* 유닛(로트)이 바뀌면 구분이 보이도록 로트를 반복 표기한다 */
            const tb = steps.length ? steps.map(function(x){
                const running = !x.end_time;
                const top = Number(x.depth) === 0;
                return '<tr><td>'+hm(x.start_time)+' ~ '+(running?'<span class="wl-run">작업중</span>':hm(x.end_time))+'</td>'
                    + '<td class="left">'+(top?'<b>':'')+esc(x.mat_name||'-')+(top?'</b>':'')
                    +   (x.parent_name ? '<br><span class="wl-code">→ '+esc(x.parent_name)+'</span>' : '')+'</td>'
                    + '<td>'+(top ? '<b>완성</b>' : 'L'+esc(x.depth))+'</td>'
                    + '<td class="left">'+esc(x.unit_mat_name||'-')+'</td>'
                    + '<td><span class="wl-code">'+esc(x.lot_number||'-')+'</span></td>'
                    + '<td>#'+esc(x.unit_no||'-')+'</td>'
                    + '<td>'+(x.source==='stock'?'재고 투입':'조립')+'</td>'
                    + '<td>'+esc(x.worker||'-')+'</td><td>'+esc(x.equipment||'-')+'</td>'
                    + '<td>'+(running?'작업중':'완료')
                    +   (x.rework_yn==='Y'?' <span class="wl-code">재조립</span>':'')
                    +   (x.is_repair==='Y'?' <span class="wl-code">수리품</span>':'')+'</td></tr>';
            }).join('') : wlNoRow(10);
            const tf = steps.length
                ? '<td class="left" colspan="9">완료 단계 / 완성 대수</td><td>'+doneStep+' / '+doneUnit+'</td>' : '';
            return wlBox(f, sum, th, tb, tf);
        }

        /** 검사 — 한 줄 = 한 대 (검사유형·회차는 합쳐서) */
        function wlInsp(f, list){
            const pass = list.filter(function(u){ return wlVerdict(u) === 'pass'; }).length;
            const fl   = list.filter(function(u){ return wlVerdict(u) === 'fail'; }).length;
            const sum = '<span class="wl-tag row">'+list.length+'대</span>'
                + (pass ? '<span class="wl-tag qty">합격 '+pass+'</span>' : '')
                + (fl ? '<span class="wl-tag def">불합격 '+fl+'</span>' : '');
            const th = '<th>시간</th><th class="left">품목</th><th>로트번호</th>'
                + '<th class="left">검사 유형</th><th>회차</th><th>검사자</th><th>판정</th>';
            const tb = list.length ? list.map(function(u){
                const v = wlVerdict(u);
                const n = (v==='pass')?'합격':(v==='fail'?'불합격':'진행중');
                const retry = Number(u.try_cnt||0) > Number(u.form_cnt||0);
                return '<tr><td>'+hm(u.start_time)+' ~ '+hm(u.end_time)+'</td>'
                    + '<td class="left">'+esc(u.mat_name||'-')+'</td>'
                    + '<td><span class="wl-code">'+esc(u.lot_number||'-')+'</span></td>'
                    + '<td class="left">'+esc(u.form_names||'-')+'</td>'
                    + '<td>'+num(u.try_cnt)+(retry?'<span class="wl-code"> (재검사)</span>':'')+'</td>'
                    + '<td>'+esc(u.worker||'-')+'</td>'
                    + '<td'+(v==='fail'?' class="wl-defcell"':'')+'>'+n
                    + (u.reject_reason?'<br><span class="wl-code">'+esc(u.reject_reason)+'</span>':'')+'</td></tr>';
            }).join('') : wlNoRow(7);
            const tf = list.length ? '<td class="left" colspan="6">합격 대수</td><td>'+pass+'</td>' : '';
            return wlBox(f, sum, th, tb, tf);
        }

        /** 수리 — 한 줄 = 한 대 */
        function wlRep(f, list){
            const done = list.filter(function(u){ return u.end_time; }).length;
            const sum = '<span class="wl-tag row">'+list.length+'대</span>'
                + (done ? '<span class="wl-tag qty">완료 '+done+'</span>' : '');
            const th = '<th>시간</th><th class="left">품목</th><th>로트번호</th><th>원 로트</th>'
                + '<th>구분</th><th class="left">사유</th><th>작업자</th><th>자재</th><th>상태</th>';
            const tb = list.length ? list.map(function(u){
                const running = !u.end_time;
                const cat = (u.repair_cat==='return')?'반품':(u.repair_cat==='spec'?'사양변경':'-');
                return '<tr><td>'+hm(u.start_time)+' ~ '+(running?'<span class="wl-run">작업중</span>':hm(u.end_time))+'</td>'
                    + '<td class="left">'+esc(u.mat_name||'-')+'</td>'
                    + '<td><span class="wl-code">'+esc(u.lot_number||'-')+'</span></td>'
                    + '<td><span class="wl-code">'+esc(u.src_lot||'-')+'</span></td>'
                    + '<td>'+cat+'</td>'
                    + '<td class="left">'+esc(u.repair_reason||'-')+'</td>'
                    + '<td>'+esc(u.worker||'-')+'</td>'
                    + '<td>＋'+num(u.mat_in_cnt)+' / －'+num(u.mat_out_cnt)+'</td>'
                    + '<td>'+esc(WL_USTATE[u.unit_state]||u.unit_state||'-')+'</td></tr>';
            }).join('') : wlNoRow(9);
            const tf = list.length ? '<td class="left" colspan="8">완료 대수</td><td>'+done+'</td>' : '';
            return wlBox(f, sum, th, tb, tf);
        }

        /** 포장 — 공정 미구현이라 당분간 비어 있다 */
        function wlPack(f, list){
            const sum = '<span class="wl-tag row">'+list.length+'대</span>';
            const th = '<th>시간</th><th class="left">품목</th><th>로트번호</th>'
                + '<th>외부라벨</th><th>작업지시</th><th>작업자</th>';
            const tb = list.length ? list.map(function(u){
                return '<tr><td>'+hm(u.end_time)+'</td>'
                    + '<td class="left">'+esc(u.mat_name||'-')+'</td>'
                    + '<td><span class="wl-code">'+esc(u.lot_number||'-')+'</span></td>'
                    + '<td><span class="wl-code">'+esc(u.maker_lot_no||'-')+'</span></td>'
                    + '<td><span class="wl-code">'+esc(u.wo||'-')+'</span></td>'
                    + '<td>'+esc(u.worker||'-')+'</td></tr>';
            }).join('') : wlNoRow(6, '포장 공정은 아직 준비 중입니다');
            const tf = list.length ? '<td class="left" colspan="5">포장 대수</td><td>'+list.length+'</td>' : '';
            return wlBox(f, sum, th, tb, tf);
        }

        /** 부적합 — 그날 등록된 것 */
        function wlDefect(list){
            if(!list.length) return '';
            let q = 0;
            list.forEach(function(x){ q += Number(x.defect_qty||0); });
            const th = '<th>공정</th><th class="left">품목</th><th>유형</th><th>수량</th><th>건수</th>';
            const tb = list.map(function(x){
                return '<tr><td>'+esc(x.proc_name||'-')+'</td>'
                    + '<td class="left">'+esc(x.mat_name||'-')+'<br><span class="wl-code">'+esc(x.mat_code||'')+'</span></td>'
                    + '<td>'+esc(x.defect_type||'-')+'</td>'
                    + '<td class="wl-defcell">'+num(x.defect_qty)+'</td><td>'+num(x.cnt)+'</td></tr>';
            }).join('');
            const tf = '<td class="left" colspan="3">소계</td><td>'+num(q)+'</td><td></td>';
            return wlBox({name:'부적합'}, '<span class="wl-tag def">'+num(q)+'</span>', th, tb, tf);
        }

        // =====================================================
        document.addEventListener('DOMContentLoaded', function(){
            document.getElementById('fDate').value = fmt(new Date());
            document.getElementById('fDate').addEventListener('change', wlLoad);
            document.getElementById('prevDay').addEventListener('click', function(){ shiftDay(-1); });
            document.getElementById('nextDay').addEventListener('click', function(){ shiftDay(1); });
            document.getElementById('btnPrint').addEventListener('click', function(){ window.print(); });
            wlLoad();
        });
    </script>
</th:block>
</html>
