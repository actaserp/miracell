<html layout:decorate="~{layout_page}">

<th:block layout:fragment="content">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"/>
    <style>


        :root{--bg:#E9EEF1;--surface:#FFF;--surface-2:#F4F7F9;--ink:#15222B;--ink-2:#5A6B76;--line:#D8E0E5;
            --teal:#0E7C86;--teal-d:#0A5C64;--teal-bg:#E2F1F2;--green:#1E9D58;--green-bg:#E4F4EA;
            --amber:#C77A00;--amber-bg:#FBEFD8;--red:#C8483B;--red-bg:#F7E4E1;--r:18px;--tap:60px;
            --shadow:0 1px 0 rgba(21,34,43,.04),0 8px 24px -16px rgba(21,34,43,.28)}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        .ms-wash-root{font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif;color:var(--ink);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;flex:1 1 auto;min-height:0;height:var(--wash-h,100%);max-height:var(--wash-h,none);display:flex;flex-direction:column}
        /* 앱 높이: JS가 측정한 상단 오프셋만큼 빼서 화면 바닥까지 채움 */
        .ms-wash-root .app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-radius:12px;overflow:hidden}
        .topbar{flex:0 0 auto;height:64px;display:flex;align-items:center;gap:14px;padding:0 20px;
            background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
        .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}
        .brand .dot{width:12px;height:12px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px var(--teal-bg)}
        .brand small{font-weight:600;color:var(--ink-2);margin-left:2px}
        .proc-chip{margin-left:4px;padding:6px 12px;border-radius:999px;background:var(--teal-bg);color:var(--teal-d);font-weight:800;font-size:14px}
        .spacer{flex:1}.clock{font-variant-numeric:tabular-nums;font-weight:700}
        .screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}.screen.hide{display:none}

        /* 큐 */
        .wrap{padding:22px 20px 28px;max-width:1180px;margin:0 auto;width:100%;overflow:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
        .qhead{display:flex;align-items:baseline;gap:12px;margin:2px 2px 18px}
        .qhead h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0}
        .qhead .cnt{color:var(--ink-2);font-weight:700}
        .qfilter{display:flex;gap:8px;margin-left:auto}
        .qfilter button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);
            background:var(--surface);color:var(--ink-2);font-weight:700;font-size:15px;cursor:pointer}
        .qfilter button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
        .searchbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 18px;
            background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
        .searchbar .slab{font-weight:800;color:var(--ink-2);font-size:14px}
        .searchbar .tilde{font-weight:800;color:var(--ink-2)}
        .dinput{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;
            font-weight:700;color:var(--ink);background:var(--surface-2);font-variant-numeric:tabular-nums;min-width:160px}
        .sbtn{height:48px;padding:0 22px;border:none;border-radius:12px;background:var(--teal);color:#fff;
            font-weight:800;font-size:16px;cursor:pointer;margin-left:auto}
        .sbtn:active{background:var(--teal-d)}
        .qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
        .wo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;
            cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease;position:relative;overflow:hidden}
        .wo:active{transform:scale(.985)}
        .wo .edge{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
        .wo[data-st="working"] .edge{background:var(--teal)}.wo[data-st="wait"] .edge{background:var(--amber)}.wo[data-st="done"] .edge{background:var(--green)}
        .wo .row1{display:flex;align-items:center;gap:10px;margin-bottom:8px}
        .wo .wono{font-weight:800;font-size:15px;color:var(--ink-2)}
        .chip{margin-left:auto;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:800}
        .chip.working{background:var(--teal-bg);color:var(--teal-d)}.chip.wait{background:var(--amber-bg);color:var(--amber)}.chip.done{background:var(--green-bg);color:var(--green)}
        .wo .name{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.3;margin:2px 0 14px}
        .wo .meta{display:flex;gap:18px;align-items:flex-end}
        .wo .meta .blk{display:flex;flex-direction:column;gap:2px}
        .wo .meta .lab{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .wo .meta .val{font-size:18px;font-weight:800}
        .wo .prog{margin-left:auto;text-align:right}
        .wo .bar{height:8px;width:120px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:6px}
        .wo .bar>i{display:block;height:100%;background:var(--teal);border-radius:999px}

        /* 공통 상단바(B,C) */
        .topbar2{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);
            padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);z-index:2}
        .back{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);
            display:grid;place-items:center;cursor:pointer;font-size:22px;flex:0 0 auto}
        .back:active{background:var(--line)}
        .htitle{min-width:0;flex:1}
        .htitle .t{font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .htitle .s{font-size:13.5px;color:var(--ink-2);font-weight:700;margin-top:1px}

        /* B. 세션 목록 */
        .col-stack{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;height:100%}
        .bscroll{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px}
        .bgrid{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
        .ovbox{display:flex;gap:12px;flex-wrap:wrap}
        .ov{flex:1;min-width:130px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
            padding:14px 16px;box-shadow:var(--shadow)}
        .ov .l{font-size:13px;color:var(--ink-2);font-weight:700}
        .ov .v{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
        .ov.left .v{color:var(--teal-d)}
        .secline{display:flex;align-items:center;gap:10px;margin:6px 2px 0;color:var(--ink-2);font-weight:800;font-size:14px}
        .secline .ln{flex:1;height:1px;background:var(--line)}
        .sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;
            box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden;
            transition:transform .12s ease}
        .sess:active{transform:scale(.99)}
        .sess .edge{position:absolute;left:0;top:0;bottom:0;width:5px}
        .sess[data-st="working"] .edge{background:var(--teal)}.sess[data-st="done"] .edge{background:var(--green)}
        .sess .who{display:flex;flex-direction:column;gap:2px;min-width:120px}
        .sess .who .nm{font-size:18px;font-weight:800}
        .sess .who .eq{font-size:13px;color:var(--ink-2);font-weight:700}
        .sess .time{font-size:13.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
        .sess .qty{margin-left:auto;text-align:right}
        .sess .qty .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
        .sess .qty .l{font-size:12px;color:var(--ink-2);font-weight:700}
        .sess .badge{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800}
        .sess .badge.working{background:var(--teal-bg);color:var(--teal-d)}.sess .badge.done{background:var(--green-bg);color:var(--green)}
        .sess .sessdel{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--red-bg);color:var(--red);font-weight:800;font-size:14px;cursor:pointer;flex:0 0 auto}
        .sess .sessdel:active{background:var(--red);color:#fff}
        .sess .bad{padding:5px 10px;border-radius:999px;background:var(--red-bg);color:var(--red);font-weight:800;font-size:12.5px}
        .emptysess{text-align:center;color:var(--ink-2);font-weight:700;padding:30px;border:1.5px dashed var(--line);border-radius:var(--r)}

        /* C. 세션 작업(부품) */
        .infopill{display:flex;gap:7px;align-items:center;background:var(--surface-2);border:1px solid var(--line);
            border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink-2);cursor:default}
        .infopill.tap{cursor:pointer}.infopill.tap:active{background:var(--line)}
        .infopill b{color:var(--ink);font-variant-numeric:tabular-nums}
        .infopill.tap b{color:var(--teal-d);text-decoration:underline dotted}
        .sstate{padding:8px 14px;border-radius:999px;font-weight:800;font-size:14px}
        .sstate.working{background:var(--teal-bg);color:var(--teal-d)}.sstate.done{background:var(--green-bg);color:var(--green)}
        .part{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
            display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);flex-wrap:wrap}
        .part.locked{opacity:.7}
        .part .id{display:flex;flex-direction:column;min-width:0;flex:1}
        .part .pn{font-size:18px;font-weight:800;letter-spacing:-.02em}
        .part .pc{font-size:13px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
        .part .stat{display:flex;gap:20px;align-items:center;flex:0 0 auto}
        .part .col{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
        .part .col .l{font-size:12px;font-weight:700;color:var(--ink-2)}
        .part .col .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
        .part .col .v.left{color:var(--teal-d)}.part .col .v.bad{color:var(--red)}
        .stepper{display:flex;align-items:center;flex:0 0 auto}
        .stepper button{width:50px;height:54px;border:1px solid var(--line);background:var(--surface-2);font-size:25px;font-weight:700;cursor:pointer;display:grid;place-items:center}
        .stepper button:active{background:var(--line)}
        .stepper button.minus{border-radius:14px 0 0 14px}.stepper button.plus{border-radius:0 14px 14px 0}
        .stepper .qty{width:90px;height:54px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
            background:#FFFDF4;text-align:center;font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;display:grid;place-items:center;cursor:pointer}
        .defbtn{height:54px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);
            color:var(--ink-2);font-weight:800;font-size:14px;cursor:pointer;flex:0 0 auto}
        .defbtn:active{background:var(--surface-2)}.defbtn.has{background:var(--red-bg);color:var(--red);border-color:transparent}
        .done-tag{padding:7px 14px;border-radius:999px;background:var(--green-bg);color:var(--green);font-weight:800;font-size:14px}

        .actionbar{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);
            padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;
            box-shadow:0 -8px 24px -18px rgba(21,34,43,.4)}
        .actionbar .actsum{display:flex;flex-direction:column;margin-right:auto}
        .actionbar .actsum .l{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .actionbar .actsum .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
        .btn{min-height:var(--tap);padding:0 24px;border-radius:16px;border:none;cursor:pointer;font-size:18px;font-weight:800;display:inline-flex;align-items:center;gap:8px}
        .btn.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}.btn.ghost:active{background:var(--line)}
        .btn.primary{background:var(--teal);color:#fff;padding:0 36px;box-shadow:0 8px 18px -8px rgba(14,124,134,.7)}.btn.primary:active{background:var(--teal-d)}
        .btn.start{background:var(--teal);color:#fff;flex:1;justify-content:center;font-size:20px}
        .btn.danger{background:var(--red-bg);color:var(--red)}

        /* 시트 */
        .pad .disp{margin-left:auto;min-width:140px;text-align:right;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px 16px}
        .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;margin:6px auto 0}
        .keys button{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:25px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
        .keys button:active{background:var(--surface-2)}.keys button.ok{background:var(--teal);color:#fff;border-color:var(--teal)}.keys button.clr{color:var(--red)}
        .wcard{cursor:pointer}
        .wcard.sel{border-color:var(--teal) !important;box-shadow:0 0 0 2px var(--teal-bg)}
        .wchk{width:30px;height:30px;border:2px solid var(--line);border-radius:9px;flex:0 0 auto;display:grid;place-items:center;font-weight:900}
        .wchk.on{background:var(--teal);border-color:var(--teal);color:#fff}
        .mask{position:fixed;inset:0;background:rgba(21,34,43,.42);display:none;z-index:40;align-items:flex-end}        .mask.show{display:flex;animation:fade .15s ease}@keyframes fade{from{opacity:0}to{opacity:1}}
        .sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 20px calc(40px + env(safe-area-inset-bottom));
            box-shadow:0 -20px 40px -20px rgba(0,0,0,.4);animation:rise .2s cubic-bezier(.2,.7,.3,1);max-height:88dvh;overflow:auto}
        @keyframes rise{from{transform:translateY(40px)}to{transform:translateY(0)}}
        .sheet .sh{display:flex;align-items:center;margin-bottom:16px}
        .sheet .sh h3{font-size:20px;font-weight:800;margin:0;letter-spacing:-.02em}
        .sheet .sh .x{margin-left:auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;cursor:pointer}
        .sheet .body{max-width:640px;margin:0 auto}
        .fieldlab{font-size:14px;font-weight:800;color:var(--ink-2);margin:14px 2px 8px}
        .opts{display:flex;flex-wrap:wrap;gap:10px}
        .opt{min-height:54px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
        .opt:active{background:var(--surface-2)}.opt.sel{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-d)}
        .opt .sub{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .sheet .ok{width:100%;margin-top:20px;background:var(--teal);color:#fff;min-height:var(--tap);border:none;border-radius:16px;font-size:19px;font-weight:800;cursor:pointer}
        .sheet .ok:disabled{background:var(--line);color:var(--ink-2)}
        .pad .disp{margin-left:auto;min-width:140px;text-align:right;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px 16px}
        .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;margin:6px auto 0}
        .keys button{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:25px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
        .keys button:active{background:var(--surface-2)}.keys button.ok{background:var(--teal);color:#fff;border-color:var(--teal)}.keys button.clr{color:var(--red)}
        .dateedit{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 10px}
        .dateedit .dbtn{width:56px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700;cursor:pointer}
        .dateedit .dbtn:active{background:var(--line)}
        .dateedit .dval{min-width:200px;text-align:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
        .timeedit{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0}
        .tcol{display:flex;flex-direction:column;align-items:center;gap:8px}
        .tcol button{width:84px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:700;cursor:pointer}
        .tcol .tv{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;width:84px;text-align:center}
        .tsep{font-size:40px;font-weight:800;padding-bottom:4px}
        .photos{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
        .photo{width:84px;height:84px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
        .photo-add{width:84px;height:84px;border-radius:12px;border:1.5px dashed var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);font-size:13px;font-weight:800;text-align:center}
        .photo-wrap{position:relative}
        .photo-wrap .del{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;border:2px solid #fff;font-size:13px;cursor:pointer;line-height:1}
        @media (max-width:680px){.part .stat{order:3;width:100%;justify-content:space-between}.qgrid{grid-template-columns:1fr}.sess{flex-wrap:wrap}}
        @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}


        /* ── 멸균일지/그래프 ── */
        .ms-wash-root .log-step{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:var(--surface)}
        .ms-wash-root .log-step .h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
        .ms-wash-root .log-step .no{width:30px;height:30px;border-radius:8px;background:var(--teal-bg);color:var(--teal-d);font-weight:800;display:grid;place-items:center;font-size:14px}
        .ms-wash-root .log-step .nm{font-weight:800;font-size:16px}
        .ms-wash-root .log-step .crit{font-size:12.5px;color:var(--ink-2);font-weight:700;margin-left:auto;text-align:right;max-width:50%}
        .ms-wash-root .log-field{display:flex;align-items:center;gap:8px;margin-top:6px}
        .ms-wash-root .log-field label{font-size:13px;color:var(--ink-2);font-weight:700;min-width:84px}
        .ms-wash-root .log-field input{flex:1;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:15px;font-weight:700;background:var(--surface-2)}
        .ms-wash-root .upbox{border:1.5px dashed var(--teal);border-radius:14px;padding:18px;text-align:center;background:#F0FAFB;cursor:pointer}
        .ms-wash-root .upbox .ic{font-size:30px}
        .ms-wash-root .chartwrap{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
        .ms-wash-root .chart-svg{width:100%;height:200px;display:block}
        .ms-wash-root .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
        .ms-wash-root .legend{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--ink-2);flex-wrap:wrap}
        .ms-wash-root .legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}

        /* ── 바코드/출력/품목 ── */
        .ms-wash-root .fam-badge{padding:4px 10px;border-radius:8px;font-size:12px;font-weight:800;margin-left:6px}
        .ms-wash-root .fam-badge.bsc{background:#E2F1F2;color:#0A5C64}
        .ms-wash-root .fam-badge.mcell{background:#EEE7FA;color:#6B3FA0}
        .ms-wash-root .lotopt{min-height:72px;padding:18px 18px}      /* 터치 크게 */
        .ms-wash-root .lotopt .ln{font-size:18px}
        .ms-wash-root .lotopt.sel{box-shadow:0 0 0 3px var(--teal-bg)}
        .ms-wash-root .lotstep{display:flex;align-items:center;margin-left:auto}
        .ms-wash-root .lotstep button{width:48px;height:50px;border:1px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:700;cursor:pointer}
        .ms-wash-root .lotstep button:first-child{border-radius:12px 0 0 12px}
        .ms-wash-root .lotstep button:last-child{border-radius:0 12px 12px 0}
        .ms-wash-root .lotstep .n{width:64px;height:50px;display:grid;place-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums;background:#FFFDF4}
        .ms-wash-root .bc{font-family:'Libre Barcode 128',monospace}

<th:block layout:fragment="scripts">
    <script th:inline="none">
        /* ── 높이 자동 맞쫐 ──
           root 윗변 위치(=상단 헤더 높이)를 실측하고, 페이지 푸터 높이를 빼서
           root 높이를 화면 바닥(푸터 위)까지 정확히 채운다.
           헤더/푸터 크기가 바뀜도 actionbar(시작/완료)가 푸터에 가리지 않음. */
        (function () {
            const root = document.querySelector('.ms-wash-root');
            if (!root) return;

            // 내부(같은 문서) 푸터: 흐름 형제 + fixed/sticky
            function localBelow() {
                let below = 0, node = root;
                while (node && node !== document.body) {
                    let sib = node.nextElementSibling;
                    while (sib) {
                        const r = sib.getBoundingClientRect();
                        if (r.height > 0 && getComputedStyle(sib).position !== 'fixed') below += r.height;
                        sib = sib.nextElementSibling;
                    }
                    node = node.parentElement;
                }
                let fx = 0;
                document.querySelectorAll('body *').forEach(el => {
                    if (root.contains(el)) return;
                    const cs = getComputedStyle(el);
                    if (cs.position !== 'fixed' && cs.position !== 'sticky') return;
                    const r = el.getBoundingClientRect();
                    if (r.height > 0 && r.height < innerHeight * 0.5 && r.bottom > innerHeight - 2) fx = Math.max(fx, r.height);
                });
                return Math.max(below, fx);
            }

            // 화면에서 실제로 사용 가능한 바닥(px, iframe 내부 좌표). 부모 푸터까지 고려.
            function availBottom() {
                let bottom = window.innerHeight;          // 기본: iframe 자체 높이
                try {
                    const fe = window.frameElement;       // 같은 출처일 때만 접근 가능
                    if (fe) {
                        const pWin = window.parent, pDoc = pWin.document;
                        const feTop = fe.getBoundingClientRect().top;   // 부모 좌표계 iframe 상단
                        // (1) 흐름상 iframe 뒤에 오는 형제(푸터) 높이 합
                        let flow = 0, node = fe;
                        while (node && node !== pDoc.body) {
                            let sib = node.nextElementSibling;
                            while (sib) {
                                const cs = pWin.getComputedStyle(sib), r = sib.getBoundingClientRect();
                                if (r.height > 0 && cs.position !== 'fixed' && cs.position !== 'absolute') flow += r.height;
                                sib = sib.nextElementSibling;
                            }
                            node = node.parentElement;
                        }
                        // (2) 부모 바닥에 걸친 푸터 바(fixed/sticky/absolute, 작은 높이만 인정)
                        let fx = 0;
                        pDoc.querySelectorAll('body *').forEach(el => {
                            if (el === fe || el.contains(fe)) return;
                            const cs = pWin.getComputedStyle(el);
                            if (cs.position !== 'fixed' && cs.position !== 'sticky' && cs.position !== 'absolute') return;
                            const r = el.getBoundingClientRect();
                            if (r.height > 0 && r.height <= 160 && r.top > feTop && r.bottom > pWin.innerHeight - 40)
                                fx = Math.max(fx, r.bottom - r.top);
                        });
                        const pFooter = Math.max(flow, fx);
                        // 부모 가용 바닥(부모 좌표) → iframe 내부 좌표로 환산
                        bottom = Math.min(bottom, (pWin.innerHeight - pFooter) - feTop);
                    }
                } catch (e) {/* 교차 출처: iframe 자체 높이로 폴백 */
                }
                return bottom;
            }

            function fit() {
                const top = root.getBoundingClientRect().top;
                const avail = availBottom() - top - localBelow();
                root.style.setProperty('--wash-h', Math.max(320, Math.floor(avail)) + 'px');
            }

            window.addEventListener('resize', fit);
            window.addEventListener('orientationchange', fit);
            try {
                window.parent.addEventListener('resize', fit);
            } catch (e) {
            }
            fit();
            requestAnimationFrame(fit);
            setTimeout(fit, 200);
            setTimeout(fit, 600);
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
        })();

        /* =====================================================================
           멸균(EO, bsc04) 태블릿 — 2단 배치(배치 > 담긴 로트) + 멸균일지 + BI 판정
           /api/production/steril/* 연동. 세척과 동일하게 별도 컨트롤러/서비스.
           흐름: 대기(클린룸 SterilizationYN='Y' 로트) 선택 → 배치 생성 → 로트 담기
                → 멸균일지 입력 → BI PASS(멸균창고 이동) / FAIL(전량 폐기)

        const CTX = Object.assign({spjangcd: 'ZZ', factoryId: '', dayRange: 30}, window.STERIL_CTX || {});
        const BASE = '/api/production/steril';
        let STERIL_WC = null, IN_STORE = 5, OUT_STORE = 18;

        function apiGet(path, params) {
            if (typeof AjaxUtil !== 'undefined' && AjaxUtil.getSyncData) return AjaxUtil.getSyncData(BASE + path, params || {}) || {};
            flash('AjaxUtil 미로드 — 공용 스크립트 로드 순서를 확인하세요');

                    r = r || {};
                    if (r.success === false) {
                        flash(r.message || '처리에 실패했습니다');
                        return;
                    }
                    cb && cb(r);
                });
                return;
            }
            flash('AjaxUtil 미로드 — 공용 스크립트 로드 순서를 확인하세요');
        }

        function combo(comboType, cond1, cond2, cond3) {
            if (typeof AjaxUtil === 'undefined' || !AjaxUtil.getSyncData) return [];
            var r = AjaxUtil.getSyncData('/api/common/combo', {

        // ── 시트/토스트 공통 ──
        function showMask(id) {

        document.querySelectorAll('.mask').forEach(function (m) {

        var _toastT;

        function flash(m) {
            var t = document.getElementById('toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'toast';
                t.style.cssText = 'position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#15222B;color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;z-index:90;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:opacity .3s;max-width:90vw;text-align:center';
                document.body.appendChild(t);
            }
            t.textContent = m;
            t.style.opacity = '1';
            clearTimeout(_toastT);
            _toastT = setTimeout(function () {
                t.style.opacity = '0';
            }, 1800);
        }

        function uiConfirm(msg, onOk, okLabel) {
            var m = document.getElementById('confirmMask');
            if (!m) {
                m = document.createElement('div');
                m.id = 'confirmMask';
                m.style.cssText = 'position:fixed;inset:0;background:rgba(21,34,43,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:24px';
                m.innerHTML = '<div style="background:var(--surface);border-radius:20px;max-width:420px;width:100%;padding:24px 22px 18px;box-shadow:0 20px 50px -12px rgba(0,0,0,.4)"><div id="confirmMsg" style="font-size:17px;font-weight:800;color:var(--ink);line-height:1.5;margin-bottom:20px;white-space:pre-line"></div><div style="display:flex;gap:10px"><button id="confirmCancel" style="flex:1;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font-weight:800;font-size:16px">취소</button><button id="confirmOk" style="flex:1;height:52px;border-radius:14px;border:none;background:#0E7C86;color:#fff;font-weight:800;font-size:16px">확인</button></div></div>';
                document.body.appendChild(m);
                m.addEventListener('click', function (e) {
                    if (e.target === m) m.style.display = 'none';
                });
            }
            m.querySelector('#confirmMsg').textContent = msg;
            var ok = m.querySelector('#confirmOk'), cancel = m.querySelector('#confirmCancel');
            ok.textContent = okLabel || '확인';
            var close = function () {
                m.style.display = 'none';
                ok.onclick = null;
                cancel.onclick = null;
            };
            ok.onclick = function () {
                close();
                onOk && onOk();
            };
            cancel.onclick = close;
            m.style.display = 'flex';
        }

        // ── 화면 전환 ──
        const SC = {
            A: document.getElementById('scA'),
            B: document.getElementById('scB'),
            C: document.getElementById('scC')
        };

        function show(k) {
            for (var x in SC) SC[x].classList.toggle('hide', x !== k);
        }

        document.querySelectorAll('[data-back]').forEach(function (b) {
            b.addEventListener('click', function () {
                refreshQueue();
                show('A');
            });
        });

        // ── 부팅 ── (모든 상태변수 초기화 이후 실행되도록 스크립트 끝에서 호출)
        function boot() {
            var r = apiGet('/context', {factory_id: CTX.factoryId || ''});
            var c = r.data || {};
            STERIL_WC = c.work_center_id || null;
            IN_STORE = c.in_store_id || 5;
            OUT_STORE = c.out_store_id || 18;
            loadEquips();
            initDates();
            show('A');
            document.getElementById('waitPane').style.display = '';
            document.getElementById('qgrid').style.display = 'none';
            loadWait();
        }

        // ── 모드(대기/배치) + 필터 + 조회 ──
        var mode = 'wait', qfilter = 'all';

        function initDates() {
            var t = todayStr(), f = shiftDay(t, -CTX.dayRange);
            document.getElementById('dFrom').value = f;
            document.getElementById('dTo').value = t;
        }

        function refreshQueue() {
            if (mode === 'wait') loadWait(); else renderQueue();
        }

        document.querySelectorAll('[data-mode]').forEach(function (b) {
            b.addEventListener('click', function () {
                document.querySelectorAll('[data-mode]').forEach(function (x) {
                    x.classList.remove('on');
                });
                b.classList.add('on');
                mode = b.dataset.mode;
                var isWait = mode === 'wait';
                document.getElementById('waitPane').style.display = isWait ? '' : 'none';
                document.getElementById('qgrid').style.display = isWait ? 'none' : '';
                document.getElementById('batchFilter').style.display = isWait ? 'none' : 'flex';
                document.getElementById('batchSearchbar').style.display = isWait ? 'none' : 'flex';
                document.getElementById('scaTitle').textContent = isWait ? '멸균 대기' : '멸균 작업';
                if (isWait) loadWait(); else renderQueue();
            });
        });
        document.querySelectorAll('#batchFilter button').forEach(function (b) {
            b.addEventListener('click', function () {
                document.querySelectorAll('#batchFilter button').forEach(function (x) {
                    x.classList.remove('on');
                });
                b.classList.add('on');
                qfilter = b.dataset.f;
                renderQueue();
            });
        });
        document.getElementById('btnSearch').addEventListener('click', renderQueue);

        // ── 대기: 클린룸 SterilizationYN='Y' 로트 ──
        var TARGET = [], waitSel = {}, waitQty = {};

        function tOf(id) {
            return TARGET.filter(function (x) {
                return x.mat_lot_id == id;
            })[0];
        }

        function loadWait() {
            var r = apiGet('/target_lots', {spjangcd: CTX.spjangcd});
            TARGET = (r.data || []).map(function (l) {
                return {
                    mat_lot_id: l.mat_lot_id,
                    lot: l.lot_no,
                    mat_id: l.mat_id,
                    name: l.mat_name,
                    code: l.mat_code,
                    avail: num(l.avail),
                    in_date: l.in_date
                };
            });
            drawWait();
        }

        function drawWait() {
            document.getElementById('qcnt').textContent = TARGET.length + '건';
            var box = document.getElementById('waitList');
            if (!box) {
                flash('waitList 영역을 찾지 못했습니다');
                return;
            }
            if (!TARGET.length) {
                box.innerHTML = '<div class="emptysess">멸균 대기 로트가 없습니다.<br>클린룸(5)에 SterilizationYN=Y 재고가 있어야 합니다.</div>';
                return;
            }
            box.innerHTML = TARGET.map(function (l) {
                if (waitQty[l.mat_lot_id] == null) waitQty[l.mat_lot_id] = l.avail;
                var q = Math.min(waitQty[l.mat_lot_id], l.avail);
                if (q < 1) q = 1;
                waitQty[l.mat_lot_id] = q;
                var sel = !!waitSel[l.mat_lot_id];
                return '<div class="wo wcard' + (sel ? ' sel' : '') + '" data-st="wait" data-wcard="' + l.mat_lot_id + '" style="min-height:96px"><div class="edge"></div>' +
                    '<div style="display:flex;align-items:center;gap:12px">' +
                    '<div class="wchk' + (sel ? ' on' : '') + '">' + (sel ? '✓' : '') + '</div>' +
                    '<div style="flex:1;min-width:0"><div style="font-weight:800">' + l.lot + '</div>' +
                    '<div class="meta">' + l.name + ' · ' + l.code + ' · 가용 ' + l.avail + '</div></div></div>' +
                    '<div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:12px">' +
                    '<span class="meta">담을 수량</span>' +
                    '<div class="stepper"><button class="minus" data-wminus="' + l.mat_lot_id + '">−</button>' +
                    '<div class="qty" data-wpad="' + l.mat_lot_id + '">' + q + '</div>' +
                    '<button class="plus" data-wplus="' + l.mat_lot_id + '">+</button></div></div></div>';
            }).join('');
        }

        document.getElementById('waitList').addEventListener('click', function (e) {
            var m = e.target.closest('[data-wminus]');
            if (m) {
                var id = m.dataset.wminus;
                waitQty[id] = Math.max(1, (waitQty[id] || 1) - 1);
                drawWait();
                return;
            }
            var p = e.target.closest('[data-wplus]');
            if (p) {
                var id = p.dataset.wplus;
                var t = tOf(id);
                waitQty[id] = Math.min(t ? t.avail : 1, (waitQty[id] || 1) + 1);
                drawWait();
                return;
            }
            var pd = e.target.closest('[data-wpad]');
            if (pd) {
                var id = pd.dataset.wpad;
                var t = tOf(id);
                openQtyPad('담을 수량', waitQty[id] || 1, t ? t.avail : 1, function (v) {
                    waitQty[id] = v;
                    drawWait();
                });
                return;
            }
            var c = e.target.closest('[data-wcard]');
            if (c) {
                var id = c.dataset.wcard;
                waitSel[id] = !waitSel[id];
                drawWait();
            }
        });
        var EQUIPS = [], pendingSel = [], startEquip = null;

        function loadEquips() {
            EQUIPS = STERIL_WC ? combo('equipment', '', '', STERIL_WC) : combo('equipment');
        }

        document.getElementById('btnCreateFromWait').addEventListener('click', function () {
            var sel = Object.keys(waitSel).filter(function (k) {
                return waitSel[k];
            });
            if (!sel.length) {
                flash('멸균할 로트를 선택하세요');
                return;
            }
            pendingSel = sel;
            openStartSheet();
        });

        function openStartSheet() {
            startEquip = null;
            if (!EQUIPS.length) loadEquips();
            var body = document.querySelector('#startMask .body');
            body.innerHTML = '<div class="sh"><h3>멸균 작업 시작</h3><button class="x" data-close>✕</button></div>' +
                '<div style="color:var(--ink-2);font-weight:700;font-size:13px;margin:2px 2px 12px">담당자는 로그인 사용자로 자동 지정됩니다.</div>' +
                '<div class="fieldlab">멸균기</div><div class="opts" id="equipOpts">' +
                (EQUIPS.length ? EQUIPS.map(function (e) {
                        return '<button class="opt" data-eq="' + e.value + '">' + e.text + '</button>';
                    }).join('')
                    : '<div style="color:var(--ink-2);font-weight:700">등록된 멸균기가 없습니다 · 멸균기 없이 시작</div>') +
                '</div><button class="ok" id="startOk"' + (EQUIPS.length ? ' disabled' : '') + '>' + (EQUIPS.length ? '멸균기를 선택하세요' : '멸균기 없이 시작') + '</button>';
            showMask('startMask');
        }

        document.getElementById('startMask').addEventListener('click', function (e) {
            var eq = e.target.closest('[data-eq]');
            if (eq) {
                startEquip = eq.dataset.eq;
                this.querySelectorAll('#equipOpts .opt').forEach(function (b) {
                    b.classList.remove('sel');
                });
                eq.classList.add('sel');
                var ok = document.getElementById('startOk');
                ok.disabled = false;
                ok.textContent = '이 멸균기로 시작';
                return;
            }
            if (e.target.closest('#startOk')) {
                hideMask('startMask');
                createBatch();
            }
        });

        function createBatch() {
            apiPost('/batch_start', {
                date: todayStr(),
                equipment_id: startEquip || '',
                spjangcd: CTX.spjangcd
            }, function (r) {
                var batchId = r.data.batch_id, i = 0, sel = pendingSel;
                (function addNext() {
                    if (i >= sel.length) {
                        flash('멸균 배치 생성 · ' + sel.length + '개 로트');
                        waitSel = {};
                        waitQty = {};
                        openBatch(batchId);
                        return;
                    }
                    var id = sel[i++], t = tOf(id), q = Math.min(t.avail, Math.max(1, waitQty[id] || t.avail));
                    apiPost('/lot_add', {
                        batch_id: batchId,
                        mat_lot_id: id,
                        qty: q,
                        spjangcd: CTX.spjangcd
                    }, function () {
                        addNext();
                    });
                })();
            });
        }

        // ── 배치 큐 ──
        var BATCHES = [];

        function renderQueue() {
            var r = apiGet('/batch_list', {
                date_from: document.getElementById('dFrom').value,
                date_to: document.getElementById('dTo').value,
                spjangcd: CTX.spjangcd
            });
            var all = (r.data || []);
            BATCHES = all.filter(function (o) {
                if (qfilter === 'all') return true;
                if (qfilter === 'working') return o.state === 'working';
                if (qfilter === 'wait') return o.state === 'working' && num(o.item_cnt) === 0;
                return true;
            });
            document.getElementById('qcnt').textContent = BATCHES.length + '건';
            var box = document.getElementById('qgrid');
            if (!BATCHES.length) {
                box.innerHTML = '<div class="emptysess">해당 조건의 배치가 없습니다.</div>';
                return;
            }
            box.innerHTML = BATCHES.map(function (o) {
                var st = (o.state === 'working' || o.state === 'wait') ? 'working' : 'done';
                var badge = o.state === 'scrapped' ? '폐기' : (o.state === 'done' ? '멸균필' : (o.state === 'wait' ? '대기' : '작업중'));
                var bi = o.bi_result === 'pass' ? '합격' : (o.bi_result === 'fail' ? '불합격' : '판정전');
                return '<div class="wo" data-st="' + st + '" data-id="' + o.batch_id + '"><div class="edge"></div>' +
                    '<div class="row1"><span class="wono">' + (o.batch_no || ('배치 ' + o.batch_id)) + '</span>' +
                    '<span style="font-size:13px;color:var(--ink-2);font-weight:700">' + o.steril_date + '</span>' +
                    '<span class="chip ' + st + '">' + badge + '</span></div>' +
                    '<div style="font-size:13.5px;color:var(--ink-2);font-weight:700;margin:2px 0 12px">로트 ' + num(o.item_cnt) + '건 · ' + num(o.total_qty) + ' EA · BI ' + bi + (o.maker_lot_no ? ' · ' + o.maker_lot_no : '') + '</div>' +
                    '<div class="meta" style="display:flex;gap:18px">' +
                    '<div class="blk"><span class="lab">담당</span><span class="val">' + currentUser() + '</span></div>' +
                    '<div class="blk"><span class="lab">멸균기</span><span class="val">' + (o.equip_name || '-') + '</span></div></div></div>';
            }).join('');
        }

        document.getElementById('qgrid').addEventListener('click', function (e) {
            var c = e.target.closest('.wo');
            if (c) openBatch(+c.dataset.id);
        });

        // ── 배치 상세 (scC) ──
        var curB = null;

        function locked() {
            return !curB || (curB.state !== 'working' && curB.state !== 'wait');
        }

        function batchQty() {
            return (curB.items || []).reduce(function (a, i) {
                return a + num(i.qty);
            }, 0);
        }

        function openBatch(batchId) {
            var r = apiGet('/batch_detail', {batch_id: batchId});
            curB = r.data;
            if (!curB) {
                flash('배치를 찾을 수 없습니다');
                return;
            }
            curB._log = {};
            (curB.log || []).forEach(function (s) {
                try {
                    var d = JSON.parse(s.data || '{}');
                    Object.keys(d).forEach(function (k) {
                        curB._log[s.step_no + '_' + k] = d[k];
                    });
                } catch (e) {
                }
            });
            document.getElementById('cName').textContent = (curB.batch_no || ('배치 ' + batchId));
            document.getElementById('cSub').textContent = curB.steril_date + ' · 멸균기 ' + (curB.equip_name || '-');
            document.getElementById('btnDelOrder').style.display = locked() ? 'none' : '';
            renderCHead();
            renderCBody();
            renderCAction();
            show('C');
        }

        function currentUser() {
            try {
                return sessionStorage.getItem('username') || sessionStorage.getItem('userId') || sessionStorage.getItem('userid') || '-';
            } catch (e) {
                return '-';
            }
        }

        function renderCHead() {
            var lk = locked();
            document.getElementById('cHead').innerHTML =
                '<div class="infopill"><span>담당</span><b>' + currentUser() + '</b></div>' +
                '<div class="infopill tap" data-time="start"><span>시작</span><b>' + pill(curB.start_time) + '</b></div>' +
                '<div class="infopill tap" data-time="end"><span>종료</span><b>' + pill(curB.end_time) + '</b></div>' +
                '<div class="infopill big"><span>멸균수량</span><b>' + batchQty() + '</b></div>';
        }

        document.getElementById('cHead').addEventListener('click', function (e) {
            var t = e.target.closest('[data-time]');
            if (t) openTime(t.dataset.time);   // 시간은 판정 후에도 수정 가능
        });

        function renderCBody() {
            var lk = locked(), html = '';
            if (curB.bi_result === 'fail') html += '<div class="warn-banner">⚠ BI 불합격 — 전량 폐기된 배치입니다.</div>';
            if (curB.state === 'done') html += '<div class="secline" style="color:var(--green)">멸균필 · 멸균창고 이동 완료 <span class="ln"></span></div>';
            // 담긴 로트
            html += '<div class="secline">멸균 대상 로트 <span class="ln"></span><span>' + (curB.items || []).length + '건 · ' + batchQty() + ' EA</span></div>';
            html += (curB.items || []).map(function (l, idx) {
                var mark = l.state === 'moved' ? ' · 멸균필' : (l.state === 'scrapped' ? ' · 폐기' : '');
                var ctrl = lk
                    ? '<span style="margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums">' + num(l.qty) + ' EA</span>'
                    : '<div class="stepper" data-lotstep="' + idx + '" style="margin-left:auto"><button class="minus">−</button>' +
                    '<div class="qty" data-lotpad="' + idx + '">' + num(l.qty) + '</div><button class="plus">+</button></div>' +
                    '<button class="defbtn" data-rmitem="' + l.item_id + '" style="margin-left:8px">제외</button>';
                return '<div class="part"><div class="id"><span class="pn">' + l.lot_no + '</span>' +
                    '<span class="pc">' + l.mat_name + ' · 가용 ' + num(l.lot_avail) + mark + '</span></div>' + ctrl + '</div>';
            }).join('');
            if (!lk) html += '<div style="margin:6px 2px"><button class="btn ghost" id="addLot" style="width:100%">＋ 로트 담기</button></div>';
            // 멸균 데이터(USB) — 태블릿은 파일 첨부만. F710-3 10단계 일지는 PC 관리화면.
            html += '<div class="secline">멸균 데이터(USB) <span class="ln"></span><span>판정 후에도 첨부 가능 · 일지 작성은 PC</span></div>';
            html += '<div class="part"><div class="id"><span class="pn">USB 데이터 파일</span>' +
                '<span class="pc">초단위 온·습도·압력 파싱과 F710-3 10단계 일지는 <b>PC 관리화면</b>에서 작성합니다. 태블릿은 파일만 받아둡니다.</span></div>' +
                '<label class="btn ghost" style="min-height:44px;cursor:pointer;margin-left:auto">＋ USB 파일<input type="file" id="usbFile" accept=".xlsx,.xls,.csv,.txt" multiple style="display:none"></label></div>';
            html += '<div id="usbInfo" style="font-size:12.5px;color:var(--ink-2);font-weight:700;margin:4px 2px 0"></div>';
            // 업체 로트번호 (완료·합격 시)
            if (curB.state === 'done' && curB.maker_lot_no) {
                html += '<div class="secline">업체 로트번호 <span class="ln"></span></div>';
                html += '<div class="part"><div class="id"><span class="pn">' + curB.maker_lot_no + '</span><span class="pc">멸균필 로트에 부여됨 (MakerLotNo)</span></div></div>';
            }
            // BI
            html += '<div class="secline">멸균검증(BI) 판정 <span class="ln"></span><span></span></div>';
            html += '<div class="judge"><button class="pass ' + (curB.bi_result === 'pass' ? 'on' : '') + '" ' + (lk ? 'disabled' : '') + ' data-bi="pass">합격 PASS</button>' +
                '<button class="fail ' + (curB.bi_result === 'fail' ? 'on' : '') + '" ' + (lk ? 'disabled' : '') + ' data-bi="fail">불합격 FAIL</button></div>';
            document.getElementById('cBody').innerHTML = html;
        }

        function renderCAction() {
            var bar = document.getElementById('cAction');
            if (locked()) {
                var lab = curB.state === 'scrapped'
                    ? '<span class="v" style="color:var(--red);font-size:16px">전량 폐기</span>'
                    : '<span class="v" style="color:var(--green);font-size:16px">멸균필</span>';
                bar.innerHTML = '<div class="actsum"><span class="l">결과</span>' + lab +
                    (curB.maker_lot_no ? '<span class="l">로트 ' + curB.maker_lot_no + '</span>' : '') + '</div>' +
                    '<button class="btn danger" id="cCancel">판정취소</button>';
                document.getElementById('cCancel').onclick = function () {
                    var msg = curB.state === 'scrapped'
                        ? '폐기 판정을 취소하고 폐기된 재고를 클린룸으로 되돌립니다. 계속할까요?'
                        : '합격 판정을 취소합니다. 멸균창고 로트를 삭제하고 클린룸 재고를 되돌립니다. 계속할까요?';
                    uiConfirm(msg, function () {
                        apiPost('/bi_cancel', {batch_id: curB.batch_id}, function () {
                            flash('판정취소 · 작업중 복귀 (재고 원복)');
                            openBatch(curB.batch_id);
                        });
                    }, '판정취소');
                };
            } else {
                bar.innerHTML = '<div class="actsum"><span class="l">멸균수량</span><span class="v">' + batchQty() + ' EA</span></div>' +
                    '<span class="l" style="color:var(--ink-2);font-weight:700">BI 판정으로 완료/폐기</span>';
            }
        }

        // USB 파일 첨부 (태블릿: 받아두기만, 파싱·일지는 PC)
        document.getElementById('cBody').addEventListener('change', function (e) {
            var fi = e.target.closest('#usbFile');
            if (!fi) return;
            var n = (fi.files || []).length;
            var info = document.getElementById('usbInfo');
            if (info) info.textContent = n ? ('USB 파일 ' + n + '개 받아둠 — 파싱·그래프·10단계 일지는 PC 관리화면에서 작성합니다.') : '';
            flash(n ? ('USB 파일 ' + n + '개 첨부') : '');
        });
        // BI / 제외 / 로트담기 / 담긴 로트 수량 조절
        document.getElementById('cBody').addEventListener('click', function (e) {
            var bi = e.target.closest('[data-bi]');
            if (bi && !locked()) {
                judgeBI(bi.dataset.bi);
                return;
            }
            var rm = e.target.closest('[data-rmitem]');
            if (rm) {
                apiPost('/lot_remove', {item_id: +rm.dataset.rmitem}, function () {
                    openBatch(curB.batch_id);
                });
                return;
            }
            if (e.target.closest('#addLot')) {
                openLotSheet();
                return;
            }
            if (locked()) return;
            var st = e.target.closest('[data-lotstep]');
            if (st) {
                var idx = +st.dataset.lotstep,
                    d = e.target.classList.contains('plus') ? 1 : (e.target.classList.contains('minus') ? -1 : 0);
                if (d) bumpLotQty(idx, d);
                return;
            }
            var pd = e.target.closest('[data-lotpad]');
            if (pd) {
                var idx = +pd.dataset.lotpad, l = curB.items[idx];
                if (l) openQtyPad('담을 수량', num(l.qty), num(l.lot_avail), function (v) {
                    saveLotQty(idx, v);
                });
                return;
            }
        });

        function bumpLotQty(idx, d) {
            var l = curB.items[idx];
            if (!l) return;
            var max = num(l.lot_avail), q = num(l.qty) + d;
            if (q < 1) q = 1;
            if (q > max) {
                q = max;
                flash('가용 ' + max + ' 초과');
            }
            saveLotQty(idx, q);
        }

        function saveLotQty(idx, q) {
            var l = curB.items[idx];
            if (!l) return;
            var max = num(l.lot_avail);
            if (q < 1) q = 1;
            if (q > max) q = max;
            l.qty = q;
            renderCBody();
            renderCHead();
            renderCAction();
            apiPost('/lot_add', {
                batch_id: curB.batch_id,
                mat_lot_id: l.mat_lot_id,
                qty: q,
                spjangcd: CTX.spjangcd
            }, function () {
            });
        }

        function judgeBI(result) {
            // 태블릿엔 별도 시작 버튼이 없다 → 아직 '대기'면 판정 시 시작 시각을 기록해 working 으로 전이
            if (curB.state === 'wait') {
                apiPost('/batch_time', {batch_id: curB.batch_id, start_time: curB.start_time || nowHM()}, function () {
                    curB.state = 'working';
                    doJudge(result);
                });
                return;
            }
            doJudge(result);
        }

        function doJudge(result) {
            if (result === 'pass') {
                var def = 'BMJ' + todayStr().replace(/-/g, '');
                askMakerLot(def, function (maker) {
                    apiPost('/bi_judge', {
                        batch_id: curB.batch_id,
                        result: 'pass',
                        maker_lot_no: maker,
                        spjangcd: CTX.spjangcd
                    }, function () {
                        flash('멸균 완료 · 멸균창고 이동 · 로트 ' + maker);
                        refreshQueue();
                        show('A');
                    });
                });
            } else {
                uiConfirm('BI 불합격 — 이 배치 전량을 폐기합니다. (클린룸 재고에서 폐기 처리) 계속할까요?', function () {
                    apiPost('/bi_judge', {
                        batch_id: curB.batch_id,
                        result: 'fail',
                        spjangcd: CTX.spjangcd
                    }, function () {
                        flash('멸균 FAIL · 전량 폐기');
                        refreshQueue();
                        show('A');
                    });
                }, '전량 폐기');
            }
        }

        // 업체 로트번호 입력 시트 (합격 시)
        function askMakerLot(defVal, onOk) {
            var m = document.getElementById('makerMask');
            if (!m) {
                m = document.createElement('div');
                m.id = 'makerMask';
                m.className = 'mask';
                m.innerHTML = '<div class="sheet"><div class="body"><div class="sh"><h3>업체 로트번호 입력</h3><button class="x" data-close>✕</button></div>' +
                    '<div style="color:var(--ink-2);font-weight:700;font-size:13.5px;margin:2px 2px 12px">합격 시 이 배치의 멸균필 로트에 부여할 업체 로트번호입니다. 기본값을 확인·수정하세요.</div>' +
                    '<input id="makerInput" style="width:100%;height:58px;border:1px solid var(--line);border-radius:14px;padding:0 16px;font-size:21px;font-weight:800;background:var(--surface-2)"/>' +
                    '<button class="ok" id="makerOk">합격 처리 · 멸균필</button></div></div>';
                document.body.appendChild(m);
                m.addEventListener('click', function (e) {
                    if (e.target === m || (e.target.closest && e.target.closest('[data-close]'))) m.classList.remove('show');
                });
            }
            m.querySelector('#makerInput').value = defVal || '';
            m.querySelector('#makerOk').onclick = function () {
                var v = m.querySelector('#makerInput').value.trim();
                if (!v) {
                    flash('업체 로트번호를 입력하세요');
                    return;
                }
                m.classList.remove('show');
                onOk(v);
            };
            m.classList.add('show');
            setTimeout(function () {
                try {
                    m.querySelector('#makerInput').focus();
                } catch (e) {
                }
            }, 60);
        }

        // 배치 삭제
        document.getElementById('btnDelOrder').addEventListener('click', function () {
            if (!curB) return;
            if (locked()) {
                flash('판정된 배치는 삭제할 수 없습니다');
                return;
            }
            uiConfirm('이 배치를 삭제하시겠습니까?', function () {
                apiPost('/batch_delete', {batch_id: curB.batch_id}, function () {
                    flash('배치 삭제');
                    refreshQueue();
                    show('A');
                });
            }, '삭제');
        });

        // 로트 담기 시트 — 목업 스타일(.lotopt), 탭하여 수량 선택
        var LOTPICK = [];

        function openLotSheet() {
            var r = apiGet('/target_lots', {spjangcd: CTX.spjangcd});
            // 이미 배치에 담긴 로트는 제외
            var inBatch = {};
            (curB.items || []).forEach(function (i) {
                inBatch[i.mat_lot_id] = 1;
            });
            LOTPICK = (r.data || []).filter(function (l) {
                return !inBatch[l.mat_lot_id];
            });
            document.getElementById('lotTitle').textContent = '멸균할 로트 담기';
            document.getElementById('lotList').innerHTML = LOTPICK.length ? LOTPICK.map(function (l) {
                return '<div class="lotopt" data-lot="' + l.mat_lot_id + '"><div><span class="ln">' + l.lot_no + '</span>' +
                    '<div class="meta" style="margin-left:0;text-align:left">' + l.mat_name + ' · ' + l.mat_code + '</div></div>' +
                    '<div class="meta" style="margin-left:auto;text-align:right"><div style="font-size:20px;font-weight:800;color:var(--teal-d)">가용 ' + num(l.avail) + '</div><div>탭하여 수량 선택</div></div></div>';
            }).join('') : '<div class="emptysess">담을 수 있는 로트가 없습니다.</div>';
            showMask('lotMask');
        }

        document.getElementById('lotList').addEventListener('click', function (e) {
            var row = e.target.closest('[data-lot]');
            if (!row) return;
            var id = +row.dataset.lot, l = LOTPICK.filter(function (x) {
                return x.mat_lot_id == id;
            })[0];
            if (!l) return;
            var av = num(l.avail);
            hideMask('lotMask');
            openQtyPad(l.lot_no + ' 담을 수량', av, av, function (v) {
                apiPost('/lot_add', {
                    batch_id: curB.batch_id,
                    mat_lot_id: id,
                    qty: v,
                    spjangcd: CTX.spjangcd
                }, function () {
                    openBatch(curB.batch_id);
                });
            });
        });

        // 수량 넘패드 (대기 수량 · 로트 담기 공용) — 목업 qtyMask 사용
        var qpVal = '', qpCb = null, qpMax = 0;

        function openQtyPad(title, cur, max, cb) {
            qpVal = String(cur);
            qpMax = max;
            qpCb = cb;
            document.getElementById('qpTitle').textContent = title || '담을 수량';
            document.getElementById('qpDisp').textContent = qpVal;
            var mx = document.getElementById('qpMax');
            if (mx) mx.textContent = '최대 ' + max;
            showMask('qtyMask');
        }

        document.querySelector('#qtyMask .keys').addEventListener('click', function (e) {
            var k = e.target.dataset.k;
            if (!k) return;
            if (k === 'C') {
                qpVal = '';
            } else if (k === 'OK') {
                var n = parseInt(qpVal || '0', 10);
                if (isNaN(n) || n < 1) n = 1;
                if (n > qpMax) n = qpMax;
                hideMask('qtyMask');
                if (qpCb) qpCb(n);
                return;
            } else qpVal = (qpVal === '0' ? '' : qpVal) + k;
            document.getElementById('qpDisp').textContent = qpVal || '0';
        });

        // 시작/종료 시간 수정 (timeMask) → /batch_time
        var timeWhich = 'start', editDate = new Date();

        function fmtD(d) {
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' (' + WD[d.getDay()] + ')';
        }

        function openTime(which) {
            timeWhich = which;
            document.getElementById('timeTitle').textContent = (which === 'start' ? '시작' : '종료') + ' 일시 수정';
            var saved = which === 'start' ? curB.start_time : curB.end_time;
            if (saved && String(saved).indexOf(' ') >= 0) {
                var a = String(saved).split(' ');
                editDate = new Date(a[0] + 'T' + a[1]);
            } else editDate = new Date();
            document.getElementById('tDate').textContent = fmtD(editDate);
            document.getElementById('tH').textContent = String(editDate.getHours()).padStart(2, '0');
            document.getElementById('tM').textContent = String(editDate.getMinutes()).padStart(2, '0');
            showMask('timeMask');
        }

        document.querySelector('#timeMask .dateedit').addEventListener('click', function (e) {
            var b = e.target.closest('[data-d]');
            if (!b) return;
            editDate.setDate(editDate.getDate() + (+b.dataset.d));
            document.getElementById('tDate').textContent = fmtD(editDate);
        });
        document.querySelector('#timeMask .timeedit').addEventListener('click', function (e) {
            var b = e.target.closest('[data-t]');
            if (!b) return;
            var H = document.getElementById('tH'), M = document.getElementById('tM');
            var h = +H.textContent, m = +M.textContent;
            if (b.dataset.t === 'h+') h = (h + 1) % 24;
            if (b.dataset.t === 'h-') h = (h + 23) % 24;
            if (b.dataset.t === 'm+') m = (m + 1) % 60;
            if (b.dataset.t === 'm-') m = (m + 59) % 60;
            H.textContent = String(h).padStart(2, '0');
            M.textContent = String(m).padStart(2, '0');
        });
        document.getElementById('timeOk').onclick = function () {
            var ds = editDate.getFullYear() + '-' + String(editDate.getMonth() + 1).padStart(2, '0') + '-' + String(editDate.getDate()).padStart(2, '0');
            var v = ds + ' ' + document.getElementById('tH').textContent + ':' + document.getElementById('tM').textContent;
            var payload = {batch_id: curB.batch_id};
            if (timeWhich === 'start') payload.start_time = v; else payload.end_time = v;
            apiPost('/batch_time', payload, function () {
                hideMask('timeMask');
                openBatch(curB.batch_id);
                flash((timeWhich === 'start' ? '시작' : '종료') + ' 저장 ' + pill(v));
            });
        };

        // 모든 함수/상태변수 정의 이후 부팅
        boot();


    </script>
    <!-- ===== 스텝퍼 눌러서 빠르게 증감 (press & hold auto-repeat) — 태블릿/PC 공통 ===== -->
    <style>
        .stepper button, .lotstep button, .dateedit button, .timeedit button {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
    </style>
    <script>
        (function () {
            var SEL = '.stepper button, .lotstep button, .dateedit button, .timeedit button';
            var holdTimer = null, repeatTimer = null, maxTimer = null;
            var curBtn = null;
            var END_EVENTS = ['pointerup', 'pointercancel', 'lostpointercapture', 'touchend', 'touchcancel', 'mouseup'];

            function stop() {
                clearTimeout(holdTimer);
                clearInterval(repeatTimer);
                clearTimeout(maxTimer);
                holdTimer = repeatTimer = maxTimer = null;
                if (curBtn) {                                   // ★ 버튼에 직접 걸었던 리스너 정리
                    END_EVENTS.forEach(function (ev) {
                        curBtn.removeEventListener(ev, stop);
                    });
                    curBtn = null;
                }
            }

            function tick(x, y) {
                var el = document.elementFromPoint(x, y);
                var b = (el && el.closest) ? el.closest(SEL) : null;
                if (!b) {
                    stop();
                    return;
                }
                b.click();
            }

            document.addEventListener('pointerdown', function (e) {
                if (e.button != null && e.button > 0) return;   // 좌클릭/터치만
                var btn = e.target.closest ? e.target.closest(SEL) : null;
                if (!btn) return;

                var x = e.clientX, y = e.clientY;
                stop();

                // ★ 떼는 이벤트를 '눌린 버튼'에 직접 건다.
                //   재렌더로 버튼이 DOM에서 사라져도 그 노드로 이벤트가 가므로 확실히 멈춘다.
                curBtn = btn;
                END_EVENTS.forEach(function (ev) {
                    btn.addEventListener(ev, stop);
                });

                holdTimer = setTimeout(function () {
                    repeatTimer = setInterval(function () {
                        tick(x, y);
                    }, 80); // 반복 속도(ms)
                    maxTimer = setTimeout(stop, 8000);                         // 안전장치: 최대 8초
                }, 400); // 길게 누름 인식(ms)

                // 손가락 안 뗐는데도 대비: 전역에도 백업으로 걸어둠 (날짜/시간 등 재렌더 없는 버튼용)
                window.addEventListener('pointerup', stop, {once: true, capture: true});
                window.addEventListener('touchend', stop, {once: true, capture: true});
            });

            window.addEventListener('blur', stop);
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) stop();
            });
        })();
    </script>
