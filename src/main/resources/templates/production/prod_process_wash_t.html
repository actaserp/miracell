<html layout:decorate="~{layout_page}">

<th:block layout:fragment="content">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"/>
    <style>

        :root{--bg:#E9EEF1;--surface:#FFF;--surface-2:#F4F7F9;--ink:#15222B;--ink-2:#5A6B76;--line:#D8E0E5;
            --teal:#0E7C86;--teal-d:#0A5C64;--teal-bg:#E2F1F2;--green:#1E9D58;--green-bg:#E4F4EA;
            --amber:#C77A00;--amber-bg:#FBEFD8;--red:#C8483B;--red-bg:#F7E4E1;--r:18px;--tap:60px;
            --shadow:0 1px 0 rgba(21,34,43,.04),0 8px 24px -16px rgba(21,34,43,.28)}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        .ms-wash-root{font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif;color:var(--ink);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;flex:1 1 auto;min-height:0;height:var(--wash-h,100%);max-height:var(--wash-h,none);display:flex;flex-direction:column}
        .ms-wash-root .app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-radius:12px;overflow:hidden}
        .topbar{flex:0 0 auto;height:64px;display:flex;align-items:center;gap:14px;padding:0 20px;
            background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
        .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}
        .brand .dot{width:12px;height:12px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px var(--teal-bg)}
        .spacer{flex:1}.clock{font-variant-numeric:tabular-nums;font-weight:700}
        .screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}.screen.hide{display:none}

        /* A. 날짜 카드 */
        .wrap{padding:22px 20px 28px;max-width:1180px;margin:0 auto;width:100%;overflow:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
        .qhead{display:flex;align-items:baseline;gap:12px;margin:2px 2px 18px}
        .qhead h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0}
        .qhead .cnt{color:var(--ink-2);font-weight:700}
        .searchbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
        .searchbar .slab{font-weight:800;color:var(--ink-2);font-size:14px}
        .searchbar .tilde{font-weight:800;color:var(--ink-2)}
        .dinput{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;font-weight:700;color:var(--ink);background:var(--surface-2);font-variant-numeric:tabular-nums;min-width:150px}
        .sbtn{height:48px;padding:0 22px;border:none;border-radius:12px;background:var(--teal);color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-left:auto}
        .sbtn:active{background:var(--teal-d)}
        .qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
        .day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;
            cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease;position:relative;overflow:hidden}
        .day:active{transform:scale(.985)}
        .day .edge{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
        .day[data-st="working"] .edge{background:var(--teal)}.day[data-st="wait"] .edge{background:var(--amber)}.day[data-st="done"] .edge{background:var(--green)}
        .day .row1{display:flex;align-items:center;gap:10px;margin-bottom:12px}
        .day .dt{font-weight:800;font-size:20px;letter-spacing:-.02em}
        .day .today{padding:4px 10px;border-radius:999px;background:var(--teal);color:#fff;font-size:12px;font-weight:800}
        .chip{margin-left:auto;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:800}
        .chip.working{background:var(--teal-bg);color:var(--teal-d)}.chip.wait{background:var(--amber-bg);color:var(--amber)}.chip.done{background:var(--green-bg);color:var(--green)}
        .day .meta{display:flex;gap:22px;align-items:flex-end}
        .day .meta .blk{display:flex;flex-direction:column;gap:2px}
        .day .meta .lab{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .day .meta .val{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
        .day .meta .val.left{color:var(--teal-d)}
        .day .cnts{margin-left:auto;display:flex;gap:8px}
        .minipill{padding:5px 10px;border-radius:10px;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
        .minipill.w{background:var(--amber-bg);color:var(--amber)}.minipill.g{background:var(--teal-bg);color:var(--teal-d)}.minipill.d{background:var(--green-bg);color:var(--green)}

        /* 공통 상단바(B,C) */
        .topbar2{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);
            padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);z-index:2}
        .back{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);
            display:grid;place-items:center;cursor:pointer;font-size:22px;flex:0 0 auto}
        .back:active{background:var(--line)}
        .htitle{min-width:0;flex:1}
        .htitle .t{font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .htitle .s{font-size:13.5px;color:var(--ink-2);font-weight:700;margin-top:1px}
        .chead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
        .infopill{display:flex;gap:7px;align-items:center;background:var(--surface-2);border:1px solid var(--line);
            border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
        .infopill b{color:var(--ink);font-variant-numeric:tabular-nums}
        .infopill.big b{color:var(--teal-d);font-size:18px}
        .infopill.tap{cursor:pointer}.infopill.tap:active{background:var(--line)}
        .infopill.tap b{color:var(--teal-d);text-decoration:underline dotted}
        .wk .wktime{font-size:13.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
        .dateedit{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 10px}
        .dateedit .dbtn{width:56px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700;cursor:pointer}
        .dateedit .dbtn:active{background:var(--line)}
        .dateedit .dval{min-width:200px;text-align:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
        .timeedit{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0}
        .tcol{display:flex;flex-direction:column;align-items:center;gap:8px}
        .tcol button{width:84px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:700;cursor:pointer}
        .tcol .tv{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;width:84px;text-align:center}
        .tsep{font-size:40px;font-weight:800;padding-bottom:4px}

        .col-stack{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;height:100%}
        .bscroll{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px}
        .bgrid{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
        .secline{display:flex;align-items:center;gap:10px;margin:6px 2px 0;color:var(--ink-2);font-weight:800;font-size:14px}
        .secline .ln{flex:1;height:1px;background:var(--line)}

        /* B. 작업자 카드 */
        .wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;
            box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden;transition:transform .12s ease}
        .wk:active{transform:scale(.99)}
        .wk .edge{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--amber)}
        .wk[data-st="working"] .edge{background:var(--teal)}.wk[data-st="done"] .edge{background:var(--green)}
        .wk .who{display:flex;flex-direction:column;gap:2px;min-width:130px}
        .wk .who .nm{font-size:18px;font-weight:800}
        .wk .who .eq{font-size:13px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
        .wk .qty{margin-left:auto;text-align:right}
        .wk .qty .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
        .wk .qty .l{font-size:12px;color:var(--ink-2);font-weight:700}
        .wk .badge{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800}
        .wk .badge.working{background:var(--teal-bg);color:var(--teal-d)}.wk .badge.done{background:var(--green-bg);color:var(--green)}.wk .badge.wait{background:var(--amber-bg);color:var(--amber)}
        .wk .wkdel{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--red-bg);color:var(--red);font-weight:800;font-size:14px;cursor:pointer;flex:0 0 auto}
        .wk .wkdel:active{background:var(--red);color:#fff}
        .emptybox{text-align:center;color:var(--ink-2);font-weight:700;padding:30px;border:1.5px dashed var(--line);border-radius:var(--r)}

        /* C. 품목(재고) */
        .item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
            display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);flex-wrap:wrap;position:relative;overflow:hidden}
        .item .edge{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--amber)}
        .item[data-st="working"] .edge{background:var(--teal)}.item[data-st="done"] .edge{background:var(--green)}
        .item.locked{opacity:.75}
        .item .id{display:flex;flex-direction:column;min-width:0;flex:1;padding-left:6px}
        .item .pn{font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
        .item .pc{font-size:13px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
        .item .itime{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
        .item .itime .tp{font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--surface-2);
            border:1px solid var(--line);border-radius:10px;padding:5px 10px;cursor:pointer;font-variant-numeric:tabular-nums}
        .item .itime .tp:active{background:var(--line)}
        .item .itime .tp b{color:var(--teal-d);text-decoration:underline dotted;margin-left:2px}
        .item .st-badge{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800;flex:0 0 auto}
        .item .st-badge.wait{background:var(--amber-bg);color:var(--amber)}.item .st-badge.working{background:var(--teal-bg);color:var(--teal-d)}.item .st-badge.done{background:var(--green-bg);color:var(--green)}
        .stepper{display:flex;align-items:center;flex:0 0 auto}
        .stepper button{width:50px;height:54px;border:1px solid var(--line);background:var(--surface-2);font-size:25px;font-weight:700;cursor:pointer;display:grid;place-items:center}
        .stepper button:active{background:var(--line)}
        .stepper button.minus{border-radius:14px 0 0 14px}.stepper button.plus{border-radius:0 14px 14px 0}
        .stepper .qty{width:90px;height:54px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
            background:#FFFDF4;text-align:center;font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;display:grid;place-items:center;cursor:pointer}
        .qtytag{min-width:90px;text-align:right;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
        .itembtn{height:54px;padding:0 18px;border-radius:14px;border:none;font-weight:800;font-size:15px;cursor:pointer;flex:0 0 auto}
        .itembtn.start{background:var(--teal);color:#fff}.itembtn.start:active{background:var(--teal-d)}
        .itembtn.done{background:var(--green);color:#fff}
        .itembtn.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
        .itembtn.del{background:var(--red-bg);color:var(--red)}

        .actionbar{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);
            padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;
            box-shadow:0 -8px 24px -18px rgba(21,34,43,.4)}
        .actionbar .actsum{display:flex;flex-direction:column;margin-right:auto}
        .actionbar .actsum .l{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .actionbar .actsum .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
        .btn{min-height:var(--tap);padding:0 24px;border-radius:16px;border:none;cursor:pointer;font-size:18px;font-weight:800;display:inline-flex;align-items:center;gap:8px}
        .btn.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}.btn.ghost:active{background:var(--line)}
        .btn.primary{background:var(--teal);color:#fff;padding:0 30px;box-shadow:0 8px 18px -8px rgba(14,124,134,.7)}.btn.primary:active{background:var(--teal-d)}
        .btn.start{background:var(--teal);color:#fff;flex:1;justify-content:center;font-size:20px}
        .btn.danger{background:var(--red-bg);color:var(--red)}

        /* 시트 */
        .mask{position:fixed;inset:0;background:rgba(21,34,43,.42);display:none;z-index:40;align-items:flex-end}
        .mask.show{display:flex;animation:fade .15s ease}@keyframes fade{from{opacity:0}to{opacity:1}}
        .sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 20px calc(40px + env(safe-area-inset-bottom));
            box-shadow:0 -20px 40px -20px rgba(0,0,0,.4);animation:rise .2s cubic-bezier(.2,.7,.3,1);max-height:88dvh;overflow:auto}
        @keyframes rise{from{transform:translateY(40px)}to{transform:translateY(0)}}
        .sheet .sh{display:flex;align-items:center;margin-bottom:16px}
        .sheet .sh h3{font-size:20px;font-weight:800;margin:0;letter-spacing:-.02em}
        .sheet .sh .x{margin-left:auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;cursor:pointer}
        .sheet .body{max-width:640px;margin:0 auto}
        .fieldlab{font-size:14px;font-weight:800;color:var(--ink-2);margin:14px 2px 8px}
        .opts{display:flex;flex-wrap:wrap;gap:10px}
        .opt{min-height:54px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
        .opt:active{background:var(--surface-2)}.opt.sel{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-d)}
        .opt .sub{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .sheet .ok{width:100%;margin-top:20px;background:var(--teal);color:#fff;min-height:var(--tap);border:none;border-radius:16px;font-size:19px;font-weight:800;cursor:pointer}
        .sheet .ok:disabled{background:var(--line);color:var(--ink-2)}
        /* 재고 선택 리스트 */
        .stocklist{display:flex;flex-direction:column;gap:8px;max-height:52dvh;overflow:auto;margin-top:6px}
        .stockrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
        .stockrow:active{background:var(--surface-2)}
        .stockrow.dim{opacity:.45;pointer-events:none}
        .stockrow.added{border-color:var(--teal);background:var(--teal-bg)}
        .stockrow .sid{flex:1;min-width:0}
        .stockrow .snm{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .stockrow .scode{font-size:12.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
        .stockrow .sstk{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto}
        .stockrow .sstk .sl{font-size:11px;color:var(--ink-2);font-weight:700}
        .stockrow .schk{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;flex:0 0 auto;font-weight:800;color:var(--teal-d)}
        .stockrow.added .schk{background:var(--teal);color:#fff;border-color:var(--teal)}
        .pad .disp{margin-left:auto;min-width:140px;text-align:right;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px 16px}
        .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;margin:6px auto 0}
        .keys button{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:25px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
        .keys button:active{background:var(--surface-2)}.keys button.ok{background:var(--teal);color:#fff;border-color:var(--teal)}.keys button.clr{color:var(--red)}

        @media (max-width:680px){.qgrid{grid-template-columns:1fr}.wk{flex-wrap:wrap}.item .stat{order:3;width:100%}}
        @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

    </style>

    <div class="ms-wash-root">
        <div class="app">
            <!-- A. 날짜 카드 -->
            <div class="screen" id="scA"><div class="wrap">
                <div class="qhead"><h1>세척 공정</h1><span class="cnt" id="dayCnt"></span></div>
                <div class="searchbar"><span class="slab">작업일</span>
                    <input type="date" id="dFrom" class="dinput"/><span class="tilde">~</span><input type="date" id="dTo" class="dinput"/>
                    <button class="sbtn" id="btnSearch">조회</button></div>
                <div class="qgrid" id="dayGrid"></div>
            </div></div>

            <!-- B. 작업자 목록 -->
            <div class="screen hide" id="scB"><div class="col-stack">
                <div class="topbar2">
                    <button class="back" data-back="A">‹</button>
                    <div class="htitle"><div class="t" id="bDate">—</div><div class="s">생산 1캠퍼스 · 세척 공정</div></div>
                    <div class="infopill big"><span>완료수량</span><b id="bDoneQty">0</b></div>
                </div>
                <div class="bscroll"><div class="bgrid">
                    <div class="secline">작업자 <span class="ln"></span><span id="wkCnt"></span></div>
                    <div id="wkList" style="display:flex;flex-direction:column;gap:12px"></div>
                </div></div>
                <div class="actionbar">
                    <div class="actsum"><span class="l">작업자가 본인 카드를 눌러 세척을 진행합니다</span></div>
                    <button class="btn start" id="btnAddWorker">＋ 작업자 추가</button>
                </div>
            </div></div>

            <!-- C. 작업자 품목 리스트 -->
            <div class="screen hide" id="scC"><div class="col-stack">
                <div class="topbar2">
                    <button class="back" data-back="B">‹</button>
                    <div class="htitle"><div class="t" id="cWorker">—</div><div class="s" id="cSub">—</div></div>
                    <div class="chead" id="cHead"></div>
                </div>
                <div class="bscroll"><div class="bgrid">
                    <div class="secline">세척 품목 <span class="ln"></span><span id="itemCnt"></span></div>
                    <div id="itemList" style="display:flex;flex-direction:column;gap:12px"></div>
                </div></div>
                <div class="actionbar" id="cAction"></div>
            </div></div>
        </div>

        <!-- 작업자·설비 선택 시트 -->
        <div class="mask" id="workerMask"><div class="sheet"><div class="body">
            <div class="sh"><h3>작업자 추가</h3><button class="x" data-close>✕</button></div>
            <div class="fieldlab">작업자</div><div class="opts" id="workerOpts"></div>
            <div class="fieldlab">세척기</div><div class="opts" id="equipOpts"></div>
            <button class="ok" id="workerOk" disabled>이 작업자 추가</button>
        </div></div></div>

        <!-- 품목(재고) 선택 시트 -->
        <div class="mask" id="stockMask"><div class="sheet"><div class="body">
            <div class="sh"><h3>세척 품목 추가</h3><button class="x" data-close>✕</button></div>
            <div class="fieldlab">생산창고 재고 (불출분) · 눌러서 담기</div>
            <div class="stocklist" id="stockList"></div>
            <button class="ok" data-close style="background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line)">닫기</button>
        </div></div></div>

        <!-- 시간 수정 시트 -->
        <div class="mask" id="timeMask"><div class="sheet"><div class="body">
            <div class="sh"><h3 id="timeTitle">시작 일시 수정</h3><button class="x" data-close>✕</button></div>
            <div class="dateedit"><button class="dbtn" data-d="-1">◀</button><div class="dval" id="tDate">—</div><button class="dbtn" data-d="1">▶</button></div>
            <div class="timeedit">
                <div class="tcol"><button data-t="h+">▲</button><div class="tv" id="tH">09</div><button data-t="h-">▼</button></div>
                <div class="tsep">:</div>
                <div class="tcol"><button data-t="m+">▲</button><div class="tv" id="tM">12</div><button data-t="m-">▼</button></div>
            </div>
            <div style="display:flex;gap:10px;margin-top:16px">
                <button class="ok" data-close style="flex:0 0 34%;margin-top:0;background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line)">닫기</button>
                <button class="ok" id="timeOk" style="margin-top:0">저장</button>
            </div>
        </div></div></div>

        <!-- 넘패드 -->
        <div class="mask" id="padMask"><div class="sheet pad"><div class="body">
            <div class="sh"><h3 id="padLab">세척수량</h3><span class="disp" id="padDisp" style="margin-left:auto">0</span></div>
            <div class="keys"><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
                <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
                <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
                <button class="clr" data-k="C">C</button><button data-k="0">0</button><button class="ok" data-k="OK">확인</button></div>
        </div></div></div>
    </div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script th:inline="none">
        /* ── 높이 자동 맞춤 (원본 유지) ── */
        (function () {
            const root = document.querySelector('.ms-wash-root');
            if (!root) return;
            function localBelow() {
                let below = 0, node = root;
                while (node && node !== document.body) {
                    let sib = node.nextElementSibling;
                    while (sib) {
                        const r = sib.getBoundingClientRect();
                        if (r.height > 0 && getComputedStyle(sib).position !== 'fixed') below += r.height;
                        sib = sib.nextElementSibling;
                    }
                    node = node.parentElement;
                }
                let fx = 0;
                document.querySelectorAll('body *').forEach(el => {
                    if (root.contains(el)) return;
                    const cs = getComputedStyle(el);
                    if (cs.position !== 'fixed' && cs.position !== 'sticky') return;
                    const r = el.getBoundingClientRect();
                    if (r.height > 0 && r.height < innerHeight * 0.5 && r.bottom > innerHeight - 2) fx = Math.max(fx, r.height);
                });
                return Math.max(below, fx);
            }
            function availBottom() {
                let bottom = window.innerHeight;
                try {
                    const fe = window.frameElement;
                    if (fe) {
                        const pWin = window.parent, pDoc = pWin.document;
                        const feTop = fe.getBoundingClientRect().top;
                        let flow = 0, node = fe;
                        while (node && node !== pDoc.body) {
                            let sib = node.nextElementSibling;
                            while (sib) {
                                const cs = pWin.getComputedStyle(sib), r = sib.getBoundingClientRect();
                                if (r.height > 0 && cs.position !== 'fixed' && cs.position !== 'absolute') flow += r.height;
                                sib = sib.nextElementSibling;
                            }
                            node = node.parentElement;
                        }
                        let fx = 0;
                        pDoc.querySelectorAll('body *').forEach(el => {
                            if (el === fe || el.contains(fe)) return;
                            const cs = pWin.getComputedStyle(el);
                            if (cs.position !== 'fixed' && cs.position !== 'sticky' && cs.position !== 'absolute') return;
                            const r = el.getBoundingClientRect();
                            if (r.height > 0 && r.height <= 160 && r.top > feTop && r.bottom > pWin.innerHeight - 40)
                                fx = Math.max(fx, r.bottom - r.top);
                        });
                        const pFooter = Math.max(flow, fx);
                        bottom = Math.min(bottom, (pWin.innerHeight - pFooter) - feTop);
                    }
                } catch (e) {}
                return bottom;
            }
            function fit() {
                const top = root.getBoundingClientRect().top;
                const avail = availBottom() - top - localBelow();
                root.style.setProperty('--wash-h', Math.max(320, Math.floor(avail)) + 'px');
            }
            window.addEventListener('resize', fit);
            window.addEventListener('orientationchange', fit);
            try { window.parent.addEventListener('resize', fit); } catch (e) {}
            fit(); requestAnimationFrame(fit); setTimeout(fit, 200); setTimeout(fit, 600);
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
        })();

        /* =======================================================================
           실서버 배선
           - 호스트 페이지에서 window.WASH_CTX 로 설정 주입 (선택)
               { spjangcd, factoryId, dayRange }
             · factoryId : 공장이 여러 개일 때만 필요 (세척 워크센터를 좁힌다)
           - 세척은 작업지시/라우팅/BOM 을 쓰지 않는다.
             대상 = material."WashYN"='Y' + 생산창고(17) 재고>0
             동작 = 품목 행 완료 시 생산창고 → 클린룸창고(5) 재고 이동
           - 작업(카드) 상태는 서버가 품목에서 파생한다. "작업 완료" 버튼 없음.
           - 설비 콤보는 세척 공정의 워크센터로 필터한다 (공정↔워크센터 1:1).
             워크센터 id 는 /wash/context 에서 받아온다 — 화면에 하드코딩하지 않는다.
        ======================================================================= */
        const CTX = Object.assign({
            spjangcd: 'ZZ',
            factoryId: '',        // 공장 여러 개일 때만
            dayRange: 30          // 날짜 카드 조회 범위(일)
        }, window.WASH_CTX || {});

        let WASH_WC = null;       // 세척 워크센터 id — boot 시 /context 로 채움

        const BASE = '/api/production/wash';

        function apiGet(path, params) {
            if (typeof AjaxUtil !== 'undefined' && AjaxUtil.getSyncData) {
                return AjaxUtil.getSyncData(BASE + path, params || {}) || {};
            }
            flash('AjaxUtil 미로드 — 공용 스크립트 로드 순서를 확인하세요');
            return {};
        }
        function apiPost(path, params, cb) {
            if (typeof AjaxUtil !== 'undefined' && AjaxUtil.postAsyncData) {
                AjaxUtil.postAsyncData(BASE + path, params || {}, function (r) {
                    r = r || {};
                    if (r.success === false) { flash(r.message || '처리에 실패했습니다'); return; }
                    cb && cb(r);
                });
                return;
            }
            flash('AjaxUtil 미로드 — 공용 스크립트 로드 순서를 확인하세요');
        }
        /* 공용 콤보 — /api/common/combo (반환: [{value, text}]) */
        function combo(comboType, cond1, cond2, cond3) {
            if (typeof AjaxUtil === 'undefined' || !AjaxUtil.getSyncData) return [];
            const r = AjaxUtil.getSyncData('/api/common/combo', {
                combo_type: comboType, cond1: cond1 || '', cond2: cond2 || '', cond3: cond3 || ''
            }) || {};
            return (r.data || []).map(x => ({value: x.value, text: x.text, code: x.Code || '',
                factory: String(x.Factory_id || x.factory_id || '')}));
        }

        /* ── 기준 데이터 ── */
        const WD = ['일', '월', '화', '수', '목', '금', '토'];
        const STLAB = {wait: '대기', working: '작업중', done: '완료'};
        let WORKERS = [];   // [{value,text}] — 시트 열 때 1회 로드 후 캐시
        let EQUIPS = [];    // [{value,text}]

        function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
        function todayStr() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        function hhmm() {
            const d = new Date();
            return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        }
        function shiftDay(base, n) {
            const d = new Date(base + 'T00:00:00'); d.setDate(d.getDate() + n);
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        function pillT(v) { // 'YYYY-MM-DD HH:MM' → 'MM. DD HH:MM'
            if (!v) return '--:--';
            if (v.includes(' ')) { const [d, t] = v.split(' '); return d.slice(5).replace('-', '. ') + ' ' + t; }
            return v;
        }
        function fmtDate(s) {
            const d = new Date(s + 'T00:00:00');
            return `${s.replace(/-/g, '. ')} (${WD[d.getDay()]})`;
        }

        /* ── 서버 로드 ── */
        let DAYS = [];              // [{date, work_cnt, good_qty, cnts:{wait,work,done}, st}]
        let curD = null;            // {date, workers:[…]}
        let curW = null;            // {work_id, worker, equip, code, start, end, items:[…]}

        function loadDays() {
            const to = dateTo(), from = dateFrom();
            const r = apiGet('/day_list', {date_from: from, date_to: to, spjangcd: CTX.spjangcd});
            DAYS = (r.data || []).map(d => ({
                date: d.wash_date_str,
                work_cnt: num(d.work_cnt),
                good_qty: num(d.good_qty),
                cnts: {wait: num(d.item_wait_cnt), work: num(d.item_working_cnt), done: num(d.item_done_cnt)},
                st: d.state || 'wait'
            }));
            // ★ 서버는 빈 날짜를 만들지 않는다. 당일 카드는 화면에서 띄운다.
            const t = todayStr();
            if (!DAYS.some(d => d.date === t)) {
                DAYS.unshift({date: t, work_cnt: 0, good_qty: 0, cnts: {wait: 0, work: 0, done: 0}, st: 'wait'});
            }
        }
        function loadWorkers(date) {
            const r = apiGet('/work_list', {date: date, spjangcd: CTX.spjangcd});
            return (r.data || []).map(w => ({
                work_id: w.work_id,
                actor_id: w.actor_id, worker: w.worker_name || '-',
                equipment_id: w.equipment_id, equip: w.equipment_name || '-', code: w.equipment_code || '',
                start: w.start_time || null, end: w.end_time || null,
                good_qty: num(w.good_qty),
                item_cnt: num(w.item_cnt), item_done_cnt: num(w.item_done_cnt),
                st: w.state || 'wait',
                items: []
            }));
        }
        function loadItems(workId) {
            const r = apiGet('/item_list', {work_id: workId});
            return (r.data || []).map(i => ({
                item_id: i.item_id, mat_id: i.mat_id,
                code: i.mat_code, name: i.mat_name, unit: i.unit || '',
                qty: num(i.qty), defQty: num(i.defect_qty),
                st: i.state || 'wait',
                start: i.start_time || null, end: i.end_time || null,
                stock: num(i.stock)
            }));
        }

        /* 현재 화면 갱신 */
        function refreshDays() { loadDays(); renderDays(); }
        function refreshWorkers() {
            curD.workers = loadWorkers(curD.date);
            renderWorkers();
        }
        function refreshItems() {
            curW.items = loadItems(curW.work_id);
            // 작업 헤더(시작/종료/완료수량)는 서버 파생값 — 목록에서 다시 읽는다
            const fresh = loadWorkers(curD.date).find(w => w.work_id === curW.work_id);
            if (fresh) { curW.start = fresh.start; curW.end = fresh.end; curW.good_qty = fresh.good_qty; curW.st = fresh.st; }
            renderItems();
        }

        /* 집계 (화면 표시용) */
        function workerDone(w) { return w.items.length
            ? w.items.filter(i => i.st === 'done').reduce((a, i) => a + (+i.qty || 0), 0)
            : (w.good_qty || 0); }

        /* ── A. 날짜 카드 ── */
        const dayGrid = document.getElementById('dayGrid');
        function renderDays() {
            document.getElementById('dayCnt').textContent = DAYS.length + '일';
            dayGrid.innerHTML = DAYS.map((d, i) => {
                const isToday = d.date === todayStr();
                return `<div class="day" data-st="${d.st}" data-i="${i}"><div class="edge"></div>
      <div class="row1"><span class="dt">${fmtDate(d.date)}</span>
        ${isToday ? '<span class="today">오늘</span>' : ''}
        <span class="chip ${d.st}">${STLAB[d.st]}</span></div>
      <div class="meta">
        <div class="blk"><span class="lab">작업자</span><span class="val">${d.work_cnt}명</span></div>
        <div class="blk"><span class="lab">완료수량</span><span class="val left">${d.good_qty.toLocaleString()}</span></div>
        <div class="cnts">
          <span class="minipill w">대기 ${d.cnts.wait}</span>
          <span class="minipill g">작업중 ${d.cnts.work}</span>
          <span class="minipill d">완료 ${d.cnts.done}</span>
        </div></div></div>`;
            }).join('');
        }
        dayGrid.addEventListener('click', e => {
            const c = e.target.closest('.day');
            if (c) openDay(+c.dataset.i);
        });

        /* ── 화면 전환 ── */
        const SC = {A: document.getElementById('scA'), B: document.getElementById('scB'), C: document.getElementById('scC')};
        function show(k) { for (const x in SC) SC[x].classList.toggle('hide', x !== k); }
        document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => {
            flushDirty();   /* C 화면을 벗어나기 전 미저장 수량 반영 */
            if (b.dataset.back === 'A') { refreshDays(); show('A'); }
            else { refreshWorkers(); show('B'); }
        }));

        /* ── B. 작업자 목록 ── */
        function openDay(i) {
            curD = {date: DAYS[i].date, workers: []};
            refreshWorkers();
            show('B');
        }
        function renderWorkers() {
            document.getElementById('bDate').textContent = fmtDate(curD.date);
            document.getElementById('bDoneQty').textContent =
                curD.workers.reduce((a, w) => a + (w.good_qty || 0), 0).toLocaleString();
            document.getElementById('wkCnt').textContent = curD.workers.length + '명';
            const box = document.getElementById('wkList');
            if (!curD.workers.length) {
                box.innerHTML = `<div class="emptybox">아직 작업자가 없습니다. 아래 ‘작업자 추가’로 시작하세요.</div>`;
                return;
            }
            box.innerHTML = curD.workers.map((w, i) => {
                const del = workerDeletable(w) ? `<button class="wkdel" data-del="${i}">삭제</button>` : '';
                return `<div class="wk" data-st="${w.st}" data-i="${i}"><div class="edge"></div>
      <div class="who"><span class="nm">${w.worker}</span><span class="eq">${w.equip}${w.code ? ' · ' + w.code : ''}</span></div>
      <div class="wktime">${pillT(w.start)} ~ ${pillT(w.end)}</div>
      <div class="qty"><div class="l">완료수량</div><div class="v">${(w.good_qty || 0).toLocaleString()}</div></div>
      <span class="badge ${w.st}">${STLAB[w.st]}</span>${del}</div>`;
            }).join('');
        }
        /* 완료된 품목이 하나라도 있으면 삭제 불가 (서버도 동일 검증) */
        function workerDeletable(w) { return (w.item_done_cnt || 0) === 0; }

        document.getElementById('wkList').addEventListener('click', e => {
            const d = e.target.closest('[data-del]');
            if (d) {
                const w = curD.workers[+d.dataset.del];
                if (!workerDeletable(w)) { flash('완료된 세척이 있는 작업자는 삭제할 수 없습니다'); return; }
                apiPost('/work_delete', {work_id: w.work_id}, () => {
                    refreshWorkers(); flash(`작업자 삭제 · ${w.worker}`);
                });
                return;
            }
            const el = e.target.closest('.wk');
            if (el) openWorker(+el.dataset.i);
        });
        document.getElementById('btnAddWorker').onclick = openWorkerSheet;

        /* ── C. 품목 리스트 ── */
        function openWorker(i) {
            curW = curD.workers[i];
            refreshItems();
            show('C');
        }
        function renderCHead() {
            /* ★ 작업 시작/종료는 품목에서 파생되는 값 — 표시만, 수정 불가 */
            document.getElementById('cHead').innerHTML = `
        <div class="infopill"><span>시작</span><b>${pillT(curW.start)}</b></div>
        <div class="infopill"><span>종료</span><b>${pillT(curW.end)}</b></div>
        <div class="infopill big"><span>완료수량</span><b>${workerDone(curW).toLocaleString()}</b></div>`;
        }
        function renderItems() {
            document.getElementById('cWorker').textContent = curW.worker;
            document.getElementById('cSub').textContent =
                `${fmtDate(curD.date)} · ${curW.equip}${curW.code ? ' · ' + curW.code : ''}`;
            renderCHead();
            document.getElementById('itemCnt').textContent = curW.items.length + '종';
            const box = document.getElementById('itemList');
            if (!curW.items.length) {
                box.innerHTML = `<div class="emptybox">세척할 품목이 없습니다. 아래 ‘＋ 품목 추가’로 재고에서 담으세요.</div>`;
            } else {
                box.innerHTML = curW.items.map((it, i) => {
                    let ctrl, actions;
                    if (it.st === 'done') {
                        ctrl = `<span class="qtytag">${it.qty.toLocaleString()}</span>`;
                        actions = `<button class="itembtn ghost" data-act="uncomplete" data-i="${i}">완료취소</button>`;
                    } else {
                        /* 수량은 시작 전/후 언제든 입력 가능 */
                        ctrl = `<div class="stepper" data-i="${i}"><button class="minus">−</button>
              <div class="qty" data-pad="${i}">${it.qty.toLocaleString()}</div><button class="plus">+</button></div>`;
                        if (it.st === 'wait') {
                            actions = `<button class="itembtn ghost del" data-act="del" data-i="${i}" style="margin-left:auto;color:#d33">삭제</button>
                <button class="itembtn start" data-act="start" data-i="${i}">작업시작</button>`;
                        } else { // working — 완료는 수량 필수
                            actions = `<button class="itembtn ghost del" data-act="del" data-i="${i}" style="margin-left:auto;color:#d33">삭제</button>
                <button class="itembtn done" data-act="complete" data-i="${i}">완료</button>`;
                        }
                    }
                    const timeline = (it.st === 'wait') ? '' : `<div class="itime">
              <span class="tp" data-itime="start" data-i="${i}">시작 <b>${pillT(it.start)}</b></span>
              <span class="tp" data-itime="end" data-i="${i}">종료 <b>${pillT(it.end)}</b></span></div>`;
                    return `<div class="item ${it.st === 'done' ? 'locked' : ''}" data-st="${it.st}"><div class="edge"></div>
        <div class="id"><span class="pn">${it.name}</span><span class="pc">${it.code}</span>${timeline}</div>
        <span class="st-badge ${it.st}">${STLAB[it.st]}</span>
        ${ctrl}${actions}</div>`;
                }).join('');
            }
            renderCAction();
        }
        /* ★ "작업 완료" 버튼 없음 — 품목이 모두 done 이면 작업이 완료된 것 */
        function renderCAction() {
            document.getElementById('cAction').innerHTML =
                `<div class="actsum"><span class="l">완료수량</span><span class="v">${workerDone(curW).toLocaleString()} EA</span></div>
        <button class="btn ghost" data-cact="addItem">＋ 품목 추가</button>`;
        }

        /* ★ 수량은 로컬 상태로만 들고 있는다.
           서버 전송은 '작업시작' / '완료' 시점 1회씩 — 스텝퍼 조작마다 저장하지 않는다.
           화면을 벗어날 때만 미저장분(dirty)을 한 번 흘려보낸다. */
        const dirty = new Set();

        function flushDirty() {
            if (!curW || !dirty.size) return;
            curW.items.forEach(it => {
                if (!dirty.has(it.item_id) || it.st === 'done') return;
                apiPost('/item_save', {item_id: it.item_id, qty: it.qty, defect_qty: it.defQty || 0});
            });
            dirty.clear();
        }

        document.getElementById('itemList').addEventListener('click', e => {
            const step = e.target.closest('.stepper');
            if (step && (e.target.classList.contains('plus') || e.target.classList.contains('minus'))) {
                const i = +step.dataset.i, it = curW.items[i];
                it.qty = Math.max(0, (+it.qty || 0) + (e.target.classList.contains('plus') ? 1 : -1));
                step.querySelector('.qty').textContent = it.qty.toLocaleString();
                dirty.add(it.item_id);
                renderCHead();
                return;
            }
            const pad = e.target.closest('[data-pad]');
            if (pad) { openPad(+pad.dataset.pad); return; }
            const itime = e.target.closest('[data-itime]');
            if (itime) { const it = curW.items[+itime.dataset.i]; openTime(itime.dataset.itime, it, it.name); return; }

            const act = e.target.closest('[data-act]');
            if (!act) return;
            const i = +act.dataset.i, it = curW.items[i], a = act.dataset.act;

            if (a === 'del') {
                uiConfirm(`[${it.name}] 품목을 삭제하시겠습니까?`, () => {
                    apiPost('/item_delete', {item_id: it.item_id}, () => {
                        refreshItems(); flash('품목 삭제');
                    });
                });
            } else if (a === 'start') {
                /* 로컬에 들고 있던 수량을 함께 보낸다 (수량 입력은 시작 전/후 자유) */
                apiPost('/item_start', {item_id: it.item_id, qty: it.qty, defect_qty: it.defQty || 0}, () => {
                    dirty.delete(it.item_id);
                    refreshItems(); flash('작업 시작 · ' + it.name);
                });
            } else if (a === 'complete') {
                if (!(it.qty > 0)) {
                    flash('세척수량을 입력하세요');
                    return;
                }
                if (it.qty > it.stock) {
                    flash(`생산창고 재고 부족 (재고 ${it.stock.toLocaleString()})`);
                    return;
                }
                /* ★ 이 시점에 재고가 실제로 이동한다 (생산창고 → 클린룸창고)
                   종료시각은 서버 now() 에 맡긴다 — 카드 날짜로 만들면
                   과거 카드/자정 넘김에서 시작보다 앞서는 문제가 생긴다 */
                apiPost('/item_finish', {
                    item_id: it.item_id, qty: it.qty, defect_qty: it.defQty || 0,
                    spjangcd: CTX.spjangcd
                }, () => {
                    dirty.delete(it.item_id);
                    refreshItems();
                    flash(`세척 완료 · ${it.name} ${it.qty.toLocaleString()} → 클린룸 이동`);
                });
            } else if (a === 'uncomplete') {
                apiPost('/item_cancel', {item_id: it.item_id}, () => {
                    refreshItems();
                    flash('완료취소 · 재고 이동 취소됨');
                });
            }
        });
        document.getElementById('cAction').addEventListener('click', e => {
            const b = e.target.closest('[data-cact]');
            if (b && b.dataset.cact === 'addItem') openStockSheet();
        });

        /* ── 시트 공통 ── */
        function showMask(id) {
            document.getElementById(id).classList.add('show');
        }

        function hideMask(id) {
            document.getElementById(id).classList.remove('show');
        }

        document.querySelectorAll('.mask').forEach(m => m.addEventListener('click', e => {
            if (e.target === m || e.target.closest('[data-close]')) m.classList.remove('show');
        }));

        /* 작업자·세척기 선택 — /api/common/combo */
        let selW = null, selE = null;

        function openWorkerSheet() {
            selW = null;
            selE = null;
            if (!WORKERS.length) WORKERS = fetchWorkers();   /* 소속 공장 인원만 */
            /* ★ 세척 공정의 워크센터에 속한 설비만 (공정↔워크센터 1:1) */
            if (!EQUIPS.length) EQUIPS = WASH_WC ? combo('equipment', '', '', WASH_WC) : [];
            document.getElementById('workerOpts').innerHTML = WORKERS.length
                ? WORKERS.map(w => `<button class="opt" data-w="${w.value}" data-n="${w.text}">${w.text}</button>`).join('')
                : `<div class="emptybox">작업자 목록이 없습니다</div>`;
            document.getElementById('equipOpts').innerHTML = EQUIPS.length
                ? EQUIPS.map(x => `<button class="opt" data-e="${x.value}" data-n="${x.text}">${x.text}</button>`).join('')
                : `<div class="emptybox">${WASH_WC ? '세척 워크센터에 등록된 설비가 없습니다' : '세척 워크센터를 찾지 못했습니다 (process.Code=bsc01 확인)'}</div>`;
            document.getElementById('workerOk').disabled = true;
            showMask('workerMask');
        }

        document.getElementById('workerOpts').addEventListener('click', e => {
            const b = e.target.closest('[data-w]');
            if (!b) return;
            document.querySelectorAll('#workerOpts .opt').forEach(x => x.classList.remove('sel'));
            b.classList.add('sel');
            selW = {id: b.dataset.w, name: b.dataset.n};
            ckWorker();
        });
        document.getElementById('equipOpts').addEventListener('click', e => {
            const b = e.target.closest('[data-e]');
            if (!b) return;
            document.querySelectorAll('#equipOpts .opt').forEach(x => x.classList.remove('sel'));
            b.classList.add('sel');
            selE = {id: b.dataset.e, name: b.dataset.n};
            ckWorker();
        });

        function ckWorker() {
            document.getElementById('workerOk').disabled = !(selW && selE);
        }

        document.getElementById('workerOk').onclick = () => {
            apiPost('/work_start', {
                date: curD.date, actor_id: selW.id, equipment_id: selE.id, spjangcd: CTX.spjangcd
            }, (r) => {
                hideMask('workerMask');
                const workId = r.data && r.data.work_id;
                refreshWorkers();
                const idx = curD.workers.findIndex(w => w.work_id === workId);
                if (idx >= 0) openWorker(idx);
                flash((r.data && r.data.reused) ? `기존 작업 열기 · ${selW.name}` : `작업자 추가 · ${selW.name} / ${selE.name}`);
            });
        };

        /* 품목(재고) 선택 — WashYN='Y' + 생산창고 재고>0 */
        let STOCK = [];

        function openStockSheet() {
            const r = apiGet('/target_materials', {work_id: curW.work_id, spjangcd: CTX.spjangcd});
            STOCK = (r.data || []).map(m => ({
                mat_id: m.mat_id, code: m.mat_code, name: m.mat_name, stock: num(m.stock)
            }));
            const box = document.getElementById('stockList');
            box.innerHTML = STOCK.length
                ? STOCK.map((s, i) => `<div class="stockrow" data-i="${i}">
        <div class="sid"><div class="snm">${s.name}</div><div class="scode">${s.code}</div></div>
        <div class="sstk"><div class="sl">재고</div>${s.stock.toLocaleString()}</div>
        <div class="schk">＋</div></div>`).join('')
                : `<div class="emptybox">담을 수 있는 세척 대상 재고가 없습니다</div>`;
            showMask('stockMask');
        }

        document.getElementById('stockList').addEventListener('click', e => {
            const row = e.target.closest('.stockrow');
            if (!row) return;
            const s = STOCK[+row.dataset.i];
            apiPost('/item_add', {work_id: curW.work_id, mat_id: s.mat_id, spjangcd: CTX.spjangcd}, () => {
                refreshItems();
                openStockSheet();
                flash('담기 · 대기');
            });
        });

        /* 품목 시작·종료 시간 수정 */
        let timeWhich = 'start', timeTarget = null, editDate = new Date();

        function fmtDEdit(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} (${WD[d.getDay()]})`;
        }

        function openTime(which, target, label) {
            timeWhich = which;
            timeTarget = target;
            document.getElementById('timeTitle').textContent =
                (label ? label + ' · ' : '') + (which === 'start' ? '시작' : '종료') + ' 일시 수정';
            const saved = which === 'start' ? timeTarget.start : timeTarget.end;
            if (saved && saved.includes(' ')) {
                const [ds, ts] = saved.split(' ');
                editDate = new Date(ds + 'T' + ts);
            } else editDate = new Date(curD.date + 'T' + hhmm());
            document.getElementById('tDate').textContent = fmtDEdit(editDate);
            document.getElementById('tH').textContent = String(editDate.getHours()).padStart(2, '0');
            document.getElementById('tM').textContent = String(editDate.getMinutes()).padStart(2, '0');
            showMask('timeMask');
        }

        document.querySelector('#timeMask .dateedit').addEventListener('click', e => {
            const b = e.target.closest('[data-d]');
            if (!b) return;
            editDate.setDate(editDate.getDate() + (+b.dataset.d));
            document.getElementById('tDate').textContent = fmtDEdit(editDate);
        });
        document.querySelector('#timeMask .timeedit').addEventListener('click', e => {
            const b = e.target.closest('[data-t]');
            if (!b) return;
            const H = document.getElementById('tH'), M = document.getElementById('tM');
            let h = +H.textContent, m = +M.textContent;
            if (b.dataset.t === 'h+') h = (h + 1) % 24;
            if (b.dataset.t === 'h-') h = (h + 23) % 24;
            if (b.dataset.t === 'm+') m = (m + 1) % 60;
            if (b.dataset.t === 'm-') m = (m + 59) % 60;
            H.textContent = String(h).padStart(2, '0');
            M.textContent = String(m).padStart(2, '0');
        });
        document.getElementById('timeOk').onclick = () => {
            const ds = `${editDate.getFullYear()}-${String(editDate.getMonth() + 1).padStart(2, '0')}-${String(editDate.getDate()).padStart(2, '0')}`;
            const v = ds + ' ' + document.getElementById('tH').textContent + ':' + document.getElementById('tM').textContent;
            const p = {item_id: timeTarget.item_id};
            if (timeWhich === 'start') p.start_time = v; else p.end_time = v;
            apiPost('/item_update_time', p, () => {
                hideMask('timeMask');
                refreshItems();
                flash((timeWhich === 'start' ? '시작' : '종료') + ' 저장 ' + pillT(v));
            });
        };

        /* 넘패드 */
        let padIdx = null, padVal = '';

        function openPad(i) {
            padIdx = i;
            padVal = String(curW.items[i].qty || 0);
            document.getElementById('padLab').textContent = curW.items[i].name + ' · 세척수량';
            document.getElementById('padDisp').textContent = padVal;
            showMask('padMask');
        }

        document.querySelector('#padMask .keys').addEventListener('click', e => {
            const k = e.target.dataset.k;
            if (!k) return;
            if (k === 'C') padVal = '';
            else if (k === 'OK') {
                const it = curW.items[padIdx];
                it.qty = Math.max(0, parseInt(padVal || '0', 10));
                dirty.add(it.item_id);
                hideMask('padMask');
                renderItems();   /* 로컬 반영만 — 서버 전송은 시작/완료 시점 */
                return;
            } else padVal = (padVal === '0' ? '' : padVal) + k;
            document.getElementById('padDisp').textContent = padVal || '0';
        });

        /* 토스트 */
        let tT;

        function flash(m) {
            let t = document.getElementById('toast');
            if (!t) {
                t = document.createElement('div');
                t.id = 'toast';
                t.style.cssText = 'position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#15222B;color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;z-index:60;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:opacity .3s';
                document.body.appendChild(t);
            }
            t.textContent = m;
            t.style.opacity = '1';
            clearTimeout(tT);
            tT = setTimeout(() => t.style.opacity = '0', 1700);
        }

        /* 화면 톤에 맞춘 확인 모달 (PC용 Alert 대체) */
        function uiConfirm(msg, onOk, okLabel) {
            let m = document.getElementById('confirmMask');
            if (!m) {
                m = document.createElement('div');
                m.id = 'confirmMask';
                m.style.cssText = 'position:fixed;inset:0;background:rgba(21,34,43,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:24px';
                m.innerHTML = `<div style="background:var(--surface);border-radius:20px;max-width:420px;width:100%;padding:24px 22px 18px;box-shadow:0 20px 50px -12px rgba(0,0,0,.4)">
          <div id="confirmMsg" style="font-size:17px;font-weight:800;color:var(--ink);line-height:1.5;margin-bottom:20px;white-space:pre-line"></div>
          <div style="display:flex;gap:10px">
            <button id="confirmCancel" style="flex:1;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font-weight:800;font-size:16px">취소</button>
            <button id="confirmOk" style="flex:1;height:52px;border-radius:14px;border:none;background:#d33;color:#fff;font-weight:800;font-size:16px">삭제</button>
          </div></div>`;
                document.body.appendChild(m);
                m.addEventListener('click', e => { if (e.target === m) m.style.display = 'none'; });
            }
            m.querySelector('#confirmMsg').textContent = msg;
            const ok = m.querySelector('#confirmOk'), cancel = m.querySelector('#confirmCancel');
            if (okLabel) ok.textContent = okLabel;
            const close = () => { m.style.display = 'none'; ok.onclick = null; cancel.onclick = null; };
            ok.onclick = () => { close(); onOk && onOk(); };
            cancel.onclick = close;
            m.style.display = 'flex';
        }

        /* 시작 — AjaxUtil 이 레이아웃에서 늦게 로드될 수 있어 준비될 때까지 대기 */
        function loadContext() {
            const r = apiGet('/context', {factory_id: CTX.factoryId || ''});
            const d = r.data || {};
            WASH_WC = d.workcenter_id || null;
            if (!WASH_WC) console.warn('[wash] 세척 워크센터를 찾지 못했습니다. process."Code"=\'bsc01\' 및 work_center."Process_id" 매핑을 확인하세요.');
        }

        /* ── 날짜 필터 ─────────────────────────────────────
           비워두면 기본 기간(CTX.dayRange, 30일)으로 되돌린다.
           서버 day_list 는 date_from/date_to 를 이미 받으므로 API 변경 없음. */
        function dateFrom() {
            const v = document.getElementById('dFrom').value;
            return v || shiftDay(todayStr(), -CTX.dayRange);
        }
        function dateTo() {
            const v = document.getElementById('dTo').value;
            return v || todayStr();
        }
        function initDates() {
            const t = todayStr();
            const f = document.getElementById('dFrom'), o = document.getElementById('dTo');
            if (!f.value) f.value = shiftDay(t, -CTX.dayRange);
            if (!o.value) o.value = t;
        }
        document.getElementById('btnSearch').addEventListener('click', function () {
            if (dateFrom() > dateTo()) { flash('시작일이 종료일보다 늦습니다'); return; }
            refreshDays();
        });
        document.querySelectorAll('#dFrom,#dTo').forEach(function (el) {
            el.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { e.preventDefault(); document.getElementById('btnSearch').click(); }
            });
        });

        (function boot(tries) {
            tries = tries || 0;
            if (typeof AjaxUtil !== 'undefined' && AjaxUtil.getSyncData) {
                loadContext();
                initDates();
                refreshDays();
                return;
            }
            if (tries > 100) {            // 약 5초
                flash('AjaxUtil 미로드 — 공용 스크립트 로드 순서를 확인하세요');
                console.error('[wash] AjaxUtil 을 찾을 수 없습니다. typeof AjaxUtil =', typeof AjaxUtil);
                return;
            }
            setTimeout(function () {
                boot(tries + 1);
            }, 50);
        })();

        /* ══════════════════════════════════════════════════════════════════
           [공통 추가] ① 작업자 = 소속 공장 인원만  ② 재고 새로고침
           - ①은 포장공정(prod_process_opack_bsc_t) 규약과 통일한다.
             포장은 /workers 를 factory_id 와 함께 부른다. 다른 공정도 같게 맞췄다.
             ★ 서버가 이 엔드포인트를 아직 안 열었으면 공용 콤보로 폴백한다
               (그 경우 콘솔에 경고가 남는다 — 전사 인원이 다 뜬다는 뜻).
           - ②는 "화면을 다시 그리는" 것이 아니라 지금 보고 있는 자리는 그대로 두고
             재고 수치만 서버에서 다시 읽는다. 앞 공정이 방금 만든 재고를 받는 용도.
           ══════════════════════════════════════════════════════════════════ */
        var WORKER_API = '/api/production/wash/workers';
        var WORKER_FACTORY_ID = 1;

        /* 공용 콤보를 직접 부른다 — 화면마다 combo() 유무가 달라 여기서 자체 호출한다.
           cond1 = 공장(Factory_id). ComboService.person 이 이 조건을 받는다.
           서버는 퇴사자(_status·Exitdate)도 함께 걸러 내려준다. */
        function comboPerson(factoryId) {
            if (typeof AjaxUtil === 'undefined' || !AjaxUtil.getSyncData) return [];
            var r = AjaxUtil.getSyncData('/api/common/combo', {
                combo_type: 'person',
                cond1: (factoryId == null ? '' : String(factoryId)),
                cond2: '', cond3: ''
            }) || {};
            return (r.data || []).map(function (x) {
                return {
                    value: x.value,
                    text : x.text,
                    code : x.code || x.Code || '',
                    factory: String(x.Factory_id != null ? x.Factory_id
                        : (x.factory_id != null ? x.factory_id : ''))
                };
            }).filter(function (w) { return w.value != null && w.text; });
        }

        function fetchWorkerRows() {
            if (typeof AjaxUtil === 'undefined' || !AjaxUtil.getSyncData) return [];

            /* ① 공용 콤보 (기본 경로) */
            var list = [];
            try { list = comboPerson(WORKER_FACTORY_ID); } catch (e) { list = []; }

            /* ② 콤보가 비면 공정 전용 /workers 로 폴백 (포장처럼 자체 엔드포인트가 있는 화면용) */
            if (!list.length) {
                var rows = [];
                try {
                    var r = AjaxUtil.getSyncData(WORKER_API, {
                        factory_id: WORKER_FACTORY_ID,
                        spjangcd: (typeof CTX !== 'undefined' && CTX && CTX.spjangcd) ? CTX.spjangcd : 'ZZ'
                    }) || {};
                    rows = r.data || (Array.isArray(r) ? r : []);
                } catch (e2) { rows = []; }
                if (!Array.isArray(rows)) rows = [];
                list = rows.map(function (w) {
                    var id = (w.worker_id != null) ? w.worker_id
                        : (w.actor_id  != null) ? w.actor_id
                            : (w.person_id != null) ? w.person_id
                                : (w.id != null) ? w.id : w.value;
                    return {
                        value: id,
                        text : w.name || w.actor_name || w.text || '',
                        code : w.code || '',
                        factory: String(w.factory_id != null ? w.factory_id
                            : (w.Factory_id != null ? w.Factory_id : ''))
                    };
                }).filter(function (w) { return w.value != null && w.text; });
                if (list.length) console.warn('[workers] 공용 콤보가 비어 ' + WORKER_API + ' 로 폴백했습니다.');
            }

            /* ③ 응답에 공장이 실려 있으면 화면에서 한 번 더 거른다 (2차 방어).
                  공장 미지정자는 어느 화면에서도 보이도록 남긴다 — 서버 조건과 같은 방침. */
            var f = list.filter(function (w) { return !w.factory || w.factory === String(WORKER_FACTORY_ID); });
            if (f.length) list = f;
            return list;
        }
        /* {value,text,code} 형태로 쓰는 화면용 */
        function fetchWorkers() { return fetchWorkerRows(); }
        /* {actor_id,actor_name} 형태로 쓰는 화면용 */
        function fetchWorkersActor() {
            return fetchWorkerRows().map(function (w) {
                return {actor_id: w.value, actor_name: w.text, code: w.code};
            });
        }

        /* ── 새로고침 버튼 : 각 화면 헤더(qhead / topbar2) 우측에 붙인다 ──
           목록·액션바는 다시 그려지고 스크롤도 타서 고정 자리를 잡기 어렵다.
           헤더는 화면당 하나씩 고정이라 겹칠 일이 없다. */
        (function () {
            var root = document.querySelector('.ms-wash-root, .ms-pack-root') || document;
            var heads = root.querySelectorAll('.qhead, .topbar2');
            if (!heads.length) return;
            var busy = false;

            function run(b) {
                if (busy) return;
                busy = true;
                var t = b.innerHTML;
                b.innerHTML = '…';
                b.disabled = true;
                b.style.opacity = '.5';
                setTimeout(function () {
                    try {
                        stockRefresh();
                        if (typeof flash === 'function') flash('새로 불러왔습니다');
                    } catch (e) {
                        console.error('[stockRefresh]', e);
                        if (typeof flash === 'function') flash('불러오지 못했습니다');
                    }
                    b.innerHTML = t;
                    b.disabled = false;
                    b.style.opacity = '';
                    busy = false;
                }, 0);
            }

            Array.prototype.forEach.call(heads, function (h) {
                if (h.querySelector('.msRefreshBtn')) return;
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'msRefreshBtn';
                b.title = '새로고침';
                b.setAttribute('aria-label', '새로고침');
                b.innerHTML = '⟳';
                /* 헤더에 이미 오른쪽으로 미는 요소(.qfilter 의 margin-left:auto,
                   .htitle 의 flex:1)가 있으면 auto 를 또 주면 안 된다.
                   남은 공간이 둘로 나뉘어 앞 요소가 가운데로 밀려난다. */
                var pushed = Array.prototype.some.call(h.children, function (c) {
                    var cs = getComputedStyle(c);
                    return cs.marginLeft === 'auto' || parseFloat(cs.flexGrow) > 0;
                });
                b.style.cssText = (pushed ? '' : 'margin-left:auto;') + 'flex:0 0 auto;align-self:center;'
                    + 'width:40px;height:40px;border-radius:12px;'
                    + 'border:1px solid var(--line,#dfe3e8);background:var(--surface,#fff);'
                    + 'color:var(--ink-2,#5b6570);font-size:19px;font-weight:800;line-height:1;'
                    + 'cursor:pointer;touch-action:manipulation;'
                    + '-webkit-user-select:none;user-select:none';
                b.addEventListener('click', function () { run(b); });
                h.appendChild(b);
            });
        })();

        function scOn(id) {
            var el = document.getElementById(id);
            return !!el && !el.classList.contains('hide');
        }
        function maskOn(id) {
            var el = document.getElementById(id);
            return !!el && el.classList.contains('show');
        }

        /* ── 재고 새로고침 ── (품목 행의 stock 은 /item_list 가 같이 내려준다) */
        function stockRefresh() {
            if (scOn('scC') && typeof curW !== 'undefined' && curW) refreshItems();
            else if (scOn('scB') && typeof curD !== 'undefined' && curD) refreshWorkers();
            else refreshDays();
            if (maskOn('stockMask')) openStockSheet();
        }

    </script>

    <!-- ===== 스텝퍼 롱프레스 자동증감 (원본 유지) ===== -->
    <style>
        .stepper button, .dateedit button, .timeedit button {
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
    </style>
    <script>
        (function () {
            var SEL = '.stepper button, .dateedit button, .timeedit button';
            var holdTimer = null, repeatTimer = null, maxTimer = null, curBtn = null;
            var END_EVENTS = ['pointerup', 'pointercancel', 'lostpointercapture', 'touchend', 'touchcancel', 'mouseup'];

            function stop() {
                clearTimeout(holdTimer);
                clearInterval(repeatTimer);
                clearTimeout(maxTimer);
                holdTimer = repeatTimer = maxTimer = null;
                if (curBtn) {
                    END_EVENTS.forEach(function (ev) {
                        curBtn.removeEventListener(ev, stop);
                    });
                    curBtn = null;
                }
            }

            function tick(x, y) {
                var el = document.elementFromPoint(x, y);
                var b = (el && el.closest) ? el.closest(SEL) : null;
                if (!b) {
                    stop();
                    return;
                }
                b.click();
            }

            document.addEventListener('pointerdown', function (e) {
                if (e.button != null && e.button > 0) return;
                var btn = e.target.closest ? e.target.closest(SEL) : null;
                if (!btn) return;
                var x = e.clientX, y = e.clientY;
                stop();
                curBtn = btn;
                END_EVENTS.forEach(function (ev) {
                    btn.addEventListener(ev, stop);
                });
                holdTimer = setTimeout(function () {
                    repeatTimer = setInterval(function () {
                        tick(x, y);
                    }, 80);
                    maxTimer = setTimeout(stop, 8000);
                }, 400);
                window.addEventListener('pointerup', stop, {once: true, capture: true});
                window.addEventListener('touchend', stop, {once: true, capture: true});
            });
            window.addEventListener('blur', stop);
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) stop();
            });
        })();
    </script>
</th:block>
