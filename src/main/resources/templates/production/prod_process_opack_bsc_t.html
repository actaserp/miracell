<html layout:decorate="~{layout_page}">

<th:block layout:fragment="content">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"/>
  <style>

      :root{--bg:#E9EEF1;--surface:#FFF;--surface-2:#F4F7F9;--ink:#15222B;--ink-2:#5A6B76;--line:#D8E0E5;
          --teal:#0E7C86;--teal-d:#0A5C64;--teal-bg:#E2F1F2;--green:#1E9D58;--green-bg:#E4F4EA;
          --amber:#C77A00;--amber-bg:#FBEFD8;--red:#C8483B;--red-bg:#F7E4E1;--r:18px;--tap:60px;
          --shadow:0 1px 0 rgba(21,34,43,.04),0 8px 24px -16px rgba(21,34,43,.28)}
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
      .ms-wash-root{font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif;color:var(--ink);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;flex:1 1 auto;min-height:0;height:var(--wash-h,100%);max-height:var(--wash-h,none);display:flex;flex-direction:column}
      .ms-wash-root .app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-radius:12px;overflow:hidden}
      .screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}.screen.hide{display:none}

      /* 큐 */
      .wrap{padding:22px 20px 28px;max-width:1180px;margin:0 auto;width:100%;overflow:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
      .qhead{display:flex;align-items:baseline;gap:12px;margin:2px 2px 18px}
      .qhead h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0}
      .qhead .cnt{color:var(--ink-2);font-weight:700}
      .qfilter{display:flex;gap:8px;margin-left:auto}
      .qfilter button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);
          background:var(--surface);color:var(--ink-2);font-weight:700;font-size:15px;cursor:pointer}
      .qfilter button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
      .searchbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 18px;
          background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
      .searchbar .slab{font-weight:800;color:var(--ink-2);font-size:14px}
      .searchbar .tilde{font-weight:800;color:var(--ink-2)}
      .dinput{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;
          font-weight:700;color:var(--ink);background:var(--surface-2);font-variant-numeric:tabular-nums;min-width:160px}
      .sbtn{height:48px;padding:0 22px;border:none;border-radius:12px;background:var(--teal);color:#fff;
          font-weight:800;font-size:16px;cursor:pointer;margin-left:auto}
      .sbtn:active{background:var(--teal-d)}
      .qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
      .wo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;
          cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease;position:relative;overflow:hidden}
      .wo:active{transform:scale(.985)}
      .wo .edge{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
      .wo[data-st="working"] .edge{background:var(--teal)}.wo[data-st="wait"] .edge{background:var(--amber)}.wo[data-st="done"] .edge{background:var(--green)}
      .wo .row1{display:flex;align-items:center;gap:10px;margin-bottom:8px}
      .wo .wono{font-weight:800;font-size:15px;color:var(--ink-2)}
      .chip{margin-left:auto;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:800}
      .chip.working{background:var(--teal-bg);color:var(--teal-d)}.chip.wait{background:var(--amber-bg);color:var(--amber)}.chip.done{background:var(--green-bg);color:var(--green)}
      .wo .name{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.3;margin:2px 0 14px}
      .wo .meta{display:flex;gap:18px;align-items:flex-end}
      .wo .meta .blk{display:flex;flex-direction:column;gap:2px}
      .wo .meta .lab{font-size:12.5px;color:var(--ink-2);font-weight:700}
      .wo .meta .val{font-size:18px;font-weight:800}
      .wo .prog{margin-left:auto;text-align:right}
      .wo .bar{height:8px;width:120px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:6px}
      .wo .bar>i{display:block;height:100%;background:var(--teal);border-radius:999px}

      /* 공통 상단바(B,C) */
      .topbar2{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);
          padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);z-index:2}
      .back{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);
          display:grid;place-items:center;cursor:pointer;font-size:22px;flex:0 0 auto}
      .back:active{background:var(--line)}
      .htitle{min-width:0;flex:1}
      .htitle .t{font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .htitle .s{font-size:13.5px;color:var(--ink-2);font-weight:700;margin-top:1px}

      /* B. 세션 목록 */
      .col-stack{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;height:100%}
      .bscroll{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px}
      .bgrid{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
      .ovbox{display:flex;gap:12px;flex-wrap:wrap}
      .ov{flex:1;min-width:130px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
          padding:14px 16px;box-shadow:var(--shadow)}
      .ov .l{font-size:13px;color:var(--ink-2);font-weight:700}
      .ov .v{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
      .ov.left .v{color:var(--teal-d)}
      .secline{display:flex;align-items:center;gap:10px;margin:6px 2px 0;color:var(--ink-2);font-weight:800;font-size:14px}
      .secline .ln{flex:1;height:1px;background:var(--line)}
      .sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;
          box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden;
          transition:transform .12s ease}
      .sess:active{transform:scale(.99)}
      .sess .edge{position:absolute;left:0;top:0;bottom:0;width:5px}
      .sess[data-st="working"] .edge{background:var(--teal)}.sess[data-st="done"] .edge{background:var(--green)}
      .sess .who{display:flex;flex-direction:column;gap:2px;min-width:120px}
      .sess .who .nm{font-size:18px;font-weight:800}
      .sess .who .eq{font-size:13px;color:var(--ink-2);font-weight:700}
      .sess .time{font-size:13.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
      .sess .qty{margin-left:auto;text-align:right}
      .sess .qty .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
      .sess .qty .l{font-size:12px;color:var(--ink-2);font-weight:700}
      .sess .badge{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800}
      .sess .badge.working{background:var(--teal-bg);color:var(--teal-d)}.sess .badge.done{background:var(--green-bg);color:var(--green)}
      .emptysess{text-align:center;color:var(--ink-2);font-weight:700;padding:30px;border:1.5px dashed var(--line);border-radius:var(--r)}

      /* C. 세션 작업(부품) */
      .infopill{display:flex;gap:7px;align-items:center;background:var(--surface-2);border:1px solid var(--line);
          border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink-2);cursor:default}
      .infopill.tap{cursor:pointer}.infopill.tap:active{background:var(--line)}
      .infopill b{color:var(--ink);font-variant-numeric:tabular-nums}
      .infopill.tap b{color:var(--teal-d);text-decoration:underline dotted}
      .sstate{padding:8px 14px;border-radius:999px;font-weight:800;font-size:14px}
      .sstate.working{background:var(--teal-bg);color:var(--teal-d)}.sstate.done{background:var(--green-bg);color:var(--green)}
      .part{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
          display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);flex-wrap:wrap}
      .part.locked{opacity:.7}
      .part .id{display:flex;flex-direction:column;min-width:0;flex:1}
      .part .pn{font-size:18px;font-weight:800;letter-spacing:-.02em}
      .part .pc{font-size:13px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
      .stepper{display:flex;align-items:center;flex:0 0 auto}
      .stepper button{width:50px;height:54px;border:1px solid var(--line);background:var(--surface-2);font-size:25px;font-weight:700;cursor:pointer;display:grid;place-items:center}
      .stepper button:active{background:var(--line)}
      .stepper button.minus{border-radius:14px 0 0 14px}.stepper button.plus{border-radius:0 14px 14px 0}
      .stepper .qty{width:90px;height:54px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
          background:#FFFDF4;text-align:center;font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;display:grid;place-items:center;cursor:pointer}
      .done-tag{padding:7px 14px;border-radius:999px;background:var(--green-bg);color:var(--green);font-weight:800;font-size:14px}

      .actionbar{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);
          padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;
          box-shadow:0 -8px 24px -18px rgba(21,34,43,.4)}
      .actionbar .actsum{display:flex;flex-direction:column;margin-right:auto}
      .actionbar .actsum .l{font-size:12.5px;color:var(--ink-2);font-weight:700}
      .actionbar .actsum .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
      .btn{min-height:var(--tap);padding:0 24px;border-radius:16px;border:none;cursor:pointer;font-size:18px;font-weight:800;display:inline-flex;align-items:center;gap:8px}
      .btn.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}.btn.ghost:active{background:var(--line)}
      .btn.primary{background:var(--teal);color:#fff;padding:0 36px;box-shadow:0 8px 18px -8px rgba(14,124,134,.7)}.btn.primary:active{background:var(--teal-d)}
      .btn.start{background:var(--teal);color:#fff;flex:1;justify-content:center;font-size:20px}
      .btn.danger{background:var(--red-bg);color:var(--red)}

      /* 시트 */
      .mask{position:fixed;inset:0;background:rgba(21,34,43,.42);display:none;z-index:40;align-items:flex-end}
      .mask.show{display:flex;animation:fade .15s ease}@keyframes fade{from{opacity:0}to{opacity:1}}
      .sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 20px calc(40px + env(safe-area-inset-bottom));
          box-shadow:0 -20px 40px -20px rgba(0,0,0,.4);animation:rise .2s cubic-bezier(.2,.7,.3,1);max-height:88dvh;overflow:auto}
      @keyframes rise{from{transform:translateY(40px)}to{transform:translateY(0)}}
      .sheet .sh{display:flex;align-items:center;margin-bottom:16px}
      .sheet .sh h3{font-size:20px;font-weight:800;margin:0;letter-spacing:-.02em}
      .sheet .sh .x{margin-left:auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;cursor:pointer}
      .sheet .body{max-width:640px;margin:0 auto}
      .fieldlab{font-size:14px;font-weight:800;color:var(--ink-2);margin:14px 2px 8px}
      .opts{display:flex;flex-wrap:wrap;gap:10px}
      .opt{min-height:54px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
      .opt:active{background:var(--surface-2)}.opt.sel{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-d)}
      .opt .sub{font-size:12.5px;color:var(--ink-2);font-weight:700}
      .sheet .ok{width:100%;margin-top:20px;background:var(--teal);color:#fff;min-height:var(--tap);border:none;border-radius:16px;font-size:19px;font-weight:800;cursor:pointer}
      .sheet .ok:disabled{background:var(--line);color:var(--ink-2)}
      .pad .disp{margin-left:auto;min-width:140px;text-align:right;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px 16px}
      .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;margin:6px auto 0}
      .keys button{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:25px;font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums}
      .keys button:active{background:var(--surface-2)}.keys button.ok{background:var(--teal);color:#fff;border-color:var(--teal);width:auto;margin-top:0;min-height:0;height:62px;border-radius:14px}.keys button.clr{color:var(--red)}
      .dateedit{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 10px}
      .dateedit .dbtn{width:56px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700;cursor:pointer}
      .dateedit .dbtn:active{background:var(--line)}
      .dateedit .dval{min-width:200px;text-align:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
      .timeedit{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0}
      .tcol{display:flex;flex-direction:column;align-items:center;gap:8px}
      .tcol button{width:84px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:700;cursor:pointer}
      .tcol .tv{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;width:84px;text-align:center}
      .tsep{font-size:40px;font-weight:800;padding-bottom:4px}
      @media (max-width:680px){.part .stat{order:3;width:100%;justify-content:space-between}.qgrid{grid-template-columns:1fr}.sess{flex-wrap:wrap}}
      @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

      /* ── 로트 선택 ── */
      .lotpick{display:flex;flex-direction:column;gap:8px}
      .lotopt{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;
          border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
      .lotopt.sel{border-color:var(--teal);background:var(--teal-bg)}
      .lotopt .ln{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
      .lotopt .meta{font-size:12.5px;color:var(--ink-2);font-weight:700;margin-left:auto;text-align:right}
      .region-warn{background:var(--amber-bg);color:var(--amber);border-radius:14px;padding:13px 16px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:10px}
      .mat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
          display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);margin-bottom:10px;flex-wrap:wrap}
      .mat.on{border-color:var(--green);background:linear-gradient(180deg,#F2FBF5,#FFF)}
      .mat .chk{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);
          display:grid;place-items:center;font-size:19px;font-weight:800;color:transparent;flex:0 0 auto;cursor:pointer;background:var(--surface-2)}
      .mat.on .chk{border-color:var(--green);background:var(--green);color:#fff}
      .mat .mid{flex:1;min-width:0}
      .mat .mn{font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.3}
      .mat .mc{font-size:12.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
      .mat .mstep{display:flex;align-items:center;flex:0 0 auto}
      .mat .mstep button{width:44px;height:48px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700;cursor:pointer}
      .mat .mstep button:first-child{border-radius:12px 0 0 12px}
      .mat .mstep button:last-child{border-radius:0 12px 12px 0}
      .mat .mstep .n{width:58px;height:48px;display:grid;place-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums;background:#FFFDF4}
      .mat .mstep.locked{opacity:.55;pointer-events:none}
      .mat-tools{display:flex;gap:8px;margin:2px 2px 10px;flex-wrap:wrap}
      .mat-tools button{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);
          background:var(--surface);color:var(--ink-2);font-weight:800;font-size:14px;cursor:pointer}
      .mat-tools button:active{background:var(--surface-2)}
      /* 국가 배분 드롭다운 */
      .csel{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:15px;font-weight:800;
          background:var(--surface-2);color:var(--ink);min-width:160px;font-variant-numeric:tabular-nums;cursor:pointer}

      /* ── 부적합(조립에서 이식) ── */
      .part .stat{display:flex;gap:20px;align-items:center;flex:0 0 auto}
      .part .col{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
      .part .col .l{font-size:12px;font-weight:700;color:var(--ink-2)}
      .part .col .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
      .part .col .v.bad{color:var(--red)}
      .mat .stat{display:flex;gap:16px;align-items:center;flex:0 0 auto}
      .mat .col{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
      .mat .col .l{font-size:11.5px;font-weight:700;color:var(--ink-2)}
      .mat .col .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
      .mat .col .v.bad{color:var(--red)}
      .defbtn{height:48px;padding:0 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
          color:var(--ink-2);font-weight:800;font-size:14px;cursor:pointer;flex:0 0 auto}
      .defbtn:active{background:var(--surface-2)}.defbtn.has{background:var(--red-bg);color:var(--red);border-color:transparent}
      .sess .bad{padding:5px 10px;border-radius:999px;background:var(--red-bg);color:var(--red);font-weight:800;font-size:12.5px}
      .photos{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
      .photo{width:84px;height:84px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
      .photo-add{width:84px;height:84px;border-radius:12px;border:1.5px dashed var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);font-size:13px;font-weight:800;text-align:center}
      .photo-wrap{position:relative}
      .photo-wrap .del{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;border:2px solid #fff;font-size:13px;cursor:pointer;line-height:1}

      /* ── 단계(phase) 표시 ── */
      .phasebar{display:flex;align-items:center;gap:8px;margin:2px 2px 8px;flex-wrap:wrap}
      .pstep{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
          background:var(--surface);font-weight:800;font-size:14px;color:var(--ink-2)}
      .pstep .pn2{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--surface-2);color:var(--ink-2)}
      .pstep.active{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-d)}
      .pstep.active .pn2{background:var(--teal);color:#fff}
      .pstep.done{border-color:var(--green);background:var(--green-bg);color:var(--green)}
      .pstep.done .pn2{background:var(--green);color:#fff}
      .pline{flex:0 0 18px;height:2px;background:var(--line)}
      .pline.on{background:var(--green)}

      /* ── 카메라 스캔 시트 ── */
      /* 인식 박스는 화면 표시용 크기일 뿐, 바코드 인식은 비디오 원본 해상도로 처리됨.
         → 박스를 줄여도 인식 정확도에는 영향 없음. (aspect-ratio/max-height만 조절) */
      .scanbox{position:relative;width:100%;aspect-ratio:16/8;max-height:210px;margin:0 auto;border-radius:18px;overflow:hidden;
          background:radial-gradient(120% 120% at 50% 20%,#26333c 0%,#141d24 70%,#0c1319 100%);
          box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
      .scanbox .noise{position:absolute;inset:0;opacity:.10;
          background-image:radial-gradient(#fff 1px,transparent 1px);background-size:5px 5px}
      .scanbox .frame{position:absolute;inset:14% 12%;border-radius:14px}
      .scanbox .frame span{position:absolute;width:34px;height:34px;border:3px solid #fff;opacity:.92}

  <script th:inline="none">
   /* ── 높이 자동 맞춤 ── */
   (function () {
    const root = document.querySelector('.ms-wash-root');
    if (!root) return;

    function localBelow() {
     let below = 0, node = root;
     while (node && node !== document.body) {
      let sib = node.nextElementSibling;
      while (sib) {
       const r = sib.getBoundingClientRect();
       if (r.height > 0 && getComputedStyle(sib).position !== 'fixed') below += r.height;
       sib = sib.nextElementSibling;
      }
      node = node.parentElement;
     }
     let fx = 0;
     document.querySelectorAll('body *').forEach(el => {
      if (root.contains(el)) return;
      const cs = getComputedStyle(el);
      if (cs.position !== 'fixed' && cs.position !== 'sticky') return;
      const r = el.getBoundingClientRect();
      if (r.height > 0 && r.height < innerHeight * 0.5 && r.bottom > innerHeight - 2) fx = Math.max(fx, r.height);
     });
     return Math.max(below, fx);
    }

    function availBottom() {
     let bottom = window.innerHeight;
     try {
      const fe = window.frameElement;
      if (fe) {
       const pWin = window.parent, pDoc = pWin.document;
       const feTop = fe.getBoundingClientRect().top;
       let flow = 0, node = fe;
       while (node && node !== pDoc.body) {
        let sib = node.nextElementSibling;
        while (sib) {
         const cs = pWin.getComputedStyle(sib), r = sib.getBoundingClientRect();
         if (r.height > 0 && cs.position !== 'fixed' && cs.position !== 'absolute') flow += r.height;
         sib = sib.nextElementSibling;
        }
        node = node.parentElement;
       }
       let fx = 0;
       pDoc.querySelectorAll('body *').forEach(el => {
        if (el === fe || el.contains(fe)) return;
        const cs = pWin.getComputedStyle(el);
        if (cs.position !== 'fixed' && cs.position !== 'sticky' && cs.position !== 'absolute') return;
        const r = el.getBoundingClientRect();
        if (r.height > 0 && r.height <= 160 && r.top > feTop && r.bottom > pWin.innerHeight - 40)
         fx = Math.max(fx, r.bottom - r.top);
       });
       const pFooter = Math.max(flow, fx);
       bottom = Math.min(bottom, (pWin.innerHeight - pFooter) - feTop);
      }
     } catch (e) {
     }
     return bottom;
    }

    function fit() {
     const top = root.getBoundingClientRect().top;
     const avail = availBottom() - top - localBelow();
     root.style.setProperty('--wash-h', Math.max(320, Math.floor(avail)) + 'px');
    }

    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', fit);
    try {
     window.parent.addEventListener('resize', fit);
    } catch (e) {
    }
    fit();
    requestAnimationFrame(fit);
    setTimeout(fit, 200);
    setTimeout(fit, 600);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
   })();

   const WD = ['일', '월', '화', '수', '목', '금', '토'];
   const WORKERS = ['정우철', '김민수', '이서연', '박지훈'];
   const EQUIPS = [['외포장대 A', 'OP-01'], ['외포장대 B', 'OP-02']];
   const STLAB = {working: '작업중', wait: '대기', done: '완료'};

   function nowHM() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
   }

   function pill(v) {
    if (!v) return '--:--';
    if (v.indexOf(' ') >= 0) {
     var a = v.split(' ');
     return a[0].slice(5) + ' ' + a[1];
    }
    return v;
   }

   /* REAL_INJECTED */
   // ════ 1공장 포장공정 — BSC / BmSC 통합 (목업 BOM) ════
   // 국가별 CK 자재 구성은 차수(00/03) 그룹이 아니라 "국가 코드" 단위로 개별 관리한다.
   // 국가 추가는 이 목록에만 등록하면 되고(코드 자유), 배분·CK 투입 로직은 자동으로 국가별 독립 처리된다.
   var COUNTRIES = [
    {code: 'KR', name: '한국(국내)', flag: '🇰🇷'},
    {code: 'US', name: '미국',       flag: '🇺🇸'},
    {code: 'CA', name: '캐나다',     flag: '🇨🇦'},
    {code: 'JP', name: '일본',       flag: '🇯🇵'},
    {code: 'CO', name: '콜롬비아',   flag: '🇨🇴'},
    {code: 'DE', name: '독일',       flag: '🇩🇪'},
    {code: 'GB', name: '영국',       flag: '🇬🇧'},
    {code: 'AU', name: '호주',       flag: '🇦🇺'}
   ];
   function countryOf(code) {
    return COUNTRIES.filter(function (c) { return c.code === code; })[0];
   }

   // 멸균 완료(멸균필) PK 로트 — 포장공정에서 선택
   var PK_READY = [
    {lot: 'BmSC60-PK00-260626', name: 'BmSC+③ 60ml 골수처리', gtin: '08801234560056', qty: 100, expiry: '2027-03-28'},
    {lot: 'BSC30-PK00-260626',  name: 'BSC+③ 30ml 00차수',    gtin: '08801234560018', qty: 40,  expiry: '2027-01-19'}
   ];

   // 멸균 완료(멸균필) 필터백 로트 — CK 투입 시 '멸균된 로트'만 사용 가능.
   // steril: true 인 로트만 목록에 노출된다(미멸균 로트는 애초에 선택 불가).
   var FILTERBAG_LOTS = [
    {lot: 'FB-260628-EO', name: '필터백', qty: 200, expiry: '2027-06-28', steril: true},
    {lot: 'FB-260701-EO', name: '필터백', qty: 150, expiry: '2027-07-01', steril: true},
    {lot: 'FB-260705-EO', name: '필터백', qty: 120, expiry: '2027-07-05', steril: true}
   ];
   function sterilFilterbagLots() {
    return FILTERBAG_LOTS.filter(function (l) { return l.steril; });
   }
   // 선입선출(FIFO) 기본 로트: 유효기간이 가장 이른 멸균 완료 로트를 우선 사용
   function fifoFilterbagLot() {
    var opts = sterilFilterbagLots().slice().sort(function (a, b) {
     return (a.expiry || '') < (b.expiry || '') ? -1 : (a.expiry || '') > (b.expiry || '') ? 1 : 0;
    });
    return opts.length ? opts[0].lot : null;
   }

   // CK BOM — 제품별 · 국가별 수량. 국가 코드로 직접 지정(q['KR'], q['US'] …)하고,
   // 명시되지 않은 국가는 q['default'] 값을 사용한다. 즉 국가마다 값을 다르게 얼마든지 오버라이드 가능.
   // 수량이 0이면 해당 국가에서 '제외'(부자재 미삽입).
   var CK_BOM = {
    // BmSC+③ 60ml (골수처리) — 라벨/BOM 시트 기준
    'BmSC60': [
     {code: 'M-DS00024', name: 'BD락주사기 10CC',                  q: {default: 1}},
     {code: 'M-DS00025', name: 'BD 주사기 20mL',                   q: {default: 5}},
     {code: 'M-DS00026', name: 'BD락주사기 30mL',                  q: {default: 8}},
     {code: 'M-DM00028', name: 'VacLok 주사기 30mL',               q: {default: 8}},
     {code: 'M-DR00038', name: '골수처리용기구 천자침/탑침(수출용)', q: {KR: 0, default: 2}},
     {code: 'M-DR00037', name: '천자침(국내제작용)',                q: {KR: 2, default: 0}},
     {code: 'M-DN00047', name: 'Mixing Tube',                      q: {KR: 5, default: 0}},
     {code: 'M-DDW00038', name: '18G-S34(니들)',                   q: {KR: 8, default: 0}},
     {code: 'M-DE00021', name: '부속품 세트 대',                    q: {default: 1}},
     {code: 'M-GP00002', name: '골수 120ml/240ml 커버박스',         q: {default: 1}},
     {code: 'ETC-STK-SYR', name: '주사기 부착용 스티커',            q: {default: 2}},
     {code: 'ETC-STK-LOT', name: '골수 LOT 스티커',                q: {default: 2}},
     {code: 'WIP-ETC0001', name: '필터백',                         q: {default: 1}, sterileLot: true}
    ],
    // BSC+③ 30ml (혈액처리) — 기존 시드 유지
    'BSC30': [
     {code: 'M-DS00024', name: 'BD락주사기 10CC',        q: {default: 1}},
     {code: 'M-DS00026', name: 'BD락주사기 30CC',        q: {default: 1}},
     {code: 'M-DE00019', name: '부속품 소',              q: {default: 1}},
     {code: 'ETC-STK-LOT-30', name: '혈액 LOT 스티커(30ml)', q: {default: 1}},
     {code: 'M-DDW00038', name: '18G-S34(니들)',         q: {KR: 1, default: 0}},
     {code: 'M-DDW00037', name: 'G.P.카테터 I.V.CATHETER', q: {default: 1}},
     {code: 'M-GP00003', name: '혈액 30ml/60ml/120ml 커버박스', q: {default: 1}}
    ]
   };
   // 현재 작업지시 제품의 CK BOM
   function ckInputs() {

   // GS1-128 파싱: (01)GTIN (10)LOT (11)제조일 (17)유효기간 (30)수량 → 객체
   function parseGs1(raw) {
    raw = String(raw || '');
    var out = {raw: raw, gtin: null, lot: null, date: null, expiry: null, qty: null};
    var m;
    if (raw.indexOf('(') >= 0) {           // 괄호 표기(사람이 읽는 표기/수동입력)
     if ((m = raw.match(/\(01\)(\d+)/))) out.gtin = m[1];
     if ((m = raw.match(/\(10\)([^()\u001d]+)/))) out.lot = m[1];
     if ((m = raw.match(/\(11\)(\d{6})/))) out.date = m[1];
     if ((m = raw.match(/\(17\)(\d{6})/))) out.expiry = m[1];
     if ((m = raw.match(/\(30\)(\d+)/))) out.qty = parseInt(m[1], 10);
     if (!out.gtin && !out.lot) out.lot = raw.trim();
     return out;
    }
    // 원시 element string. FNC1은 GS(0x1D)로 들어오는 경우가 많음.
    var GS = '\u001d';
    var s = raw.replace(/^\]C1/, '').replace(/^\u001d/, ''); // 심볼로지 식별자/선행 FNC1 제거
    var FIXED = {'00': 18, '01': 14, '02': 14, '11': 6, '12': 6, '13': 6, '15': 6, '16': 6, '17': 6, '20': 2};
    var i = 0;
    function assign(ai, v) {
     if (ai === '01') out.gtin = v;
     else if (ai === '10') out.lot = v;
     else if (ai === '11') out.date = v;
     else if (ai === '17') out.expiry = v;
     else if (ai === '30') out.qty = parseInt(v, 10);
    }
    while (i < s.length) {
     if (s[i] === GS) { i++; continue; }
     var ai = s.substr(i, 2); i += 2;         // 대상 AI(01/10/11/17/30)는 모두 2자리
     var flen = FIXED[ai];
     if (flen != null) { assign(ai, s.substr(i, flen)); i += flen; }
     else {                                    // 가변길이: GS 또는 끝까지
      var g = s.indexOf(GS, i);
      var end = g < 0 ? s.length : g;
      assign(ai, s.substring(i, end)); i = end;
     }
    }
    if (!out.gtin && !out.lot && s) out.lot = s.trim();
    return out;
   }

   // 파싱 객체 → GS1-128 문자열 재조합(표시용)
   function gs1Line(d) {
    if (!d) return '-';
    var s = '';
    if (d.gtin) s += '(01)' + d.gtin;
    if (d.lot) s += '(10)' + d.lot;
    if (d.qty != null) s += '(30)' + d.qty;
    if (d.date) s += '(11)' + d.date;
    return s || (d.raw || '-');
   }

   function allocList(locked) {
    var rows = curS.allocations || [];
    var html = rows.map(function (a, i) {
     var c = countryOf(a.country);
     var sel = COUNTRIES.map(function (co) {
      return '<option value="' + co.code + '"' + (co.code === a.country ? ' selected' : '') + '>' + co.flag + ' ' + co.name + '</option>';
     }).join('');
     return '<div class="mat on">' +
      '<div class="mid" style="flex:1 1 170px">' +
      (locked
       ? '<div class="mn">' + (c ? c.flag + ' ' + c.name : '-') + '</div><div class="mc">' + (c && a.qty > 0 ? 'CK ' + ckLotFor(a.country) : '') + '</div>'
       : '<select class="csel" data-alloc="' + i + '">' + sel + '</select>') +
      '</div>' +
      (locked
       ? '<span class="done-tag">' + (a.qty || 0) + ' EA</span>'
       : '<div class="mstep" data-allocqty="' + i + '"><button class="minus">−</button><div class="n" data-padalloc="' + i + '">' + (a.qty || 0) + '</div><button class="plus">+</button></div>' +
       '<button class="defbtn" data-allocdel="' + i + '">삭제</button>') +
      '</div>';
    }).join('');
    if (!rows.length) html += '<div class="emptysess" style="margin-bottom:10px">국가 배분이 없습니다. ‘＋ 국가 추가’로 국가별 수량을 지정하세요.</div>';
    if (!locked) html += '<div class="mat-tools"><button data-allocadd="1">＋ 국가 추가</button><button data-allocfill="1">잔여 자동배분</button></div>';
    return html;
   }
   function pkSummary() {
    var pm = pkMeta(curS.pkLot);
    return '<div class="secline">① PK · 수량 · 국가 <span class="ln"></span><span>완료</span></div>' +
     '<div class="part"><div class="id"><span class="pn">' + (pm ? pm.lot : '-') + '</span><span class="pc">' +
     (pm ? pm.name : '') + ' · ' + allocText() + '</span></div><span class="done-tag">' + curS.units + ' EA</span></div>';
   }
   // 국가별로 CK 자재 투입을 완전히 분리해서 각각 표시/관리한다 (차수 그룹 없음).
   // 국가 카드를 탭하면 그 국가에 투입할 자재 목록이 펼쳐진다.
   //  · 각 자재는 수량을 자유롭게 입력(스텝퍼/넘패드)
   //  · 필터백은 '멸균 완료' 로트만 선택 가능
   function ckMatList(locked, reviewOnly) {
    var allocs = (curS.allocations || []).filter(function (a) { return (a.qty || 0) > 0; });
    var list = ckInputs();
    if (!allocs.length) {
     return '<div class="emptysess">국가별 배분이 없습니다. ① 단계에서 국가별 수량을 먼저 지정하세요.</div>';
    }
    if (!curS.ckOpen) curS.ckOpen = {};
    return allocs.map(function (a) {
     var c = countryOf(a.country);
     var lot = ckLotFor(a.country);
     var open = !!curS.ckOpen[a.country];
     var matCount = list.filter(function (m) { return ckQtyByKey(ckKey(a.country, m.code)) > 0; }).length;

     // 국가 헤더 카드 (탭 → 펼침/접힘)
     var head = '<div class="mat ckhead" data-ckcountry="' + a.country + '" style="background:var(--surface-2);cursor:pointer">' +
      '<div class="mid"><div class="mn" style="font-size:15px">' +
      (c ? c.flag + ' ' + c.name : a.country) + ' · ' + a.qty + ' EA</div>' +
      '<div class="mc">국가별 독립 CK 투입 · 로트 ' + lot + ' · 투입자재 ' + matCount + '종</div></div>' +
      '<span class="done-tag" style="background:var(--surface);color:var(--teal-d);border:1px solid var(--line)">' +
      (open ? '▲ 접기' : '▼ 자재 보기') + '</span></div>';

     if (!open) return head;

     // 펼침: 자재 행 (수량 자유 입력 / 열람모드는 투입된 자재만)
     var rows = list.map(function (m) {
      var key = ckKey(a.country, m.code);
      var qty = ckQtyByKey(key);
      var used = qty > 0;
      if (reviewOnly && !used) return '';   // 열람모드: 투입수량 0 자재는 숨김
      var isFB = !!m.sterileLot;
      var manualLot = ckLotOf(key);                          // 사용자가 직접 바꾼 로트
      var fifoLot = isFB ? fifoFilterbagLot() : null;         // FIFO 기본값(유효기간 최선)
      var selLot = manualLot || fifoLot;                      // 실제 적용 로트
      var autoFifo = isFB && !manualLot && !!fifoLot;         // FIFO 자동선택 상태 여부
      var per = matQtyFor(m, a.country);        // BOM 개당 수량
      var bomNeed = ckDefaultQty(a.country, m); // BOM 투입수량(개당 × 국가배분)

      // 필터백: 멸균 로트 표시(FIFO 자동선택, 변경 가능)
      var fbInfo = '';
      if (isFB) {
       fbInfo = selLot
        ? ' · <b style="color:var(--green)">멸균로트 ' + selLot + '</b>' +
        (autoFifo ? ' <span style="font-size:11px;color:var(--teal-d);font-weight:800">(FIFO 자동)</span>' : ' <span style="font-size:11px;color:var(--ink-2);font-weight:800">(수동)</span>')
        : ' · <b style="color:var(--amber)">사용 가능한 멸균 완료 로트 없음</b>';
      }
      var fbBtn = (isFB && !locked)
       ? '<button class="defbtn" data-cklot="' + key + '"' +
       (selLot ? '' : ' style="background:var(--amber-bg);color:var(--amber);border-color:transparent"') +
       '>' + (selLot ? '멸균로트 변경' : '멸균로트') + '</button>'
       : '';

      // 수량 컨트롤
      var qtyCtrl = locked
       ? '<span class="done-tag">' + qty + ' EA</span>'
       : '<div class="mstep" data-ckqty="' + key + '"><button class="minus">−</button>' +
       '<div class="n" data-ckpad="' + key + '">' + qty + '</div><button class="plus">+</button></div>';

      return '<div class="mat ' + (used ? 'on' : '') + '"' + (used ? '' : ' style="opacity:.55"') + '>' +
       '<div class="chk">' + (used ? '✓' : '—') + '</div>' +
       '<div class="mid"><div class="mn">' + m.name + (isFB ? ' <span style="font-size:11px;color:var(--teal-d);font-weight:800">[멸균]</span>' : '') + '</div>' +
       '<div class="mc">' + m.code + ' · BOM 투입 <b>' + bomNeed + '</b> (개당 ' + per + ')' + fbInfo + '</div></div>' +
       fbBtn + qtyCtrl +
       '</div>';
     }).join('');

     var rowsHtml = rows || (reviewOnly ? '<div class="mc" style="padding:8px 12px;color:var(--ink-2)">이 국가에 투입된 자재가 없습니다.</div>' : '');
     return head + '<div style="padding:0 2px 10px;margin-bottom:6px">' + rowsHtml + '</div>';
    }).join('');
   }
   function ckSummary() {
    return '<div class="secline">② CK 자재 투입 <span class="ln"></span><span>완료</span></div>' +
     '<div class="part"><div class="id"><span class="pn">CK 자재 투입 완료</span><span class="pc">' +
     activeCountryList() + '</span></div><span class="done-tag">' + curS.units + ' EA</span></div>';
   }
   function udiTable() {
    var ck = curS.scanCkpk, ib = curS.scanInbox;
    var inboxLot = curS.outSysLot
     ? curS.outSysLot
     : '<span style="color:var(--ink-2)">포장 완료 시 발번</span>';
    return '<table class="form-tbl"><tr><th>라벨 로트</th><th>시스템 로트(발번)</th><th>비고</th></tr>' +
     '<tr><td><b>PK</b></td><td>' + (curS.pkSysLot || '-') + '</td><td>멸균 완료 PK</td></tr>' +
     '<tr><td><b>CK</b></td><td>' + (curS.ckSysLot || '-') + '</td><td>CK 자재 투입</td></tr>' +
     '<tr><td><b>인박스</b></td><td>' + inboxLot + '</td><td>완제품 포장(인박스)</td></tr>' +
     '</table>' +
     '<div class="mc" style="margin-top:6px">① CK·PK 스캔: <b style="word-break:break-all">' + gs1Line(ck) + '</b></div>' +
     '<div class="mc" style="margin-top:2px">② 인박스 스캔: <b style="word-break:break-all">' + gs1Line(ib) + '</b></div>';
   }
   function udiScanBlock(locked) {
    var done = !!(curS.scanCkpk && curS.scanInbox);
    var html = '<div class="secline" style="margin-top:10px">완제품 라벨(UDI) <span class="ln"></span><span>CK·PK + 인박스 = 2회 스캔</span></div>';
    if (!done) {
     html += '<div class="part"><div class="id"><span class="pn">📷 UDI 라벨 2회 스캔</span><span class="pc">① CK·PK 라벨(수량 없음) + ② 인박스 라벨(수량 있음)을 각각 스캔합니다. 시스템 자체 바코드는 별도 부착하지 않습니다.</span></div>' +
      (locked ? '' : '<button class="btn primary" id="scanIn" style="min-height:54px">스캔</button>') + '</div>';
    } else {
     html += udiTable() + (locked ? '' : '<div style="margin-top:6px"><button class="btn ghost" id="rescanIn">다시 스캔</button></div>');
    }
    return html;
   }
   function packHierarchy(pv) {
    return '<div class="part"><div class="id"><span class="pn">인박스</span><span class="pc">완제품 ' + curS.units + '개 = 인박스 ' + pv.inbox + ' (완제품 1개당 인박스 1개)</span></div>' +
     '<span class="done-tag">' + pv.inbox + ' 박스</span></div>' +
     '<div class="part"><div class="id"><span class="pn">카톤(아웃박스)</span><span class="pc">인박스 ' + pv.inbox + ' ÷ ' + pv.oc + '입 = 카톤 ' + pv.outbox + (pv.inLoose ? ' + 잔여 인박스 ' + pv.inLoose : '') + '</span></div>' +
     '<span class="done-tag">' + pv.outbox + ' 박스</span></div>';
   }
   function cartonPrintBlock(pv) {
    var note = '<div class="part locked"><div class="id"><span class="pn">완제품 UDI 라벨</span><span class="pc">외부(ERP/UDI) 인쇄물 — MES는 스캔 지정만, 별도 출력 없음</span></div><span class="done-tag" style="background:var(--surface-2);color:var(--ink-2)">스캔 지정</span></div>';
    var btns = '';
    if (pv.outbox > 0) btns += '<button class="btn primary" id="bcCartonFull" style="flex:1;min-height:56px">🗳 카톤 동일수량 바코드 (1종 · ' + pv.outbox + '장)</button>';
    if (pv.inLoose > 0) btns += '<button class="btn ghost" id="bcCartonPart" style="flex:1;min-height:56px">카톤 상이수량 분리 (1장 · 인박스 ' + pv.inLoose + ')</button>';
    if (!btns) btns = '<div class="emptysess" style="flex:1">카톤 1개(인박스 ' + pv.oc + ') 채우려면 완제품 ' + (pv.ic * pv.oc) + '개 필요</div>';
    return '<div class="secline">카톤 라벨 <span class="ln"></span><span>동일수량 1바코드 · 상이 분리 출력</span></div>' + note +
     '<div class="printrow">' + btns + '</div>';
   }

   function renderCBody() {
    var locked = curS.st !== 'working';
    var o = curO;
    var ph = curS.phase || 'pk';
    var idx = phaseIndex();
    var pm = pkMeta(curS.pkLot);
    var pv = packView(o, curS.units);
    var html = phaseBar();

    /* ── ① PK · 수량 · 국가 ── */
    if (ph === 'pk') {
     html += '<div class="secline">① PK 선택 <span class="ln"></span><span>멸균 완료 PK → 수량 → 국가</span></div>';
     html += pkRow(pm, locked);
     html += unitsRow(locked);
     html += '<div class="secline">국가별 배분 <span class="ln"></span><span>' + allocSummary() + '</span></div>';
     html += allocList(locked);
    } else {
     html += pkSummary();
    }

    /* ── ② CK 자재 투입 ── */
    if (ph === 'ck') {
     html += '<div class="secline">② CK 자재 투입 <span class="ln"></span><span>국가별 구성(삽입/제외) 자동 반영</span></div>';
     html += ckMatList(locked);
    } else if (idx > 1) {
     html += ckSummary();
     // 완료/후속 단계에서도 CK 투입 내역을 열람 가능하도록(읽기전용). 국가 탭으로 상세 펼침.
     html += '<div class="secline" style="margin-top:6px">CK 투입 내역 열람 <span class="ln"></span><span>국가 탭 → 자재·수량·멸균로트</span></div>';
     html += ckMatList(true, true);
    }

    /* ── ③ 라벨 · 카톤 포장 ── */
    if (ph === 'out' || ph === 'done') {
     html += '<div class="secline">③ 라벨 · 카톤 포장 <span class="ln"></span><span>인박스 1:1 / 카톤 ' + pv.oc + '입</span></div>';
     html += udiScanBlock(locked);
     html += packHierarchy(pv);
     html += cartonPrintBlock(pv);
    }

    document.getElementById('cBody').innerHTML = html;
   }

   function delSess() {
    curO.sessions.splice(curS._idx, 1);
    renderSessList();
    show('B');
    flash('작업 삭제 (목업)');
   }

   function actsum(l, v) {
    return '<div class="actsum"><span class="l">' + l + '</span><span class="v">' + v + '</span></div>';
   }

   function renderCAction() {
    var bar = document.getElementById('cAction');
    var ph = curS.phase || 'pk';

    // 완료 상태
    if (curS.st === 'done' || ph === 'done') {
     bar.innerHTML = actsum('완제품 포장', curS.units + ' EA') + '<button class="btn danger" id="cCancel">완료취소</button>';
     document.getElementById('cCancel').onclick = function () {
      curS.st = 'working';
      curS.phase = 'out';
      curS.end = null;
      renderCHead(); renderCBody(); renderCAction(); renderSessList();
      flash('완료취소 → 라벨·카톤포장 (목업)');
     };
     return;
    }

    // ① PK · 수량 · 국가
    if (ph === 'pk') {
     var ok = curS.pkLot && curS.units > 0 && allocRemain() === 0;
     bar.innerHTML = actsum('완제품 수량', curS.units + ' EA · ' + allocSummary()) +
      '<button class="btn ghost" id="cDelete">삭제</button>' +
      '<button class="btn primary" id="pkDone" ' + (ok ? '' : 'disabled style="opacity:.5"') + '>PK·국가 완료</button>';
     document.getElementById('pkDone').onclick = function () {
      if (!curS.pkLot) { flash('멸균 PK 로트를 선택하세요'); return; }
      if (curS.units <= 0) { flash('완제품 수량을 입력하세요'); return; }
      if (allocRemain() !== 0) { flash('국가별 배분 합계가 완제품 수량과 일치해야 합니다'); return; }
      if (!curS.ckSysLot) curS.ckSysLot = genLot(2);
      curS.phase = 'ck';
      renderCBody(); renderCAction(); renderSessList();
      flash('PK·국가 완료 → CK 자재 투입 (목업)');
     };
     document.getElementById('cDelete').onclick = delSess;
     return;
    }

    // ② CK 자재 투입
    if (ph === 'ck') {
     bar.innerHTML = actsum('CK 자재', activeCountryList() === '-' ? '국가 미지정' : '국가별 개별 투입') +
      '<button class="btn ghost" id="ckBack">‹ PK</button>' +
      '<button class="btn primary" id="ckDone">CK 완료</button>';
     document.getElementById('ckBack').onclick = function () {
      curS.phase = 'pk';
      renderCBody(); renderCAction();
     };
     document.getElementById('ckDone').onclick = function () {
      // 필터백: 투입수량>0 이면 멸균 완료 로트 확정. 미변경 시 FIFO 기본값을 저장.
      var allocs = (curS.allocations || []).filter(function (a) { return (a.qty || 0) > 0; });
      var fbMats = ckInputs().filter(function (m) { return m.sterileLot; });
      if (!curS.ckLotSel) curS.ckLotSel = {};
      for (var ai = 0; ai < allocs.length; ai++) {
       for (var mi = 0; mi < fbMats.length; mi++) {
        var key = ckKey(allocs[ai].country, fbMats[mi].code);
        if (ckQtyByKey(key) > 0) {
         var chosen = ckLotOf(key) || fifoFilterbagLot();  // 수동선택 우선, 없으면 FIFO
         if (!chosen) {  // 멸균 완료 로트 자체가 없을 때만 차단
          var cc = countryOf(allocs[ai].country);
          if (!curS.ckOpen) curS.ckOpen = {};
          curS.ckOpen[allocs[ai].country] = true;
          renderCBody(); renderCAction();
          flash((cc ? cc.name + ' · ' : '') + fbMats[mi].name + ' — 사용 가능한 멸균 완료 로트가 없습니다');
          return;
         }
         curS.ckLotSel[key] = chosen;  // 확정 저장(FIFO 기본값 포함)
        }
       }
      }
      curS.phase = 'out';
      renderCBody(); renderCAction(); renderSessList();
      flash('CK 완료 (로트 ' + (curS.ckSysLot || '-') + ') → 라벨·카톤포장 (목업)');
     };
     return;
    }

    // ③ 라벨 · 카톤 포장
    var pv = packView(curO, curS.units);
    bar.innerHTML = actsum('카톤(아웃박스)', pv.outbox + ' 박스') +
     '<button class="btn ghost" id="outBack">‹ CK</button>' +
     '<button class="btn primary" id="outDone" ' + ((curS.scanCkpk && curS.scanInbox) ? '' : 'disabled style="opacity:.5"') + '>포장 공정 완료</button>';
    document.getElementById('outBack').onclick = function () {
     curS.phase = 'ck';
     renderCBody(); renderCAction();
    };
    document.getElementById('outDone').onclick = function () {
     if (!(curS.scanCkpk && curS.scanInbox)) { flash('CK·PK + 인박스 라벨 2회 스캔이 필요합니다'); return; }
     if (!curS.outSysLot) curS.outSysLot = genLot(3);
     curS.st = 'done';
     curS.phase = 'done';
     curS.end = nowHM();
     renderCHead(); renderCBody(); renderCAction(); renderSessList();
     flash('포장 공정 완료 (완제품 로트 ' + curS.outSysLot + ') → 출하대기 (목업)');
    };
   }

   document.getElementById('cBody').addEventListener('click', function (e) {
    // 완제품 수량 스텝퍼
    var uStep = e.target.closest('[data-units]');
    if (uStep && (e.target.classList.contains('plus') || e.target.classList.contains('minus'))) {
     var d = e.target.classList.contains('plus') ? 1 : -1;
     curS.units = Math.max(0, curS.units + d);
     renderCBody(); renderCAction(); renderSessList();
     return;
    }
    if (e.target.closest('[data-padunits]')) { openPadUnits(); return; }

    // 국가 배분 수량 스텝퍼
    var aStep = e.target.closest('[data-allocqty]');
    if (aStep && (e.target.classList.contains('plus') || e.target.classList.contains('minus'))) {
     var ai = +aStep.dataset.allocqty;
     var dd = e.target.classList.contains('plus') ? 1 : -1;
     var a = curS.allocations[ai];
     if (a) { a.qty = Math.max(0, (a.qty || 0) + dd); renderCBody(); renderCAction(); renderSessList(); }
     return;
    }
    var padA = e.target.closest('[data-padalloc]');
    if (padA) { openPadAlloc(+padA.dataset.padalloc); return; }

    // 국가 추가 / 자동배분 / 삭제
    if (e.target.closest('[data-allocadd]')) {
     var used = (curS.allocations || []).map(function (x) { return x.country; });
     var next = COUNTRIES.filter(function (c) { return used.indexOf(c.code) < 0; })[0] || COUNTRIES[0];
     curS.allocations.push({country: next.code, qty: Math.max(0, allocRemain())});
     renderCBody(); renderCAction(); renderSessList();
     return;
    }
    if (e.target.closest('[data-allocfill]')) {
     var rem = allocRemain();
     if (!curS.allocations.length) { curS.allocations.push({country: 'KR', qty: Math.max(0, curS.units)}); }
     else { var last = curS.allocations[curS.allocations.length - 1]; last.qty = Math.max(0, (last.qty || 0) + rem); }
     renderCBody(); renderCAction(); renderSessList();
     return;
    }
    var adel = e.target.closest('[data-allocdel]');
    if (adel) { curS.allocations.splice(+adel.dataset.allocdel, 1); renderCBody(); renderCAction(); renderSessList(); return; }

    // PK 로트 변경
    if (e.target.closest('[data-pickpk]')) { openPk(); return; }

    // UDI 스캔
    if (e.target.id === 'scanIn' || e.target.id === 'rescanIn') { openScan(); return; }

    // CK 국가 카드 펼침/접힘
    var ckHead = e.target.closest('[data-ckcountry]');
    if (ckHead) {
     var cc = ckHead.dataset.ckcountry;
     if (!curS.ckOpen) curS.ckOpen = {};
     curS.ckOpen[cc] = !curS.ckOpen[cc];
     renderCBody(); renderCAction();
     return;
    }

    // CK 자재 투입수량 스텝퍼(±)
    var ckStep = e.target.closest('[data-ckqty]');
    if (ckStep && (e.target.classList.contains('plus') || e.target.classList.contains('minus'))) {
     var ckKeyV = ckStep.dataset.ckqty;
     var cd = e.target.classList.contains('plus') ? 1 : -1;
     setCkQty(ckKeyV, ckQtyByKey(ckKeyV) + cd);
     renderCBody(); renderCAction();
     return;
    }
    // CK 자재 투입수량 넘패드(자유 입력)
    var ckPad = e.target.closest('[data-ckpad]');
    if (ckPad) { openPadCk(ckPad.dataset.ckpad); return; }

    // CK 필터백 멸균 로트 선택
    var ckLotBtn = e.target.closest('[data-cklot]');
    if (ckLotBtn) { openCkLot(ckLotBtn.dataset.cklot); return; }

    // 카톤 바코드 출력
    if (e.target.id === 'bcCartonFull' || e.target.id === 'bcCartonPart') {
     var pv = packView(curO, curS.units);
     var src = curS.scanInbox || curS.scanCkpk || {};
     var gtin = src.gtin || curO.gtin;
     var lot = src.lot || curS.labelLot || curS.pkLot;
     var dt = src.date || (curS.start || '').slice(2, 10).replace(/-/g, '');
     if (e.target.id === 'bcCartonFull') {
      var qtyF = pv.ic * pv.oc;
      openBarcode('카톤 동일수량 바코드', [{
       line: '(01)' + gtin + '(10)' + lot + '(30)' + qtyF + '(11)' + dt,
       sub: curO.name + ' · 카톤(완제품 ' + qtyF + ' EA) · 동일수량 묶음 · 로트 ' + lot,
       copies: pv.outbox
      }]);
     } else {
      var qtyP = pv.inLoose * pv.ic;
      openBarcode('카톤 상이수량 분리 바코드', [{
       line: '(01)' + gtin + '(10)' + lot + '(30)' + qtyP + '(11)' + dt,
       sub: curO.name + ' · 카톤(완제품 ' + qtyP + ' EA · 잔여) · 분리 출력 · 로트 ' + lot,
       copies: 1
      }]);
     }
     return;
    }
   });

   // 국가 드롭다운(change)
   document.getElementById('cBody').addEventListener('change', function (e) {
    var sel = e.target.closest('[data-alloc]');
    if (sel && sel.tagName === 'SELECT') {
     var i = +sel.dataset.alloc;
     if (curS.allocations[i]) { curS.allocations[i].country = sel.value; renderCBody(); renderCAction(); renderSessList(); }
    }
   });

   document.getElementById('cHead').addEventListener('click', function (e) {
    var t = e.target.closest('[data-time]');
    if (t) openTime(t.dataset.time);
   });

   /* ── 완제품 라벨 스캔 (목업) · 2단계 스캔 ──
      ① CK·PK 라벨 : (01)GTIN(10)LOT(11)제조일        ← 수량(30) 없음
      ② 인박스 라벨 : (01)GTIN(10)LOT(30)수량(11)제조일 ← 수량(30) 있음
      입력원: ① "📷 스캔 인식"(목업 자동 인식) ② 수동입력.
      로트만이 아니라 GS1-128 전체 데이터를 그대로 저장.
      각 단계 정의(SCAN_STEPS)를 한 곳에 두고 제목/힌트/샘플/검증을 선언적으로 처리. */
   var SCAN_STEPS = [
    {
     key: 'ckpk', label: '① CK · PK', title: '① CK · PK 라벨 스캔', kind: 'CK · PK 라벨 (수량 없음)',
     hint: 'CK·PK 라벨을 사각형 안에 · (01)GTIN(10)LOT(11)제조일',
     apply: '다음 · 인박스 스캔 ›',
     // 목업 인식용 샘플 라벨(수량 없음)
     sample: function () { return '(01)' + (curO ? curO.gtin : '') + '(10)' + sampleLabelLot() + '(11)' + sampleDate(); },
     // 형식 검증: 문제 없으면 null, 있으면 안내 메시지
     validate: function (d) { return d.qty != null ? 'CK·PK 라벨엔 수량(30)이 없어야 합니다 (인박스 라벨로 보임)' : null; }
    },
    {
     key: 'inbox', label: '② 인박스', title: '② 인박스 라벨 스캔', kind: '인박스 라벨 (수량 있음)',
     hint: '인박스 라벨을 사각형 안에 · (01)GTIN(10)LOT(30)수량(11)제조일',
     apply: '이 데이터로 지정',
     sample: function () { return '(01)' + (curO ? curO.gtin : '') + '(10)' + sampleLabelLot() + '(30)1(11)' + sampleDate(); },
     validate: function (d) { return d.qty == null ? '인박스 라벨엔 수량(30)이 있어야 합니다 (CK·PK 라벨로 보임)' : null; }
    }
   ];
   var scanState = {i: 0, buf: {}};   // i: 현재 단계 인덱스, buf: 단계별 확정값
   var scanPending = null;            // 현재 인식된 파싱 객체
   function scanCur() { return SCAN_STEPS[scanState.i]; }

   // 목업 샘플 로트/제조일(작업지시·세션 기준)
   function sampleLabelLot() {
    var pre = curO && curO.blood === '골수' ? 'BMJ' : 'BMH';
    var dt = ((curS && curS.start) || '260626').slice(2, 10).replace(/-/g, '') || '260626';
    return pre + dt;
   }
   function sampleDate() {
    return (((curS && curS.start) || '260626').slice(2, 10).replace(/-/g, '') || '260626');
   }

   function renderScanSteps() {
    document.getElementById('scanSteps').innerHTML = SCAN_STEPS.map(function (s, i) {
     var cls = i < scanState.i ? 'done' : (i === scanState.i ? 'active' : 'idle');
     return (i > 0 ? '<div class="pline ' + (i <= scanState.i ? 'on' : '') + '"></div>' : '') +
      '<div class="pstep ' + cls + '"><span class="pn2">' + (i + 1) + '</span>' + s.label + '</div>';
    }).join('');
   }

   // 현재 단계 기준 스캔 시트 UI 초기화(인식 대기 상태로)
   function scanReset() {
    var st = scanCur();
    scanPending = null;
    document.getElementById('scanBox').classList.remove('recognized');
    document.getElementById('scanHint').textContent = st.hint;
    document.getElementById('scanResult').classList.remove('show');
    document.getElementById('scanLotVal').textContent = '—';
    document.getElementById('scanRaw').textContent = '—';
    document.getElementById('scanCapture').style.display = '';
    document.getElementById('scanCapture').disabled = false;
    document.getElementById('scanRetry').style.display = 'none';
    document.getElementById('scanApply').disabled = true;
    document.getElementById('scanTitle').textContent = st.title;
    document.getElementById('scanKind').textContent = st.kind;
    document.getElementById('scanApply').textContent = st.apply;
    renderScanSteps();
   }

   function openScan() {
    scanState = {i: 0, buf: {}};
    document.getElementById('scanManual').value = '';
    scanReset();
    showMask('scanMask');
   }

   function scanRecognize(d, viaManual) {
    scanPending = d;
    document.getElementById('scanBox').classList.add('recognized');
    document.getElementById('scanHint').textContent = viaManual ? '수동 입력 확인' : '인식 완료 — GS1-128 디코딩';
    document.getElementById('scanLotVal').textContent = d.lot || '(로트 없음)';
    document.getElementById('scanRaw').textContent = gs1Line(d);
    document.getElementById('scanResult').classList.add('show');
    document.getElementById('scanCapture').style.display = 'none';
    document.getElementById('scanRetry').style.display = '';
    document.getElementById('scanApply').disabled = false;
   }

   // 목업 "스캔 인식" — 현재 단계 샘플 라벨을 잠시 뒤 인식
   document.getElementById('scanCapture').onclick = function () {
    this.disabled = true;
    document.getElementById('scanHint').textContent = '인식 중…';
    var raw = scanCur().sample();
    setTimeout(function () { scanRecognize(parseGs1(raw), false); }, 650);
   };
   document.getElementById('scanRetry').onclick = function () { scanReset(); };
   document.getElementById('scanManualBtn').onclick = function () {
    var v = (document.getElementById('scanManual').value || '').trim();
    if (!v) { flash('라벨 데이터를 입력하세요'); return; }
    scanRecognize(parseGs1(v), true);
   };
   document.getElementById('scanManual').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('scanManualBtn').click();
   });

   // '확인' 버튼: 현재 단계 확정 → 다음 단계 또는 최종 저장
   document.getElementById('scanApply').onclick = function () {
    var st = scanCur(), d = scanPending;
    if (!d) return;
    // 작업지시 GTIN 일치(opack 고유 검증) — 두 단계 모두 적용
    if (d.gtin && curO.gtin && d.gtin !== curO.gtin) {
     flash('GTIN 불일치 — 이 작업지시(' + curO.gtin + ')의 완제품 라벨이 아닙니다');
     return;
    }
    // 단계별 형식 검증(수량 유무)
    var err = st.validate(d);
    if (err) { flash(err); return; }
    scanState.buf[st.key] = d;

    // 다음 단계가 있으면 진행
    if (scanState.i < SCAN_STEPS.length - 1) {
     scanState.i++;
     document.getElementById('scanManual').value = '';
     scanReset();
     return;
    }

    // 마지막 단계: 단계 간 GTIN·LOT 일치 검증(도메인: PK·CK·외박스 공유) 후 저장
    var a = scanState.buf.ckpk, b = scanState.buf.inbox;
    if (a.gtin && b.gtin && a.gtin !== b.gtin) { flash('GTIN 불일치 — CK·PK와 인박스 라벨이 다릅니다'); return; }
    if (a.lot && b.lot && a.lot !== b.lot) { flash('LOT 불일치 — CK·PK와 인박스 라벨이 다릅니다'); return; }
    curS.scanCkpk = a;
    curS.scanInbox = b;
    curS.labelLot = b.lot || a.lot;
    hideMask('scanMask');
    renderCBody();
    renderCAction();
    renderSessList();
    flash('CK·PK + 인박스 라벨 2회 스캔 완료 → 포장 완료 가능');
   };

   function openPk() {
    var opts = PK_READY.filter(function (l) { return !curO.gtin || l.gtin === curO.gtin; });
    if (!opts.length) opts = PK_READY;
    document.getElementById('lotTitle').textContent = '멸균 완료 PK 로트 선택';
    document.getElementById('lotList').innerHTML = opts.map(function (l) {
     return '<div class="lotopt ' + (l.lot === curS.pkLot ? 'sel' : '') + '" data-lot="' + l.lot + '"><div><span class="ln">' + l.lot + '</span><div class="meta" style="margin:0">' + l.name + ' · 멸균필 ' + l.qty + ' EA · 유효 ' + (l.expiry || '-') + '</div></div></div>';
    }).join('');
    document.getElementById('lotList').onclick = function (e) {
     var o = e.target.closest('[data-lot]');
     if (!o) return;
     curS.pkLot = o.dataset.lot;
     hideMask('lotMask');
     renderCBody(); renderCAction(); renderSessList();
     flash('멸균 PK 로트 ' + curS.pkLot + ' 선택');
    };
    showMask('lotMask');
   }

   // 필터백 멸균 로트 선택 — 멸균 완료(steril:true) 로트만 노출
   function openCkLot(key) {
    var opts = sterilFilterbagLots();
    var cur = ckLotOf(key) || fifoFilterbagLot();
    var fifo = fifoFilterbagLot();
    document.getElementById('lotTitle').textContent = '필터백 · 멸균 완료 로트 (FIFO 기본)';
    if (!opts.length) {
     document.getElementById('lotList').innerHTML =
      '<div class="region-warn">⚠ 사용 가능한 멸균 완료 필터백 로트가 없습니다. 멸균 공정 완료 후 다시 시도하세요.</div>';
     showMask('lotMask');
     return;
    }
    document.getElementById('lotList').innerHTML = opts.map(function (l) {
     var tag = (l.lot === fifo) ? 'FIFO 우선' : '멸균필';
     return '<div class="lotopt ' + (l.lot === cur ? 'sel' : '') + '" data-cklotpick="' + l.lot + '">' +
      '<div><span class="ln">' + l.lot + '</span>' +
      '<div class="meta" style="margin:0">' + l.name + ' · 멸균필 ' + l.qty + ' EA · 유효 ' + (l.expiry || '-') + '</div></div>' +
      '<span class="done-tag" style="margin-left:auto' + (l.lot === fifo ? ';background:var(--teal);color:#fff' : '') + '">' + tag + '</span></div>';
    }).join('');
    document.getElementById('lotList').onclick = function (e) {
     var o = e.target.closest('[data-cklotpick]');
     if (!o) return;
     if (!curS.ckLotSel) curS.ckLotSel = {};
     curS.ckLotSel[key] = o.dataset.cklotpick;
     hideMask('lotMask');
     renderCBody(); renderCAction();
     flash('필터백 멸균 로트 ' + o.dataset.cklotpick + ' 선택');
    };
    showMask('lotMask');
   }

   /* ── 넘패드 (완제품 수량 / 국가 배분 수량 / CK 자재 투입수량) ── */
   var padVal = '', padMode = 'units', padAllocIdx = null, padCkKey = null;

   function openPadUnits() {
    padMode = 'units';
    padAllocIdx = null;
    padVal = String(curS.units || 0);
    document.getElementById('padLab').textContent = '완제품 수량';
    document.getElementById('padDisp').textContent = padVal;
    showMask('padMask');
   }

   function openPadAlloc(i) {
    padMode = 'alloc';
    padAllocIdx = i;
    var a = curS.allocations[i];
    var c = a ? countryOf(a.country) : null;
    padVal = String((a && a.qty) || 0);
    document.getElementById('padLab').textContent = (c ? c.name : '국가') + ' 배분 수량';
    document.getElementById('padDisp').textContent = padVal;
    showMask('padMask');
   }

   function openPadCk(key) {
    padMode = 'ckqty';
    padCkKey = key;
    var parts = key.split('|');
    var c = countryOf(parts[0]);
    var m = ckMatOf(parts[1]);
    padVal = String(ckQtyByKey(key) || 0);
    document.getElementById('padLab').textContent = (c ? c.flag + ' ' : '') + (m ? m.name : '자재') + ' 투입수량';
    document.getElementById('padDisp').textContent = padVal;
    showMask('padMask');
   }

   document.querySelector('#padMask .keys').addEventListener('click', function (e) {
    var k = e.target.dataset.k;
    if (!k) return;
    if (k === 'C') padVal = '';
    else if (k === 'OK') {
     var n = parseInt(padVal || '0', 10);
     if (padMode === 'units') curS.units = n;
     else if (padMode === 'alloc' && padAllocIdx != null && curS.allocations[padAllocIdx]) curS.allocations[padAllocIdx].qty = n;
     else if (padMode === 'ckqty' && padCkKey) setCkQty(padCkKey, n);
     hideMask('padMask');
     renderCBody(); renderCAction(); renderSessList();
     return;
    } else padVal = (padVal === '0' ? '' : padVal) + k;
    document.getElementById('padDisp').textContent = padVal || '0';
   });

   /* ── 시작 시트 ── */
   function showMask(id) {
    document.getElementById(id).classList.add('show');
   }

   function hideMask(id) {
    document.getElementById(id).classList.remove('show');
   }

   document.querySelectorAll('.mask').forEach(function (m) {
    m.addEventListener('click', function (e) {
     if (e.target === m || (e.target.closest && e.target.closest('[data-close]'))) {
      m.classList.remove('show');
     }
    });
   });

   let selW = null, selE = null;

   function openStart() {
    selW = null;
    selE = null;
    document.getElementById('workerOpts').innerHTML = WORKERS.map(function (w) {
     return '<button class="opt" data-w="' + w + '">' + w + '</button>';
    }).join('');
    document.getElementById('equipOpts').innerHTML = EQUIPS.map(function (e) {
     return '<button class="opt" data-e="' + e[0] + '">' + e[0] + ' <span class="sub">' + e[1] + '</span></button>';
    }).join('');
    document.getElementById('startOk').disabled = true;
    showMask('startMask');
   }

   document.getElementById('workerOpts').addEventListener('click', function (e) {
    var b = e.target.closest('[data-w]');
    if (!b) return;
    document.querySelectorAll('#workerOpts .opt').forEach(function (x) {
     x.classList.remove('sel');
    });
    b.classList.add('sel');
    selW = b.dataset.w;
    ckStart();
   });
   document.getElementById('equipOpts').addEventListener('click', function (e) {
    var b = e.target.closest('[data-e]');
    if (!b) return;
    document.querySelectorAll('#equipOpts .opt').forEach(function (x) {
     x.classList.remove('sel');
    });
    b.classList.add('sel');
    selE = b.dataset.e;
    ckStart();
   });

   function ckStart() {
    document.getElementById('startOk').disabled = !(selW && selE);
   }

   document.getElementById('startOk').onclick = function () {
    var se = mkSess(selW, selE);
    curO.sessions.push(se);
    if (curO.st === 'wait') curO.st = 'working';
    hideMask('startMask');
    renderSessList();
    openSess(curO.sessions.length - 1);
    flash('작업 시작 · ' + selW + ' / ' + selE);
   };

   /* 토스트 */
   let tT;

   function flash(m) {
    var t = document.getElementById('toast');
    if (!t) {
     t = document.createElement('div');
     t.id = 'toast';
     t.style.cssText = 'position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#15222B;color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;z-index:60;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:opacity .3s';
     document.body.appendChild(t);
    }
    t.textContent = m;
    t.style.opacity = '1';
    clearTimeout(tT);
    tT = setTimeout(function () {
     t.style.opacity = '0';
    }, 1700);
   }

   /* ── 바코드/출력 ── */
   function bcCard(d) {
    return '<div class="bc-card"><div class="bc-bars"></div>' +
     '<div class="bc-data">' + d.line + '</div>' +
     (d.sub ? '<div class="bc-sub">' + d.sub + '</div>' : '') + '</div>';
   }

   function openBarcode(title, labels) {
    document.getElementById('bcTitle').textContent = title;
    document.getElementById('bcList').innerHTML = labels.map(function (l) {
     return '<div style="margin-bottom:12px">' + bcCard(l) +
      (l.copies > 1 ? '<div class="bc-sub" style="text-align:center">× ' + l.copies + '장 출력</div>' : '') + '</div>';
    }).join('');
    window.__printLabels = labels;
    showMask('bcMask');
   }

   document.getElementById('bcPrint').onclick = function () {
    var labels = window.__printLabels || [];
    var html = '';
    labels.forEach(function (l) {
     var n = l.copies || 1;
     for (var i = 0; i < n; i++) {
      html += '<div style="border:1px solid #000;border-radius:6px;padding:12px;margin:6px;display:inline-block;width:220px;text-align:center;page-break-inside:avoid">' +
       '<div style="height:54px;background:repeating-linear-gradient(90deg,#000 0 2px,#fff 2px 4px,#000 4px 5px,#fff 5px 9px,#000 9px 12px,#fff 12px 13px);border-radius:2px;margin-bottom:6px"></div>' +
       '<div style="font-size:12px;font-weight:700">' + l.line + '</div>' + (l.sub ? '<div style="font-size:11px;color:#555">' + l.sub + '</div>' : '') + '</div>';
     }
    });
    var pa = document.getElementById('printArea');
    pa.innerHTML = '<h3 style="margin:0 0 10px">' + document.getElementById('bcTitle').textContent + '</h3>' + html;
    hideMask('bcMask');
    setTimeout(function () {
     window.print();
    }, 100);
   };

   /* 시간 수정 */
   let timeWhich = 'start', editDate = new Date();

   function fmtD(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' (' + WD[d.getDay()] + ')';
   }

   function openTime(which) {
    timeWhich = which;
    document.getElementById('timeTitle').textContent = (which === 'start' ? '시작' : '종료') + ' 일시 수정';
    var saved = which === 'start' ? curS.start : curS.end;
    if (saved && saved.indexOf(' ') >= 0) {
     var a = saved.split(' ');
     editDate = new Date(a[0] + 'T' + a[1]);
    } else editDate = new Date();
    document.getElementById('tDate').textContent = fmtD(editDate);
    document.getElementById('tH').textContent = String(editDate.getHours()).padStart(2, '0');
    document.getElementById('tM').textContent = String(editDate.getMinutes()).padStart(2, '0');
    showMask('timeMask');
   }

   document.querySelector('#timeMask .dateedit').addEventListener('click', function (e) {
    var b = e.target.closest('[data-d]');
    if (!b) return;
    editDate.setDate(editDate.getDate() + (+b.dataset.d));
    document.getElementById('tDate').textContent = fmtD(editDate);
   });
   document.querySelector('#timeMask .timeedit').addEventListener('click', function (e) {
    var b = e.target.closest('[data-t]');
    if (!b) return;
    var H = document.getElementById('tH'), M = document.getElementById('tM');
    var h = +H.textContent, m = +M.textContent;
    if (b.dataset.t === 'h+') h = (h + 1) % 24;
    if (b.dataset.t === 'h-') h = (h + 23) % 24;
    if (b.dataset.t === 'm+') m = (m + 1) % 60;
    if (b.dataset.t === 'm-') m = (m + 59) % 60;
    H.textContent = String(h).padStart(2, '0');
    M.textContent = String(m).padStart(2, '0');
   });
   document.getElementById('timeOk').onclick = function () {
    var ds = editDate.getFullYear() + '-' + String(editDate.getMonth() + 1).padStart(2, '0') + '-' + String(editDate.getDate()).padStart(2, '0');
    var v = ds + ' ' + document.getElementById('tH').textContent + ':' + document.getElementById('tM').textContent;
    if (timeWhich === 'start') curS.start = v; else curS.end = v;
    hideMask('timeMask');
    renderCHead();
    renderSessList();
    flash((timeWhich === 'start' ? '시작' : '종료') + ' 저장 ' + pill(v));
   };

   renderQueue();
  </script>
  <!-- ===== 스텝퍼 눌러서 빠르게 증감 (press & hold auto-repeat) — 태블릿/PC 공통 ===== -->
  <style>
      .stepper button, .mstep button, .lotstep button, .dateedit button, .timeedit button {
          touch-action: manipulation;
          -webkit-user-select: none;
          user-select: none;
          -webkit-touch-callout: none;
      }
  </style>
  <script>
   (function () {
    var SEL = '.stepper button, .mstep button, .lotstep button, .dateedit button, .timeedit button';
    var holdTimer = null, repeatTimer = null, maxTimer = null;
    var curBtn = null;
    var END_EVENTS = ['pointerup', 'pointercancel', 'lostpointercapture', 'touchend', 'touchcancel', 'mouseup'];

    function stop() {
     clearTimeout(holdTimer);
     clearInterval(repeatTimer);
     clearTimeout(maxTimer);
     holdTimer = repeatTimer = maxTimer = null;
     if (curBtn) {
      END_EVENTS.forEach(function (ev) { curBtn.removeEventListener(ev, stop); });
      curBtn = null;
     }
    }

    function tick(x, y) {
     var el = document.elementFromPoint(x, y);
     var b = (el && el.closest) ? el.closest(SEL) : null;
     if (!b) { stop(); return; }
     b.click();
    }

    document.addEventListener('pointerdown', function (e) {
     if (e.button != null && e.button > 0) return;
     var btn = e.target.closest ? e.target.closest(SEL) : null;
     if (!btn) return;

     var x = e.clientX, y = e.clientY;
     stop();

     curBtn = btn;
     END_EVENTS.forEach(function (ev) {
      btn.addEventListener(ev, stop);
     });

     holdTimer = setTimeout(function () {
      repeatTimer = setInterval(function () {
       tick(x, y);
      }, 80);
      maxTimer = setTimeout(stop, 8000);
     }, 400);

     window.addEventListener('pointerup', stop, {once: true, capture: true});
     window.addEventListener('touchend', stop, {once: true, capture: true});
    });

    window.addEventListener('blur', stop);
    document.addEventListener('visibilitychange', function () {
     if (document.hidden) stop();
    });
   })();
  </script>
