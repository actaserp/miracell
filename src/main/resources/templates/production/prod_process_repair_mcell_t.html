                var key = (document.getElementById('regLot').value || '').trim().toUpperCase();
                if (!key) { flash('원 M-CELL 로트를 입력하세요'); return; }
                if (!regLotSel && !srcSel) { flash('조회 후 대상을 선택하거나 품목을 지정하세요'); return; }

                var p = {
                    cat: regCat,
                    scan_key: key,
                    reason: (document.getElementById('regNote').value || '').trim(),
                    spjangcd: SPJANGCD
                };
                if (regLotSel) p.mat_lot_id = regLotSel.mat_lot_id;
                else p.material_id = srcSel;
                if (regCat === 'spec' && regTgtSel) p.target_material_id = regTgtSel;

                document.getElementById('regOk').disabled = true;
                post('/regist', p, function (r) {
                    hideMask('regMask');
                    filter = 'all';
                    document.querySelectorAll('.qfilter button[data-f]').forEach(function (x) { x.classList.toggle('on', x.dataset.f === 'all'); });
                    loadQueue();
                    var d = r.data || {};
                    flash('수리 접수 · ' + (d.repair_no || '') + ' (' + (CAT[regCat] || regCat) + ')');
                });
                setTimeout(function () { document.getElementById('regOk').disabled = false; }, 1200);
            };

            /* ── 바코드 카메라 스캔 (접수 로트) ──────────────────────
               BarcodeCam 공통 모듈에 위임한다. 자재투입·세척과 같은 엔진이고,
               다른 점은 여기가 단발(continuous:false)이라는 것 —
               접수는 로트 하나를 지목하는 일이라 연속 스캔이 필요 없다.   */
            var regCam = null;

            /* 버튼은 언제나 보인다. 예전에는 지원될 때만 노출했는데,
               사내망(http)으로 접속한 태블릿은 버튼 자체가 없어서
               「왜 안 보이지」로 끝났다. 누르면 이유를 말해주는 편이 낫다. */
            document.getElementById('regScan').style.display = '';

            function stopCam() {
                if (regCam) regCam.stop();
                document.getElementById('regCamBox').style.display = 'none';
                syncCamTools();
            }

            function syncCamTools() {
                var z = document.getElementById('regZoom');
                var t = document.getElementById('regTorch');
                var r = regCam && regCam.isRunning() ? regCam.zoomRange() : null;
                if (z) {
                    z.style.display = r ? '' : 'none';
                    if (r) { z.min = r.min; z.max = r.max; z.step = r.step || 0.1; z.value = r.min; }
                }
                if (t) t.style.display = (regCam && regCam.isRunning() && regCam.canTorch()) ? '' : 'none';
            }

            document.getElementById('regScan').addEventListener('click', function () {
                var box = document.getElementById('regCamBox');
                if (regCam && regCam.isRunning()) { stopCam(); return; }   // 토글

                if (!regCam) {
                    regCam = BarcodeCam.create({
                        video: document.getElementById('regVideo'),
                        /* ★ 접수는 로트 하나를 지목하는 일이다 — 단발.
                             하나 잡으면 모듈이 스스로 닫고, 여기서 조회까지 태운다. */
                        continuous: false,
                        onScan: function (raw, info) {
                            var lot = (info && info.lot) || raw;
                            document.getElementById('regLot').value = String(lot).toUpperCase();
                            box.style.display = 'none';
                            syncCamTools();
                            doFind();                     // 스캔 → 조회까지 한 번에
                        },
                        onStatus: function (m) { document.getElementById('regCamMsg').textContent = m; },
                        onError: function (m) { flash(m.split('\n')[0]); stopCam(); }
                    });
                }
                box.style.display = '';
                regCam.start().then(function (ok) {
                    if (!ok) { box.style.display = 'none'; return; }
                    syncCamTools();
                });
            });

            document.getElementById('regCamStop').addEventListener('click', stopCam);
            (function () {
                var z = document.getElementById('regZoom'), t = document.getElementById('regTorch'), on = false;
                if (z) z.addEventListener('input', function () { regCam && regCam.zoom(+z.value); });
                if (t) t.addEventListener('click', function () {
                    on = !on;
                    if (regCam) regCam.torch(on);
                    t.style.background = on ? '#FFD43B' : '#fff';
                });
            })();

            /* ── 토스트 ────────────────────────────────────────── */
            var tT;
            window.flash = function (m) {
                var t = document.getElementById('toast');
                if (!t) {
                    t = document.createElement('div'); t.id = 'toast';
                    t.style.cssText = 'position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#15222B;color:#fff;padding:14px 22px;border-radius:14px;font-weight:700;z-index:60;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:opacity .3s;max-width:90vw;text-align:center';
                    document.body.appendChild(t);
                }
                t.textContent = m; t.style.opacity = '1';
                clearTimeout(tT); tT = setTimeout(function () { t.style.opacity = '0'; }, 1900);
            };

            /* ── 날짜 필터 ─────────────────────────────────
               접수일 기준. 비워두면 기본 30일로 되돌린다.
               서버 wo_queue 가 date_from/date_to 를 이미 받으므로 API 변경 없음. */
            document.getElementById('btnSearch').addEventListener('click', function () {
                if (dateFrom() > dateTo()) { flash('시작일이 종료일보다 늦습니다'); return; }
                loadQueue();
            });
            document.querySelectorAll('#dFrom,#dTo').forEach(function (el) {
                el.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('btnSearch').click(); }
                });
            });
            initDates();


            /* ══════════════════════════════════════════════════════════════════
               [공통 추가] ① 작업자 = 소속 공장 인원만  ② 재고 새로고침
               - ①은 포장공정(prod_process_opack_bsc_t) 규약과 통일한다.
                 포장은 /workers 를 factory_id 와 함께 부른다. 다른 공정도 같게 맞췄다.
                 ★ 서버가 이 엔드포인트를 아직 안 열었으면 공용 콤보로 폴백한다
                   (그 경우 콘솔에 경고가 남는다 — 전사 인원이 다 뜬다는 뜻).
               - ②는 "화면을 다시 그리는" 것이 아니라 지금 보고 있는 자리는 그대로 두고
                 재고 수치만 서버에서 다시 읽는다. 앞 공정이 방금 만든 재고를 받는 용도.
               ══════════════════════════════════════════════════════════════════ */
            var WORKER_API = '/api/production/repair/workers';
            var WORKER_FACTORY_ID = 2;

            /* 공용 콤보를 직접 부른다 — 화면마다 combo() 유무가 달라 여기서 자체 호출한다.
               cond1 = 공장(Factory_id). ComboService.person 이 이 조건을 받는다.
               서버는 퇴사자(_status·Exitdate)도 함께 걸러 내려준다. */
            function comboPerson(factoryId) {
                if (typeof AjaxUtil === 'undefined' || !AjaxUtil.getSyncData) return [];
                var r = AjaxUtil.getSyncData('/api/common/combo', {
                    combo_type: 'person',
                    cond1: (factoryId == null ? '' : String(factoryId)),
                    cond2: '', cond3: ''
                }) || {};
                return (r.data || []).map(function (x) {
                    return {
                        value: x.value,
                        text : x.text,
                        code : x.code || x.Code || '',
                        factory: String(x.Factory_id != null ? x.Factory_id
                            : (x.factory_id != null ? x.factory_id : ''))
                    };
                }).filter(function (w) { return w.value != null && w.text; });
            }

            function fetchWorkerRows() {
                if (typeof AjaxUtil === 'undefined' || !AjaxUtil.getSyncData) return [];

                /* ① 공용 콤보 (기본 경로) */
                var list = [];
                try { list = comboPerson(WORKER_FACTORY_ID); } catch (e) { list = []; }

                /* ② 콤보가 비면 공정 전용 /workers 로 폴백 (포장처럼 자체 엔드포인트가 있는 화면용) */
                if (!list.length) {
                    var rows = [];
                    try {
                        var r = AjaxUtil.getSyncData(WORKER_API, {
                            factory_id: WORKER_FACTORY_ID,
                            spjangcd: (typeof CTX !== 'undefined' && CTX && CTX.spjangcd) ? CTX.spjangcd : 'ZZ'
                        }) || {};
                        rows = r.data || (Array.isArray(r) ? r : []);
                    } catch (e2) { rows = []; }
                    if (!Array.isArray(rows)) rows = [];
                    list = rows.map(function (w) {
                        var id = (w.worker_id != null) ? w.worker_id
                            : (w.actor_id  != null) ? w.actor_id
                                : (w.person_id != null) ? w.person_id
                                    : (w.id != null) ? w.id : w.value;
                        return {
                            value: id,
                            text : w.name || w.actor_name || w.text || '',
                            code : w.code || '',
                            factory: String(w.factory_id != null ? w.factory_id
                                : (w.Factory_id != null ? w.Factory_id : ''))
                        };
                    }).filter(function (w) { return w.value != null && w.text; });
                    if (list.length) console.warn('[workers] 공용 콤보가 비어 ' + WORKER_API + ' 로 폴백했습니다.');
                }

                /* ③ 응답에 공장이 실려 있으면 화면에서 한 번 더 거른다 (2차 방어).
                      공장 미지정자는 어느 화면에서도 보이도록 남긴다 — 서버 조건과 같은 방침. */
                var f = list.filter(function (w) { return !w.factory || w.factory === String(WORKER_FACTORY_ID); });
                if (f.length) list = f;
                return list;
            }
            /* {value,text,code} 형태로 쓰는 화면용 */
            function fetchWorkers() { return fetchWorkerRows(); }
            /* {actor_id,actor_name} 형태로 쓰는 화면용 */
            function fetchWorkersActor() {
                return fetchWorkerRows().map(function (w) {
                    return {actor_id: w.value, actor_name: w.text, code: w.code};
                });
            }

            /* ── 새로고침 버튼 : 각 화면 헤더(qhead / topbar2) 우측에 붙인다 ──
               목록·액션바는 다시 그려지고 스크롤도 타서 고정 자리를 잡기 어렵다.
               헤더는 화면당 하나씩 고정이라 겹칠 일이 없다. */
            (function () {
                var root = document.querySelector('.ms-wash-root, .ms-pack-root') || document;
                var heads = root.querySelectorAll('.qhead, .topbar2');
                if (!heads.length) return;
                var busy = false;

                function run(b) {
                    if (busy) return;
                    busy = true;
                    var t = b.innerHTML;
                    b.innerHTML = '…';
                    b.disabled = true;
                    b.style.opacity = '.5';
                    setTimeout(function () {
                        try {
                            stockRefresh();
                            if (typeof flash === 'function') flash('새로 불러왔습니다');
                        } catch (e) {
                            console.error('[stockRefresh]', e);
                            if (typeof flash === 'function') flash('불러오지 못했습니다');
                        }
                        b.innerHTML = t;
                        b.disabled = false;
                        b.style.opacity = '';
                        busy = false;
                    }, 0);
                }

                Array.prototype.forEach.call(heads, function (h) {
                    if (h.querySelector('.msRefreshBtn')) return;
                    var b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'msRefreshBtn';
                    b.title = '새로고침';
                    b.setAttribute('aria-label', '새로고침');
                    b.innerHTML = '⟳';
                    /* 헤더에 이미 오른쪽으로 미는 요소(.qfilter 의 margin-left:auto,
                       .htitle 의 flex:1)가 있으면 auto 를 또 주면 안 된다.
                       남은 공간이 둘로 나뉘어 앞 요소가 가운데로 밀려난다. */
                    var pushed = Array.prototype.some.call(h.children, function (c) {
                        var cs = getComputedStyle(c);
                        return cs.marginLeft === 'auto' || parseFloat(cs.flexGrow) > 0;
                    });
                    b.style.cssText = (pushed ? '' : '') + 'flex:0 0 auto;align-self:center;'
                        + 'width:40px;height:40px;border-radius:12px;'
                        + 'border:1px solid var(--line,#dfe3e8);background:var(--surface,#fff);'
                        + 'color:var(--ink-2,#5b6570);font-size:19px;font-weight:800;line-height:1;'
                        + 'cursor:pointer;touch-action:manipulation;'
                        + '-webkit-user-select:none;user-select:none';
                    b.addEventListener('click', function () {
                        run(b);
                    });
                    h.appendChild(b);
                });
            })();

            function scOn(id) {
                var el = document.getElementById(id);
                return !!el && !el.classList.contains('hide');
            }

            function maskOn(id) {
                var el = document.getElementById(id);
                return !!el && el.classList.contains('show');
            }

            /* ── 재고 새로고침 ── (수리창고 보유 · 생산창고 투입 자재 재고) */
            function stockRefresh() {
                WORKERS = [];
                if (scOn('scC') && typeof curU !== 'undefined' && curU) {
                    openUnit(curU.id);
                    if (maskOn('matMask') && typeof loadMatList === 'function') loadMatList('');
                } else {
                    loadQueue();
                }
            }

            loadQueue();
        }

        /* 날짜 유틸 — start() 밖에 둔다(부팅 실패 시에도 입력칸은 채워지게) */
        function pad2d(n) {
            return String(n).padStart(2, '0');
        }

        function todayStr() {
            var d = new Date();
            return d.getFullYear() + '-' + pad2d(d.getMonth() + 1) + '-' + pad2d(d.getDate());
        }

        function shiftDay(ymd, days) {
            var p = ymd.split('-');
            var d = new Date(+p[0], +p[1] - 1, +p[2]);
            d.setDate(d.getDate() + days);
            return d.getFullYear() + '-' + pad2d(d.getMonth() + 1) + '-' + pad2d(d.getDate());
        }

        function repairDayRange() {
            return (window.REPAIR_CTX && window.REPAIR_CTX.dayRange) || 30;
        }

        function dateFrom() {
            var v = document.getElementById('dFrom').value;
            return v || shiftDay(todayStr(), -repairDayRange());
        }

        function dateTo() {
            var v = document.getElementById('dTo').value;
            return v || todayStr();
        }

        function initDates() {
            var t = todayStr();
            var f = document.getElementById('dFrom'), o = document.getElementById('dTo');
            if (f && !f.value) f.value = shiftDay(t, -repairDayRange());
            if (o && !o.value) o.value = t;
        }

        initDates();
    </script>

    <style>.stepper button {
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
    }</style>
    <script th:inline="none">
        /* 스테퍼 길게 누르기 반복 */
        (function () {
            var SEL = '.stepper button';
            var holdTimer = null, repeatTimer = null, maxTimer = null, curBtn = null;
            var END = ['pointerup', 'pointercancel', 'lostpointercapture', 'touchend', 'touchcancel', 'mouseup'];

            function stop() {
                clearTimeout(holdTimer);
                clearInterval(repeatTimer);
                clearTimeout(maxTimer);
                holdTimer = repeatTimer = maxTimer = null;
                if (curBtn) {
                    END.forEach(function (ev) {
                        curBtn.removeEventListener(ev, stop);
                    });
                    curBtn = null;
                }
            }

            function tick(x, y) {
                var el = document.elementFromPoint(x, y);
                var b = (el && el.closest) ? el.closest(SEL) : null;
                if (!b) {
                    stop();
                    return;
                }
                b.click();
            }

            document.addEventListener('pointerdown', function (e) {
                if (e.button != null && e.button > 0) return;
                var btn = e.target.closest ? e.target.closest(SEL) : null;
                if (!btn) return;
                var x = e.clientX, y = e.clientY;
                stop();
                curBtn = btn;
                END.forEach(function (ev) {
                    btn.addEventListener(ev, stop);
                });
                holdTimer = setTimeout(function () {
                    repeatTimer = setInterval(function () {
                        tick(x, y);
                    }, 90);
                    maxTimer = setTimeout(stop, 8000);
                }, 420);
                window.addEventListener('pointerup', stop, {once: true, capture: true});
                window.addEventListener('touchend', stop, {once: true, capture: true});
            });
            window.addEventListener('blur', stop);
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) stop();
            });
        })();
    </script>
</th:block>
