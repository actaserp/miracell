<html layout:decorate="~{layout_page}">

<th:block layout:fragment="content">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"/>
    <style>
        :root{--bg:#E9EEF1;--surface:#FFF;--surface-2:#F4F7F9;--ink:#15222B;--ink-2:#5A6B76;--line:#D8E0E5;
            --teal:#0E7C86;--teal-d:#0A5C64;--teal-bg:#E2F1F2;--green:#1E9D58;--green-bg:#E4F4EA;
            --amber:#C77A00;--amber-bg:#FBEFD8;--red:#C8483B;--red-bg:#F7E4E1;--purple:#6D3BD1;--purple-bg:#EDE6FB;
            --r:18px;--tap:60px;--shadow:0 1px 0 rgba(21,34,43,.04),0 8px 24px -16px rgba(21,34,43,.28)}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        .ms-wash-root{font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif;color:var(--ink);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;flex:1 1 auto;min-height:0;height:var(--wash-h,100%);max-height:var(--wash-h,none);display:flex;flex-direction:column}
        .ms-wash-root .app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-radius:12px;overflow:hidden}
        .screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}.screen.hide{display:none}

        .wrap{padding:22px 20px 28px;max-width:1180px;margin:0 auto;width:100%;overflow:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
        .qhead{display:flex;align-items:baseline;gap:12px;margin:2px 2px 18px}
        .qhead h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0}
        .qhead .cnt{color:var(--ink-2);font-weight:700}
        .qfilter{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
        .qfilter button{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:700;font-size:14px;cursor:pointer}
        .qfilter button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
        .searchbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
        .searchbar .slab{font-weight:800;color:var(--ink-2);font-size:14px}
        .searchbar .tilde{font-weight:800;color:var(--ink-2)}
        .dinput{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:16px;font-weight:700;color:var(--ink);background:var(--surface-2);font-variant-numeric:tabular-nums;min-width:150px}
        .sbtn{height:48px;padding:0 22px;border:none;border-radius:12px;background:var(--teal);color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-left:auto}
        .sbtn:active{background:var(--teal-d)}
        .qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
        .wo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease;position:relative;overflow:hidden}
        .wo:active{transform:scale(.985)}
        .wo .edge{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
        .wo[data-cat="return"] .edge{background:var(--amber)}.wo[data-cat="spec"] .edge{background:var(--purple)}
        .wo .row1{display:flex;align-items:center;gap:10px;margin-bottom:8px}
        .wo .wono{font-weight:800;font-size:15px;color:var(--ink-2)}
        .cattag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
        .cattag.return{background:var(--amber-bg);color:var(--amber)}.cattag.spec{background:var(--purple-bg);color:var(--purple)}
        .chip{margin-left:auto;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:800;background:var(--surface-2);color:var(--ink-2)}
        .chip.rej{background:var(--red-bg);color:var(--red)}
        .wo .name{font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.3;margin:2px 0 4px}
        .wo .code{font-size:13px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:14px}
        .wo .meta{display:flex;gap:18px;align-items:flex-end}
        .wo .meta .blk{display:flex;flex-direction:column;gap:2px}
        .wo .meta .lab{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .wo .meta .val{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
        .wo .meta .val.g{color:var(--green)}

        .topbar2{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);z-index:2}
        .back{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;font-size:22px;flex:0 0 auto}.back:active{background:var(--line)}
        .htitle{min-width:0;flex:1}.htitle .t{font-size:18px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .htitle .s{font-size:13.5px;color:var(--ink-2);font-weight:700;margin-top:1px}
        .infopill{display:flex;gap:7px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
        .infopill b{color:var(--ink);font-variant-numeric:tabular-nums}
        .col-stack{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;height:100%}
        .bscroll{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px}
        .bgrid{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
        .secline{display:flex;align-items:center;gap:10px;margin:6px 2px 0;color:var(--ink-2);font-weight:800;font-size:14px}
        .secline .ln{flex:1;height:1px;background:var(--line)}

        .ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
        .unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .12s}
        .unit:active{transform:scale(.98)}
        .unit .edge{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--amber)}
        .unit[data-st="repairing"] .edge{background:var(--teal)}.unit[data-st="inspect_wait"] .edge{background:var(--purple)}
        .unit[data-st="pass"] .edge,.unit[data-st="packed"] .edge{background:var(--green)}.unit[data-st="reject"] .edge{background:var(--red)}
        .unit .un{font-size:16px;font-weight:800}
        .unit .lot{font-size:12.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
        .unit .arrow{font-size:12.5px;color:var(--purple);font-weight:800;margin-top:2px}
        .unit .rej, .wo .rej{font-size:12.5px;color:var(--red);font-weight:800;margin-top:4px;line-height:1.35}
        .ubadge{padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:800}
        .ubadge.wait{background:var(--amber-bg);color:var(--amber)}.ubadge.repairing{background:var(--teal-bg);color:var(--teal-d)}
        .ubadge.inspect_wait{background:var(--purple-bg);color:var(--purple)}
        .ubadge.pass,.ubadge.packed{background:var(--green-bg);color:var(--green)}.ubadge.reject{background:var(--red-bg);color:var(--red)}

        .srcbox{background:linear-gradient(180deg,#FBF7FF,#FFF);border:1px solid var(--purple-bg);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
        .srcbox .h{font-size:12.5px;font-weight:800;color:var(--purple)}
        .srcbox .lot{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
        .srcbox .sub{font-size:12.5px;color:var(--ink-2);font-weight:700;margin-top:2px}
        .srcbox .warn{font-size:12.5px;color:var(--red);font-weight:800;margin-top:6px}
        .resbox{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
        .resbox .h{font-size:12.5px;font-weight:800;color:var(--ink-2)}
        .resbox .lot{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
        .lotmode{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:0 0 auto}
        .lotmode button{height:44px;padding:0 12px;border:none;background:var(--surface);color:var(--ink-2);font-weight:800;font-size:13px;cursor:pointer}
        .lotmode button.on{background:var(--purple);color:#fff}

        .whoRow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow)}
        .whoRow .l{font-size:13px;color:var(--ink-2);font-weight:800}.whoRow .nm{font-size:17px;font-weight:800}
        .whoRow .assign{margin-left:auto;height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--teal);background:var(--teal-bg);color:var(--teal-d);font-weight:800;font-size:14px;cursor:pointer}

        .timerow{display:flex;gap:12px}
        .timebtn{flex:1;min-height:64px;text-align:left;background:var(--surface);border:1px solid var(--line);
            border-radius:var(--r);padding:11px 16px;box-shadow:var(--shadow);cursor:pointer;display:block}
        .timebtn:active{background:var(--surface-2)}
        .timebtn .l{display:block;font-size:12.5px;color:var(--ink-2);font-weight:800}
        .timebtn .v{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
        .timebtn .v.none{color:var(--ink-2)}
        .timebtn:disabled{cursor:default;opacity:.65}
        .durline{text-align:center;font-size:13px;color:var(--ink-2);font-weight:800;margin-top:-4px}

        .dateedit{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 10px}
        .dateedit .dbtn{width:56px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700;cursor:pointer}
        .dateedit .dbtn:active{background:var(--line)}
        .dateedit .dval{min-width:200px;text-align:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
        .timeedit{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0}
        .tcol{display:flex;flex-direction:column;align-items:center;gap:8px}
        .tcol button{width:84px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:700;cursor:pointer}
        .tcol button:active{background:var(--line)}
        .tcol .tv{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;width:84px;text-align:center}
        .tsep{font-size:34px;font-weight:800;padding:0 4px}

        .mrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
        .mrow.frozen{background:var(--surface-2)}
        .mrow .fz{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--line);color:var(--ink-2);vertical-align:1px}
        .mrow.plus{border-left:5px solid var(--green)}.mrow.minus{border-left:5px solid var(--red)}
        .mrow .dir{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:18px;font-weight:800;flex:0 0 auto}
        .mrow.plus .dir{background:var(--green-bg);color:var(--green)}.mrow.minus .dir{background:var(--red-bg);color:var(--red)}
        .mrow .id{flex:1;min-width:0}.mrow .mn{font-size:15.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .mrow .mc{font-size:12px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
        .mrow .mc.short{color:var(--red)}
        .stepper{display:flex;align-items:center;flex:0 0 auto}
        .stepper button{width:42px;height:46px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;font-weight:700;cursor:pointer;display:grid;place-items:center}
        .stepper button:active{background:var(--line)}.stepper button.minus{border-radius:12px 0 0 12px}.stepper button.plus{border-radius:0 12px 12px 0}
        .stepper .q{width:56px;height:46px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#FFFDF4;text-align:center;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;display:grid;place-items:center}
        .rm{width:42px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--red);font-size:15px;cursor:pointer;flex:0 0 auto}
        .addbar{display:flex;gap:10px;flex-wrap:wrap}
        .addbtn{min-height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--teal);background:var(--teal-bg);color:var(--teal-d);font-weight:800;font-size:14px;cursor:pointer}
        .addbtn.minus{border-color:var(--red);background:var(--red-bg);color:var(--red)}
        .emptybox{text-align:center;color:var(--ink-2);font-weight:700;padding:22px;border:1.5px dashed var(--line);border-radius:var(--r)}
        .notebox{background:var(--amber-bg);border:1px solid var(--amber);border-radius:var(--r);padding:12px 16px;font-size:14px;font-weight:700;color:var(--amber)}

        .actionbar{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;box-shadow:0 -8px 24px -18px rgba(21,34,43,.4)}
        .actionbar .actsum{display:flex;flex-direction:column;margin-right:auto;min-width:0}
        .actionbar .actsum .l{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .actionbar .actsum .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
        .btn{min-height:var(--tap);padding:0 24px;border-radius:16px;border:none;cursor:pointer;font-size:18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}
        .btn.ghost{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}.btn.ghost:active{background:var(--line)}
        .btn.primary{background:var(--teal);color:#fff;padding:0 26px;box-shadow:0 8px 18px -8px rgba(14,124,134,.7)}.btn.primary:active{background:var(--teal-d)}
        .btn.start{background:var(--teal);color:#fff;flex:1;justify-content:center;font-size:20px}
        .btn:disabled{background:var(--line)!important;color:var(--ink-2)!important;box-shadow:none;cursor:default}

        .mask{position:fixed;inset:0;background:rgba(21,34,43,.42);display:none;z-index:40;align-items:flex-end}
        .mask.show{display:flex;animation:fade .15s ease}@keyframes fade{from{opacity:0}to{opacity:1}}
        .sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 20px calc(40px + env(safe-area-inset-bottom));box-shadow:0 -20px 40px -20px rgba(0,0,0,.4);animation:rise .2s cubic-bezier(.2,.7,.3,1);max-height:88dvh;overflow:auto}
        @keyframes rise{from{transform:translateY(40px)}to{transform:translateY(0)}}
        .sheet .sh{display:flex;align-items:center;margin-bottom:16px}.sheet .sh h3{font-size:20px;font-weight:800;margin:0}
        .sheet .sh .x{margin-left:auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;cursor:pointer}
        .sheet .body{max-width:660px;margin:0 auto}
        .fieldlab{font-size:14px;font-weight:800;color:var(--ink-2);margin:14px 2px 8px}
        .opts{display:flex;flex-wrap:wrap;gap:10px}
        .opt{min-height:54px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
        .opt:active{background:var(--surface-2)}.opt.sel{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-d)}
        .opt .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;flex:0 0 auto}
        .opt.sel .ck{background:var(--teal);color:#fff;border-color:var(--teal)}
        .sheet .ok{width:100%;margin-top:20px;background:var(--teal);color:#fff;min-height:var(--tap);border:none;border-radius:16px;font-size:19px;font-weight:800;cursor:pointer}
        .sheet .ok:disabled{background:var(--line);color:var(--ink-2)}
        .txin{width:100%;height:54px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;font-size:16px;font-weight:700;background:var(--surface)}
        .picklist{display:flex;flex-direction:column;gap:8px;max-height:52dvh;overflow:auto;margin-top:6px}
        .prow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
        .prow:active{background:var(--surface-2)}.prow.added{border-color:var(--teal);background:var(--teal-bg)}
        .prow.sel{border-color:var(--purple);background:var(--purple-bg)}
        .prow .pid{flex:1;min-width:0}.prow .pnm{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .prow .pcode{font-size:12.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
        .prow .pchk{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;flex:0 0 auto;font-weight:800;color:var(--teal-d)}
        .prow.added .pchk{background:var(--teal);color:#fff;border-color:var(--teal)}
        .prow.nostock{opacity:.5;background:var(--surface-2)}
        .prow.nostock .pcode{color:var(--red)}
        .itag{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;flex:0 0 auto}
        .itag.move{background:var(--teal-bg);color:var(--teal-d)}.itag.new{background:var(--amber-bg);color:var(--amber)}
        .itag.no{background:var(--red-bg);color:var(--red)}
        /* 포장 상태 배지 — 품명 앞에 붙어 무엇을 집었는지 바로 보이게 한다 */
        .ptag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;
            display:inline-block;vertical-align:middle;margin-right:5px}
        .ptag.boxed{background:#eef1ff;color:#4553b8}
        .ptag.bare{background:var(--surface-2);color:var(--ink-2)}
        .prow .pinto{font-size:12px;font-weight:800;color:var(--teal-d);margin-top:5px;line-height:1.45}
        .prow .pinto .dim{color:var(--ink-2);font-weight:700;font-size:11px}
        .prow .pwarn{font-size:12px;font-weight:800;color:var(--red);margin-top:4px;line-height:1.4}

        @media (max-width:680px){.qgrid{grid-template-columns:1fr}}
        @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

    </style>

    <div class="ms-wash-root">
        <div class="app">
            <!-- A. 수리 작업지시 -->
            <div class="screen" id="scA"><div class="wrap">
                <div class="qhead"><h1>M-CELL 수리 · 작업지시</h1><a title="북마크" class="bookmark toggle">내 메뉴</a><span class="cnt" id="qcnt"></span>
                    <div class="qfilter"><button class="on" data-f="all">전체</button>
                        <button data-f="return">반품</button><button data-f="spec">사양변경</button>
                        <button data-g="open">진행중</button>
                        <button data-g="reject" style="border-color:var(--red);color:var(--red)">재작업</button>
                        <button id="btnReg" style="background:var(--teal);color:#fff;border-color:var(--teal)">＋ 수리 접수</button></div></div>
                <div class="searchbar"><span class="slab">접수일</span>
                    <input type="date" id="dFrom" class="dinput"/><span class="tilde">~</span><input type="date" id="dTo" class="dinput"/>
                    <button class="sbtn" id="btnSearch">조회</button></div>
                <div class="qgrid" id="qgrid"></div>
            </div></div>

            <!-- B. 유닛 수리 (접수 = 원 로트 1개 = 유닛 1대 라서 목록 화면 없음) -->
            <div class="screen hide" id="scC"><div class="col-stack">
                <div class="topbar2"><button class="back" data-back="A">‹</button>
                    <div class="htitle"><div class="t" id="cUnit">—</div><div class="s" id="cSub">—</div></div>
                    <div class="infopill" id="cSrcPill"><span>원 로트</span><b id="cSrc">—</b></div>
                    <button id="btnRegCancel" style="background:var(--red-bg);border:1px solid var(--red);color:var(--red);height:46px;padding:0 14px;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;flex:0 0 auto;display:none">접수 취소</button>
                </div>
                <div class="bscroll"><div class="bgrid" id="cGrid"></div></div>
                <div class="actionbar" id="cAction"></div>
            </div></div>
        </div>

        <!-- 작업자 · 설비 배정 -->
        <div class="mask" id="whoMask"><div class="sheet"><div class="body">
            <div class="sh"><h3>수리 작업자 · 설비 배정</h3><button class="x" data-close>✕</button></div>
            <div class="fieldlab">작업자 <span style="color:var(--red)">*</span> <span style="color:var(--ink-2);font-weight:700">(여러 명 선택 가능)</span></div>
            <div class="opts" id="whoOpts"></div>
            <div class="fieldlab">설비 <span style="color:var(--ink-2);font-weight:700">(선택 · 고르면 가동 이력이 남습니다)</span></div>
            <div class="opts" id="equOpts"></div>
            <button class="ok" id="whoOk" disabled>배정 저장</button>
        </div></div></div>

        <!-- 시작/완료 시각 수정 -->
        <div class="mask" id="timeMask"><div class="sheet"><div class="body">
            <div class="sh"><h3 id="timeTitle">시작 일시 수정</h3><button class="x" data-close>✕</button></div>
            <div class="dateedit"><button class="dbtn" data-d="-1">◀</button><div class="dval" id="tDate">—</div><button class="dbtn" data-d="1">▶</button></div>
            <div class="timeedit">
                <div class="tcol"><button data-t="h+">▲</button><div class="tv" id="tH">09</div><button data-t="h-">▼</button></div>
                <div class="tsep">:</div>
                <div class="tcol"><button data-t="m+">▲</button><div class="tv" id="tM">00</div><button data-t="m-">▼</button></div>
            </div>
            <button class="ok" id="timeOk">저장</button>
        </div></div></div>

        <!-- 자재 추가/차감 -->
        <div class="mask" id="matMask"><div class="sheet"><div class="body">
            <div class="sh"><h3 id="matTitle">자재 추가</h3><button class="x" data-close>✕</button></div>
            <div class="fieldlab" id="matLab">자재 · 눌러서 담기</div>
            <div id="matScopeBar" style="display:none;margin-bottom:8px">
                <div class="lotmode" style="width:100%">
                    <button id="scopeUsed" class="on" style="flex:1" data-scope="used">이 M-CELL 에 들어간 자재</button>
                    <button id="scopeAll" style="flex:1" data-scope="all">전체 자재</button>
                </div>
            </div>
            <input class="txin" id="matKw" placeholder="품목코드 / 품명 검색" autocomplete="off"/>
            <div class="picklist" id="matList"></div>
            <button class="ok" data-close style="background:var(--surface-2);color:var(--ink);border:1.5px solid var(--line)">닫기</button>
        </div></div></div>

        <!-- 수리 접수 등록 -->
        <div class="mask" id="regMask"><div class="sheet"><div class="body">
            <div class="sh"><h3>수리 접수 · 작업지시 등록</h3><button class="x" data-close>✕</button></div>

            <div class="fieldlab">수리 유형</div>
            <div class="opts" id="regCat">
                <button class="opt sel" data-c="return">반품</button>
                <button class="opt" data-c="spec">사양변경</button>
            </div>

            <div class="fieldlab">원 M-CELL 로트 <span style="color:var(--ink-2);font-weight:700">(사내 로트 또는 외부 라벨)</span></div>
            <div style="display:flex;gap:10px">
                <input id="regLot" class="txin" style="flex:1;font-weight:800;font-variant-numeric:tabular-nums;background:var(--surface-2)"
                       placeholder="예: MC20022N-260701-004" autocomplete="off"/>
                <button class="opt" id="regScan" style="display:none;border-color:var(--teal);color:#fff;background:var(--teal)">📷</button>
                <button class="opt" id="regFind" style="border-color:var(--teal);color:var(--teal-d);background:var(--teal-bg)">조회</button>
            </div>

            <!-- 카메라 스캔 -->
            <div id="regCamBox" style="display:none;position:relative;margin-top:10px;background:#000;border-radius:14px;overflow:hidden">
                <video id="regVideo" playsinline muted autoplay style="width:100%;height:46dvh;object-fit:contain;display:block"></video>
                <div style="position:absolute;right:10px;top:10px;display:flex;gap:8px;align-items:center">
                    <input type="range" id="regZoom" style="display:none;width:120px"/>
                    <button class="opt" id="regTorch" style="display:none;height:38px;background:#fff">🔦</button>
                </div>
                <div style="position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;background:rgba(0,0,0,.55);color:#fff;font-weight:700">
                    <span id="regCamMsg">라벨을 비추세요</span>
                    <button class="opt" id="regCamStop" style="height:38px;background:#fff">닫기</button>
                </div>
            </div>

            <div id="regLotResult"></div>

            <div id="regTargetWrap" style="display:none">
                <div class="fieldlab">변경 후 품목 <span style="color:var(--ink-2);font-weight:700">(품목이 바뀌지 않고 옵션만 바뀌면 비워 두세요)</span></div>
                <input class="txin" id="regTgtKw" placeholder="품목코드 / 품명 검색" autocomplete="off"/>
                <div class="picklist" id="regTgtList" style="max-height:28dvh"></div>
            </div>

            <div class="fieldlab">사유 / 메모</div>
            <input id="regNote" class="txin" placeholder="예: 전원 불량 반품" autocomplete="off"/>

            <button class="ok" id="regOk" disabled>수리 작업지시 생성</button>
        </div></div></div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script type="text/javascript" th:src="@{/js/barcode_cam.js}"></script>
    <script th:inline="none">
        /* ── 화면 높이 맞춤 (조립·검사 화면과 동일) ───────────────── */
        (function () {
            const root = document.querySelector('.ms-wash-root'); if (!root) return;
            function localBelow() { let below = 0, node = root; while (node && node !== document.body) { let sib = node.nextElementSibling; while (sib) { const r = sib.getBoundingClientRect(); if (r.height > 0 && getComputedStyle(sib).position !== 'fixed') below += r.height; sib = sib.nextElementSibling; } node = node.parentElement; } let fx = 0; document.querySelectorAll('body *').forEach(el => { if (root.contains(el)) return; const cs = getComputedStyle(el); if (cs.position !== 'fixed' && cs.position !== 'sticky') return; const r = el.getBoundingClientRect(); if (r.height > 0 && r.height < innerHeight * 0.5 && r.bottom > innerHeight - 2) fx = Math.max(fx, r.height); }); return Math.max(below, fx); }
            function availBottom() { let bottom = window.innerHeight; try { const fe = window.frameElement; if (fe) { const pWin = window.parent, pDoc = pWin.document; const feTop = fe.getBoundingClientRect().top; let flow = 0, node = fe; while (node && node !== pDoc.body) { let sib = node.nextElementSibling; while (sib) { const cs = pWin.getComputedStyle(sib), r = sib.getBoundingClientRect(); if (r.height > 0 && cs.position !== 'fixed' && cs.position !== 'absolute') flow += r.height; sib = sib.nextElementSibling; } node = node.parentElement; } let fx = 0; pDoc.querySelectorAll('body *').forEach(el => { if (el === fe || el.contains(fe)) return; const cs = pWin.getComputedStyle(el); if (cs.position !== 'fixed' && cs.position !== 'sticky' && cs.position !== 'absolute') return; const r = el.getBoundingClientRect(); if (r.height > 0 && r.height <= 160 && r.top > feTop && r.bottom > pWin.innerHeight - 40) fx = Math.max(fx, r.bottom - r.top); }); bottom = Math.min(bottom, (pWin.innerHeight - Math.max(flow, fx)) - feTop); } } catch (e) {} return bottom; }
            function fit() { const top = root.getBoundingClientRect().top; const avail = availBottom() - top - localBelow(); root.style.setProperty('--wash-h', Math.max(320, Math.floor(avail)) + 'px'); }
            window.addEventListener('resize', fit); window.addEventListener('orientationchange', fit); try { window.parent.addEventListener('resize', fit); } catch (e) {}
            fit(); requestAnimationFrame(fit); setTimeout(fit, 200); setTimeout(fit, 600); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
        })();

        /* =====================================================================
           수리 화면 본체
           ★ API 는 반드시 AjaxUtil. fetch 를 쓰면 CSRF 로 POST 가 막힌다(405/404).

           부팅이 조용히 실패하면 "아무것도 안 뜨는" 상태가 되어 원인을 못 찾는다.
           그래서 실패 지점을 콘솔과 화면 양쪽에 남긴다.
           ===================================================================== */
        function repairBootMsg(html, isErr) {
            var g = document.getElementById('qgrid');
            if (!g) return;
            g.innerHTML = '<div class="emptybox" style="grid-column:1/-1' +
                (isErr ? ';color:#C8483B;border-color:#C8483B' : '') + '">' + html + '</div>';
        }

        (function boot(n) {
            n = n || 0;
            // ★ AjaxUtil 은 window 프로퍼티가 아니다.
            //   공용 스크립트가 let/const/class 로 선언해서 전역 렉시컬 환경에만 올라간다.
            //   window.AjaxUtil 로 보면 영원히 undefined —  조립·검사 화면도 typeof 로 본다.
            var ready = (typeof AjaxUtil !== 'undefined') && !!AjaxUtil.getSyncData;
            if (!ready) {
                if (n > 100) {
                    console.error('[repair] AjaxUtil 을 5초간 찾지 못했습니다.');
                    repairBootMsg('AjaxUtil 을 찾지 못했습니다.<br>' +
                        'layout_page 의 스크립트 로드 순서를 확인하세요.', true);
                    return;
                }
                if (n === 0) repairBootMsg('로딩 중…');
                return setTimeout(function () { boot(n + 1); }, 50);
            }
            console.log('[repair] AjaxUtil 확인 — start() 진입');
            try {
                start();
                console.log('[repair] start() 완료');
            } catch (e) {
                console.error('[repair] start() 실패', e);
                repairBootMsg('화면 초기화 실패 : ' + ((e && e.message) || e), true);
            }
        })(0);

        function start() {

            var CTX = window.REPAIR_CTX || {};
            var SPJANGCD = CTX.spjangcd || 'ZZ';
            var API = '/api/production/repair';

            var CAT = {return: '반품', spec: '사양변경'};
            var UST = {wait: '수리대기', repairing: '수리중', inspect_wait: '검사대기',
                pass: '검사합격', packed: '포장완료', reject: '재작업'};

            function api(path, params) {
                try {
                    if (typeof AjaxUtil === 'undefined' || !AjaxUtil.getSyncData) {
                        throw new Error('AjaxUtil 미로드 — 공용 스크립트 로드 순서를 확인하세요');
                    }
                    var r = AjaxUtil.getSyncData(API + path, params || {});
                    if (r && r.success === false) { flash(r.message || '조회 실패'); return null; }
                    return (r && r.data !== undefined) ? r.data : null;
                } catch (e) { console.error(path, e); flash('조회 중 오류'); return null; }
            }
            function post(path, params, cb) {
                if (typeof AjaxUtil === 'undefined' || !AjaxUtil.postAsyncData) {
                    flash('AjaxUtil 미로드 — 공용 스크립트 로드 순서를 확인하세요'); return;
                }
                AjaxUtil.postAsyncData(API + path, params || {}, function (r) {
                    if (!r || r.success === false) { flash((r && r.message) || '처리 실패'); return; }
                    if (r.message) flash(r.message);
                    if (cb) cb(r);
                });
            }

            // 확인 시트. 조립·검사 화면도 각자 같은 걸 들고 있다(레이아웃 전역이 아님).
            function ask(msg, onOk, okLabel) {
                var m = document.getElementById('confirmMask');
                if (!m) {
                    m = document.createElement('div');
                    m.id = 'confirmMask';
                    m.style.cssText = 'position:fixed;inset:0;background:rgba(21,34,43,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:24px';
                    m.innerHTML = '<div style="background:var(--surface);border-radius:20px;max-width:420px;width:100%;padding:24px 22px 18px;box-shadow:0 20px 50px -12px rgba(0,0,0,.4)">'
                        + '<div id="confirmMsg" style="font-size:17px;font-weight:800;color:var(--ink);line-height:1.5;margin-bottom:20px;white-space:pre-line"></div>'
                        + '<div style="display:flex;gap:10px">'
                        + '<button id="confirmCancel" style="flex:1;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font-weight:800;font-size:16px">취소</button>'
                        + '<button id="confirmOk" style="flex:1;height:52px;border-radius:14px;border:none;background:#0E7C86;color:#fff;font-weight:800;font-size:16px">확인</button>'
                        + '</div></div>';
                    document.body.appendChild(m);
                    m.addEventListener('click', function (e) { if (e.target === m) m.style.display = 'none'; });
                }
                m.querySelector('#confirmMsg').textContent = msg;
                var ok = m.querySelector('#confirmOk'), cancel = m.querySelector('#confirmCancel');
                ok.textContent = okLabel || '확인';
                var close = function () { m.style.display = 'none'; ok.onclick = null; cancel.onclick = null; };
                ok.onclick = function () { close(); onOk && onOk(); };
                cancel.onclick = close;
                m.style.display = 'flex';
            }
            function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
            function num(v) { var n = Number(v); return isNaN(n) ? 0 : n; }
            function qtyTxt(v) { var n = num(v); return (n % 1 === 0) ? String(n) : String(n); }
            // 'yyyy-mm-dd hh:mm' 두 개로 소요 시간 문자열
            function durTxt(a, b) {
                if (!a || !b) return '';
                var t1 = Date.parse(a.replace(' ', 'T')), t2 = Date.parse(b.replace(' ', 'T'));
                if (isNaN(t1) || isNaN(t2) || t2 < t1) return '';
                var mins = Math.round((t2 - t1) / 60000);
                var h = Math.floor(mins / 60), m = mins % 60;
                return (h ? h + '시간 ' : '') + m + '분';
            }

            var ORDERS = [], WORKERS = [], EQUIPS = [];
            var curU = null;
            var filter = 'all';    // 유형 : all | return | spec
            var flag = null;       // 상태 : null | open | reject

            var SC = {A: document.getElementById('scA'), C: document.getElementById('scC')};
            function show(k) { for (var x in SC) SC[x].classList.toggle('hide', x !== k); }

            /* ── A. 수리 큐 (카드 1장 = 유닛 1대) ──────────────── */
            var qgrid = document.getElementById('qgrid');

            function loadQueue() {
                var p = {cat: filter, spjangcd: SPJANGCD,
                    date_from: dateFrom(), date_to: dateTo()};
                if (flag) p.flag = flag;
                ORDERS = api('/wo_queue', p) || [];
                console.log('[repair] wo_queue', p, '→', ORDERS.length + '건');
                renderQueue();
            }
            /* 유닛/작지 1건의 작업자 표시 이름 — 대표 + 조원 전원 (조립 BSC 와 동일 규칙) */
            function unitWho(u) {
                var t = (u && u.member_names && String(u.member_names).trim())
                    ? u.member_names : (u && u.actor_name);
                return (t && String(t).trim()) ? String(t).trim() : '';
            }

            function renderQueue() {
                document.getElementById('qcnt').textContent = ORDERS.length + '대';
                if (!ORDERS.length) {
                    qgrid.innerHTML = '<div class="emptybox" style="grid-column:1/-1">접수된 수리 건이 없습니다.</div>';
                    return;
                }
                qgrid.innerHTML = ORDERS.map(function (o) {
                    var title = o.reason || (o.cat === 'spec' ? '사양 변경' : '반품 입고');
                    var mat = o.src_code || '';
                    if (o.tgt_code && o.tgt_code !== o.src_code) mat += ' → ' + o.tgt_code;
                    // 한 접수에 여러 대가 묶인 경우에만 몇 호기인지 밝힌다
                    var no = num(o.sibling_cnt) > 1 ? ' #' + String(o.unit_no).padStart(2, '0') : '';
                    var res = o.result_lot || (o.lot_mode === 'new' ? '완료 시 발번' : o.src_lot);
                    var changed = o.result_lot && o.result_lot !== o.src_lot;
                    return '<div class="wo" data-cat="' + esc(o.cat) + '" data-id="' + o.unit_id + '"><div class="edge"></div>' +
                        '<div class="row1"><span class="wono">' + esc((o.repair_no || ('#' + o.repair_id)) + no) + '</span>' +
                        '<span class="cattag ' + esc(o.cat) + '">' + (CAT[o.cat] || o.cat) + '</span>' +
                        '<span class="ubadge ' + esc(o.unit_state) + '" style="margin-left:auto">' +
                        (UST[o.unit_state] || o.unit_state) + '</span></div>' +
                        '<div class="name">' + esc(title) + '</div>' +
                        '<div class="code">' + esc(o.receipt_date) + ' · ' + esc(mat) + '</div>' +
                        '<div class="meta"><div class="blk"><span class="lab">원 로트</span>' +
                        '<span class="val" style="font-size:15px">' + esc(o.src_lot) + '</span></div>' +
                        (changed ? '<div class="blk"><span class="lab">결과 로트</span>' +
                            '<span class="val g" style="font-size:15px">' + esc(res) + '</span></div>' : '') +
                        (unitWho(o) ? '<div class="blk"><span class="lab">작업자</span>' +
                            '<span class="val" style="font-size:15px">' + esc(unitWho(o)) + '</span></div>' : '') +
                        (function () {
                            var d = durTxt(o.start_time, o.end_time);
                            if (d) return '<div class="blk"><span class="lab">소요</span>' +
                                '<span class="val" style="font-size:15px">' + d + '</span></div>';
                            if (o.unit_state === 'repairing' && o.start_time)
                                return '<div class="blk"><span class="lab">시작</span>' +
                                    '<span class="val" style="font-size:15px">' + esc(o.start_time.slice(11)) + '</span></div>';
                            return '';
                        })() +
                        '</div></div>';
                }).join('');
            }
            qgrid.addEventListener('click', function (e) {
                var c = e.target.closest('.wo'); if (c) openUnit(+c.dataset.id);
            });
            // 유형 필터 — 셋 중 하나만 선택
            document.querySelectorAll('.qfilter button[data-f]').forEach(function (b) {
                b.addEventListener('click', function () {
                    document.querySelectorAll('.qfilter button[data-f]').forEach(function (x) { x.classList.remove('on'); });
                    b.classList.add('on'); filter = b.dataset.f; loadQueue();
                });
            });
            // 상태 필터 — 유형과 별개 축. 같은 걸 다시 누르면 해제된다.
            document.querySelectorAll('.qfilter button[data-g]').forEach(function (b) {
                b.addEventListener('click', function () {
                    var g = b.dataset.g;
                    flag = (flag === g) ? null : g;
                    document.querySelectorAll('.qfilter button[data-g]').forEach(function (x) {
                        x.classList.toggle('on', x.dataset.g === flag);
                    });
                    loadQueue();
                });
            });

            /* ── 접수 취소 (C화면 헤더 · 수리 시작 전에만 노출) ── */
            document.getElementById('btnRegCancel').addEventListener('click', function () {
                var many = num(curU.sibling_cnt) > 1;
                var msg = '접수를 취소합니다.\n\n' +
                    (curU.intake_type === 'new'
                        ? '· 반품으로 신규 입고한 로트가 삭제됩니다\n'
                        : '· 수리창고로 옮긴 재고가 원래 창고로 돌아갑니다\n') +
                    '· 수리 작업지시와 유닛이 함께 삭제됩니다' +
                    (many ? '\n\n★ 이 접수에 묶인 ' + num(curU.sibling_cnt) + '대가 모두 취소됩니다.' : '');
                ask(msg, function () {
                    post('/regist_cancel', {repair_id: curU.repair_id, spjangcd: SPJANGCD}, function () {
                        flash('접수 취소됨');
                        loadQueue(); show('A');
                    });
                });
            });

            /* ── B. 유닛 수리 ──────────────────────────────────── */
            function openUnit(id) {
                curU = api('/unit_detail', {unit_id: id});
                if (!curU) return;
                var sc = document.getElementById('cGrid').closest('.bscroll'); if (sc) sc.scrollTop = 0;
                renderUnit(); show('C');
            }
            function reloadUnit() {
                curU = api('/unit_detail', {unit_id: curU.id}) || curU;
                renderUnit();
            }
            function renderUnit() {
                var u = curU;
                var sc = document.getElementById('cGrid').closest('.bscroll');
                var keep = sc ? sc.scrollTop : 0;

                document.getElementById('cUnit').textContent = (u.repair_no || '수리') +
                    (num(u.sibling_cnt) > 1 ? ' #' + String(u.unit_no).padStart(2, '0') : '') +
                    ' · ' + (UST[u.state] || u.state);
                /* 작업자 — 대표 + 조원 전원 (조립 BSC 와 동일 규칙) */
                var who = unitWho(u);
                document.getElementById('cSub').textContent =
                    (CAT[u.cat] || u.cat) + ' · ' + (u.mat_code || '') + (who ? ' · ' + who : '');
                /* 원 로트는 확정된 뒤에만 */
                document.getElementById('cSrc').textContent = u.src_lot || '';
                document.getElementById('cSrcPill').style.display = u.src_lot ? '' : 'none';
                // 접수 취소는 아직 손대지 않은 유닛에서만. 서버도 같은 조건으로 막는다.
                document.getElementById('btnRegCancel').style.display = (u.state === 'wait') ? '' : 'none';

                var locked = ['inspect_wait', 'pass', 'packed'].indexOf(u.state) >= 0;
                var html = '';

                // 원 M-CELL 로트 투입 (계보)
                var shortStock = num(u.src_stock) < 1 && !u.mat_produce_id;
                html += '<div class="srcbox"><div class="h">투입: 원 M-CELL 로트 (계보 추적)</div>' +
                    '<div class="lot">' + esc(u.src_lot) + '</div>' +
                    '<div class="sub">' + esc(u.mat_code || '') + ' · 수리창고 보유 ' + qtyTxt(u.src_stock) + '대 · ' +
                    (u.intake_type === 'new' ? '반품 신규입고' : '기존 재고 이동') + '</div>' +
                    (shortStock ? '<div class="warn">⚠ 수리창고에 재고가 없습니다. 접수 상태를 확인하세요.</div>' : '') + '</div>';

                // 결과 로트
                html += '<div class="resbox"><div style="flex:1;min-width:0"><div class="h">수리 결과 로트</div>' +
                    '<div class="lot">' + esc(u.next_lot || '—') + (u.mat_produce_id ? '' : (u.lot_mode === 'new' ? ' <span style="font-size:12px;color:var(--ink-2)">(완료 시 확정)</span>' : '')) + '</div>' +
                    '<div style="font-size:12px;color:var(--ink-2);font-weight:700;margin-top:2px">' +
                    (u.mat_produce_id ? '이미 발번됨 · 재작업해도 바뀌지 않습니다'
                        : (u.lot_mode === 'new' ? '새 로트 발번 · 원 로트 소비로 계보 연결' : '원 로트번호 그대로 유지')) + '</div></div>' +
                    (locked ? '' : '<div class="lotmode">' +
                        '<button class="' + (u.lot_mode === 'keep' ? 'on' : '') + '" data-lotmode="keep">원 로트 유지</button>' +
                        '<button class="' + (u.lot_mode === 'new' ? 'on' : '') + '" data-lotmode="new">새 로트 발번</button></div>') + '</div>';

                // 재작업 사유 (검사에서 넘어온 것)
                if (u.reject_reason) {
                    html += '<div class="notebox" style="background:var(--red-bg);border-color:var(--red);color:var(--red)">' +
                        '재작업 필요 · 검사 결과 : ' + esc(u.reject_reason) + '</div>';
                }

                // 시작 · 완료 시각 (탭하면 수정)
                var tEdit = ['pass', 'packed'].indexOf(u.state) < 0;
                var tb = function (which, lab, val, on) {
                    return '<button class="timebtn" data-time="' + which + '"' + (on ? '' : ' disabled') + '>' +
                        '<span class="l">' + lab + '</span>' +
                        '<span class="v' + (val ? '' : ' none') + '">' + esc(val || '—') + '</span></button>';
                };
                html += '<div class="timerow">' +
                    tb('start', '시작', u.start_time, tEdit && u.state !== 'wait') +
                    tb('end', '완료', u.end_time, tEdit && !!u.end_time) + '</div>';
                var dur = durTxt(u.start_time, u.end_time);
                if (dur) html += '<div class="durline">소요 ' + dur + '</div>';

                // 작업자 · 설비
                var uWho = unitWho(u);
                html += '<div class="whoRow"><span class="l">수리 작업자</span>' +
                    '<span class="nm">' + esc(uWho || '미배정') + '</span>' +
                    (u.equipment_name
                        ? '<span class="l" style="margin-left:14px">설비</span><span class="nm">' + esc(u.equipment_name) + '</span>'
                        : '') +
                    (locked ? '' : '<button class="assign" data-who>' + (uWho ? '변경' : '배정') + '</button>') + '</div>';

                // 자재 가감
                var mats = u.mats || [];
                var plus = mats.filter(function (m) { return m.dir === '+'; });
                var minus = mats.filter(function (m) { return m.dir === '-'; });
                html += '<div class="secline">투입 자재 (＋추가 / −차감 자유 조정) <span class="ln"></span><span>＋' + plus.length + ' / −' + minus.length + '</span></div>';
                /* 담기 버튼을 목록 위에 둔다.
                   회수 목록이 접수 때 자동으로 깔려 길어졌기 때문에,
                   아래에 두면 박스·폼·케이블을 다 지나쳐 스크롤해야 손이 닿는다. */
                if (!locked) {
                    html += '<div class="addbar">' +
                        '<button class="addbtn" data-add="+">＋ 자재 추가(투입)</button>' +
                        '<button class="addbtn minus" data-add="-">− 자재 회수(재사용품)</button></div>';
                }
                if (!mats.length) html += '<div class="emptybox">투입 자재가 없습니다. 위에서 자재를 담으세요.</div>';
                html += mats.map(function (m) {
                    var isPlus = m.dir === '+';
                    var cap = isPlus ? num(m.stock)
                        : (m.used_qty != null ? num(m.used_qty) : null);
                    var atCap = (cap != null) && num(m.qty) >= cap;
                    var short = isPlus && num(m.stock) < num(m.qty);
                    var sub;
                    if (isPlus) {
                        sub = '추가 투입 · 생산창고 재고 ' + qtyTxt(m.stock) + (short ? ' (부족)' : '');
                    } else if (cap != null) {
                        // '원 로트' 라고만 쓰면 부품 자신의 로트로 읽힌다. 둘을 구분해서 적는다.
                        sub = '회수 → 생산창고 재입고' +
                            (m.src_lot_number ? ' · 부품로트 ' + esc(m.src_lot_number) : '') +
                            ' · 원 M-CELL 조립 시 ' + qtyTxt(cap) + ' 투입 (최대 ' + qtyTxt(cap) + ')';
                    } else if (m.from_pack_bom) {
                        /* 접수 때 박스를 풀며 자동으로 담긴 포장 자재.
                           포장에서 투입된 것이라 조립 이력(usedQtyOf)에는 당연히 없다.
                           「조립 이력이 없다」고 적으면 근거 없는 회수처럼 보이지만
                           실제 근거는 포장 BOM 이다. */
                        sub = '회수 → 생산창고 재입고 · 포장 자재(BOM 기준 자동) · 회수 못 하면 삭제';
                    } else {
                        sub = '회수 → 생산창고 재입고 · 조립 이력이 없어 상한 없음';
                    }
                    // 이미 소비된 행은 이력이라 잠근다 (재작업 때 1차 투입이 여기 해당)
                    var frozen = (m.state === 'applied');
                    return '<div class="mrow ' + (isPlus ? 'plus' : 'minus') + (frozen ? ' frozen' : '') + '">' +
                        '<div class="dir">' + (isPlus ? '＋' : '−') + '</div>' +
                        '<div class="id"><div class="mn">' + esc(m.mat_name) +
                        (frozen ? ' <span class="fz">반영됨</span>' : '') + '</div>' +
                        '<div class="mc' + (short ? ' short' : '') + '">' + esc(m.mat_code) + ' · ' + sub + '</div></div>' +
                        (locked || frozen
                            ? '<span class="stepper"><span class="q">' + qtyTxt(m.qty) + '</span></span>'
                            : '<div class="stepper" data-mstep="' + m.rmat_id + '"><button class="minus">−</button>' +
                            '<div class="q">' + qtyTxt(m.qty) + '</div>' +
                            '<button class="plus"' + (atCap ? ' disabled' : '') + '>+</button></div>' +
                            '<button class="rm" data-mrm="' + m.rmat_id + '">✕</button>') + '</div>';
                }).join('');

                if (locked && num(u.insp_cnt) > 0) {
                    html += '<div class="notebox">검사 회차가 있어 수리 복귀가 막혀 있습니다. 검사 화면에서 회차를 먼저 삭제하세요.</div>';
                }

                document.getElementById('cGrid').innerHTML = html;
                renderAction();
                if (sc) sc.scrollTop = keep;
            }

            function renderAction() {
                var u = curU, bar = document.getElementById('cAction');
                var mats = u.mats || [];
                var pc = mats.filter(function (m) { return m.dir === '+'; }).length;
                var mc = mats.filter(function (m) { return m.dir === '-'; }).length;

                if (u.state === 'wait' || u.state === 'reject') {
                    bar.innerHTML = '<div class="actsum"><span class="l">' +
                        (u.state === 'reject' ? '재작업 · 시작하면 이전 실적이 되돌아갑니다' : '작업자 배정 후 수리 시작') +
                        '</span><span class="v">＋' + pc + ' / −' + mc + ' 자재</span></div>' +
                        '<button class="btn start" data-act="start">' +
                        (u.state === 'reject' ? '재작업 시작' : '수리 시작') + '</button>';
                } else if (u.state === 'repairing') {
                    bar.innerHTML = '<div class="actsum"><span class="l">' + esc(unitWho(u)) +
                        (u.mat_produce_id ? ' · 재작업중 (' + esc(u.result_lot || '') + ')' : ' · 수리중') + '</span>' +
                        '<span class="v">＋' + pc + ' / −' + mc + ' 자재</span></div>' +
                        '<button class="btn ghost" data-act="cancel">시작취소</button>' +
                        '<button class="btn primary" data-act="finish">' +
                        (u.mat_produce_id ? '재작업 반영 · 검사 전달' : '수리 완료 · 검사 전달') + '</button>';
                } else if (u.state === 'inspect_wait') {
                    bar.innerHTML = '<div class="actsum"><span class="l">' + esc(u.result_lot || '') + ' · 검사 대기</span>' +
                        '<span class="v" style="color:var(--purple);font-size:15px">검사 공정으로 전달됨</span></div>' +
                        '<button class="btn ghost" data-act="reopen"' + (num(u.insp_cnt) > 0 ? ' disabled' : '') + '>검사취소 · 수리 복귀</button>';
                } else {
                    bar.innerHTML = '<div class="actsum"><span class="l">' + (UST[u.state] || u.state) + '</span>' +
                        '<span class="v">' + esc(u.result_lot || '') + '</span></div>';
                }
            }

            document.getElementById('cGrid').addEventListener('click', function (e) {
                if (e.target.closest('[data-who]')) { openWho(); return; }

                var tb = e.target.closest('[data-time]');
                if (tb && !tb.disabled) { openTime(tb.dataset.time); return; }

                var ms = e.target.closest('[data-mstep]');
                if (ms && (e.target.classList.contains('plus') || e.target.classList.contains('minus'))) {
                    if (e.target.disabled) return;
                    var rid = +ms.dataset.mstep;
                    var row = (curU.mats || []).find(function (m) { return m.rmat_id === rid; });
                    if (!row) return;
                    var up = e.target.classList.contains('plus');
                    var next = num(row.qty) + (up ? 1 : -1);
                    if (next < 1) return;
                    if (up) {
                        if (row.dir === '-' && row.used_qty != null && next > num(row.used_qty)) {
                            flash('원 M-CELL 에 투입된 수량은 ' + qtyTxt(row.used_qty) + ' 입니다'); return;
                        }
                        if (row.dir === '+' && next > num(row.stock)) {
                            flash(num(row.stock) <= 0
                                ? '생산창고에 재고가 없습니다'
                                : '생산창고 재고가 ' + qtyTxt(row.stock) + ' 뿐입니다'); return;
                        }
                    }
                    row.qty = next; renderUnit();                       // 낙관적 반영(연타 대응)
                    post('/mat_qty', {rmat_id: rid, qty: next});
                    return;
                }
                var rm = e.target.closest('[data-mrm]');
                if (rm) { post('/mat_del', {rmat_id: +rm.dataset.mrm}, reloadUnit); return; }

                var ab = e.target.closest('[data-add]');
                if (ab) { openMat(ab.dataset.add); return; }

                var lm = e.target.closest('[data-lotmode]');
                if (lm) { post('/lot_mode', {unit_id: curU.id, mode: lm.dataset.lotmode}, reloadUnit); return; }
            });

            document.getElementById('cAction').addEventListener('click', function (e) {
                var a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
                var act = a.dataset.act, u = curU;

                if (act === 'start') {
                    if (!u.actor_id) { flash('작업자를 먼저 배정하세요'); openWho(); return; }
                    var go = function () {
                        post('/unit_start', {unit_id: u.id, actor_id: u.actor_id, equipment_id: u.equipment_id},
                            function () { reloadUnit(); loadQueue(); });
                    };
                    if (u.state === 'reject' && u.mat_produce_id) {
                        // 되돌리지도, 새로 만들지도 않는다. 기존 실적을 이어서 고친다.
                        ask('재작업을 시작합니다.\n\n' +
                            '· 결과 로트 ' + (u.result_lot || '') + ' 는 그대로 유지됩니다\n' +
                            '· 이미 반영된 자재는 이력이라 수정할 수 없습니다\n' +
                            '· 추가로 쓴 자재만 담고 다시 «수리 완료» 를 누르세요\n\n' +
                            '★ 불량으로 버린 자재는 «불량 등록»에 따로 기록하세요.',
                            go, '재작업 시작');
                    } else {
                        go();
                    }
                } else if (act === 'cancel') {
                    post('/unit_cancel', {unit_id: u.id}, function () { reloadUnit(); loadQueue(); });
                } else if (act === 'finish') {
                    var pend = (u.mats || []).filter(function (m) { return m.state !== 'applied'; });
                    var msg = u.mat_produce_id
                        ? ('재작업을 반영하고 검사로 다시 전달합니다.\n\n' +
                            '· 결과 로트 ' + (u.result_lot || '') + ' 유지 (새 로트 없음)\n' +
                            '· 추가 자재 ' + pend.filter(function (m) { return m.dir === '+'; }).length + '건 소비\n' +
                            (pend.filter(function (m) { return m.dir === '-'; }).length
                                ? '· 회수 부품은 생산창고로 재입고\n' : ''))
                        : ('수리를 완료하고 검사로 전달합니다.\n\n' +
                            '· 원 로트 ' + u.src_lot + ' 1대 소비\n' +
                            '· 결과 로트 ' + (u.next_lot || '') + ' 생산창고 입고\n' +
                            (pend.filter(function (m) { return m.dir === '-'; }).length
                                ? '· 회수 부품은 생산창고로 재입고\n' : ''));
                    ask(msg, function () {
                        post('/unit_finish', {unit_id: u.id, spjangcd: SPJANGCD}, function () {
                            reloadUnit(); loadQueue();
                        });
                    });
                } else if (act === 'reopen') {
                    ask('검사 전달을 취소하고 수리로 되돌립니다.\n생성된 결과 로트와 회수 부품 로트가 삭제됩니다.', function () {
                        post('/unit_reopen', {unit_id: u.id}, function () { reloadUnit(); loadQueue(); });
                    });
                }
            });

            /* ── 시트 공통 ─────────────────────────────────────── */
            function showMask(id) { document.getElementById(id).classList.add('show'); }
            function hideMask(id) { document.getElementById(id).classList.remove('show'); }
            document.querySelectorAll('.mask').forEach(function (m) {
                m.addEventListener('click', function (e) {
                    if (e.target === m || e.target.closest('[data-close]')) m.classList.remove('show');
                });
            });
            document.querySelectorAll('[data-back]').forEach(function (b) {
                b.addEventListener('click', function () { loadQueue(); show('A'); });
            });

            /* ── 시작 · 완료 시각 수정 ─────────────────────────── */
            var timeWhich = 'start', editDate = new Date();
            function pad2(n) { return String(n).padStart(2, '0'); }
            function fmtD(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

            function openTime(which) {
                timeWhich = which;
                document.getElementById('timeTitle').textContent =
                    (which === 'start' ? '시작' : '완료') + ' 일시 수정';
                var saved = (which === 'start') ? curU.start_time : curU.end_time;
                editDate = (saved && saved.indexOf(' ') >= 0)
                    ? new Date(saved.split(' ')[0] + 'T' + saved.split(' ')[1]) : new Date();
                document.getElementById('tDate').textContent = fmtD(editDate);
                document.getElementById('tH').textContent = pad2(editDate.getHours());
                document.getElementById('tM').textContent = pad2(editDate.getMinutes());
                showMask('timeMask');
            }
            document.querySelector('#timeMask .dateedit').addEventListener('click', function (e) {
                var b = e.target.closest('[data-d]'); if (!b) return;
                editDate.setDate(editDate.getDate() + (+b.dataset.d));
                document.getElementById('tDate').textContent = fmtD(editDate);
            });
            document.querySelector('#timeMask .timeedit').addEventListener('click', function (e) {
                var b = e.target.closest('[data-t]'); if (!b) return;
                var H = document.getElementById('tH'), M = document.getElementById('tM');
                var h = +H.textContent, m = +M.textContent;
                if (b.dataset.t === 'h+') h = (h + 1) % 24;
                if (b.dataset.t === 'h-') h = (h + 23) % 24;
                if (b.dataset.t === 'm+') m = (m + 1) % 60;
                if (b.dataset.t === 'm-') m = (m + 59) % 60;
                H.textContent = pad2(h); M.textContent = pad2(m);
            });
            document.getElementById('timeOk').onclick = function () {
                var v = fmtD(editDate) + ' ' +
                    document.getElementById('tH').textContent + ':' +
                    document.getElementById('tM').textContent;
                // 문자열 비교로 충분하다 — 'yyyy-mm-dd hh:mm' 는 사전순 = 시간순
                if (timeWhich === 'start' && curU.end_time && v > curU.end_time) {
                    flash('시작이 완료보다 늦을 수 없습니다'); return;
                }
                if (timeWhich === 'end' && curU.start_time && v < curU.start_time) {
                    flash('완료가 시작보다 빠를 수 없습니다'); return;
                }
                hideMask('timeMask');
                post('/unit_time', {unit_id: curU.id, which: timeWhich, value: v}, function () {
                    reloadUnit(); loadQueue();
                    flash((timeWhich === 'start' ? '시작' : '완료') + ' 일시 저장 · ' + v);
                });
            };

            /* ── 작업자 · 설비 배정 ────────────────────────────── */
            var selWorkers = [], equSel = null;
            function whoSel() { return selWorkers.length ? selWorkers[0].id : null; }

            function openWho() {
                if (!WORKERS.length) WORKERS = fetchWorkersActor();   /* 소속 공장(2공장) 인원만 */
                if (!EQUIPS.length)  EQUIPS  = api('/equipments') || [];
                /* 기존 배정(대표 + 조원)을 그대로 복원 */
                selWorkers = [];
                if (curU.actor_id) {
                    selWorkers.push({id: String(curU.actor_id), name: curU.actor_name || ''});
                    String(curU.member_ids || '').split(',').map(function (x) { return x.trim(); })
                        .filter(Boolean).forEach(function (id) {
                        if (!selWorkers.some(function (w) { return w.id === id; })) selWorkers.push({id: id, name: ''});
                    });
                }
                equSel = curU.equipment_id || null;

                document.getElementById('whoOpts').innerHTML = WORKERS.map(function (w) {
                    return '<button class="opt" data-w="' + w.actor_id + '" data-n="' + esc(w.actor_name) + '">' +
                        '<span class="ck"></span>' + esc(w.actor_name) + '</button>';
                }).join('') || '<div class="emptybox">등록된 작업자가 없습니다.</div>';
                paintWhoOpts();

                document.getElementById('equOpts').innerHTML = EQUIPS.length
                    ? EQUIPS.map(function (q) {
                        return '<button class="opt' + (equSel === q.equipment_id ? ' sel' : '') + '" data-q="' + q.equipment_id + '">' +
                            esc(q.equipment_name) + '</button>';
                    }).join('')
                    : '<div class="emptybox">수리 워크센터에 등록된 설비가 없습니다.</div>';

                showMask('whoMask');
            }

            /* 작업자 다중 선택 — 첫 선택자가 대표(Actor). 조립(BSC)과 동일 규약 */
            document.getElementById('whoOpts').addEventListener('click', function (e) {
                var b = e.target.closest('[data-w]'); if (!b) return;
                var id = b.dataset.w, name = b.dataset.n;
                var k = -1;
                selWorkers.forEach(function (w, i) { if (String(w.id) === String(id)) k = i; });
                if (k >= 0) { selWorkers.splice(k, 1); } else { selWorkers.push({id: id, name: name}); }
                paintWhoOpts();
            });

            function paintWhoOpts() {
                document.querySelectorAll('#whoOpts .opt').forEach(function (x) {
                    var on = selWorkers.some(function (w) { return String(w.id) === String(x.dataset.w); });
                    x.classList.toggle('sel', on);
                    var ck = x.querySelector('.ck');
                    if (ck) ck.textContent = on ? '\u2713' : '';
                });
                document.getElementById('whoOk').disabled = !selWorkers.length;
            }

            // 설비는 선택 항목 — 같은 걸 다시 누르면 해제된다(가동 이력 안 남김)
            document.getElementById('equOpts').addEventListener('click', function (e) {
                var b = e.target.closest('[data-q]'); if (!b) return;
                var id = +b.dataset.q;
                equSel = (equSel === id) ? null : id;
                document.querySelectorAll('#equOpts .opt').forEach(function (x) {
                    x.classList.toggle('sel', +x.dataset.q === equSel);
                });
            });

            // 배정 = 수리 시작. 이미 수리중이면 서버가 상태·시작시각을 보존하고 배정만 바꾼다.
            document.getElementById('whoOk').onclick = function () {
                if (!selWorkers.length) { flash('작업자를 선택하세요'); return; }
                hideMask('whoMask');
                post('/unit_start', {
                    unit_id: curU.id,
                    actor_id  : whoSel(),                                                /* 대표 = Actor_id */
                    member_ids: selWorkers.slice(1).map(function (w) { return w.id; })
                        .filter(Boolean).join(','),
                    equipment_id: equSel
                }, function () { reloadUnit(); loadQueue(); });
            };

            /* ── 자재 시트 ─────────────────────────────────────── */
            //  ＋ 투입 : 생산창고 재고 전체
            //  − 회수 : 원 로트에 실제 투입됐던 자재 (계보 유지). 필요하면 전체로 전환.
            var addDir = '+', matPool = [], matScope = 'all';

            function openMat(dir) {
                addDir = dir;
                matScope = (dir === '-') ? 'used' : 'all';
                document.getElementById('matTitle').textContent = (dir === '+' ? '자재 추가 (투입)' : '자재 회수 (재사용품)');
                document.getElementById('matLab').textContent =
                    (dir === '+' ? '추가 투입할 자재 (생산창고 재고)'
                        : '재사용 가능한 회수 부품 (생산창고로 재입고 · 폐기품은 불량 등록)') + ' · 눌러서 담기';
                document.getElementById('matScopeBar').style.display = (dir === '-') ? '' : 'none';
                setScopeBtn();
                document.getElementById('matKw').value = '';
                loadMatList('');
                showMask('matMask');
            }
            function setScopeBtn() {
                document.getElementById('scopeUsed').classList.toggle('on', matScope === 'used');
                document.getElementById('scopeAll').classList.toggle('on', matScope === 'all');
            }
            document.getElementById('matScopeBar').addEventListener('click', function (e) {
                var b = e.target.closest('[data-scope]'); if (!b) return;
                matScope = b.dataset.scope; setScopeBtn();
                loadMatList(document.getElementById('matKw').value);
            });

            function loadMatList(kw) {
                var usedMode = (addDir === '-' && matScope === 'used');
                if (usedMode) {
                    matPool = api('/consumed_list', {unit_id: curU.id}) || [];
                    if (kw) {
                        var k = kw.toLowerCase();
                        matPool = matPool.filter(function (p) {
                            return (p.mat_code || '').toLowerCase().indexOf(k) >= 0
                                || (p.mat_name || '').toLowerCase().indexOf(k) >= 0;
                        });
                    }
                } else {
                    matPool = api('/stock_list', {keyword: kw || ''}) || [];
                }
                var have = {};
                (curU.mats || []).forEach(function (m) {
                    if (m.dir !== addDir) return;
                    if (m.state === 'applied') return;      // 반영된 건 이력 — 다시 담을 수 있다
                    have[usedMode ? (m.mat_id + '|' + (m.src_mat_lot_id || '')) : String(m.mat_id)] = true;
                });

                var rows = matPool.map(function (p) {
                    var noStock = (addDir === '+') && num(p.stock) <= 0;
                    var key = usedMode ? (p.mat_id + '|' + (p.src_mat_lot_id || '')) : String(p.mat_id);
                    var sub = usedMode
                        ? esc(p.mat_code) +
                        (p.src_lot_number ? ' · 로트 ' + esc(p.src_lot_number) : ' · 로트 미상') +
                        ' · 조립 시 ' + qtyTxt(p.used_qty) + ' 투입' + (p.unit ? ' ' + esc(p.unit) : '')
                        : esc(p.mat_code) + ' · 재고 ' + qtyTxt(p.stock) + (p.unit ? ' ' + esc(p.unit) : '')
                        + (noStock ? ' · 담을 수 없음' : '');
                    return '<div class="prow ' + (have[key] ? 'added' : '') + (noStock ? ' nostock' : '') +
                        '" data-m="' + p.mat_id + '" data-stock="' + num(p.stock) +
                        '" data-srclot="' + (p.src_mat_lot_id || '') + '">' +
                        '<div class="pid"><div class="pnm">' + esc(p.mat_name) + '</div>' +
                        '<div class="pcode">' + sub + '</div></div>' +
                        '<div class="pchk">' + (have[key] ? '✓' : (addDir === '+' ? '＋' : '−')) + '</div></div>';
                }).join('');

                if (!rows) {
                    rows = usedMode
                        ? '<div class="emptybox">' + (kw ? '검색 결과가 없습니다.'
                        : '이 로트의 조립 이력을 찾지 못했습니다.<br>시스템 도입 전에 만들어졌거나 외부에서 들어온 장비일 수 있습니다.<br>«전체 자재»로 전환해 직접 고르세요.') + '</div>'
                        : '<div class="emptybox">검색 결과가 없습니다.</div>';
                }
                document.getElementById('matList').innerHTML = rows;
            }
            var kwT;
            document.getElementById('matKw').addEventListener('input', function (e) {
                clearTimeout(kwT); var v = e.target.value;
                kwT = setTimeout(function () { loadMatList(v); }, 250);
            });
            document.getElementById('matList').addEventListener('click', function (e) {
                var r = e.target.closest('[data-m]'); if (!r) return;
                var matId = +r.dataset.m;
                var srcLot = r.dataset.srclot ? +r.dataset.srclot : null;
                var ex = (curU.mats || []).find(function (m) {
                    return m.mat_id === matId && m.dir === addDir && m.state !== 'applied'
                        && (addDir !== '-' || (m.src_mat_lot_id || null) === srcLot);
                });
                if (ex) { post('/mat_del', {rmat_id: ex.rmat_id}, afterMat); return; }
                // 없는 걸 투입할 수는 없다. 서버도 같은 조건으로 막는다.
                if (addDir === '+' && num(r.dataset.stock) <= 0) {
                    flash('생산창고에 재고가 없습니다'); return;
                }
                var pr = {unit_id: curU.id, material_id: matId, dir: addDir, qty: 1, spjangcd: SPJANGCD};
                if (srcLot) pr.src_mat_lot_id = srcLot;
                post('/mat_add', pr, afterMat);
            });
            function afterMat() {
                curU = api('/unit_detail', {unit_id: curU.id}) || curU;
                renderUnit();
                loadMatList(document.getElementById('matKw').value);
            }

            /* ── 수리 접수 ─────────────────────────────────────── */
            var regCat = 'return', regLotSel = null, regTgtSel = null, regLots = [];

            document.getElementById('btnReg').addEventListener('click', function () {
                regCat = 'return'; regLotSel = null; regTgtSel = null; regLots = [];
                document.querySelectorAll('#regCat .opt').forEach(function (x) { x.classList.toggle('sel', x.dataset.c === 'return'); });
                stopCam();
                document.getElementById('regLot').value = '';
                document.getElementById('regNote').value = '';
                document.getElementById('regTgtKw').value = '';
                document.getElementById('regLotResult').innerHTML = '';
                document.getElementById('regTgtList').innerHTML = '';
                document.getElementById('regTargetWrap').style.display = 'none';
                document.getElementById('regOk').disabled = true;
                showMask('regMask');
            });
            document.getElementById('regCat').addEventListener('click', function (e) {
                var b = e.target.closest('[data-c]'); if (!b) return;
                regCat = b.dataset.c;
                document.querySelectorAll('#regCat .opt').forEach(function (x) { x.classList.remove('sel'); });
                b.classList.add('sel');
                document.getElementById('regTargetWrap').style.display = (regCat === 'spec') ? '' : 'none';
                if (regCat === 'spec' && !document.getElementById('regTgtList').innerHTML) loadTgtList('');
                // 유형이 바뀌면 허용 판정도 바뀐다 (검사 전 재고는 사양변경만 가능)
                if (regLots.length) { regLotSel = null; doFind(); }
            });

            document.getElementById('regFind').addEventListener('click', doFind);
            document.getElementById('regLot').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { e.preventDefault(); doFind(); }
            });

            function doFind() {
                var key = (document.getElementById('regLot').value || '').trim().toUpperCase();
                document.getElementById('regLot').value = key;
                regLotSel = null;
                if (!key) { flash('원 M-CELL 로트를 입력하세요'); return; }

                regLots = api('/src_lot_search', {key: key}) || [];
                var box = document.getElementById('regLotResult');

                if (!regLots.length) {
                    // 미등록 — 품목을 사람이 지정해야 반품 입고가 가능하다
                    box.innerHTML = '<div class="notebox" style="margin-top:10px">' +
                        '등록되지 않은 로트입니다. 반품으로 <b>신규 입고</b>합니다. 아래에서 품목을 선택하세요.</div>' +
                        '<div class="fieldlab">품목 선택 (필수)</div>' +
                        '<input class="txin" id="regSrcKw" placeholder="품목코드 / 품명 검색" autocomplete="off"/>' +
                        '<div class="picklist" id="regSrcList" style="max-height:28dvh"></div>';
                    bindSrcPicker();
                    loadSrcList('');
                    document.getElementById('regOk').disabled = true;
                    return;
                }

                box.innerHTML = '<div class="fieldlab">조회 결과 · 대상 선택</div>' +
                    '<div class="picklist" style="max-height:34dvh">' + regLots.map(function (l, i) {
                        var ok = lotAllowed(l);
                        var tag = ok
                            ? (l.intake_type === 'move'
                                ? '<span class="itag move">재고 이동</span>'
                                : '<span class="itag new">반품 신규입고</span>')
                            : '<span class="itag no">접수 불가</span>';
                        /* ★ 포장 여부를 앞세운다.
                             바코드를 찍으면 같은 로트번호로 완제품과 재공품이 함께 나오는데
                             «SMART-M-CELL4-A (국내)» 와 «M-CELL4-A(재공품)» 는 이름이 비슷해
                             손에 든 것이 어느 쪽인지 품명만으로는 헷갈린다.
                             박스가 있느냐 없느냐는 눈으로 바로 확인되는 사실이라 그걸 묻는다. */
                        var ptag = l.unpack
                            ? '<span class="ptag boxed">포장완료 · 박스 있음</span>'
                            : '<span class="ptag bare">재공품 · 박스 없음</span>';

                        /* ★ 재고 수량은 보여주지 않는다.
                             수리는 대개 출하됐다 돌아오는 물건이라 재고 0 이 정상인데,
                             0 을 보여주면 「재고가 없는데 접수가 되나」로 읽힌다.
                             대신 접수하면 무엇이 되는지를 적는다. */
                        var into = l.unpack
                            ? '<div class="pinto">박스를 풀어 <b>' + esc(l.intake_mat_name) + '</b> 로 접수' +
                            '<br><span class="dim">포장 자재는 회수 목록에 자동으로 담깁니다</span></div>'
                            : '<div class="pinto"><span class="dim">박스 없이 들어온 물건입니다 · 포장 자재 회수 없음</span></div>';

                        return '<div class="prow' + (ok ? '' : ' nostock') + '" data-l="' + i + '">' +
                            '<div class="pid"><div class="pnm">' + ptag + ' ' + esc(l.mat_name) + '</div>' +
                            '<div class="pcode">' + esc(l.lot_number) +
                            (l.maker_lot_no ? ' · 라벨 ' + esc(l.maker_lot_no) : '') +
                            ' · ' + esc(l.store_name || ('창고' + l.store_id)) + '</div>' + into +
                            (l.verdict_note ? '<div class="pwarn">' + esc(l.verdict_note) + '</div>' : '') +
                            '</div>' + tag + '</div>';
                    }).join('') + '</div>';

                var okList = regLots.filter(lotAllowed);
                if (okList.length === 1) selectLot(regLots.indexOf(okList[0]));
                else document.getElementById('regOk').disabled = true;
            }
            document.getElementById('regLotResult').addEventListener('click', function (e) {
                var r = e.target.closest('[data-l]'); if (!r) return;
                selectLot(+r.dataset.l);
            });
            // 유형별 접수 가능 여부. 서버가 내려준 판정을 그대로 쓴다.
            function lotAllowed(l) {
                return (regCat === 'spec') ? (l.allow_spec !== false) : (l.allow_return !== false);
            }
            function selectLot(i) {
                var l = regLots[i];
                if (!lotAllowed(l)) {
                    flash(l.verdict_note || '이 로트는 접수할 수 없습니다');
                    return;
                }
                regLotSel = l;
                document.querySelectorAll('#regLotResult [data-l]').forEach(function (x) {
                    x.classList.toggle('sel', +x.dataset.l === i);
                });
                document.getElementById('regOk').disabled = false;
            }

            // 미등록 품목 선택
            var srcSel = null;
            function bindSrcPicker() {
                var kwEl = document.getElementById('regSrcKw'), t;
                kwEl.addEventListener('input', function (e) {
                    clearTimeout(t); var v = e.target.value;
                    t = setTimeout(function () { loadSrcList(v); }, 250);
                });
                document.getElementById('regSrcList').addEventListener('click', function (e) {
                    var r = e.target.closest('[data-s]'); if (!r) return;
                    srcSel = +r.dataset.s;
                    document.querySelectorAll('#regSrcList [data-s]').forEach(function (x) {
                        x.classList.toggle('sel', +x.dataset.s === srcSel);
                    });
                    document.getElementById('regOk').disabled = false;
                });
            }
            function loadSrcList(kw) {
                // scope=src — 미등록 반품은 박스째 오므로 완제품도 고를 수 있어야 한다.
                // 완제품을 고르면 서버가 박스를 풀어 반제품으로 접수한다.
                var d = api('/target_materials', {keyword: kw || '', scope: 'src'}) || [];
                document.getElementById('regSrcList').innerHTML = d.map(function (m) {
                    return '<div class="prow' + (srcSel === m.mat_id ? ' sel' : '') + '" data-s="' + m.mat_id + '">' +
                        '<div class="pid"><div class="pnm">' + esc(m.mat_name) + '</div>' +
                        '<div class="pcode">' + esc(m.mat_code) + '</div></div></div>';
                }).join('') || '<div class="emptybox">검색 결과가 없습니다.</div>';
            }

            // 사양변경 대상 품목
            var tgtT;
            document.getElementById('regTgtKw').addEventListener('input', function (e) {
                clearTimeout(tgtT); var v = e.target.value;
                tgtT = setTimeout(function () { loadTgtList(v); }, 250);
            });
            function loadTgtList(kw) {
                var d = api('/target_materials', {keyword: kw || ''}) || [];
                document.getElementById('regTgtList').innerHTML = d.map(function (m) {
                    return '<div class="prow' + (regTgtSel === m.mat_id ? ' sel' : '') + '" data-t="' + m.mat_id + '">' +
                        '<div class="pid"><div class="pnm">' + esc(m.mat_name) + '</div>' +
                        '<div class="pcode">' + esc(m.mat_code) + '</div></div></div>';
                }).join('') || '<div class="emptybox">검색 결과가 없습니다.</div>';
            }
            document.getElementById('regTgtList').addEventListener('click', function (e) {
                var r = e.target.closest('[data-t]'); if (!r) return;
                var id = +r.dataset.t;
                regTgtSel = (regTgtSel === id) ? null : id;    // 다시 누르면 해제(= 옵션만 변경)
                document.querySelectorAll('#regTgtList [data-t]').forEach(function (x) {
                    x.classList.toggle('sel', +x.dataset.t === regTgtSel);
                });
            });

            document.getElementById('regOk').onclick = function () {
