<html layout:decorate="~{layout_page}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<th:block layout:fragment="content">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet"/>
    <style>
        :root{--bg:#E9EEF1;--surface:#FFF;--surface-2:#F4F7F9;--ink:#15222B;--ink-2:#5A6B76;--line:#D8E0E5;
            --teal:#0E7C86;--teal-d:#0A5C64;--teal-bg:#E2F1F2;--green:#1E9D58;--green-bg:#E4F4EA;
            --amber:#C77A00;--amber-bg:#FBEFD8;--red:#C8483B;--red-bg:#F7E4E1;--purple:#6D3BD1;--purple-bg:#EDE6FB;
            --r:18px;--tap:60px;--shadow:0 1px 0 rgba(21,34,43,.04),0 8px 24px -16px rgba(21,34,43,.28)}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        .ms-wash-root{position:relative;font-family:"Pretendard","Noto Sans KR",-apple-system,sans-serif;color:var(--ink);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;flex:1 1 auto;min-height:0;height:var(--wash-h,100%);max-height:var(--wash-h,none);display:flex;flex-direction:column}
        .ms-wash-root .app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--bg);border-radius:12px;overflow:hidden}
        .col-stack{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;height:100%}
        .topbar{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);z-index:2;flex-wrap:wrap}
        .topbar h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0}
        .fbadge{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:6px;background:#EAF0FF;color:#2f6fed}
        .fbadge.f2{background:#FBEEE5;color:#c9620a}
        .filt{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
        .dinput{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:15px;font-weight:700;background:var(--surface-2);font-variant-numeric:tabular-nums}
        .selbox{height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:15px;font-weight:700;background:var(--surface-2)}
        .addbtn{height:52px;padding:0 20px;border:none;border-radius:14px;background:var(--red);color:#fff;font-weight:800;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
        .addbtn:active{background:#a63b30}
        .bscroll{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px}
        .wrap{max-width:1000px;margin:0 auto}
        .kpis{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
        .kpi{flex:1;min-width:130px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow)}
        .kpi .n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}.kpi .l{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .kpi.q .n{color:var(--red)}

        .drow{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);margin-bottom:10px}
        .drow .dl{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
        .drow .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .proc{font-size:12px;font-weight:800;padding:3px 10px;border-radius:6px;background:#EEF2F8;color:#3a4759}
        .dtype{font-size:12.5px;font-weight:800;padding:3px 11px;border-radius:20px;background:var(--red-bg);color:var(--red)}
        .ditem{font-size:17px;font-weight:800;letter-spacing:-.02em}
        .dcode{font-size:12px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
        .dmeta{font-size:12.5px;color:var(--ink-2);font-weight:700}
        .dlot{font-size:12px;color:var(--teal-d);font-weight:800;background:var(--teal-bg);padding:2px 8px;border-radius:6px;display:inline-block}
        .dqty{font-size:22px;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums;flex:0 0 auto}
        .dqty small{font-size:12px;color:var(--ink-2);font-weight:700}
        .dthumb{width:52px;height:52px;border-radius:10px;object-fit:cover;border:1px solid var(--line);cursor:pointer;flex:0 0 auto}
        .ddel{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--red);font-size:20px;cursor:pointer;flex:0 0 auto}
        .ddel:active{background:var(--red-bg)}
        .drow{cursor:pointer}
        .drow:active{background:var(--surface-2)}
        .dsum{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 14px;background:var(--surface-2);border-radius:14px;margin-bottom:6px}
        .dsum div{font-size:14px;font-weight:700}
        .dsum span{color:var(--ink-2);font-weight:700;margin-right:6px}
        .lotrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
        .lotrow .ln{flex:1;min-width:0}
        .lotrow .lnum{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
        .lotrow .lsub{font-size:12px;color:var(--ink-2);font-weight:700}
        .lotrow .lq{font-size:17px;font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}
        .pgrid{display:flex;flex-wrap:wrap;gap:8px}
        .pgrid img{width:92px;height:92px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:pointer}
        .empty{text-align:center;color:var(--ink-2);font-weight:700;padding:40px 10px;border:1.5px dashed var(--line);border-radius:16px}

        .mask{position:absolute;inset:0;height:var(--wash-h,100%);max-height:var(--wash-h,100%);background:rgba(21,34,43,.42);display:none;z-index:40;align-items:flex-end;overflow:hidden}
        .mask.show{display:flex;animation:fade .15s ease}@keyframes fade{from{opacity:0}to{opacity:1}}
        .sheet{width:100%;background:var(--surface);border-radius:24px 24px 0 0;padding:14px 20px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 40px -20px rgba(0,0,0,.4);animation:rise .2s cubic-bezier(.2,.7,.3,1);max-height:100%;overflow:auto;overscroll-behavior:contain}
        @keyframes rise{from{transform:translateY(40px)}to{transform:translateY(0)}}
        .sheet .sh{display:flex;align-items:center;margin-bottom:8px}.sheet .sh h3{font-size:19px;font-weight:800;margin:0}
        .sheet .sh .x{margin-left:auto;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;cursor:pointer}
        .sheet .body{max-width:680px;margin:0 auto}
        .fieldlab{font-size:13px;font-weight:800;color:var(--ink-2);margin:11px 2px 6px}
        .opts{display:flex;flex-wrap:wrap;gap:8px}
        .opt{min-height:48px;padding:0 15px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
        .opt:active{background:var(--surface-2)}.opt.sel{border-color:var(--red);background:var(--red-bg);color:var(--red)}
        .opt.proc.sel{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-d)}
        .stepq{display:flex;align-items:center;max-width:230px}
        .stepq button{width:52px;height:52px;border:1px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:700;cursor:pointer}
        .stepq button.m{border-radius:12px 0 0 12px}.stepq button.p{border-radius:0 12px 12px 0}
        .stepq button:disabled{opacity:.4;cursor:default}
        .stepq .q{flex:1;height:52px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#FFFDF4;text-align:center;font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;display:grid;place-items:center}
        .stockhint{font-size:12.5px;font-weight:700;color:var(--ink-2);margin:6px 2px 0}
        .stockhint b{color:var(--teal-d)}
        .stockhint.over{color:var(--red)}
        .tin{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;font-weight:600;background:var(--surface-2);color:var(--ink)}
        textarea.tin{resize:vertical;height:44px;min-height:40px;max-height:120px}
        .picklist{display:flex;flex-direction:column;gap:8px;max-height:min(44dvh,40vh);overflow:auto;overscroll-behavior:contain}
        .prow{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
        .prow:active{background:var(--surface-2)}.prow.sel{border-color:var(--red);background:var(--red-bg)}
        .prow.zero{opacity:.5}
        .prow .pid{flex:1;min-width:0}.prow .pnm{font-size:16px;font-weight:800}.prow .pcode{font-size:12.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
        .prow .pstk{font-size:12.5px;font-weight:800;color:var(--teal-d);flex:0 0 auto;text-align:right}
        .prow .pstk small{display:block;color:var(--ink-2);font-weight:700}
        .prow.wo.sel{border-color:var(--teal);background:var(--teal-bg)}
        .prow.wo.sel .pchk{background:var(--teal);border-color:var(--teal)}
        .dwo{font-size:12px;font-weight:800;color:#3a4759;background:#EEF2F8;padding:2px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
        .prow .pchk{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--red);flex:0 0 auto}
        .prow.sel .pchk{background:var(--red);color:#fff;border-color:var(--red)}
        .selbox.pick{display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1.5px solid var(--line)}
        .selbox.pick .car{color:var(--ink-2);font-size:12px}
        .matsearch{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;background:var(--surface-2);margin-bottom:8px}
        .photos{display:flex;gap:8px;flex-wrap:wrap}
        .photo{position:relative}.photo img{width:58px;height:58px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
        .photo .rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:12px;cursor:pointer}
        .addphoto{width:58px;height:58px;border:1.5px dashed #B8C2CC;border-radius:10px;background:var(--surface-2);color:var(--ink-2);font-size:24px;cursor:pointer;display:grid;place-items:center}
        .sheet .ok{width:100%;margin-top:14px;background:var(--red);color:#fff;min-height:54px;border:none;border-radius:14px;font-size:18px;font-weight:800;cursor:pointer}
        .sheet .ok:disabled{background:var(--line);color:var(--ink-2)}
        .imgview{position:absolute;inset:0;height:var(--wash-h,100%);background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:60}
        .imgview.on{display:flex}.imgview img{max-width:92vw;max-height:92vh;border-radius:10px}
        .toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:#15222B;color:#fff;font-weight:700;font-size:15px;padding:12px 20px;border-radius:12px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw}
        .toast.on{opacity:.96}
        /* ── 구분 토글 (작업불량 / 원자재불량) ──
           등록 시트 맨 위. 이 선택이 아래 필드 구성을 통째로 바꾼다. */
        .kindsel{display:flex;gap:8px;margin:2px 0 4px}
        .kindsel .k{flex:1;min-height:52px;border:1.5px solid var(--line);border-radius:12px;
            background:var(--surface-2);color:var(--ink-2);font-size:15.5px;font-weight:800;
            cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
        .kindsel .k small{font-size:11.5px;font-weight:700;opacity:.85}
        .kindsel .k.sel{background:var(--red);border-color:var(--red);color:#fff}
        /* 창고 선택 버튼 — 재고와 안내문구를 같이 보여준다.
           등록하는 사람이 「입고 직후」인지 「불출 후」인지 알아야 하기 때문. */
        .strow{display:flex;align-items:center;gap:10px;min-height:60px;padding:10px 14px;
            border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);
            cursor:pointer;margin-bottom:8px}
        .strow.sel{border-color:var(--red);background:#FFF3F3}
        .strow .sn{font-size:16px;font-weight:800;color:var(--ink)}
        .strow .sh{font-size:12px;font-weight:700;color:var(--ink-2);margin-top:2px}
        .strow .sq{margin-left:auto;text-align:right;font-size:16px;font-weight:800;color:var(--ink)}
        .strow .sq small{display:block;font-size:11px;font-weight:700;color:var(--ink-2)}
        .srcbadge{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:6px;
            background:#EAF1FB;color:#2F6FED;margin-right:6px}
        @media (max-width:560px){ .filt{width:100%;margin-left:0} }

    </style>

    <div class="ms-wash-root">
        <div class="app"><div class="col-stack">
            <div class="topbar">
                <h1>부적합 관리</h1><a title="북마크" class="bookmark toggle">내 메뉴</a><span class="fbadge f2" id="fBadge">2공장 · M-CELL</span>
                <div class="filt">
                    <button class="selbox pick" id="fSrcBtn" type="button"><span id="fSrcLabel">구분 전체</span><span class="car">▾</span></button>
                    <button class="selbox pick" id="fProcBtn" type="button"><span id="fProcLabel">공정 전체</span><span class="car">▾</span></button>
                    <input type="date" class="dinput" id="fFrom"><span style="font-weight:800;color:var(--ink-2)">~</span><input type="date" class="dinput" id="fTo">
                    <button class="addbtn" id="btnAdd">＋ 부적합 등록</button>
                </div>
            </div>
            <div class="bscroll"><div class="wrap">
                <div class="kpis">
                    <div class="kpi"><div class="n" id="kCnt">0</div><div class="l">부적합 건수</div></div>
                    <div class="kpi q"><div class="n" id="kQty">0</div><div class="l">총 불량수량</div></div>
                    <div class="kpi"><div class="n" id="kProc">0</div><div class="l">해당 공정 수</div></div>
                </div>
                <div id="list"></div>
            </div></div>
        </div></div>

        <!-- 등록 시트 -->
        <div class="mask" id="regMask"><div class="sheet"><div class="body">
            <div class="sh"><h3>부적합 등록</h3><button class="x" data-close>✕</button></div>

            <!-- ★ 구분이 먼저다. 아래 필드 구성이 통째로 달라진다.
                 작업불량   : 공정 · 작지 · 작업자 있음. 창고는 공정이 정한다
                 원자재불량 : 공정 없음. 창고를 사람이 고른다 -->
            <div class="fieldlab">구분</div>
            <div class="kindsel" id="regKind">
                <button class="k sel" type="button" data-kind="work">작업불량<small>공정에서 발생</small></button>
                <button class="k" type="button" data-kind="material">원자재불량<small>입고 자재 부적합</small></button>
            </div>

            <div id="workOnly">
                <div class="fieldlab">공정</div>
                <div class="opts" id="regProc"></div>

                <div class="fieldlab">관련 작업지시 <span style="color:var(--ink-2);font-weight:700">(선택 — 알면 고르고, 모르면 비웁니다)</span></div>
                <button class="opt" id="woPick" style="width:100%;justify-content:space-between"><span id="woPickLabel">작업지시 없음</span><span style="color:var(--ink-2)">›</span></button>
            </div>

            <div class="fieldlab">불량 자재 <span style="color:var(--ink-2);font-weight:700" id="matLabHint">(공정에서 다루는 자재)</span></div>
            <button class="opt" id="matPick" style="width:100%;justify-content:space-between"><span id="matPickLabel">자재 선택</span><span style="color:var(--ink-2)">›</span></button>

            <!-- 원자재불량 전용 — 어느 창고에서 뺄지.
                 재고가 자재창고·클린룸·생산창고에 흩어져 있어 서버가 한 곳으로 정할 수 없다.
                 재고가 어디 있는지는 재고가 알고, 어느 자리에서 발견했는지는 사람이 안다. -->
            <div id="matOnly" style="display:none">
                <div class="fieldlab">차감 창고 <span style="color:var(--ink-2);font-weight:700">(재고가 있는 창고)</span></div>
                <div id="regStore"><span style="color:var(--ink-2);font-weight:700">자재를 먼저 선택하세요</span></div>
            </div>

            <div class="fieldlab">불량 유형</div>
            <div class="opts" id="regType"></div>
            <div id="etcWrap" style="display:none">
                <div class="fieldlab">기타 유형 직접 입력</div>
                <input class="tin" id="mEtc" placeholder="유형을 입력하세요">
            </div>

            <div class="fieldlab">불량 수량</div>
            <div class="stepq"><button class="m" id="qMinus">−</button><div class="q" id="qVal">1</div><button class="p" id="qPlus">＋</button></div>
            <div class="stockhint" id="stockHint"></div>

            <div class="fieldlab" id="dateLab">작업자 · 발생일자</div>
            <div style="display:flex;gap:10px;flex-wrap:wrap">
                <button class="opt" id="workerPick" type="button" style="flex:1;min-width:150px;height:56px;justify-content:space-between"><span id="workerPickLabel">작업자 선택</span><span style="color:var(--ink-2)">›</span></button>
                <input type="date" class="dinput" id="mDate" style="flex:1;min-width:150px;height:56px">
            </div>

            <div class="fieldlab">비고</div>
            <textarea class="tin" id="mNote" placeholder="상세 내용(선택)"></textarea>

            <div class="fieldlab">사진 첨부 <span style="color:var(--ink-2);font-weight:700">(선택)</span></div>
            <div class="photos" id="mPhotos"></div>
            <!-- capture 가 붙은 input 은 기기에 따라 카메라로 바로 넘어가 사진첩을 못 고른다.
                 그래서 둘로 나누고 어느 쪽을 열지 시트에서 고르게 한다. -->
            <input type="file" id="mFileCam" accept="image/*" capture="environment" style="display:none">
            <input type="file" id="mFileLib" accept="image/*" style="display:none" multiple>

            <button class="ok" id="btnSave">부적합 저장</button>
        </div></div></div>

        <!-- 상세 -->
        <div class="mask" id="detMask"><div class="sheet"><div class="body">
            <div class="sh"><h3>부적합 상세</h3><button class="x" data-close>✕</button></div>
            <div id="detBody"></div>
        </div></div></div>

        <!-- 사진 추가 방식 선택 -->
        <div class="mask" id="photoMask"><div class="sheet"><div class="body">
            <div class="sh"><h3>사진 추가</h3><button class="x" data-close>✕</button></div>
            <div style="display:flex;flex-direction:column;gap:10px;padding-bottom:6px">
                <button class="opt" id="btnCam" type="button" style="width:100%;min-height:60px;font-size:17px;justify-content:flex-start;gap:14px"><span style="font-size:22px">📷</span> 카메라로 촬영</button>
                <button class="opt" id="btnLib" type="button" style="width:100%;min-height:60px;font-size:17px;justify-content:flex-start;gap:14px"><span style="font-size:22px">🖼️</span> 사진첩에서 선택</button>
            </div>
        </div></div></div>

        <!-- 구분 필터 시트 -->
        <div class="mask" id="fSrcMask"><div class="sheet"><div class="body">
            <div class="sh"><h3>구분 선택</h3><button class="x" data-close>✕</button></div>
            <div class="picklist" id="fSrcList"></div>
        </div></div></div>

        <!-- 공정 필터 시트 -->
        <div class="mask" id="fProcMask"><div class="sheet"><div class="body">
            <div class="sh"><h3>공정 선택</h3><button class="x" data-close>✕</button></div>
            <div class="picklist" id="fProcList"></div>
        </div></div></div>

        <!-- 작업자 선택 시트 -->
        <div class="mask" id="workerMask"><div class="sheet"><div class="body">
            <div class="sh"><h3>작업자 선택</h3><button class="x" data-close>✕</button></div>
            <input class="matsearch" id="workerSearch" placeholder="이름 검색">
            <div class="picklist" id="workerList"></div>
        </div></div></div>

        <!-- 작업지시 선택 시트 -->
        <div class="mask" id="woMask"><div class="sheet"><div class="body">
            <div class="sh"><h3 id="woTitle">작업지시 선택</h3><button class="x" data-close>✕</button></div>
            <div class="picklist" id="woList"></div>
        </div></div></div>

        <!-- 자재 선택 시트 -->
        <div class="mask" id="matMask"><div class="sheet"><div class="body">
            <div class="sh"><h3 id="matTitle">자재 선택</h3><button class="x" data-close>✕</button></div>
            <input class="matsearch" id="matSearch" placeholder="자재명·코드 검색">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                <button class="opt" id="matAllBtn" type="button" style="min-height:42px;font-size:14px">전체 자재 보기</button>
                <span id="matScopeNote" style="font-size:12.5px;font-weight:700;color:var(--ink-2)"></span>
            </div>
            <div class="picklist" id="matList"></div>
        </div></div></div>

        <div class="imgview" id="imgView"><img id="imgViewImg" src="" alt=""></div>
        <div class="toast" id="toast"></div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script th:inline="none">
        (function () {
            // ============================================================
            // 높이 맞춤 (세척·조립 화면과 동일)
            // ============================================================
            const root = document.querySelector('.ms-wash-root'); if (!root) return;
            function localBelow(){ let b=0,n=root; while(n&&n!==document.body){ let s=n.nextElementSibling; while(s){ const r=s.getBoundingClientRect(); if(r.height>0&&getComputedStyle(s).position!=='fixed')b+=r.height; s=s.nextElementSibling; } n=n.parentElement; } return b; }
            // 부모 문서 바닥에 붙은 푸터(fixed/sticky/absolute) — 이게 빠지면 --wash-h 가
            // 실제 보이는 영역보다 커져서, root 바닥에 붙는 시트 하단이 잘린다.
            // (세척 화면에서 같은 증상을 잡은 최종판. 높이 ≤160px 만 푸터로 인정)
            function parentFixedBottom(pWin,pDoc,fe,feTop){ let fx=0; try{ pDoc.querySelectorAll('body *').forEach(function(el){ if(el===fe||el.contains(fe))return; const cs=pWin.getComputedStyle(el); if(cs.position!=='fixed'&&cs.position!=='sticky'&&cs.position!=='absolute')return; const r=el.getBoundingClientRect(); if(r.height>0&&r.height<=160&&r.top>feTop&&r.bottom>pWin.innerHeight-40) fx=Math.max(fx,r.bottom-r.top); }); }catch(e){} return fx; }
            function availBottom(){ let bottom=window.innerHeight; try{ const fe=window.frameElement; if(fe){ const pWin=window.parent,pDoc=pWin.document; const feTop=fe.getBoundingClientRect().top; let flow=0,node=fe; while(node&&node!==pDoc.body){ let sib=node.nextElementSibling; while(sib){ const cs=pWin.getComputedStyle(sib),r=sib.getBoundingClientRect(); if(r.height>0&&cs.position!=='fixed'&&cs.position!=='absolute')flow+=r.height; sib=sib.nextElementSibling; } node=node.parentElement; } const below=Math.max(flow, parentFixedBottom(pWin,pDoc,fe,feTop)); bottom=Math.min(bottom,(pWin.innerHeight-below)-feTop); } }catch(e){} return bottom; }
            function fit(){ const top=root.getBoundingClientRect().top; const avail=availBottom()-top-localBelow(); root.style.setProperty('--wash-h',Math.max(320,Math.floor(avail))+'px'); }
            window.__defectFit = fit;   // 시트 열 때 재계산용
            window.addEventListener('resize',fit); window.addEventListener('orientationchange',fit);
            window.addEventListener('scroll',fit,true);
            try{ window.parent.addEventListener('resize',fit); window.parent.addEventListener('scroll',fit,true); }catch(e){}
            if(window.ResizeObserver){ try{ new ResizeObserver(fit).observe(document.body); }catch(e){} try{ new ResizeObserver(fit).observe(window.parent.document.body); }catch(e){} }
            fit(); requestAnimationFrame(fit);
            [100,200,400,700,1200].forEach(function(t){ setTimeout(fit,t); });
            if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
        })();

        (function () {
            // ============================================================
            // 컨텍스트
            //   공장은 URL ?factory=1|2 또는 window.DEFECT_CTX.factory_id
            // ============================================================
            // ============================================================
            // 이 파일은 2공장 · M-CELL 전용이다. 공장은 URL 로 바꿀 수 없다.
            //   → 다른 공장은 prod_defect_f1_t.html 을 쓴다
            // ============================================================
            const CTX = Object.assign(
                { factory_id: 2, spjangcd: 'ZZ' },
                (window.DEFECT_CTX || {})
            );
            const API = '/api/production/defect';

            let PROCS = [];            // [{id, code, name, types:[{defect_type_id,defect_type_name}]}]
            let WORKERS = [];
            let DEFECTS = [];

            // ---------- 공용 ----------
            function toast(msg){
                const t=document.getElementById('toast');
                t.textContent=msg; t.classList.add('on');
                clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'), 2600);
            }
            // ★ AjaxUtil 은 window 프로퍼티가 아니다 (const 선언 → 전역 렉시컬 환경에만 올라간다)
            //   typeof 로 확인한다. window.AjaxUtil 은 영원히 undefined.
            // ★ 특정 메서드명을 조건에 걸지 않는다 — 이름이 다르면 로드돼 있는데도
            //   "미로드" 로 오판하고 대기 루프가 5초 뒤 죽는다. (실제로 그 사고가 났다)
            function ajaxReady(){ return typeof AjaxUtil !== 'undefined'; }

            function ajaxKeys(){
                try { return Object.keys(AjaxUtil).join(', '); } catch(e){ return '(확인 불가)'; }
            }
            function ajaxMissing(cb){
                console.error('[defect] AjaxUtil 에서 호출 메서드를 찾지 못했습니다. 사용 가능:', ajaxKeys());
                toast('통신 모듈을 찾을 수 없습니다. (콘솔 확인)');
                cb(null);
            }

            function get(url, params, cb){
                const q = new URLSearchParams(params||{}).toString();
                const u = url + (q ? '?'+q : '');
                try {
                    if (typeof AjaxUtil.getAsyncData === 'function') { AjaxUtil.getAsyncData(u, {}, cb); return; }
                    if (typeof AjaxUtil.getSyncData  === 'function') { cb(AjaxUtil.getSyncData(u, {})); return; }
                    if (typeof AjaxUtil.getData      === 'function') { AjaxUtil.getData(u, {}, cb); return; }
                } catch(e) {
                    console.error('[defect] GET 실패', u, e);
                    toast('조회 중 오류가 발생했습니다.'); cb(null); return;
                }
                ajaxMissing(cb);
            }

            function post(url, body, cb){
                try {
                    if (typeof AjaxUtil.postAsyncData === 'function') { AjaxUtil.postAsyncData(url, body, cb); return; }
                    if (typeof AjaxUtil.postSyncData  === 'function') { cb(AjaxUtil.postSyncData(url, body)); return; }
                    if (typeof AjaxUtil.sendPostData  === 'function') { AjaxUtil.sendPostData(url, body, cb); return; }
                } catch(e) {
                    console.error('[defect] POST 실패', url, e);
                    toast('저장 중 오류가 발생했습니다.'); cb(null); return;
                }
                ajaxMissing(cb);
            }
            function procName(id){ const p=PROCS.find(x=>x.id===id); return p?p.name:('공정#'+id); }
            function fmtNum(n){ n=Number(n)||0; return (n%1===0)? String(n) : String(Math.round(n*100)/100); }

            // ============================================================
            // 부팅
            // ============================================================
            let boot = 0;
            (function waitBoot(){
                if (ajaxReady()) { init(); return; }
                if (++boot > 50) {
                    // 조용히 죽지 않게 — 화면에 이유를 남긴다
                    console.error('[defect] AjaxUtil 미로드. typeof AjaxUtil =', typeof AjaxUtil);
                    document.getElementById('list').innerHTML =
                        '<div class="empty">화면 초기화에 실패했습니다.<br>'
                        + '공용 스크립트(AjaxUtil)가 로드되지 않았습니다.<br>'
                        + '<span style="font-size:12.5px">레이아웃 없이 이 화면만 단독으로 열면 발생합니다.</span></div>';
                    return;
                }
                setTimeout(waitBoot, 100);
            })();

            function init(){
                const badge = document.getElementById('fBadge');
                badge.textContent = '2공장 · M-CELL';
                badge.classList.add('f2');

                const t=new Date(), f=new Date(); f.setDate(f.getDate()-14);
                const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
                document.getElementById('fFrom').value=fmt(f);
                document.getElementById('fTo').value=fmt(t);

                loadContext(function(){ loadWorkers(); loadList(); });
                bind();
            }

            function loadContext(done){
                get(API+'/context', {factory_id:CTX.factory_id}, function(res){
                    if(!res || res.success===false){ toast(res&&res.message||'공정 조회 실패'); return; }
                    const d = res.data || {};
                    const types = d.defect_types || [];
                    PROCS = (d.processes||[]).map(function(p){
                        return { id:p.id, code:p.code, name:p.name,
                            types: types.filter(t=>t.process_id===p.id) };
                    });
                    // 원자재 유형은 공정 매핑이 없다. Coverage 로만 걸러 서버가 통째로 내린다.
                    MAT_TYPES = d.mat_defect_types || [];
                    if (done) done();
                });
            }

            function loadWorkers(){
                get('/api/common/combo', {combo_type:'person'}, function(res){
                    const rows = (res && res.data) || [];
                    WORKERS = rows.map(r=>({ id:r.id!==undefined?r.id:r.value, name:r.name!==undefined?r.name:r.text }));
                });
            }

            // ============================================================
            // 목록
            // ============================================================
            function loadList(){
                get(API+'/list', {
                    factory_id: CTX.factory_id,
                    date_from : document.getElementById('fFrom').value,
                    date_to   : document.getElementById('fTo').value,
                    process_id: fProcVal || '',
                    defect_source: fSrcVal || ''
                }, function(res){
                    if(!res || res.success===false){ toast(res&&res.message||'조회 실패'); return; }
                    DEFECTS = res.data || [];
                    render();
                });
            }

            function render(){
                document.getElementById('kCnt').textContent = DEFECTS.length;
                document.getElementById('kQty').textContent =
                    fmtNum(DEFECTS.reduce((a,x)=>a+(Number(x.defect_qty)||0),0));
                // 원자재불량은 공정이 없다 — 공정 수에 넣으면 undefined 가 1개로 세어진다
                const ps={}; DEFECTS.forEach(function(x){ if(x.process_id) ps[x.process_id]=1; });
                document.getElementById('kProc').textContent = Object.keys(ps).length;

                const el=document.getElementById('list');
                if(!DEFECTS.length){ el.innerHTML='<div class="empty">조회된 부적합이 없습니다.</div>'; return; }

                el.innerHTML = DEFECTS.map(function(x){
                    const thumb = (x.file_cnt>0)
                        ? '<img class="dthumb" src="'+API+'/photo?defect_id='+x.id+'&idx=1">'
                        : '';
                    // 원자재불량은 공정이 없다. 그 자리에 구분 배지를 넣어
                    // 목록에서 두 종류가 한눈에 갈리게 한다.
                    const isMat = (x.defect_source === 'material');
                    const stageNm = x.discovery_stage==='incoming' ? '입고 시'
                        : x.discovery_stage==='issued'   ? '불출 후' : '';
                    const procCell = isMat
                        ? '<span class="srcbadge">원자재'+(stageNm?' · '+stageNm:'')+'</span>'
                        : '<span class="proc">'+(x.process_name||'')+'</span>';
                    return '<div class="drow" data-row="'+x.id+'"><div class="dl">'
                        + '<div class="r1">'+procCell
                        +   '<span class="dtype">'+(x.defect_type_name||'')+'</span>'
                        +   '<span class="dmeta">'+(x.defect_date||'')+(x.actor_name?' · '+x.actor_name:'')+'</span>'
                        +   (x.order_num?'<span class="dwo">'+x.order_num+'</span>':'')+'</div>'
                        + '<div><span class="ditem">'+(x.mat_name||'')+'</span> <span class="dcode">'+(x.mat_code||'')+'</span></div>'
                        + (x.lot_numbers?'<div><span class="dlot">차감 로트 '+x.lot_numbers+'</span>'
                            + (x.src_store_name?' <span class="dmeta">· '+x.src_store_name+'</span>':'')+'</div>':'')
                        + (x.description?'<div class="dmeta">'+x.description+'</div>':'')
                        + '</div>'
                        + '<div class="dqty">'+fmtNum(x.defect_qty)+'<small> '+(x.unit||'개')+'</small></div>'
                        + thumb
                        + '<button class="ddel" data-del="'+x.id+'">✕</button></div>';
                }).join('');
            }

            // ============================================================
            // 등록
            // ============================================================
            let regProc=null, regMat=null, regType=null, regEtc=false, regQty=1, regPhotos=[], MATS=[];
            let regWo=null, WOS=[];
            let regWorker=null, fProcVal='';
            let matAll=false;
            // ★ 구분. 'work' | 'material'. 화면 구성과 API 파라미터를 동시에 가른다.
            let regKind='work', MAT_TYPES=[], STORES=[], regStore=null, fSrcVal='';
            let detPhotoTarget=false, detWorkerPick=false;

            /**
             * 구분 전환.
             * 필드를 숨기는 것으로 끝내지 않고 **선택값을 비운다** —
             * 작업불량으로 공정·자재를 고르다 원자재로 바꿨을 때
             * 이전 공정의 자재가 그대로 남아 있으면 엉뚱한 창고가 차감된다.
             */
            function setKind(k){
                regKind = k;
                regProc=null; regMat=null; regType=null; regEtc=false; MATS=[];
                regWo=null; WOS=[]; regStore=null; STORES=[];
                if (k==='material') regWorker=null;   // 원자재불량은 작업자를 받지 않는다
                setQty(1);
                document.querySelectorAll('#regKind .k').forEach(function(b){
                    b.classList.toggle('sel', b.dataset.kind===k);
                });
                const isMat = (k==='material');
                document.getElementById('workOnly').style.display = isMat ? 'none' : '';
                document.getElementById('matOnly').style.display  = isMat ? '' : 'none';
                document.getElementById('workerPick').style.display = isMat ? 'none' : '';
                document.getElementById('dateLab').textContent = isMat ? '발생일자' : '작업자 · 발생일자';
                document.getElementById('matLabHint').textContent =
                    isMat ? '(재고가 있는 자재)' : '(공정에서 다루는 자재)';
                renderRegProc(); renderRegType(); updateWoLabel();
                updateWorkerLabel(); updateMatLabel(); renderStores();
            }

            /** 창고 선택 목록. 1건이면 자동 선택 — 대부분의 자재가 한 창고에만 있다 */
            function renderStores(){
                const el = document.getElementById('regStore');
                if (regKind!=='material') { el.innerHTML=''; return; }
                if (!regMat) {
                    el.innerHTML='<span style="color:var(--ink-2);font-weight:700">자재를 먼저 선택하세요</span>';
                    return;
                }
                if (!STORES.length) {
                    el.innerHTML='<span style="color:var(--ink-2);font-weight:700">'
                        + '이 자재는 재고가 있는 창고가 없습니다. 차감할 수 없습니다.</span>';
                    return;
                }
                el.innerHTML = STORES.map(function(s){
                    const sel = regStore && String(regStore.store_id)===String(s.store_id);
                    return '<div class="strow'+(sel?' sel':'')+'" data-st="'+s.store_id+'">'
                        + '<div><div class="sn">'+s.store_name+'</div>'
                        +   '<div class="sh">'+(s.hint||'')+'</div></div>'
                        + '<div class="sq">'+fmtNum(s.stock_qty)+'<small>로트 '+(s.lot_cnt||0)+'</small></div>'
                        + '</div>';
                }).join('');
            }

            function loadStores(){
                if (regKind!=='material' || !regMat) { STORES=[]; regStore=null; renderStores(); return; }
                get(API+'/store_list', {mat_id:regMat.mat_id}, function(res){
                    STORES = (res && res.data) || [];
                    // 창고가 하나뿐이면 고를 것이 없다. 자동 선택하고 안내만 남긴다.
                    regStore = (STORES.length===1) ? STORES[0] : null;
                    renderStores(); renderStockHint();
                });
            }

            function renderRegProc(){
                document.getElementById('regProc').innerHTML = PROCS.map(p=>
                    '<button class="opt proc'+(regProc===p.id?' sel':'')+'" data-rp="'+p.id+'">'+p.name+'</button>'
                ).join('') || '<span style="color:var(--ink-2);font-weight:700">등록된 공정이 없습니다.</span>';
            }
            function renderRegType(){
                // 원자재불량은 공정이 없으니 공정별 유형을 쓸 수 없다.
                // 서버가 Coverage='material'|'all' 로 걸러 내려준 목록을 쓴다.
                if (regKind==='material'){
                    document.getElementById('regType').innerHTML = MAT_TYPES.length
                        ? MAT_TYPES.map(t=>'<button class="opt'+(regType===t.defect_type_id?' sel':'')
                            +'" data-rt="'+t.defect_type_id+'" data-nm="'+t.defect_type_name+'">'+t.defect_type_name+'</button>').join('')
                        : '<span style="color:var(--ink-2);font-weight:700">등록된 원자재 부적합 유형이 없습니다.</span>';
                    document.getElementById('etcWrap').style.display = regEtc ? '' : 'none';
                    return;
                }
                const p=PROCS.find(x=>x.id===regProc);
                document.getElementById('regType').innerHTML = p
                    ? (p.types.length
                        ? p.types.map(t=>'<button class="opt'+(regType===t.defect_type_id?' sel':'')
                            +'" data-rt="'+t.defect_type_id+'" data-nm="'+t.defect_type_name+'">'+t.defect_type_name+'</button>').join('')
                        : '<span style="color:var(--ink-2);font-weight:700">이 공정에 등록된 부적합 유형이 없습니다.</span>')
                    : '<span style="color:var(--ink-2);font-weight:700">공정을 먼저 선택하세요</span>';
                document.getElementById('etcWrap').style.display = regEtc ? '' : 'none';
            }
            // ---------- 구분 필터 피커 ----------
            function renderSrcFilter(){
                const opts=[ {v:'',  nm:'구분 전체', d:'작업불량 · 원자재불량 모두'},
                    {v:'work',     nm:'작업불량',   d:'공정에서 발생한 부적합'},
                    {v:'material', nm:'원자재불량', d:'입고 자재의 부적합'} ];
                document.getElementById('fSrcList').innerHTML = opts.map(function(o){
                    const sel=(fSrcVal===o.v);
                    return '<div class="prow'+(sel?' sel':'')+'" data-fs="'+o.v+'">'
                        + '<div class="pid"><div class="pnm">'+o.nm+'</div>'
                        +   '<div class="pcode">'+o.d+'</div></div>'
                        + '<div class="pchk">'+(sel?'✓':'＋')+'</div></div>';
                }).join('');
            }

            // ---------- 공정 필터 피커 (태블릿: select 대신 큰 행) ----------
            function renderProcFilter(){
                const el=document.getElementById('fProcList');
                let html='<div class="prow'+(fProcVal===''?' sel':'')+'" data-fp=""><div class="pid"><div class="pnm">공정 전체</div></div><div class="pchk">'+(fProcVal===''?'✓':'＋')+'</div></div>';
                html+=PROCS.map(function(p){
                    const sel=String(fProcVal)===String(p.id);
                    return '<div class="prow'+(sel?' sel':'')+'" data-fp="'+p.id+'"><div class="pid"><div class="pnm">'+p.name+'</div></div><div class="pchk">'+(sel?'✓':'＋')+'</div></div>';
                }).join('');
                el.innerHTML=html;
            }

            // ---------- 작업자 피커 ----------
            function updateWorkerLabel(){
                document.getElementById('workerPickLabel').textContent =
                    regWorker ? regWorker.name : '작업자 선택';
            }
            function renderWorkerList(kw){
                const el=document.getElementById('workerList');
                const q=(kw||'').trim().toLowerCase();
                const list=WORKERS.filter(w=>!q||String(w.name).toLowerCase().includes(q));
                let html='<div class="prow'+(regWorker?'':' sel')+'" data-wk="none"><div class="pid"><div class="pnm">작업자 없음</div><div class="pcode">작업자를 지정하지 않고 등록합니다</div></div><div class="pchk">'+(regWorker?'＋':'✓')+'</div></div>';
                html+=list.length?list.map(function(w){
                    const sel=regWorker&&String(regWorker.id)===String(w.id);
                    return '<div class="prow'+(sel?' sel':'')+'" data-wk="'+w.id+'"><div class="pid"><div class="pnm">'+w.name+'</div></div><div class="pchk">'+(sel?'✓':'＋')+'</div></div>';
                }).join(''):'<div style="color:var(--ink-2);font-weight:700;padding:16px 2px">검색 결과가 없습니다.</div>';
                el.innerHTML=html;
            }

            // 긴 변 1280px · JPEG 0.7 로 줄여 보낸다 (불량 판독에는 충분).

            function shrinkImage(file, cb){

                const MAX = 1280;

                const reader = new FileReader();

                reader.onload = function(){

                    const img = new Image();

                    img.onload = function(){

                        let w = img.width, h = img.height;

                        if (w > MAX || h > MAX) {

                            if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }

                            else        { w = Math.round(w * MAX / h); h = MAX; }

                        }

                        const cv = document.createElement('canvas');

                        cv.width = w; cv.height = h;

                        cv.getContext('2d').drawImage(img, 0, 0, w, h);

                        try { cb(cv.toDataURL('image/jpeg', 0.7)); }

                        catch(err){ cb(reader.result); }

                    };

                    img.onerror = function(){ cb(reader.result); };

                    img.src = reader.result;

                };

                reader.readAsDataURL(file);

            }

            function save(){
                const isMat = (regKind==='material');
                if(!isMat && !regProc){ toast('공정을 선택하세요'); return; }
                if(!regMat){ toast('불량 자재를 선택하세요'); return; }
                if(isMat && !regStore){ toast('차감할 창고를 선택하세요'); return; }

                if(regEtc){
                    etc=document.getElementById('mEtc').value.trim();

                // 상한은 원자재불량이면 고른 창고 재고, 작업불량이면 소스창고 재고다.
                // 서버도 같은 검사를 한다 — 화면 값만 믿지 않는다.
                const stk = isMat ? (Number(regStore.stock_qty)||0) : (Number(regMat.stock_qty)||0);

                    html+='<div id="edEtcWrap" style="display:'+(edEtc?'':'none')+'">'

                        + '<div class="fieldlab">기타 유형 직접 입력</div>'

                        + '<input class="tin" id="edEtcVal" value="'+(h.defect_type_etc||'')+'" placeholder="유형을 입력하세요"></div>';

                    html+='<div class="fieldlab">발생일자</div>'

                        + '<input type="date" class="dinput" id="edDate" style="width:100%;height:52px" value="'+(h.defect_date||'')+'">';

                    // 발견 시점은 원자재불량에서만 의미가 있다.
                    // 창고 위치로 기본값을 제안했을 뿐이라 사람이 고칠 수 있어야 한다.
                    if(isMatD){

                        const st=h.discovery_stage||'';

                        html+='<div class="fieldlab">발견 시점</div><div class="opts" id="edStage">'

                            + '<button class="opt'+(st==='incoming'?' sel':'')+'" data-st="incoming">입고 시 확인</button>'

                            + '<button class="opt'+(st==='issued'?' sel':'')+'" data-st="issued">불출 후 확인</button>'

                            + '</div>';

                    } else {

                        html+='<div class="fieldlab">작업자</div>'

                            + '<button class="opt" id="edWorker" type="button" style="width:100%;justify-content:space-between">'

                            + '<span id="edWorkerLabel">'+(edWorker?edWorker.name:'작업자 없음')+'</span><span style="color:var(--ink-2)">›</span></button>';

                    }

                    html+='<div class="fieldlab">비고</div>'

                        + '<textarea class="tin" id="edNote" placeholder="상세 내용(선택)">'+(h.description||'')+'</textarea>';

                } else {

                    const isMatV = (h.defect_source === 'material');

                    const stageV = h.discovery_stage==='incoming' ? '입고 시 확인'

                        : h.discovery_stage==='issued'   ? '불출 후 확인' : '-';

                    html+='<div class="dsum">'

                        + '<div><span>구분</span>'+(isMatV?'원자재불량':'작업불량')+'</div>'

                        + (isMatV

                            ? '<div><span>발견</span>'+stageV+'</div>'

                            : '<div><span>공정</span>'+(h.process_name||'-')+'</div>')

                        + '<div><span>유형</span>'+(h.defect_type_name||'-')+'</div>'

                        + '<div><span>수량</span>'+fmtNum(h.defect_qty)+' '+(h.unit||'')+'</div>'

                        + '<div><span>발생일</span>'+(h.defect_date||'-')+'</div>'

                        + (isMatV ? '' : '<div><span>작업자</span>'+(h.actor_name||'-')+'</div>')

                        + (isMatV ? '' : '<div><span>작업지시</span>'+(h.order_num||'미지정')+'</div>')

                        + '<div><span>등록</span>'+(h.created_at||'-')+'</div></div>';

                    html+='<div class="fieldlab">'+(h.mat_name||'')+' <span style="color:var(--ink-2)">'+(h.mat_code||'')+'</span></div>';

                    html+='<div class="fieldlab">차감 로트 <span style="color:var(--ink-2);font-weight:700">'

                        +(h.src_store_name||'')+' · 선입선출</span></div>';

                    html+= lots.length ? lots.map(function(l){

                        return '<div class="lotrow"><div class="ln">'

                            + '<div class="lnum">'+(l.lot_number||'-')+'</div>'

                            + '<div class="lsub">'+(l.maker_lot_no?'외부 '+l.maker_lot_no+' · ':'')

                            +   '입고 '+(l.input_date||'-')+'</div></div>'

                            + '<div class="lq">'+fmtNum(l.qty)+'</div></div>';

                    }).join('') : '<div style="color:var(--ink-2);font-weight:700;padding:8px 2px">차감 내역이 없습니다.</div>';

                    if(h.description){

                        html+='<div class="fieldlab">비고</div><div style="font-size:15px;font-weight:600">'+h.description+'</div>';

                    }

                }

                // 사진 — 보기/수정 모두 표시. 수정 중에는 삭제 버튼과 추가 버튼이 붙는다.

                const total = detFiles.length + detNewPhotos.length;

                html+='<div class="fieldlab">사진 '+(total?'('+total+')':'')+'</div><div class="pgrid">';

                html+= detFiles.map(function(fl,ix){

                    return '<div class="photo"><img src="'+API+'/photo?defect_id='+detId+'&idx='+(ix+1)+'&t='+Date.now()+'" data-pf="'+(ix+1)+'" style="width:92px;height:92px">'

                        + (detEdit?'<button class="rm" data-pdel="'+fl.file_id+'">×</button>':'')+'</div>';

                }).join('');

                html+= detNewPhotos.map(function(src,ix){

                    return '<div class="photo"><img src="'+src+'" style="width:92px;height:92px">'

                        + '<button class="rm" data-pnew="'+ix+'">×</button></div>';

                }).join('');

                if(detEdit) html+='<div class="addphoto" id="detAddPhoto" style="width:92px;height:92px">＋</div>';

                html+='</div>';

                if(!total && !detEdit) html+='<div style="color:var(--ink-2);font-weight:700;padding:4px 2px">첨부된 사진이 없습니다.</div>';


                html+='<div style="display:flex;gap:10px;margin-top:16px">';

                if(detEdit){

                    html+='<button class="opt" id="detCancel" style="flex:0 0 34%;justify-content:center;min-height:54px">취소</button>'

                        + '<button class="ok" id="detSave" style="flex:1;margin-top:0">저장</button>';

                } else {

                    html+='<button class="ok" id="detEditBtn" style="margin-top:0;background:var(--teal)">수정</button>';

                }

                html+='</div>';

                body.innerHTML=html;

                bindDetail();

            }


            let edType=null, edEtc=false, edWorker=null, edStage=null;


            function bindDetail(){

                const body=document.getElementById('detBody');

                const eb=document.getElementById('detEditBtn');

                if(eb) eb.onclick=function(){

                    detEdit=true;

                    edType=detHead.defect_type_id||null;

                    edEtc=!detHead.defect_type_id && !!detHead.defect_type_etc;

                    edWorker=detHead.actor_id?{id:detHead.actor_id,name:detHead.actor_name}:null;

                    edStage=detHead.discovery_stage||null;

                    detNewPhotos=[];

                    loadDetail();

                };

                const cb=document.getElementById('detCancel');

                if(cb) cb.onclick=function(){ detEdit=false; detNewPhotos=[]; loadDetail(); };


                const et=document.getElementById('edType');

                if(et) et.onclick=function(e){

                    const b=e.target.closest('[data-et]'); if(!b)return;

                    edType=+b.dataset.et; edEtc=(b.dataset.nm==='기타');

                    et.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel', +x.dataset.et===edType));

                    document.getElementById('edEtcWrap').style.display = edEtc?'':'none';

                };

                const es=document.getElementById('edStage');

                if(es) es.onclick=function(e){

                    const b=e.target.closest('[data-st]'); if(!b)return;

                    edStage=b.dataset.st;

                    es.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel', x.dataset.st===edStage));

                };


                const ew=document.getElementById('edWorker');

                if(ew) ew.onclick=function(){

                    detWorkerPick=true;

                    document.getElementById('workerSearch').value='';

                    renderWorkerList(''); showMask('workerMask');

                };

                const ap=document.getElementById('detAddPhoto');

                if(ap) ap.onclick=function(){ detPhotoTarget=true; showMask('photoMask'); };


                body.onclick=function(ev){

                    const dn=ev.target.closest('[data-pnew]');

                    if(dn){ detNewPhotos.splice(+dn.dataset.pnew,1); loadDetail(); return; }

                    const dd=ev.target.closest('[data-pdel]');

                    if(dd){

                        uiConfirm('이 사진을 삭제할까요?', function(){

                            post(API+'/photo_delete', {file_id:+dd.dataset.pdel}, function(res){

                                if(!res || res.success===false){ toast(res&&res.message||'삭제 실패'); return; }

                                toast('사진을 삭제했습니다.'); loadDetail();

                            });

                        });

                        return;

                    }

                    const im=ev.target.closest('[data-pf]');

                    if(im && !detEdit) imgView(im.getAttribute('src'));

                };


                const sv=document.getElementById('detSave');

                if(sv) sv.onclick=saveDetail;

            }


            function saveDetail(){

                let etc=null;

                if(edEtc){

                    etc=(document.getElementById('edEtcVal').value||'').trim();

                    if(!etc){ toast('기타 유형을 입력하세요'); return; }

                }

                if(!edType){ toast('불량 유형을 선택하세요'); return; }

                const sv=document.getElementById('detSave');

                sv.disabled=true; sv.textContent='저장 중…';

                post(API+'/update', {

                    defect_id      : detId,

                    defect_type_id : edEtc ? null : edType,

                    defect_type_etc: etc,

                    defect_date    : document.getElementById('edDate').value,

                    job_res_id     : detHead.job_res_id || null,

                    actor_id       : edWorker ? edWorker.id : null,

                    // 원자재불량 건에만 값이 실린다. 작업불량이면 null 이라 서버가 기존값을 유지한다.
                    discovery_stage: (detHead.defect_source==='material') ? (edStage||null) : null,

                    description    : (document.getElementById('edNote').value||'').trim() || null

                }, function(res){

                    if(!res || res.success===false){

                        sv.disabled=false; sv.textContent='저장';

                        toast(res&&res.message||'저장 실패'); return;

                    }

                    uploadPhotos(detId, detNewPhotos, function(){

                        detEdit=false; detNewPhotos=[];

                        toast('수정되었습니다.');

                        loadDetail(); loadList();

                    }, function(done,total){ sv.textContent='사진 저장 중… ('+done+'/'+total+')'; });

                });

            }

            // 사진을 한 장씩 순차 업로드한다. 동시에 보내면 서버 부하와 순서 뒤섞임이 생긴다.

            function uploadPhotos(defectId, list, onDone, onProgress){

                if(!defectId || !list || !list.length){ onDone && onDone(); return; }

                let i = 0, failed = 0;

                (function next(){

                    if(i >= list.length){

                        if(failed) toast('사진 '+failed+'장 저장에 실패했습니다.');

                        onDone && onDone(); return;

                    }

                    onProgress && onProgress(i+1, list.length);

                    post(API+'/photo_add', {defect_id:defectId, photo:list[i]}, function(res){

                        if(!res || res.success===false) failed++;

                        i++; next();

                    });

                })();

            }


            function askDelete(id){
                const x=DEFECTS.find(d=>d.id===id);
                const msg = x
                    ? '이 부적합을 삭제하면 차감한 재고가 되돌아갑니다.\n('+x.mat_name+' '+fmtNum(x.defect_qty)+')\n삭제할까요?'
                    : '이 부적합 기록을 삭제할까요?';
                uiConfirm(msg, function(){
                    post(API+'/delete', {defect_id:id}, function(res){
                        if(!res || res.success===false){ toast(res&&res.message||'삭제 실패'); return; }
                        toast('삭제되고 재고가 복구되었습니다.');
                        loadList();
                    });
                });
            }

            // uiConfirm 은 레이아웃 전역이 아니다 — 화면이 자기 것을 갖는다.

            // 브라우저 confirm 은 PC 디자인이라 태블릿 화면 톤과 안 맞는다(융착 화면과 동일 방식).

            function uiConfirm(msg, onOk, okLabel){

                let m = document.getElementById('confirmMask');

                if (!m) {

                    m = document.createElement('div');

                    m.id = 'confirmMask';

                    m.style.cssText = 'position:fixed;inset:0;background:rgba(21,34,43,.45);display:none;'

                        + 'align-items:center;justify-content:center;z-index:80;padding:24px';

                    m.innerHTML = '<div style="background:#FFF;border-radius:20px;max-width:420px;width:100%;'

                        + 'padding:24px 22px 18px;box-shadow:0 20px 50px -12px rgba(0,0,0,.4)">'

                        + '<div id="confirmMsg" style="font-size:17px;font-weight:800;color:#15222B;'

                        +   'line-height:1.5;margin-bottom:20px;white-space:pre-line"></div>'

                        + '<div style="display:flex;gap:10px">'

                        + '<button id="confirmCancel" style="flex:1;height:52px;border-radius:14px;'

                        +   'border:1px solid #D8E0E5;background:#F4F7F9;color:#5A6B76;font-weight:800;font-size:16px">취소</button>'

                        + '<button id="confirmOk" style="flex:1;height:52px;border-radius:14px;border:none;'

                        +   'background:#C8483B;color:#fff;font-weight:800;font-size:16px">삭제</button>'

                        + '</div></div>';

                    document.body.appendChild(m);

                    m.addEventListener('click', function(e){ if (e.target === m) m.style.display='none'; });

                }

                m.querySelector('#confirmMsg').textContent = msg;

                const ok = m.querySelector('#confirmOk'), cancel = m.querySelector('#confirmCancel');

                ok.textContent = okLabel || '삭제';   // 재사용 모달이라 라벨을 매번 리셋한다

                const close = function(){ m.style.display='none'; ok.onclick=null; cancel.onclick=null; };

                ok.onclick = function(){ close(); onOk && onOk(); };

                cancel.onclick = close;

                m.style.display = 'flex';

            }

            function showMask(id){ if(window.__defectFit)window.__defectFit(); document.getElementById(id).classList.add('show'); }
            function hideMask(id){ document.getElementById(id).classList.remove('show'); }
            function imgView(src){
                document.getElementById('imgViewImg').src=src;
                document.getElementById('imgView').classList.add('on');
            }
        })();
    </script>
</th:block>
</html>
