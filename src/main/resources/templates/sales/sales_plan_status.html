<html layout:decorate="~{layout_page}">
<th:block layout:fragment="content">
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>영업계획현황</h2>
        <a title="북마크" class="bookmark toggle">
          내 메뉴
        </a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>영업 관리</li>
        <li>영업계획현황</li>
      </ul>
    </div>

    <section class="section">
      <div class="section-top">
        <div class="search-wrap">
          <dl>
            <dt>
              <label for="cboYear">
                계획연도<span class="eq">*</span>
              </label>
            </dt>
            <dd>
              <div class="srch-box">
                <select id="cboYear"></select>
              </div>
            </dd>
          </dl>
          <dl>
            <dt>
              제품그룹
            </dt>
            <dd>
              <select class="form-control2" id="cboMatGrp" name="cboMatGrp"></select>
            </dd>
          </dl>
          <dl>
            <dt>
              품목
            </dt>
            <dd>
              <input type="text" id="srchMaterial" name="srchMaterial" placeholder="품목코드 또는 품명">
            </dd>
          </dl>
          <dl>
            <dt>
              조회데이터<span class="eq">*</span>
            </dt>
            <dd>
              <select class="form-control2" id="cboDataDiv" name="cboDataDiv">
                <option value="plan_qty">계획수량</option>
                <option value="plan_money">계획금액</option>
                <option value="suju_qty">수주수량</option>
                <option value="suju_money">수주금액</option>
                <option value="rate">달성률(%)</option>
                <option value="diff_qty">차이수량(수주-계획)</option>
              </select>
            </dd>
          </dl>
          <dl>
            <dt>&nbsp;</dt>
            <dd>
              <li>
                <a class="btn btn-delete" title="검색" id="btnSearch">
                  <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                  검색
                </a>
              </li>
            </dd>
          </dl>
        </div>
      </div>
      <div class="container-fluid">
        <div id="theGrid" style="height: 730px;"></div>
      </div>
    </section>
  </div>
</th:block>

<th:block layout:fragment="scripts">
  <th:block th:replace="/common/columns_setting :: columns_setting"></th:block>
  <script type="text/javascript">

   class SalesPlanStatusPage {
    constructor() {
     this.url = '/api/sales/plan_status';
     this.grid = null;
     this.viewData = new wijmo.collections.CollectionView();
     this.init();
    }

    // 조회데이터 구분에 따라 포맷 결정
    currentFormat() {
     const div = $('#cboDataDiv').val();
     return (div === 'rate') ? 'n1' : 'n0';
    }

    init() {
     this.grid = new wijmo.grid.FlexGrid('#theGrid', {
      selectionMode: wijmo.grid.SelectionMode.Row,
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      allowSorting: wijmo.grid.AllowSorting.MultiColumn,
      allowMerging: wijmo.grid.AllowMerging.Cells,
      autoGenerateColumns: false,
      showMarquee: true,
      isReadOnly: true,
      frozenColumns: 5,
      formatItem: (sender, e) => {
       if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
        e.cell.style.textAlign = 'center';
       }
      },
      columns: [
       { binding: 'mat_grp_name', header: '제품그룹', width: 110, allowMerging: true },
       { binding: 'mat_code', header: '품목코드', width: 110 },
       { binding: 'mat_name', header: '품목명', width: 240 },
       { binding: 'unit_name', header: '단위', width: 70, allowSorting: false },
       { binding: 'year_sum', header: '연간합계', width: 130, format: 'n0', align: 'right' },
       ...Array.from({ length: 12 }, (_, i) => ({
        binding: `mon_${i + 1}`,
        header: `${i + 1}월`,
        width: 85,
        format: 'n0',
        align: 'right',
        allowSorting: false
       }))
      ],
      itemsSource: this.viewData
     });

     this.grid.itemFormatter = function (panel, row, col, cell) {
      if (panel.cellType !== wijmo.grid.CellType.Cell) return;

      const colName = panel.columns[col].binding;
      const item = panel.rows[row].dataItem;

      // 스타일 초기화
      cell.style.backgroundColor = '';
      cell.style.color = '';
      cell.style.fontWeight = '';
      cell.style.textAlign = '';
      cell.style.verticalAlign = '';
      cell.style.display = '';
      cell.style.alignItems = '';
      cell.style.justifyContent = '';

      if (!item) return;

      // 정렬
      if (['mat_grp_name', 'mat_code', 'unit_name'].includes(colName)) {
       cell.style.textAlign = 'center';
       cell.style.verticalAlign = 'middle';
       cell.style.display = 'flex';
       cell.style.alignItems = 'center';
       cell.style.justifyContent = 'center';
      } else if (colName === 'mat_name') {
       cell.style.textAlign = 'left';
      } else {
       cell.style.textAlign = 'right';
      }

      const div = $('#cboDataDiv').val();
      const isValueCol = colName.startsWith('mon_') || colName === 'year_sum';

      // 달성률 색상 강조
      if (div === 'rate' && isValueCol) {
       const v = Number(item[colName]) || 0;
       if (v === 0) {
        cell.style.color = '#adb5bd';
       } else if (v >= 100) {
        cell.style.color = '#2b8a3e';
        cell.style.fontWeight = 'bold';
       } else if (v < 50) {
        cell.style.color = '#e8590c';
       }
      }

      // 차이수량은 음수(계획 미달)를 빨강으로
      if (div === 'diff_qty' && isValueCol) {
       const v = Number(item[colName]) || 0;
       if (v < 0) cell.style.color = '#e03131';
      }
     };

     // Footer 총합
     this.grid.columnFooters.rows.push(new wijmo.grid.Row());
     this.grid.bottomLeftCells.setCellData(0, 0, '총합');

     this.grid.loadedRows.addHandler(() => {
      const rows = this.grid.rows;
      const footer = this.grid.columnFooters.rows[0];

      // 달성률은 단순 합산이 무의미하므로 총합 비움
      if ($('#cboDataDiv').val() === 'rate') {
       footer.dataItem = {};
       return;
      }

      const getSum = (field) =>
       rows.map(r => +r.dataItem[field] || 0).reduce((a, b) => a + b, 0);

      const sums = { year_sum: getSum('year_sum') };
      for (let i = 1; i <= 12; i++) sums[`mon_${i}`] = getSum(`mon_${i}`);
      footer.dataItem = sums;
     });

     new FlexGridContextMenu(this.grid);
     this.grid.downloadFileName = '영업계획현황';
    }

    // 조회데이터 변경 시 숫자 포맷 갱신
    applyFormat() {
     const fmt = this.currentFormat();
     this.grid.columns.forEach(c => {
      if (c.binding && (c.binding.startsWith('mon_') || c.binding === 'year_sum')) {
       c.format = fmt;
      }
     });
     this.grid.invalidate();
    }

    searchMainData() {
     const url = this.url + '/read';
     const data = {
      'cboYear': $('#cboYear').val(),
      'cboMatGrp': $('#cboMatGrp').val(),
      'keyword': $('#srchMaterial').val(),
      'cboDataDiv': $('#cboDataDiv').val()
     };

     const result = AjaxUtil.getSyncData(url, data);
     if (result) {
      this.grid.itemsSource = result.data;
      this.applyFormat();
     }
    }

    exportExcel() {
     wijmo.grid.xlsx.FlexGridXlsxConverter.saveAsync(this.grid, {
      includeColumnHeaders: true,
      includeCellStyles: false,
     }, (blob) => {
      wijmo.saveFile(blob, '영업계획현황.xlsx');
     });
    }
   }

   let page = null;

   $(document.body).ready(function (e) {
    const currentYear = new Date().getFullYear();
    const yearSelect = $('#cboYear');
    for (let y = currentYear + 1; y >= 2010; y--) {
     yearSelect.append(new Option(y, y));
    }
    yearSelect.val(currentYear);

    page = new SalesPlanStatusPage();

    AjaxUtil.fillSelectOptions($('#cboMatGrp'), 'material_group', 'all', '', 'product,semi');

    $('#btnSearch').click(() => page.searchMainData());

    // 조회데이터 변경 시 즉시 재조회
    $('#cboDataDiv').on('change', function () {
     page.searchMainData();
    });

    // 엔터키 검색
    $('#srchMaterial').on('keypress', function (e) {
     if (e.keyCode === 13) page.searchMainData();
    });

    page.searchMainData();
   });

  </script>
</th:block>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</html>
