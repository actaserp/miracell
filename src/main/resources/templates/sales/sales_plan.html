<html layout:decorate="~{layout_page}">
<th:block layout:fragment="content">

  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>영업계획등록</h2>
        <a title="북마크" class="bookmark toggle">
          내 메뉴
        </a>
        <label for="Factory_id" class="hide">공장</label>
        <select style="width: 110px;" id="Factory_id" name="Factory_id"></select>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>영업 관리</li>
        <li>영업계획등록</li>
      </ul>
    </div>

    <section class="section">
      <div class="section-top">
        <div class="search-wrap">
          <dl>
            <dt>
              <label for="cboYear">
                계획연도<span class="eq">*</span>
              </label>
            </dt>
            <dd>
              <div class="srch-box">
                <select id="cboYear" name="cboYear"></select>
              </div>
            </dd>
          </dl>
          <dl>
            <dt>
              <label for="cboMonth">월</label>
            </dt>
            <dd>
              <select class="form-control2" id="cboMonth" name="cboMonth"></select>
            </dd>
          </dl>
          <dl>
            <dt>
              제품그룹
            </dt>
            <dd>
              <select class="form-control2" id="cboMatGrp" name="cboMatGrp"></select>
            </dd>
          </dl>
          <dl>
            <dt>
              품목
            </dt>
            <dd>
              <input type="text" id="srchMaterial" name="srchMaterial" placeholder="품목코드 또는 품명">
            </dd>
          </dl>
          <dl>
            <dt>&nbsp;</dt>
            <dd>
              <li>
                <a class="btn btn-delete" title="검색" id="btnSearch">
                  <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                  검색
                </a>
              </li>
            </dd>
          </dl>
        </div>
        <div class="button-wrap">
          <ul>
            <li>
              <a class="btn btn-excell" title="등록" id="btnAddNew">
                <img th:src="@{/images/icon/ico-plus.svg}" alt="등록 아이콘">
                등록
              </a>
            </li>
            <li>
              <a class="btn btn-delete" title="삭제" id="btnDelete">
                <img th:src="@{/images/icon/ico-delete.svg}" alt="삭제 아이콘">
                삭제
              </a>
            </li>
            <li>
              <a class="btn btn-edit" title="수정" id="btnEdit">
                <img th:src="@{/images/icon/ico-edit.svg}" alt="수정 아이콘">
                수정
              </a>
            </li>
          </ul>
        </div>
      </div>
      <div class="container-fluid">
        <div id="theGrid" style="height: 730px;"></div>
      </div>
    </section>
  </div>

  <script type="text/x-tmpl" id="salesPlanTemplate">
    <style>
      .write-table th {
        width: auto;
      }
      /* 아이템 테이블 전체 설정 */
      .item-table {
          width: 100%;
          border-collapse: collapse;
          table-layout: fixed;
          margin-top: 10px;
      }
      .item-table th {
          background-color: #EDEFF5;
          text-align: center;
          font-weight: bold;
          padding: 8px;
          border: 1px solid #ccc;
      }
      .item-table td {
          padding: 6px;
          text-align: center;
          border: 1px solid #ccc;
      }
      .item-table input {
          width: 100%;
          box-sizing: border-box;
          padding: 4px;
      }
      /* 품목 & 비고 왼쪽 정렬 */
      .item-table td:nth-child(2),
      .item-table td:nth-child(8) {
          text-align: left;
      }
      /* 공통 버튼 스타일 */
      .item-table .btn.in_btn {
          display: inline-flex;
          justify-content: center;
          align-items: center;
          width: 32px;
          height: 32px;
          border-radius: 4px;
          padding: 0;
          border: 1px solid #B3B3B3;
          background-color: #fff;
          cursor: pointer;
          transition: background-color 0.2s;
          line-height: 0;
      }
      .item-table .btn.in_btn.plus img {
          width: 10px;
          height: 10px;
          display: block;
      }
      .item-table .btn.in_btn img {
          width: 12px;
          height: 12px;
          display: block;
          margin-right: 5px;
      }
      .input-with-button {
          display: flex;
          gap: 4px;
          align-items: center;
      }
      .input-with-button input {
          flex: 1;
          min-width: 0;
          padding: 4px;
      }
      .input-with-button .btn.in_btn {
          flex-shrink: 0;
      }
      .content_wrap.popup {
          display: flex;
          flex-direction: column;
          height: 100%;
      }
      .table-wrap {
          flex: 1;
          overflow-y: auto;
          padding-right: 5px;
      }
      .popup-button {
          flex-shrink: 0;
          padding: 10px;
          background: #fff;
          border-top: 1px solid #ddd;
      }
    </style>
    <div class="content_wrap popup">
      <div class="table-wrap">
        <form id="planForm">
          <input type="hidden" id="id" name="id">
          <table class="write-table">
            <caption>영업계획 등록 테이블</caption>
            <colgroup>
              <col style="width: 15%">
              <col style="width: 35%">
              <col style="width: 15%">
              <col style="width: 35%">
            </colgroup>
            <tbody>
              <tr>
                <th style="text-align: center">
                  <label for="PlanYear">계획연도<span class="eq">*</span></label>
                </th>
                <td>
                  <select class="form-control2" id="PlanYear" name="PlanYear"></select>
                </td>
                <th style="text-align: center">
                  <label for="PlanMonth">계획월<span class="eq">*</span></label>
                </th>
                <td>
                  <select class="form-control2" id="PlanMonth" name="PlanMonth"></select>
                </td>
              </tr>
              <tr>
                <th style="text-align: center">
                  <label for="Description">비고</label>
                </th>
                <td colspan="3">
                  <textarea id="Description" name="Description" style="height:50px;"></textarea>
                </td>
              </tr>
              <tr>
                <th style="text-align: center">
                  <label for="totalAmountSum">계획금액 합계</label>
                </th>
                <td colspan="3">
                  <input id="totalAmountSum" name="totalAmountSum" style="text-align:right;" readonly>
                </td>
              </tr>
            </tbody>
          </table>

          <table class="item-table">
            <colgroup>
              <col style="width: 10%">
              <col style="width: 24%">
              <col style="width: 7%">
              <col style="width: 12%">
              <col style="width: 10%">
              <col style="width: 12%">
              <col style="width: 14%">
              <col style="width: 15%">
              <col style="width: 4%">
            </colgroup>
            <thead>
            <tr id="itemHeaderRow">
              <th>코드</th>
              <th>품목</th>
              <th>단위</th>
              <th>규격</th>
              <th>계획수량</th>
              <th>단가</th>
              <th>계획금액</th>
              <th>비고</th>
              <th>
                <a class="btn in_btn plus" id="addRemark" title="추가">
                  <img th:src="@{/images/icon/ico-plus.svg}" alt="등록 아이콘" />
                </a>
              </th>
            </tr>
            </thead>
            <tbody>
            <tr class="item-template-row" style="display: none;">
              <td>
                <input type="text" style="text-align:center;" name="product_code" placeholder="코드" readonly/>
              </td>
              <td>
                <div class="input-with-button">
                  <input type="hidden" name="plan_id" />
                  <input type="hidden" name="Material_id" />
                  <input type="text" name="txtProductName" placeholder="코드 또는 품명 입력 후 엔터" autocomplete="off" />
                </div>
              </td>
              <td><input type="text" style="text-align:center;" name="unit" placeholder="단위" readonly/></td>
              <td><input type="text" style="text-align:center;" name="standard" placeholder="규격" readonly/></td>
              <td><input type="text" style="text-align:right;" name="planQty" placeholder="수량" /></td>
              <td><input type="text" style="text-align:right;" name="unitPrice" placeholder="단가" /></td>
              <td><input type="text" style="text-align:right;" name="planAmount" placeholder="계획금액" readonly/></td>
              <td><input type="text" name="description" placeholder="비고" /></td>
              <td class="al_c item_border">
                <a class="btn in_btn" title="삭제" onclick="removeItemRow(this)">
                  <img th:src="@{/images/icon/ico-delete.svg}" alt="삭제 아이콘" />
                </a>
              </td>
            </tr>
            </tbody>
          </table>
        </form>
      </div>
      <div id="notUpdate" style="display:none;">* 수주가 발생한 계획은 수정이 불가합니다.</div>
      <div class="popup-button">
        <button type="button" class="btn-popup y_write_auth" id="btnPopPlanSave">저장</button>
        <button type="button" class="btn-popup" id="modal-close-button">닫기</button>
      </div>
    </div>
  </script>

</th:block>

<th:block layout:fragment="scripts">
  <th:block th:replace="/common/columns_setting :: columns_setting"></th:block>
  <th:block th:replace="/common/multiform_material :: multiform_material"></th:block>
  <script th:inline="javascript">
    /* 로그인 사용자의 소속 공장. 없으면 null → «전체» 가 기본값이 된다 */
    const factory_id = [[${session.factory_id}]];
  </script>
  <script type="text/javascript">

    let isInternalFormatting = false;

    class SalesPlanPage {
      constructor() {
        this.url = '/api/sales/plan';
        this.grid = null;
        this.planListIndex = 0;
        this.$btnEdit = $('#btnEdit');
        this.$btnAddNew = $('#btnAddNew');
        this.viewData = new wijmo.collections.CollectionView();
        this.init();
      }

      resetPlanListIndex() {
        this.planListIndex = 0;
      }

      nextPlanListIndex() {
        return this.planListIndex++;
      }

      resetSujuListIndex() {
        return this.resetPlanListIndex();
      }

      nextSujuListIndex() {
        return this.nextPlanListIndex();
      }

      init() {
        let _this = this;

        this.grid = new wijmo.grid.FlexGrid('#theGrid', {
          selectionMode: wijmo.grid.SelectionMode.Row,
          headersVisibility: wijmo.grid.HeadersVisibility.Column,
          allowSorting: wijmo.grid.AllowSorting.MultiColumn,
          allowMerging: wijmo.grid.AllowMerging.Cells,
          autoGenerateColumns: false,
          showMarquee: true,
          isReadOnly: true,
          formatItem: (sender, e) => {
            if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
              e.cell.style.textAlign = 'center';
            }
          },
          columns: [
            { binding: 'PlanYear', header: '계획연도', width: 90, align: 'center', allowMerging: true },
            { binding: 'PlanMonth', header: '계획월', width: 70, align: 'center', allowMerging: true },
            { binding: 'mat_grp_name', header: '제품그룹', width: 110, align: 'center' },
            { binding: 'mat_code', header: '품목코드', width: 110, align: 'center' },
            { binding: 'mat_name', header: '품목명', width: 260, align: 'left' },
            { binding: 'standard', header: '규격', width: 110, align: 'center' },
            { binding: 'unit_name', header: '단위', width: 70, align: 'center' },
            { binding: 'PlanQty', header: '계획수량', width: 110, align: 'right', format: 'n0' },
            { binding: 'UnitPrice', header: '단가', width: 110, align: 'right', format: 'n0' },
            { binding: 'PlanAmount', header: '계획금액', width: 140, align: 'right', format: 'n0' },
            { binding: 'SujuQty', header: '수주수량', width: 110, align: 'right', format: 'n0' },
            { binding: 'AchieveRate', header: '달성률(%)', width: 100, align: 'right', format: 'n1' },
            { binding: 'Description', header: '비고', width: '*' }
          ],
          itemsSource: this.viewData
        });

        // 달성률 색상 강조
        this.grid.formatItem.addHandler(function (s, e) {
          if (e.panel.cellType === wijmo.grid.CellType.Cell) {
            const col = s.columns[e.col];
            const item = s.rows[e.row]?.dataItem;

            e.cell.style.color = '';
            e.cell.style.fontWeight = '';

            if (!item) return;

            if (col.binding === 'AchieveRate') {
              const rate = Number(item.AchieveRate) || 0;
              if (rate >= 100) {
                e.cell.style.color = '#2b8a3e';
                e.cell.style.fontWeight = 'bold';
              } else if (rate < 50) {
                e.cell.style.color = '#e8590c';
              }
            }
          }
        });

        // Footer 합계
        this.grid.columnFooters.rows.push(new wijmo.grid.Row());
        this.grid.bottomLeftCells.setCellData(0, 0, '총합');

        this.grid.loadedRows.addHandler(() => {
          const rows = this.grid.rows;
          const footer = this.grid.columnFooters.rows[0];
          const getSum = (field) => rows.map(r => +r.dataItem[field] || 0).reduce((a, b) => a + b, 0);

          footer.dataItem = {
            PlanQty: getSum('PlanQty'),
            PlanAmount: getSum('PlanAmount'),
            SujuQty: getSum('SujuQty')
          };
        });

        new FlexGridContextMenu(this.grid);
        this.grid.downloadFileName = '영업계획';

        // 더블클릭 → 수정
        this.grid.hostElement.addEventListener('dblclick', function (e) {
          if (_this.grid.selectedItems.length === 0) return false;
          _this.$btnEdit.trigger('click');
        });

        // 등록
        this.$btnAddNew.click(function () {
          let defaultData = {
            id: '',
            mode: 'new',
            PlanYear: $('#cboYear').val(),
            PlanMonth: $('#cboMonth').val() || CommonUtil.getYYYYMMDD().substring(5, 7)
          };
          _this.showPlanForm(defaultData);
        });

        // 수정
        this.$btnEdit.click(function () {
          let selectedItems = _this.grid.selectedItems;
          if (selectedItems.length !== 1) {
            Alert.alert('', '선택된 데이터가 없습니다.');
            return;
          }

          const headId = selectedItems[0].head_id;      // ← id 아님
          window.selectedGridId = selectedItems[0].id;  // 그리드 행 복원용은 그대로

          let data = { id: headId, action: 'detail' };

          let fnsuccess = function (result) {
            result.data['mode'] = 'edit';
            result.data['SujuQty'] = selectedItems[0].SujuQty;
            _this.showPlanForm(result.data);
          };
          AjaxUtil.getAsyncData(_this.url + '/detail', data, fnsuccess);
        });

        // 삭제
        $('#btnDelete').click(function () {
          let items = _this.grid.selectedItems;
          if (items.length === 0) {
            Alert.alert('', '삭제할 항목을 선택해주세요.', function () {
              $(this).focus();
            });
            return;
          }
          Alert.confirm('', '삭제하시겠습니까?', function () {
            _this.deletePlanData(items[0].head_id, items[0].SujuQty);
          });
        });

        // 엔터키 검색
        $('#srchMaterial').on('keypress', function (e) {
          if (e.keyCode === 13) _this.searchMainData();
        });
      }

      searchMainData() {
        let _this = this;
        let url = this.url + '/read';
        let data = {
          'year': $('#cboYear').val(),
          'month': $('#cboMonth').val(),
          'matGrp': $('#cboMatGrp').val(),
          'keyword': $('#srchMaterial').val(),
          /* 빈 문자열이어도 반드시 보낸다 — 빈 값 = 전체 */
          'factory_id': $('#Factory_id').val() || '',
          'action': 'read'
        };

        let fnsuccess = function (result) {
          if (result != null) {
            _this.viewData.sourceCollection = result.data;

            if (window.selectedGridId) {
              GridUtil.selectRowById(_this.grid, window.selectedGridId);
              window.selectedGridId = null;
            }
          }
        };
        AjaxUtil.getAsyncData(url, data, fnsuccess);
      }

      showPlanForm(data) {
        let _this = this;
        _this.resetPlanListIndex();

        let content = tmpl('salesPlanTemplate', data);
        let $content = $(content);

        let modalContainer = new PopupDraggable(data.mode === 'new' ? '등록' : '수정');
        modalContainer.open({ width: 1200, height: 560, $content });

        const $planForm = $content.find('#planForm');

        // 연도/월 콤보
        const currentYear = new Date().getFullYear();
        const $planYear = $content.find('#PlanYear');
        for (let y = currentYear + 1; y >= currentYear - 5; y--) {
          $planYear.append(new Option(y, y));
        }
        const $planMonth = $content.find('#PlanMonth');
        for (let m = 1; m <= 12; m++) {
          $planMonth.append(new Option(m + '월', ('0' + m).slice(-2)));
        }

        setTimeout(() => {
          FormUtil.BindDataSujuForm(data, $planForm);

          $planYear.val(data.PlanYear || currentYear);
          $planMonth.val(data.PlanMonth || ('0' + (new Date().getMonth() + 1)).slice(-2));

          if (data.mode === 'new') {
            $content.find('#addRemark').trigger('click');
          } else {
            // 기존 행 금액 표시 포맷
            const $rows = $content.find('.item-table tbody tr:visible').not('.item-template-row');
            $rows.each(function () { calculateAmount($(this)); });
          }
          calculateTotalSum($content);
        }, 100);

        // 수정 가능 여부 — 수주가 발생한 계획은 잠금
        applyEditability(data);

        function canEditPlan(d) {
          const sujuQty = Number(d?.SujuQty ?? 0);
          return !(sujuQty > 0);
        }

        function applyEditability(d) {
          if (canEditPlan(d)) {
            $content.find('#btnPopPlanSave').show();
            $content.find('#notUpdate').hide();
            $content.find('.popup-button').css('margin-top', '');
          } else {
            $content.find('#btnPopPlanSave').hide();
            $content.find('#notUpdate')
                    .text('* 수주가 발생한 계획은 수정이 불가합니다.')
                    .css('margin-top', '10px').show();
            $content.find('.popup-button').css('margin-top', '10px');
          }
        }

        // ===== 유틸 =====
        function getNumericValue($input, def = 0) {
          if ($input.length === 0) return def;
          let raw = (($input.val() || '') + '').replace(/[^0-9.]/g, '').trim();
          if (raw === '' || raw === '.') return def;
          const n = parseFloat(raw);
          return Number.isFinite(n) ? n : def;
        }

        // 계획금액 = 계획수량 × 단가
        function calculateAmount($row) {
          if (isInternalFormatting) return;
          isInternalFormatting = true;
          try {
            const qty = getNumericValue($row.find('input[name^="planQty_"]'), 0);
            const price = getNumericValue($row.find('input[name^="unitPrice_"]'), 0);
            const amount = Math.floor(qty * price);

            $row.find('input[name^="planAmount_"]').val(amount === 0 ? '' : amount.toLocaleString('ko-KR'));
            $row.find('input[name^="planQty_"]').val(qty === 0 ? '' : qty.toLocaleString('ko-KR'));
            $row.find('input[name^="unitPrice_"]').val(price === 0 ? '' : price.toLocaleString('ko-KR'));

            calculateTotalSum($content);
          } finally {
            isInternalFormatting = false;
          }
        }

        function calculateTotalSum($scope) {
          const $root = $scope && $scope.length ? $scope : $('#planForm');
          let sum = 0;
          $root.find('.item-table tr:visible').each(function () {
            const $inp = $(this).find('input[name^="planAmount_"]').first();
            if (!$inp.length) return;
            const raw = String($inp.val() || '').replace(/,/g, '').trim();
            const n = parseFloat(raw);
            if (Number.isFinite(n)) sum += n;
          });
          $root.find('#totalAmountSum').val(sum !== 0 ? sum.toLocaleString('ko-KR') : '');
        }

        // 수량/단가 입력 시 재계산
        $content.on('input', 'input[name^="planQty_"], input[name^="unitPrice_"]', function () {
          calculateAmount($(this).closest('tr'));
        });

        // 숫자 포맷 (입력 중)
        $content.off('input.numfmt')
                .on('input.numfmt', 'input[name^="planQty_"], input[name^="unitPrice_"]', function (e) {
                  if (isInternalFormatting) return;
                  if (e.originalEvent && e.originalEvent.isComposing) return;

                  isInternalFormatting = true;
                  const input = this;
                  const $this = $(this);
                  const name = input.name || '';

                  const prevLen = input.value.length;
                  const cursorPos = input.selectionStart;
                  const rightRemain = prevLen - cursorPos;

                  let allowDecimal = name.startsWith('planQty_');
                  let raw = String($this.val() || '').replace(/,/g, '');

                  if (allowDecimal) {
                    raw = raw.replace(/[^0-9.]/g, '').replace(/\.(?=.*\.)/g, '');
                    if (raw === '' || raw === '.') { $this.val(''); isInternalFormatting = false; return; }
                    const hasDot = raw.includes('.');
                    let [intPart, fracPart = ''] = raw.split('.');
                    intPart = intPart.replace(/^0+(?=\d)/, '');
                    if (fracPart.length > 2) fracPart = fracPart.slice(0, 2);
                    const intFormatted = (intPart === '' ? '0' : String(Number(intPart))).toLocaleString('ko-KR');
                    const formatted = hasDot ? `${intFormatted}.${fracPart}` : intFormatted;
                    $this.val(formatted);
                    const pos = Math.max(0, formatted.length - rightRemain);
                    input.setSelectionRange(pos, pos);
                  } else {
                    raw = raw.replace(/[^0-9]/g, '');
                    if (raw === '') { $this.val(''); isInternalFormatting = false; return; }
                    const formatted = Number(raw).toLocaleString('ko-KR');
                    $this.val(formatted);
                    const pos = Math.max(0, formatted.length - rightRemain);
                    input.setSelectionRange(pos, pos);
                  }
                  isInternalFormatting = false;
                });

        // 품목명 엔터 → 품목 검색 팝업
        $content.on('keydown', 'input[name^="txtProductName_"]', function (e) {
          if (e.key !== 'Enter' && e.keyCode !== 13) return;
          e.preventDefault();

          const $field = $(this);
          const $row = $field.closest('tr');

          const $productId = $row.find('input[name^="Material_id_"]');
          const $productCode = $row.find('input[name^="product_code_"]');
          const $standard = $row.find('input[name^="standard_"]');
          const $unitName = $row.find('input[name^="unit_"]');

          const keyword = $field.val().trim();
          const pop = new PopMatComponent();
          pop.material_type = 'product,sangpum';

          const callback = function (item) {
            $productId.val(item.id || '');
            $field.val(item.Name || '');
            $productCode.val(item.Code || '');
            $unitName.val(item.unit_name || '');
            $standard.val(item.Spec || '');
            $row.find('input[name^="planQty_"]').focus();
          };

          if (!keyword) {
            pop.focusAfterClose = $field[0];
            pop.show(callback);
            return;
          }

          const result = AjaxUtil.getSyncData('/api/popup/search_material', {
            keyword: keyword,
            spjangcd: sessionStorage.getItem('spjangcd')
          });
          const rows = result?.data || [];

          if (rows.length === 1) {
            callback(rows[0]);
          } else {
            pop.show(callback);
            setTimeout(() => {
              pop.$keyword.val(keyword);
              pop.$btnMaterialSearch.trigger('click');
            }, 50);
          }
        });

        // 품목명 지우면 연관 필드 초기화
        $content.on('input', 'input[name^="txtProductName_"]', function () {
          const $field = $(this);
          const $row = $field.closest('tr');
          if ($field.val().trim() === '') {
            $row.find('input[name^="Material_id_"]').val('');
            $row.find('input[name^="product_code_"]').val('');
            $row.find('input[name^="standard_"]').val('');
            $row.find('input[name^="unit_"]').val('');
          }
        });

        // 행 추가
        $content.find('#addRemark').click(function () {
          const $tbody = $content.find('.item-table tbody');
          const $template = $tbody.find('.item-template-row');

          for (let i = 0; i < 3; i++) {
            const $newRow = $template.clone().removeClass('item-template-row').show();
            const index = _this.nextPlanListIndex();
            $newRow.find('input').each(function () {
              const baseName = $(this).attr('name');
              if (baseName) $(this).attr('name', `${baseName}_${index}`);
            });
            $newRow.find('a[title="삭제"]').attr('id', `btnDelItem_${index}`);
            $tbody.append($newRow);
          }
        });

        // 포커스 이동: Enter + 방향키
        $content.on('keydown', 'input', function (e) {
          const key = e.key;
          if (!['Enter', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(key)) return;

          const $input = $(this);
          const $row = $input.closest('tr');
          const nameAttr = $input.attr('name') || '';

          const focusOrder = ['txtProductName_', 'planQty_', 'unitPrice_', 'description_'];
          const currentIndex = focusOrder.findIndex(prefix => nameAttr.startsWith(prefix));
          if (currentIndex === -1) return;

          // 품목명 엔터는 검색 핸들러가 처리
          if (key === 'Enter' && nameAttr.startsWith('txtProductName_')) return;
          e.preventDefault();

          let $nextInput = null;

          if (key === 'ArrowRight' && currentIndex < focusOrder.length - 1) {
            $nextInput = $row.find(`input[name^="${focusOrder[currentIndex + 1]}"]`);
          } else if (key === 'ArrowLeft' && currentIndex > 0) {
            $nextInput = $row.find(`input[name^="${focusOrder[currentIndex - 1]}"]`);
          }

          if (key === 'ArrowDown' || key === 'ArrowUp') {
            const $targetRow = key === 'ArrowDown'
                    ? $row.nextAll('tr:visible').first()
                    : $row.prevAll('tr:visible').first();

            if (key === 'ArrowDown' && !$targetRow.length) {
              $content.find('#addRemark').trigger('click');
              setTimeout(() => {
                const $rows = $content.find('.item-table tbody tr:visible').not('.item-template-row');
                const $newInput = $rows.last().find('input[name^="txtProductName_"]');
                if ($newInput.length) $newInput.focus().select();
              }, 50);
              return;
            }
            $nextInput = $targetRow.find(`input[name^="${focusOrder[currentIndex]}"]`);
          }

          if (key === 'Enter') {
            if (currentIndex < focusOrder.length - 1) {
              $nextInput = $row.find(`input[name^="${focusOrder[currentIndex + 1]}"]`);
            } else {
              const $nextRow = $row.nextAll('tr:visible').first();
              if (!$nextRow.length) {
                $content.find('#addRemark').trigger('click');
                setTimeout(() => {
                  const $rows = $content.find('.item-table tbody tr:visible').not('.item-template-row');
                  const $newInput = $rows.last().find('input[name^="txtProductName_"]');
                  if ($newInput.length) $newInput.focus().select();
                }, 50);
                return;
              }
              $nextInput = $nextRow.find('input[name^="txtProductName_"]');
            }
          }

          if ($nextInput && $nextInput.length) $nextInput.focus().select();
        });

        // 저장
        $content.find('#btnPopPlanSave').click(function () {
          let formData = FormUtil.extractForm($planForm);

          const items = [];
          for (let i = 0; i < _this.planListIndex; i++) {
            const productName = formData[`txtProductName_${i}`];
            if (!productName) continue;

            const materialId = formData[`Material_id_${i}`];
            if (!materialId) {
              Alert.alert('', `(${i + 1}번째 행) 품목을 검색하여 선택하세요.`);
              return;
            }
            const qty = (formData[`planQty_${i}`] || '').replace(/,/g, '');
            if (!qty || Number(qty) <= 0) {
              Alert.alert('', `(${i + 1}번째 행) 계획수량을 입력하세요.`);
              return;
            }

            items.push({
              plan_id: formData[`plan_id_${i}`] || '',
              Material_id: Number(materialId),
              product_code: formData[`product_code_${i}`] || '',
              txtProductName: productName,
              standard: formData[`standard_${i}`] || '',
              planQty: qty,
              unitPrice: (formData[`unitPrice_${i}`] || '0').replace(/,/g, ''),
              planAmount: (formData[`planAmount_${i}`] || '0').replace(/,/g, ''),
              description: formData[`description_${i}`] || ''
            });
          }

          if (items.length === 0) {
            Alert.alert('', '등록할 품목이 없습니다.');
            return;
          }

          Alert.confirm('', '저장하시겠습니까?', function () {
            const payload = {
              id: formData.id,
              PlanYear: $content.find('#PlanYear').val(),
              PlanMonth: $content.find('#PlanMonth').val(),
              Description: formData.Description,
              totalAmountSum: (formData.totalAmountSum || '0').replace(/,/g, ''),
              spjangcd: formData.spjangcd,
              items: items
            };

            AjaxUtil.postJsonData(_this.url + '/manual_save', payload, function (res) {
              if (res.success) {
                Notify.success('저장되었습니다.');
                _this.searchMainData();
                modalContainer.close();
              } else {
                Alert.alert('저장 실패', res.message || '알 수 없는 오류');
              }
            });
          });
        });

        $content.find('#modal-close-button').click(function () {
          modalContainer.close();
        });
      }

      deletePlanData(id, sujuQty) {
        let _this = this;
        let data = { 'id': id, 'SujuQty': sujuQty };
        let fnsuccess = function (res) {
          if (res.success) {
            Notify.success('삭제되었습니다.');
            _this.searchMainData();
          } else {
            Alert.alert('', res.message);
          }
        };
        AjaxUtil.postAsyncData(_this.url + '/delete', data, fnsuccess);
      }

      exportExcel() {
        wijmo.grid.xlsx.FlexGridXlsxConverter.saveAsync(this.grid, {
          includeColumnHeaders: true,
          includeCellStyles: false,
        }, (blob) => {
          wijmo.saveFile(blob, '영업계획.xlsx');
        });
      }
    }

    // 행 삭제 함수
    function removeItemRow(el) {
      const $tbody = $(el).closest('tbody');
      const $rows = $tbody.find('tr:not(.item-template-row)');
      const $targetRow = $(el).closest('tr');

      if ($rows.length <= 3) {
        $targetRow.find('input[type="text"], input[type="number"]').val('');
        $targetRow.find('input[type="hidden"]').val('');
        return;
      }
      $targetRow.remove();
    }

    let page = null;

    $(document).ready(function (e) {

      // 연도 콤보
      const currentYear = new Date().getFullYear();
      const $cboYear = $('#cboYear');
      for (let y = currentYear + 1; y >= 2010; y--) {
        $cboYear.append(new Option(y, y));
      }
      $cboYear.val(currentYear);

      // 월 콤보
      const $cboMonth = $('#cboMonth');
      $cboMonth.append(new Option('전체', ''));
      for (let m = 1; m <= 12; m++) {
        $cboMonth.append(new Option(m + '월', ('0' + m).slice(-2)));
      }

      page = new SalesPlanPage();

      AjaxUtil.fillSelectOptions($('#cboMatGrp'), 'material_group', 'all', '', 'product,semi');

      /* 공장 콤보 — 기본값은 계정의 소속 공장. 없으면 '' = 전체.
         change 핸들러는 채운 «뒤에» 건다. fillSelectOptions 가 selected_value 를
         넣으면서 .change() 를 직접 발생시키므로 먼저 걸면 조회가 두 번 나간다. */
      const myFactory = (factory_id == null || factory_id === '' || Number(factory_id) <= 0)
              ? '' : String(factory_id);
      AjaxUtil.fillSelectOptions($('#Factory_id'), 'factory', 'all', myFactory);

      $('#Factory_id').on('change', function () {
        page.searchMainData();
      });

      page.searchMainData();

      // 검색
      $('#btnSearch').click(function () {
        page.searchMainData();
      });
    });

  </script>
</th:block>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</html>
