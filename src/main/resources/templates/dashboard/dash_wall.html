<html layout:decorate="~{layout_page}">
<head>
  <style>
    /* ═══════════════════════════════════════════════════════════
       벽걸이 전용 대시보드

       ★ dash_main 과 목적이 다르다. 합치지 않는다.
         dash_main : 앉아서 「무슨 일이 있나」를 파악한다 (관리자용)
                     목록·상세가 필요하고 12~14px 로 충분하다
         이 화면    : 지나가며 0.5초 안에 「이상 있나」를 알아챈다
                     읽는 게 아니라 알아채는 것이다

       ★ 그래서 정보를 3분의 1로 줄였다.
         작업지시 목록·유닛 로트번호·부적합 상세는 넣지 않는다.
         3~5m 밖에서 안 읽히는 정보는 화면만 어지럽힌다.

       ★ 밝은 바탕을 쓴다.
         어두운 바탕이 상태 색은 더 살지만, 주간 조명이 밝은 현장에서는
         화면이 어둡게 가라앉아 오히려 안 보인다. 다른 화면과 톤도 맞는다.
         대신 대비를 크게 벌려 멀리서도 읽히게 한다 —
         바탕은 회색, 카드는 흰색, 상태 색만 진하게.

       ★ 서버는 dash_main 과 공유한다 (/api/dashboard/main/read).
         같은 숫자를 두 화면이 다르게 말하면 안 되므로 API 를 나누지 않는다.
    ═══════════════════════════════════════════════════════════ */
    #wlWrap {
      position: relative;
      /* ★ 100vh 를 쓰지 않는다.
           이 화면은 위에 탭 헤더, 아래에 푸터가 있는 레이아웃 안에 들어간다.
           100vh 는 「창 전체」라 항상 실제로 쓸 수 있는 자리보다 크고,
           그만큼 아래가 잘린다. 전체화면일 때만 우연히 맞았던 것이다.
           실제 높이는 wlFitHeight() 가 잰다 (dash_main 과 같은 방식). */
      height: 640px;        /* 초기값 · JS 의 WL_MIN_H 와 같은 값 */
      background: #e4e9f2;
      color: #1f2733;
      padding: 22px 26px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 16px;
      font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
      overflow: hidden;
    }
    #wlWrap * { box-sizing: border-box; }

    /* ── 헤더 ── */
    #wlWrap .wl-head { flex:0 0 auto; display:flex; align-items:center; gap:16px; }
    #wlWrap .wl-head h1 { margin:0; font-size:30px; font-weight:800; letter-spacing:-.5px; }
    #wlWrap .wl-live { font-size:14px; font-weight:800; color:#0f9d58;
      display:flex; align-items:center; gap:7px; }
    #wlWrap .wl-live i { width:9px; height:9px; border-radius:50%; background:#0f9d58;
      animation:wlBlink 2s infinite; }
    @keyframes wlBlink { 0%,100%{opacity:1} 50%{opacity:.25} }
    #wlWrap .wl-clock { margin-left:auto; font-size:34px; font-weight:800;
      font-variant-numeric:tabular-nums; letter-spacing:1px; }
    #wlWrap .wl-clock .d { font-size:16px; color:#8a94a4; font-weight:700;
      margin-right:12px; letter-spacing:0; }
    #wlWrap .wl-full { flex:0 0 auto; width:38px; height:38px; border-radius:9px;
      border:1px solid #cfd6e2; background:#fff; color:#5b6675;
      font-size:17px; cursor:pointer; }

    /* ── 이상 알림 : 이 화면에서 가장 중요한 요소 ── */
    #wlWrap .wl-alarm { flex:0 0 auto; border-radius:14px; padding:15px 22px;
      display:flex; align-items:center; gap:14px;
      font-size:22px; font-weight:800; }
    #wlWrap .wl-alarm.ok  { background:#e8f6ef; color:#0b7a45; border:1px solid #b9e5cf; }
    #wlWrap .wl-alarm.bad { background:#d64545; color:#fff;
      animation:wlPulse 1.4s infinite; }
    @keyframes wlPulse { 0%,100%{box-shadow:0 0 0 0 rgba(214,69,69,.5)}
      70%{box-shadow:0 0 0 16px rgba(214,69,69,0)} }
    #wlWrap .wl-alarm .cnt { margin-left:auto; font-size:16px; opacity:.85; font-weight:700; }

    /* ── 본문 ── */
    #wlWrap .wl-body { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:16px; }

    /* 클린룸 4존 */
    #wlWrap .wl-env { flex:1 1 40%; min-height:0; display:grid;
      grid-template-columns:repeat(4,1fr); gap:14px; }
    #wlWrap .wl-ec { background:#fff; border:1px solid #d5dce7; border-radius:16px;
      box-shadow:0 2px 6px rgba(31,39,51,.07);
      padding:14px 18px; display:flex; flex-direction:column; min-height:0; }
    #wlWrap .wl-ec.bad { background:#fff2f2; border-color:#e9b4b4; box-shadow:0 2px 10px rgba(214,69,69,.2); }
    #wlWrap .wl-ec .zn { font-size:20px; font-weight:800; display:flex; align-items:center; gap:9px; }
    #wlWrap .wl-ec .zn .st { margin-left:auto; font-size:12px; font-weight:800;
      padding:3px 10px; border-radius:6px;
      background:#e8f6ef; color:#0b7a45; }
    #wlWrap .wl-ec .zn .st.off { background:#eef2f8; color:#98a1b0; }
    #wlWrap .wl-ec .zn .st.bad { background:#d64545; color:#fff; }
    #wlWrap .wl-ec .rows { flex:1 1 auto; min-height:0; display:flex;
      flex-direction:column; justify-content:space-around; margin-top:6px; }
    #wlWrap .wl-ec .rw { display:flex; align-items:baseline; gap:10px; }
    #wlWrap .wl-ec .rw .k { font-size:24px; font-weight:800; color:#8a94a4; letter-spacing:.5px; }
    #wlWrap .wl-ec .rw .v { margin-left:auto; font-size:40px; font-weight:800;
      font-variant-numeric:tabular-nums; line-height:1.05; }
    #wlWrap .wl-ec .rw .v small { font-size:17px; color:#a7b0be; margin-left:3px; }
    #wlWrap .wl-ec .rw.warn .v, #wlWrap .wl-ec .rw.warn .k { color:#d64545; }
    #wlWrap .wl-ec .rw.na .v { color:#dfe3ea; }

    /* 공정 타일 */
    #wlWrap .wl-proc { flex:1 1 33%; min-height:0; display:grid;
      grid-template-columns:1fr 1fr; gap:14px; }
    #wlWrap .wl-fac { background:#fff; border:1px solid #d5dce7; border-radius:16px;
      box-shadow:0 2px 6px rgba(31,39,51,.07);
      padding:12px 16px; display:flex; flex-direction:column; min-height:0; }
    #wlWrap .wl-fac .ft { font-size:14px; font-weight:800; color:#8a94a4; margin-bottom:9px; }
    #wlWrap .wl-fac .ft b { color:#1f2733; font-size:17px; margin-right:7px; }
    #wlWrap .wl-tiles { flex:1 1 auto; min-height:0; display:grid; gap:10px;
      grid-template-columns:repeat(3,1fr); }
    #wlWrap .wl-tile { background:#f2f5fa; border-radius:12px; padding:9px 12px;
      display:flex; flex-direction:column; justify-content:center; }
    #wlWrap .wl-tile.on { background:#e8f6ef; box-shadow:inset 5px 0 0 #0f9d58; }
    #wlWrap .wl-tile .tn { font-size:15px; font-weight:800; color:#8a94a4; }
    #wlWrap .wl-tile.on .tn { color:#0b7a45; }
    #wlWrap .wl-tile .tv { font-size:26px; font-weight:800; font-variant-numeric:tabular-nums;
      color:#1f2733; line-height:1.15; }
    #wlWrap .wl-tile .tv small { font-size:13px; color:#a7b0be; margin-left:2px; }
    #wlWrap .wl-tile:not(.on) .tv { color:#c2c9d4; }
    /* 값이 둘인 타일 — 1공장 포장(완제품 / CK).
       벽걸이는 지나가며 보는 화면이라 숫자를 줄이는 것이 손해지만,
       합쳐서 틀린 숫자를 크게 쓰는 것보다는 낫다. */
    #wlWrap .wl-tile .tsplit { display:flex; align-items:stretch; gap:10px; }
    #wlWrap .wl-tile .tsplit > div { flex:1 1 0; min-width:0; }
    #wlWrap .wl-tile .tsplit > div + div { border-left:1px solid #dde3ec; padding-left:10px; }
    #wlWrap .wl-tile.on .tsplit > div + div { border-left-color:#bfe6d1; }
    #wlWrap .wl-tile .tsplit .sl { font-size:11px; font-weight:800; color:#a7b0be;
      letter-spacing:.3px; white-space:nowrap; }
    #wlWrap .wl-tile.on .tsplit .sl { color:#5c9c7c; }
    #wlWrap .wl-tile .tsplit .tv { font-size:22px; }

    /* 하단 KPI */
    #wlWrap .wl-kpis { flex:0 0 auto; display:grid; grid-template-columns:repeat(5,1fr); gap:14px; }
    #wlWrap .wl-kpi { background:#fff; border:1px solid #d5dce7; border-radius:16px;
      box-shadow:0 2px 6px rgba(31,39,51,.07);
      padding:12px 18px; }
    #wlWrap .wl-kpi .l { font-size:14px; font-weight:800; color:#8a94a4; }
    #wlWrap .wl-kpi .v { font-size:44px; font-weight:800; font-variant-numeric:tabular-nums;
      line-height:1.1; margin-top:2px; }
    #wlWrap .wl-kpi .v small { font-size:16px; color:#a7b0be; margin-left:3px; }
    #wlWrap .wl-kpi.blue .v   { color:#2f6fed; }
    #wlWrap .wl-kpi.green .v  { color:#0f9d58; }
    #wlWrap .wl-kpi.red .v    { color:#d64545; }
    #wlWrap .wl-kpi.violet .v { color:#7a6ff0; }
    #wlWrap .wl-kpi.teal .v   { color:#00a3a3; }

    /* ═══════════════════════════════════════════════
       반응형

       두 가지를 분리해서 다룬다. 지난번에 이 둘을 한 덩어리로 묶는 바람에
       가로 1920 짜리 화면이 「세로가 낮다」는 이유만으로 2×2 로 접혔다.

       (1) 접기    — 가로가 좁을 때만. 세로와는 무관하다.
       (2) 높이풀기 — 세로가 낮을 때(또는 가로가 좁을 때).
                      100vh 안에 안 들어가면 눌러 담지 말고 흘려보낸다.

       ★ 높이를 풀 때 .wl-body 의 flex:1 도 같이 풀어야 한다.
         안 풀면 body 가 남는 높이를 전부 빨아들여
         하단 KPI 줄만 저 아래 바닥에 홀로 떨어져 붙는다.
    ═══════════════════════════════════════════════ */

    /* ── 겹침 방지 ──
       .wl-body 는 flex:1 1 auto + min-height:0 이라 자리가 모자라면 눌리고,
       .wl-kpis 는 flex:0 0 auto 라 제 높이를 지킨다.
       그래서 눌린 body 안의 내용이 아래로 새어 KPI 줄 위에 그려진다.
       카드에만 overflow 를 걸면 카드 「안쪽」 글자만 잡히므로 칸에도 건다. */
    #wlWrap .wl-body { overflow:hidden; }
    #wlWrap .wl-env, #wlWrap .wl-proc { overflow:hidden; }
    #wlWrap .wl-ec, #wlWrap .wl-fac, #wlWrap .wl-tile, #wlWrap .wl-kpi { overflow:hidden; }
    #wlWrap .wl-kpis { position:relative; z-index:2; background:#e4e9f2; }

    /* ── 눌림 방지 ──
       ★ 이게 없으면 「높이가 모자란지」를 알 수 없다.

         flex/grid 자식은 min-height:0 이면 내용보다 작게까지 줄어든다.
         그 상태에서 안쪽 글자는 overflow:hidden 으로 잘리므로
         바깥에서 보면 넘친 흔적이 없다 —
         wlFitHeight() 의 scrollHeight 검사도 아무것도 못 잡는다.
         결국 「자리는 그대로인데 내용만 뭉개진」 상태로 굳는다.

         그래서 각 칸에 내용이 필요로 하는 만큼의 최소 높이를 준다.
         그러면 자리가 모자랄 때 실제로 넘치고,
         넘치면 wlFitHeight() 가 스크롤 모드로 바꾼다. */
    #wlWrap .wl-tile  { min-height:44px; }
    #wlWrap .wl-tiles { grid-auto-rows:minmax(44px, 1fr); }
    #wlWrap .wl-fac,
    #wlWrap .wl-ec    { min-height:min-content; }
    #wlWrap .wl-env,
    #wlWrap .wl-proc,
    #wlWrap .wl-body  { min-height:min-content; }

    /* ── 높이가 모자랄 때 ──
       wlFitHeight() 가 「내용이 들어갈 최소 높이」보다 자리가 좁다고 판단하면
       #wlWrap 에 .wl-scroll 을 붙인다.
       그때는 한 화면을 포기하고 세로로 흘려보낸다 — 페이지 스크롤로 본다.
       ★ .wl-body 의 flex:1 도 같이 풀어야 한다.
         안 풀면 body 가 남는 높이를 다 빨아들여
         하단 KPI 줄만 저 아래 바닥에 홀로 떨어진다. */
    #wlWrap.wl-scroll { height:auto !important; overflow:visible; }
    #wlWrap.wl-scroll .wl-body { flex:0 0 auto; overflow:visible; }
    #wlWrap.wl-scroll .wl-env,
    #wlWrap.wl-scroll .wl-proc,
    #wlWrap.wl-scroll .wl-kpis { flex:0 0 auto; }
    #wlWrap.wl-scroll .wl-ec  { min-height:120px; }
    #wlWrap.wl-scroll .wl-fac { min-height:min-content; }
    #wlWrap.wl-scroll .wl-ec .rows { justify-content:space-between; gap:2px; }

    /* ── 글자 줄이기 : 가로 1920 미만 ── */
    @media (max-width:1600px){
      #wlWrap .wl-head h1   { font-size:25px; }
      #wlWrap .wl-clock     { font-size:28px; }
      #wlWrap .wl-alarm     { font-size:19px; }
      #wlWrap .wl-ec .zn    { font-size:17px; }
      #wlWrap .wl-ec .rw .k { font-size:19px; }
      #wlWrap .wl-ec .rw .v { font-size:32px; }
      #wlWrap .wl-ec .rw .v small { font-size:14px; }
      #wlWrap .wl-kpi .v    { font-size:34px; }
      #wlWrap .wl-kpi .l    { font-size:12.5px; }
      #wlWrap .wl-tile .tn  { font-size:13px; }
      #wlWrap .wl-tile .tv  { font-size:22px; }
      #wlWrap .wl-tile .tsplit .tv { font-size:18px; }
    }

    /* 세로가 낮으면 폭과 무관하게 글자를 줄인다 — 접지는 않는다 */
    @media (max-height:900px){
      #wlWrap { padding:14px 18px; gap:10px; }
      #wlWrap .wl-head h1   { font-size:23px; }
      #wlWrap .wl-clock     { font-size:24px; }
      #wlWrap .wl-alarm     { font-size:17px; padding:11px 16px; }
      #wlWrap .wl-ec        { padding:10px 14px; }
      #wlWrap .wl-ec .zn    { font-size:16px; }
      #wlWrap .wl-ec .rw .k { font-size:17px; }
      #wlWrap .wl-ec .rw .v { font-size:28px; }
      #wlWrap .wl-kpi .v    { font-size:28px; }
      #wlWrap .wl-tile .tv  { font-size:20px; }
    }

    /* ── (1) 접기 : 가로가 좁을 때만 ── */
    @media (max-width:1400px){
      #wlWrap { padding:16px 18px; gap:12px; }
      #wlWrap .wl-head h1 { font-size:22px; }
      #wlWrap .wl-clock   { font-size:22px; }
      /* ★ .wl-body 를 block 으로 바꾸지 않는다.
           block 이 되면 flex 비율(40%/33%)이 죽어서
           카드가 내용만큼만 자라고 아래가 텅 빈다.
           폭이 좁아도 「아래까지 꽉 참」은 유지해야 한다. */
      /* ★ 클린룸 4장은 접지 않는다. 내용이 「이름 + 3줄」뿐이라
           좁아져도 읽히고, 접으면 세로만 두 배가 된다.
           벽걸이는 세로가 늘어나는 쪽이 훨씬 불리하다. */
      #wlWrap .wl-env  { grid-template-columns:repeat(4,1fr); gap:10px; }
      #wlWrap .wl-ec   { padding:10px 12px; }
      #wlWrap .wl-ec .zn { font-size:15px; }
      #wlWrap .wl-ec .zn .st { font-size:10.5px; padding:2px 7px; }
      #wlWrap .wl-ec .rw .k { font-size:14px; }
      #wlWrap .wl-ec .rw .v { font-size:24px; }
      #wlWrap .wl-ec .rw .v small { font-size:12px; }
      #wlWrap .wl-proc { grid-template-columns:repeat(2,1fr); gap:12px; }

      /* ★ KPI 5장은 어떤 폭에서도 한 줄을 지킨다.
           2줄이 되면 「오늘의 숫자」가 두 덩어리로 갈라져
           멀리서 훑을 때 한눈에 안 들어온다.
           칸을 늘리는 대신 카드 폭과 글자를 줄인다. */
      #wlWrap .wl-kpis { grid-template-columns:repeat(5,1fr); gap:9px; }
      #wlWrap .wl-kpi  { padding:9px 11px; }
      #wlWrap .wl-kpi .l { font-size:11.5px; white-space:nowrap;
        overflow:hidden; text-overflow:ellipsis; }
      #wlWrap .wl-kpi .v { font-size:26px; }
      #wlWrap .wl-kpi .v small { font-size:12px; }
    }

    /* 1100 이하 — 2열은 유지하고 안쪽 타일을 줄인다 */
    @media (max-width:1100px){
      /* ★ 1·2공장도 접지 않는다. 나란히 놓아야 두 공장을 「비교」할 수 있다.
           세로로 쌓으면 한 번에 하나씩만 보이고, 벽걸이는 세로가 늘수록 불리하다.
           대신 안쪽 타일을 3열 → 2열로 줄여 폭을 만든다. */
      #wlWrap .wl-fac  { padding:10px 12px; }
      #wlWrap .wl-fac .ft { font-size:12px; margin-bottom:7px; }
      #wlWrap .wl-fac .ft b { font-size:14px; }
      #wlWrap .wl-tiles { grid-template-columns:repeat(2,1fr); gap:8px; }
      #wlWrap .wl-tile { padding:7px 9px; }
      #wlWrap .wl-tile .tn { font-size:12px; }
      #wlWrap .wl-tile .tv { font-size:18px; }
      #wlWrap .wl-tile .tsplit .tv { font-size:15px; }
    }

    /* 992 이하 — 태블릿·좁은 창. 바깥 배치는 그대로, 안쪽만 더 줄인다 */
    @media (max-width:992px){
      #wlWrap { padding:12px; }
      #wlWrap .wl-head { flex-wrap:wrap; gap:10px; }
      #wlWrap .wl-clock { margin-left:0; width:100%; font-size:20px; }
      #wlWrap .wl-env  { gap:7px; }
      #wlWrap .wl-ec   { padding:8px 9px; }
      #wlWrap .wl-ec .zn { font-size:13px; }
      #wlWrap .wl-ec .rw .k { font-size:12px; }
      #wlWrap .wl-ec .rw .v { font-size:19px; }
      #wlWrap .wl-tiles { gap:6px; }
      #wlWrap .wl-ec, #wlWrap .wl-fac { min-height:0; }
      /* 여기서도 1줄 유지. 더 줄일 것은 글자뿐이다 */
      #wlWrap .wl-kpis { gap:7px; }
      #wlWrap .wl-kpi  { padding:7px 8px; }
      #wlWrap .wl-kpi .l { font-size:10.5px; }
      #wlWrap .wl-kpi .v { font-size:21px; }
    }

    /* 640 이하 — 타일 안 2분할(완제품/CK)이 무너진다. 세로로 세운다 */
    @media (max-width:640px){
      /* 폰에서는 4열이 무리다. 여기서만 2열로 */
      #wlWrap .wl-env { grid-template-columns:repeat(2,1fr); }
      #wlWrap .wl-ec .rw .v { font-size:22px; }
      /* 폰에서는 두 공장을 나란히 둘 수 없다. 여기서만 세로로 */
      #wlWrap .wl-proc { grid-template-columns:1fr; }
      #wlWrap .wl-proc .wl-fac + .wl-fac { margin-top:10px; }
      #wlWrap .wl-tile .tsplit { display:block; }
      #wlWrap .wl-tile .tsplit > div + div {
        border-left:0; padding-left:0; margin-top:5px;
        border-top:1px solid #dde3ec; padding-top:5px;
      }
      #wlWrap .wl-tile.on .tsplit > div + div { border-top-color:#bfe6d1; }
      #wlWrap .wl-alarm { font-size:15px; align-items:flex-start; }
      #wlWrap .wl-alarm .cnt { font-size:12px; }
      #wlWrap .wl-kpis { gap:5px; }
      #wlWrap .wl-kpi  { padding:6px 5px; border-radius:10px; }
      #wlWrap .wl-kpi .l { font-size:9px; }
      #wlWrap .wl-kpi .v { font-size:16px; }
      #wlWrap .wl-kpi .v small { font-size:9px; margin-left:1px; }
    }


    /* ── 아래 여백 ──
       ★ 모든 미디어쿼리보다 뒤에 둔다.
         앞에 두면 아래쪽 쿼리의 padding 축약형(padding:12px 등)이
         padding-bottom 까지 덮어써서 여백이 사라진다.
       ★ margin 이 아니라 padding 인 이유: margin collapsing 으로
         부모 바깥으로 빠져나가 자리를 못 만들기 때문이다.
       고정 높이일 때는 JS 가 높이에서 이미 빼므로 스크롤 모드에만 준다. */
    #wlWrap.wl-scroll { padding-bottom:30px; }
  </style>
</head>

<th:block layout:fragment="content">
  <!-- ★ page-title-wrap 을 쓰지 않는다. 벽걸이에서 브레드크럼은 자리만 먹는다 -->
  <div class="layout-contents" style="padding:0; margin:0">
    <!-- ★ section 으로 감싼다.
         .layout-contents 바로 밑에 두면 레이아웃이 붙여 주는 하단 여백을 못 받아
         마지막 카드가 푸터와 붙는다.
         padding 은 0 으로 눌러 벽걸이의 「가장자리까지 꽉 참」은 유지한다. -->
    <section class="section" style="padding:0; margin:0">
      <div id="wlWrap">

        <div class="wl-head">
          <h1>대시보드</h1>
          <span class="wl-live"><i></i><span id="wlUpd">연결 중</span></span>
          <div class="wl-clock"><span class="d" id="wlDate"></span><span id="wlTime"></span></div>
          <button type="button" class="wl-full" id="wlFull" title="전체화면">⛶</button>
        </div>

        <div class="wl-alarm ok" id="wlAlarm">
          <span>정상 운영 중</span>
        </div>

        <div class="wl-body">
          <div class="wl-env" id="wlEnv"></div>
          <div class="wl-proc">
            <div class="wl-fac">
              <div class="ft"><b>1공장</b>BSC 생산</div>
              <div class="wl-tiles" id="wlF1"></div>
            </div>
            <div class="wl-fac">
              <div class="ft"><b>2공장</b>M-CELL</div>
              <div class="wl-tiles" id="wlF2"></div>
            </div>
          </div>
        </div>

        <div class="wl-kpis" id="wlKpis"></div>
      </div>
    </section>
  </div>
</th:block>

<th:block layout:fragment="scripts">
  <script type="text/javascript">
    /* ═══════════════════════════════════════════════════════
       벽걸이 대시보드

       ★ 서버는 dash_main 과 같은 것을 쓴다.
         같은 숫자를 두 화면이 다르게 말하면 안 된다.

       ★ 폴링 30초. 관리자 화면(60초)보다 짧게 잡는다 —
         벽걸이는 사람이 새로고침해 줄 수 없다.

       ★ 탭 숨김 처리는 넣지 않는다.
         벽걸이는 항상 켜져 있는 화면이라 멈추면 그대로 죽은 화면이 된다.
       ═══════════════════════════════════════════════════════ */
    const WL_API     = '/api/dashboard/main';
    const WL_POLL_MS = 30000;
    const WL_SPJANGCD = (typeof SPJANGCD !== 'undefined' && SPJANGCD) ? SPJANGCD : 'ZZ';
    const WL_OPEN_WARN_MIN = 240;

    var wlData = null;

    function wlEsc(v){
      return String(v === null || v === undefined ? '' : v)
              .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function wlNum(v){ return Number(v || 0); }
    function wlPad(n){ return String(n).padStart(2,'0'); }
    function wlHas(v){ return v !== null && v !== undefined && v !== ''; }

    /* ── 시계 ── */
    function wlClock(){
      var tick = function(){
        var d = new Date();
        var days = ['일','월','화','수','목','금','토'];
        document.getElementById('wlDate').textContent =
                d.getFullYear() + '.' + wlPad(d.getMonth()+1) + '.' + wlPad(d.getDate())
                + ' (' + days[d.getDay()] + ')';
        document.getElementById('wlTime').textContent =
                wlPad(d.getHours()) + ':' + wlPad(d.getMinutes());
      };
      tick();
      setInterval(tick, 10000);
    }

    /* ── 조회 ── */
    function wlLoad(){
      if (typeof AjaxUtil === 'undefined' || !AjaxUtil.getAsyncData) return;

      AjaxUtil.getAsyncData(WL_API + '/read', {spjangcd: WL_SPJANGCD}, function(res){
        if (!res || !res.data) {
          /* ★ 화면을 비우지 않는다. 직전 값을 그대로 두고 표시만 바꾼다.
               벽걸이가 통신 한 번 실패로 텅 비면 「공장이 멈춘 것」처럼 보인다. */
          document.getElementById('wlUpd').textContent = '연결 끊김';
          return;
        }
        wlData = res.data;
        wlRender();
        var d = new Date();
        document.getElementById('wlUpd').textContent =
                wlPad(d.getHours()) + ':' + wlPad(d.getMinutes()) + ' 갱신';
      });
    }

    function wlRender(){
      wlEnv(wlData.env || []);
      wlProc(wlData.process_now || []);
      wlKpi(wlData.kpi || {});
      wlAlarm();
    }

    /* ── 클린룸 4존 ──
       벽걸이에서 가장 큰 자리를 준다. 사람이 즉시 대응해야 하는 유일한 값이다.
       생산 수량은 나중에 봐도 되지만 환경 이탈은 지금 조치해야 한다. */
    function wlEnv(zones){
      if (!zones.length) {
        document.getElementById('wlEnv').innerHTML =
                '<div class="wl-ec"><div class="zn">클린룸 정보 없음</div></div>';
        return;
      }

      var row = function(key, unit, val, min, max, digits){
        var has = wlHas(val);
        var v = has ? Number(val) : null;
        var hasRange = wlHas(min) && wlHas(max);
        var bad = has && hasRange && (v < Number(min) || v > Number(max));
        return '<div class="rw ' + (bad ? 'warn' : (has ? '' : 'na')) + '">'
                + '<span class="k">' + key + '</span>'
                + '<span class="v">' + (has ? v.toFixed(digits) : '--')
                + '<small>' + unit + '</small></span></div>';
      };

      document.getElementById('wlEnv').innerHTML = zones.map(function(z){
        var t  = row('온도', '°C', z.temp,  z.temp_min,  z.temp_max,  1);
        var h  = row('습도', '%',  z.humi,  z.humi_min,  z.humi_max,  1);
        var pr = row('차압', 'Pa', z.press, z.press_min, z.press_max, 0);

        var hasAny = wlHas(z.temp) || wlHas(z.humi) || wlHas(z.press);
        var bad = /rw warn/.test(t + h + pr);
        var st = !hasAny ? '<span class="st off">대기</span>'
                : bad     ? '<span class="st bad">이탈</span>'
                        :           '<span class="st">정상</span>';

        return '<div class="wl-ec ' + (bad ? 'bad' : '') + '">'
                + '<div class="zn">' + wlEsc(z.name) + st + '</div>'
                + '<div class="rows">' + t + h + pr + '</div></div>';
      }).join('');
    }

    /* ── 공정 타일 ──
       작업중인지 아닌지가 먼저 보여야 한다. 수량은 그다음이다. */
    function wlProc(procs){
      var wash = wlData.wash_today || {};

      /* ★ 세척·멸균·검사는 mat_produce 가 없어 working_cnt / today_good 이 늘 0 이다
           (dash_main 과 동일 처리). 검사(mc02)는 판정만 하는 공정이라
           산출 품목이 없고, 실적의 진실은 mcell_unit 상태에 있다. */
      var unitMap = {};
      (wlData.unit_states || []).forEach(function(s){ unitMap[s.state] = wlNum(s.cnt); });
      var unitCnt = function(states){
        var n = 0;
        states.forEach(function(k){ n += (unitMap[k] || 0); });
        return n;
      };

      /* ★ 1공장 포장은 CK(반제품)와 키트 결합(완제품)을 둘 다 만든다.
           둘 다 단위가 「개」라 더해도 오류가 안 나고, 그래서 더 위험하다 —
           CK 10 + 완제품 10 이 「20개 생산」으로 읽힌다.
           서버가 today_good_product 를 내릴 때만 나눈다. */
      var packSplit = function(p){
        var pr = p.today_good_product;
        if (pr === null || pr === undefined || pr === '') return null;
        return {prod: wlNum(pr), semi: wlNum(p.today_good_semi)};
      };

      var procWorking = function(p){
        if (p.code === 'bsc01') return wlNum(wash.working_cnt);
        if (p.code === 'bsc04') {
          return (wlData.steril || []).filter(function(b){ return b.state === 'working'; }).length;
        }
        if (p.code === 'mc02') {
          /* 검사 대기 = 검사 자리에 물건이 와 있다는 뜻. 이게 이 공정의 「작업중」이다 */
          return (p.unit_waiting === null || p.unit_waiting === undefined)
                  ? unitCnt(['inspect_wait']) : wlNum(p.unit_waiting);
        }
        return wlNum(p.working_cnt);
      };

      var tile = function(p){
        var working = procWorking(p);
        var split = (p.code === 'bsc05') ? packSplit(p) : null;

        var qty;
        if (p.code === 'bsc01')      qty = wlNum(wash.session_cnt) + '<small>세션</small>';
        else if (p.code === 'bsc04') qty = (wlData.steril || []).length + '<small>배치</small>';
        else if (p.code === 'mc02') {
          /* 판정 끝난 대수 = pass + reject + packed.
             packed 를 빼면 포장까지 간 대수가 검사에서 사라지고(통과했기에 포장된 것),
             reject 를 빼면 검사했지만 떨어진 대수가 증발한다. */
          var done = (p.unit_done === null || p.unit_done === undefined)
                  ? unitCnt(['pass', 'reject', 'packed']) : wlNum(p.unit_done);
          qty = done.toLocaleString() + '<small>대</small>';
        }
        else                         qty = wlNum(p.today_good).toLocaleString() + '<small>개</small>';

        var half = function(label, v){
          return '<div><div class="sl">' + label + '</div>'
                  + '<div class="tv">' + wlNum(v).toLocaleString() + '<small>개</small></div></div>';
        };
        var body = split
                ? '<div class="tsplit">' + half('완제품', split.prod) + half('CK', split.semi) + '</div>'
                : '<div class="tv">' + qty + '</div>';

        return '<div class="wl-tile ' + (working ? 'on' : '') + '">'
                + '<div class="tn">' + wlEsc(p.name) + '</div>'
                + body + '</div>';
      };

      var f1 = procs.filter(function(p){ return wlNum(p.factory_id) === 1; });
      var f2 = procs.filter(function(p){ return wlNum(p.factory_id) === 2; });

      document.getElementById('wlF1').innerHTML =
              f1.length ? f1.map(tile).join('') : '<div class="wl-tile"><div class="tn">공정 없음</div></div>';
      document.getElementById('wlF2').innerHTML =
              f2.length ? f2.map(tile).join('') : '<div class="wl-tile"><div class="tn">공정 없음</div></div>';
    }

    /* ── 하단 KPI ──
       ★ 1공장 「개」와 2공장 「대」를 한 칸에 더하지 않는다. 단위가 다르다.

       ★ 「1공장 완제품」은 공정 합계가 아니다(서버 getKpi 참고).
         전 공정을 더하면 키트 10개가 조립·블리스터·융착·포장에서 각각 세어져
         40개로 보인다. 마지막 공정의 완제품만 센다 — 2공장 「포장 완료」와 같은 축. */
    function wlKpi(k){
      var cells = [];
      cells.push({l:'1공장 완제품',   v:wlNum(k.f1_today_good).toLocaleString(), u:'개', c:'blue'});
      cells.push({l:'2공장 포장 완료', v:wlNum(k.f2_packed).toLocaleString(),     u:'대', c:'teal'});
      cells.push({l:'작업중 차수',     v:wlNum(k.working_sessions),               u:'건', c:'green'});
      cells.push({l:'진행중 작업지시', v:wlNum(k.open_orders),                    u:'건', c:'violet'});
      cells.push({l:'오늘 부적합',     v:wlNum(k.today_defect),                   u:'개', c:'red'});

      document.getElementById('wlKpis').innerHTML = cells.map(function(c){
        return '<div class="wl-kpi ' + c.c + '"><div class="l">' + c.l + '</div>'
                + '<div class="v">' + c.v + '<small>' + c.u + '</small></div></div>';
      }).join('');
    }

    /* ── 이상 알림 ──
       ★ 이상이 없을 때도 띠를 남긴다.
         빈 자리로 두면 「알림이 없는 건지 화면이 죽은 건지」 알 수 없다.
         초록으로 「정상 운영 중」을 보여주는 것 자체가 정보다. */
    function wlAlarm(){
      var msgs = [];

      (wlData.env || []).forEach(function(z){
        var out = function(v, min, max){
          if (!wlHas(v)) return false;
          if (wlHas(min) && Number(v) < Number(min)) return true;
          if (wlHas(max) && Number(v) > Number(max)) return true;
          return false;
        };
        if (out(z.temp, z.temp_min, z.temp_max)
                || out(z.humi, z.humi_min, z.humi_max)
                || out(z.press, z.press_min, z.press_max)) {
          msgs.push(z.name + ' 환경 이탈');
        }
      });

      var fail = (wlData.steril || []).filter(function(b){ return b.bi_result === 'fail'; });
      if (fail.length) msgs.push('멸균 BI 불합격 ' + fail.length + '건');

      var rej = (wlData.unit_states || []).filter(function(s){ return s.state === 'reject'; });
      if (rej.length && wlNum(rej[0].cnt)) msgs.push('검사 불합격 ' + wlNum(rej[0].cnt) + '대');

      var late = (wlData.orders || []).filter(function(o){ return o.is_late === 'Y'; });
      if (late.length) msgs.push('납기 경과 ' + late.length + '건');

      var stale = (wlData.equ_running || []).filter(function(e){
        return wlNum(e.open_min) > WL_OPEN_WARN_MIN;
      });
      if (stale.length) msgs.push('미종료 설비 ' + stale.length + '건');

      var el = document.getElementById('wlAlarm');
      if (!msgs.length) {
        el.className = 'wl-alarm ok';
        el.innerHTML = '<span>정상 운영 중</span>'
                + '<span class="cnt">가동 설비 ' + (wlData.equ_running || []).length + '대</span>';
      } else {
        el.className = 'wl-alarm bad';
        /* 여러 건이면 앞의 두 개만. 벽걸이에서 긴 문장은 안 읽힌다 */
        var head = msgs.slice(0, 2).join('   ·   ');
        el.innerHTML = '<span>⚠ ' + wlEsc(head) + '</span>'
                + (msgs.length > 2 ? '<span class="cnt">외 ' + (msgs.length - 2) + '건</span>' : '');
      }
    }

    /* ── 화면 높이 맞추기 ──
       이 화면은 「아래까지 꽉 차게」가 기본이다.
       그래서 창 높이가 아니라 「이 요소가 실제로 쓸 수 있는 높이」를 잰다.
         쓸 수 있는 높이 = 창 높이 − 요소 시작 위치 − 푸터 높이 − 여백
       상수로 빼면(calc(100vh - 140px)) 탭 줄바꿈·전체화면 전환 때 또 어긋난다.

       잰 높이가 내용이 들어갈 최소치(WL_MIN_H)보다 작으면
       억지로 밀어 넣지 않고 .wl-scroll 을 붙여 세로로 흘린다.
       잘려서 못 보는 것보다 스크롤로 보는 편이 낫다. */
    var WL_MIN_H = 640;
    /* 아래 여백. 푸터가 차지하는 자리까지 포함한 값이다.
       푸터 높이는 고정이라 실측할 것이 없다 —
       레이아웃이 바뀌면 이 숫자 하나만 고치면 된다. */
    var WL_GAP_B = 30;


    function wlFitHeight(){
      var el = document.getElementById('wlWrap');
      if (!el) return;

      /* 전체화면일 때는 이 요소가 곧 화면 전체다. 잴 것이 없다 */
      if (document.fullscreenElement === el) {
        el.classList.remove('wl-scroll');
        el.style.height = '100vh';
        el.style.paddingBottom = '';
        return;
      }

      /* 재기 전에 인라인 높이를 지운다.
         이전에 넣어둔 값이 남아 있으면 시작 위치 계산이 어긋난다. */
      el.style.height = '';
      el.classList.remove('wl-scroll');

      var top = el.getBoundingClientRect().top + window.pageYOffset;
      var h = window.innerHeight - top - WL_GAP_B;

      if (h < WL_MIN_H) {
        /* 애초에 자리가 너무 좁다 — 눌러 담지 않고 흘려보낸다 */
        el.classList.add('wl-scroll');
        return;
      }

      /* ★ 먼저 꽉 채워 본다.
           폭이 좁다고 무조건 스크롤 모드로 보내면
           이번처럼 자리는 남는데 카드만 작아져 아래가 텅 빈다.
           「접혔는가」가 아니라 「실제로 넘치는가」로 판단해야 한다. */
      el.style.height = h + 'px';

      /* 넣어 보고 실제로 넘쳤는지 확인한다.
         scrollHeight 는 내용 전체 높이, clientHeight 는 보이는 높이다.
         2px 은 소수점 반올림 오차용 — 없으면 멀쩡한데도 스크롤로 넘어간다. */
      if (el.scrollHeight > el.clientHeight + 2) {
        el.style.height = '';
        el.classList.add('wl-scroll');
      }
    }

    /* 전체화면 — 벽걸이는 메뉴·주소창이 자리만 먹는다 */
    function wlToggleFull(){
      var el = document.getElementById('wlWrap');
      if (!document.fullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }

    $(document.body).ready(function() {
      wlClock();
      wlLoad();
      setInterval(wlLoad, WL_POLL_MS);
      document.getElementById('wlFull').addEventListener('click', wlToggleFull);

      wlFitHeight();
      window.addEventListener('resize', wlFitHeight);
      /* 전체화면 진입·해제 때도 다시 잰다 — 시작 위치가 통째로 바뀐다 */
      document.addEventListener('fullscreenchange', wlFitHeight);
      /* 레이아웃(탭·푸터)이 조금 늦게 자리를 잡는 경우가 있어 한 번 더 */
      setTimeout(wlFitHeight, 300);
    });
  </script>
</th:block>
</html>
