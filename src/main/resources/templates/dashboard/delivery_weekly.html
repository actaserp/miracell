<html layout:decorate="~{layout_page}">
<head>
  <style>
    /* ===== 상단 툴바 ===== */
    .dash-top {
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; margin-bottom:14px; flex-wrap:wrap;
    }
    .dash-actions { display:inline-flex; gap:6px; }
    .dash-actions .btn {
      height:34px; padding:0 12px; font-size:12px;
      display:inline-flex; align-items:center;
    }
    .upd-time { font-size:11px; color:#aaa; margin-left:8px; white-space:nowrap; }

    /* ===== 주차 네비 ===== */
    .week-nav { display:inline-flex; gap:4px; align-items:center; white-space:nowrap; }
    .week-nav .btn {
      min-width:32px; height:34px; padding:0 8px;
      display:inline-flex; align-items:center; justify-content:center;
      font-size:12px; line-height:1;
    }
    .fac-tab { display:inline-flex; gap:3px; margin-left:14px; }
    .fac-tab .btn { padding:3px 11px; font-size:12px; }
    .fac-tab .btn.is-on { background:#1f5fbf; border-color:#1f5fbf; color:#fff; font-weight:700; }
    #weekLabel {
      display:inline-flex; align-items:center; height:34px; margin-left:4px;
      padding:0 12px; border-radius:4px; background:#F4F6FA; border:1px solid #E1E5EE;
      font-size:13px; font-weight:600; white-space:nowrap;
    }
    #weekLabel .wk-no { color:#1f5fbf; margin-right:6px; }
    #weekLabel .wk-range { color:#777; font-weight:500; }

    /* ===== 대시보드 레이아웃 ===== */
    .dash { display:flex; flex-direction:column; gap:14px; }

    .kpi-row { display:grid; grid-template-columns:repeat(5, 1fr); gap:12px; }
    .kpi {
      background:#fff; border:1px solid #E1E5EE; border-radius:6px;
      padding:14px 16px; display:flex; flex-direction:column; gap:6px;
      border-left:4px solid #C9D2E3;
    }
    .kpi .k-title { font-size:12px; color:#777; }
    .kpi .k-value { font-size:24px; font-weight:700; color:#222; line-height:1.1; }
    .kpi .k-value small { font-size:12px; font-weight:500; color:#999; margin-left:3px; }
    .kpi .k-sub { font-size:11px; color:#999; }
    .kpi.is-primary { border-left-color:#1f5fbf; }
    .kpi.is-primary .k-value { color:#1f5fbf; }
    .kpi.is-warn { border-left-color:#c0392b; }
    .kpi.is-warn .k-value { color:#c0392b; }
    .kpi.is-good { border-left-color:#2e9e5b; }
    .kpi.is-good .k-value { color:#2e9e5b; }

    /* 달성률 게이지 */
    .gauge { height:6px; background:#EEF1F6; border-radius:3px; overflow:hidden; margin-top:2px; }
    .gauge > i { display:block; height:100%; background:#2e9e5b; width:0; transition:width .4s; }

    .panel-row { display:grid; grid-template-columns:2fr 1fr; gap:12px; }
    .panel-row.thirds { grid-template-columns:1fr 1fr 1fr; }

    .panel { background:#fff; border:1px solid #E1E5EE; border-radius:6px; display:flex; flex-direction:column; }
    .panel > header {
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 14px; border-bottom:1px solid #EEF1F6;
    }
    .panel > header h3 { font-size:13px; font-weight:700; color:#333; margin:0; }
    .panel > header .p-sub { font-size:11px; color:#999; }
    .panel > .p-body { padding:12px 14px; flex:1; min-height:0; }

    /* 요일 스트립 */
    .day-strip { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
    .day-cell {
      border:1px solid #E9EDF4; border-radius:5px; padding:10px 6px; text-align:center;
      background:#FBFCFE;
    }
    .day-cell .d-name { font-size:12px; font-weight:700; color:#555; }
    .day-cell .d-date { font-size:11px; color:#aaa; margin-bottom:6px; }
    .day-cell .d-qty { font-size:17px; font-weight:700; color:#222; }
    .day-cell .d-amt { font-size:11px; color:#888; }
    .day-cell.is-weekend .d-name { color:#c0392b; }
    .day-cell.is-today { border-color:#1f5fbf; background:#F2F7FF; }
    .day-cell.is-empty .d-qty { color:#ccc; }

    /* 리스트형 패널 */
    .rank-list { list-style:none; margin:0; padding:0; }
    .rank-list li {
      display:flex; align-items:center; gap:8px;
      padding:7px 0; border-bottom:1px dashed #EEF1F6; font-size:12px;
    }
    .rank-list li:last-child { border-bottom:0; }
    .rank-list .r-no {
      width:18px; height:18px; flex:none; border-radius:3px; background:#EEF1F6;
      color:#666; font-size:11px; font-weight:700; display:inline-flex;
      align-items:center; justify-content:center;
    }
    .rank-list li:nth-child(1) .r-no { background:#1f5fbf; color:#fff; }
    .rank-list .r-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .rank-list .r-val { font-weight:700; color:#333; }
    .rank-list .r-bar { width:70px; height:5px; background:#EEF1F6; border-radius:3px; flex:none; }
    .rank-list .r-bar > i { display:block; height:100%; background:#8FB2E8; border-radius:3px; }

    .risk-list li .r-val { color:#c0392b; }
    .risk-list li .r-days { font-size:11px; color:#999; }

    .empty-msg { text-align:center; color:#bbb; font-size:12px; padding:24px 0; }

    /* ★ 차트가 카드보다 넓어지지 않게.
       Wijmo FlexChart 는 자체 최소 폭을 가져서, 컨테이너가 좁아지면
       컨테이너를 밀어내고 가로 스크롤을 만든다.
       min-width:0 으로 그 하한을 풀어야 카드와 같이 줄어든다. */
    #chartWeek, #chartTrend {
      width:100%; min-width:0; max-width:100%; overflow:hidden;
    }
    #chartWeek  { height:230px; }
    #chartTrend { height:200px; }
    #chartWeek .wj-flexchart, #chartTrend .wj-flexchart,
    .wj-flexchart { min-width:0 !important; }

    /* ★ CSS Grid 는 자식이 요구하는 최소 폭을 보장하려 한다.
       min-width:0 을 안 주면 셀 자체가 안 줄어들어 페이지에 가로 스크롤이 생긴다. */
    .panel-row > *, .panel { min-width:0; }
    .panel > .p-body { min-width:0; overflow:hidden; }

    @media (max-width:1400px) {
      .kpi-row { grid-template-columns:repeat(3,1fr); }
      .panel-row, .panel-row.thirds { grid-template-columns:1fr; }
    }

    /* ================================================================
       인쇄 (A4 세로)

       화면용 CSS 를 그대로 출력하면 잘린다. 원인이 두 가지다.
        ① 레이아웃 템플릿이 html/body/.layout-contents 에 height:100% 와
           overflow 를 걸어 「한 화면」을 만든다. 종이는 그 한 화면만 찍고 끝난다.
        ② 패널·리스트에 고정 높이가 있어 스크롤로 보던 부분이 사라진다.
       아래에서 둘 다 푼다.
       ================================================================ */
    @media print {

      /* ① 높이·스크롤 잠금 해제 — 이걸 안 풀면 아래가 통째로 안 찍힌다 */
      html, body,
      .layout-contents, .layout-content, .content-wrap, .container-fluid,
      .section, .dash-body {
        height: auto !important;
        max-height: none !important;
        min-height: 0 !important;
        overflow: visible !important;
        position: static !important;
      }

      /* 조작용 요소는 종이에 필요 없다 */
      .dash-actions, .week-nav .btn, .fac-tab, .upd-time,
      .page-navi, .bookmark, .gnb, .lnb, .header, .footer, .sidebar {
        display: none !important;
      }

      /* ② 고정 높이 해제 */
      .panel > .p-body,
      .rank-list, .risk-list, .day-strip {
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
      }

      /* ★ 세로 A4 는 폭이 좁다. 2단 이상은 글자가 뭉갠다 → 전부 1단 */
      .kpi-row { grid-template-columns: repeat(3, 1fr) !important; }
      .panel-row, .panel-row.thirds { grid-template-columns: 1fr !important; }

      /* ★ 쪼개지면 못 읽는 단위는 통째로 다음 장으로 */
      .panel, .kpi, .day-cell {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      /* ★ 차트 크기는 CSS 로 강제하지 않는다.
         svg 에 height 를 !important 로 눌러도 Wijmo 가 계산해 둔 내부 좌표는
         원래 높이 그대로라, 겉껍데기만 눌리고 위쪽만 보이며 잘린다.
         인쇄 직전에 컨테이너 높이를 실제로 바꾸고 다시 그리게 한다(아래 JS).
         여기서는 폭이 카드를 넘지 않게만 잡아둔다. */
      #chartWeek, #chartTrend { width: 100% !important; max-width: 100% !important; }

      /* 배경색이 빠지면 KPI 구분이 사라진다 */
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

      body { background: #fff; }
      .layout-contents { padding: 0 !important; }
      .panel { margin-bottom: 8px; }
    }
    @page { size: A4 portrait; margin: 10mm; }
  </style>
</head>

<th:block layout:fragment="scripts">
  <script type="text/javascript">

    class DeliveryWeeklyDashboard {
      constructor() {
        this.url = '/api/dashboard/delivery_weekly';
        this.weekStart = null;
        this.weekEnd = null;
        this.rows = [];       // 원시 라인 데이터
        this.factoryId = '';  // '' = 전체 / '1' / '2'
        this.chartWeek = null;
        this.chartTrend = null;
        this.init();
      }

      /* ===== 날짜 유틸 ===== */
      static fmt(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }
      static short(d) {
        return `${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
      }
      static addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
      static toDate(v) { const d = new Date(v); return isNaN(d.getTime()) ? new Date() : d; }
      static getMonday(d) {
        const r = new Date(d);
        const day = r.getDay();
        r.setDate(r.getDate() + (day === 0 ? -6 : 1 - day));
        r.setHours(0, 0, 0, 0);
        return r;
      }
      static getWeekNo(d) {
        const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        const dayNum = t.getUTCDay() || 7;
        t.setUTCDate(t.getUTCDate() + 4 - dayNum);
        const ys = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
        return Math.ceil(((t - ys) / 86400000 + 1) / 7);
      }
      static num(v) { const n = Number(String(v ?? '').replace(/,/g, '')); return Number.isFinite(n) ? n : 0; }
      static fmtNum(v) { return DeliveryWeeklyDashboard.num(v).toLocaleString('ko-KR'); }

      init() {
        const _this = this;
        const C = DeliveryWeeklyDashboard;

        this.initCharts();

        $('#btnPrevWeek').click(() => { _this.setWeek(C.addDays(_this.weekStart, -7)); _this.loadData(); });
        $('#btnNextWeek').click(() => { _this.setWeek(C.addDays(_this.weekStart, 7)); _this.loadData(); });
        $('#btnThisWeek').click(() => { _this.setWeek(new Date()); _this.loadData(); });
        $('#btnRefresh').click(() => _this.loadData());

        // 공장 탭. 품목의 Factory_id 로 가른다 (수주·출고에는 공장 컬럼이 없다)
        $('#facTab').on('click', '.btn', function () {
          const fac = $(this).data('fac');
          _this.factoryId = (fac === '' || fac == null) ? '' : String(fac);
          $('#facTab .btn').removeClass('is-on');
          $(this).addClass('is-on');
          _this.loadData();
        });
        $('#btnDetailList').click(() => _this.showDetailList());
        /* 인쇄. 차트 크기 보정은 ResizeObserver 가 알아서 한다
           (인쇄용 CSS 로 패널 폭이 바뀌면 옵저버가 그걸 감지해 다시 그린다).
           다만 다시 그릴 틈을 주지 않으면 이전 그림이 찍히므로 약간 늦춰 호출한다. */
        /* ★ 인쇄용 차트 크기 조정.

           CSS 로 svg 높이를 눌러도 Wijmo 의 내부 좌표는 안 바뀌어 위쪽만 찍힌다.
           컨테이너의 실제 인라인 높이를 바꾼 뒤 refresh() 해야 좌표까지 다시 잡힌다.
           인쇄가 끝나면 되돌린다. */
        const PRINT_H = { chartWeek: 150, chartTrend: 130 };

        const applyPrintSize = (on) => {
          Object.keys(PRINT_H).forEach(id => {
            const el = document.getElementById(id);
            if (el) el.style.height = on ? (PRINT_H[id] + 'px') : '';
          });
          [_this.chartWeek, _this.chartTrend].forEach(ch => {
            if (!ch) return;
            try { ch.refresh(true); } catch (e) { }
          });
        };

        $('#btnPrint').click(() => {
          applyPrintSize(true);
          setTimeout(() => {
            window.print();
            setTimeout(() => applyPrintSize(false), 500);
          }, 400);
        });

        // Ctrl+P 대비
        window.addEventListener('beforeprint', () => applyPrintSize(true));
        window.addEventListener('afterprint',  () => applyPrintSize(false));

        // 요일 카드 클릭 → 해당 일자 상세
        $('#dayStrip').on('click', '.day-cell', function () {
          const idx = Number($(this).data('idx'));
          _this.showDetailList(idx);
        });
      }

      initCharts() {
        this.chartWeek = new wijmo.chart.FlexChart('#chartWeek', {
          chartType: wijmo.chart.ChartType.Column,
          bindingX: 'label',
          series: [
            { name: '수주', binding: 'planQty' },
            { name: '실적', binding: 'actualQty' }
          ],
          legend: { position: wijmo.chart.Position.Bottom },
          palette: ['#C9D6EA', '#1f5fbf'],
          axisY: { majorGrid: true, format: 'n0' },
          itemsSource: []
        });

        this.chartTrend = new wijmo.chart.FlexChart('#chartTrend', {
          /* ★ Spline 이 아니라 Line 을 쓴다.
             스플라인은 점 사이를 곡선으로 잇는데, 66 → 0 → 16 처럼 값이 급변하면
             곡선이 관성으로 0 아래까지 휜다. 납품수량에 음수는 없으므로 거짓 그림이다.
             주간 집계처럼 값이 뚝뚝 끊기는 데이터는 직선이 정직하다. */
          chartType: wijmo.chart.ChartType.LineSymbols,
          bindingX: 'label',
          series: [{ name: '납품수량', binding: 'qty' }],
          legend: { position: wijmo.chart.Position.None },
          palette: ['#2e9e5b'],
          axisY: { majorGrid: true, format: 'n0', min: 0 },   // 하한 고정
          itemsSource: []
        });

        this.observeChartResize();
      }

      /**
       * ★ 차트를 반응형으로 만든다.
       *
       * Wijmo FlexChart 는 「생성 시점의 컨테이너 폭」으로 SVG 를 한 번 그려두고
       * 그 뒤로는 스스로 따라가지 않는다. 그래서 창을 줄여도 그림이 그대로 남아
       * 카드 밖으로 삐져나가고, 인쇄에서 패널이 좁아질 때도 같은 일이 벌어진다.
       * 인쇄만 따로 손보면 증상만 가리게 되므로 여기서 한 번에 푼다.
       *
       * ResizeObserver 로 컨테이너 폭 변화를 직접 보고 다시 그린다.
       * → 창 크기 조절 · 사이드바 접힘 · 인쇄 레이아웃 전환이 모두 같은 경로를 탄다.
       */
      observeChartResize() {
        const charts = [
          { el: document.getElementById('chartWeek'),  get: () => this.chartWeek },
          { el: document.getElementById('chartTrend'), get: () => this.chartTrend }
        ];

        const redraw = (ch) => {
          if (!ch) return;
          try { ch.refresh(true); } catch (e) {
            try { ch.invalidate(true); } catch (e2) { }
          }
        };

        if (typeof ResizeObserver === 'undefined') {
          // 구형 브라우저 대비 — 창 크기 변화만이라도 잡는다
          let t = null;
          $(window).on('resize', () => {
            clearTimeout(t);
            t = setTimeout(() => charts.forEach(c => redraw(c.get())), 150);
          });
          return;
        }

        charts.forEach(c => {
          if (!c.el) return;
          let timer = null;
          let lastW = 0, lastH = 0;
          const ro = new ResizeObserver(entries => {
            const w = Math.round(entries[0].contentRect.width);
            const h = Math.round(entries[0].contentRect.height);
            /* ★ 높이 변화도 본다. 인쇄용 CSS 는 폭이 아니라 높이를 바꾸는데,
               폭만 보면 「변화 없음」으로 판단해 다시 그리지 않는다. */
            if ((!w && !h) || (w === lastW && h === lastH)) return;
            lastW = w; lastH = h;
            /* 디바운스 — 드래그로 창을 줄이는 동안 매 픽셀마다 다시 그리면 버벅인다.
               그리고 refresh() 자체가 크기를 바꿔 옵저버를 다시 부르는 것도 막는다. */
            clearTimeout(timer);
            timer = setTimeout(() => redraw(c.get()), 120);
          });
          ro.observe(c.el);
        });
      }

      setWeek(baseDate) {
        const C = DeliveryWeeklyDashboard;
        this.weekStart = C.getMonday(baseDate);
        this.weekEnd = C.addDays(this.weekStart, 6);

        $('#weekLabel').html(
                `<span class="wk-no">${this.weekStart.getFullYear()}년 ${C.getWeekNo(this.weekStart)}주차</span>` +
                `<span class="wk-range">${C.short(this.weekStart)} ~ ${C.short(this.weekEnd)}</span>`
        );
      }

      loadData() {
        const _this = this;
        const C = DeliveryWeeklyDashboard;

        const data = {
          start: C.fmt(this.weekStart),
          end: C.fmt(this.weekEnd),
          action: 'read'
        };
        /* 전체(빈 값)면 파라미터를 아예 뺀다.
           빈 문자열을 보내면 서버의 CAST(:factory_id AS integer) 에서 터진다. */
        if (this.factoryId) data.factory_id = this.factoryId;

        AjaxUtil.getAsyncData(this.url + '/dashboard', data, function (result) {
          const res = result?.data ?? {};
          _this.rows = Array.isArray(res.lines) ? res.lines : (Array.isArray(res) ? res : []);
          _this.render(res);

          const now = new Date();
          $('#updTime').text(
                  `갱신 ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`
          );
        });

        // 최근 8주 추이 (별도 호출)
        const trendParam = { end: C.fmt(this.weekEnd), weeks: 8 };
        if (this.factoryId) trendParam.factory_id = this.factoryId;

        AjaxUtil.getAsyncData(this.url + '/trend', trendParam, function (result) {
          const list = (result?.data ?? []).map(t => ({
            label: t.label ?? t.week_start ?? '',
            qty: C.num(t.qty ?? t.Qty)
          }));
          _this.chartTrend.itemsSource = list;
        });
      }

      /* ===== 라인 데이터에서 집계 ===== */
      aggregate() {
        const C = DeliveryWeeklyDashboard;
        const keys = ['d1','d2','d3','d4','d5','d6','d7'];

        const dayQty = keys.map(k => this.rows.reduce((a, r) => a + C.num(r[k]), 0));
        const dayPlan = keys.map((k, i) => this.rows.reduce((a, r) => a + C.num(r['p' + (i + 1)]), 0));

        /* ★ 달성률의 분자·분모는 반드시 같은 모집단이어야 한다.
           전에는 분자에 주간 출고 전체(수주 없는 출고 포함), 분모에 수주량만 넣어서
           수주 10 · 출고 16 일 때 160% 가 나오고 Math.min 에 잘려 100% 로 보였다.
           수주는 하나도 안 나갔는데 「달성 100%」가 뜬 것이다. */
        const sujuRows = this.rows.filter(r => r.src !== 'ship');
        /* 지연 = 납기가 조회 주간보다 이전인데 아직 안 나간 건.
           서버가 lines 안에 is_late='Y' 로 함께 준다(따로 받으면 두 번 세어진다). */
        const lateRows = sujuRows.filter(r => r.is_late === 'Y');   // 납기 지남
        const weekRows = sujuRows.filter(r => r.is_late === 'N');   // 이번 주 납기
        /* is_late==='F' = 선출고. 납기는 아직인데 이번 주에 미리 나간 건.
           수주수량·미납에는 안 넣는다(이번 주 몫이 아니다).
           다만 실제로 나간 물량이므로 달성률 분자에는 들어간다. */

        const remainOf = r => (r.RemainQty != null
                ? C.num(r.RemainQty)
                : Math.max(0, C.num(r.OrderQty) - C.num(r.TotalDeliveryQty)));

        /* 수주수량·달성률은 「이번 주 납기」만. 그 주의 성과를 보는 값이라
           과거 누적이 끼면 주차별 비교가 안 된다. */
        const orderQty = weekRows.reduce((a, r) => a + C.num(r.OrderQty), 0);
        const lateQty  = lateRows.reduce((a, r) => a + remainOf(r), 0);
        const lateCnt  = lateRows.filter(r => remainOf(r) > 0).length;
        const deliveryQty = dayQty.reduce((a, b) => a + b, 0);   // 주간 출고 전체(KPI 표시용)

        /* 이번 주에 실제로 나간 수주분. 수주 없는 출고(src='ship')는 뺀다 */
        const sujuShipped = sujuRows.reduce(
                (a, r) => a + keys.reduce((b, k) => b + C.num(r[k]), 0), 0);

        /* ★ 미납수량만은 「지금 안 나간 물량 전부」다(지연 포함).
           주마다 모집단이 바뀌는 값이면 439 → 10 처럼 뚝 떨어져 보여
           주차를 넘겨 추적할 수가 없다. 재고처럼 잔량으로 읽히는 값이라
           누적이 맞다. 그중 얼마가 이미 늦었는지는 옆 KPI(납기초과)가 말한다. */
        const remainQty = sujuRows
                .filter(r => r.is_late !== 'F')          // 납기 전인 건은 아직 미납이 아니다
                .reduce((a, r) => a + remainOf(r), 0);
        /* ★ 달성률 = 이번 주 처리해야 했던 물량 중 실제로 나간 비율.

           분모 = 지금 미납 잔량 + 이번 주 나간 수주분
                = 이번 주 시작 시점의 「처리 대상」
           분자 = 이번 주 나간 수주분

           「그 주 납기 수주 대비」로 잡으면 수주가 주당 1~2 건뿐이라
           0% 아니면 100% 로만 튀어 지표가 안 된다.
           미납을 누적으로 바꿨으니 달성률도 같은 모집단이어야 함께 읽힌다.

           ※ 업계 표준 OTD 는 건 단위(납기 내 출고 건수 / 납기 도래 건수)다.
             수주 건수가 늘면 그쪽으로 바꾸는 게 맞다. */
        const target = remainQty + sujuShipped;
        const rate = target > 0
                ? Math.min(100, Math.round(sujuShipped / target * 1000) / 10)
                : 0;

        return { dayQty, dayPlan, orderQty, deliveryQty, remainQty, rate,
          sujuShipped, target, sujuCnt: weekRows.length, lateQty, lateCnt };
      }

      render(res) {
        const agg = this.aggregate();
        this.renderKpi(agg, res);
        this.renderDayStrip(agg);
        this.renderWeekChart(agg);
        this.renderRanks();
        this.renderRisk();
      }

      renderKpi(agg, res) {
        const C = DeliveryWeeklyDashboard;
        const prev = res?.prevWeek ?? {};

        const diffText = (cur, prevVal) => {
          const p = C.num(prevVal);
          if (!p) return '전주 대비 -';
          const diff = Math.round((cur - p) / p * 1000) / 10;
          const sign = diff > 0 ? '▲' : (diff < 0 ? '▼' : '-');
          return `전주 대비 ${sign} ${Math.abs(diff)}%`;
        };

        /* ★ 수주가 0 건인 주에 「0」을 찍으면 「이번주 납품이 없다」로 읽힌다.
           실제로는 「수주를 등록하지 않았다」다. 다른 얘기라 '-' 로 구분한다. */
        /* ★ 건수는 agg.sujuCnt(=이번 주 납기 건)를 쓴다.
           rows 를 직접 세면 지연 건(is_late='Y')까지 포함되어
           「수주수량 10 · 수주건 8건」처럼 수량과 건수가 다른 모집단이 된다. */
        const shipRows = this.rows.filter(r => r.src === 'ship');
        $('#kpiOrderQty').text(agg.sujuCnt ? C.fmtNum(agg.orderQty) : '-');
        $('#kpiOrderSub').text(agg.sujuCnt
                ? `수주건 ${agg.sujuCnt}건`
                : (shipRows.length ? '이번 주 납기 수주 없음' : '등록된 수주 없음'));

        $('#kpiDeliveryQty').text(C.fmtNum(agg.deliveryQty));
        $('#kpiDeliverySub').text(diffText(agg.deliveryQty, prev.DeliveryQty));

        /* 미납 = 지금 안 나간 물량 전부. 납기초과는 그 안의 부분집합이다 */
        const remainCnt = this.rows.filter(r =>
                r.src !== 'ship' && r.is_late !== 'F'
                && (r.RemainQty != null ? C.num(r.RemainQty)
                        : C.num(r.OrderQty) - C.num(r.TotalDeliveryQty)) > 0).length;
        $('#kpiRemainQty').text(C.fmtNum(agg.remainQty));
        $('#kpiRemainSub').text(`미납 ${remainCnt}건`
                + (agg.lateCnt ? ` · 그중 납기초과 ${C.fmtNum(agg.lateQty)}` : ''));

        /* 달성률 = 이번 주 나간 수주분 / (미납 잔량 + 이번 주 나간 수주분) */
        if (agg.target > 0) {
          $('#kpiRate').html(`${agg.rate}<small>%</small>`);
          $('#kpiRateBar').css('width', agg.rate + '%');
        } else {
          /* 처리 대상 자체가 없는 주. 0% 로 찍으면 「못 했다」로 읽힌다 */
          $('#kpiRate').html('-');
          $('#kpiRateBar').css('width', '0%');
        }

        $('#kpiLateQty').text(agg.lateCnt ? C.fmtNum(agg.lateQty) : '0');
        $('#kpiLateSub').text(agg.lateCnt ? `${agg.lateCnt}건 미출고` : '없음');
      }

      renderDayStrip(agg) {
        const C = DeliveryWeeklyDashboard;
        const names = ['월', '화', '수', '목', '금', '토', '일'];
        const todayStr = C.fmt(new Date());
        const $strip = $('#dayStrip').empty();

        for (let i = 0; i < 7; i++) {
          const d = C.addDays(this.weekStart, i);
          const qty = agg.dayQty[i];
          const cls = [
            'day-cell',
            (i >= 5 ? 'is-weekend' : ''),
            (C.fmt(d) === todayStr ? 'is-today' : ''),
            (qty === 0 ? 'is-empty' : '')
          ].join(' ').trim();

          $strip.append(
                  `<div class="${cls}" data-idx="${i}">` +
                  `<div class="d-name">${names[i]}</div>` +
                  `<div class="d-date">${d.getMonth() + 1}/${d.getDate()}</div>` +
                  `<div class="d-qty">${qty ? C.fmtNum(qty) : '-'}</div>` +
                  '</div>'
          );
        }

        const peak = agg.dayQty.indexOf(Math.max(...agg.dayQty));
        $('#dayStripSub').text(
                agg.dayQty[peak] > 0 ? `최다 납품: ${names[peak]}요일 ${C.fmtNum(agg.dayQty[peak])}` : ''
        );
      }

      renderWeekChart(agg) {
        const C = DeliveryWeeklyDashboard;
        const names = ['월', '화', '수', '목', '금', '토', '일'];
        this.chartWeek.itemsSource = names.map((n, i) => ({
          label: `${n} ${C.short(C.addDays(this.weekStart, i))}`,
          planQty: agg.dayPlan[i],
          actualQty: agg.dayQty[i]
        }));
      }

      renderRanks() {
        const C = DeliveryWeeklyDashboard;
        const keys = ['d1','d2','d3','d4','d5','d6','d7'];
        const weekQty = (r) => keys.reduce((a, k) => a + C.num(r[k]), 0);

        const top = (field) => {
          const map = new Map();
          this.rows.forEach(r => {
            const k = String(r[field] ?? '').trim() || '(미지정)';
            map.set(k, (map.get(k) || 0) + weekQty(r));
          });
          return [...map.entries()]
                  .filter(([, v]) => v > 0)
                  .sort((a, b) => b[1] - a[1])
                  .slice(0, 5);
        };

        const paint = ($el, list) => {
          $el.empty();
          if (!list.length) {
            $el.append('<li class="empty-msg">데이터가 없습니다.</li>');
            return;
          }
          const max = list[0][1] || 1;
          list.forEach(([name, val], i) => {
            $el.append(
                    '<li>' +
                    `<span class="r-no">${i + 1}</span>` +
                    `<span class="r-name" title="${name}">${name}</span>` +
                    `<span class="r-bar"><i style="width:${Math.round(val / max * 100)}%"></i></span>` +
                    `<span class="r-val">${C.fmtNum(val)}</span>` +
                    '</li>'
            );
          });
        };

        paint($('#rankCompany'), top('CompanyName'));
        paint($('#rankProduct'), top('product_name'));
      }

      /**
       * 미납·지연.
       *  ★ 이번 주 미납과 지연(is_late='Y')을 한 목록에 담는다.
       *    이번 주 화면만 보면 지난주에 놓친 건을 영영 못 본다. D-day 순 정렬이라
       *    납기 지난 건이 자연히 맨 위로 온다.
       *  ★ 수주 없는 출고행(src='ship')은 제외한다 — OrderQty 가 0 이라 미납 개념이 없다.
       */
      renderRisk() {
        const C = DeliveryWeeklyDashboard;
        const today = new Date(); today.setHours(0, 0, 0, 0);

        /* 지연 건도 lines 안에 함께 온다(is_late='Y').
           납기가 이미 지난 건은 dday 가 음수라 정렬만으로 위로 올라온다. */
        const list = this.rows
                .filter(r => r.src !== 'ship' && r.DueDate)
                .map(r => {
                  const remain = r.RemainQty != null
                          ? C.num(r.RemainQty)
                          : Math.max(0, C.num(r.OrderQty) - C.num(r.TotalDeliveryQty));
                  const due = C.toDate(r.DueDate);
                  const dday = Math.round((due - today) / 86400000);
                  return { name: `${r.CompanyName ?? ''} / ${r.product_name ?? ''}`, remain, dday };
                })
                .filter(x => x.remain > 0)
                .sort((a, b) => (a.dday ?? 999) - (b.dday ?? 999))
                .slice(0, 6);

        const $el = $('#riskList').empty();
        if (!list.length) {
          $el.append('<li class="empty-msg">미납 건이 없습니다.</li>');
          $('#riskSub').text('');
          return;
        }

        const lateCnt = list.filter(x => x.dday != null && x.dday < 0).length;
        $('#riskSub').text(lateCnt ? `납기초과 ${lateCnt}건` : '');

        list.forEach((x, i) => {
          const dd = x.dday == null ? ''
                  : (x.dday < 0 ? `D+${Math.abs(x.dday)} 초과` : (x.dday === 0 ? 'D-DAY' : `D-${x.dday}`));
          $el.append(
                  '<li>' +
                  `<span class="r-no">${i + 1}</span>` +
                  `<span class="r-name" title="${x.name}">${x.name}</span>` +
                  `<span class="r-days">${dd}</span>` +
                  `<span class="r-val">${C.fmtNum(x.remain)}</span>` +
                  '</li>'
          );
        });
      }

      /* ===== 상세목록 팝업 ===== */
      showDetailList(dayIdx) {
        const C = DeliveryWeeklyDashboard;
        const $content = $(tmpl('detailListTemplate', {}));
        const title = (dayIdx != null)
                ? `납품 상세 (${C.fmt(C.addDays(this.weekStart, dayIdx))})`
                : '주간 납품 상세목록';
        const modal = new PopupDraggable(title);
        modal.open({ width: 1300, height: 600, $content });

        const src = (dayIdx != null)
                ? this.rows.filter(r => C.num(r['d' + (dayIdx + 1)]) > 0)
                : this.rows.slice();

        const names = ['월', '화', '수', '목', '금', '토', '일'];
        const cols = [
          { binding: 'srcLabel',     header: '구분',     width: 70,  align: 'center' },
          { binding: 'CompanyName',  header: '판매처',   width: 170, align: 'left' },
          { binding: 'product_code', header: '코드',     width: 100, align: 'center' },
          { binding: 'product_name', header: '품목',     width: 220, align: 'left' },
          { binding: 'Standard',     header: '규격',     width: 100, align: 'center' },
          { binding: 'UnitName',     header: '단위',     width: 60,  align: 'center' },
          { binding: 'DueDate',      header: '납기일',   width: 100, align: 'center' },
          { binding: 'OrderQty',     header: '수주수량', width: 90,  align: 'right', format: 'n2' }
        ];
        /* ★ 특정 일자를 골라 들어왔으면 그 요일 컬럼만 남긴다.
           7 일치를 다 보여주면 「8/10 을 눌렀는데 왜 주 전체가 나오나」가 된다.
           행은 이미 걸러져 있지만, 그 행이 다른 날에도 나갔으면 숫자가 같이 보여
           지금 무엇을 보고 있는지 알 수 없다. */
        if (dayIdx != null) {
          cols.push({
            binding: 'd' + (dayIdx + 1),
            header: `${names[dayIdx]} ${C.short(C.addDays(this.weekStart, dayIdx))} 납품`,
            width: 110, align: 'right', format: 'n2'
          });
        } else {
          for (let i = 0; i < 7; i++) {
            cols.push({
              binding: 'd' + (i + 1),
              header: `${names[i]} ${C.short(C.addDays(this.weekStart, i))}`,
              width: 84, align: 'right', format: 'n2'
            });
          }
          cols.push({ binding: 'WeekQty', header: '주간납품', width: 95, align: 'right', format: 'n2' });
        }
        cols.push({ binding: 'RemainQty', header: '미납수량', width: 95, align: 'right', format: 'n2' });
        cols.push({ binding: 'Description', header: '비고', width: '*' });

        const rows = src.map(r => {
          const week = ['d1','d2','d3','d4','d5','d6','d7'].reduce((a, k) => a + C.num(r[k]), 0);
          return Object.assign({}, r, {
            srcLabel: (r.src === 'ship' ? '출고' : '수주'),
            WeekQty: week,
            RemainQty: r.RemainQty != null ? C.num(r.RemainQty)
                    : Math.max(0, C.num(r.OrderQty) - C.num(r.TotalDeliveryQty))
          });
        });

        const grid = new wijmo.grid.FlexGrid($content.find('#detailGrid')[0], {
          selectionMode: wijmo.grid.SelectionMode.Row,
          headersVisibility: wijmo.grid.HeadersVisibility.Column,
          autoGenerateColumns: false,
          isReadOnly: true,
          columns: cols,
          itemsSource: rows
        });
        new FlexGridContextMenu(grid);
        grid.downloadFileName = '주간납품상세';

        grid.formatItem.addHandler((s, e) => {
          if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
            e.cell.style.textAlign = 'center';
          }
          if (e.panel.cellType === wijmo.grid.CellType.Cell) {
            const item = s.rows[e.row]?.dataItem;
            if (item && s.columns[e.col].binding === 'RemainQty' && C.num(item.RemainQty) > 0) {
              e.cell.style.color = '#c0392b';
              e.cell.style.fontWeight = 'bold';
            }
          }
        });

        $content.on('click', '#btnDetailExcel', function () {
          wijmo.grid.xlsx.FlexGridXlsxConverter.saveAsync(
                  grid, { includeColumnHeaders: true }, `주간납품상세_${C.fmt(new Date())}.xlsx`
          );
        });
        $content.on('click', '#modal-close-button', () => modal.close());
      }
    }

    let page = null;

    $(document).ready(function () {
      page = new DeliveryWeeklyDashboard();
      page.setWeek(new Date());
      page.loadData();
    });
  </script>
</th:block>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</html>
