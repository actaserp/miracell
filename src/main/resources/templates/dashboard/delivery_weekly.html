<html layout:decorate="~{layout_page}">
<head>
  <style>
      /* ===== 상단 툴바 ===== */
      .dash-top {
          display:flex; align-items:center; justify-content:space-between;
          gap:12px; margin-bottom:14px; flex-wrap:wrap;
      }
      .dash-actions { display:inline-flex; gap:6px; }
      .dash-actions .btn {
          height:34px; padding:0 12px; font-size:12px;
          display:inline-flex; align-items:center;
      }
      .upd-time { font-size:11px; color:#aaa; margin-left:8px; white-space:nowrap; }

      /* ===== 주차 네비 ===== */
      .week-nav { display:inline-flex; gap:4px; align-items:center; white-space:nowrap; }
      .week-nav .btn {
          min-width:32px; height:34px; padding:0 8px;
          display:inline-flex; align-items:center; justify-content:center;
          font-size:12px; line-height:1;
      }
      #weekLabel {
          display:inline-flex; align-items:center; height:34px; margin-left:4px;
          padding:0 12px; border-radius:4px; background:#F4F6FA; border:1px solid #E1E5EE;
          font-size:13px; font-weight:600; white-space:nowrap;
      }
      #weekLabel .wk-no { color:#1f5fbf; margin-right:6px; }
      #weekLabel .wk-range { color:#777; font-weight:500; }

      /* ===== 대시보드 레이아웃 ===== */
      .dash { display:flex; flex-direction:column; gap:14px; }

      .kpi-row { display:grid; grid-template-columns:repeat(5, 1fr); gap:12px; }
      .kpi {
          background:#fff; border:1px solid #E1E5EE; border-radius:6px;
          padding:14px 16px; display:flex; flex-direction:column; gap:6px;
          border-left:4px solid #C9D2E3;
      }
      .kpi .k-title { font-size:12px; color:#777; }
      .kpi .k-value { font-size:24px; font-weight:700; color:#222; line-height:1.1; }
      .kpi .k-value small { font-size:12px; font-weight:500; color:#999; margin-left:3px; }
      .kpi .k-sub { font-size:11px; color:#999; }
      .kpi.is-primary { border-left-color:#1f5fbf; }
      .kpi.is-primary .k-value { color:#1f5fbf; }
      .kpi.is-warn { border-left-color:#c0392b; }
      .kpi.is-warn .k-value { color:#c0392b; }
      .kpi.is-good { border-left-color:#2e9e5b; }
      .kpi.is-good .k-value { color:#2e9e5b; }

      /* 달성률 게이지 */
      .gauge { height:6px; background:#EEF1F6; border-radius:3px; overflow:hidden; margin-top:2px; }
      .gauge > i { display:block; height:100%; background:#2e9e5b; width:0; transition:width .4s; }

      .panel-row { display:grid; grid-template-columns:2fr 1fr; gap:12px; }
      .panel-row.thirds { grid-template-columns:1fr 1fr 1fr; }

      .panel { background:#fff; border:1px solid #E1E5EE; border-radius:6px; display:flex; flex-direction:column; }
      .panel > header {
          display:flex; align-items:center; justify-content:space-between;
          padding:10px 14px; border-bottom:1px solid #EEF1F6;
      }
      .panel > header h3 { font-size:13px; font-weight:700; color:#333; margin:0; }
      .panel > header .p-sub { font-size:11px; color:#999; }
      .panel > .p-body { padding:12px 14px; flex:1; min-height:0; }

      /* 요일 스트립 */
      .day-strip { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
      .day-cell {
          border:1px solid #E9EDF4; border-radius:5px; padding:10px 6px; text-align:center;
          background:#FBFCFE;
      }
      .day-cell .d-name { font-size:12px; font-weight:700; color:#555; }
      .day-cell .d-date { font-size:11px; color:#aaa; margin-bottom:6px; }
      .day-cell .d-qty { font-size:17px; font-weight:700; color:#222; }
      .day-cell .d-amt { font-size:11px; color:#888; }
      .day-cell.is-weekend .d-name { color:#c0392b; }
      .day-cell.is-today { border-color:#1f5fbf; background:#F2F7FF; }
      .day-cell.is-empty .d-qty { color:#ccc; }

      /* 리스트형 패널 */
      .rank-list { list-style:none; margin:0; padding:0; }
      .rank-list li {
          display:flex; align-items:center; gap:8px;
          padding:7px 0; border-bottom:1px dashed #EEF1F6; font-size:12px;
      }
      .rank-list li:last-child { border-bottom:0; }
      .rank-list .r-no {
          width:18px; height:18px; flex:none; border-radius:3px; background:#EEF1F6;
          color:#666; font-size:11px; font-weight:700; display:inline-flex;
          align-items:center; justify-content:center;
      }
      .rank-list li:nth-child(1) .r-no { background:#1f5fbf; color:#fff; }
      .rank-list .r-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .rank-list .r-val { font-weight:700; color:#333; }
      .rank-list .r-bar { width:70px; height:5px; background:#EEF1F6; border-radius:3px; flex:none; }
      .rank-list .r-bar > i { display:block; height:100%; background:#8FB2E8; border-radius:3px; }

      .risk-list li .r-val { color:#c0392b; }
      .risk-list li .r-days { font-size:11px; color:#999; }

      .empty-msg { text-align:center; color:#bbb; font-size:12px; padding:24px 0; }

      #chartWeek { height:230px; }
      #chartTrend { height:200px; }

      @media (max-width:1400px) {
          .kpi-row { grid-template-columns:repeat(3,1fr); }
          .panel-row, .panel-row.thirds { grid-template-columns:1fr; }
      }
  </style>
</head>

<th:block layout:fragment="scripts">
  <script type="text/javascript">

   class DeliveryWeeklyDashboard {
    constructor() {
     this.url = '/api/sales/delivery_weekly';
     this.weekStart = null;
     this.weekEnd = null;
     this.rows = [];       // 원시 라인 데이터
     this.chartWeek = null;
     this.chartTrend = null;
     this.init();
    }

    /* ===== 날짜 유틸 ===== */
    static fmt(d) {
     return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    static short(d) {
     return `${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
    }
    static addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
    static toDate(v) { const d = new Date(v); return isNaN(d.getTime()) ? new Date() : d; }
    static getMonday(d) {
     const r = new Date(d);
     const day = r.getDay();
     r.setDate(r.getDate() + (day === 0 ? -6 : 1 - day));
     r.setHours(0, 0, 0, 0);
     return r;
    }
    static getWeekNo(d) {
     const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
     const dayNum = t.getUTCDay() || 7;
     t.setUTCDate(t.getUTCDate() + 4 - dayNum);
     const ys = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
     return Math.ceil(((t - ys) / 86400000 + 1) / 7);
    }
    static num(v) { const n = Number(String(v ?? '').replace(/,/g, '')); return Number.isFinite(n) ? n : 0; }
    static fmtNum(v) { return DeliveryWeeklyDashboard.num(v).toLocaleString('ko-KR'); }

    init() {
     const _this = this;
     const C = DeliveryWeeklyDashboard;

     this.initCharts();

     $('#btnPrevWeek').click(() => { _this.setWeek(C.addDays(_this.weekStart, -7)); _this.loadData(); });
     $('#btnNextWeek').click(() => { _this.setWeek(C.addDays(_this.weekStart, 7)); _this.loadData(); });
     $('#btnThisWeek').click(() => { _this.setWeek(new Date()); _this.loadData(); });
     $('#btnRefresh').click(() => _this.loadData());
     $('#btnDetailList').click(() => _this.showDetailList());
     $('#btnPrint').click(() => window.print());

     // 요일 카드 클릭 → 해당 일자 상세
     $('#dayStrip').on('click', '.day-cell', function () {
      const idx = Number($(this).data('idx'));
      _this.showDetailList(idx);
     });
    }

    initCharts() {
     this.chartWeek = new wijmo.chart.FlexChart('#chartWeek', {
      chartType: wijmo.chart.ChartType.Column,
      bindingX: 'label',
      series: [
       { name: '계획', binding: 'planQty' },
       { name: '실적', binding: 'actualQty' }
      ],
      legend: { position: wijmo.chart.Position.Bottom },
      palette: ['#C9D6EA', '#1f5fbf'],
      axisY: { majorGrid: true, format: 'n0' },
      itemsSource: []
     });

     this.chartTrend = new wijmo.chart.FlexChart('#chartTrend', {
      chartType: wijmo.chart.ChartType.SplineSymbols,
      bindingX: 'label',
      series: [{ name: '납품수량', binding: 'qty' }],
      legend: { position: wijmo.chart.Position.None },
      palette: ['#2e9e5b'],
      axisY: { majorGrid: true, format: 'n0' },
      itemsSource: []
     });
    }

    setWeek(baseDate) {
     const C = DeliveryWeeklyDashboard;
     this.weekStart = C.getMonday(baseDate);
     this.weekEnd = C.addDays(this.weekStart, 6);

     $('#weekLabel').html(
      `<span class="wk-no">${this.weekStart.getFullYear()}년 ${C.getWeekNo(this.weekStart)}주차</span>` +
      `<span class="wk-range">${C.short(this.weekStart)} ~ ${C.short(this.weekEnd)}</span>`
     );
    }

    loadData() {
     const _this = this;
     const C = DeliveryWeeklyDashboard;

     const data = {
      start: C.fmt(this.weekStart),
      end: C.fmt(this.weekEnd),
      action: 'read'
     };

     AjaxUtil.getAsyncData(this.url + '/dashboard', data, function (result) {
      const res = result?.data ?? {};
      _this.rows = Array.isArray(res.lines) ? res.lines : (Array.isArray(res) ? res : []);
      _this.render(res);

      const now = new Date();
      $('#updTime').text(
       `갱신 ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`
      );
     });

     // 최근 8주 추이 (별도 호출)
     AjaxUtil.getAsyncData(this.url + '/trend', {
      end: C.fmt(this.weekEnd), weeks: 8
     }, function (result) {
      const list = (result?.data ?? []).map(t => ({
       label: t.label ?? `${t.WeekNo ?? ''}주`,
       qty: C.num(t.Qty ?? t.qty)
      }));
      _this.chartTrend.itemsSource = list;
     });
    }

    /* ===== 라인 데이터에서 집계 ===== */
    aggregate() {
     const C = DeliveryWeeklyDashboard;
     const keys = ['d1','d2','d3','d4','d5','d6','d7'];

     const dayQty = keys.map(k => this.rows.reduce((a, r) => a + C.num(r[k]), 0));
     const dayPlan = keys.map((k, i) => this.rows.reduce((a, r) => a + C.num(r['p' + (i + 1)]), 0));
     const dayAmt = keys.map((k) => this.rows.reduce((a, r) => a + C.num(r[k]) * C.num(r.UnitPrice), 0));

     const orderQty = this.rows.reduce((a, r) => a + C.num(r.OrderQty), 0);
     const deliveryQty = dayQty.reduce((a, b) => a + b, 0);
     const remainQty = this.rows.reduce((a, r) => {
      const rem = r.RemainQty != null
       ? C.num(r.RemainQty)
       : Math.max(0, C.num(r.OrderQty) - C.num(r.TotalDeliveryQty));
      return a + rem;
     }, 0);
     const amount = dayAmt.reduce((a, b) => a + b, 0);
     const rate = orderQty > 0 ? Math.min(100, Math.round(deliveryQty / orderQty * 1000) / 10) : 0;

     return { dayQty, dayPlan, dayAmt, orderQty, deliveryQty, remainQty, amount, rate };
    }

    render(res) {
     const agg = this.aggregate();
     this.renderKpi(agg, res);
     this.renderDayStrip(agg);
     this.renderWeekChart(agg);
     this.renderRanks();
     this.renderRisk();
    }

    renderKpi(agg, res) {
     const C = DeliveryWeeklyDashboard;
     const prev = res?.prevWeek ?? {};

     const diffText = (cur, prevVal) => {
      const p = C.num(prevVal);
      if (!p) return '전주 대비 -';
      const diff = Math.round((cur - p) / p * 1000) / 10;
      const sign = diff > 0 ? '▲' : (diff < 0 ? '▼' : '-');
      return `전주 대비 ${sign} ${Math.abs(diff)}%`;
     };

     $('#kpiOrderQty').text(C.fmtNum(agg.orderQty));
     $('#kpiOrderSub').text(`수주건 ${this.rows.length}건`);

     $('#kpiDeliveryQty').text(C.fmtNum(agg.deliveryQty));
     $('#kpiDeliverySub').text(diffText(agg.deliveryQty, prev.DeliveryQty));

     const remainCnt = this.rows.filter(r =>
      (r.RemainQty != null ? C.num(r.RemainQty)
       : C.num(r.OrderQty) - C.num(r.TotalDeliveryQty)) > 0).length;
     $('#kpiRemainQty').text(C.fmtNum(agg.remainQty));
     $('#kpiRemainSub').text(`미납 ${remainCnt}건`);

     $('#kpiRate').html(`${agg.rate}<small>%</small>`);
     $('#kpiRateBar').css('width', agg.rate + '%');

     $('#kpiAmount').text(C.fmtNum(agg.amount));
     $('#kpiAmountSub').text(diffText(agg.amount, prev.Amount));
    }

    renderDayStrip(agg) {
     const C = DeliveryWeeklyDashboard;
     const names = ['월', '화', '수', '목', '금', '토', '일'];
     const todayStr = C.fmt(new Date());
     const $strip = $('#dayStrip').empty();

     for (let i = 0; i < 7; i++) {
      const d = C.addDays(this.weekStart, i);
      const qty = agg.dayQty[i];
      const amt = agg.dayAmt[i];
      const cls = [
       'day-cell',
       (i >= 5 ? 'is-weekend' : ''),
       (C.fmt(d) === todayStr ? 'is-today' : ''),
       (qty === 0 ? 'is-empty' : '')
      ].join(' ').trim();

      $strip.append(
       `<div class="${cls}" data-idx="${i}">` +
       `<div class="d-name">${names[i]}</div>` +
       `<div class="d-date">${d.getMonth() + 1}/${d.getDate()}</div>` +
       `<div class="d-qty">${qty ? C.fmtNum(qty) : '-'}</div>` +
       `<div class="d-amt">${amt ? C.fmtNum(amt) + '원' : '&nbsp;'}</div>` +
       '</div>'
      );
     }

     const peak = agg.dayQty.indexOf(Math.max(...agg.dayQty));
     $('#dayStripSub').text(
      agg.dayQty[peak] > 0 ? `최다 납품: ${names[peak]}요일 ${C.fmtNum(agg.dayQty[peak])}` : ''
     );
    }

    renderWeekChart(agg) {
     const C = DeliveryWeeklyDashboard;
     const names = ['월', '화', '수', '목', '금', '토', '일'];
     this.chartWeek.itemsSource = names.map((n, i) => ({
      label: `${n} ${C.short(C.addDays(this.weekStart, i))}`,
      planQty: agg.dayPlan[i],
      actualQty: agg.dayQty[i]
     }));
    }

    renderRanks() {
     const C = DeliveryWeeklyDashboard;
     const keys = ['d1','d2','d3','d4','d5','d6','d7'];
     const weekQty = (r) => keys.reduce((a, k) => a + C.num(r[k]), 0);

     const top = (field) => {
      const map = new Map();
      this.rows.forEach(r => {
       const k = String(r[field] ?? '').trim() || '(미지정)';
       map.set(k, (map.get(k) || 0) + weekQty(r));
      });
      return [...map.entries()]
      .filter(([, v]) => v > 0)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 5);
     };

     const paint = ($el, list) => {
      $el.empty();
      if (!list.length) {
       $el.append('<li class="empty-msg">데이터가 없습니다.</li>');
       return;
      }
      const max = list[0][1] || 1;
      list.forEach(([name, val], i) => {
       $el.append(
        '<li>' +
        `<span class="r-no">${i + 1}</span>` +
        `<span class="r-name" title="${name}">${name}</span>` +
        `<span class="r-bar"><i style="width:${Math.round(val / max * 100)}%"></i></span>` +
        `<span class="r-val">${C.fmtNum(val)}</span>` +
        '</li>'
       );
      });
     };

     paint($('#rankCompany'), top('CompanyName'));
     paint($('#rankProduct'), top('product_name'));
    }

    renderRisk() {
     const C = DeliveryWeeklyDashboard;
     const today = new Date(); today.setHours(0, 0, 0, 0);

     const list = this.rows.map(r => {
      const remain = r.RemainQty != null
       ? C.num(r.RemainQty)
       : Math.max(0, C.num(r.OrderQty) - C.num(r.TotalDeliveryQty));
      const due = r.DueDate ? C.toDate(r.DueDate) : null;
      const dday = due ? Math.round((due - today) / 86400000) : null;
      return { name: `${r.CompanyName ?? ''} / ${r.product_name ?? ''}`, remain, dday };
     })
     .filter(x => x.remain > 0)
     .sort((a, b) => (a.dday ?? 999) - (b.dday ?? 999))
     .slice(0, 6);

     const $el = $('#riskList').empty();
     if (!list.length) {
      $el.append('<li class="empty-msg">미납 건이 없습니다.</li>');
      $('#riskSub').text('');
      return;
     }

     const overdue = list.filter(x => x.dday != null && x.dday < 0).length;
     $('#riskSub').text(overdue ? `납기초과 ${overdue}건` : '');

     list.forEach((x, i) => {
      const dd = x.dday == null ? ''
       : (x.dday < 0 ? `D+${Math.abs(x.dday)} 초과` : (x.dday === 0 ? 'D-DAY' : `D-${x.dday}`));
      $el.append(
       '<li>' +
       `<span class="r-no">${i + 1}</span>` +
       `<span class="r-name" title="${x.name}">${x.name}</span>` +
       `<span class="r-days">${dd}</span>` +
       `<span class="r-val">${C.fmtNum(x.remain)}</span>` +
       '</li>'
      );
     });
    }

    /* ===== 상세목록 팝업 ===== */
    showDetailList(dayIdx) {
     const C = DeliveryWeeklyDashboard;
     const $content = $(tmpl('detailListTemplate', {}));
     const title = (dayIdx != null)
      ? `납품 상세 (${C.fmt(C.addDays(this.weekStart, dayIdx))})`
      : '주간 납품 상세목록';
     const modal = new PopupDraggable(title);
     modal.open({ width: 1300, height: 600, $content });

     const src = (dayIdx != null)
      ? this.rows.filter(r => C.num(r['d' + (dayIdx + 1)]) > 0)
      : this.rows.slice();

     const names = ['월', '화', '수', '목', '금', '토', '일'];
     const cols = [
      { binding: 'CompanyName',  header: '판매처',   width: 170, align: 'left' },
      { binding: 'product_code', header: '코드',     width: 100, align: 'center' },
      { binding: 'product_name', header: '품목',     width: 220, align: 'left' },
      { binding: 'Standard',     header: '규격',     width: 100, align: 'center' },
      { binding: 'UnitName',     header: '단위',     width: 60,  align: 'center' },
      { binding: 'DueDate',      header: '납기일',   width: 100, align: 'center' },
      { binding: 'OrderQty',     header: '수주수량', width: 90,  align: 'right', format: 'n2' }
     ];
     for (let i = 0; i < 7; i++) {
      cols.push({
       binding: 'd' + (i + 1),
       header: `${names[i]} ${C.short(C.addDays(this.weekStart, i))}`,
       width: 84, align: 'right', format: 'n2'
      });
     }
     cols.push({ binding: 'WeekQty',   header: '주간납품', width: 95, align: 'right', format: 'n2' });
     cols.push({ binding: 'RemainQty', header: '미납수량', width: 95, align: 'right', format: 'n2' });
     cols.push({ binding: 'Description', header: '비고', width: '*' });

     const rows = src.map(r => {
      const week = ['d1','d2','d3','d4','d5','d6','d7'].reduce((a, k) => a + C.num(r[k]), 0);
      return Object.assign({}, r, {
       WeekQty: week,
       RemainQty: r.RemainQty != null ? C.num(r.RemainQty)
        : Math.max(0, C.num(r.OrderQty) - C.num(r.TotalDeliveryQty))
      });
     });

     const grid = new wijmo.grid.FlexGrid($content.find('#detailGrid')[0], {
      selectionMode: wijmo.grid.SelectionMode.Row,
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false,
      isReadOnly: true,
      columns: cols,
      itemsSource: rows
     });
     new FlexGridContextMenu(grid);
     grid.downloadFileName = '주간납품상세';

     grid.formatItem.addHandler((s, e) => {
      if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
       e.cell.style.textAlign = 'center';
      }
      if (e.panel.cellType === wijmo.grid.CellType.Cell) {
       const item = s.rows[e.row]?.dataItem;
       if (item && s.columns[e.col].binding === 'RemainQty' && C.num(item.RemainQty) > 0) {
        e.cell.style.color = '#c0392b';
        e.cell.style.fontWeight = 'bold';
       }
      }
     });

     $content.on('click', '#btnDetailExcel', function () {
      wijmo.grid.xlsx.FlexGridXlsxConverter.saveAsync(
       grid, { includeColumnHeaders: true }, `주간납품상세_${C.fmt(new Date())}.xlsx`
      );
     });
     $content.on('click', '#modal-close-button', () => modal.close());
    }
   }

   let page = null;

   $(document).ready(function () {
    page = new DeliveryWeeklyDashboard();
    page.setWeek(new Date());
    page.loadData();
   });
  </script>
</th:block>
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</html>
