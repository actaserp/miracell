<html layout:decorate="~{layout_page}">
<head>
    <style>
        .button140px{
            width: 140px;
        }
        .wp100per {
            width: 100% !important;
        }
        #wj-popup {
            border: 1px solid #aaa;
            background-color: #fdfdfd;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }
        .btn-code-action {
            padding: 2px 6px;
            font-size: 12px;
            height: 24px;
            line-height: 1;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }

        .btn-code-action-white {
            padding: 2px 6px;
            font-size: 12px;
            height: 24px;
            line-height: 1;
            border: 1px solid black;
            border-radius: 4px;
            background-color: white;
            color: black;
            cursor: pointer;
        }

        .wijmo-cltcd-input {
            width: 100%;
            border: none !important;
            text-align: center;
            background-color: white;
        }

        .wijmo-cltcd-div {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .eq-sum { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:10px; margin:12px 0; }
        .eq-card { background:#fff; border:1px solid #e2e6ee; border-radius:10px; padding:12px 14px; }
        .eq-card .nm { font-size:12px; font-weight:800; color:#3a4759; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .eq-card .rt { font-size:22px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums; color:#2f6fed; }
        .eq-card .rt small { font-size:12px; color:#8a94a4; margin-left:2px; }
        .eq-card .sub { font-size:11px; color:#8a94a4; margin-top:3px; }
        .eq-card .open { display:inline-block; margin-top:5px; font-size:10.5px; font-weight:800;
            padding:2px 7px; border-radius:5px; background:#fff7ed; color:#b4560a; }
        .eq-warn { background:#fff7ed; border:1px solid #f6dfc2; color:#b4560a; border-radius:8px;
            padding:9px 13px; font-size:12.5px; font-weight:700; margin-bottom:10px; }
        .row-open { background-color:#fff7ed !important; }

        .row-red {
            background-color: #EDEFF5 !important;
            color: black;
            font-weight: bold;
        }
    </style>
</head>

            searchMainData() {
                let _this = this;
                let startDate = $('#date_from').val();
                let endDate = $('#date_to').val();

                if (!startDate || !endDate) {
                    Alert.alert('', '조회 기간을 선택하세요.');
                    return;
                }

                let param = {
                    'date_from': startDate,
                    'date_to': endDate,
                };

                let resp = null;
                try {
                    resp = AjaxUtil.getSyncData(_this.baseUrl + '/read', param);
                } catch (err) {
                    console.error('[equ_run] read', err);
                }
                if (!resp || !resp.data) {
                    $('#eqWarn').html('<div class="eq-warn">조회에 실패했습니다.</div>');
                    return;
                }

                let rows = resp.data.rows || [];
                let summary = resp.data.summary || [];

                // 상태 라벨 — DB 값은 run / complete 다.
                // 이전에는 서버가 전부 'run' 으로 덮어써서 이 칼럼이 무의미했다.
                rows.forEach(function (r) {
                    r.state_label = (r.is_open === 'Y') ? '진행중' : '완료';
                });

                _this.viewData.sourceCollection = rows;
                _this.grid.invalidate();

                _this.renderSummary(summary);

                this.chart.updateOptions({
                    xaxis: {
                        min: Date.parse(startDate + ' 00:00:00'),
                        max: Date.parse(endDate + ' 23:59:59')
                    }
                });

                if (rows.length) {
                    let series = [{data: []}];
                    rows.forEach(function (e) {
                        // 열린 구간은 주황. now() 까지 그리되 합계에는 안 들어간다
                        let color = (e.is_open === 'Y') ? '#e8833a' : '#008FFB';
                        series[0].data.push({
                            x: e.Name,
                            y: [
                                Date.parse(e.StartDate),
                                e.EndDate ? Date.parse(e.EndDate) : Date.now()
                            ],
                            fillColor: color
                        });
                    });
                    this.chart.updateSeries(series);
                } else {
                    this.chart.updateSeries([{
                        data: [
                            {x: '설비1(샘플)', y: [null, null]},
                            {x: '설비2(샘플)', y: [null, null]},
                            {x: '설비3(샘플)', y: [null, null]},
                        ]
                    }]);
                }
            }

            /**
             * 설비별 가동률 요약.
             *
             * ★ 가동시간은 구간 합집합(union)이다. 단순 합이 아니다.
             *   세척 세션 1건이 품목 10종이면 equ_run 10건이 전부 겹쳐서 생기고,
             *   단순 합으로 세면 2분짜리 작업이 15분으로 보고된다.
             *
             * ★ 미종료 구간은 합계에서 뺀다. now() 까지 쳐서 넣으면
             *   유령 한 건이 그 설비 가동률을 100% 로 만든다.
             *   대신 배지로 몇 건인지 알려서 사람이 고칠 수 있게 한다.
             */
            renderSummary(summary) {
                let esc = function (v) {
                    return String(v === null || v === undefined ? '' : v)
                        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                };

                if (!summary.length) {
                    $('#eqSummary').html('');
                    $('#eqWarn').html('<div class="eq-warn">조회 기간에 설비 가동 기록이 없습니다.</div>');
                    return;
                }

                let openTotal = 0;
                let html = summary.map(function (m) {
                    let open = Number(m.open_cnt || 0);
                    openTotal += open;
                    let badge = open
                        ? '<div class="open">미종료 ' + open + '건 · 합계 제외</div>'
                        : '';
                    return '<div class="eq-card">'
                        + '<div class="nm">' + esc(m.Name) + '</div>'
                        + '<div class="rt">' + Number(m.run_rate || 0).toFixed(1) + '<small>%</small></div>'
                        + '<div class="sub">' + Number(m.run_hour || 0).toFixed(2) + '시간'
                        + ' · 구간 ' + Number(m.row_cnt || 0) + '건'
                        + (Number(m.merged_cnt || 0) && Number(m.merged_cnt) !== Number(m.row_cnt)
                            ? ' (겹침 병합 ' + Number(m.merged_cnt) + ')' : '')
                        + '</div>' + badge + '</div>';
                }).join('');

                $('#eqSummary').html(html);

                $('#eqWarn').html(openTotal
                    ? '<div class="eq-warn">⚠ 종료되지 않은 구간이 ' + openTotal + '건 있습니다 — '
                    + '주황색 행입니다. 작업이 진행중이면 정상이고, 취소된 작업이면 삭제해 주세요. '
                    + '가동시간·가동률에는 포함되지 않습니다.</div>'
                    : '');
            }

            /**
             * 시각 수정.
             *
             * ★ 신규 등록은 열지 않는다. equ_run 은 생산 시작·완료가 만든다.
             *   화면에서 새로 만들면 입력 경로가 둘이 되고, 어느 것이 실제 가동인지
             *   가릴 방법이 없어진다(출처 컬럼이 없다).
             *   설비도 바꾸지 않는다 — 다른 기계에서 났다는 주장은 실적 쪽에서 고칠 일이다.
             */
            editDataBind() {
                let _this = this;
                let sel = this.grid.selectedItems;
                let row = (sel && sel.length > 0) ? sel[0] : null;

                if (!row || !row.id) {
                    Alert.alert('', '수정할 가동 구간을 선택하세요.');
                    return;
                }

                let content = tmpl('addDataPopup', {});
                let $content = $(content);
                let form = $('#equipmentStopForm');

                modalContainer = new PopupDraggable('가동 시각 수정 — ' + (row.Name || ''));
                modalContainer.open({width: 720, height: 430, $content});
                popup = new equipmentStopPopup();

                $content.find('#id').val(row.id);

                // 설비는 표시만. 바꿀 수 없다
                let $equipment = $content.find('#Equipment_id');
                AjaxUtil.fillSelectOptions($equipment, 'equipment', false, row.Equipment_id);
                $equipment.val(row.Equipment_id);
                $equipment.prop('disabled', true);

                $content.find('#start_date').val(row.start_date);
                $content.find('#end_date').val(row.end_date || '');

                $content.find('#StartTime').timepicker({
                    show2400: true, timeFormat: 'H:i'
                }).val(row.StartTime);

                $content.find('#EndTime').timepicker({
                    show2400: true, timeFormat: 'H:i'
                }).val(row.EndTime || '');

                $content.find('#Description').val(row.Description || '');

                $content.find('#btnSave').on('click', function () {
                    popup.saveData(form, modalContainer.modal);
                });
            }

            delDataBind() {
                let _this = this;
                let sel = this.grid.selectedItems;
                let row = (sel && sel.length > 0) ? sel[0] : null;

                if (!row || !row.id) {
                    Alert.alert('', '삭제할 가동 구간을 선택하세요.');
                    return;
                }

                let fnSuccess = function (res) {
                    if (!res.success) {
                        Alert.alert('', res.message);
                    } else {
                        Notify.success('삭제되었습니다');
                        page.searchMainData();
                    }
                };

                // 정상 구간을 지우면 그만큼 가동시간이 사라진다. 한 번 더 묻는다
                let msg = (row.is_open === 'Y')
                    ? '종료되지 않은 구간입니다. 취소된 작업이면 삭제해도 됩니다. 삭제할까요?'
                    : '이 구간을 삭제하면 그만큼 가동시간이 줄어듭니다. 삭제할까요?';

                Alert.confirm('', msg,
                    function () {
                        AjaxUtil.postAsyncData(_this.baseUrl + '/delData', {id: row.id}, fnSuccess);
                    },
                    function () {
                    }
                );
            }
        }

        class equipmentStopPopup {
            constructor() {
                this.grid = null;
                this.baseUrl = '/api/production/equipment_run_chart';
                this.init();
            }

            init() {
                let _this = this;

            }

            saveData(form, modal) {
                let _this = this;
                let data = FormUtil.extractForm($('#equipmentStopForm'));

                if (!data.id) {
                    Alert.alert('', '대상을 찾을 수 없습니다. 목록을 새로고침해 주세요.');
                    return;
                }
                if (!data.start_date || !data.StartTime) {
                    Alert.alert('', '시작 일자와 시간을 입력해주세요.');
                    return;
                }

                // 종료를 비우면 「아직 진행중」으로 되돌린다.
                // 잘못 닫힌 구간을 되살릴 수 있어야 하므로 허용한다.
                let hasEnd = !!(data.end_date && data.EndTime);
                if (hasEnd) {
                    let s1 = Date.parse(data.start_date + ' ' + data.StartTime);
                    let e1 = Date.parse(data.end_date + ' ' + data.EndTime);
                    if (s1 >= e1) {
                        Alert.alert('', '종료가 시작보다 빠르거나 같습니다.');
                        return;
                    }
                } else if (data.end_date || data.EndTime) {
                    Alert.alert('', '종료 일자와 시간을 함께 입력하거나, 둘 다 비워 진행중으로 두세요.');
                    return;
                }

                let fnSuccess = function (res) {
                    if (!res.success) {
                        Alert.alert('', res.message);
                    } else {
                        // 겹침은 차단하지 않는다. 있으면 메시지로만 알린다
                        Notify.success(res.message || '저장되었습니다');
                        page.searchMainData();
                        modal.close();
                    }
                };

                AjaxUtil.postAsyncData(_this.baseUrl + '/addData', data, fnSuccess);
            }
        }

        let page = null;
        let popup = null;
        let modalContainer = null;

        $(document.body).ready(function (e) {
            page = new equipmentOpertationChart();

            let today = CommonUtil.getYYYYMMDD();
            console.log('todya', today);

            $('#date_from').val(today);
            $('#date_to').val(today);

            // 검색
            $('#btnSearch').click(function (e) {
                page.searchMainData();
            });

            // 변경
            $('#btnEdit').click(function (e) {
                page.editDataBind();
            });

            // 삭제
            $('#btnDel').click(function (e) {
                page.delDataBind();
            });

            page.searchMainData();

        });

    </script>
