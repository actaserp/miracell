<html layout:decorate="~{layout_page}">
<head>
    <style>
        .button140px{
            width: 140px;
        }
        .wp100per {
            width: 100% !important;
        }
        #wj-popup {
            border: 1px solid #aaa;
            background-color: #fdfdfd;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }
        .btn-code-action {
            padding: 2px 6px;
            font-size: 12px;
            height: 24px;
            line-height: 1;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }

        .btn-code-action-white {
            padding: 2px 6px;
            font-size: 12px;
            height: 24px;
            line-height: 1;
            border: 1px solid black;
            border-radius: 4px;
            background-color: white;
            color: black;
            cursor: pointer;
        }

        .wijmo-cltcd-input {
            width: 100%;
            border: none !important;
            text-align: center;
            background-color: white;
        }

        .wijmo-cltcd-div {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        /* 설비 요약 — 카드 대신 가로 막대.
           설비가 9대라 카드로 깔면 화면이 길어지고, 무엇보다 떨어져 있는 상자끼리는
           84.2% 와 79.5% 의 대소가 눈에 안 들어온다. 막대는 길이가 곧 비교다. */
        .eq-sum { display:grid; grid-template-columns:repeat(auto-fill, minmax(330px,1fr));
            gap:2px 22px; margin:12px 0; }
        .eq-row { display:flex; align-items:center; gap:9px; padding:5px 2px;
            border-bottom:1px solid #f0f2f6; }
        .eq-row .nm { flex:0 0 96px; font-size:11.5px; font-weight:700; color:#3a4759;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .eq-row .bar { flex:1 1 auto; height:8px; background:#eef1f6; border-radius:4px;
            overflow:hidden; }
        .eq-row .bar i { display:block; height:100%; background:#2f6fed; border-radius:4px; }
        .eq-row .bar i.low { background:#c9ced8; }   /* 30% 미만은 회색 — 파란 막대 사이에서 걸린다 */
        .eq-row .rt { flex:0 0 52px; text-align:right; font-size:13px; font-weight:800;
            color:#2f3d52; font-variant-numeric:tabular-nums; }
        .eq-row .rt small { font-size:10px; color:#8a94a4; margin-left:1px; }
        .eq-row .hr { flex:0 0 56px; text-align:right; font-size:11px; color:#8a94a4;
            font-variant-numeric:tabular-nums; }
        .eq-row .open { flex:0 0 auto; font-size:10px; font-weight:800; padding:1px 5px;
            border-radius:4px; background:#fff7ed; color:#b4560a; }
        .eq-warn { background:#fff7ed; border:1px solid #f6dfc2; color:#b4560a; border-radius:8px;
            padding:9px 13px; font-size:12.5px; font-weight:700; margin-bottom:10px; }
        .row-open { background-color:#fff7ed !important; }

        .row-red {
            background-color: #EDEFF5 !important;
            color: black;
            font-weight: bold;
        }
        #tabAuto .ea-sum { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
        @media (max-width:900px){ #tabAuto .ea-sum { grid-template-columns:repeat(2,1fr); } }
        #tabAuto .ea-k { background:#fff; border:1px solid #dbe1ea; border-radius:10px; padding:10px 14px; }
        #tabAuto .ea-k .l { font-size:11.5px; font-weight:800; color:#8a94a4; }
        #tabAuto .ea-k .v { font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:2px; }
        #tabAuto .ea-k .v small { font-size:12px; color:#a7b0be; margin-left:3px; }
        #tabAuto .ea-k .s { font-size:11px; color:#8a94a4; font-weight:700; margin-top:2px; }
        #tabAuto .ea-k.warn .v { color:#a45b00; }
        #tabAuto .ea-k.bad .v { color:#d64545; }
        #tabAuto .ea-k.ok .v { color:#0b7a43; }

        #tabAuto .ea-card { background:#fff; border:1px solid #dbe1ea; border-radius:10px; overflow:hidden; }
        #tabAuto .ea-tbl-wrap { max-height:620px; overflow:auto; }
        #tabAuto table.ea-tbl { width:100%; border-collapse:collapse; font-size:12.5px; font-variant-numeric:tabular-nums; }
        #tabAuto .ea-tbl thead { position:sticky; top:0; z-index:1; }
        #tabAuto .ea-tbl th { background:#f7f9fc; border-bottom:1px solid #e5e9f0; padding:7px 8px; font-size:11.5px;
            color:#5b6675; white-space:nowrap; text-align:center; }
        #tabAuto .ea-tbl td { padding:6px 8px; border-bottom:1px solid #f0f2f6; text-align:center; white-space:nowrap; }
        #tabAuto .ea-tbl td.l { text-align:left; }
        #tabAuto .ea-tbl td.n { text-align:right; }
        #tabAuto .ea-tbl td small { color:#8a94a4; margin-left:4px; }
        #tabAuto .chip { display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; }
        #tabAuto .chip.free { background:#fff1d6; color:#a45b00; }
        #tabAuto .chip.working { background:#e6f0ff; color:#2f6fed; }
        #tabAuto .chip.done { background:#e3f5ea; color:#0b7a43; }
        #tabAuto .chip.open { background:#e3f5ea; color:#0b7a43; margin-left:4px; }
        #tabAuto .err { color:#d64545; font-weight:800; }
        #tabAuto .diff { color:#d64545; font-weight:800; }
        #tabAuto .ea-empty { padding:30px; text-align:center; color:#8a94a4; font-size:13px; }

        /* ── 탭: 설비 가동 기록(equ_run) / 자동화 장비 구간(equ_auto_seg) ──
           ★ 둘 다 「설비가 언제 돌았나」라 한 화면에 둔다. 출처가 달라 표는 나눈다.
             가동 기록 = 사람이 완료한 실적이 남긴 구간 / 장비 구간 = PLC 카운트가 만든 구간 */
        .eq-tabs { display:flex; gap:6px; margin:12px 0 4px; border-bottom:2px solid #e5e9f0; }
        .eq-tabs button { border:0; background:none; padding:8px 16px; font-weight:800; font-size:13.5px;
            color:#8a94a4; cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; }
        .eq-tabs button.on { color:#2f6fed; border-bottom-color:#2f6fed; }
        .eq-tabs .cnt { font-size:11px; font-weight:800; padding:1px 7px; border-radius:999px;
            background:#fff1d6; color:#a45b00; margin-left:5px; }
        #tabAuto { display:none; flex-direction:column; gap:10px; margin-top:10px;
            font-family:'Pretendard','Malgun Gothic',sans-serif; color:#1f2733; }
        #tabAuto.on { display:flex; }
        #tabAuto .ea-tool { display:flex; align-items:center; gap:8px; }
        #tabAuto .ea-tool .info { margin-left:auto; font-size:11.5px; color:#8a94a4; font-weight:700; }
        #tabAuto .ea-tool select { height:32px; border:1px solid #d5dbe5; border-radius:6px; padding:0 8px; font-size:13px; }
        #tabAuto .ea-tool .xl { height:32px; border:1px solid #0f9d58; border-radius:6px; padding:0 14px;
            font-weight:800; cursor:pointer; background:#fff; color:#0b7a43; }
        .tab-hide { display:none !important; }
    </style>
</head>

        class equipmentOpertationChart {
            constructor() {
                this.grid = null;
                this.baseUrl = '/api/production/equipment_run_chart';
                this.chart = null;
                this.options = null;

                this.viewData = new wijmo.collections.CollectionView();
                this.init();


            }

            init() {
                let _this = this;

                let today = CommonUtil.getYYYYMMDD();
                // chart
                this.options = {
                    series: [
                        {
                            data: [
                                {x: '설비1(샘플)', y: [null, null]},
                                {x: '설비2(샘플)', y: [null, null]},
                                {x: '설비3(샘플)', y: [null, null]},
                            ]
                        }
                    ],
                    chart: {
                        height: 280,
                        type: "rangeBar",
                        toolbar: {
                            show: true
                        },
                    },
                    plotOptions: {
                        bar: {
                            horizontal: true,
                            barHeight: "60%",
                        }
                    },
                    xaxis: {
                        type: "datetime",
                        labels: {
                            datetimeUTC: false,
                            show: true
                        },
                        min: Date.parse(today + ' 00:00:00'),
                        max: Date.parse(today + ' 23:59:59')
                    },
                    dataLabels: {
                        enabled: true,
                        style: {
                            fontSize: "12px",
                            colors: ["#fff"]
                        },
                        formatter: function (val, opt) {
                            var valDate1 = new Date(val[0]);
                            var valDate2 = new Date(val[1]);
                            var h1 = valDate1.getHours() < 10 ? '0' + valDate1.getHours() : valDate1.getHours();
                            var h2 = valDate2.getHours() < 10 ? '0' + valDate2.getHours() : valDate2.getHours();
                            var m1 = valDate1.getMinutes() < 10 ? '0' + valDate1.getMinutes() : valDate1.getMinutes();
                            var m2 = valDate2.getMinutes() < 10 ? '0' + valDate2.getMinutes() : valDate2.getMinutes();
                            return h1 + ":" + m1 + ' ~ ' + h2 + ":" + m2;
                        },
                    },
                    legend: {
                        position: "top",
                        horizontalAlign: "left"
                    },
                    tooltip: {
                        enabled: true,
                        x: {
                            format: 'yyyy-MM-dd TT hh:mm',
                        },

                    },
                };
                this.chart = new ApexCharts(document.querySelector("#chart"), this.options);
                this.chart.render();


                this.grid = new wijmo.grid.FlexGrid('#theGrid', {
                    selectionMode: wijmo.grid.SelectionMode.Cell,
                    headersVisibility: wijmo.grid.HeadersVisibility.Column,
                    allowMerging: wijmo.grid.AllowMerging.All,
                    autoGenerateColumns: false,
                    showMarquee: true,
                    isReadOnly: true,
                    columns: [
                        {binding: 'id', header: 'id', width: '*', align: 'center', visible: false},
                        {binding: 'Equipment_id', header: '설비아이디', width: '*', align: 'center', visible: false},
                        {binding: 'Name', header: '설비', width: '*', align: 'center', allowMerging: true},
                        {binding: 'state_label', header: '상태', width: 90, align: 'center'},
                        {binding: 'start_date', header: '시작일자', width: '*', align: 'center'},
                        {binding: 'StartTime', header: '시작시간', width: 90, align: 'center'},
                        {binding: 'end_date', header: '종료일자', width: '*', align: 'center'},
                        {binding: 'EndTime', header: '종료시간', width: 90, align: 'center'},
                        {binding: 'runtime_min', header: '가동시간(분)', width: 110, align: 'center'},
                        {binding: 'Description', header: '비고', width: '*', align: 'left'},
                    ],
                    itemsSource: this.viewData,
                    formatItem: function (s, e) {
                        if (e.panel.cellType !== wijmo.grid.CellType.Cell) return;

                        const col = s.columns[e.col];
                        const item = s.rows[e.row].dataItem;

                        // ✅ code 컬럼은 버튼 처리
                        /*if (col.binding === 'code') {

                            e.cell.textContent = ''; // 초기화

                            if (item.RunState === 'run') {

                                wrapper.appendChild(btn);

                                wrapper.className = 'wijmo-cltcd-div';
                                wrapper.dataset.row = e.row;

                                const btn = document.createElement('button');
                                btn.textContent = '가동 추가';
                                btn.className = 'btn-code-action-white';

                                btn.style.width = '100%';

                                wrapper.appendChild(btn);
                                e.cell.appendChild(wrapper);

                            return; // 💡 여기서 끝
                        }*/

                        // ✅ 그 외 셀은 초기화 + 상태색 + 병합 중앙정렬

                        e.cell.style.backgroundColor = '';
                        e.cell.innerHTML = e.cell.textContent;

                        if (item && item.RunState === 'stop') {

                        const rng = s.getMergedRange(e.panel, e.row, e.col);

                            e.cell.appendChild(inner);
                        }
                    }
                });
                new FlexGridContextMenu(this.grid);
                this.grid.downloadFileName = '가동/비가동차트';

                /*this.grid.formatItem.addHandler(function (s, e) {
                    if (e.panel.cellType === wijmo.grid.CellType.Cell) {
                        const item = s.rows[e.row].dataItem;

                        //  1. 항상 스타일 초기화

                            inner.textContent = text;
                            e.cell.appendChild(inner);
                        }
                    }
                });*/

            }

            searchMainData() {
                let _this = this;
                let startDate = $('#date_from').val();
                let endDate = $('#date_to').val();

                if (!startDate || !endDate) {
                    Alert.alert('', '조회 기간을 선택하세요.');
                    return;
                }

                let param = {
                    'date_from': startDate,
                    'date_to': endDate,
                };

                // 전체(빈 값)면 파라미터 자체를 빼야 서버의 IS NULL 분기가 탄다.
                // 빈 문자열을 보내면 CAST('' AS integer) 에서 터진다.
                let eqId = $('#search_equipment').val();
                if (eqId) param['equipment_id'] = eqId;

                let resp = null;
                try {
                    resp = AjaxUtil.getSyncData(_this.baseUrl + '/read', param);
                } catch (err) {
                    console.error('[equ_run] read', err);
                }
                if (!resp || !resp.data) {
                    $('#eqWarn').html('<div class="eq-warn">조회에 실패했습니다.</div>');
                    return;
                }

                let rows = resp.data.rows || [];
                let summary = resp.data.summary || [];

                // 상태 라벨 — DB 값은 run / complete 다.
                // 이전에는 서버가 전부 'run' 으로 덮어써서 이 칼럼이 무의미했다.
                rows.forEach(function (r) {
                    r.state_label = (r.is_open === 'Y') ? '진행중' : '완료';
                });

                _this.viewData.sourceCollection = rows;
                _this.grid.invalidate();

                _this.renderSummary(summary);

                this.chart.updateOptions({
                    xaxis: {
                        min: Date.parse(startDate + ' 00:00:00'),
                        max: Date.parse(endDate + ' 23:59:59')
                    }
                });

                if (rows.length) {
                    let series = [{data: []}];
                    rows.forEach(function (e) {
                        // 열린 구간은 주황. now() 까지 그리되 합계에는 안 들어간다
                        let color = (e.is_open === 'Y') ? '#e8833a' : '#008FFB';
                        series[0].data.push({
                            x: e.Name,
                            y: [
                                Date.parse(e.StartDate),
                                e.EndDate ? Date.parse(e.EndDate) : Date.now()
                            ],
                            fillColor: color
                        });
                    });
                    this.chart.updateSeries(series);
                } else {
                    this.chart.updateSeries([{
                        data: [
                            {x: '설비1(샘플)', y: [null, null]},
                            {x: '설비2(샘플)', y: [null, null]},
                            {x: '설비3(샘플)', y: [null, null]},
                        ]
                    }]);
                }
            }

            /**
             * 설비별 가동률 요약.
             *
             * ★ 가동시간은 구간 합집합(union)이다. 단순 합이 아니다.
             *   세척 세션 1건이 품목 10종이면 equ_run 10건이 전부 겹쳐서 생기고,
             *   단순 합으로 세면 2분짜리 작업이 15분으로 보고된다.
             *
             * ★ 미종료 구간은 합계에서 뺀다. now() 까지 쳐서 넣으면
             *   유령 한 건이 그 설비 가동률을 100% 로 만든다.
             *   대신 배지로 몇 건인지 알려서 사람이 고칠 수 있게 한다.
             */
            renderSummary(summary) {
                let esc = function (v) {
                    return String(v === null || v === undefined ? '' : v)
                        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                };

                if (!summary.length) {
                    $('#eqSummary').html('');
                    $('#eqWarn').html('<div class="eq-warn">조회 기간에 설비 가동 기록이 없습니다.</div>');
                    return;
                }

                let openTotal = 0;
                let html = summary.map(function (m) {
                    let open = Number(m.open_cnt || 0);
                    openTotal += open;
                    let rate = Number(m.run_rate || 0);
                    let rows = Number(m.row_cnt || 0);
                    let merged = Number(m.merged_cnt || 0);

                    /* 구간 건수·겹침 병합은 툴팁으로 옮긴다.
                       9줄이 나란히 서면 각 줄은 최소 정보여야 비교가 된다. */
                    let tip = esc(m.Name) + ' · 구간 ' + rows + '건'
                        + (merged && merged !== rows ? ' (겹침 병합 ' + merged + ')' : '')
                        + (open ? ' · 미종료 ' + open + '건은 합계 제외' : '');

                    let badge = open ? '<span class="open">미종료 ' + open + '</span>' : '';

                    return '<div class="eq-row" title="' + tip + '">'
                        + '<span class="nm">' + esc(m.Name) + '</span>'
                        + '<span class="bar"><i class="' + (rate < 30 ? 'low' : '') + '"'
                        + ' style="width:' + Math.min(100, rate).toFixed(1) + '%"></i></span>'
                        + '<span class="rt">' + rate.toFixed(1) + '<small>%</small></span>'
                        + '<span class="hr">' + Number(m.run_hour || 0).toFixed(1) + 'h</span>'
                        + badge + '</div>';
                }).join('');

                $('#eqSummary').html(html);

                $('#eqWarn').html(openTotal
                    ? '<div class="eq-warn">⚠ 종료되지 않은 구간이 ' + openTotal + '건 있습니다 — '
                    + '주황색 행입니다. 작업이 진행중이면 정상입니다. 취소된 작업이라면 생산실적에서 정리해 주세요. '
                    + '가동시간·가동률에는 포함되지 않습니다.</div>'
                    : '');
            }

        }

        const EA_API = '/api/production/auto';
        const EA_SPJANGCD = (typeof SPJANGCD !== 'undefined' && SPJANGCD) ? SPJANGCD : 'ZZ';
        const EA_ST_NM = {free: '미매칭', working: '매칭 · 작업중', done: '매칭 · 완료'};

        var eaRows = [];

        function eaEsc(v) {
            return String(v === null || v === undefined ? '' : v)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function eaN(v) { var x = parseFloat(v); return isNaN(x) ? 0 : x; }
        function eaQ(v) { v = eaN(v); return v === Math.floor(v) ? v.toLocaleString('ko-KR') : v.toFixed(2); }
        function eaPad(n) { return String(n).padStart(2, '0'); }
        function eaYmd(d) { return d.getFullYear() + '-' + eaPad(d.getMonth() + 1) + '-' + eaPad(d.getDate()); }
        function eaDur(m) { m = eaN(m); return m < 60 ? Math.round(m) + '분' : Math.floor(m / 60) + '시간 ' + Math.round(m % 60) + '분'; }
        function eaMsg(t) { if (typeof Alert !== 'undefined') Alert.alert('', t); }

        function eaSearch() {
            var from = $('#date_from').val(), to = $('#date_to').val();
            if (!from || !to) { eaMsg('기간을 입력하세요.'); return; }
            document.getElementById('eaInfo').textContent = '조회 중…';
            AjaxUtil.getAsyncData(EA_API + '/history', {
                equipment_id: $('#search_equipment').val() || '',
                from: from, to: to, state: document.getElementById('eaSt').value
            }, function (res) {
                if (!res || res.success === false) {
                    document.getElementById('eaInfo').textContent = '조회 실패' + (res && res.message ? ' — ' + res.message : '');
                    return;
                }
                eaRows = res.data || [];
                eaFreeBadge();
                document.getElementById('eaInfo').textContent = eaRows.length + '건' + (eaRows.length >= 2000 ? ' (최대 2,000건 — 기간을 줄이세요)' : '');
                eaRender();
            });
        }

        /* UDI 로트 표시 — 현장은 이 번호로만 구분한다. 없으면 어디까지 왔는지 */
        function eaUdi(r) {
            if (!r.mp_id) return '';
            if (r.udi_lot && r.udi_state !== 'none') return r.udi_lot + (r.udi_state === 'working' ? ' (멸균중)' : r.udi_state === 'scrapped' ? ' (멸균 불합격)' : '');
            if (r.mp_state !== 'finished') return '용기 작업중';
            return '멸균 전';
        }

        function eaRender() {
            /* 합계 — 장비 카운트 vs 매칭된 수량.
               같은 용기에 구간 여러 개가 붙을 수 있어 용기 수량은 용기별로 한 번만 센다. */
            var cnt = 0, err = 0, free = 0, freeN = 0, linked = 0, mpSeen = {}, mpQty = 0;
            eaRows.forEach(function (r) {
                cnt += eaN(r.good_qty); err += eaN(r.err_qty);
                if (r.link_state === 'free') { free += eaN(r.good_qty); freeN++; }
                else {
                    linked += eaN(r.good_qty);
                    if (r.mp_id && !mpSeen[r.mp_id]) { mpSeen[r.mp_id] = 1; mpQty += eaN(r.mp_qty); }
                }
            });
            var gap = mpQty - linked;
            document.getElementById('eaSum').innerHTML =
                '<div class="ea-k"><div class="l">장비 카운트</div><div class="v">' + eaQ(cnt) + '<small>EA</small></div>'
                + '<div class="s">구간 ' + eaRows.length + '건</div></div>'
                + '<div class="ea-k ' + (err ? 'bad' : '') + '"><div class="l">장비 불량(ErrCount)</div><div class="v">' + eaQ(err) + '<small>EA</small></div></div>'
                + '<div class="ea-k ok"><div class="l">매칭된 구간 수량</div><div class="v">' + eaQ(linked) + '<small>EA</small></div></div>'
                + '<div class="ea-k ' + (freeN ? 'warn' : '') + '"><div class="l">미매칭</div><div class="v">' + eaQ(free) + '<small>EA</small></div>'
                + '<div class="s">' + freeN + '건</div></div>'
                + '<div class="ea-k ' + (Math.abs(gap) > 0.0001 ? 'bad' : '') + '"><div class="l">용기 실적 합계</div><div class="v">' + eaQ(mpQty) + '<small>EA</small></div>'
                + '<div class="s">' + (Math.abs(gap) > 0.0001 ? '구간 수량과 ' + (gap > 0 ? '+' : '') + eaQ(gap) + ' 차이 — 기간 밖 구간이 붙었거나 수량을 고친 용기' : '구간 수량과 일치') + '</div></div>';

            var host = document.getElementById('eaTable');
            if (!eaRows.length) { host.innerHTML = '<div class="ea-empty">기간 안에 가동 구간이 없습니다.</div>'; return; }
            host.innerHTML = '<table class="ea-tbl"><thead><tr>'
                + '<th>설비</th><th>시작</th><th>종료</th><th>가동</th><th>수량</th><th>불량</th>'
                + '<th>상태</th><th>품목</th><th>UDI 로트</th><th>작업일</th><th>작업자</th><th>매칭</th>'
                + '</tr></thead><tbody>'
                + eaRows.map(function (r) {
                    var open = r.seg_state === 'open';
                    return '<tr><td class="l">' + eaEsc(r.equ_name) + '</td>'
                        + '<td>' + eaEsc(r.start_at) + '</td>'
                        + '<td>' + (open ? '<span class="chip open">가동중</span>' : eaEsc((r.end_at || '').slice(11))) + '</td>'
                        + '<td>' + eaDur(r.dur_min) + '</td>'
                        + '<td class="n">' + eaQ(r.good_qty) + '</td>'
                        + '<td class="n ' + (eaN(r.err_qty) ? 'err' : '') + '">' + (eaN(r.err_qty) ? eaQ(r.err_qty) : '-') + '</td>'
                        + '<td><span class="chip ' + r.link_state + '">' + EA_ST_NM[r.link_state] + '</span></td>'
                        + '<td class="l">' + (r.mp_id ? eaEsc(r.mat_name) : '-') + '</td>'
                        + '<td class="l" title="내부 로트 ' + eaEsc(r.lot_no || '') + '">' + (r.mp_id ? (r.udi_lot && r.udi_state !== 'none' ? '<b>' + eaEsc(eaUdi(r)) + '</b>' : '<small style="margin:0">' + eaEsc(eaUdi(r)) + '</small>') : '-') + '</td>'
                        + '<td>' + eaEsc(r.work_date || '-') + '</td>'
                        + '<td>' + eaEsc(r.actor_name || '-') + '</td>'
                        + '<td>' + (r.mp_id ? eaEsc(r.linker_name || '') + '<small>' + eaEsc(r.linked_at || '') + '</small>' : '-') + '</td></tr>';
                }).join('') + '</tbody></table>';
        }

        function eaExcel() {
            if (!eaRows.length) { eaMsg('먼저 조회하세요.'); return; }
            var q = function (v) { v = String(v === null || v === undefined ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
            /* ★ 대괄호 두 개를 붙여 쓰지 않는다 — Thymeleaf 인라인 표현식으로 읽힌다 */
            var head = ['설비', '시작', '종료', '가동(분)', '수량', '불량', '상태', '품목', 'UDI 로트', '내부 로트', '작업일', '작업자', '매칭자', '매칭시각'];
            var lines = [];
            lines.push(head.join(','));
            eaRows.forEach(function (r) {
                lines.push([r.equ_name, r.start_at, r.seg_state === 'open' ? '가동중' : r.end_at, Math.round(eaN(r.dur_min)),
                    eaN(r.good_qty), eaN(r.err_qty), EA_ST_NM[r.link_state], r.mat_name, eaUdi(r), r.lot_no, r.work_date,
                    r.actor_name, r.linker_name, r.linked_at].map(q).join(','));
            });
            var blob = new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'});
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '장비가동이력_' + $('#date_from').val() + '_' + $('#date_to').val() + '.csv';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        }


        /* 탭 머리의 미매칭 건수 — 「설비 가동 기록」 탭에 있어도 누락이 보이게 */
        function eaFreeBadge() {
            var n = eaRows.filter(function (r) { return r.link_state === 'free'; }).length;
            var el = document.getElementById('autoFreeCnt');
            if (!el) return;
            el.style.display = n ? '' : 'none';
            el.textContent = '미매칭 ' + n;
        }

        var EQ_TAB = 'run';
        function eqSetTab(t) {
            EQ_TAB = t;
            document.querySelectorAll('#eqTabs button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === t); });
            var run = (t === 'run');
            ['eqSummary', 'eqWarn', 'divList', 'runChartSec'].forEach(function (id) {
                var el = document.getElementById(id);
                if (el) el.classList.toggle('tab-hide', !run);
            });
            document.getElementById('tabAuto').classList.toggle('on', !run);
            if (run && page) { page.grid.invalidate(); }
            if (!run) eaSearch();
        }

        let page = null;

        $(document.body).ready(function (e) {
            page = new equipmentOpertationChart();

            let today = CommonUtil.getYYYYMMDD();

            var d = new Date();
            d.setDate(d.getDate() - 7);
            var pad = n => String(n).padStart(2, '0');
            $('#date_from').val(d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()));
            $('#date_to').val(today);

            // 설비 콤보. 두 번째 인자는 공용 코드셋 이름이다(모달에서 쓰던 것과 동일)
            AjaxUtil.fillSelectOptions($('#search_equipment'), 'equipment', 'all');

            // 콤보만 바꿔도 바로 조회한다 — 검색 버튼을 한 번 더 누르게 하지 않는다
            $('#search_equipment').on('change', function () {
                if (EQ_TAB === 'auto') eaSearch(); else page.searchMainData();
            });

            // 검색 — 보고 있는 탭만 다시 읽는다
            $('#btnSearch').click(function (e) {
                if (EQ_TAB === 'auto') eaSearch(); else page.searchMainData();
            });

            document.getElementById('eqTabs').addEventListener('click', function (e) {
                var b = e.target.closest('button[data-tab]');
                if (b) eqSetTab(b.getAttribute('data-tab'));
            });
            document.getElementById('eaSt').addEventListener('change', eaSearch);
            document.getElementById('eaXl').addEventListener('click', eaExcel);

            page.searchMainData();
            eaSearch();   // 탭 머리 미매칭 건수용 — 화면은 가동 기록 탭으로 연다

        });

    </script>
</th:block>
</html>
