    <!-- ══════════════════════════════════════════════════════════════
         바코드 불출 (자재창고 → 생산창고)
         wijmo 미사용. PC(스캐너) · 태블릿(카메라) 공용 마크업.
         ══════════════════════════════════════════════════════════════ -->

    <!-- ══════════════════════════════════════════════════════════════
         불출 등록 (이동) — 출발창고 → 도착창고, 로트 직접 선택
         품목을 고르면 출발창고의 로트 재고가 펼쳐지고 거기서 꺼낼 만큼 적는다.
         총량을 먼저 받아 서버가 쪼개는 방식보다 실물과 어긋날 여지가 적다.
         ══════════════════════════════════════════════════════════════ -->
    <script type="text/x-tmpl" id="issueRegPopup">
        <div class="content_wrap popup si-root">
          <div class="si-scroll">

            <div class="ir-form">
                <div class="ir-field">
                    <label>불출일</label>
                    <input type="date" id="irDate"/>
                </div>
                <div class="ir-field">
                    <label>불출창고 <span class="ir-req">*</span></label>
                    <select id="irFrom"></select>
                </div>
                <div class="ir-field">
                    <label>입고창고 <span class="ir-req">*</span></label>
                    <select id="irTo"></select>
                </div>
            </div>

            <div class="ir-field ir-mat">
                <label>품목</label>
                <div class="ir-matbox">
                    <input type="hidden" id="irMatId"/>
                    <input type="text" id="irMatName" readonly placeholder="품목을 조회하세요"/>
                    <button type="button" class="si-btn" id="irMatBtn">품목조회</button>
                </div>
            </div>

            <!-- 선택 품목의 로트 재고 -->
            <div class="ir-lotbox" id="irLotBox" style="display:none">
                <div class="ir-lothead">
                    <span id="irLotTitle">로트 재고</span>
                    <span class="si-hint" style="margin:0">선입선출 순서입니다. 담을 로트를 고르세요.</span>
                </div>
                <div class="si-list-wrap" style="max-height:200px">
                    <table class="si-table">
                        <colgroup><col style="width:38px"><col><col style="width:90px"><col style="width:110px"></colgroup>
                        <thead><tr>

    <script>
        /* 태블릿 판정 — rp_input.html 과 동일 기준.
           폭만 보면 1138 태블릿을 놓치고, 포인터만 보면 터치스크린 PC 가 걸린다. */
        window.TabletUtil = window.TabletUtil || {
            BREAKPOINT: 1280,
            /* 팝업 바닥에 더 띄우고 싶으면 이 값만 올린다 (px) */
            BOTTOM_PAD: 0,
            /* .ax-modal-body 에서 무조건 더 덜어낼 높이 (px).
               계산으로는 안 잡히는 여백이 있어 실측으로 정한 값이다. */
            BODY_TRIM: 20,
            isTouch() {
                return (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
                    || ('ontouchstart' in window)
                    || navigator.maxTouchPoints > 0;
            },
            isTablet() {
                return window.innerWidth <= this.BREAKPOINT && this.isTouch();
            },
            size(w, h) {
                /* 태블릿은 전체화면. CSS 의 100vw/100vh 와 같은 값을 돌려주어야
                   내부 .ax-modal-body 높이 계산이 바깥 상자와 맞는다. */
                if (this.isTablet()) {
                    return {width: window.innerWidth, height: window.innerHeight};
                }
                return {
                    width: Math.min(w, Math.floor(window.innerWidth * 0.98)),
                    height: Math.min(h, Math.floor(window.innerHeight * 0.95))
                };
            },
            applyBodyClass() {
                document.body.classList.toggle('tablet-mode', this.isTablet());
                this.syncVh();
            },
            /* dvh 미지원 기기(크롬 108 미만)를 위한 받침.
               주소창이 뜨고 내리면 innerHeight 가 바뀌므로 그때마다 다시 심는다. */
            syncVh() {
                document.documentElement.style.setProperty(
                    '--vh', (window.innerHeight * 0.01) + 'px');
            },
            /* 안드로이드 제스처 바 등 화면 아래 시스템 영역.
               지원 안 하는 기기에서는 0 이 나온다. */
            safeBottom() {
                const el = document.createElement('div');
                el.style.cssText =
                    'position:fixed;bottom:0;height:env(safe-area-inset-bottom,0px);visibility:hidden';
                document.body.appendChild(el);
                const h = el.offsetHeight || 0;
                el.remove();
                return h;
            }
        };

        /* 팝업 열기 — 크기를 한 군데서만 정한다.
           호출부는 PC 기준 설계치(w,h)를 그대로 넘기고,
           화면에 안 들어가면 TabletUtil.size() 가 깎아준다. */
        window.openPopup = function (modal, w, h, $content, hTablet) {
            /* hTablet 을 주면 태블릿에서만 그 높이를 쓴다.
               세로로 긴 화면을 살리되, PC 팝업은 설계치 그대로 둔다. */
            const H = (hTablet && TabletUtil.isTablet()) ? hTablet : h;
            const sz = TabletUtil.size(w, H);
            modal.open(Object.assign({}, sz, {$content: $content}));
            /* 회전·리사이즈 때 재계산할 수 있게 원본 설계치를 새겨둔다 */
            setTimeout(function () {
                $('.ax5modal:visible').last()
                    .data('baseW', w).data('baseH', h).data('baseHT', hTablet || 0);
                relayoutOpenPopups();   /* 열자마자 본문 높이를 맞춰둔다 */
            }, 0);
            return modal;
        };

        /* 이미 열려있는 팝업은 인라인 px 이라 스스로 안 바뀐다.
           세로↔가로 전환 시 다시 계산해 준다. */
        function relayoutOpenPopups() {
            $('.ax5modal:visible').each(function () {
                const $m = $(this);
                const w = +$m.data('baseW'), h = +$m.data('baseH');
                if (!w || !h) return;                 /* openPopup 으로 안 열렸으면 건드리지 않는다 */
                const ht = +$m.data('baseHT');
                const sz = TabletUtil.size(w, (ht && TabletUtil.isTablet()) ? ht : h);
                $m.css({
                    width:  sz.width  + 'px',
                    height: sz.height + 'px',
                    left: TabletUtil.isTablet() ? '0px'
                        : Math.max(0, Math.floor((window.innerWidth  - sz.width)  / 2)) + 'px',
                    top:  TabletUtil.isTablet() ? '0px'
                        : Math.max(0, Math.floor((window.innerHeight - sz.height) / 2)) + 'px'
                });

                /* ★ top:0 을 줘도 실제로 0 에 놓인다는 보장이 없다.
                     조상에 transform·filter 가 있으면 position:fixed 의 기준이
                     뷰포트가 아니라 그 조상이 된다. 그러면 모달이 탭바 아래에서
                     시작하는데 높이는 화면 전체를 받아, 시작한 만큼 아래가 잘린다.
                     그래서 놓인 자리를 실측해 남은 높이만 쓴다. */
                if (TabletUtil.isTablet()) {
                    const top = $m[0].getBoundingClientRect().top;
                    const safe = TabletUtil.safeBottom();
                    const avail = Math.floor(window.innerHeight - top - safe);
                    if (avail > 120) {
                        sz.height = avail;
                        /* ★ 스타일시트의 !important 는 인라인보다 세다.
                             .ax5modal 에 100vh !important 를 걸어 두었으므로
                             평범한 $m.css('height') 는 먹지 않는다.
                             실측값이 이기도록 이쪽도 important 로 심는다. */
                        $m[0].style.setProperty('height', avail + 'px', 'important');
                    }
                }
                /* ★ ax5 는 .ax-modal-body 높이를 열 때 계산한 px 로 박아둔다.
                     바깥만 늘리고 이걸 그대로 두면 본문이 모자라거나 넘쳐
                     맨 아래 popup-button 이 잘린다.

                   ★ 헤더 높이만 빼면 20px 쯤 모자란다.
                     헤더와 본문 사이 여백, 모달 자신의 padding-bottom·border 가
                     계산에서 빠져 있기 때문이다. 숫자를 박아두면 팝업마다
                     기기마다 또 어긋나므로, 본문이 실제로 시작하는 지점과
                     모달 아래쪽 여백을 그때그때 잰다. */
                const $body = $m.children('.ax-modal-body');
                if ($body.length) {
                    const cs = getComputedStyle($m[0]);
                    const offsetTop =                       /* 모달 위 ~ 본문 위 */
                        $body[0].getBoundingClientRect().top - $m[0].getBoundingClientRect().top;
                    const bottomGap =                       /* 모달 아래쪽 여백·테두리 */
                        (parseFloat(cs.paddingBottom) || 0) + (parseFloat(cs.borderBottomWidth) || 0);
                    const bodyH = sz.height - offsetTop - bottomGap - TabletUtil.BODY_TRIM;
                    $body[0].style.setProperty('height', bodyH + 'px', 'important');

                    /* ★ 마지막 보정 — 계산이 아니라 실측이다.
                         전역 스타일의 padding·border·margin 을 전부 예측할 수는 없다.
                         실제로 그려진 뒤 바닥이 화면 아래로 얼마나 삐져나갔는지 재서
                         그만큼 본문에서 덜어낸다. 원인이 무엇이든 스스로 맞춰진다. */
                    const el = $m.find('.si-root, .content_wrap').first()[0];
                    if (el) {
                        /* 제스처 바 위까지가 실제로 보이는 바닥이다.
                           TabletUtil.BOTTOM_PAD 로 여유를 더 줄 수 있다. */
                        const floor = window.innerHeight - TabletUtil.safeBottom()
                            - (TabletUtil.BOTTOM_PAD || 0);
                        const over = el.getBoundingClientRect().bottom - floor;
                        if (over > 0) {
                            $body[0].style.setProperty(
                                'height', (parseFloat($body.css('height')) - over) + 'px', 'important');
                        }
                    }
                }
            });
        }

        let __rzTimer = null;
        window.addEventListener('resize', function () {
            TabletUtil.applyBodyClass();
            clearTimeout(__rzTimer);
            __rzTimer = setTimeout(relayoutOpenPopups, 150);
        });
        window.addEventListener('orientationchange', function () {
            /* 회전 직후 innerHeight 는 아직 옛 값이다. 한 박자 쉬고 읽는다. */
            setTimeout(function () { TabletUtil.applyBodyClass(); relayoutOpenPopups(); }, 250);
        });
        /* 주소창이 접히고 펴질 때도 높이가 바뀐다 (resize 가 안 오는 기기가 있다) */
        window.addEventListener('scroll', function () { TabletUtil.syncVh(); }, {passive: true});
        $(function () { TabletUtil.applyBodyClass(); });
    </script>

    <script type="text/javascript">
        class materialStorehouse {
            constructor() {
                this.url = '/api/inventory/material_inout';
                this.grid = null;
                this.init();
            }

            init() {
                const _this = this;

                this.grid = new wijmo.grid.FlexGrid('#material-storehouse-grid', {
                    autoGenerateColumns: false,
                    selectionMode: wijmo.grid.SelectionMode.Row,
                    headersVisibility: wijmo.grid.HeadersVisibility.All,
                    isReadOnly: true,
                    showMarquee: true,
                    formatItem: (sender, e) => {
                        if (e.panel.cellType === wijmo.grid.CellType.RowHeader) {
                            // 헤더에 순번
                            e.cell.textContent = (e.row + 1).toString();
                        }

                        {binding: 'CurrentStock', header: '전체재고', width: 80, align: 'right', format: 'n0'},
                        {binding: 'Description', header: '비고', width: '*', align: 'left'},

                            const column = panel.columns[col];

                            // 창고재고 조건부 스타일링
                            if (column.binding === 'HouseStock' && item.HouseStock < 0) {
                                cell.classList.add('redText');
                            }

                            // 전체재고 조건부 스타일링
                            if (column.binding === 'CurrentStock' && item.CurrentStock < item.SafetyStock) {
                                cell.classList.add('redText');
                            }

                            if (column.binding === 'mio_pk') {
                                cell.textContent = item.mio_pk?.toString(); // 콤마 제거해서 그대로 출력

                    }

                        let row = _this.grid.rows[ht.row]; // 해당 행
                        let item = _this.grid.rows[ht.row].dataItem; // 해당 row의 데이터
                        window.selectedGridId = item.mio_pk;

                    }
                });

                //     this.showLotInputPopup();
                // });

                // document.getElementById('btnInputTest').addEventListener('click', () => {
                //     this.showInputTestPopup();
                // });
            }

            modify(selectedItem) {
                let _this = this;

                let selectedItems = selectedItem;

                if (selectedItems.length === 1) {

                    let data = {
                        mio_pk: selectedItems[0].mio_pk,
                        action: 'detail'
                    };
                    let fnsuccess = function (result) {
                        result.data['mode'] = 'edit';
                        _this.addDataPopup(result.data);
                    };
                    AjaxUtil.getAsyncData(_this.url + '/matinout_detail', data, fnsuccess);
                } else if (selectedItems.length > 1) {
                    Alert.alert('', '데이터를 하나만 선택하세요.');
                } else {

                }

                let _this = this;
                let srchStartDt = $('#searchForm').find("#srchStartDt").val();
                let srchEndDt = $('#searchForm').find("#srchEndDt").val();
                let house_pk = $('#searchForm').find('#cboHouse').val();
                let mat_type = $('#searchForm').find('#cboMatType').val();
                let mat_grp_pk = $('#searchForm').find('#cboMatGroup').val();
                let txtMatName = $('#searchForm').find('#txtMatName').val();
                let data = {
                    'action': 'read',
                    'srchStartDt': srchStartDt,
                    'srchEndDt': srchEndDt,
                    'house_pk': house_pk,
                    'mat_type': mat_type,
                    'mat_grp_pk': mat_grp_pk,
                    'keyword': txtMatName,
                    /* 빈 문자열이어도 반드시 보낸다 — 빈 값 = 전체 */
                    'factory_id': $('#Factory_id').val() || ''
                };

                let result = AjaxUtil.getSyncData(this.url + "/read_issue", data);
                if (result.data != null) {
                    _this.grid.itemsSource = new wijmo.collections.CollectionView(result.data);

                    if (window.selectedGridId) {
                        GridUtil.selectRowById(_this.grid, window.selectedGridId, { idField: 'mio_pk' });
                        window.selectedGridId = null;
                    }
                }
            }

                    let $qty = $content.find('#InoutQty');
                    let raw = $qty.val().replace(/,/g, '').replace(/[^0-9-]/g, ''); // 숫자만 남기기

                    if (!raw) {
                        $qty.val('');
                        return;
                    }

                    // - 부호 처리
                    let isNegative = (type === 'recall' || type === 'return');
                    raw = raw.replace(/^-/, ''); // 음수 기호 제거

                    let num = parseInt(raw, 10);
                    if (isNaN(num)) {
                        $qty.val('');
                        return;
                    }

                    let formatted = num.toLocaleString(); // 천 단위 콤마
                    if (isNegative) {
                        formatted = '-' + formatted;
                    }

                    $qty.val(formatted);
                }

                    poppage.show(searchcallback);

                    $content.find('#inoutSelect').trigger('change');

                    setTimeout(function () {
                        FormUtil.BindDataForm(data[0], form);
                        $content.find('#inoutSelect').prop('disabled', true);

                        return false;

                        Alert.alert('', '창고를 지정하세요.');
                        return false;
                    }

                    if ($('#InoutQty').val() === "") {
                        Alert.alert('', '수량을 확인해 주세요.');
                        return false;

                    popup.saveData(type, form);

                    modalContainer.modal.close();

                $content.find('#btnDelete').on('click', function () {

                    let data = {
                        mio_pk: $content.find('#mio_pk').val(),
                        action: 'delete'
                    };
                    let url = '/api/inventory/material_inout/delete';
                    AjaxUtil.postJsonData(url, data, function (res) {
                        if (res.success) {

                                _this.searchDataBind();

                            });

                            Alert.alert('', res.message || '삭제 중 오류가 발생했습니다.');
                        }
                    });

                    modalContainer.modal.close();
                });


            }

                    _this.matLotGrid.itemsSource.sourceCollection = [];

                        Alert.alert('로트저장', '유효 일시를 입력해주세요.', function () {
                        });
                        return;
                    }

                    let inputQty = $InputQty.val();
                    let lotSize = $LotSize.val();
                    let effectedDate = $EffectiveDate.val();

                    if (inputQty === '' || inputQty === 0) {
                        // alert(1);
                        Alert.alert('입고수량', '입고수량이 없습니다.');
                        return;
                    }
                    if (lotSize === '' || lotSize === 0) {
                        // alert(2);
                        Alert.alert('로트당수량', '로트당 수량을 입력해주세요.');
                        return;

                    let lotCount = (inputQty / lotSize);

                        return;

                    lotCount = Math.ceil(lotCount);
                    let remainQty = Number(inputQty);
                    let now = CommonUtil.getYYYYMMDD();
                    let updatedCollection = [];

                    for (let idx = 0; idx < lotCount; idx++) {
                        let qty = lotSize;

                            qty = remainQty;
                        }
                        let r = {
                            InputQty: qty,
                            UnitName: item.unit_name,
                            InputDateTime: now,
                            Description: item.Description,
                            mio_id: item.mio_pk,
                            EffectiveDate: effectedDate,
                            LotNumber: ''
                        };

                        updatedCollection.push(r);
                        remainQty = remainQty - qty;

                    let lotSaveCallback = function (result) {

            checkMoveValidation() {

                let _this = this;
                let from = this.$cboFrom.val();
                let to = this.$cboTo.val();

                let items = [];
                let strItems = JSON.stringify(items);

                if (from === '' || to === "") {
                    Alert.alert('', 'from, to를 확인하세요.');
                    return;
                }
                if (from === to) {
                    Alert.alert('', '동일한 창고를 선택하셨습니다.');
                    return;

                }

                let seletectedItems = _this.grid.selectedItems;
                if (seletectedItems.length === 0) {
                    Alert.alert('', '선택된 데이터가 없습니다.');
                    return;
                }

                $.each(seletectedItems, function (idx, item) {
                    let move_qty = item.move_qty;
                    if (move_qty > 0) {
                        items.push({material_id: item.id, move_qty: move_qty});
                    }
                });

                if (items.length === 0) {
                    Alert.alert('', '이동수량 변경이 없습니다.');
                    return false;
                }

                return true;

            }

            /* 로트 배분 확인 후 불출.
               기존 moveMaterial() 은 mat_inout 만 남기고 mat_lot 을 안 옮긴다 —
               그러면 세척·조립이 그 자재를 못 찾는다. 대체 경로다. */
            previewMove() {
                const _this = this;
                if (this.checkMoveValidation() === false) return false;

                const from = this.$cboFrom.val();
                const to = this.$cboTo.val();
                const items = [];

                $.each(this.grid.selectedItems, function (idx, item) {
                    const q = Number(item.move_qty || 0);
                    if (q > 0) items.push({mat_id: item.mat_id, qty: q});
                });
                if (!items.length) { Alert.alert('', '이동수량 변경이 없습니다.'); return false; }

                const c = new LotMoveConfirm(from, to, items, function () {
                    _this.modalContainer.close();
                    if (window.page) page.searchDataBind();
                });
                c.fromName = this.$cboFrom.find('option:selected').text();
                c.toName = this.$cboTo.find('option:selected').text();
                c.open();
            }

            moveMaterial() {

                let _this = this;
                if (this.checkMoveValidation() === false) {
                    return false;
                }

                let from = this.$cboFrom.val();
                let to = this.$cboTo.val();
                let items = [];

                let seletectedItems = _this.grid.selectedItems;
                if (seletectedItems.length === 0) {
                    Alert.alert('', '선택된 데이터가 없습니다.');
                    return;
                }

                $.each(seletectedItems, function (idx, item) {
                    let move_qty = item.move_qty;
                    if (move_qty > 0) {
                        items.push({
                            mat_id: item.mat_id,
                            move_qty: move_qty,
                            storehouse_id: from
                        });
                    }
                });

                let strItems = JSON.stringify(items);
                let url = '/api/inventory/material_move/material_move';
                let data = {
                    from_storehouse_id: from,
                    to_storehouse_id: to,
                    move_list: strItems
                };
                let fnsuccess = function (result) {
                    if (result.success) {
                        Notify.success('이동되었습니다.');
                        _this.modalContainer.close();
                        page.searchDataBind();
                    } else {
                        Alert.alert('', '오류가 발생했습니다.');
                    }
                };

                AjaxUtil.postAsyncData(url, data, fnsuccess);
            }

            showMovePopup() {

                let _this = this;
                let defaultData = {};
                let content = tmpl('matMovePopup', defaultData);

        /* 이 화면에는 esc / spjangcd 헬퍼가 없어 여기서 정의한다.
           전역에 이미 있으면 그것을 쓴다. */
        function esc(s) {
            if (s === null || s === undefined) return '';
            return String(s).replace(/[&<>"']/g, function (c) {
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
            });
        }
        function SPJ() {
            if (typeof SPJANGCD !== 'undefined' && SPJANGCD) return SPJANGCD;
            const el = document.querySelector('[name=spjangcd], #spjangcd');
            return el ? el.value : '';
        }

        /* ══════════════════════════════════════════════════════════════
           바코드 불출 (자재창고 → 생산창고)

           ★ 스캐너와 카메라는 서로 다른 층에서 동작한다
             · USB/블루투스 스캐너 = 키보드. 입력칸에 그대로 타이핑되고 Enter 가 온다.
               별도 권한도 드라이버도 없다. PC·태블릿 공통.
             · 카메라 = BarcodeCam 공통 모듈(세척·수리와 동일 엔진).
               버튼은 항상 두고, 못 쓰는 환경이면 누를 때 이유를 알려준다.
             두 경로 모두 handleScan() 하나로 들어간다.

           ★ 없는 로트도 행으로 깐다
             알럿을 띄우면 연속 스캔 중 손이 멈춘다. 빨간 행 + 다른 소리로 알린다.
           ══════════════════════════════════════════════════════════════ */
        class ScanIssue {
            constructor() {
                this.API = '/api/inventory/move_scan';
                this.rows = [];          // {key, found, mat_lot_id, ...}
                this.lastScan = '';
                this.lastAt = 0;
                this.stream = null;
                this.timer = null;
                this.detector = null;
                this.busy = false;       // detect() 호출 겹침 방지
                this.seq = 0;
            }

            /* GS1-128 파싱은 BarcodeCam 과 공유한다 — 스캐너 입력도 같은 경로를 탄다 */
            parseGs1(raw) { return BarcodeCam.parse(raw); }

            /* ── 스캔 1건 처리 ────────────────────────────────────── */
            handleScan(raw) {
                let val = (raw || '').trim();
                if (!val) return;

                // 같은 값이 초당 여러 번 잡히는 것을 막는다 (카메라는 프레임마다 인식된다)
                const now = Date.now();
                if (val === this.lastScan && now - this.lastAt < 2500) return;
                this.lastScan = val;
                this.lastAt = now;

                const p = this.parseGs1(val);
                const _this = this;

                const data = {
                    from_store: this.$from.val(),
                    spjangcd: SPJ(),
                    raw: val
                };
                if (p.gtin14) data.gtin14 = p.gtin14;
                if (p.lot) data.lot = p.lot;

                AjaxUtil.getAsyncData(this.API + '/lot_lookup', data, function (res) {
                    const d = (res && res.data) || {};
                    const lots = d.lots || [];
                    if (!lots.length) {
                        _this.addBadRow(p.lot || val);
                        _this.beep(false);
                        if (_this.stream) _this.camMsg('확인되지 않는 로트');
                        return;
                    }
                    // 같은 로트번호가 창고 안에 여러 행일 수 있다(이전 불출·세척이 쪼갠 흔적).
                    // 전부 담되 오래된 것부터 — 서버가 이미 InputDateTime ASC 로 준다.
                    lots.forEach(function (l) { _this.addRow(l); });
                    _this.beep(true);
                    /* 카메라를 보고 있으면 화면을 내리지 않고도 쌓인 건수를 안다 */
                    if (_this.stream) _this.camMsg('담았습니다 · ' + (lots[0].lot_number || ''));
                });
            }

            addRow(l) {
                // 이미 담긴 로트면 다시 담지 않는다. 수량은 손으로 고치는 것이 원칙.
                const dup = this.rows.find(r => r.found && r.mat_lot_id === l.mat_lot_id);
                if (dup) { this.flashRow(dup.key); return; }

                const stock = Number(l.stock || 0);
                this.rows.push({
                    key: 'r' + (++this.seq),
                    found: true,
                    mat_lot_id: l.mat_lot_id,
                    lot_number: l.lot_number,
                    mat_code: l.mat_code,
                    mat_name: l.mat_name,
                    unit_name: l.unit_name || '',
                    stock: stock,
                    qty: stock                 // ★ 전량이 기본. 필요하면 손으로 줄인다
                });
                this.render();
            }

            addBadRow(key) {
                this.rows.push({
                    key: 'r' + (++this.seq),
                    found: false,
                    scan_key: key
                });
                this.render();
            }

            render() {
                const $tb = this.$content.find('#siRows');
                if (!this.rows.length) {
                    $tb.html('<tr class="si-empty"><td colspan="7">스캔한 항목이 여기에 쌓입니다.</td></tr>');
                    this.updateSummary();
                    return;
                }
                let html = '';
                this.rows.forEach((r, idx) => {
                    if (!r.found) {
                        html += '<tr class="si-row-bad" data-k="' + r.key + '">'
                            + '<td data-label="#">' + (idx + 1) + '</td>'
                            + '<td colspan="3" data-label="품목">확인되지 않는 로트 · <span class="si-lot">'
                            + esc(r.scan_key) + '</span></td>'
                            + '<td class="tar" data-label="재고">—</td>'
                            + '<td class="tar" data-label="이동량">—</td>'
                            + '<td><button type="button" class="si-del" data-del="' + r.key + '">✕</button></td>'
                            + '</tr>';
                        return;
                    }
                    const zero = r.stock <= 0;
                    html += '<tr class="' + (zero ? 'si-row-zero' : '') + '" data-k="' + r.key + '">'
                        + '<td data-label="#">' + (idx + 1) + '</td>'
                        + '<td data-label="품목코드">' + esc(r.mat_code || '') + '</td>'
                        + '<td data-label="품목">' + esc(r.mat_name || '')
                        + (zero ? '<span class="si-tag">재고 없음</span>' : '') + '</td>'
                        + '<td class="si-lot" data-label="로트">' + esc(r.lot_number || '') + '</td>'
                        + '<td class="tar" data-label="재고">' + this.num(r.stock) + '</td>'
                        + '<td class="tar" data-label="이동량"><input type="number" class="si-qty" data-q="' + r.key + '"'
                        + ' value="' + r.qty + '" min="0" max="' + r.stock + '"'
                        + (zero ? ' disabled' : '') + '/></td>'
                        + '<td><button type="button" class="si-del" data-del="' + r.key + '">✕</button></td>'
                        + '</tr>';
                });
                $tb.html(html);
                this.updateSummary();
            }

            updateSummary() {
                const ok = this.rows.filter(r => r.found && r.qty > 0);
                const bad = this.rows.filter(r => !r.found).length;
                const total = ok.reduce((a, r) => a + Number(r.qty || 0), 0);
                let txt = '스캔 ' + this.rows.length + '건 · 불출 대상 ' + ok.length + '건 / '
                    + this.num(total) + '개';
                if (bad) txt += ' · 확인불가 ' + bad + '건';
                this.$content.find('#siSummary').text(txt);
            }

            flashRow(key) {
                const $tr = this.$content.find('[data-k="' + key + '"]');
                $tr.css('background', '#FFF6D6');
                setTimeout(() => $tr.css('background', ''), 400);
            }

            /* 소리·진동은 BarcodeCam 과 같은 신호를 쓴다 */
            beep(ok) { BarcodeCam.beep(ok); }

            /* ── 카메라 연속 스캔 ─────────────────────────────────
               BarcodeCam 공통 모듈에 위임한다. 여기서는 「어디에 그릴지」와
               「잡았을 때 무엇을 할지」만 정한다. 불출은 상자를 여러 개
               찍는 일이라 continuous: true — 하나 잡아도 닫지 않는다.   */
            cam() {
                if (this._cam) return this._cam;
                const _this = this;
                this._cam = BarcodeCam.create({
                    video: this.$content.find('#siVideo')[0],
                    continuous: true,
                    onScan(raw) {
                        _this.hitFrame();
                        _this.handleScan(raw);
                    },
                    onStatus(m) { _this.camMsg(m); },
                    onError(m) { Alert.alert('카메라', m); _this.closeCam(); }
                });
                return this._cam;
            }

            async startCam() {
                const $box = this.$content.find('#siVideoBox');
                if (this.cam().isRunning()) { this.closeCam(); return; }   // 다시 누르면 닫힘

                $box.show();
                const ok = await this.cam().start();
                if (!ok) { $box.hide(); return; }

                this.$content.find('#siCam').text('📷 닫기');
                this.syncCamTools();
            }

            closeCam() {
                if (this._cam) this._cam.stop();
                if (this.$content) {
                    this.$content.find('#siVideoBox').hide();
                    this.$content.find('#siCam').text('📷 카메라');
                }
            }

            /* 줌·토치는 기기가 지원할 때만 낸다. 작은 라벨에는 줌이 크게 듣는다. */
            syncCamTools() {
                const c = this.cam(), $c = this.$content;
                const r = c.zoomRange();
                $c.find('#siZoom').toggle(!!r);
                if (r) {
                    $c.find('#siZoom').attr({min: r.min, max: r.max, step: r.step || 0.1}).val(r.min);
                }
                $c.find('#siTorch').toggle(c.canTorch());
            }

            hitFrame() {
                const $f = this.$content.find('#siFrame');
                $f.addClass('hit');
                setTimeout(() => $f.removeClass('hit'), 350);
            }

            camMsg(t) {
                this.$content.find('#siVMsg').text(t);
                this.$content.find('#siVCount').text(this.rows.length + '건');
            }

            stopCam() { this.closeCam(); }     // 기존 호출부 호환

            /* ── 불출 ────────────────────────────────────────────── */
            submit() {
                const _this = this;
                const lines = this.rows
                    .filter(r => r.found && Number(r.qty) > 0)
                    .map(r => ({mat_lot_id: r.mat_lot_id, qty: Number(r.qty)}));

                if (!lines.length) { Alert.alert('', '불출할 항목이 없습니다.'); return; }

                const from = this.$from.val(), to = this.$to.val();
                if (!from || !to) { Alert.alert('', '창고를 선택하세요.'); return; }
                if (from === to) { Alert.alert('', '출발창고와 도착창고가 같습니다.'); return; }

                const bad = this.rows.filter(r => !r.found).length;
                const total = lines.reduce((a, l) => a + l.qty, 0);
                let msg = lines.length + '건 · 총 ' + this.num(total) + '개를 불출합니다.';
                if (bad) msg += '\n확인불가 ' + bad + '건은 제외됩니다.';

                Alert.confirm('', msg, function () {
                    /* ★ 서버가 @RequestBody(JSON) 로 받으므로 postJsonData 를 쓴다.
                         CSRF 토큰 · Content-Type · JSON.stringify · 로딩 표시를 유틸이 처리한다.
                         $.ajax 를 직접 부르면 CSRF 헤더가 빠져 403 이 나고,
                         화면에는 「통신 오류」한 줄만 떠서 원인을 찾기 어렵다. */
                    AjaxUtil.postJsonData(_this.API + '/move', {
                        from_store: Number(from),
                        to_store: Number(to),
                        description: '바코드 불출',
                        spjangcd: SPJ(),
                        lines: lines
                    }, function (res) {
                        if (!res || !res.success) {
                            Alert.alert('', (res && res.message) || '불출에 실패했습니다.');
                            return;
                        }
                        Notify.success('불출 완료 · ' + (res.data && res.data.move_no || ''));
                        _this.rows = [];
                        _this.render();
                        if (window.page) page.searchDataBind();
                    });
                });
            }

            num(v) {
                const n = Number(v || 0);
                return (n % 1 === 0) ? n.toLocaleString() : n.toLocaleString(undefined, {maximumFractionDigits: 3});
            }

            /* ── 열기 ────────────────────────────────────────────── */
            open() {
                const _this = this;
                const $content = $(tmpl('scanIssuePopup', {}));
                this.$content = $content;

                this.modal = new PopupDraggable('바코드 불출 (자재창고 → 생산창고)');
                openPopup(this.modal, 900, 640, $content);

                this.$from = $content.find('#siFrom');
                this.$to = $content.find('#siTo');
                AjaxUtil.fillSelectOptions(this.$from, 'store_house', '', false);
                AjaxUtil.fillSelectOptions(this.$to, 'store_house', '', false);
                // 자재창고(3) → 생산창고(17). 옵션에 없으면 조용히 첫 값이 남는다.
                this.$from.val('3');
                this.$to.val('17');

                /* 카메라 버튼은 항상 둘다. 쓸 수 없는 환경이면
                   버튼을 숨기는 대신 누를 때 이유를 말해준다.
                   — 사내망(http)에서 버튼이 사라지면 고칠 실마리가 없다. */
                const camChk = BarcodeCam.check();
                $content.find('#siHint').text(camChk.ok
                    ? '스캐너는 입력칸에 그대로 들어옵니다. 카메라는 연속으로 읽습니다. 같은 로트를 다시 찍으면 무시됩니다.'
                    : '스캐너는 입력칸에 그대로 들어옵니다. (카메라 버튼을 누르면 사용 조건을 안내합니다)');

                const $input = $content.find('#siInput');
                setTimeout(() => $input.focus(), 100);

                // 스캐너는 값 끝에 Enter 를 보낸다
                $input.on('keydown', function (e) {
                    if (e.key === 'Enter' || e.keyCode === 13) {
                        e.preventDefault();
                        _this.handleScan($input.val());
                        $input.val('').focus();
                    }
                });
                $content.find('#siAdd').on('click', function () {
                    _this.handleScan($input.val());
                    $input.val('').focus();
                });

                $content.find('#siCam').on('click', function () { _this.startCam(); });
                $content.find('#siCamStop').on('click', function () { _this.closeCam(); });
                $content.find('#siZoom').on('input', function () { _this.cam().zoom(+this.value); });
                $content.find('#siTorch').on('click', function () {
                    _this._torch = !_this._torch;
                    _this.cam().torch(_this._torch);
                    $(this).css('background', _this._torch ? '#FFD43B' : '');
                });

                // 이동량 수정
                $content.on('change input', '[data-q]', function () {
                    const r = _this.rows.find(x => x.key === this.dataset.q);
                    if (!r) return;
                    let v = Number(this.value || 0);
                    if (v < 0) v = 0;
                    if (v > r.stock) { v = r.stock; this.value = v; }   // 재고 초과 금지
                    r.qty = v;
                    _this.updateSummary();
                });

                // 행 삭제 — 잘못 찍은 것을 되돌리는 유일한 수단
                $content.on('click', '[data-del]', function () {
                    _this.rows = _this.rows.filter(x => x.key !== this.dataset.del);
                    _this.render();
                });

                $content.find('#siClear').on('click', function () {
                    if (!_this.rows.length) return;
                    Alert.confirm('', '스캔 목록을 모두 지웁니다.', function () {
                        _this.rows = []; _this.render();
                    });
                });

                $content.find('#siSubmit').on('click', function () { _this.submit(); });
                $content.find('#siClose').on('click', function () {
                    _this.stopCam();
                    _this.modal.close();
                });
                /* 헤더의 ✕ 나 ESC 로 닫는 경로도 있다.
                   그때 카메라를 안 끄면 랜프가 켜진 채로 남는다. */
                $content.closest('.ax5modal').on('remove', function () { _this.stopCam(); });
                $(document).one('ax5modal-close.siCam', function () { _this.stopCam(); });

                // 창고를 바꾸면 이미 담긴 로트는 의미가 달라진다
                this.$from.on('change', function () {
                    if (!_this.rows.length) return;
                    Alert.confirm('', '출발창고를 바꾸면 스캔 목록이 초기화됩니다.', function () {
                        _this.rows = []; _this.render();
                    });
                });
            }
        }

        /* ── 바코드 불출 이력 · 취소 ──────────────────────────────── */
        class ScanIssueHistory {
            constructor() { this.API = '/api/inventory/move_scan'; }

            open() {
                const _this = this;
                const $content = $(tmpl('scanHistPopup', {}));
                this.$content = $content;
                this.modal = new PopupDraggable('바코드 불출 이력');
                openPopup(this.modal, 900, 520, $content);

                $content.find('#shFrom').val(CommonUtil.getYYYYMMDD(-7));
                $content.find('#shTo').val(CommonUtil.getYYYYMMDD());
                $content.find('#shSearch').on('click', function () { _this.load(); });
                $content.find('#shClose').on('click', function () { _this.modal.close(); });

                $content.on('click', '[data-cancel]', function () {
                    const id = this.dataset.cancel;
                    Alert.confirm('불출 취소',
                        '이 불출을 취소하고 재고를 되돌립니다.\n\n' +
                        '★ 이미 세척·생산에 쓰인 로트가 있으면 취소되지 않습니다.',
                        function () {
                            AjaxUtil.postAsyncData(_this.API + '/cancel', {move_id: id}, function (res) {
                                if (!res || !res.success) {
                                    Alert.alert('취소 불가', (res && res.message) || '오류가 발생했습니다.');
                                    return;
                                }
                                Notify.success('취소되었습니다');
                                _this.load();
                                if (window.page) page.searchDataBind();
                            });
                        });
                });

                this.load();
            }

            load() {
                const _this = this;
                const $c = this.$content;
                AjaxUtil.getAsyncData(this.API + '/history', {
                    date_from: $c.find('#shFrom').val(),
                    date_to: $c.find('#shTo').val(),
                    spjangcd: SPJ()
                }, function (res) {
                    const rows = (res && res.data) || [];
                    if (!rows.length) {
                        $c.find('#shRows').html(
                            '<tr class="si-empty"><td colspan="7">불출 이력이 없습니다.</td></tr>');
                        return;
                    }
                    let html = '';
                    rows.forEach(function (r) {
                        const canceled = r.state === 'canceled';
                        html += '<tr' + (canceled ? ' class="si-row-zero"' : '') + '>'
                            + '<td class="si-lot" data-label="불출번호">' + esc(r.move_no || '') + '</td>'
                            + '<td data-label="일시">' + (r.move_date || '') + ' ' + String(r.move_time || '').substring(0, 5) + '</td>'
                            + '<td data-label="창고">' + esc(r.from_store || '') + ' → '
                            + esc(r.to_store || '') + '</td>'
                            + '<td class="tar" data-label="건수">' + (r.line_cnt || 0) + '</td>'
                            + '<td class="tar" data-label="수량">' + Number(r.total_qty || 0).toLocaleString() + '</td>'
                            + '<td data-label="작업자">' + esc(r.worker || '') + '</td>'
                            + '<td>' + (canceled
                                ? '<span class="si-tag">취소됨</span>'
                                : '<button type="button" class="si-del" data-cancel="' + r.move_id
                                + '" title="취소">↩</button>')
                            + '</td></tr>';
                    });
                    $c.find('#shRows').html(html);
                });
            }
        }



        /* ── 수동 불출 · 로트 배분 확인 ────────────────────────────
           품목·수량만 받아 서버가 FIFO 로 로트를 배분하고, 그 결과를 확인시킨다.

           ★ 왜 확인 단계가 필요한가
             로트를 안 옮기면 세척·조립이 그 자재를 못 찾는다(mat_lot.StoreHouse_id 기준).
             그렇다고 조용히 FIFO 로 옮기면, 나중에 작업자가 실물 바코드를 찍었을 때
             "재고 0" 으로 뜬다 — 시스템이 이미 그 로트를 대신 빼갔기 때문이다.
             그래서 무엇이 나가는지 보여주고, 다르면 고칠 수 있게 한다.            */
        class LotMoveConfirm {
            constructor(from, to, items, onDone) {
                this.API = '/api/inventory/move_scan';
                this.from = from;
                this.to = to;
                this.items = items;          // [{mat_id, qty}]
                this.onDone = onDone;
                this.rows = [];
                this.seq = 0;
            }

            open() {
                const _this = this;
                AjaxUtil.postJsonData(this.API + '/preview', {
                    from_store: Number(this.from),
                    spjangcd: SPJ(),
                    items: this.items
                }, function (res) {
                    if (!res || !res.success) {
                        Alert.alert('', (res && res.message) || '배분에 실패했습니다.');
                        return;
                    }
                    _this.build(res.data || []);
                    if (!_this.rows.length) {
                        Alert.alert('', '출발창고에 배분할 로트 재고가 없습니다.');
                        return;
                    }
                    _this.render();
                });
            }

            build(data) {
                const _this = this;
                this.rows = [];
                this.shortages = [];
                data.forEach(function (m) {
                    if (Number(m.shortage || 0) > 0) {
                        _this.shortages.push({
                            name: m.mat_name || ('품목 ' + m.mat_id),
                            qty: Number(m.shortage)
                        });
                    }
                    (m.lots || []).forEach(function (l) {
                        _this.rows.push({
                            key: 'l' + (++_this.seq),
                            mat_lot_id: l.mat_lot_id,
                            lot_number: l.lot_number,
                            mat_code: m.mat_code || l.mat_code,
                            mat_name: m.mat_name || l.mat_name,
                            stock: Number(l.stock || 0),
                            qty: Number(l.qty || 0)
                        });
                    });
                });
            }

            render() {
                const _this = this;
                const $content = $(tmpl('lotConfirmPopup', {}));
                this.$content = $content;
                this.modal = new PopupDraggable('불출 · 로트 배분 확인');
                openPopup(this.modal, 860, 560, $content);

                $content.find('#lcRoute').text(
                    (this.fromName || '출발') + ' → ' + (this.toName || '도착'));

                this.draw();

                $content.on('change input', '[data-q]', function () {
                    const r = _this.rows.find(x => x.key === this.dataset.q);
                    if (!r) return;
                    let v = Number(this.value || 0);
                    if (v < 0) v = 0;
                    if (v > r.stock) { v = r.stock; this.value = v; }
                    r.qty = v;
                    _this.sum();
                });
                $content.on('click', '[data-del]', function () {
                    _this.rows = _this.rows.filter(x => x.key !== this.dataset.del);
                    _this.draw();
                });
                $content.find('#lcCancel').on('click', function () { _this.modal.close(); });
                $content.find('#lcOk').on('click', function () { _this.submit(); });
            }

            draw() {
                let html = '';
                if (!this.rows.length) {
                    html = '<tr class="si-empty"><td colspan="6">배분된 로트가 없습니다.</td></tr>';
                } else {
                    this.rows.forEach(r => {
                        html += '<tr data-k="' + r.key + '">'
                            + '<td data-label="품목코드">' + esc(r.mat_code || '') + '</td>'
                            + '<td data-label="품목">' + esc(r.mat_name || '') + '</td>'
                            + '<td class="si-lot" data-label="로트">' + esc(r.lot_number || '') + '</td>'
                            + '<td class="tar" data-label="재고">' + Number(r.stock).toLocaleString() + '</td>'
                            + '<td class="tar" data-label="이동량"><input type="number" class="si-qty" data-q="' + r.key
                            + '" value="' + r.qty + '" min="0" max="' + r.stock + '"/></td>'
                            + '<td><button type="button" class="si-del" data-del="' + r.key + '">✕</button></td>'
                            + '</tr>';
                    });
                }
                this.$content.find('#lcRows').html(html);
                this.sum();
            }

            sum() {
                const ok = this.rows.filter(r => r.qty > 0);
                const total = ok.reduce((a, r) => a + Number(r.qty || 0), 0);
                let txt = '로트 ' + ok.length + '건 / ' + total.toLocaleString() + '개';
                if (this.shortages && this.shortages.length) {
                    txt += ' · 재고부족 ' + this.shortages.length + '품목';
                }
                const $s = this.$content.find('#lcSummary');
                $s.text(txt);
                $s.css('color', (this.shortages && this.shortages.length) ? '#C0392B' : '#03428E');
            }

            submit() {
                const _this = this;
                const lines = this.rows.filter(r => Number(r.qty) > 0)
                    .map(r => ({mat_lot_id: r.mat_lot_id, qty: Number(r.qty)}));
                if (!lines.length) { Alert.alert('', '이동할 로트가 없습니다.'); return; }

                const total = lines.reduce((a, l) => a + l.qty, 0);
                let msg = '로트 ' + lines.length + '건 · 총 ' + total.toLocaleString() + '개를 불출합니다.';
                if (this.shortages && this.shortages.length) {
                    msg += '\n\n★ 재고가 모자란 품목이 있습니다:\n'
                        + this.shortages.map(s => ' · ' + s.name + ' ' + s.qty + '개 부족').join('\n');
                }

                Alert.confirm('', msg, function () {
                    AjaxUtil.postJsonData(_this.API + '/move', {
                        from_store: Number(_this.from),
                        to_store: Number(_this.to),
                        description: '수동 불출',
                        spjangcd: SPJ(),
                        lines: lines
                    }, function (res) {
                        if (!res || !res.success) {
                            Alert.alert('', (res && res.message) || '불출에 실패했습니다.');
                            return;
                        }
                        Notify.success('불출 완료 · ' + (res.data && res.data.move_no || ''));
                        _this.modal.close();
                        if (typeof _this.onDone === 'function') _this.onDone();
                    });
                });
            }
        }



        /* ══════════════════════════════════════════════════════════════
           불출 등록 = 창고 이동 (출발 → 도착)

           ★ 기존 addDataPopup 은 mat_inout out 한 줄만 남긴다.
             그건 "불출" 이 아니라 재고를 없애는 것이다. 받는 창고가 없고
             mat_lot 도 안 옮겨서, 옮긴 자재를 세척·조립이 찾지 못한다.
             그래서 이 화면은 출발/도착 두 창고를 받고 로트를 실제로 옮긴다.

           ★ 수량을 먼저 받지 않는다
             품목을 고르면 출발창고의 로트 재고가 펼쳐진다. 거기서 꺼낼 만큼
             적으면 그게 곧 수량이다. 총량을 받아 서버가 FIFO 로 쪼개면
             장부가 집은 로트와 작업자가 든 상자가 달라질 수 있다.
           ══════════════════════════════════════════════════════════════ */
        class IssueRegister {
            constructor() {
                this.API = '/api/inventory/move_scan';
                this.rows = [];      // 담긴 로트들
                this.lots = [];      // 현재 조회된 로트 재고
                this.seq = 0;
            }

            open() {
                const _this = this;
                const $content = $(tmpl('issueRegPopup', {}));
                this.$content = $content;

                this.modal = new PopupDraggable('불출 등록');
                /* 태블릿은 단계로 나누어 내용이 줄었으니 화면을 마음껏 쓴다.
                   TabletUtil.size 가 어차피 92vh 로 깎는다. */
                openPopup(this.modal, 880, 600, $content);

                $content.find('#irDate').val(new Date().toISOString().substring(0, 10));

                this.$from = $content.find('#irFrom');
                this.$to = $content.find('#irTo');
                AjaxUtil.fillSelectOptions(this.$from, 'store_house', '', false);
                AjaxUtil.fillSelectOptions(this.$to, 'store_house', '', false);
                this.$from.val('3');    // 자재창고
                this.$to.val('17');     // 생산창고

                // 품목조회 — 기존 화면과 같은 팝업을 그대로 쓴다
                $content.find('#irMatBtn').on('click', function () {
                    const cb = function (items) {
                        $content.find('#irMatId').val(items.id);
                        $content.find('#irMatName').val(items.Name);
                        _this.loadLots();
                    };
                    new PopupMaterialPage('single').show(cb);
                });

                // 출발창고를 바꾸면 지금 펼쳐둔 로트도, 담아둔 것도 의미가 달라진다
                this.$from.on('change', function () {
                    if (_this.rows.length) {
                        Alert.confirm('', '불출창고를 바꾸면 담은 목록이 초기화됩니다.', function () {
                            _this.rows = [];
                            _this.render();
                            _this.loadLots();
                        }, function () {
                            // 취소하면 되돌린다
                            _this.$from.val(_this.lastFrom || '3');
                        });
                    } else {
                        _this.loadLots();
                    }
                    _this.lastFrom = _this.$from.val();
                });
                this.lastFrom = this.$from.val();

                $content.find('#irAdd').on('click', function () { _this.addPicked(); });
                // ★ 담은 행을 빼면 로트 목록의 「잔여」가 그만큼 다시 늘어야 한다.
                //   drawLots 가 rows 를 기준으로 잔여를 계산하므로 같이 그려준다.
                $content.on('click', '[data-irdel]', function () {
                    _this.rows = _this.rows.filter(x => x.key !== this.dataset.irdel);
                    _this.render();
                    if (_this.lots.length) _this.drawLots();
                });

                // 로트 전체선택
                $content.on('change', '#irLotAll', function () {
                    $content.find('.ir-chk:not(:disabled)').prop('checked', this.checked);
                });
                // 수량을 적으면 그 줄은 자동으로 체크
                $content.on('input', '[data-lotq]', function () {
                    const on = Number(this.value || 0) > 0;
                    $content.find('.ir-chk[data-lot="' + this.dataset.lotq + '"]').prop('checked', on);
                });
                $content.find('#irClose').on('click', function () { _this.modal.close(); });
                $content.find('#irSave').on('click', function () { _this.save(); });

                this.render();
            }

            /* 선택 품목의 출발창고 로트 재고 */
            loadLots() {
                const _this = this;
                const matId = this.$content.find('#irMatId').val();
                const storeId = this.$from.val();
                if (!matId || !storeId) return;

                AjaxUtil.getAsyncData(this.API + '/lots', {
                    mat_id: matId, store_id: storeId, spjangcd: SPJ()
                }, function (res) {
                    _this.lots = (res && res.data) || [];
                    _this.drawLots();
                });
            }

            drawLots() {
                const $box = this.$content.find('#irLotBox');
                const matName = this.$content.find('#irMatName').val();

                if (!this.lots.length) {
                    $box.show();
                    this.$content.find('#irLotTitle').text(matName + ' — 로트 재고 없음');
                    this.$content.find('#irLotRows').html(
                        '<tr class="si-empty"><td colspan="4">이 창고에 재고가 있는 로트가 없습니다.</td></tr>');
                    return;
                }

                let html = '';
                this.lots.forEach((l) => {
                    // ★ 이미 담은 만큼을 뺀 「잔여」를 보여준다.
                    //   담은 행을 지우면 rows 에서 빠지므로 이 값이 자동으로 다시 늘어난다.
                    const used = this.rows.filter(r => Number(r.mat_lot_id) === Number(l.mat_lot_id))
                        .reduce((a, r) => a + Number(r.qty || 0), 0);
                    const left = Number(l.stock || 0) - used;
                    const dis = left <= 0;
                    html += '<tr' + (dis ? ' class="si-row-zero"' : '') + '>'
                        + '<td data-label="선택"><input type="checkbox" class="ir-chk" data-lot="' + l.mat_lot_id + '"'
                        + (dis ? ' disabled' : '') + '/></td>'
                        + '<td class="si-lot" data-label="로트">' + esc(l.lot_number || '')
                        + (l.effective_date ? '<span class="si-tag">~' + String(l.effective_date).substring(0, 10) + '</span>' : '')
                        + '</td>'
                        + '<td class="tar" data-label="잔여">' + Number(left).toLocaleString() + '</td>'
                        + '<td class="tar" data-label="담을 수량"><input type="number" class="si-qty" data-lotq="'
                        + l.mat_lot_id + '" min="0" max="' + left + '" value="'
                        + (left > 0 ? left : 0) + '"' + (dis ? ' disabled' : '') + '/></td>'
                        + '</tr>';
                });
                this.$content.find('#irLotTitle').text(matName + ' — 로트 재고');
                this.$content.find('#irLotRows').html(html);
                this.$content.find('#irLotAll').prop('checked', false);
                $box.show();
            }

            /* 체크한 로트를 아래 목록으로 담는다 */
            addPicked() {
                const _this = this;
                const matId = this.$content.find('#irMatId').val();
                if (!matId) { Alert.alert('', '품목을 먼저 조회하세요.'); return; }

                const $chk = this.$content.find('.ir-chk:checked');
                if (!$chk.length) { Alert.alert('', '담을 로트를 선택하세요.'); return; }

                let added = 0, skipped = 0;
                $chk.each(function () {
                    const lotId = Number(this.dataset.lot);
                    const q = Number(_this.$content.find('[data-lotq="' + lotId + '"]').val() || 0);
                    if (q <= 0) { skipped++; return; }

                    const lot = _this.lots.find(x => Number(x.mat_lot_id) === lotId);
                    if (!lot) return;

                    _this.rows.push({
                        key: 'i' + (++_this.seq),
                        mat_lot_id: lotId,
                        lot_number: lot.lot_number,
                        mat_code: lot.mat_code,
                        mat_name: lot.mat_name,
                        qty: q
                    });
                    added++;
                });

                if (!added) { Alert.alert('', '담을 수량이 0 입니다.'); return; }
                this.render();
                this.drawLots();     // 잔여 재계산
                if (skipped) Notify.success(added + '건 담김 (수량 0 인 ' + skipped + '건 제외)');
            }

            render() {
                const $tb = this.$content.find('#irRows');
                if (!this.rows.length) {
                    $tb.html('<tr class="si-empty"><td colspan="6">품목을 고르고 로트별 수량을 담으세요.</td></tr>');
                    return;
                }
                let html = '';
                this.rows.forEach((r, i) => {
                    html += '<tr>'
                        + '<td data-label="#">' + (i + 1) + '</td>'
                        + '<td data-label="품목코드">' + esc(r.mat_code || '') + '</td>'
                        + '<td data-label="품목">' + esc(r.mat_name || '') + '</td>'
                        + '<td class="si-lot" data-label="로트">' + esc(r.lot_number || '') + '</td>'
                        + '<td class="tar" data-label="불출량">' + Number(r.qty).toLocaleString() + '</td>'
                        + '<td><button type="button" class="si-del" data-irdel="' + r.key + '">✕</button></td>'
                        + '</tr>';
                });
                $tb.html(html);
            }

            save() {
                const _this = this;
                if (!this.rows.length) { Alert.alert('', '불출할 항목이 없습니다.'); return; }

                const from = this.$from.val(), to = this.$to.val();
                if (!from || !to) { Alert.alert('', '창고를 선택하세요.'); return; }
                if (from === to) { Alert.alert('', '불출창고와 입고창고가 같습니다.'); return; }

                const total = this.rows.reduce((a, r) => a + Number(r.qty || 0), 0);
                const fromName = this.$from.find('option:selected').text();
                const toName = this.$to.find('option:selected').text();

                Alert.confirm('',
                    fromName + ' → ' + toName + '\n로트 ' + this.rows.length + '건 · 총 '
                    + total.toLocaleString() + '개를 불출합니다.',
                    function () {
                        AjaxUtil.postJsonData(_this.API + '/move', {
                            from_store: Number(from),
                            to_store: Number(to),
                            description: _this.$content.find('#irDesc').val() || '불출 등록',
                            spjangcd: SPJ(),
                            lines: _this.rows.map(r => ({mat_lot_id: r.mat_lot_id, qty: Number(r.qty)}))
                        }, function (res) {
                            if (!res || !res.success) {
                                Alert.alert('', (res && res.message) || '불출에 실패했습니다.');
                                return;
                            }
                            Notify.success('불출 완료 · ' + (res.data && res.data.move_no || ''));
                            _this.modal.close();
                            if (window.page) page.searchDataBind();
                        });
                    });
            }
        }


        let page = null;
        let popup = null;
        let modalContainer = null;

        $(document).ready(function (e) {
            page = new materialStorehouse();

            $('#searchForm').find('#srchStartDt').val(CommonUtil.getYYYYMMDD(-7));
            $('#searchForm').find('#srchEndDt').val(CommonUtil.getYYYYMMDD());

            AjaxUtil.fillSelectOptions($('#searchForm').find('#cboHouse'), 'store_house', 'all');
            AjaxUtil.fillSelectOptions($('#cboMatType'), 'system_code', 'all', false, 'mat_type');
            AjaxUtil.fillSelectOptions($('#cboMatGroup'), 'material_group', 'all', false);

            /* 공장 콤보 — 기본값은 계정의 소속 공장. 없으면 '' = 전체.
               change 핸들러는 채운 «뒤에» 건다. fillSelectOptions 가 selected_value 를
               넣으면서 .change() 를 직접 발생시키므로 먼저 걸면 조회가 두 번 나간다. */
            const myFactory = (factory_id == null || factory_id === '' || Number(factory_id) <= 0)
                ? '' : String(factory_id);
            AjaxUtil.fillSelectOptions($('#Factory_id'), 'factory', 'all', myFactory);

            $('#Factory_id').on('change', function () {
                page.searchDataBind();
            });

            $('#cboMatType').on('change', function (e) {
                let mat_type = $('#cboMatType').val();
                AjaxUtil.fillSelectOptions($('#cboMatGroup'), 'material_group', 'all', false, mat_type);
            });

            // 검색
            $('#btnSearch').click(function (e) {
                page.searchDataBind();
            });
            $('#searchForm').find('#cboHouse').change(function (e) {
                page.searchDataBind();
            });
            // 불출 등록 (창고 이동)
            // ★ 기존 page.addDataPopup() 은 mat_inout out 한 줄만 남기고 로트를 안 옮긴다.
            //   메서드는 지우지 않고 두되, 이 버튼은 이동 개념 화면으로 연결한다.
            $('#btnInput').on('click', function () {
                new IssueRegister().open();
            });

            // 입고 반품
            $('#btnInputReturn').on('click', function () {
                page.returnDataPopup();
            });

            $('#btnMultiInput').on('click', function () {
                page.addMultiDataPopup('in');
            });
            // 발주입고
            $('#btnBaljuInput').on('click', function () {
                page.showBaljuInputPopup();
            });

            // 바코드 불출
            $('#btnScanIssue').on('click', function () {
                new ScanIssue().open();
            });

            // 바코드 불출 이력 (취소)
            $('#btnScanHist').on('click', function () {
                new ScanIssueHistory().open();
            });

            // 품목 창고이동 팝업 생성
            $('#btnShowMovePopup').click(function (e) {
                let movePopupPage = new MaterialMove();
                movePopupPage.showMovePopup();
            });

            page.searchDataBind();

            $('#searchForm').on('submit', function (e) {
                e.preventDefault(); // 기본 제출 막기
                $('#btnSearch').click(); // 검색 버튼 트리거
            });


        })


    </script>
