<html layout:decorate="~{layout_page}">

<head>
    <style>
        .grid-cell-red {
            background: rgb(248, 210, 203) !important;
        }

    </style>
</head>

<th:block layout:fragment="content">
    <div class="layout-contents">
        <div class="page-title-wrap">
            <div class="left">
                <h2>재고현황</h2>
                <a title="북마크" class="bookmark toggle">
                    내 메뉴
                </a>
                <label for="Factory_id" class="hide">공장</label>
                <select style="width: 110px;" id="Factory_id" name="Factory_id"></select>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>재고관리</li>
                <li>재고현황</li>
            </ul>
        </div>
        <section class="section">
            <div class="section-top">
                <div class="search-wrap">
                    <dl>
                        <dt>
                            <label for="cboMatType">
                                품목유형<span class="eq"></span>
                            </label>
                        </dt>
                        <dd>
                            <div class="srch-box">
                                <select id="cboMatType" name="cboMatType">
                                </select>
                            </div>
                        </dd>
                    </dl>

                    <dl>
                        <dt>
                            <label for="cboMatGrp">
                                품목그룹<span class="eq"></span>
                            </label>
                        </dt>
                        <dd>
                            <div class="srch-box">
                                <select id="cboMatGrp" name="cboMatGrp">
                                </select>
                            </div>
                        </dd>
                    </dl>

                    <dl>
                        <dt>
                            <label for="txtMatName">
                                품목명(코드)<span class="eq"></span>
                            </label>
                        </dt>
                        <dd>
                            <div class="srch-box">
                                <input id="txtMatName" name="txtMatName" />
                            </div>
                        </dd>
                    </dl>

                    <dl>
                        <dt>
                            <label for="cboStoreHouse">
                                창고
                            </label>
                        </dt>
                        <dd>
                            <div class="srch-box">
                                <select id="cboStoreHouse" name="cboStoreHouse">
                                </select>
                            </div>
                        </dd>
                    </dl>
                    <dl>
                        <dt>&nbsp;</dt>
                        <dd>
                            <li>
                                <a class="btn btn-delete" title="검색" id="btnSearch">
                                    <!--                                        class 쓰이는 곳 찾고 없으면 클래스명 수정하기-->
                                    <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                                    검색
                                </a>
                            </li>
                        </dd>
                    </dl>
                </div>
            </div>
            <div class="container-fluid">
                <div id="material-stock-grid" style="height: 730px;"></div>
            </div>
        </section>
    </div>
</th:block>

<th:block layout:fragment="scripts">

    <script th:inline="javascript">
        /* 로그인 사용자의 소속 공장. 없으면 null → «전체» 가 기본값이 된다 */
        const factory_id = [[${session.factory_id}]];
    </script>
    <script type="text/javascript">
        class MaterialStockPage {
            constructor() {
                this.gird = null;
                this.init();
                this.url = '/api/inventory/material_current_stock';
            }

            init() {
                let _this = this;
                this.grid = new wijmo.grid.FlexGrid('#material-stock-grid', {
                    autoGenerateColumns: false,
                    frozenColumns: 0, // 열 고정
                    headersVisibility: wijmo.grid.HeadersVisibility.Column,
                    /* 그룹 행을 클릭해 펼치고 접으려면 행 선택이 살아 있어야 편하다.
                       기존 동작(선택 불가)을 유지하고 싶으면 SelectionMode.None 으로 되돌려도
                       ± 아이콘 클릭 토글은 그대로 동작한다. */
                    selectionMode: wijmo.grid.SelectionMode.Row,
                    allowSorting: true, // 정렬 가능
                    formatItem: (sender, e) => {
                        if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
                            e.cell.style.textAlign = 'center';
                        }
                    },
                    columns: [
                        {binding: 'mat_type_name', header: '품목유형', width: 100, align: 'left', isReadOnly: true},
                        {binding: 'mat_grp_name', header: '품목그룹', width: 120, align: 'left', isReadOnly: true},
                        /* ★ 100 → 160. ETC-MFB-... 처럼 잘려서 코드 구분이 안 되던 문제 */
                        {binding: 'mat_code', header: '품목코드', width: 160, align: 'center', isReadOnly: true},
                        {binding: 'mat_name', header: '품목명', width: 250, align: 'left', isReadOnly: true},
                        {
                            binding: 'stock_price',
                            header: '재고금액',
                            width: 120,
                            align: 'right',
                            format: 'n0',
                            isReadOnly: true,
                            /* m."CurrentStock" * m."UnitPrice" — 품목 단위 값이라 합계가 아니다 */
                            aggregate: 'First'
                        },
                        {binding: 'unit_name', header: '단위', width: 70, align: 'center', isReadOnly: true},
                        {
                            binding: 'avail_stock',
                            header: '가용재고',
                            width: 100,
                            align: 'right',
                            format: 'n0',
                            isReadOnly: true,
                            aggregate: 'First',
                            visible: false
                        },
                        {
                            binding: 'reserve_stock',
                            header: '예약재고',
                            width: 100,
                            align: 'right',
                            format: 'n0',
                            isReadOnly: true,
                            aggregate: 'First',
                            visible: false
                        },
                        {
                            binding: 'cur_stock',
                            header: '총재고',
                            width: 100,
                            align: 'right',
                            format: 'n0',
                            /* ★★ 절대 'Sum' 을 쓰지 말 것.
                               m."CurrentStock" 는 품목 단위 값이라 창고 행마다 같은 값이 중복돼 있다.
                               창고가 3곳이면 총재고가 3배로 부풀어 보인다. */
                            aggregate: 'First'
                        },
                        {binding: 'house_name', header: '창고', width: 120, align: 'center', isReadOnly: true},
                        {
                            binding: 'house_stock',
                            header: '창고재고',
                            width: 100,
                            align: 'right',
                            format: 'n0',
                            isReadOnly: true,
                            /* mh."CurrentStock" — 창고 단위 값. 정상이면 합계 = 총재고 */
                            aggregate: 'Sum'
                        },
                        {binding: 'lot_use_yn', header: '로트관리유무', width: 120, align: 'center', isReadOnly: true},
                        {
                            binding: 'lot_count',
                            header: '로트 개수',
                            width: 100,
                            align: 'right',
                            format: 'n0',
                            isReadOnly: true,
                            aggregate: 'Sum'
                        },
                        {
                            binding: 'safety_stock',
                            header: '안전재고',
                            width: 100,
                            align: 'right',
                            format: 'n0',
                            isReadOnly: true,
                            aggregate: 'First'
                        }
                    ],
                    /* ★ 품목코드로 그룹. 서버가 품목 × 창고로 행을 내려주므로
                       접으면 품목당 한 줄, 펼치면 창고별 내역이 된다.
                       PropertyGroupDescription 의 두 번째 인자 반환값이 곧 그룹 키다.
                       m."Code" 가 spjangcd 안에서 유일하다는 전제 — 공장별로 같은 코드가
                       존재한다면 'mat_code' 대신 'id' 를 키로 쓰고 헤더만 따로 만들어야 한다. */
                    itemsSource: new wijmo.collections.CollectionView([], {
                        groupDescriptions: [
                            new wijmo.collections.PropertyGroupDescription(
                                'mat_code',
                                (item, prop) => `${item[prop]}  ${item.mat_name}`
                            )
                        ]
                    }),
                    itemFormatter: (panel, row, col, cell) => {
                        if (panel.cellType !== wijmo.grid.CellType.Cell) return;

                        const gr = panel.rows[row];
                        const column = panel.columns[col];
                        /* 그룹 행의 dataItem 은 CollectionViewGroup 이라 컬럼 값이 없다.
                           그룹 내 첫 행을 기준으로 판정한다(품목 단위 값이라 어느 행이든 같다). */
                        const isGroup = gr instanceof wijmo.grid.GroupRow;
                        const item = isGroup ? (gr.dataItem.items && gr.dataItem.items[0]) : gr.dataItem;
                        if (!item) return;

                        /* 총재고는 품목 단위 값이라 상세 행에 그대로 두면 같은 숫자가
                           창고 수만큼 반복된다. 그룹 행에만 남기고 상세 행은 비운다.
                           aggregate 는 데이터에서 계산하므로 셀을 비워도 합계는 그대로다.
                           ★ classList.add 대신 toggleClass — 셀 DOM 이 재사용되기 때문에
                             조건이 거짓일 때 떼주지 않으면 스크롤 후 색이 남는다. */
                        if (column.binding === 'cur_stock') {
                            if (isGroup) {
                                wijmo.toggleClass(cell, 'grid-cell-red', item.cur_stock < item.safety_stock);
                            } else {
                                cell.textContent = '';
                                wijmo.toggleClass(cell, 'grid-cell-red', false);
                            }
                        }

                        // 'house_stock' 열에 대해 조건에 따른 클래스 추가 (상세 행에만)
                        if (column.binding === 'house_stock') {
                            wijmo.toggleClass(cell, 'redText', !isGroup && item.house_stock < 0);
                        }
                    }
                });
                new FlexGridContextMenu(this.grid);
                this.grid.downloadFileName = '재고 현황 내역';
                /* 그룹 헤더는 코드 + 품목명만. 창고 수까지 보고 싶으면
                   '{value} ({count:n0}개 창고)' 로 바꾼다. */
                this.grid.groupHeaderFormat = '{value}';
            }

            searchDataBind() {
                let _this = this;

                let param = {
                    'action': 'read',
                    'mat_type': $('#cboMatType').val(),
                    'mat_grp_pk': $('#cboMatGrp').val(),
                    'mat_name': $('#txtMatName').val(),
                    'store_house_id': $('#cboStoreHouse').val(),
                    /* 빈 문자열이어도 반드시 보낸다 — 빈 값 = 전체 */
                    'factory_id': $('#Factory_id').val() || '',
                    'spjangcd' : sessionStorage.getItem('spjangcd')

                };


                let result = AjaxUtil.getSyncData(this.url + '/read', param);
                if (result != null) {
                    _this.grid.itemsSource.sourceCollection = result.data;
                }
            }

        }

        let page = null;

        $(document).ready(function (e) {
            page = new MaterialStockPage();

            AjaxUtil.fillSelectOptions($('#cboMatType'), 'system_code', 'all', null, 'mat_type');
            AjaxUtil.fillSelectOptions($('#cboMatGrp'), 'material_group', 'all', false);

            $('#cboMatType').on('change', function (e) {
                let mat_type = $('#cboMatType').val();
                AjaxUtil.fillSelectOptions($('#cboMatGrp'), 'material_group', 'all', false, mat_type);
            });

            $('#cboMatGrp').change(function () {
                let grp_pk = $('#cboMatGrp').val();

            });

            AjaxUtil.fillSelectOptions($('#cboStoreHouse'), 'store_house', 'all', false);

            /* 공장 콤보 — 기본값은 계정의 소속 공장. 없으면 '' = 전체.
               change 핸들러는 채운 «뒤에» 건다. fillSelectOptions 가 selected_value 를
               넣으면서 .change() 를 직접 발생시키므로 먼저 걸면 조회가 두 번 나간다. */
            const myFactory = (factory_id == null || factory_id === '' || Number(factory_id) <= 0)
                ? '' : String(factory_id);
            AjaxUtil.fillSelectOptions($('#Factory_id'), 'factory', 'all', myFactory);

            $('#Factory_id').on('change', function () {
                page.searchDataBind();
            });

            // 검색버튼
            $('#btnSearch').click(function (e) {
                page.searchDataBind();

            });

            page.searchDataBind();

        });


    </script>
</th:block>
</html>
