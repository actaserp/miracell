<html layout:decorate="~{layout_page}">
<head>
    <style>
        .uph-note { color:#8a94a4; font-size:12px; margin-top:10px; line-height:1.6; }

        /* ── KPI 카드 ─────────────────────────────── */
        .kpi-cards { display:flex; gap:12px; margin-bottom:12px; flex-wrap:nowrap; }
        .kpi-card {
            flex:1 1 0; min-width:0; background:#fff; border:1px solid #dde3ea;
            border-radius:6px; padding:10px 14px;
        }
        .kpi-card .label { font-size:12px; color:#7a8794; margin-bottom:6px; }
        .kpi-card .value { font-size:22px; font-weight:700; color:#22303c; line-height:1.1; }
        .kpi-card .value small { font-size:13px; font-weight:500; color:#7a8794; margin-left:3px; }
        .kpi-card.ok  .value { color:#1a8a4c; }
        .kpi-card.bad .value { color:#cc2f3e; }

        /* ── 차트 박스 ─────────────────────────────── */
        .chart-box {
            background:#fff; border:1px solid #dde3ea; border-radius:6px;
            padding:10px 18px 8px; height:230px;
            display:flex; flex-direction:column; overflow:hidden; margin-bottom:14px;
            margin-top: 18px;
        }
        .chart-head {
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:6px; flex:0 0 auto; height:20px;
        }
        .chart-head h3 { font-size:14px; font-weight:700; color:#22303c; margin:0; }
        .chart-legend { font-size:12px; color:#66727e; display:flex; gap:14px; align-items:center; }
        .chart-legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
        .lg-ok  { background:#2eaa63; }
        .lg-bad { background:#e05260; }
        .lg-tgt { width:14px !important; height:0 !important; border-top:2px dashed #8494a4; border-radius:0 !important; }

        /* ── 막대 영역 ─────────────────────────────── */
        .bars { flex:1 1 auto; min-height:0; display:flex; align-items:stretch; gap:10px; padding:18px 4px 0; }
        .bar-col { flex:1 1 0; min-width:0; height:100%; display:flex; flex-direction:column; align-items:center; }
        .bar-area { position:relative; width:100%; flex:1 1 auto; min-height:0; display:flex; align-items:flex-end; justify-content:center; }
        .bar { width:60%; max-width:46px; border-radius:3px 3px 0 0; position:relative; transition:height .35s ease; }
        .bar.ok  { background:linear-gradient(180deg, #3fc07a 0%, #2eaa63 100%); }
        .bar.bad { background:linear-gradient(180deg, #f2727f 0%, #e05260 100%); }
        .bar.empty { background:#e9edf1; }
        .bar .bar-val { position:absolute; top:-19px; left:50%; transform:translateX(-50%); font-size:11px; font-weight:700; color:#46535f; white-space:nowrap; }
        .tgt-line { position:absolute; left:6%; right:6%; border-top:2px dashed #8494a4; }
        .tgt-line span { position:absolute; right:0; top:-15px; font-size:10px; color:#8494a4; }

        .bar-x    { flex:0 0 16px; line-height:16px; margin-top:5px; font-size:12px; color:#66727e; }
        .bar-rate { flex:0 0 14px; line-height:14px; font-size:11px; font-weight:600; }
        .bar-rate.ok  { color:#1a8a4c; }
        .bar-rate.bad { color:#cc2f3e; }
        .bar-rate.na  { color:#b6bfc8; }
    </style>
</head>
<th:block layout:fragment="content">
    <div class="layout-contents">

        <div class="page-title-wrap">
            <div class="left">
                <h2>시간당 생산량</h2>
                <a title="북마크" class="bookmark toggle">내 메뉴</a>
            </div>
            <ul class="page-navi">
                <li><img src="/images/icon/ico-nav-home.svg" alt="홈아이콘"></li>
                <li>KPI 성과 지표</li>
                <li>시간당 생산량</li>
            </ul>
        </div>

        <section class="section">
            <div class="section-top">
                <div class="search-wrap">
                    <dl>
                        <dt><label for="cboYear">기준년도</label></dt>
                        <dd>
                            <div class="srch-box">
                                <select id="cboYear"></select>
                            </div>
                        </dd>
                    </dl>
                    <dl>
                        <dt><label for="txtTarget">목표 UPH</label></dt>
                        <dd>
                            <input type="text" id="txtTarget" name="txtTarget" value="100"
                                   style="width:90px;text-align:right;"> <span style="color:#8a94a4;font-size:12px;">EA/H</span>
                        </dd>
                    </dl>
                    <dl>
                        <dt>&nbsp;</dt>
                        <dd>
                            <li>
                                <a class="btn btn-delete" title="검색" id="btnSearch">
                                    <img src="/images/icon/btn-srch.svg" alt="검색 아이콘">
                                    검색
                                </a>
                            </li>
                        </dd>
                    </dl>
                </div>
            </div>

            <!-- KPI 요약 -->
            <div class="container-fluid">
                <div id="kpiCards"></div>
            </div>

            <!-- 목표 대비 달성 그래프 -->
            <div class="container-fluid">
                <div id="kpiChart" class="chart-box"></div>
            </div>

            <!-- 공정별 상세 그리드 -->
            <div class="container-fluid">
                <div id="theGrid" style="height: 480px;"></div>
                <p class="uph-note">
                    ※ 시간당생산량(UPH) = 생산수량 ÷ 작업시간. <b>작업시간은 설비 가동이력(equ_run)을 공정별로 합집합(union)</b>한 실측값이며,
                    같은 공정에 여러 설비·작업자가 겹쳐 투입돼도 중복 없이 한 번만 계산합니다.
                    목표 UPH는 상단 입력값 기준으로 달성/미달을 판정합니다.
                </p>
            </div>
        </section>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script type="text/javascript">
        class UphPage {
            constructor() {
                this.grid = null;
                this.rawRows = [];   // 서버 원본(공정별)
                this.init();
            }

            static num(v) {
                const n = Number(String(v ?? '').replace(/,/g, ''));
                return Number.isFinite(n) ? n : 0;
            }

            get target() {
                const t = UphPage.num($('#txtTarget').val());
                return t > 0 ? t : 0;
            }

            init() {
                this.grid = new wijmo.grid.FlexGrid('#theGrid', {
                    selectionMode: wijmo.grid.SelectionMode.Row,
                    headersVisibility: wijmo.grid.HeadersVisibility.Column,
                    allowSorting: wijmo.grid.AllowSorting.MultiColumn,
                    allowMerging: wijmo.grid.AllowMerging.Cells,
                    autoGenerateColumns: false,
                    showMarquee: true,
                    isReadOnly: true,
                    frozenColumns: 2,
                    formatItem: (sender, e) => {
                        if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
                            e.cell.style.textAlign = 'center';
                        }
                    },
                    columns: [
                        { binding: 'proc_name', header: '공정', width: 150, allowMerging: true },
                        { binding: 'gubn_label', header: '구분', width: 120 },
                        ...Array.from({ length: 12 }, (_, i) => ({
                            binding: `mon_${i + 1}`,
                            header: `${i + 1}월`,
                            width: 80,
                            align: 'right',
                            allowSorting: false
                        }))
                    ]
                });

                this.grid.itemFormatter = (panel, row, col, cell) => {
                    if (panel.cellType !== wijmo.grid.CellType.Cell) return;

                    const colName = panel.columns[col].binding;
                    const rowData = panel.rows[row]?.dataItem;
                    if (!rowData) return;

                    cell.style.fontWeight = '';
                    cell.style.background = '';
                    cell.style.borderBottom = '';
                    cell.style.color = '';

                    if (colName === 'proc_name') {
                        cell.style.textAlign = 'left';
                        cell.style.display = 'flex';
                        cell.style.alignItems = 'center';
                    }
                    if (colName === 'gubn_label') {
                        cell.style.textAlign = 'center';
                        if (rowData.gubn === '3') cell.style.fontWeight = 'bold';
                    }

                    if (colName.startsWith('mon_')) {
                        const value = panel.getCellData(row, col, false);
                        if (typeof value === 'number') {
                            cell.textContent = (rowData.gubn === '2' || rowData.gubn === '3')
                                ? wijmo.Globalize.format(value, 'n1')
                                : wijmo.Globalize.format(value, 'n0');
                        }
                        cell.style.textAlign = 'right';

                        // UPH 목표 대비 색상
                        if (rowData.gubn === '3' && typeof value === 'number' && value > 0 && this.target > 0) {
                            const r = value / this.target;
                            cell.style.fontWeight = 'bold';
                            if (r >= 1)        { cell.style.background = '#e3f6ec'; cell.style.color = '#0a7c46'; }
                            else if (r >= 0.8) { cell.style.background = '#fff4e0'; cell.style.color = '#b4560a'; }
                            else               { cell.style.background = '#fdecec'; cell.style.color = '#d64545'; }
                        }
                        if (value === 0) cell.style.color = '#c2c9d4';
                    }

                    // 전체 요약 블록 강조
                    if (rowData.__summary) {
                        cell.style.fontWeight = 'bold';
                        cell.style.background = cell.style.background || '#eef3f9';
                        if (rowData.gubn === '3') cell.style.borderBottom = '2px solid #444';
                    }
                };

                new FlexGridContextMenu(this.grid);
                this.grid.downloadFileName = '시간당 생산량';
                this.grid.mergeManager = new CustomMergeManager(this.grid);
            }

            searchMainData() {
                const _this = this;
                const url = '/api/summary/indicator/uph_read';
                const data = { 'cboYear': $('#cboYear').val() };

                AjaxUtil.getAsyncData(url, data, function (result) {
                    _this.rawRows = (result && result.success && result.data) ? result.data : [];
                    _this.renderAll();
                });
            }

            // 서버 공정행 -> gubn 3행으로 펼치고, 전체 요약을 얹는다
            expandRows(raw) {
                const rows = [];
                raw.forEach(pr => {
                    const qty = {}, hour = {}, uph = {};
                    for (let m = 1; m <= 12; m++) {
                        const q = UphPage.num(pr[`qty_${m}`]);
                        const h = UphPage.num(pr[`hour_${m}`]);
                        qty[`mon_${m}`] = q;
                        hour[`mon_${m}`] = h;
                        uph[`mon_${m}`] = h > 0 ? +(q / h).toFixed(1) : 0;
                    }
                    const base = { proc_code: pr.proc_code, proc_name: pr.proc_name };
                    rows.push(Object.assign({}, base, { gubn: '1', gubn_label: '생산수량' }, qty));
                    rows.push(Object.assign({}, base, { gubn: '2', gubn_label: '작업시간(H)' }, hour));
                    rows.push(Object.assign({}, base, { gubn: '3', gubn_label: '시간당생산량' }, uph));
                });
                return rows;
            }

            makeSummaryRows(raw) {
                const sumQty = {}, sumHour = {}, sumUph = {};
                for (let m = 1; m <= 12; m++) {
                    let q = 0, h = 0;
                    raw.forEach(pr => { q += UphPage.num(pr[`qty_${m}`]); h += UphPage.num(pr[`hour_${m}`]); });
                    sumQty[`mon_${m}`] = q;
                    sumHour[`mon_${m}`] = +h.toFixed(1);
                    sumUph[`mon_${m}`] = h > 0 ? +(q / h).toFixed(1) : 0;
                }
                const base = { proc_code: '__ALL__', proc_name: '전체', __summary: true };
                return [
                    Object.assign({}, base, { gubn: '1', gubn_label: '생산수량 합계' }, sumQty),
                    Object.assign({}, base, { gubn: '2', gubn_label: '작업시간 합계' }, sumHour),
                    Object.assign({}, base, { gubn: '3', gubn_label: '시간당생산량(전체)' }, sumUph)
                ];
            }

            renderAll() {
                const detail = this.expandRows(this.rawRows);
                const summary = this.makeSummaryRows(this.rawRows);
                this.grid.itemsSource = [...summary, ...detail];
                this.grid.frozenRows = summary.length;

                this.renderKpiPanel(summary);
            }

            /* ================= KPI 카드 + 목표대비 그래프 ================= */
            renderKpiPanel(summaryRows) {
                const qtyRow  = summaryRows.find(r => r.gubn === '1');
                const hourRow = summaryRows.find(r => r.gubn === '2');
                const uphRow  = summaryRows.find(r => r.gubn === '3');
                const target  = this.target;

                const months = [];
                let totQty = 0, totHours = 0;

                for (let m = 1; m <= 12; m++) {
                    const key = `mon_${m}`;
                    const qty  = qtyRow[key]  || 0;
                    const hour = hourRow[key] || 0;
                    const perf = uphRow[key]  || 0;
                    const active = hour > 0;

                    if (active) { totQty += qty; totHours += hour; }

                    months.push({
                        m, qty, perf, active,
                        rate: (active && target > 0) ? (perf / target * 100) : 0,
                        ok: active && target > 0 && perf >= target
                    });
                }

                const kpi = totHours > 0 ? totQty / totHours : 0;
                const activeMonths = months.filter(x => x.active);
                const okCnt  = activeMonths.filter(x => x.ok).length;
                const badCnt = activeMonths.length - okCnt;
                const kpiOk  = target > 0 && kpi >= target;

                // Y축 스케일 (실적/목표 근처로 좁힘)
                const vals = [];
                months.forEach(x => { if (x.active) vals.push(x.perf); });
                if (target > 0) vals.push(target);
                const vMax = Math.max(...vals, 1);
                const vMin = Math.min(...vals, vMax);
                const pad  = Math.max((vMax - vMin) * 0.6, vMax * 0.05);
                const base = Math.max(vMin - pad, 0);
                const span = (vMax + pad * 0.6) - base || 1;
                const pct  = v => Math.min(Math.max((v - base) / span * 100, 2), 100);

                const fmt = (v, d = 0) => v.toLocaleString('ko-KR',
                    { minimumFractionDigits: d, maximumFractionDigits: d });

                const cardHtml = `
              <div class="kpi-cards">
                <div class="kpi-card">
                  <div class="label">누적 생산수량</div>
                  <div class="value">${fmt(totQty)}<small>EA</small></div>
                </div>
                <div class="kpi-card">
                  <div class="label">누적 작업시간</div>
                  <div class="value">${fmt(totHours, 1)}<small>H</small></div>
                </div>
                <div class="kpi-card ${kpiOk ? 'ok' : 'bad'}">
                  <div class="label">시간당생산량 (목표 ${fmt(target, 0)})</div>
                  <div class="value">${fmt(kpi, 1)}<small>EA/H</small></div>
                </div>
                <div class="kpi-card">
                  <div class="label">목표 달성 현황</div>
                  <div class="value">${okCnt}<small>달성</small> / ${badCnt}<small>미달</small></div>
                </div>
              </div>`;

                let html = `
                <div class="chart-head">
                  <h3>월별 목표 대비 달성 (시간당생산량)</h3>
                  <div class="chart-legend">
                    <span><i class="lg-ok"></i>목표 달성</span>
                    <span><i class="lg-bad"></i>목표 미달</span>
                    <span><i class="lg-tgt"></i>목표 ${fmt(target, 0)}</span>
                  </div>
                </div>
                <div class="bars">`;

                months.forEach(x => {
                    const h  = x.active ? pct(x.perf) : 0;
                    const th = (x.active && target > 0) ? pct(target) : -1;
                    const cls = !x.active ? 'empty' : (x.ok ? 'ok' : 'bad');

                    html += `
                  <div class="bar-col">
                    <div class="bar-area">
                      ${th >= 0 ? `<div class="tgt-line" style="bottom:${th}%"><span>${fmt(target)}</span></div>` : ''}
                      <div class="bar ${cls}" style="height:${h}%">
                        ${x.active ? `<span class="bar-val">${fmt(x.perf, 1)}</span>` : ''}
                      </div>
                    </div>
                    <div class="bar-x">${x.m}월</div>
                    <div class="bar-rate ${x.active ? (x.ok ? 'ok' : 'bad') : 'na'}">
                      ${x.active ? fmt(x.rate, 0) + '%' : '-'}
                    </div>
                  </div>`;
                });
                html += `</div>`;

                document.getElementById('kpiCards').innerHTML = cardHtml;
                document.getElementById('kpiChart').innerHTML = html;
            }
        }

        let page = null;

        $(document.body).ready(function (e) {
            page = new UphPage();

            AjaxUtil.fillSelectOptions($('#cboYear'), 'data_year', '', false);

            page.searchMainData();

            $('#btnSearch').click(function (e) {
                page.searchMainData();
            });
            $('#txtTarget').on('change', function (e) {
                page.renderAll();  // 목표만 바뀌면 재조회 없이 다시 그림
            });
        });

        class CustomMergeManager extends wijmo.grid.MergeManager {
            getMergedRange(panel, row, col, clip = true) {
                if (panel.cellType !== wijmo.grid.CellType.Cell) {
                    return super.getMergedRange(panel, row, col, clip);
                }
                const colName = panel.columns[col].binding;
                if (colName === 'proc_name') {
                    const val = panel.getCellData(row, col, false);
                    let rng = new wijmo.grid.CellRange(row, col);
                    while (rng.row > 0) {
                        if (panel.getCellData(rng.row - 1, col, false) !== val) break;
                        rng.row--;
                    }
                    while (rng.row2 < panel.rows.length - 1) {
                        if (panel.getCellData(rng.row2 + 1, col, false) !== val) break;
                        rng.row2++;
                    }
                    return rng.isSingleCell ? null : rng;
                }
                return super.getMergedRange(panel, row, col, clip);
            }
        }
    </script>
</th:block>
</html>
