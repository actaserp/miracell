<html layout:decorate="~{layout_page}">
<th:block layout:fragment="content">
    <style>
        /* 카메라 스캔 — 포장·세척 화면(.scanwrap)과 같은 구조·같은 규칙 */
        .lotscan{display:none;position:relative;border-radius:12px;overflow:hidden;background:#0d1417;
            width:420px;max-width:100%;aspect-ratio:4/3;max-height:34vh;margin:8px 0}
        .lotscan.on{display:block}
        .lotscan video{width:100%;height:100%;object-fit:cover;display:block}
        .lotscan .frame{position:absolute;inset:14% 8%;border:3px solid rgba(255,255,255,.85);
            border-radius:10px;box-shadow:0 0 0 100vmax rgba(0,0,0,.28);pointer-events:none}
        .lotscan .frame.hit{border-color:#31C48D}
        .lotscan .msg{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;
            background:rgba(13,20,23,.72);color:#fff;font-weight:700;font-size:13px;text-align:center}
        .lotscan .msg.warn{color:#FFD5CE}
        .lotscan .camstop{position:absolute;right:8px;top:8px;height:32px;padding:0 12px;border-radius:8px;
            border:none;background:rgba(21,34,43,.72);color:#fff;font-weight:700;font-size:13px;cursor:pointer}

        /* ── 레이아웃 ────────────────────────────────────────────────────── */
        /* ★ «폭 기준» 이 아니라 «자리 기준» 으로 접는다.
             미디어쿼리(max-width)는 브라우저 창 크기를 보는데, 이 화면은 탭·사이드바
             안쪽에 들어 있어 실제로 쓸 수 있는 폭이 창보다 훨씬 좁다.
             그래서 창이 1400px 이어도 내용 영역은 900px 뿐인 상황이 생기고,
             미디어쿼리는 그걸 모르니 2단을 유지해 가로 스크롤이 났다.
             flex-wrap + flex-basis 로 두면 «두 단이 들어갈 자리가 없을 때» 스스로 접힌다. */
        /* ★ align-items 를 stretch(기본값)로 둔다.
             flex-start 면 각 단이 «내용만큼만» 높이를 가져, 짧은 쪽 아래가 통째로 빈다.
             stretch 면 두 단이 같은 높이가 되고, 그 안에서 그리드가 남는 공간을 채운다. */
        .page-split { display: flex; flex-wrap: wrap; gap: 5px;
            width: 100%; max-width: 100%; overflow-x: hidden; }
        /* 640px : 이보다 좁으면 그리드 칸이 «판...» 처럼 잘려 읽을 수 없다.
           둘이 못 들어가면 한 단으로 접혀 각 그리드가 폭을 다 쓴다. */
        .page-split > .section { flex: 1 1 640px; min-width: 0; max-width: 100%;
            display: flex; flex-direction: column; }
        /* 섹션 안에서도 «남는 높이» 를 그리드 상자가 받아야 한다.
           안 그러면 섹션만 늘어나고 그리드는 그대로라 빈칸이 그대로 남는다. */
        .page-split > .section > form { flex: 0 0 auto; }
        .page-split #divList { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
        .page-split #divList > .container-fluid { flex: 1 1 auto; min-height: 0; display: flex; }
        .page-split #theGrid { flex: 1 1 auto; min-height: 240px; }
        /* 오른쪽 단도 같은 규칙 — 두 그리드가 높이를 나눠 갖는다 */
        .page-split > .section > .section-top { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
        /* ★ 인라인 style="flex:1" 이 다시 끼어들어도 지지 않게 못을 박는다.
             인라인이 CSS 보다 세서 basis 가 0 이 되면 «아무리 좁아져도» 안 접힌다.
             이 화면은 그 문제로 두 번 되돌아왔다. */
        .page-split > .section[style] { flex: 1 1 640px !important; min-width: 0 !important; }
        /* ★ min-width:0 이 핵심이다. flex 자식은 기본값이 min-width:auto 라
             내용(그리드)보다 작아지지 못하고, 그만큼 부모를 밀어 가로 스크롤을 만든다. */
        .page-split .container-fluid,
        .page-split form,
        .page-split .grid_box { min-width: 0; max-width: 100%; }
        .layout-contents { min-width: 0; max-width: 100%; overflow-x: hidden; }
        /* 그리드는 «자기 안에서» 스크롤한다. 페이지가 밀리지 않는다 */
        #theGrid, #theGrid2, #theGrid3 { width: 100%; max-width: 100%; overflow: auto; }
        /* 검색 폼도 좁아지면 접힌다 — 한 줄에 몰리면 폼이 페이지를 밀어낸다 */
        .page-split .search-wrap { display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: 100%; }
        .page-split .search-wrap dl { min-width: 0; }
        .page-split .title_box { flex-wrap: wrap; gap: 6px; }

        /* ── 검색 조건 압축 ────────────────────────────────────────────────
           라벨이 입력 «위» 에 얹혀 있어 한 줄이 두 줄 높이를 먹는다.
           태블릿은 세로가 귀하다 — 라벨을 왼쪽으로 돌려 높이를 절반으로 줄이고,
           칸 사이 여백도 좁힌다. 그래도 폭이 모자라면 알아서 다음 줄로 내려간다. */
        .page-split .section-top { padding-top: 8px; padding-bottom: 8px; }
        .page-split .search-wrap { gap: 6px 14px; align-items: center; }
        .page-split .search-wrap dl {
            display: flex; align-items: center; gap: 6px; margin: 0; }
        .page-split .search-wrap dt { margin: 0; }
        .page-split .search-wrap dt label {
            margin: 0; font-size: 13px; white-space: nowrap; line-height: 1.2; }
        .page-split .search-wrap dd { margin: 0; }
        /* 입력·선택 높이를 맞춰 줄이 들쭉날쭉하지 않게 */
        .page-split .search-wrap input[type=date],
        .page-split .search-wrap input[type=text],
        .page-split .search-wrap select { height: 34px; }
        .page-split .search-wrap select { min-width: 110px; }
        /* 검색 버튼은 같은 줄 끝에 붙인다 */
        .page-split .search-wrap .btn-search,
        .page-split .search-wrap button { height: 34px; }
        /* 그리드 위 여백도 줄인다 */
        .page-split .grid_box { margin-top: 4px; }
        .page-split .title_box { margin: 4px 0; }


        /* ── 태블릿 (≤1280px) ─────────────────────────────────────────────
           세로로 세워 쓰는 태블릿이 기준이다. 좌우 2단은 폭이 모자라
           그리드가 두어 칸만 보인다 — 위아래로 쌓는다.
           ★ 손가락으로 누르는 화면이라 버튼·입력은 최소 44px 로 키운다. */
        @media (max-width: 1280px) {
            .page-split > .section { flex: 1 1 100%; }   /* 확실히 한 단으로 */

            /* 한 화면에 세 그리드가 다 들어오도록 높이를 나눈다 */
            #theGrid  { height: 24vh !important; }
            #theGrid2 { height: 20vh !important; }
            #theGrid3 { height: 24vh !important; }

            /* 터치 타깃 — 다만 «검색 조건» 안의 컨트롤은 제외한다.
               여기까지 44px 로 키우면 검색부가 다시 세로를 다 먹는다.
               손이 자주 가는 것은 스캔·LOT 버튼과 그리드이지 검색 폼이 아니다. */
            .btn-default, .btn-danger, .btn, .btn-popup {
                min-height: 44px !important; padding: 0 14px !important; font-size: 15px !important; }
            .page-split .search-wrap .btn-default,
            .page-split .search-wrap button {
                min-height: 36px !important; height: 36px !important; font-size: 14px !important; }
            /* 16px 미만이면 iOS 가 입력할 때 화면을 확대한다 */
            #LotNumber { width: 180px !important; height: 44px !important; font-size: 16px !important; }

            /* 검색 폼이 한 줄에 몰려 잘리지 않게 */
            .search-wrap { flex-wrap: wrap !important; }
            .search-wrap dl { margin-bottom: 6px; }
            .title_box { flex-wrap: wrap; gap: 6px; }

            /* 스캔 영역은 가로를 다 쓴다 — 라벨을 크게 비출수록 잘 읽힌다 */
            .lotscan { width: 100% !important; max-width: none !important; max-height: 32vh !important; }
        }

        /* ── 세로 태블릿 (≤900px) ── */
        @media (max-width: 900px) {
            #theGrid  { height: 22vh !important; }
            #theGrid2 { height: 18vh !important; }
            #theGrid3 { height: 22vh !important; }
            /* 제목과 버튼이 한 줄에 안 들어가면 버튼 줄을 통째로 내린다 */
            .title_box .right_align { width: 100%; }
            #LotNumber { flex: 1 1 140px; width: auto !important; min-width: 140px; }
        }
    </style>

<th:block layout:fragment="scripts">
    <th:block th:replace="/common/columns_setting :: columns_setting"></th:block>
    <!-- ★ 카메라 바코드 스캔 공통 모듈 — 세척·포장 화면과 같은 파일. -->
    <script type="text/javascript" th:src="@{/js/barcode_cam.js}"></script>
    <script type="text/javascript">

        let gUrl = '/api/shipment/shipment_do_a';
        let $content;
        let modalContainer;
        let SelectItem = [];
        let enterFlag = false;


        /* GS1-128 → (10) 로트 추출. 포장 화면(prod_process_opack_*)과 같은 함수다.
           현장에서 같은 바코드를 포장에서도 출고에서도 찍기 때문에
           파싱이 어긋나면 한쪽에서만 조회된다.
           ★ GS1 형태일 때만 파싱한다 — 무조건 파싱하면 숫자로 시작하는
             사내 로트번호(20…, 01…)가 AI 로 오인돼 잘린다. */
        /* 스캐너·카메라마다 같은 라벨을 다르게 준다 — 심볼로지 식별자(]C1 …),
           FNC1 대체문자(| ~ ^ <GS>), 공백·개행을 한 형태로 다림질한다. */
        function normRaw(raw) {
            var s = String(raw == null ? '' : raw);
            s = s.replace(/^\](?:C1|d2|Q3|e0|E0|C0)/i, '');
            s = s.replace(/<GS>|\u241D|\u001d/gi, '\u001d');
            s = s.replace(/[|~^]/g, '\u001d');
            return s.replace(/\s+/g, '').trim();
        }

        /* 가변길이 AI 의 끝. GS 가 없으면 뒤따르는 AI 를 추정해 끊는다 —
           GS 를 떨어뜨리는 스캐너에서 (10)로트가 뒤의 (30)(11)까지 삼켰다. */
        function varEnd(s, i, curAi) {
            var GS = '\u001d';
            var g = s.indexOf(GS, i);
            if (g >= 0) return g;
            for (var j = i + 1; j <= s.length - 3; j++) if (aiTailOk(s.substring(j), curAi)) return j;
            return s.length;
        }
        /* 남은 문자열이 AI 열로 온전히 읽히는가 — 가변 AI 는 되짚기로 푼다.
           (00)(01)(02)(20) 은 인정하지 않는다(맨 앞에만 오는 것들이라
           허용하면 로트 한복판 숫자를 GTIN 으로 오독해 로트가 짧게 잘린다). */
        function aiTailOk(t, curAi) {
            var DATE = {'11':1,'12':1,'13':1,'15':1,'16':1,'17':1};
            var GS = '\u001d';
            function ok(k, seen) {
                while (k < t.length && t[k] === GS) k++;
                if (k >= t.length) return seen > 0;
                var ai = t.substr(k, 2);
                /* ★ 끊은 자리 바로 뒤에 «같은 AI» 가 또 나오는 절단은 버린다.
                     GS1 은 같은 AI 를 한 번만 쓴다. 안 막으면 로트 안의 숫자를
                     다음 AI 로 오인해 앞에서 잘린다 —
                       (10)M2FJ109400 → 'M2FJ' + (10)'9400' 으로 읽혔다. */
                if (seen === 0 && curAi && ai === curAi) return false;
                if (DATE[ai]) {
                    var v = t.substr(k + 2, 6);
                    if (!/^\d{6}$/.test(v)) return false;
                    var mm = +v.substr(2, 2), dd = +v.substr(4, 2);
                    if (mm < 1 || mm > 12 || dd > 31) return false;
                    return ok(k + 8, seen + 1);
                }
                if (ai === '30' || ai === '37') {
                    var g2 = t.indexOf(GS, k + 2);
                    if (g2 >= 0) {
                        if (!/^\d{1,8}$/.test(t.substring(k + 2, g2))) return false;
                        return ok(g2, seen + 1);
                    }
                    for (var n = 1; n <= 8 && k + 2 + n <= t.length; n++) {
                        if (!/^\d+$/.test(t.substr(k + 2, n))) break;
                        if (ok(k + 2 + n, seen + 1)) return true;
                    }
                    return false;
                }
                if (ai === '10' || ai === '21') {
                    var g3 = t.indexOf(GS, k + 2);
                    if (g3 >= 0) return g3 > k + 2 && ok(g3, seen + 1);
                    for (var n2 = 1; k + 2 + n2 <= t.length; n2++) if (ok(k + 2 + n2, seen + 1)) return true;
                    return false;
                }
                return false;
            }
            return ok(0, 0);
        }

        /* GS1-128 → (10) 로트 추출. 포장 화면(prod_process_opack_*)과 같은 규칙이다.
           ★ GS1 형태일 때만 파싱한다 — 무조건 파싱하면 숫자로 시작하는
             사내 로트번호(20…, 01…)나 카톤번호(C-…-KR-01)가 AI 로 오인돼 잘린다. */
        function pickLot(raw) {
            raw = normRaw(raw);
            if (!raw) return '';
            var m;
            if (raw.indexOf('(') >= 0) {
                if ((m = raw.match(/\(10\)([^()\u001d]+)/))) return m[1].trim();
                return raw;
            }
            var GS = '\u001d';
            var isGs1 = raw.indexOf(GS) >= 0 || /^01\d{14}/.test(raw);
            if (!isGs1) return raw;
            var FIXED = {'00':18,'01':14,'02':14,'11':6,'12':6,'13':6,'15':6,'16':6,'17':6,'20':2};
            var i = 0;
            while (i < raw.length) {
                if (raw[i] === GS) { i++; continue; }
                var ai = raw.substr(i, 2); i += 2;
                var flen = FIXED[ai];
                if (flen != null) { i += flen; }
                else {
                    var end = varEnd(raw, i, ai);
                    var v = raw.substring(i, end); i = end;
                    if (ai === '10') return v.trim();
                }
            }
            return raw;
        }

        /* ── 카메라 스캔 — 공통 모듈(BarcodeCam) ──────────────
           세척·포장 화면이 쓰는 /js/barcode_cam.js 를 그대로 이식했다.
           카메라를 여는 일(해상도 단계 재시도·초점·감지루프)은 전부 모듈이 맡고,
           이 화면은 «읽은 값을 어떻게 해석할지» 만 가진다.

           스캐너(키보드 웨지)를 대체하지 않는다 — 둘 다 같은 경로로 흘러간다. */
        var lotCam = null;                 // BarcodeCam 인스턴스
        var lotCamOn = false;              // 렌즈가 켜져 있는가
        var lotCamLast = '', lotCamLastAt = 0;

        function lotCamReason() {
            if (typeof BarcodeCam === 'undefined')
                return '바코드 모듈(barcode_cam.js)을 불러오지 못했습니다. 스캐너나 직접 입력을 사용하세요.';
            var c = BarcodeCam.check();
            return c.ok ? null : String(c.msg || '카메라를 쓸 수 없습니다').split('\n')[0];
        }
        function lotCamMsg(msg, warn) {
            var m = document.getElementById('lotScanMsg');
            if (!m) return;
            m.className = 'msg' + (warn ? ' warn' : '');
            m.textContent = msg || '';
        }
        function lotCamStop() {
            if (lotCam) lotCam.stop();
            lotCamOn = false;
            var w = document.getElementById('lotScanWrap');
            if (w) w.classList.remove('on');
            lotCamLast = '';
        }
        // 탭을 벗어나면 렌즈를 놓는다. 안 놓으면 켜진 채 남는다.
        document.addEventListener('visibilitychange', function () { if (document.hidden) lotCamStop(); });

        async function lotCamStart() {
            var w = document.getElementById('lotScanWrap');
            var why = lotCamReason();
            if (w) w.classList.add('on');   // 사유를 보여 주어야 하므로 안 될 때도 펌다
            if (why) { lotCamMsg(why, true); return; }
            lotCamMsg('카메라 준비 중…');
            if (!lotCam) {
                lotCam = BarcodeCam.create({
                    video: document.getElementById('lotScanVideo'),
                    /* ★ 출고 라벨은 사내 GS1-128 뿐이다. itf 를 열면 Code128 의 굵기
                         패턴 일부를 자기 코드로 착각해 「151557842676」 같은 값을 만든다. */
                    formats: ['code_128'],
                    continuous: true,       // 박스를 연달아 찍는다
                    onScan: onLotCamScan,
                    onStatus: function (m) { lotCamMsg(m); },
                    onError: function (m) { lotCamOn = false; lotCamMsg(String(m || '').split('\n')[0], true); }
                });
            }
            try {
                await lotCam.start();
                lotCamOn = true;
                lotCamMsg('라벨을 비추세요');
            } catch (e) {
                lotCamStop();
                if (w) w.classList.add('on');
                lotCamMsg('카메라를 열 수 없습니다 — ' + (e && e.name === 'NotAllowedError'
                    ? '권한이 거부되었습니다. 브라우저 설정에서 카메라를 허용하세요.'
                    : (e && e.message || e)), true);
            }
        }

        function lotCamFlash() {
            var fr = document.getElementById('lotScanFrame');
            if (!fr) return;
            fr.classList.add('hit');
            setTimeout(function () { fr.classList.remove('hit'); }, 350);
        }
        function lotCamBeep() {
            try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
            try {
                var C = window.AudioContext || window.webkitAudioContext;
                if (!C) return;
                var ac = new C(), o = ac.createOscillator(), g = ac.createGain();
                o.frequency.value = 1760; g.gain.value = 0.05;
                o.connect(g); g.connect(ac.destination); o.start();
                setTimeout(function () { o.stop(); ac.close(); }, 90);
            } catch (e) {}
        }

        /* ★ 감지 루프는 모듈이 돌린다 — 여기는 «읽힌 값 한 개» 를 받아 해석만 한다.
           같은 값 2.5초 무시는 그대로 남긴다 — 같은 박스를 계속 비추고 있을 때
           목록에 중복으로 담기지 않게 막는 자리다. */
        function onLotCamScan(raw) {
            raw = String(raw || '').trim();
            if (!raw) return;
            var w = document.getElementById('lotScanWrap');
            if (!w || !w.classList.contains('on')) return;   // 접혔으면 무시

            var now = Date.now();
            if (raw === lotCamLast && now - lotCamLastAt < 2500) return;
            lotCamLast = raw; lotCamLastAt = now;

            lotCamBeep(); lotCamFlash();
            lotCamMsg('읽었습니다 — ' + raw);
            /* ★ 카메라는 «팝업을 열지 않는다» — 바로 목록에 담는다.
               박스를 연달아 찍는 흐름이라 매번 팝업이 뜨면 손이 두 번 더 간다.
               후보가 애매할 때만 quickShipByScan 이 팝업으로 넘긴다. */
            var $in = $('#LotNumber');
            if ($in.is(':disabled')) { lotCamMsg('출하 항목을 먼저 선택하세요.', true); return; }
            var key = pickLot(raw);
            $in.val(key);
            if (window.__shipPage && typeof window.__shipPage.quickShipByScan === 'function') {
                window.__shipPage.quickShipByScan(key);
            } else {
                $in.trigger($.Event('keypress', {keyCode: 13, which: 13}));
            }
        }


        class ShipmentProcessPage {

                this.shipmentHeaderGrid = null;
                this.shipmentListGrid = null;
                this.lotListGrid = null;

                this.init();
            }

            init() {

                this.$LotNumber = $('#LotNumber');
                this.$btnLOTSelect = $('#btnLOTSelect');
                this.$btnLOTSelectCancel = $('#btnLOTSelectCancel');
                let $cboCompany = $('#cboCompany');

                AjaxUtil.fillSelectOptions($cboCompany, 'company', 'choose', '', 'sale');
                AjaxUtil.fillSelectOptions($('#cboMatGroup'), 'material_group', 'all', '', 'product,semi,sangpum');
                // $('#cboMatGroup').change(function (e) {
                //     let mat_grp_pk = $('#cboMatGroup').val();
                //     AjaxUtil.fillSelectOptions($('#cboMaterial'), 'material', 'all', '', mat_grp_pk);

                // init() 안, 콤보 채운 직후

                    AjaxUtil.fillSelectOptions($('#cboMaterial'), 'material', 'all', '', mat_grp_pk);

                $('#cboMatGroup').trigger('change');

                $cboCompany.change(function () {
                    // 판매처 타이틀
                    $cboCompany.attr('title', $('#cboCompany option:checked').text());
                });

                /* ★ wijmo 그리드는 컨테이너 폭이 바뀌어도 스스로 다시 재지 않는다.
                     레이아웃이 접히거나(2단→1단) 태블릿을 돌리면 옛 폭 그대로 남아
                     칸이 잘려 보인다 — 창 크기가 바뀌면 세 그리드를 다시 그린다. */
                let _rzTimer = null;
                window.addEventListener('resize', () => {
                    clearTimeout(_rzTimer);
                    _rzTimer = setTimeout(() => {
                        this.applyCompactColumns();
                        [this.shipmentHeaderGrid, this.shipmentListGrid, this.lotListGrid]
                        .forEach(g => { try { if (g) g.invalidate(true); } catch (e) {} });
                    }, 150);
                });

                this.initShipmentHeader();
                this.initShipmentList();
                this.initLotList();
                this.applyCompactColumns();   // 첫 진입에도 폭에 맞춰 접어 둔다
                /* ★ 그리드 높이가 flex 로 «나중에» 정해진다.
                     생성 시점엔 부모 높이가 0 이라 wijmo 가 옛 크기로 그려 둔다 —
                     레이아웃이 잡힌 뒤 한 번 다시 그린다. */
                setTimeout(() => {
                    [this.shipmentHeaderGrid, this.shipmentListGrid, this.lotListGrid]
                    .forEach(g => { try { if (g) g.invalidate(true); } catch (e) {} });
                }, 0);

            }

            /* 폭이 좁으면 «부차 컬럼» 을 접는다.
             *
             *   칸을 다 띄우면 제목이 「판...」 「출...」 로 잘려 아무것도 못 읽는다.
             *   이 화면에서 «보기만» 하는 값(금액·부가세)을 먼저 감추고,
             *   식별·수량처럼 작업에 필요한 칸을 남긴다.
             *   ★ 감추는 것이지 지우는 것이 아니다 — 넓어지면 그대로 돌아온다.
             *   ★ 기준은 «그리드 한 칸이 실제로 쓰는 폭» 이다. 2단이면 절반씩
             *     나눠 쓰므로 페이지가 넓어도 각 칸은 좁다.
             */
            applyCompactColumns() {
                let wrap = document.querySelector('.page-split');
                let w = wrap ? wrap.clientWidth : 0;
                let twoCol = w >= 640 * 2 + 5;          // 두 단이 들어가는가
                let colW = twoCol ? (w - 5) / 2 : w;    // 그리드 한 칸이 쓰는 폭
                let narrow = colW < 900;

                let hide = function (grid, names, on) {
                    if (!grid || !grid.columns) return;
                    names.forEach(function (n) {
                        let c = grid.columns.getColumn(n);
                        if (c) c.visible = !on;
                    });
                };
                // 출고 지시 목록 — 금액 계열은 여기서 쓰지 않는다
                hide(this.shipmentHeaderGrid, ['total_price', 'total_vat', 'description'], narrow);
                // 출하상세 — 단가·공급가·부가세는 등록 화면에서 참고값이다
                hide(this.shipmentListGrid,
                    ['unit_price', 'price', 'vat', 'invat_yn', 'total_price', 'standard', 'mat_grp_name'], narrow);
                // LOT상세 — 유효기간은 접어도 작업에 지장이 없다
                hide(this.lotListGrid, ['EffectiveDate'], narrow);
            }

            initShipmentHeader() {

                this.shipmentHeaderGrid.hostElement.addEventListener('click', (e) => {

            /* ★ 스캔 한 번으로 «팝업 없이» 목록에 담는다.
               카메라로 찍을 때마다 팝업이 뜨면 박스 4개를 연달아 찍는 흐름이 끊긴다.
               후보가 하나로 떨어질 때만 바로 담고, 애매하면 예전처럼 팝업을 연다 —
               사람이 골라야 할 상황에서 임의로 정하면 엉뚱한 박스가 나간다.

               담을 수 있는 조건
                 · 출고 지시(헤더)와 품목(theGrid2) 이 선택돼 있을 것
                 · 후보가 카톤 1건이거나, 카톤이 없으면 로트 1건일 것
                 · 이미 출고된 박스가 아닐 것                                   */
            quickShipByScan(key) {
                let _this = this;
                if (!key) return;

                let headerItems = this.shipmentHeaderGrid.selectedItems;
                let shipmentItems = this.shipmentListGrid.selectedItems;
                if (!headerItems || headerItems.length === 0) {
                    Alert.alert('스캔 오류', '출고 지시 항목을 먼저 선택해 주세요.');
                    return;
                }
                /* 품목이 한 줄뿐이면 굳이 고르게 하지 않는다 —
                   태블릿에서 작은 행을 짚는 동작이 스캔 흐름을 끊는다. */
                if ((!shipmentItems || shipmentItems.length === 0)
                    && this.shipmentListGrid.rows && this.shipmentListGrid.rows.length === 1) {
                    this.shipmentListGrid.select(0, 0);
                    shipmentItems = this.shipmentListGrid.selectedItems;
                }
                if (!shipmentItems || shipmentItems.length === 0) {
                    Alert.alert('스캔 오류', '출하상세(품목)를 먼저 선택해 주세요.');
                    return;
                }

                let sh_id = headerItems[0].id;
                let shipment_id = shipmentItems[0].shipment_id;
                let material_id = shipmentItems[0].Material_id;

                let res = AjaxUtil.getSyncData(this.url + '/mat_lot_search', {
                    material_id: material_id, sh_id: sh_id, lot_number: key
                });
                let rows = (res && res.data) || [];
                if (rows.length === 0) {
                    this.scanToast('찾을 수 없는 라벨입니다 — ' + key, true);
                    return;
                }

                /* ★ «가득 찬 박스» 만 자동으로 담는다. 잔여 박스는 인박스 낱개로
                   펼쳐져 여러 줄이 되므로 몇 개를 낼지 사람이 골라야 한다. */
                let cartons = rows.filter(function (r) { return r.unit_kind === 'carton'; });
                let pick = (cartons.length === 1) ? cartons[0]
                    : (cartons.length === 0 && rows.length === 1) ? rows[0] : null;

                if (!pick) {
                    // 후보가 여럿 — 사람이 골라야 한다. 예전 흐름(팝업)으로 넘긴다.
                    this.$LotNumber.val(key);
                    this.scanToast('후보가 ' + rows.length + '건입니다 — 목록에서 선택하세요');
                    this.showLotSelectPopup();
                    return;
                }
                if (String(pick.carton_state) === 'shipped') {
                    this.scanToast('이미 출고된 박스입니다 — ' + (pick.carton_lot_no || key), true);
                    return;
                }
                if (Number(pick.CurrentStock) <= 0) {
                    this.scanToast('재고가 없는 로트입니다 — ' + (pick.LotNumber || key), true);
                    return;
                }

                // 카톤이면 박스 수량 그대로, 아니면 남은 지시수량만큼
                // 서버가 줄마다 «나갈 수량(ship_qty)» 을 정해 내려준다
                let qty = Number(pick.ship_qty != null ? pick.ship_qty : pick.carton_qty);
                if (!(qty > 0)) qty = 1;

                /* ★ 값을 «문자열» 로 보낸다.
                     컨트롤러(saveMatLotCons)가 Q 의 항목을 (String) 으로 캐스팅한다 —
                     팝업 경로는 input.val() 이라 원래 문자열이었고, 여기서만 숫자를
                     보내 ClassCastException(Integer→String) 으로 터졌다.
                   ★ shipment_id 는 mat_lot_search 가 내려주지 않는다.
                     선택한 출하상세 행의 값(위에서 잡은 shipment_id)을 쓴다. */
                /* ★ 타입을 «팝업 경로와 똑같이» 맞춘다.
                     컨트롤러 saveMatLotCons 가 필드마다 다르게 캐스팅한다 —
                       ml_id   → (Integer)   숫자로 보내야 한다
                       quantity→ (String)    문자열로 보내야 한다
                     팝업은 그리드값(숫자) + input.val()(문자열) 조합이라 우연히 맞았고,
                     여기서만 어긋나 ClassCastException 이 났다.
                   ★ shipment_id 는 mat_lot_search 가 안 내려준다 —
                     선택한 출하상세 행의 값을 쓴다. */
                let items = [{
                    ml_id: Number(pick.ml_id),
                    material_id: Number(pick.Material_id),
                    quantity: String(qty),
                    shipment_id: Number(pick.shipment_id != null ? pick.shipment_id : shipment_id)
                }];

                AjaxUtil.postAsyncData(this.url + '/save_mat_lot_cons', {
                    sh_id: sh_id, shipment_id: shipment_id, Q: JSON.stringify(items)
                }, function (result) {
                    if (!result || result.success === false) {
                        _this.scanToast('등록 실패 — ' + ((result && result.message) || ''), true);
                        return;
                    }
                    /* 카톤은 박스 단위로 출고 표시한다. 서버가 조건부 UPDATE 라
                       두 단말이 같은 박스를 동시에 찍어도 한 쪽만 통과한다. */
                    /* 낱개(인박스) 줄에서는 부르지 않는다 — 박스가 통째로 나간 게
                       아닌데 shipped 로 닫으면 나머지 낱개를 영영 못 낸다. */
                    if (pick.unit_kind === 'carton') {
                        AjaxUtil.postAsyncData(_this.url + '/carton_ship', {
                            carton_id: pick.carton_id, shipment_id: shipment_id
                        }, function (r2) {
                            if (r2 && r2.success === false)
                                Alert.alert('카톤 출고 표시 실패', r2.message || '');
                        });
                    }
                    _this.scanToast('담았습니다 — ' + (pick.carton_lot_no || pick.LotNumber) + ' · ' + qty);
                    _this.$LotNumber.val('');
                    _this.showShipmentList();
                    _this.showMatLotConsumeList();
                    _this.focusLotInput();
                });
            }

            /* 스캔 결과는 카메라 화면 안 문구로 알린다 —
               연달아 찍는 중에 확인 버튼을 누르게 하면 흐름이 끊긴다. */
            scanToast(msg, warn) {
                if (typeof lotCamMsg === 'function') lotCamMsg(msg, warn);
                if (typeof Notify !== 'undefined' && Notify) {
                    try { warn ? Notify.error(msg) : Notify.success(msg); } catch (e) {}
                }
            }

                 그때는 조용히 넘어간다(이미 끝난 건에 커서를 강제할 이유가 없다). */
            focusLotInput() {
                let $el = this.$LotNumber;
                if (!$el || !$el.length || $el.is(':disabled')) return;
                setTimeout(function () { $el.val('').trigger('focus').select(); }, 0);
            }

                    isReadOnly: true,
                    columns: [
                        {binding: 'LotNumber', header: 'LOT', width: 180, align: 'center'},
                        {binding: 'carton_country', header: '국가', width: 60, align: 'center'},
                        {binding: 'unit_name', header: '단위', width: 80, align: 'center'},
                        {binding: 'InputQty', header: '초기수량', width: 80, align: 'right'},
                        {binding: 'CurrentStock', header: '현재고량', width: 80, align: 'right'},
                        {binding: 'mat_grp_name', header: '품목그룹', width: 80, align: 'left'},
                        {binding: 'mat_code', header: '품목코드', width: 80, align: 'center'},
                        {binding: 'mat_name', header: '품목', width: 120, align: 'left'},
                        {binding: 'unit_label', header: '포장단위', width: 190, isReadOnly: true},
                        {binding: 'carton_lot_no', header: '카톤(박스)', width: 80, align: 'center'},
                        /* 이 국가로 아직 안 나간 박스 수. 몇 번 더 찍어야 하는지 바로 보인다 */
                        {binding: 'carton_remain', header: '남은박스', width: 80, align: 'right'},
                    ],
                    itemsSource: _this.viewData4,
                    formatItem: function (s, e) {
                        if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
                            e.cell.style.textAlign = 'center'; // 헤더 텍스트 가운데 정렬
                        }
                    },

                });
                let isInitialLoad = true;
                lotSearchGrid.selectionChanged.addHandler((s, e) => {
                    if (isInitialLoad) {
                        isInitialLoad = false; // 초기 로드 이후 플래그 해제
                        //this.lotSearchGrid.select(-1, -1); // 선택 상태 해제
                        return;
                    }

                    let selectedRowIndex = s.selection.row; // 선택된 행의 인덱스
                    if (selectedRowIndex >= 0) { // 유효한 행이 선택되었는지 확인
                        let selectedRowData = s.rows[selectedRowIndex].dataItem; // 선택된 행의 데이터

                        /* 카톤 후보 줄이면 그 박스 수량으로, 아니면 예전처럼 현재고로.
                           대표번호를 찍으면 국가별 후보가 여러 줄 뜨는데,
                           고르는 순간 그 박스 수량이 채워져야 손으로 칠 일이 없다. */
                        selectedRowData.lot_use_quantity = (selectedRowData.carton_id)
                            ? selectedRowData.carton_qty
                            : selectedRowData.CurrentStock;
                        FormUtil.BindDataForm(selectedRowData, $lotForm);
                        selectedItem = selectedRowData;

                        console.log(`선택된 행 인덱스: ${selectedRowIndex}`);
                        console.log('선택된 행 데이터:', selectedRowData);

                    }
                });
                // 데이터 로드 후 초기 선택 상태 해제
                lotSearchGrid.loadedRows.addHandler(() => {
                    setTimeout(() => {
                        lotSearchGrid.select(-1, -1); // 선택 상태 초기화
                    }, 0); // 비동기로 처리하여 초기 선택 해제
                });

                new FlexGridContextMenu(lotSearchGrid);
                lotSearchGrid.downloadFileName = '출고';

                let fnLotSearch = function () {
                    $lotForm[0].reset();
                    // 헤더번호만 있거나 헤데와 material이 다 있거나 둘 중 하나
                    // 헤더만 있는경우 출고 항목의 모든 폼목에 해당되는 lot을 리스트업
                    // 헤더와 material 이 있는경우 해당 품목에 해당되는 lot 리스트업
                    // ★ 아웃박스(카톤) 바코드를 그대로 찍는다. GS1 전체를 찍어도 (10) 만 쓴다.
                    //   서버가 pack_carton 을 거쳐 국가별 완제품 로트로 환산해 준다.
                    let data = {
                        material_id: material_id,
                        sh_id: sh_id,
                        lot_number: pickLot($('#LotNumber').val())
                    };

                    let result = AjaxUtil.getSyncData(_this.url + '/mat_lot_search', data);
                    if (result) {
                        _this.viewData4.sourceCollection = result.data;

                        /* 카톤으로 한 건만 걸리면 그 박스로 확정한다.
                           박스는 수량이 정해져 있으므로 사람이 수량을 칠 이유가 없다 —
                           손으로 치면 스캔의 의미가 절반 사라진다. */
                        /* ★ 카톤 후보가 딱 한 줄일 때만 자동 확정한다.
                           대표번호(C-20260810-0010)는 한 차수의 모든 박스가 같은 번호를 달아서
                           국가별로 여러 줄이 걸린다 — 그때는 사람이 골라야 하므로 자동으로 정하면 안 된다. */
                        let rows = result.data || [];
                        /* ★ 자동확정은 «가득 찬 박스» 한 줄일 때만 한다.
                           잔여 박스는 인박스 낱개로 펼쳐져 여러 줄이 되므로
                           몇 개를 낼지 사람이 골라야 한다. */
                        let cartonRows = rows.filter(function (r) {
                            return r.unit_kind === 'carton';
                        });
                        let hit = (cartonRows.length === 1) ? cartonRows[0] : null;
                        if (cartonRows.length > 1) {
                            Alert.alert('나갈 박스를 고르세요',
                                '이 카톤 라벨은 국가별 후보가 ' + cartonRows.length + '건입니다.\n'
                                + '목록에서 나갈 국가의 줄을 선택해 주세요.');
                        }
                        if (hit) {
                            if (String(hit.carton_state) === 'shipped') {
                                Alert.alert('이미 출고된 박스',
                                    hit.carton_lot_no + ' 는 이미 출고 처리되었습니다.');
                                selectedItem = null;
                                return;
                            }
                            hit.lot_use_quantity = hit.carton_qty;
                            FormUtil.BindDataForm(hit, $lotForm);
                            selectedItem = hit;
                            lotSearchGrid.select(0, 0);
                        }
                    }
                };
                fnLotSearch();

                let $btnLotSave = $content.find('#btnLotSave');
                let $btnLotRefresh = $content.find('#btnLotRefresh');
                let $popLotUseQuantity = $content.find('#popLotUseQuantity');

                // 로트 선택, 수량 입력 후 저장버튼 클릭
                $btnLotSave.click(function (e) {
                    if (selectedItem.CurrentStock <= 0) {
                        Alert.alert('LOT 추가 오류', '현재고를 확인하십시요');
                        return;
                    }

                    let lot_use_quantity = $popLotUseQuantity.val();
                    if (lot_use_quantity == "" || lot_use_quantity == 0) {
                        Alert.alert('LOT 추가 오류', '출고 수량을 입력하십시요');
                        return;
                    }

                    let fnOkCallback = function () {
                        let items = [];
                        let item = {
                            ml_id: selectedItem.ml_id,
                            material_id: selectedItem.Material_id,
                            quantity: lot_use_quantity,
                            shipment_id: selectedItem.shipment_id
                        };
                        items.push(item);

                        let strItems = JSON.stringify(items);
                        let data = {
                            sh_id: sh_id,
                            shipment_id: shipment_id,
                            Q: strItems
                        };

                        let url = _this.url + '/save_mat_lot_cons';

                        //현재 선택된 행
                        const selectedRow = _this.shipmentListGrid.selection.row >= 0
                            ? _this.shipmentListGrid.rows[_this.shipmentListGrid.selection.row].dataItem :
                            null;
                        const selectedId = selectedRow ? selectedRow.shipment_id : null;

                        let fnsuccess = function (result) {
                            if (result.success) {
                                /* ★ 등록되면 입력칸을 비우고 커서를 되돌린다.
                                   박스 4개를 연달아 찍는 흐름이라, 값이 남아 있으면
                                   다음 스캔이 앞 번호 뒤에 이어붙어 엉뚱한 키가 된다. */
                                _this.$LotNumber.val('');
                                /* 카톤을 «찍어서» 담은 경우엔 팝업을 닫는다 —
                                   박스 하나가 한 건이므로 더 고를 것이 없고,
                                   열어 두면 다음 박스를 찍을 입력칸이 가려진다.
                                   목록에서 손으로 고른 경우는 그대로 둔다(여러 로트를 나눠 담는 흐름). */
                                let wasCarton = !!(selectedItem && selectedItem.unit_kind === 'carton');
                                if (wasCarton) {
                                    try {
                                        modalContainer.close();
                                    } catch (e2) {
                                    }
                                    _this.focusLotInput();
                                }
                                /* ★ 카톤으로 담았으면 그 박스를 출고 표시한다.
                                   서버가 조건부 UPDATE 라 이미 나간 박스면 실패로 돌아온다 —
                                   두 단말이 같은 박스를 동시에 찍어도 한 쪽만 통과한다. */
                                /* ★ 낱개(인박스) 줄에서는 부르지 않는다 —
                                   박스가 통째로 나간 게 아닌데 shipped 로 닫으면
                                   같은 박스의 나머지 낱개를 영영 못 낸다. */
                                if (selectedItem && selectedItem.unit_kind === 'carton') {
                                    AjaxUtil.postAsyncData(_this.url + '/carton_ship', {
                                        carton_id: selectedItem.carton_id,
                                        shipment_id: shipment_id
                                    }, function (r2) {
                                        if (r2 && r2.success === false) {
                                            Alert.alert('카톤 출고 표시 실패', r2.message || '');
                                        }
                                    });
                                }
                                if (!wasCarton) fnLotSearch();   // 닫은 팝업을 다시 조회하지 않는다

                                _this.showShipmentList(() => {
                                    const lastId = _this.lastSelectedShipmentId;
                                    if (!lastId) return;

                                    const view = _this.shipmentListGrid.collectionView;
                                    if (!view || !view.items || view.items.length === 0) return;

                                    const index = view.items.findIndex(item => String(item.shipment_id) === String(lastId));
                                    if (index < 0) return;

                                    console.log(`이전 선택 행 복원 시도: ${index}`);

                                    // ✅ 렌더 완료 후 DOM 탐색 (살짝 딜레이)
                                    setTimeout(() => {
                                        const grid = _this.shipmentListGrid;
                                        const view = grid.collectionView;

                                        if (!view || !view.items || view.items.length === 0) return;

                                        const index = view.items.findIndex(
                                            item => String(item.shipment_id) === String(_this.lastSelectedShipmentId)
                                        );
                                        if (index < 0) return;

                                        console.log(`이전 선택 행 복원: ${index}`);

                                        // 🔹 이벤트 일시 중단 (selectionChanged나 클릭 핸들러가 반응하지 않게)
                                        const clickHandlers = grid.hostElement.onclick;
                                        grid.hostElement.onclick = null;

                                        const selHandlers = grid.selectionChanged._handlers ? [...grid.selectionChanged._handlers] : [];
                                        grid.selectionChanged._handlers = [];

                                        // 🔹 UI 업데이트 최소화
                                        grid.deferUpdate(() => {
                                            grid.select(index, 0);
                                            grid.scrollIntoView(index, 0);
                                        });

                                        // 🔹 로직 직접 실행 (클릭 없이)
                                        const selectedRowData = view.items[index];
                                        _this.lastSelectedShipmentId = selectedRowData.shipment_id;
                                        _this.showMatLotConsumeList();

                                        // 🔹 이벤트 복구
                                        grid.selectionChanged._handlers = selHandlers;
                                        grid.hostElement.onclick = clickHandlers;

                                        console.log('이전 선택 행 완전 복원 완료:', selectedRowData);
                                    }, 0);
                                });
                            } else {
                                Alert.alert('', result.message);
                            }
                        };

                        AjaxUtil.postAsyncData(url, data, fnsuccess);
                    };

                    Alert.confirm('LOT 지정', '저장 하시겠습니까?', fnOkCallback);
                });
                $btnLotRefresh.click(function (e) {
                    fnLotSearch();
                })
                return;

            }

            deleteMatLotConsume(selectedLotItems) {
                let _this = this;
                let headerItems = this.shipmentHeaderGrid.selectedItems;
                let shipmentItems = this.shipmentListGrid.selectedItems;

                if (headerItems.length === 0 || headerItems === undefined || headerItems === null) {
                    Alert.alert('', '출하정보를 선택해주세요.');
                    return;
                }
                if (shipmentItems.length === 0 || shipmentItems === undefined || shipmentItems === null) {
                    Alert.alert('', '출하상세정보를 선택해주세요.');
                    return;
                }

                let sh_id = headerItems[0].id;
                let shipment_id = shipmentItems[0].shipment_id;

                let items = [];
                $.each(selectedLotItems, function (idx, item) {
                    items.push(item.mlc_id);
                });
                let strData = JSON.stringify(items);
                let data = {
                    sh_id: sh_id,
                    shipment_id: shipment_id,
                    Q: strData
                };
                const selectedRow = _this.shipmentListGrid.selection.row >= 0
                    ? _this.shipmentListGrid.rows[_this.shipmentListGrid.selection.row].dataItem :
                    null;
                const selectedId = selectedRow ? selectedRow.shipment_id : null;

                let fnSuccess = function (res) {
                    if (res.success) {
                        AjaxUtil.hideLoading();

                        Notify.success("LOT지정 취소 완료.");
                        _this.showShipmentList(() => {
                            const lastId = _this.lastSelectedShipmentId;
                            if (!lastId) return;

                            const view = _this.shipmentListGrid.collectionView;
                            if (!view || !view.items || view.items.length === 0) return;

                            const index = view.items.findIndex(item => String(item.shipment_id) === String(lastId));
                            if (index < 0) return;

                            console.log(`이전 선택 행 복원 시도: ${index}`);

                            // ✅ 렌더 완료 후 DOM 탐색 (살짝 딜레이)
                            setTimeout(() => {
                                const grid = _this.shipmentListGrid;
                                const view = grid.collectionView;

                                if (!view || !view.items || view.items.length === 0) return;

                                const index = view.items.findIndex(
                                    item => String(item.shipment_id) === String(_this.lastSelectedShipmentId)
                                );
                                if (index < 0) return;

                                console.log(`이전 선택 행 복원: ${index}`);

                                // 🔹 이벤트 일시 중단 (selectionChanged나 클릭 핸들러가 반응하지 않게)
                                const clickHandlers = grid.hostElement.onclick;
                                grid.hostElement.onclick = null;

                                const selHandlers = grid.selectionChanged._handlers ? [...grid.selectionChanged._handlers] : [];
                                grid.selectionChanged._handlers = [];

                                // 🔹 UI 업데이트 최소화
                                grid.deferUpdate(() => {
                                    grid.select(index, 0);
                                    grid.scrollIntoView(index, 0);
                                });

                                // 🔹 로직 직접 실행 (클릭 없이)
                                const selectedRowData = view.items[index];
                                _this.lastSelectedShipmentId = selectedRowData.shipment_id;
                                _this.showMatLotConsumeList();

                                // 🔹 이벤트 복구
                                grid.selectionChanged._handlers = selHandlers;
                                grid.hostElement.onclick = clickHandlers;

                                console.log('이전 선택 행 완전 복원 완료:', selectedRowData);
                            }, 200);


                        });

                        if (shipment_id != null) {
                            _this.shipmentListGrid.select(shipmentItems[0].__index);
                        }
                        _this.showMatLotConsumeList();

                    } else {
                        Alert.alert('', res.message);//Notify.success("LOT지정 취소 실패.");
                    }
                }
                let url = this.url + '/delete_mal_lot_consume';
                AjaxUtil.postAsyncData(url, data, fnSuccess);

                return;
            }

            //출고처리
            shipmentStateComplete(head_item) {
                let _this = this;
                let data = {sh_id: head_item.id, description: head_item.description};
                let url = this.url + '/shipment_status_complete';
                let fnSuccess = function (result) {
                    if (result.success) {
                        _this.searchDataBind();
                        Notify.success("출고 처리 완료.");
                    } else {
                        if (result.message != '') {
                            Alert.alert('', result.message);
                        } else {
                            Notify.success("출고 처리 실패.");
                        }
                    }
                }
                AjaxUtil.postAsyncData(url, data, fnSuccess);
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            const keywordInput = document.getElementById("keyword");

            keywordInput.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    event.preventDefault(); // 기본 동작 방지
                    page.searchMain();
                }
            });
        });


        let page = null;

        $(document).ready(function (e) {
            page = new ShipmentProcessPage();
            /* 카메라 인식 콜백은 클래스 밖(전역 함수)에서 돈다 —
               페이지 인스턴스를 잡을 통로가 필요하다. */
            window.__shipPage = page;

            $('#srchStartDt').val(CommonUtil.getYYYYMMDD(-7));
            $('#srchEndDt').val(CommonUtil.getYYYYMMDD());

            $('#btnListCollapse').click(function (e) {
                $('#divList').toggle(300);
            });

            // 검색
            $('#btnSearch').click(function (e) {
                page.searchDataBind();
            });

            $('#searchForm').on('keydown', function (e) {
                if (e.key === 'Enter') {
                    page.searchDataBind();
                }
            })

            page.searchDataBind();
        })
    </script>

</th:block>
</html>
