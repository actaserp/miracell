<th:block layout:fragment="scripts">
    <th:block th:replace="/common/columns_setting :: columns_setting"></th:block>
    <script type="text/javascript">

        let gUrl = '/api/shipment/shipment_do_a';
        let $content;
        let modalContainer;
        let SelectItem = [];
        let enterFlag = false;


        /* GS1-128 → (10) 로트 추출. 포장 화면(prod_process_opack_*)과 같은 함수다.
           현장에서 같은 바코드를 포장에서도 출고에서도 찍기 때문에
           파싱이 어긋나면 한쪽에서만 조회된다.
           ★ GS1 형태일 때만 파싱한다 — 무조건 파싱하면 숫자로 시작하는
             사내 로트번호(20…, 01…)가 AI 로 오인돼 잘린다. */
        /* 스캐너·카메라마다 같은 라벨을 다르게 준다 — 심볼로지 식별자(]C1 …),
           FNC1 대체문자(| ~ ^ <GS>), 공백·개행을 한 형태로 다림질한다. */
        function normRaw(raw) {
            var s = String(raw == null ? '' : raw);
            s = s.replace(/^\](?:C1|d2|Q3|e0|E0|C0)/i, '');
            s = s.replace(/<GS>|\u241D|\u001d/gi, '\u001d');
            s = s.replace(/[|~^]/g, '\u001d');
            return s.replace(/\s+/g, '').trim();
        }

        /* 가변길이 AI 의 끝. GS 가 없으면 뒤따르는 AI 를 추정해 끊는다 —
           GS 를 떨어뜨리는 스캐너에서 (10)로트가 뒤의 (30)(11)까지 삼켰다. */
        function varEnd(s, i) {
            var GS = '\u001d';
            var g = s.indexOf(GS, i);
            if (g >= 0) return g;
            for (var j = i + 1; j <= s.length - 3; j++) if (aiTailOk(s.substring(j))) return j;
            return s.length;
        }
        /* 남은 문자열이 AI 열로 온전히 읽히는가 — 가변 AI 는 되짚기로 푼다.
           (00)(01)(02)(20) 은 인정하지 않는다(맨 앞에만 오는 것들이라
           허용하면 로트 한복판 숫자를 GTIN 으로 오독해 로트가 짧게 잘린다). */
        function aiTailOk(t) {
            var DATE = {'11':1,'12':1,'13':1,'15':1,'16':1,'17':1};
            var GS = '\u001d';
            function ok(k, seen) {
                while (k < t.length && t[k] === GS) k++;
                if (k >= t.length) return seen > 0;
                var ai = t.substr(k, 2);
                if (DATE[ai]) {
                    var v = t.substr(k + 2, 6);
                    if (!/^\d{6}$/.test(v)) return false;
                    var mm = +v.substr(2, 2), dd = +v.substr(4, 2);
                    if (mm < 1 || mm > 12 || dd > 31) return false;
                    return ok(k + 8, seen + 1);
                }
                if (ai === '30' || ai === '37') {
                    var g2 = t.indexOf(GS, k + 2);
                    if (g2 >= 0) {
                        if (!/^\d{1,8}$/.test(t.substring(k + 2, g2))) return false;
                        return ok(g2, seen + 1);
                    }
                    for (var n = 1; n <= 8 && k + 2 + n <= t.length; n++) {
                        if (!/^\d+$/.test(t.substr(k + 2, n))) break;
                        if (ok(k + 2 + n, seen + 1)) return true;
                    }
                    return false;
                }
                if (ai === '10' || ai === '21') {
                    var g3 = t.indexOf(GS, k + 2);
                    if (g3 >= 0) return g3 > k + 2 && ok(g3, seen + 1);
                    for (var n2 = 1; k + 2 + n2 <= t.length; n2++) if (ok(k + 2 + n2, seen + 1)) return true;
                    return false;
                }
                return false;
            }
            return ok(0, 0);
        }

        /* GS1-128 → (10) 로트 추출. 포장 화면(prod_process_opack_*)과 같은 규칙이다.
           ★ GS1 형태일 때만 파싱한다 — 무조건 파싱하면 숫자로 시작하는
             사내 로트번호(20…, 01…)나 카톤번호(C-…-KR-01)가 AI 로 오인돼 잘린다. */
        function pickLot(raw) {
            raw = normRaw(raw);
            if (!raw) return '';
            var m;
            if (raw.indexOf('(') >= 0) {
                if ((m = raw.match(/\(10\)([^()\u001d]+)/))) return m[1].trim();
                return raw;
            }
            var GS = '\u001d';
            var isGs1 = raw.indexOf(GS) >= 0 || /^01\d{14}/.test(raw);
            if (!isGs1) return raw;
            var FIXED = {'00':18,'01':14,'02':14,'11':6,'12':6,'13':6,'15':6,'16':6,'17':6,'20':2};
            var i = 0;
            while (i < raw.length) {
                if (raw[i] === GS) { i++; continue; }
                var ai = raw.substr(i, 2); i += 2;
                var flen = FIXED[ai];
                if (flen != null) { i += flen; }
                else {
                    var end = varEnd(raw, i);
                    var v = raw.substring(i, end); i = end;
                    if (ai === '10') return v.trim();
                }
            }
            return raw;
        }

        /* ── 카메라 스캔 ────────────────────────────────────────────────
           스캐너(키보드 웨지)를 대체하지 않는다. 둘 다 «입력칸에 값을 넣는» 것으로
           끝나고, 그 뒤 흐름(Enter → 팝업 → 자동확정)은 완전히 같다.
           덕분에 어느 쪽으로 찍든 결과가 갈리지 않는다.

           ★ BarcodeDetector 는 Android Chrome·ChromeOS 에서만 동작한다.
             데스크톱 Chrome·iOS 에는 없다 — 그 환경에서는 버튼을 눌러도
             사유를 문구로 남기고 스캐너·직접입력으로 넘어간다.
           ★ 형식은 code_128 하나만 연다. itf 를 열면 Code128 의 굵기 패턴 일부를
             자기 코드로 착각해 「151557842676」 같은 값을 만들어 낸다. */
        var lotCamStream = null, lotCamDet = null, lotCamTimer = null, lotCamBusy = false;
        var lotCamLast = '', lotCamLastAt = 0;

        function lotCamReason() {
            if (!window.isSecureContext) return 'HTTPS 접속이 아니라 카메라를 쓸 수 없습니다. 스캐너나 직접 입력을 사용하세요.';
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return '이 브라우저는 카메라를 지원하지 않습니다.';
            if (typeof window.BarcodeDetector === 'undefined') return '이 브라우저는 바코드 인식을 지원하지 않습니다. 스캐너나 직접 입력을 사용하세요.';
            return null;
        }
        function lotCamMsg(msg, warn) {
            var m = document.getElementById('lotScanMsg');
            if (!m) return;
            m.className = 'msg' + (warn ? ' warn' : '');
            m.textContent = msg || '';
        }
        function lotCamStop() {
            clearTimeout(lotCamTimer); lotCamTimer = null;
            if (lotCamStream) { lotCamStream.getTracks().forEach(function (t) { t.stop(); }); lotCamStream = null; }
            var v = document.getElementById('lotScanVideo');
            if (v) v.srcObject = null;
            var w = document.getElementById('lotScanWrap');
            if (w) w.classList.remove('on');
            lotCamLast = '';
        }
        // 탭을 벗어나면 렌즈를 놓는다. 안 놓으면 켜진 채 남는다.
        document.addEventListener('visibilitychange', function () { if (document.hidden) lotCamStop(); });

        async function lotCamStart() {
            var why = lotCamReason();
            var w = document.getElementById('lotScanWrap');
            if (why) { if (w) w.classList.add('on'); lotCamMsg(why, true); return; }
            if (w) w.classList.add('on');
            lotCamMsg('카메라 준비 중…');
            try {
                if (!lotCamDet) {
                    try { lotCamDet = new window.BarcodeDetector({formats: ['code_128']}); }
                    catch (e0) { lotCamDet = new window.BarcodeDetector(); }
                }
                /* 해상도는 단계적으로 요청한다. min 같은 하드 제약을 걸면
                   못 맞추는 기기에서 OverconstrainedError 로 아예 안 열린다. */
                var TRY = [
                    {facingMode:'environment', width:{ideal:1920}, height:{ideal:1080}},
                    {facingMode:'environment', width:{ideal:1280}},
                    true
                ];
                for (var ti = 0; ti < TRY.length; ti++) {
                    try { lotCamStream = await navigator.mediaDevices.getUserMedia({video: TRY[ti], audio: false}); break; }
                    catch (eT) { if (ti === TRY.length - 1) throw eT; }
                }
                try {
                    var tr = lotCamStream.getVideoTracks()[0];
                    var cap = tr.getCapabilities ? tr.getCapabilities() : {};
                    if (cap.focusMode && cap.focusMode.indexOf('continuous') >= 0)
                        await tr.applyConstraints({advanced: [{focusMode: 'continuous'}]});
                } catch (eF) {}
                var v = document.getElementById('lotScanVideo');
                v.srcObject = lotCamStream;
                await v.play();
                lotCamMsg('라벨을 비추세요');
                lotCamLoop();
            } catch (e) {
                lotCamStop();
                if (w) w.classList.add('on');
                lotCamMsg('카메라를 열 수 없습니다 — ' + (e && e.name === 'NotAllowedError'
                    ? '권한이 거부되었습니다. 브라우저 설정에서 카메라를 허용하세요.'
                    : (e && e.message || e)), true);
            }
        }

        /* setInterval 을 쓰지 않는다 — detect() 가 간격보다 오래 걸리면 호출이 겹쳐 쌓인다.
           한 번 끝난 뒤 다음을 예약하므로 절대 겹치지 않는다. */
        function lotCamLoop() {
            clearTimeout(lotCamTimer);
            lotCamTimer = setTimeout(async function () {
                var w = document.getElementById('lotScanWrap');
                if (!w || !w.classList.contains('on')) return;   // 닫혔으면 멈춘다
                if (!lotCamBusy) {
                    lotCamBusy = true;
                    try { await lotCamTick(); } catch (e) {}
                    lotCamBusy = false;
                }
                lotCamLoop();
            }, 220);
        }

        function lotCamFlash() {
            var fr = document.getElementById('lotScanFrame');
            if (!fr) return;
            fr.classList.add('hit');
            setTimeout(function () { fr.classList.remove('hit'); }, 350);
        }
        function lotCamBeep() {
            try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
            try {
                var C = window.AudioContext || window.webkitAudioContext;
                if (!C) return;
                var ac = new C(), o = ac.createOscillator(), g = ac.createGain();
                o.frequency.value = 1760; g.gain.value = 0.05;
                o.connect(g); g.connect(ac.destination); o.start();
                setTimeout(function () { o.stop(); ac.close(); }, 90);
            } catch (e) {}
        }

        async function lotCamTick() {
            var v = document.getElementById('lotScanVideo');
            if (!lotCamDet || !v || v.readyState < 2) return;
            var found;
            try { found = await lotCamDet.detect(v); } catch (e) { return; }
            if (!found || !found.length) return;
            /* 라벨 한 장에 바코드가 여럿이면 (10)이 풀리는 쪽을 고른다 —
               found[0] 은 기기·각도마다 달라져 「찍을 때마다 다르게 인식」된다. */
            var raw = '', best = -1;
            for (var fi = 0; fi < found.length; fi++) {
                var cand = String(found[fi].rawValue || '').trim();
                if (!cand) continue;
                var sc = (pickLot(cand) !== normRaw(cand)) ? 1 : 0;
                if (sc > best) { best = sc; raw = cand; }
            }
            if (!raw) return;
            var now = Date.now();
            if (raw === lotCamLast && now - lotCamLastAt < 2500) return;   // 같은 값 2.5초 무시
            lotCamLast = raw; lotCamLastAt = now;
            lotCamBeep(); lotCamFlash();
            lotCamMsg('읽었습니다 — ' + raw);
            /* ★ 스캐너와 «같은 자리»로 흘려보낸다. 입력칸에 값을 넣고
               Enter 를 흉내 내면 이후 로직이 하나뿐이라 두 경로가 갈릴 수 없다. */
            var $in = $('#LotNumber');
            if ($in.is(':disabled')) { lotCamMsg('출하 항목을 먼저 선택하세요.', true); return; }
            $in.val(pickLot(raw));
            $in.trigger($.Event('keypress', {keyCode: 13, which: 13}));
        }

            showLotSelectPopup() {
                let _this = this;

                let headerItems = this.shipmentHeaderGrid.selectedItems;
                let shipmentItems = this.shipmentListGrid.selectedItems;
                console.log('shipmentItems', shipmentItems);

                if (headerItems.length === 0 || headerItems === undefined || headerItems === null) {
                    Alert.alert('로트 지정 오류', '출고 지시 항목을 선택해 주세요.');
                    return;
                }

                if (shipmentItems.length === 0 || shipmentItems === undefined || shipmentItems === null) {
                    Alert.alert('알림 ', '출하상세정보를 선택하세요.');
                    return;
                }

                let sh_id = headerItems[0].id;
                let shipment_id = shipmentItems[0].shipment_id;

                let material_id = null;

                if (shipmentItems.length > 0) {
                    material_id = shipmentItems[0].Material_id;
                }

                let content = tmpl('lotSelectTemplate', {});
                let $content = $(content);

                let modalContainer = new PopupDraggable('LOT지정');
                modalContainer.open({width: 800, height: 600, $content});
                let $lotForm = $content.find('#lotForm');

                let lotSearchGrid = null;
                let selectedItem = null;

                lotSearchGrid = new wijmo.grid.FlexGrid('#theGrid4', {
                    selectionMode: wijmo.grid.SelectionMode.Row,
                    headersVisibility: wijmo.grid.HeadersVisibility.Column,
                    autoGenerateColumns: false,
                    showMarquee: true,
                    isReadOnly: true,
                    columns: [
                        {binding: 'LotNumber', header: 'LOT', width: 180, align: 'center'},
                        {binding: 'carton_country', header: '국가', width: 60, align: 'center'},
                        {binding: 'unit_name', header: '단위', width: 80, align: 'center'},
                        {binding: 'InputQty', header: '초기수량', width: 80, align: 'right'},
                        {binding: 'CurrentStock', header: '현재고량', width: 80, align: 'right'},
                        {binding: 'mat_grp_name', header: '품목그룹', width: 80, align: 'left'},
                        {binding: 'mat_code', header: '품목코드', width: 80, align: 'center'},
                        {binding: 'mat_name', header: '품목', width: 120, align: 'left'},
                        {binding: 'carton_lot_no', header: '카톤(박스)', width: 80, align: 'center'},
                        /* 이 국가로 아직 안 나간 박스 수. 몇 번 더 찍어야 하는지 바로 보인다 */
                        {binding: 'carton_remain', header: '남은박스', width: 80, align: 'right'},
                    ],
                    itemsSource: _this.viewData4,
                    formatItem: function (s, e) {
                        if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
                            e.cell.style.textAlign = 'center'; // 헤더 텍스트 가운데 정렬
                        }
                    },

                });
                let isInitialLoad = true;
                lotSearchGrid.selectionChanged.addHandler((s, e) => {
                    if (isInitialLoad) {
                        isInitialLoad = false; // 초기 로드 이후 플래그 해제
                        //this.lotSearchGrid.select(-1, -1); // 선택 상태 해제
                        return;
                    }

                    let selectedRowIndex = s.selection.row; // 선택된 행의 인덱스
                    if (selectedRowIndex >= 0) { // 유효한 행이 선택되었는지 확인
                        let selectedRowData = s.rows[selectedRowIndex].dataItem; // 선택된 행의 데이터

                        /* 카톤 후보 줄이면 그 박스 수량으로, 아니면 예전처럼 현재고로.
                           대표번호를 찍으면 국가별 후보가 여러 줄 뜨는데,
                           고르는 순간 그 박스 수량이 채워져야 손으로 칠 일이 없다. */
                        selectedRowData.lot_use_quantity = (selectedRowData.carton_id)
                            ? selectedRowData.carton_qty
                            : selectedRowData.CurrentStock;
                        FormUtil.BindDataForm(selectedRowData, $lotForm);
                        selectedItem = selectedRowData;

                        console.log(`선택된 행 인덱스: ${selectedRowIndex}`);
                        console.log('선택된 행 데이터:', selectedRowData);

                    }
                });
                // 데이터 로드 후 초기 선택 상태 해제
                lotSearchGrid.loadedRows.addHandler(() => {
                    setTimeout(() => {
                        lotSearchGrid.select(-1, -1); // 선택 상태 초기화
                    }, 0); // 비동기로 처리하여 초기 선택 해제
                });

                new FlexGridContextMenu(lotSearchGrid);
                lotSearchGrid.downloadFileName = '출고';

                let fnLotSearch = function () {
                    $lotForm[0].reset();
                    // 헤더번호만 있거나 헤데와 material이 다 있거나 둘 중 하나
                    // 헤더만 있는경우 출고 항목의 모든 폼목에 해당되는 lot을 리스트업
                    // 헤더와 material 이 있는경우 해당 품목에 해당되는 lot 리스트업
                    // ★ 아웃박스(카톤) 바코드를 그대로 찍는다. GS1 전체를 찍어도 (10) 만 쓴다.
                    //   서버가 pack_carton 을 거쳐 국가별 완제품 로트로 환산해 준다.
                    let data = {
                        material_id: material_id,
                        sh_id: sh_id,
                        lot_number: pickLot($('#LotNumber').val())
                    };

                    let result = AjaxUtil.getSyncData(_this.url + '/mat_lot_search', data);
                    if (result) {
                        _this.viewData4.sourceCollection = result.data;

                        /* 카톤으로 한 건만 걸리면 그 박스로 확정한다.
                           박스는 수량이 정해져 있으므로 사람이 수량을 칠 이유가 없다 —
                           손으로 치면 스캔의 의미가 절반 사라진다. */
                        /* ★ 카톤 후보가 딱 한 줄일 때만 자동 확정한다.
                           대표번호(C-20260810-0010)는 한 차수의 모든 박스가 같은 번호를 달아서
                           국가별로 여러 줄이 걸린다 — 그때는 사람이 골라야 하므로 자동으로 정하면 안 된다. */
                        let rows = result.data || [];
                        let cartonRows = rows.filter(function (r) {
                            return r.carton_id;
                        });
                        let hit = (cartonRows.length === 1) ? cartonRows[0] : null;
                        if (cartonRows.length > 1) {
                            Alert.alert('나갈 박스를 고르세요',
                                '이 카톤 라벨은 국가별 후보가 ' + cartonRows.length + '건입니다.\n'
                                + '목록에서 나갈 국가의 줄을 선택해 주세요.');
                        }
                        if (hit) {
                            if (String(hit.carton_state) === 'shipped') {
                                Alert.alert('이미 출고된 박스',
                                    hit.carton_lot_no + ' 는 이미 출고 처리되었습니다.');
                                selectedItem = null;
                                return;
                            }
                            hit.lot_use_quantity = hit.carton_qty;
                            FormUtil.BindDataForm(hit, $lotForm);
                            selectedItem = hit;
                            lotSearchGrid.select(0, 0);
                        }
                    }
                };
                fnLotSearch();

                let $btnLotSave = $content.find('#btnLotSave');
                let $btnLotRefresh = $content.find('#btnLotRefresh');
                let $popLotUseQuantity = $content.find('#popLotUseQuantity');

                // 로트 선택, 수량 입력 후 저장버튼 클릭
                $btnLotSave.click(function (e) {
                    if (selectedItem.CurrentStock <= 0) {
                        Alert.alert('LOT 추가 오류', '현재고를 확인하십시요');
                        return;
                    }

                    let lot_use_quantity = $popLotUseQuantity.val();
                    if (lot_use_quantity == "" || lot_use_quantity == 0) {
                        Alert.alert('LOT 추가 오류', '출고 수량을 입력하십시요');
                        return;
                    }

                    let fnOkCallback = function () {
                        let items = [];
                        let item = {
                            ml_id: selectedItem.ml_id,
                            material_id: selectedItem.Material_id,
                            quantity: lot_use_quantity,
                            shipment_id: selectedItem.shipment_id
                        };
                        items.push(item);

                        let strItems = JSON.stringify(items);
                        let data = {
                            sh_id: sh_id,
                            shipment_id: shipment_id,
                            Q: strItems
                        };

                        let url = _this.url + '/save_mat_lot_cons';

                        //현재 선택된 행
                        const selectedRow = _this.shipmentListGrid.selection.row >= 0
                            ? _this.shipmentListGrid.rows[_this.shipmentListGrid.selection.row].dataItem :
                            null;
                        const selectedId = selectedRow ? selectedRow.shipment_id : null;

                        let fnsuccess = function (result) {
                            if (result.success) {
                                /* ★ 등록되면 입력칸을 비우고 커서를 되돌린다.
                                   박스 4개를 연달아 찍는 흐름이라, 값이 남아 있으면
                                   다음 스캔이 앞 번호 뒤에 이어붙어 엉뚱한 키가 된다. */
                                _this.$LotNumber.val('');
                                /* 카톤을 «찍어서» 담은 경우엔 팝업을 닫는다 —
                                   박스 하나가 한 건이므로 더 고를 것이 없고,
                                   열어 두면 다음 박스를 찍을 입력칸이 가려진다.
                                   목록에서 손으로 고른 경우는 그대로 둔다(여러 로트를 나눠 담는 흐름). */
                                let wasCarton = !!(selectedItem && selectedItem.carton_id);
                                if (wasCarton) {
                                    try { modalContainer.close(); } catch (e2) {}
                                    _this.focusLotInput();
                                }
                                /* ★ 카톤으로 담았으면 그 박스를 출고 표시한다.
                                   서버가 조건부 UPDATE 라 이미 나간 박스면 실패로 돌아온다 —
                                   두 단말이 같은 박스를 동시에 찍어도 한 쪽만 통과한다. */
                                if (selectedItem && selectedItem.carton_id) {
                                    AjaxUtil.postAsyncData(_this.url + '/carton_ship', {
                                        carton_id: selectedItem.carton_id,
                                        shipment_id: shipment_id
                                    }, function (r2) {
                                        if (r2 && r2.success === false) {
                                            Alert.alert('카톤 출고 표시 실패', r2.message || '');
                                        }
                                    });
                                }
                                if (!wasCarton) fnLotSearch();   // 닫은 팝업을 다시 조회하지 않는다

                                _this.showShipmentList(() => {
                                    const lastId = _this.lastSelectedShipmentId;
                                    if (!lastId) return;

                                    const view = _this.shipmentListGrid.collectionView;
                                    if (!view || !view.items || view.items.length === 0) return;

                                    const index = view.items.findIndex(item => String(item.shipment_id) === String(lastId));
                                    if (index < 0) return;

                                    console.log(`이전 선택 행 복원 시도: ${index}`);

                                    // ✅ 렌더 완료 후 DOM 탐색 (살짝 딜레이)
                                    setTimeout(() => {
                                        const grid = _this.shipmentListGrid;
                                        const view = grid.collectionView;

                                        if (!view || !view.items || view.items.length === 0) return;

                                        const index = view.items.findIndex(
                                            item => String(item.shipment_id) === String(_this.lastSelectedShipmentId)
                                        );
                                        if (index < 0) return;

                                        console.log(`이전 선택 행 복원: ${index}`);

                                        // 🔹 이벤트 일시 중단 (selectionChanged나 클릭 핸들러가 반응하지 않게)
                                        const clickHandlers = grid.hostElement.onclick;
                                        grid.hostElement.onclick = null;

                                        const selHandlers = grid.selectionChanged._handlers ? [...grid.selectionChanged._handlers] : [];
                                        grid.selectionChanged._handlers = [];

                                        // 🔹 UI 업데이트 최소화
                                        grid.deferUpdate(() => {
                                            grid.select(index, 0);
                                            grid.scrollIntoView(index, 0);
                                        });

                                        // 🔹 로직 직접 실행 (클릭 없이)
                                        const selectedRowData = view.items[index];
                                        _this.lastSelectedShipmentId = selectedRowData.shipment_id;
                                        _this.showMatLotConsumeList();

                                        // 🔹 이벤트 복구
                                        grid.selectionChanged._handlers = selHandlers;
                                        grid.hostElement.onclick = clickHandlers;

                                        console.log('이전 선택 행 완전 복원 완료:', selectedRowData);
                                    }, 0);
                                });
                            } else {
                                Alert.alert('', result.message);
                            }
                        };

                        AjaxUtil.postAsyncData(url, data, fnsuccess);
                    };

                    Alert.confirm('LOT 지정', '저장 하시겠습니까?', fnOkCallback);
                });
                $btnLotRefresh.click(function (e) {
                    fnLotSearch();
                })
                return;

            }

            deleteMatLotConsume(selectedLotItems) {
                let _this = this;
                let headerItems = this.shipmentHeaderGrid.selectedItems;
                let shipmentItems = this.shipmentListGrid.selectedItems;

                if (headerItems.length === 0 || headerItems === undefined || headerItems === null) {
                    Alert.alert('', '출하정보를 선택해주세요.');
                    return;
                }
                if (shipmentItems.length === 0 || shipmentItems === undefined || shipmentItems === null) {
                    Alert.alert('', '출하상세정보를 선택해주세요.');
                    return;
                }

                let sh_id = headerItems[0].id;
                let shipment_id = shipmentItems[0].shipment_id;

                let items = [];
                $.each(selectedLotItems, function (idx, item) {
                    items.push(item.mlc_id);
                });
                let strData = JSON.stringify(items);
                let data = {
                    sh_id: sh_id,
                    shipment_id: shipment_id,
                    Q: strData
                };
                const selectedRow = _this.shipmentListGrid.selection.row >= 0
                    ? _this.shipmentListGrid.rows[_this.shipmentListGrid.selection.row].dataItem :
                    null;
                const selectedId = selectedRow ? selectedRow.shipment_id : null;

                let fnSuccess = function (res) {
                    if (res.success) {
                        AjaxUtil.hideLoading();

                        Notify.success("LOT지정 취소 완료.");
                        _this.showShipmentList(() => {
                            const lastId = _this.lastSelectedShipmentId;
                            if (!lastId) return;

                            const view = _this.shipmentListGrid.collectionView;
                            if (!view || !view.items || view.items.length === 0) return;

                            const index = view.items.findIndex(item => String(item.shipment_id) === String(lastId));
                            if (index < 0) return;

                            console.log(`이전 선택 행 복원 시도: ${index}`);

                            // ✅ 렌더 완료 후 DOM 탐색 (살짝 딜레이)
                            setTimeout(() => {
                                const grid = _this.shipmentListGrid;
                                const view = grid.collectionView;

                                if (!view || !view.items || view.items.length === 0) return;

                                const index = view.items.findIndex(
                                    item => String(item.shipment_id) === String(_this.lastSelectedShipmentId)
                                );
                                if (index < 0) return;

                                console.log(`이전 선택 행 복원: ${index}`);

                                // 🔹 이벤트 일시 중단 (selectionChanged나 클릭 핸들러가 반응하지 않게)
                                const clickHandlers = grid.hostElement.onclick;
                                grid.hostElement.onclick = null;

                                const selHandlers = grid.selectionChanged._handlers ? [...grid.selectionChanged._handlers] : [];
                                grid.selectionChanged._handlers = [];

                                // 🔹 UI 업데이트 최소화
                                grid.deferUpdate(() => {
                                    grid.select(index, 0);
                                    grid.scrollIntoView(index, 0);
                                });

                                // 🔹 로직 직접 실행 (클릭 없이)
                                const selectedRowData = view.items[index];
                                _this.lastSelectedShipmentId = selectedRowData.shipment_id;
                                _this.showMatLotConsumeList();

                                // 🔹 이벤트 복구
                                grid.selectionChanged._handlers = selHandlers;
                                grid.hostElement.onclick = clickHandlers;

                                console.log('이전 선택 행 완전 복원 완료:', selectedRowData);
                            }, 200);


                        });

                        if (shipment_id != null) {
                            _this.shipmentListGrid.select(shipmentItems[0].__index);
                        }
                        _this.showMatLotConsumeList();

                    } else {
                        Alert.alert('', res.message);//Notify.success("LOT지정 취소 실패.");
                    }
                }
                let url = this.url + '/delete_mal_lot_consume';
                AjaxUtil.postAsyncData(url, data, fnSuccess);

                return;
            }

            //출고처리
            shipmentStateComplete(head_item) {
                let _this = this;
                let data = {sh_id: head_item.id, description: head_item.description};
                let url = this.url + '/shipment_status_complete';
                let fnSuccess = function (result) {
                    if (result.success) {
                        _this.searchDataBind();
                        Notify.success("출고 처리 완료.");
                    } else {
                        if (result.message != '') {
                            Alert.alert('', result.message);
                        } else {
                            Notify.success("출고 처리 실패.");
                        }
                    }
                }
                AjaxUtil.postAsyncData(url, data, fnSuccess);
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            const keywordInput = document.getElementById("keyword");

            keywordInput.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    event.preventDefault(); // 기본 동작 방지
                    page.searchMain();
                }
            });
        });


        let page = null;

        $(document).ready(function (e) {
            page = new ShipmentProcessPage();

            $('#srchStartDt').val(CommonUtil.getYYYYMMDD(-7));
            $('#srchEndDt').val(CommonUtil.getYYYYMMDD());

            $('#btnListCollapse').click(function (e) {
                $('#divList').toggle(300);
            });

            // 검색
            $('#btnSearch').click(function (e) {
                page.searchDataBind();
            });

            $('#searchForm').on('keydown', function (e) {
                if (e.key === 'Enter') {
                    page.searchDataBind();
                }
            })

            page.searchDataBind();
        })
    </script>

</th:block>
</html>
