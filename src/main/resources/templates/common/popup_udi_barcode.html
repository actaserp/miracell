<th:block th:fragment="popup_udi_barcode">
<script type="text/x-tmpl" id="udiBarcodeSearchTemplate">
    <div class="content_wrap popup" id="udiBarcodePopup">
        <section class="section" style="padding-top: 10px;">
            <div class="section-top">
                <div class="search-wrap" style="text-align: left;">
                    <dl>
                        <dt><label for="udiBcSrchStart">출고일</label></dt>
                        <dd>
                            <div class="srch-box">
                                <input type="date" id="udiBcSrchStart" name="udiBcSrchStart"/>
                                <span class="slow_sign">~</span>
                                <input type="date" id="udiBcSrchEnd" name="udiBcSrchEnd"/>
                            </div>
                        </dd>
                    </dl>
                    <dl>
                        <dt><label for="udiBcKeyword">바코드/품목/LOT</label></dt>
                        <dd>
                            <div class="srch-box">
                                <input class="form-control2" type="text" id="udiBcKeyword" name="udiBcKeyword"/>
                            </div>
                        </dd>
                    </dl>
                    <dl>
                        <dt>&nbsp;</dt>
                        <dd>
                            <li>
                                <a class="btn btn-delete" title="검색" id="btnUdiBcSearch">
                                    <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">검색
                                </a>
                            </li>
                        </dd>
                    </dl>
                </div>
                <div class="container-fluid">
                    <div id="udi-barcode-grid" style="height: 320px;"></div>
                </div>
            </div>
        </section>

        <div class="popup-button">
            <button type="button" class="btn-popup" id="btnUdiBcSelect"><span data-commonCd="선택">선택</span></button>
            <button type="button" class="btn-popup" id="modal-close-button"><span data-commonCd="닫기">닫기</span></button>
        </div>
    </div>
</script>

<script type="text/javascript">

    class PopupUdiBarcodePage {
        constructor() {
            this.grid = null;
            this.viewData = new wijmo.collections.CollectionView();
            this.callback = null;
            this.modalContainer = new PopupDraggable('UDI 바코드 매칭 조회');
        }

        searchDataBind() {
            // 포장공정에서 pack_label 에 매핑된 바코드 + 실제 출고건을 조회한다.
            // 한 행 = 한 출고건(국가별 완제품 로트 단위). 출고된 것만 나온다.
            let data = {
                date_from: ($('#udiBcSrchStart').val() || '').replaceAll('-', ''),
                date_to: ($('#udiBcSrchEnd').val() || '').replaceAll('-', ''),
                keyword: $('#udiBcKeyword').val() || ''
            };
            let result = AjaxUtil.getSyncData('/api/popup/search_udi_barcode', data);
            this.viewData.sourceCollection = (result && result.data) ? result.data : [];
        }

        selectData(item) {
            if (typeof this.callback !== 'undefined' && this.callback != null) {
                this.callback(item);
            }
            this.close();
        }

        show(callback) {
            let _this = this;
            this.callback = callback;

            let content = tmpl('udiBarcodeSearchTemplate', {});
            let $content = $(content);
            this.modalContainer.open({ width: 900, height: 540, $content });

            this.grid = new wijmo.grid.FlexGrid('#udi-barcode-grid', {
                selectionMode: wijmo.grid.SelectionMode.Row,
                autoGenerateColumns: false,
                showMarquee: true,
                isReadOnly: true,
                formatItem: (s, e) => {
                    if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
                        e.cell.style.textAlign = 'center';
                    }
                },
                columns: [
                    {binding: 'own_barcode',   header: '자체바코드', width: 130, align: 'left'},
                    {binding: 'udi_di_code',   header: 'UDI-DI',   width: 130, align: 'left'},
                    {binding: 'material_name', header: '품목명',    width: 160, align: 'left'},
                    {binding: 'lot_no',        header: 'LOT',      width: 100, align: 'center'},
                    {binding: 'manuf_ym',      header: '제조연월',  width: 80,  align: 'center'},
                    {binding: 'use_tmlmt',     header: '사용기한',  width: 80,  align: 'center'},
                    {binding: 'supply_date',   header: '출고일',    width: 90,  align: 'center'},
                    {binding: 'company_name',  header: '거래처',    width: 120, align: 'left'},
                    {binding: 'supply_qty',    header: '수량',      width: 70,  align: 'right'},
                ],
                itemsSource: this.viewData,
            });
            this.grid.rowHeaders.columns.splice(0, 1);
            new FlexGridContextMenu(this.grid);
            this.grid.downloadFileName = 'UDI 바코드 매칭';

            $content.find('#btnUdiBcSearch').click(function () {
                _this.searchDataBind();
            });

            $content.find('#btnUdiBcSelect').click(function () {
                let items = _this.grid.selectedItems;
                if (items.length === 0) { Alert.alert('', '선택된 바코드가 없습니다.'); return false; }
                _this.selectData(items[0]);
            });

            this.grid.hostElement.addEventListener('dblclick', function () {
                let items = _this.grid.selectedItems;
                if (items.length === 0) return false;
                _this.selectData(items[0]);
            });

            $content.find('#udiBcKeyword').on('keypress', function (e) {
                if (e.keyCode === 13) _this.searchDataBind();
            });

            // 기본 검색기간: 최근 1개월
            const now = new Date();
            const before = new Date(now); before.setMonth(before.getMonth() - 1);
            $('#udiBcSrchStart').val(CommonUtil.formatYYYYMMDD(before));
            $('#udiBcSrchEnd').val(CommonUtil.formatYYYYMMDD(now));

            this.searchDataBind();
        }

        close() {
            this.modalContainer.close();
        }
    }
</script>
</th:block>
